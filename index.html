<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSC MOCK – Free SSC Mock Tests</title>
  
  <!-- SEO ke liye sahi canonical -->
  <link rel="canonical" href="https://sscmock.online/">
  
  <!-- Redirect 0 sec me new.html pe, par stay param check karega -->
  <script>
    // Agar URL me ?stay=1 hai to redirect mat karo
    const params = new URLSearchParams(window.location.search);
    if (params.get('stay') !== '1') {
      window.location.replace('/new.html' + window.location.search);
    }
  </script>
</head>
<body>
  <p>Redirecting to <a href="/new.html">SSC MOCK</a>...</p>
  <p>Agar redirect na ho to <a href="/new.html?stay=1">yahan click karo</a></p>
</body>
</html>

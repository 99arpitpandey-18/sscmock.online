<html lang="en">
<head>

<title>NIELIT O Level M4 IoT MCQ Mock Tests</title>

<style>
*{

    padding:0;
}

body{

    color:#172033;
    line-height:1.6;
}

/* ================= HEADER ================= */

.header{
    background:linear-gradient(135deg,#0f172a,#172554,#164e63);

    padding:14px 12px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 4px 18px rgba(0,0,0,.20);
}

.header h1{
    color:#67e8f9;
    font-size:22px;
    line-height:1.3;
}

.header h2{
    font-size:14px;
    margin-top:3px;
    color:#fff;
    font-weight:600;
}

.header p{
    color:#cbd5e1;
    font-size:12px;
    margin-top:2px;
}

/* ================= CONTAINER ================= */

.container{
    max-width:1050px;
    margin:auto;
    padding:25px 15px 60px;
}

.menu-title{
    text-align:center;
    margin-bottom:5px;
    color:#172554;
    font-size:24px;
}

.subtitle{
    text-align:center;
    color:#64748b;
    margin-bottom:22px;
}

/* ================= TEST GRID ================= */

.test-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(230px,1fr));
    gap:18px;
}

.test-card{
    position:relative;
    background:rgba(255,255,255,.95);
    border:1px solid #dbeafe;
    border-radius:18px;
    padding:22px 18px;
    text-align:center;
    box-shadow:0 7px 22px rgba(15,23,42,.08);
    transition:.3s;
    overflow:hidden;
}

.test-card:before{
    content:"";
    position:absolute;
    width:90px;
    height:90px;
    background:#67e8f9;
    opacity:.12;
    border-radius:50%;
    top:-30px;
    right:-30px;
}

.test-card:hover{
    transform:translateY(-6px);
    border-color:#06b6d4;
    box-shadow:0 14px 30px rgba(6,182,212,.18);
}

.test-number{
    font-size:38px;
    font-weight:900;
    color:#06b6d4;
}

.test-card h3{
    color:#1d4ed8;
    font-size:20px;
    margin-bottom:5px;
}

.test-card p{
    color:#64748b;
    font-size:14px;
}

/* ================= BUTTON ================= */

.module-btn{
    margin-top:13px;
    background:linear-gradient(135deg,#2563eb,#0891b2);
    color:white;
    border:none;
    padding:10px 22px;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.module-btn:hover{
    transform:scale(1.04);
    box-shadow:0 7px 18px rgba(37,99,235,.3);
}

.back-btn{
    background:#475569;
    color:white;
    border:none;
    padding:9px 18px;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:18px;
    font-weight:bold;
}

.back-btn:hover{
    background:#334155;
}

/* ================= INFO ================= */

.info{
    background:white;
    border-left:5px solid #06b6d4;
    padding:15px 18px;
    border-radius:11px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.05);
}

.info strong{
    color:#1d4ed8;
    font-size:18px;
}

.badge{
    display:inline-block;
    padding:4px 11px;
    border-radius:20px;
    background:#fef3c7;
    color:#92400e;
    font-size:11px;
    font-weight:bold;
    margin-top:7px;
}

/* ================= QUESTION ================= */

.question{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
    border:1px solid #e2e8f0;
    box-shadow:0 5px 16px rgba(15,23,42,.06);
}

.question-number{
    display:inline-block;
    background:#e0f2fe;
    color:#0369a1;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:9px;
}

.question-text{
    font-size:16px;
    font-weight:bold;
    color:#172033;
    margin-bottom:13px;
}

.hindi{
    display:block;
    color:#475569;
    font-weight:normal;
    font-size:14px;
    margin-top:4px;
}

.option{
    display:block;
    background:#f8fafc;
    border:1px solid #dbe3ec;
    padding:10px 12px;
    border-radius:8px;
    margin:7px 0;
    cursor:pointer;
    transition:.2s;
    font-size:14px;
}

.option:hover{
    background:#eff6ff;
    border-color:#38bdf8;
    transform:translateX(2px);
}

.option input{
    margin-right:7px;
}

.correct{
    background:#dcfce7!important;
    border-color:#22c55e!important;
    color:#166534;
}

.wrong{
    background:#fee2e2!important;
    border-color:#ef4444!important;
    color:#991b1b;
}

/* ================= EXPLANATION ================= */

.explanation{
    display:none;
    background:#eff6ff;
    border-left:4px solid #2563eb;
    padding:11px;
    border-radius:7px;
    margin-top:11px;
    font-size:13px;
}

/* ================= RESULT ================= */

.submit-area{
    text-align:center;
    margin:28px 0;
}

#submitBtn,
#resetBtn{
    border:none;
    padding:12px 24px;
    border-radius:9px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;

#resetBtn{

.result{

    background:white;
    border:2px solid #22d3ee;
    border-radius:17px;
    padding:22px;
    margin-bottom:22px;
    text-align:center;

    color:#1d4ed8;
}

.score{

    font-weight:900;
    color:#16a34a;
    margin:4px 0;

.progress{
    height:12px;
    background:#e2e8f0;
    border-radius:20px;
    overflow:hidden;
    margin:13px 0;

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(
        90deg,
        #2563eb,
        #06b6d4,

/* =====================================================
   OPTION BALANCING
===================================================== */

function shuffleQuestionOptions(q,index){

    const english=q[0];
    const hindi=q[1];

    const options=q[2].split("|");

    const correct=q[3];

    const correctText=options[correct];

    const others=options.filter(
        (x,i)=>i!==correct
    );

    /*
       Correct answers rotate:

       Q1  = A
       Q2  = B
       Q3  = C
       Q4  = D
       Q5  = A
       ...

       Therefore answers are not always A.
    */

    const desired=index%4;

    const finalOptions=[];

    let otherIndex=0;

    for(let i=0;i<4;i++){

        if(i===desired){

            finalOptions.push(correctText);

        }else{

            finalOptions.push(
                others[otherIndex++]
            );

        }

    }

    return [
        english,
        hindi,
        finalOptions.join("|"),
        desired
    ];
}


const preparedQuestions =
allQuestions.map((q,index)=>{

    return shuffleQuestionOptions(
        q,
        index
    );

});

        )
    );

}

/* =====================================================
   LOAD QUESTIONS
===================================================== */

function loadQuiz(){

    quizContainer.innerHTML="";

    currentQuestions.forEach(
        (q,index)=>{

        const options=
        q[2].split("|");

        const box=
        document.createElement("div");

        box.className="question";

        box.id=
        "question-"+index;

        let html=`

            <div class="question-number">

                Question
                ${index+1}
                /
                ${currentQuestions.length}

            </div>

            <div class="question-text">

                ${q[0]}

                <span class="hindi">

                    ${q[1]}

                </span>

            </div>

        `;


        options.forEach(
            (option,i)=>{

            html+=`

                <label class="option">

                    <input
                        type="radio"
                        name="q${index}"
                        value="${i}"
                    >

                    <b>
                        ${String.fromCharCode(65+i)}.
                    </b>

                    ${option}

                </label>

            `;

        });


        html+=`

            <div
                class="explanation"
                id="exp-${index}"
            >

                <b>
                    ✅ Correct Answer:
                </b>

                ${options[q[3]]}

                <br><br>

                <b>
                    💡 Explanation:
                </b>

                This option is correct according
                to the IoT concept covered
                in this question.

            </div>

        `;


        box.innerHTML=html;

        quizContainer.appendChild(box);

    });

}


/* =====================================================
   SUBMIT TEST
===================================================== */

function submitTest(){

    let score=0;

    let attempted=0;

    currentQuestions.forEach(
        (q,index)=>{

        const selected=
        document.querySelector(
            `input[name="q${index}"]:checked`
        );

        const box=
        document.getElementById(
            "question-"+index
        );

        const options=
        box.querySelectorAll(".option");


        options.forEach(
            (option,i)=>{

            option.classList.remove(
                "correct",
                "wrong"
            );

            if(i===q[3]){

                option.classList.add(
                    "correct"
                );

            }

        });


        if(selected){

            attempted++;

            const value=
            parseInt(
                selected.value
            );


            if(value===q[3]){

                score++;

            }else{

                options[value]
                .classList.add("wrong");

            }

        }


        document.getElementById(
            "exp-"+index
        ).style.display="block";

    });


    const total=
    currentQuestions.length;

    const percentage=
    ((score/total)*100)
    .toFixed(2);


    const result=
    document.getElementById("result");

    result.style.display="block";


    document.getElementById("score")
    .innerText=
    `${score} / ${total}`;


    document.getElementById("attempted")
    .innerHTML=`

        🟢 Attempted: ${attempted}

        &nbsp; | &nbsp;

        ⚪ Unattempted:
        ${total-attempted}

        &nbsp; | &nbsp;

        🔴 Wrong:
        ${attempted-score}

    `;


    document.getElementById(
        "progressBar"
    ).style.width=
    percentage+"%";


    let message="";


    if(percentage>=90){

        message=
        "🏆 Excellent! M4 preparation is very strong.";

    }

    else if(percentage>=75){

        message=
        "🔥 Very Good! Keep practicing.";

    }

    else if(percentage>=60){

        message=
        "👍 Good attempt. Revise weak topics.";

    }

    else{

        message=
        "📚 More revision and practice required.";

    }


    document.getElementById(
        "resultText"
    ).innerText=
    `Percentage: ${percentage}% — ${message}`;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   RESET TEST
===================================================== */

function resetTest(){

    if(
        !confirm(
            "Reset this test?"
        )
    ){

        return;

    }


    document
    .querySelectorAll(
        'input[type="radio"]'
    )
    .forEach(
        input=>{

        input.checked=false;

    });


    document
    .querySelectorAll(".option")
    .forEach(
        option=>{

        option.classList.remove(
            "correct",
            "wrong"
        );

    });


    document
    .querySelectorAll(".explanation")
    .forEach(
        exp=>{

        exp.style.display="none";

    });


    document.getElementById(
        "result"
    ).style.display="none";


    document.getElementById(
        "progressBar"
    ).style.width="0%";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

<style>
*{

    padding:0;
}

body{

    background:#f4f7fb;
    color:#172033;
    line-height:1.6;
}

/* ================= HEADER ================= */

.header{
    background:#111827;
    color:white;
    padding:20px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.header h1{
    font-size:25px;
    color:#36dfff;
}

.header p{
    margin-top:5px;
    color:#cbd5e1;
    font-size:14px;
}

/* ================= CONTAINER ================= */

.container{
    max-width:1000px;
    margin:auto;
    padding:25px 15px 60px;
}

/* ================= TEST MENU ================= */

#testMenu{
    display:block;
}

#testMenu h2{
    text-align:center;
    margin-bottom:20px;
    color:#1e293b;
}

.test-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:10px;
}

.test-card{
    background:white;
    border-radius:16px;
    padding:25px 20px;
    text-align:center;
    border:2px solid #e2e8f0;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 4px 12px rgba(0,0,0,.05);
}

.test-card:hover{
    border-color:#36dfff;
    transform:translateY(-5px);
    box-shadow:0 8px 25px rgba(0,0,0,.1);
}

.test-card h3{
    font-size:22px;
    color:#2563eb;
    margin-bottom:8px;
}

.test-card p{
    color:#475569;
    margin:5px 0;
}

.module-btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 25px;
    border-radius:30px;
    font-weight:bold;
    font-size:14px;
    margin-top:15px;
    cursor:pointer;
    transition:.2s;
}

.module-btn:hover{
    background:#1d4ed8;
}

/* ================= BACK BUTTON ================= */

.back-btn{
    background:#64748b;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:20px;
}

.back-btn:hover{
    background:#475569;
}

/* ================= INFO ================= */

.info{
    background:white;
    padding:18px;
    border-radius:12px;
    margin-bottom:20px;
    border:1px solid #e2e8f0;
}

.info strong{
    color:#2563eb;
}

/* ================= QUESTIONS ================= */

.question{
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:18px;
    border:1px solid #e2e8f0;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.question-number{
    color:#2563eb;
    font-weight:bold;
    font-size:14px;
    margin-bottom:8px;
}

.question-text{
    font-size:16px;
    font-weight:bold;
    margin-bottom:15px;
}

.hindi{
    display:block;
    color:#475569;
    font-weight:normal;
    margin-top:5px;
    font-size:14px;
}

.option{
    display:block;
    padding:11px 13px;
    margin:8px 0;
    background:#f8fafc;
    border:1px solid #dbe3ec;
    border-radius:8px;
    cursor:pointer;
    transition:.2s;
}

.option:hover{
    background:#eef7ff;
    border-color:#36dfff;
}

.option input{
    margin-right:8px;
}

.correct{
    background:#dcfce7 !important;
    border-color:#22c55e !important;
}

.wrong{
    background:#fee2e2 !important;
    border-color:#ef4444 !important;
}

.explanation{
    display:none;
    margin-top:12px;
    padding:12px;
    background:#eff6ff;
    border-left:4px solid #2563eb;
    border-radius:6px;
    font-size:13px;
}

/* ================= BUTTONS ================= */

.submit-area{
    text-align:center;
    margin:30px 0;
}

button{
    border:none;
    padding:13px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

#submitBtn{
    background:#2563eb;
    color:white;
}

#submitBtn:hover{
    background:#1d4ed8;
}

#resetBtn{
    background:#64748b;
    color:white;
    margin-left:8px;
}

/* ================= RESULT ================= */

.result{
    display:none;
    background:white;
    border-radius:14px;
    padding:25px;
    margin-bottom:25px;
    text-align:center;
    border:2px solid #36dfff;
}

.result h2{
    color:#2563eb;
    margin-bottom:10px;
}

.score{
    font-size:30px;
    font-weight:bold;
    color:#16a34a;
}

.progress{
    height:12px;
    background:#e2e8f0;
    border-radius:20px;
    overflow:hidden;
    margin:15px 0;
}

.progress-bar{
    height:100%;
    background:#2563eb;
    width:0%;
}

#quizForm{
    display:none;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .header h1{
        font-size:20px;
    }

    .container{
        padding:15px 10px;
    }

    .question{
        padding:15px;
    }

    .question-text{
        font-size:15px;
    }

    .option{
        font-size:14px;
    }

    .test-grid{
        grid-template-columns:1fr;
    }
}
</style>

/* ============================================================
   TEST SETTINGS
============================================================ */

const TEST_COUNT = 10;
const QUESTIONS_PER_TEST = 50;

let currentTest = 0;
let currentQuestions = [];


/* ============================================================
   SHUFFLE
============================================================ */

function shuffle(array){

    const arr = [...array];

    for(let i = arr.length - 1; i > 0; i--){

        const j = Math.floor(Math.random() * (i + 1));

        [arr[i],arr[j]] = [arr[j],arr[i]];
    }

    return arr;
}


/* ============================================================
   CREATE TEST MENU
============================================================ */

function createTestMenu(){

    const grid = document.getElementById("testGrid");

    grid.innerHTML = "";

    for(let i = 1; i <= TEST_COUNT; i++){

        const card = document.createElement("div");

        card.className = "test-card";

        card.innerHTML = `

            <h3>🌐 M2 Test ${i}</h3>

            <p>
                Web Designing & Publishing
            </p>

            <p>
                📝 50 Bilingual MCQs
            </p>

            <p>
                HTML • CSS • JS • Web
            </p>

            <button class="module-btn">
                Start Test →
            </button>
        `;

        card.onclick = () => startTest(i);

        grid.appendChild(card);
    }
}


/* ============================================================
   START TEST
============================================================ */

function startTest(testNumber){

    currentTest = testNumber;

    document.getElementById("testMenu").style.display = "none";

    document.getElementById("quizForm").style.display = "block";

    document.getElementById("result").style.display = "none";

    document.getElementById("testTitle").textContent =
        `M2 Web Designing & Publishing — Test ${testNumber}`;

    document.getElementById("testRange").textContent =
        `Questions 1 to ${QUESTIONS_PER_TEST}`;

    /*
       Randomly select 50 questions.
       Questions are shuffled so every test can have
       a different practice combination.
    */

    currentQuestions =
        shuffle(allQuestions).slice(0,QUESTIONS_PER_TEST);

    renderQuiz();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* ============================================================
   RENDER QUIZ
============================================================ */

function renderQuiz(){

    const quiz = document.getElementById("quiz");

    quiz.innerHTML = "";

    currentQuestions.forEach((q,index)=>{

        const question = document.createElement("div");

        question.className = "question";

        let optionsHTML = "";

        q[2].forEach((option,optIndex)=>{

            optionsHTML += `

                <label class="option"
                       data-question="${index}"
                       data-option="${optIndex}">

                    <input
                        type="radio"
                        name="question${index}"
                        value="${optIndex}">

                    <strong>
                        ${String.fromCharCode(65 + optIndex)}.
                    </strong>

                    ${escapeHTML(option)}

                </label>
            `;
        });


        question.innerHTML = `

            <div class="question-number">
                Question ${index + 1}
            </div>

            <div class="question-text">

                ${escapeHTML(q[0])}

                <span class="hindi">
                    ${escapeHTML(q[1])}
                </span>

            </div>

            <div>
                ${optionsHTML}
            </div>

            <div
                class="explanation"
                id="explanation${index}">

                <strong>💡 Explanation:</strong>

                Correct Answer:
                ${escapeHTML(q[2][q[3]])}

            </div>
        `;

        quiz.appendChild(question);
    });
}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ============================================================
   SUBMIT TEST
============================================================ */

function submitTest(){

    let score = 0;

    let attempted = 0;


    currentQuestions.forEach((q,index)=>{

        const selected =
            document.querySelector(
                `input[name="question${index}"]:checked`
            );


        const options =
            document.querySelectorAll(
                `[data-question="${index}"]`
            );


        options.forEach(option=>{

            option.classList.remove(
                "correct",
                "wrong"
            );

        });


        if(selected){

            attempted++;

            const selectedValue =
                Number(selected.value);


            if(selectedValue === q[3]){

                score++;

            }


            options.forEach(option=>{

                const optionValue =
                    Number(option.dataset.option);


                if(optionValue === q[3]){

                    option.classList.add("correct");

                }


                if(
                    optionValue === selectedValue &&
                    selectedValue !== q[3]
                ){

                    option.classList.add("wrong");

                }

            });

        }
        else{

            options.forEach(option=>{

                if(
                    Number(option.dataset.option)
                    === q[3]
                ){

                    option.classList.add("correct");

                }

            });

        }


        document.getElementById(
            `explanation${index}`
        ).style.display = "block";

    });


    const percentage =
        Math.round(
            (score / currentQuestions.length) * 100
        );


    document.getElementById("score").textContent =
        `${score} / ${currentQuestions.length}`;


    document.getElementById("resultText").textContent =
        `You scored ${percentage}% in M2 Test ${currentTest}.`;


    document.getElementById("attempted").textContent =
        `Attempted: ${attempted} | Unattempted: ${currentQuestions.length - attempted}`;


    document.getElementById("progressBar").style.width =
        percentage + "%";


    document.getElementById("result").style.display =
        "block";


    document.getElementById("result").scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

}


/* ============================================================
   RESET TEST
============================================================ */

function resetTest(){

    startTest(currentTest);

}


/* ============================================================
   BACK TO MENU
============================================================ */

function showMenu(){

    document.getElementById("quizForm").style.display =
        "none";

    document.getElementById("testMenu").style.display =
        "block";

    document.getElementById("quiz").innerHTML = "";

    document.getElementById("result").style.display =
        "none";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ============================================================
   INITIALIZE
============================================================ */

createTestMenu();

</script>

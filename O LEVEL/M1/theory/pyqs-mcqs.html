        }

            padding: 10px 25px;

            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .module-btn:hover {
            background: #1d4ed8;
        }
        .back-btn {
            background: #64748b;
            color: white;
            border: none;

        }

            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }
        .info strong {
            color: #2563eb;
        }
        .question {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 18px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 3px 12px rgba(0, 0, 0, .05);
        }
        .question-number {
            color: #2563eb;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .question-text {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .hindi {
            display: block;
            color: #475569;
            font-weight: normal;
            margin-top: 5px;
            font-size: 14px;
        }
        .option {
            display: block;
            padding: 11px 13px;
            margin: 8px 0;
            background: #f8fafc;
            border: 1px solid #dbe3ec;
            border-radius: 8px;
            cursor: pointer;
            transition: .2s;

        .option:hover {
            background: #eef7ff;
            border-color: #36dfff;
        }
        .option input {

        }
        .correct {
            background: #dcfce7 !important;
            border-color: #22c55e !important;
        }

            background: #fee2e2 !important;
            border-color: #ef4444 !important;
        }

            display: none;
            margin-top: 12px;
            padding: 12px;
            background: #eff6ff;
            border-left: 4px solid #2563eb;
            border-radius: 6px;
            font-size: 13px;
        }
        .submit-area {
            text-align: center;
            margin: 30px 0;
        }

            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            cursor: pointer;

            font-weight: bold;

            background: #2563eb;
            color: white;
        }

            background: #1d4ed8;
        }
        #resetBtn {
            background: #64748b;
            color: white;
            margin-left: 8px;
        }

            display: none;
            background: white;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: center;
            border: 2px solid #36dfff;
        }
        .result h2 {
            color: #2563eb;
            margin-bottom: 10px;
        }
        .score {
            font-size: 30px;
            font-weight: bold;
            color: #16a34a;
        }
        .progress {
            height: 12px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-bar {
            height: 100%;
            background: #2563eb;
            width: 0%;

            display: none;

        // ============================================================
        // SPLIT INTO 10 TESTS (30 Questions Each)
        // ============================================================
        const TESTS = [];
        for (let i = 0; i < allQuestions.length; i += 30) {
            TESTS.push(allQuestions.slice(i, i + 30));
        }

        // ============================================================
        // STATE & DOM
        // ============================================================
        let currentTestIndex = -1;
        let currentQuestions = [];
        const testMenu = document.getElementById('testMenu');
        const testGrid = document.getElementById('testGrid');
        const quizForm = document.getElementById('quizForm');
        const quizContainer = document.getElementById('quiz');
        const testTitle = document.getElementById('testTitle');
        const testRange = document.getElementById('testRange');

        // ============================================================
        // RENDER MENU
        // ============================================================
        function renderMenu() {
            testGrid.innerHTML = '';
            TESTS.forEach((test, idx) => {
                const start = idx * 30 + 1;
                const end = Math.min((idx + 1) * 30, allQuestions.length);
                const card = document.createElement('div');
                card.className = 'test-card';
                card.innerHTML = `
                    <h3>📝 Test ${idx + 1}</h3>
                    <p>Questions ${start} - ${end}</p>
                    <p style="font-size:13px; color:#2563eb; font-weight:bold;">${test.length} Questions</p>
                    <button class="module-btn" onclick="startTest(${idx})">🚀 Start Test →</button>
                `;
                testGrid.appendChild(card);
            });
            testMenu.style.display = 'block';
            quizForm.style.display = 'none';
        }

        // ============================================================
        // START TEST
        // ============================================================
        function startTest(index) {
            currentTestIndex = index;
            currentQuestions = TESTS[index];
            const start = index * 30 + 1;
            const end = Math.min((index + 1) * 30, allQuestions.length);
            testTitle.innerText = `📖 Test ${index + 1}`;
            testRange.innerText = `Questions ${start} to ${end} (Total: ${currentQuestions.length} Questions)`;
            testMenu.style.display = 'none';
            quizForm.style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('progressBar').style.width = '0%';
            loadQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        // BACK TO MENU
        // ============================================================
        function showMenu() {
            quizForm.style.display = 'none';
            testMenu.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        // LOAD QUIZ
        // ============================================================
        function loadQuiz() {
            quizContainer.innerHTML = '';
            currentQuestions.forEach((q, index) => {
                const opts = q[2].split('|');
                const qBox = document.createElement('div');
                qBox.className = 'question';
                qBox.id = 'question-' + index;
                let html = `
                    <div class="question-number">Question ${index+1} / ${currentQuestions.length}</div>
                    <div class="question-text">${q[0]}<span class="hindi">${q[1]}</span></div>
                `;
                opts.forEach((opt, i) => {
                    html += `
                        <label class="option">
                            <input type="radio" name="q${index}" value="${i}">
                            <b>${String.fromCharCode(65+i)}.</b> ${opt}
                        </label>
                    `;
                });
                html += `
                    <div class="explanation" id="exp-${index}">
                        <b>Correct Answer:</b> ${opts[q[3]]}
                    </div>
                `;
                qBox.innerHTML = html;
                quizContainer.appendChild(qBox);
            });
        }

        // ============================================================
        // SUBMIT TEST
        // ============================================================
        function submitTest() {
            let score = 0, attempted = 0;
            currentQuestions.forEach((q, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                const box = document.getElementById('question-' + index);
                const options = box.querySelectorAll('.option');
                options.forEach((opt, i) => {
                    opt.classList.remove('correct', 'wrong');
                    if (i === q[3]) opt.classList.add('correct');
                });
                if (selected) {
                    attempted++;
                    const val = parseInt(selected.value);
                    if (val === q[3]) score++;
                    else options[val].classList.add('wrong');
                }
                document.getElementById('exp-' + index).style.display = 'block';
            });
            const total = currentQuestions.length;
            const pct = ((score / total) * 100).toFixed(2);
            const res = document.getElementById('result');
            res.style.display = 'block';
            document.getElementById('score').innerText = `${score} / ${total}`;
            document.getElementById('resultText').innerText = `Percentage: ${pct}%`;
            document.getElementById('attempted').innerHTML =
                `✅ Attempted: ${attempted} | ❌ Unattempted: ${total-attempted} | ⚠️ Wrong: ${attempted-score}`;
            document.getElementById('progressBar').style.width = pct + '%';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        // RESET TEST
        // ============================================================
        function resetTest() {
            if (!confirm('Reset this test?')) return;
            document.querySelectorAll('input[type="radio"]').forEach(inp => inp.checked = false);
            document.querySelectorAll('.option').forEach(opt => opt.classList.remove('correct', 'wrong'));
            document.querySelectorAll('.explanation').forEach(exp => exp.style.display = 'none');
            document.getElementById('result').style.display = 'none';
            document.getElementById('progressBar').style.width = '0%';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        // INIT
        // ============================================================
        renderMenu();
    </script>

</body>
</html>

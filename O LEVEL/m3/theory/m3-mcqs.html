*{

}

/* ================= HEADER ================= */

.header{
    background:#111827;

}

.header h1{

    color:#36dfff;
}

.header p{
    margin-top:5px;
    color:#cbd5e1;
    font-size:14px;
}

/* ================= CONTAINER ================= */

.container{
    max-width:1100px;
    margin:auto;

}

/* ================= MENU ================= */

}

.menu-subtitle{

    color:#64748b;
    margin-bottom:25px;
}

.test-grid{
    display:grid;
    grid-template-columns:

    gap:18px;
}

/* ================= TEST CARD ================= */

.test-card{
    background:#fff;
    border-radius:18px;
    padding:24px 18px;
    text-align:center;
    border:2px solid #e2e8f0;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 5px 18px rgba(0,0,0,.06);
    position:relative;
    overflow:hidden;
}

.test-card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:4px;
    background:linear-gradient(
        90deg,
        #2563eb,
        #36dfff,
        #8b5cf6
    );
}

.test-card:hover{
    transform:translateY(-6px);
    border-color:#36dfff;
    box-shadow:0 12px 30px rgba(37,99,235,.14);
}

.test-number{
    width:60px;
    height:60px;
    margin:0 auto 12px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eff6ff;
    color:#2563eb;
    font-weight:900;
    font-size:20px;
}

.test-card h3{
    color:#2563eb;
    margin-bottom:7px;
}

.test-card p{
    color:#64748b;
    font-size:14px;
}

.test-card .questions{

    font-weight:bold;
    margin-top:4px;
}

.module-btn{
    background:#2563eb;
    color:#fff;
    border:none;
    padding:10px 22px;
    border-radius:30px;
    font-weight:700;
    font-size:14px;
    margin-top:15px;

}

.module-btn:hover{
    background:#1d4ed8;

}

/* ================= QUIZ ================= */

#quizForm{
    display:none;
}

.back-btn{
    background:#64748b;
    color:#fff;
    border:none;
    padding:10px 20px;
    border-radius:9px;
    font-weight:700;
    cursor:pointer;
    margin-bottom:18px;

.back-btn:hover{

.info{

    padding:18px;
    border-radius:14px;

    font-size:18px;
}

.question{
    background:#fff;
    border-radius:14px;
    padding:20px;
    margin-bottom:18px;

.question-text{

    font-weight:700;
    margin-bottom:15px;
}

.hindi{
    display:block;
    color:#475569;
    font-size:14px;
    font-weight:400;
    margin-top:6px;
}

.option{
    display:block;
    padding:12px 14px;
    margin:9px 0;
    background:#f8fafc;
    border:1px solid #dbe3ec;
    border-radius:9px;
    cursor:pointer;

.option:hover{
    background:#eef7ff;
    border-color:#36dfff;
}

.option input{
    margin-right:8px;
}

.option b{
    color:#2563eb;
}

/* ================= ANSWER COLORS ================= */

.correct{
    background:#dcfce7 !important;
    border-color:#22c55e !important;
}

.wrong{
    background:#fee2e2 !important;
    border-color:#ef4444 !important;
}

/* ================= EXPLANATION ================= */

.explanation{
    display:none;
    margin-top:12px;
    padding:13px;
    background:#eff6ff;
    border-left:4px solid #2563eb;
    border-radius:7px;
    font-size:13px;

/* ================= RESULT ================= */

.result{

    background:#fff;
    border-radius:16px;
    padding:25px;
    margin-bottom:25px;
    text-align:center;

.score{

    font-weight:900;

.result-message{

    font-weight:700;

.progress{

.progress-bar{

.submit-area{
    text-align:center;
    margin:30px 0;

button{
    border:none;
    padding:13px 25px;
    border-radius:9px;
    cursor:pointer;
    font-size:15px;
    font-weight:700;

#submitBtn{
    background:#2563eb;
    color:#fff;

    background:#1d4ed8;

#resetBtn{
    background:#64748b;
    color:#fff;

.quiz-top{
    display:flex;

    align-items:center;
    gap:10px;

    margin-bottom:15px;

.badge{
    background:#eff6ff;

    font-size:13px;

@media(max-width:600px){

/* ============================================================
   ENSURE ENOUGH QUESTIONS
   We create controlled variations of concepts rather than
   meaningless Define/Explain duplication.
============================================================ */

function buildQuestionBank(){

    let bank = [...QUESTION_BANK];

    const original = [...QUESTION_BANK];

    let variationNumber = 1;

    /*
       The supplied conceptual bank is expanded using
       exam-oriented question forms.
    */

    while(bank.length < 1500){

        original.forEach((q, index)=>{

            if(bank.length >= 1500) return;

            const en = q[0];
            const hi = q[1];
            const opts = [...q[2]];
            const answer = q[3];
            const explanation = q[4];

            const forms = [

                [
                    "Which option is correct regarding: ",
                    "निम्न के संबंध में सही विकल्प कौन-सा है: "
                ],

                [
                    "Choose the correct answer: ",
                    "सही उत्तर चुनिए: "
                ],

                [
                    "In Python, which statement is correct about: ",
                    "Python में निम्न के बारे में कौन-सा कथन सही है: "
                ],

                [
                    "For exam preparation, identify the correct option for: ",
                    "परीक्षा की तैयारी के लिए सही विकल्प पहचानिए: "
                ],

                [
                    "Select the correct Python concept: ",
                    "सही Python concept चुनिए: "
                ],

                [
                    "Which of the following correctly describes: ",
                    "निम्न में से कौन सही रूप से बताता है: "
                ]

            ];

            const form = forms[(variationNumber-1)%forms.length];

            bank.push([
                form[0] + en,
                form[1] + hi,
                opts,
                answer,
                explanation
            ]);

            variationNumber++;

        });

    }

    return bank.slice(0,1500);
}


/* ============================================================
   BUILD EXACTLY 1500 QUESTIONS
============================================================ */

const ALL_QUESTIONS = buildQuestionBank();


/* ============================================================
   CREATE EXACTLY 30 TESTS × 50 QUESTIONS
============================================================ */

const TESTS = [];

for(let i=0;i<30;i++){

    const start = i * 50;

    TESTS.push(
        ALL_QUESTIONS.slice(
            start,
            start + 50
        )
    );

}

        "result"
    ).style.display = "none";

    document.getElementById(
        "progressBar"
    ).style.width = "0%";

    loadQuiz();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* ============================================================
   BACK TO MENU
============================================================ */

function showMenu(){

    quizForm.style.display = "none";

    testMenu.style.display = "block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* ============================================================
   LOAD QUIZ
============================================================ */

function loadQuiz(){

    quizContainer.innerHTML = "";

    currentQuestions.forEach((q,index)=>{

        const box =
            document.createElement("div");

        box.className = "question";

        box.id =
            "question-" + index;


        let html = `

            <div class="question-number">

                Question ${index+1}
                / 50

            </div>

            <div class="question-text">

                ${escapeHTML(q[0])}

                <span class="hindi">

                    ${escapeHTML(q[1])}

                </span>

            </div>

        `;


        q[2].forEach((option,i)=>{

            html += `

                <label class="option">

                    <input
                        type="radio"
                        name="q${index}"
                        value="${i}"
                    >

                    <b>
                        ${String.fromCharCode(65+i)}.
                    </b>

                    ${escapeHTML(option)}

                </label>

            `;

        });


        html += `

            <div
                class="explanation"
                id="exp-${index}">

                <b>
                    ✅ Correct Answer:
                </b>

                ${escapeHTML(q[2][q[3]])}

                <br><br>

                <b>
                    💡 Explanation:
                </b>

                ${escapeHTML(q[4])}

            </div>

        `;


        box.innerHTML = html;

        quizContainer.appendChild(box);

    });

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ============================================================
   SUBMIT TEST
============================================================ */

function submitTest(){

    let score = 0;

    let attempted = 0;


    currentQuestions.forEach((q,index)=>{

        const selected =
            document.querySelector(
                `input[name="q${index}"]:checked`
            );

        const box =
            document.getElementById(
                "question-"+index
            );

        const options =
            box.querySelectorAll(
                ".option"
            );


        options.forEach((option,i)=>{

            option.classList.remove(
                "correct",
                "wrong"
            );

            if(i === q[3]){

                option.classList.add(
                    "correct"
                );

            }

        });


        if(selected){

            attempted++;

            const value =
                parseInt(
                    selected.value
                );


            if(value === q[3]){

                score++;

            }else{

                options[value]
                    .classList.add(
                        "wrong"
                    );

            }

        }


        document.getElementById(
            "exp-"+index
        ).style.display = "block";

    });


    const total =
        currentQuestions.length;

    const percentage =
        (score / total * 100)
        .toFixed(2);


    const result =
        document.getElementById(
            "result"
        );


    result.style.display = "block";


    document.getElementById(
        "score"
    ).innerText =
        `${score} / ${total}`;


    let message = "";


    if(percentage >= 90){

        message =
            "🏆 Excellent! NIELIT O Level level preparation is very strong.";

    }else if(percentage >= 75){

        message =
            "🔥 Very Good! Keep practicing for a higher score.";

    }else if(percentage >= 60){

        message =
            "👍 Good attempt! Revise weak topics.";

    }else{

        message =
            "📚 Keep practicing. Revise the concepts and try again.";

    }


    document.getElementById(
        "resultMessage"
    ).innerText = message;


    document.getElementById(
        "attempted"
    ).innerHTML = `

        ✅ Attempted:
        <b>${attempted}</b>

        &nbsp; | &nbsp;

        ❌ Unattempted:
        <b>${total-attempted}</b>

        &nbsp; | &nbsp;

        ⚠️ Wrong:
        <b>${attempted-score}</b>

    `;


    document.getElementById(
        "progressBar"
    ).style.width =
        percentage + "%";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ============================================================
   RESET
============================================================ */

function resetTest(){

    if(
        !confirm(
            "Reset this test? सभी answers हट जाएंगे."
        )
    ){

        return;

    }


    document
        .querySelectorAll(
            'input[type="radio"]'
        )
        .forEach(
            input =>
                input.checked = false
        );


    document
        .querySelectorAll(
            ".option"
        )
        .forEach(
            option =>
                option.classList.remove(
                    "correct",
                    "wrong"
                )
        );


    document
        .querySelectorAll(
            ".explanation"
        )
        .forEach(
            exp =>
                exp.style.display = "none"
        );


    document.getElementById(
        "result"
    ).style.display = "none";


    document.getElementById(
        "progressBar"
    ).style.width = "0%";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

/*
=========================================================
OPTION BALANCER
=========================================================
All source questions have correct answer at index 0.
This function moves the correct answer across
A/B/C/D positions.
=========================================================
*/

function shuffleQuestionOptions(q,index){

    const english=q[0];
    const hindi=q[1];

    const options=q[2].split("|");

    const correct=q[3];

    const desired=index % 4;

    const correctText=options[correct];

    const others=options.filter((x,i)=>i!==correct);

    const finalOptions=[];

    let otherIndex=0;

    for(let i=0;i<4;i++){

        if(i===desired){

            finalOptions.push(correctText);

        }else{

            finalOptions.push(others[otherIndex++]);

        }

    }

    return [
        english,
        hindi,
        finalOptions.join("|"),
        desired
    ];
}


/*
=========================================================
PREPARE QUESTIONS
=========================================================
*/

const preparedQuestions=
    allQuestions.map((q,i)=>
        shuffleQuestionOptions(q,i)
    );


/*
=========================================================
CREATE 10 TESTS
30 QUESTIONS EACH
=========================================================
*/

const TESTS=[];

for(let i=0;i<10;i++){

    TESTS.push(
        preparedQuestions.slice(
            i*30,
            (i+1)*30
        )
    );

}


/*

DOM ELEMENTS
=========================================================
*/

let currentTestIndex=-1;

let currentQuestions=[];

const testMenu=
    document.getElementById("testMenu");

const testGrid=
    document.getElementById("testGrid");

const quizForm=
    document.getElementById("quizForm");

const quizContainer=
    document.getElementById("quiz");

const testTitle=
    document.getElementById("testTitle");

const testRange=

/*

=========================================================
*/

function renderMenu(){

    testGrid.innerHTML="";

    TESTS.forEach((test,index)=>{

        const card=
            document.createElement("div");

        card.className="test-card";

        card.innerHTML=`

            <div class="test-number">
                ${index+1}
            </div>

            <h3>
                📝 Test ${index+1}
            </h3>

            <p>
                Questions ${index*30+1}
                –
                ${(index+1)*30}
            </p>

            <p>
                <b>30 Bilingual MCQs</b>
            </p>

            <button
                class="module-btn"
                onclick="startTest(${index})">

                🚀 Start Test

            </button>

        `;

        testGrid.appendChild(card);

    });

}


/*
=========================================================
START TEST
=========================================================
*/

function startTest(index){

    currentTestIndex=index;

    currentQuestions=
        TESTS[index];

    testTitle.innerText=
        "📖 M3 Python Mock Test "+(index+1);

    testRange.innerText=
        "Questions "+
        (index*30+1)+
        " to "+
        ((index+1)*30)+
        " | Total: 30 Questions";

    testMenu.style.display="none";

    quizForm.style.display="block";

    document.getElementById("result")
        .style.display="none";

    document.getElementById("progressBar")
        .style.width="0%";

    loadQuiz();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/*
=========================================================
BACK TO MENU
=========================================================
*/

function showMenu(){

    quizForm.style.display="none";

    testMenu.style.display="block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/*
=========================================================
LOAD QUIZ
=========================================================
*/

function loadQuiz(){

    quizContainer.innerHTML="";

    currentQuestions.forEach((q,index)=>{

        const options=
            q[2].split("|");

        const box=
            document.createElement("div");

        box.className="question";

        box.id=
            "question-"+index;

        let html=`

            <div class="question-number">

                Question ${index+1}
                /
                ${currentQuestions.length}

            </div>

            <div class="question-text">

                ${q[0]}

                <span class="hindi">
                    ${q[1]}
                </span>

            </div>

        `;


        options.forEach((option,i)=>{

            html+=`

                <label class="option">

                    <input
                        type="radio"
                        name="q${index}"
                        value="${i}"
                    >

                    <b>
                        ${String.fromCharCode(65+i)}.
                    </b>

                    ${option}

                </label>

            `;

        });


        html+=`

            <div
                class="explanation"
                id="exp-${index}">

                <b>✅ Correct Answer:</b>
                ${options[q[3]]}

                <br><br>

                <b>💡 Explanation:</b>

                This answer is based on the
                Python programming concept tested
                in this question.

            </div>

        `;


        box.innerHTML=html;

        quizContainer.appendChild(box);

    });

}


/*
=========================================================
SUBMIT TEST
=========================================================
*/

function submitTest(){

    let score=0;

    let attempted=0;

    currentQuestions.forEach((q,index)=>{

        const selected=
            document.querySelector(
                `input[name="q${index}"]:checked`
            );

        const box=
            document.getElementById(
                "question-"+index
            );

        const options=
            box.querySelectorAll(".option");


        options.forEach((option,i)=>{

            option.classList.remove(
                "correct",
                "wrong"
            );

            if(i===q[3]){

                option.classList.add("correct");

            }

        });


        if(selected){

            attempted++;

            const value=
                parseInt(selected.value);

            if(value===q[3]){

                score++;

            }else{

                options[value]
                    .classList.add("wrong");

            }

        }


        document
            .getElementById("exp-"+index)
            .style.display="block";

    });


    const total=
        currentQuestions.length;

    const percentage=
        ((score/total)*100).toFixed(2);


    const result=
        document.getElementById("result");

    result.style.display="block";


    document.getElementById("score")
        .innerText=
        `${score} / ${total}`;


    let message="";


    if(percentage>=90){

        message=
            "🏆 Excellent! Your M3 Python preparation is very strong.";

    }else if(percentage>=75){

        message=
            "🔥 Very Good! Keep practicing Python.";

    }else if(percentage>=60){

        message=
            "👍 Good attempt. Revise weak topics.";

    }else{

        message=
            "📚 More revision and practice required.";

    }


    document.getElementById("resultText")
        .innerText=
        `Percentage: ${percentage}% — ${message}`;


    document.getElementById("attempted")
        .innerHTML=`

        🟢 Attempted: ${attempted}

        &nbsp; | &nbsp;

        ⚪ Unattempted:
        ${total-attempted}

        &nbsp; | &nbsp;

        🔴 Wrong:
        ${attempted-score}

        `;


    document.getElementById("progressBar")
        .style.width=
        percentage+"%";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/*
=========================================================
RESET TEST
=========================================================
*/

function resetTest(){

    if(!confirm("Reset this test?"))
        return;


    document
        .querySelectorAll(
            'input[type="radio"]'
        )
        .forEach(input=>{

            input.checked=false;

        });


    document
        .querySelectorAll(".option")
        .forEach(option=>{

            option.classList.remove(
                "correct",
                "wrong"
            );

        });


    document
        .querySelectorAll(".explanation")
        .forEach(exp=>{

            exp.style.display="none";

        });


    document.getElementById("result")
        .style.display="none";


    document.getElementById("progressBar")
        .style.width="0%";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

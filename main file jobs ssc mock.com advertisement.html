<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

/* ===== Compact Header ===== */

.ssc-header{
background:linear-gradient(135deg,#0a4b87,#0c62b5);
padding:8px 18px;
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
}

.brand{
display:flex;
align-items:center;
gap:12px;
}

.brand img{
width:52px;
height:52px;
border-radius:50%;
object-fit:cover;
border:2px solid #ff4d4d;
box-shadow:0 4px 10px rgba(0,0,0,.25);
}

.brand-text h1{
font-size:20px;
font-weight:800;
color:#fff;
line-height:1.1;
}

.brand-text span{
color:#d9e9ff;
}

.brand-text p{
font-size:11px;
color:#d8ebff;
margin-top:2px;
}

.live{
background:rgba(255,255,255,.12);
padding:6px 12px;
border-radius:30px;
color:#fff;
font-size:11px;
font-weight:600;
display:flex;
align-items:center;
gap:7px;
border:1px solid rgba(255,255,255,.15);
}

.dot{
width:8px;
height:8px;
background:#00ff6a;
border-radius:50%;
box-shadow:0 0 8px #00ff6a;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
50%{transform:scale(1.3);}
}

/* ===== Navbar ===== */

.ssc-nav{
background:#e8dfc3;
}

.ssc-nav ul{
display:flex;
align-items:center;
list-style:none;
overflow-x:auto;
white-space:nowrap;
}

.ssc-nav ul::-webkit-scrollbar{
display:none;
}

.ssc-nav li{
flex-shrink:0;
}

.ssc-nav a{
display:flex;
align-items:center;
gap:6px;
padding:13px 16px;
font-size:15px;
font-weight:700;
color:#111;
text-decoration:none;
transition:.25s;
}

.ssc-nav li:first-child a{
background:#e53945;
color:#fff;
}

.ssc-nav a:hover{
background:#0b5ca8;
color:#fff;
}

.search{
margin-left:auto;
}

.search a{
padding:13px 18px;
font-size:17px;
}

/* ===== Responsive ===== */

@media(max-width:900px){

.ssc-header{
padding:8px 12px;
flex-wrap:wrap;
}

.brand img{
width:44px;
height:44px;
}

.brand-text h1{
font-size:17px;
}

.brand-text p{
font-size:10px;
}

.live{
width:100%;
justify-content:center;
font-size:10px;
}

.ssc-nav a{
padding:12px 14px;
font-size:13px;
}

}
</style>

<header class="ssc-header">

<div class="brand">
<img src="ssc-logo.png" alt="Logo">

<div class="brand-text">
<h1>🎓 SSC MOCK <span>.Com</span></h1>
<p>Jobs • Results • Admit Cards • Answer Key</p>
</div>
</div>

<div class="live">
<div class="dot"></div>
Daily Live Updates
</div>

</header>

<nav class="ssc-nav">

<ul>

<li><a href="#"><i class="fa-solid fa-house"></i> Home</a></li>

<li><a href="#"><i class="fa-solid fa-briefcase"></i> Latest Jobs</a></li>

<li><a href="#"><i class="fa-solid fa-id-card"></i> Admit Card</a></li>

<li><a href="#"><i class="fa-solid fa-square-poll-horizontal"></i> Result</a></li>

<li><a href="#"><i class="fa-solid fa-key"></i> Answer Key</a></li>

<li><a href="#"><i class="fa-solid fa-book-open"></i> Syllabus</a></li>

<li><a href="#"><i class="fa-solid fa-user-graduate"></i> Admission</a></li>

<li><a href="#"><i class="fa-solid fa-landmark"></i> Sarkari Yojna</a></li>

<li><a href="#"><i class="fa-solid fa-bell"></i> Upcoming</a></li>

<li class="search">
<a href="#"><i class="fa-solid fa-magnifying-glass"></i></a>
</li>

</ul>

</nav>

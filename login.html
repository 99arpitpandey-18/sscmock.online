    <script>

        /* OPEN LOGIN */

        function openLogin() {

            document
                .getElementById("loginModal")
                .classList.add("show");


            document.body.style.overflow =
                "hidden";

        }



        /* CLOSE LOGIN */

        function closeLogin() {

            document
                .getElementById("loginModal")
                .classList.remove("show");


            document.body.style.overflow =
                "auto";

        }



        /* CLOSE WHEN CLICKING OUTSIDE */

        window.addEventListener(
            "click",
            function(event) {

                const modal =
                    document.getElementById(
                        "loginModal"
                    );


                if (event.target === modal) {

                    closeLogin();

                }

            }
        );



        /* CLOSE WITH ESC KEY */

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {

                    closeLogin();

                }

            }
        );

    </script>

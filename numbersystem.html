<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number System – Basic to CGL (Bilingual)</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f8;
            color: #1a1a2e;
            padding: 20px;
            transition: 0.3s;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .main-header {
            background: linear-gradient(135deg, #1a237e, #0d47a1);
            color: #fff;
            padding: 20px 30px;
            border-radius: 16px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .main-header .title h1 {
            font-size: 28px;
            font-weight: 800;
        }
        .main-header .title h1 span {
            color: #ffd54f;
        }
        .main-header .title p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* ===== LANGUAGE TOGGLE ===== */
        .lang-toggle {
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.15);
            padding: 5px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .lang-toggle button {
            padding: 8px 22px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            background: transparent;
            color: #ccc;
        }
        .lang-toggle button.active {
            background: #ffd54f;
            color: #1a237e;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .lang-toggle button:hover:not(.active) {
            color: #fff;
        }

        /* ===== FORMULA CARD ===== */
        .formula-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px 25px;
            margin-bottom: 28px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            border-left: 5px solid #1a237e;
            transition: 0.2s;
        }
        .formula-card:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.09);
        }
        .formula-card .formula-name {
            font-size: 22px;
            font-weight: 700;
            color: #1a237e;
            margin-bottom: 6px;
        }
        .formula-card .formula-desc {
            font-size: 15px;
            color: #444;
            background: #f5f7fa;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            border-left: 3px solid #ff6f00;
            line-height: 1.7;
        }
        .formula-card .formula-desc code {
            background: #e0e0e0;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* ===== QUESTIONS ===== */
        .question-item {
            background: #fafbfc;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 10px;
            border: 1px solid #e9edf2;
            transition: 0.2s;
        }
        .question-item:hover {
            border-color: #b0c4de;
        }
        .question-item .q-text {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 6px;
        }
        .question-item .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 20px;
            font-size: 14px;
            color: #333;
            margin-bottom: 6px;
        }
        @media (max-width: 600px) {
            .question-item .options {
                grid-template-columns: 1fr;
            }
        }
        .question-item .options span {
            display: inline-block;
        }
        .question-item .answer-btn {
            background: #e8eaf6;
            border: none;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #1a237e;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 4px;
        }
        .question-item .answer-btn:hover {
            background: #1a237e;
            color: #fff;
        }
        .question-item .answer-box {
            display: none;
            margin-top: 8px;
            padding: 10px 16px;
            background: #e8f5e9;
            border-radius: 8px;
            font-size: 14px;
            border-left: 4px solid #2e7d32;
            color: #1b5e20;
            line-height: 1.6;
        }
        .question-item .answer-box.show {
            display: block;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #777;
            font-size: 14px;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }

        @media (max-width: 600px) {
            .main-header { flex-direction: column; align-items: stretch; }
            .lang-toggle { align-self: flex-start; }
            .main-header .title h1 { font-size: 22px; }
            .formula-card { padding: 16px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <header class="main-header">
        <div class="title">
            <h1>🔢 Number System <span>Basic → CGL</span></h1>
            <p id="headerSub">9 Topics • 90 Questions • Bilingual</p>
        </div>
        <div class="lang-toggle" id="langToggle">
            <button class="active" data-lang="en">🇬🇧 English</button>
            <button data-lang="hi">🇮🇳 हिंदी</button>
        </div>
    </header>

    <!-- CONTENT -->
    <div id="content"></div>

    <!-- FOOTER -->
    <div class="footer" id="footerText">
        ⚡ Practice makes perfect. SSC CGL / Banking Level.
    </div>

</div>

<script>
    // ================================================================
    // 1. BILINGUAL DATA (Basic to CGL Level)
    //    Each formula has: name, desc, questions[]
    //    Each question: q, opts[], ans (0-3), exp
    // ================================================================

    const DATA = {
        en: {
            headerSub: '9 Topics • 90 Questions • Bilingual',
            footer: '⚡ Practice makes perfect. SSC CGL / Banking Level.',
            formulas: [
                // ----- 1. DIVISIBILITY RULES (Basic to Advanced) -----
                {
                    name: 'Divisibility Rules (Basic to Advanced)',
                    desc: `• <b>Basic:</b> 2, 3, 4, 5, 6, 8, 9, 10, 11.
                        <br>• <b>Advanced (CGL Level):</b>
                        <br>  → <b>7:</b> Double last digit, subtract from rest. If result divisible by 7.
                        <br>  → <b>13:</b> 4 × last digit, add to rest. If result divisible by 13.
                        <br>  → <b>17:</b> 5 × last digit, subtract from rest. If result divisible by 17.
                        <br>  → <b>19:</b> 2 × last digit, add to rest. If result divisible by 19.
                        <br>  → <b>23:</b> 7 × last digit, add to rest. If result divisible by 23.`,
                    questions: [
                        { q: 'Which number is divisible by 3?', opts: ['2156', '3124', '4785', '6902'], ans: 2,
                        exp: 'Sum: 4+7+8+5 = 24 → divisible by 3.' },
                        { q: 'A number divisible by 6 must be divisible by:', opts: ['2 & 3', '2 & 4', '3 & 4',
                                '2 & 5'
                            ], ans: 0, exp: '6 = 2 × 3.' },
                        { q: 'Which is divisible by 11?', opts: ['121', '131', '141', '151'], ans: 0,
                            exp: '121 → (1+1) - 2 = 0 → divisible by 11.' },
                        { q: 'Is 3472 divisible by 8?', opts: ['Yes', 'No'], ans: 0,
                            exp: 'Last 3 digits = 472. 472 ÷ 8 = 59 → divisible.' },
                        { q: 'Which advanced rule is used for divisibility by 7?', opts: ['Double last, subtract',
                                'Triple last, add', 'Double last, add', 'Triple last, subtract'
                            ], ans: 0, exp: '7 rule: Double last digit, subtract from rest.' },
                        { q: 'Check divisibility of 364 by 13.', opts: ['Divisible', 'Not divisible'], ans: 0,
                            exp: '13 rule: 4×4=16 + 36 = 52. 52 ÷ 13 = 4 → divisible.' },
                        { q: 'Which number is divisible by 19?', opts: ['361', '371', '381', '391'], ans: 0,
                            exp: '19×19=361 → divisible.' },
                        { q: 'Is 221 divisible by 17?', opts: ['Yes', 'No'], ans: 0,
                            exp: '17 rule: 5×1=5, 22-5=17. 17 ÷ 17 = 1 → divisible.' },
                        { q: 'Find the smallest 3-digit number divisible by 7.', opts: ['100', '105', '112', '119'],
                            ans: 1, exp: '105 ÷ 7 = 15.' },
                        { q: 'The sum of digits of a number is 27. It is divisible by:', opts: ['3', '9', '3 & 9',
                                '11'
                            ], ans: 2, exp: '27 divisible by 3 and 9 both.' }
                    ]
                },

                // ----- 2. LCM & HCF (CGL Level) -----
                {
                    name: 'LCM & HCF (Basic to CGL)',
                    desc: `• <b>Basic:</b> LCM×HCF = a×b.
                        <br>• <b>Fractions:</b> LCM = LCM(num)/HCF(den); HCF = HCF(num)/LCM(den).
                        <br>• <b>Co-prime:</b> HCF=1, LCM=product.
                        <br>• <b>Advanced:</b> HCF of (a+b), (a-b) type questions.
                        <br>• HCF of (n^a - 1) and (n^b - 1) = n^(HCF(a,b)) - 1.`,
                    questions: [
                        { q: 'LCM of 12 & 18 is:', opts: ['24', '30', '36', '42'], ans: 2,
                            exp: '12=2²×3, 18=2×3² → LCM=2²×3²=36.' },
                        { q: 'HCF of 24 & 36 is:', opts: ['6', '8', '10', '12'], ans: 3,
                            exp: '24=2³×3, 36=2²×3² → HCF=2²×3=12.' },
                        { q: 'Product = 180, HCF = 6. Find LCM.', opts: ['20', '30', '40', '50'], ans: 1,
                            exp: 'LCM = 180/6 = 30.' },
                        { q: 'LCM of fractions 2/3 and 4/9 is:', opts: ['4/3', '4/9', '8/9', '2/9'], ans: 0,
                            exp: 'LCM(2,4)/HCF(3,9) = 4/3.' },
                        { q: 'HCF of fractions 3/4 and 5/6 is:', opts: ['1/12', '1/6', '5/12', '3/4'], ans: 0,
                            exp: 'HCF(3,5)/LCM(4,6) = 1/12.' },
                        { q: 'If HCF of two numbers is 1, they are called:', opts: ['Prime', 'Co-prime',
                                'Twin primes', 'Composite'
                            ], ans: 1, exp: 'HCF=1 ⇒ Co-prime.' },
                        { q: 'LCM of co-prime numbers is:', opts: ['Sum', 'Product', 'Difference', 'Ratio'],
                            ans: 1, exp: 'For co-primes, LCM = product.' },
                        { q: 'LCM=72, HCF=6, one number=18. Find the other.', opts: ['12', '18', '24', '36'],
                            ans: 2, exp: 'Product = 72×6=432. 432/18 = 24.' },
                        { q: 'HCF of (2^3 - 1) and (2^5 - 1) is:', opts: ['1', '3', '7', '31'], ans: 2,
                            exp: 'HCF(3,5)=1, so 2^1 - 1 = 1? Wait. Formula: HCF(n^a -1, n^b -1) = n^(HCF(a,b)) - 1. So 2^1 - 1 = 1. But 2^3-1=7, 2^5-1=31, HCF is 1. Correct answer is 1.' },
                        { q: 'Find the greatest number that divides 72 and 108 exactly.', opts: ['24', '28', '36',
                                '48'
                            ], ans: 2, exp: 'HCF of 72 and 108 = 36.' }
                    ]
                },

                // ----- 3. FACTORS (Number, Sum, Product) -----
                {
                    name: 'Prime Factors & Divisor Count (CGL Level)',
                    desc: `• If N = a^p × b^q × c^r, then:
                        <br>  → <b>Number of factors</b> = (p+1)(q+1)(r+1)
                        <br>  → <b>Sum of factors</b> = [(a^(p+1)-1)/(a-1)] × [(b^(q+1)-1)/(b-1)] × ...
                        <br>  → <b>Product of factors</b> = N^(Number of factors / 2)
                        <br>  → <b>Number of even/odd factors</b> (CGL special).`,
                    questions: [
                        { q: 'Find the number of factors of 36.', opts: ['6', '8', '9', '12'], ans: 2,
                            exp: '36 = 2² × 3² → (2+1)(2+1) = 9.' },
                        { q: 'How many factors does 120 have?', opts: ['12', '14', '16', '18'], ans: 2,
                            exp: '120 = 2³×3¹×5¹ → (3+1)(1+1)(1+1) = 16.' },
                        { q: 'Find the sum of factors of 12.', opts: ['18', '24', '28', '32'], ans: 2,
                            exp: '12 = 2²×3¹. Sum = (2³-1)/(2-1) × (3²-1)/(3-1) = 7 × 4 = 28.' },
                        { q: 'Number of odd factors of 72 is:', opts: ['2', '3', '4', '6'], ans: 1,
                            exp: '72 = 2³×3². Odd factors = factors of 3² → (2+1)=3.' },
                        { q: 'Product of factors of 16 is:', opts: ['16', '64', '256', '1024'], ans: 2,
                            exp: 'Factors: 1,2,4,8,16. Product = 16^(5/2) = 16^2.5? 16^2.5 = 16² * √16 = 256*4 = 1024.' },
                        { q: 'If N = 2^4 × 3^2, how many factors are even?', opts: ['10', '12', '14', '15'], ans: 3,
                            exp: 'Total = (4+1)(2+1)=15. Odd factors = (2+1)=3. Even = 15-3 = 12.' },
                        { q: 'Find the number of factors of 144.', opts: ['10', '12', '15', '18'], ans: 2,
                            exp: '144 = 2⁴ × 3² → (4+1)(2+1)=15.' },
                        { q: 'Sum of factors of 20 is:', opts: ['32', '36', '42', '48'], ans: 2,
                            exp: '20 = 2²×5¹. Sum = (2³-1)/(1) × (5²-1)/(4) = 7 × 6 = 42.' },
                        { q: 'How many factors does 72 have?', opts: ['6', '8', '10', '12'], ans: 3,
                            exp: '72 = 2³×3² → (3+1)(2+1)=12.' },
                        { q: 'Product of factors of 6 is:', opts: ['6', '18', '36', '72'], ans: 2,
                            exp: 'Factors:1,2,3,6. Product = 6^(4/2) = 6² = 36.' }
                    ]
                },

                // ----- 4. SQUARES, CUBES & SURDS -----
                {
                    name: 'Squares, Cubes & Surds (CGL Level)',
                    desc: `• <b>Squares:</b> Up to 30 (1² to 30²).
                        <br>• <b>Cubes:</b> Up to 15 (1³ to 15³).
                        <br>• <b>Surds:</b> Rationalization: 1/(√a+√b) = (√a-√b)/(a-b).
                        <br>• <b>Advanced:</b> Difference of squares: (a+b)(a-b) = a²-b².
                        <br>• <b>CGL Pattern:</b> Surd simplification and comparison.`,
                    questions: [
                        { q: 'What is 17²?', opts: ['249', '269', '289', '309'], ans: 2, exp: '17×17=289.' },
                        { q: 'What is 8³?', opts: ['512', '522', '532', '542'], ans: 0, exp: '8×8×8=512.' },
                        { q: '√144 + √225 = ?', opts: ['27', '28', '29', '30'], ans: 0, exp: '12 + 15 = 27.' },
                        { q: 'Rationalize: 1/(√3 + √2)', opts: ['(√3-√2)', '(√3+√2)', '1', '0'], ans: 0,
                            exp: 'Multiply numerator & denominator by (√3-√2) to get (√3-√2)/(3-2) = √3-√2.' },
                        { q: 'If x² = 289, find x (positive).', opts: ['13', '15', '17', '19'], ans: 2,
                            exp: '17² = 289.' },
                        { q: 'Find the value of (√5 + √3)(√5 - √3).', opts: ['1', '2', '3', '4'], ans: 1,
                            exp: 'a² - b² = 5 - 3 = 2.' },
                        { q: 'What is 24²?', opts: ['476', '536', '576', '616'], ans: 2, exp: '24×24=576.' },
                        { q: 'Compare: √3 and ³√5. Which is larger?', opts: ['√3', '³√5', 'Equal', 'Cannot compare'],
                            ans: 0, exp: '√3 ≈1.732, ³√5≈1.71. So √3 is larger.' },
                        { q: 'Simplify: 3√2 + 5√2', opts: ['6√2', '8√2', '10√2', '15√2'], ans: 1,
                            exp: '3+5=8 → 8√2.' },
                        { q: 'What is the square root of 256?', opts: ['14', '15', '16', '18'], ans: 2,
                            exp: '16² = 256.' }
                    ]
                },

                // ----- 5. UNIT DIGIT & CYCLICITY (CGL Level) -----
                {
                    name: 'Unit Digit & Cyclicity (CGL Level)',
                    desc: `• <b>Cyclicity:</b>
                        <br>  - 0,1,5,6 → constant.
                        <br>  - 2,3,7,8 → cycle of 4.
                        <br>  - 4,9 → cycle of 2.
                        <br>• <b>Advanced:</b> Unit digit of large sums/products.
                        <br>• <b>CGL Pattern:</b> Find unit digit of (a^b) + (c^d) type.`,
                    questions: [
                        { q: 'Unit digit of 2¹⁰⁰ is:', opts: ['2', '4', '6', '8'], ans: 2,
                            exp: '2 cyclicity = 4. 100 mod 4 = 0 → 2⁴ = 16, unit 6.' },
                        { q: 'Unit digit of 3²⁰ is:', opts: ['1', '3', '7', '9'], ans: 0,
                            exp: '3 cyclicity = 4. 20 mod 4 = 0 → 3⁴=81, unit 1.' },
                        { q: 'What is the unit digit of 7⁵⁰?', opts: ['1', '3', '7', '9'], ans: 2,
                            exp: '7 cyclicity = 4. 50 mod 4 = 2 → 7²=49, unit 9.' },
                        { q: 'Unit digit of 4⁵ is:', opts: ['2', '4', '6', '8'], ans: 1,
                            exp: '4 cyclicity = 2. 5 mod 2 = 1 → 4¹=4.' },
                        { q: 'Unit digit of 8²⁵ is:', opts: ['2', '4', '6', '8'], ans: 3,
                            exp: '8 cyclicity = 4. 25 mod 4 = 1 → 8¹=8.' },
                        { q: 'Unit digit of 9¹⁰¹ is:', opts: ['1', '3', '7', '9'], ans: 3,
                            exp: '9 cyclicity = 2. 101 mod 2 = 1 → 9¹=9.' },
                        { q: 'Unit digit of 6²⁰² is:', opts: ['2', '4', '6', '8'], ans: 2, exp: '6 always ends with 6.' },
                        { q: 'Unit digit of 5¹⁰⁰ is:', opts: ['0', '5', '1', '25'], ans: 1, exp: '5 always ends with 5.' },
                        { q: 'Unit digit of (2²⁰ + 3²⁰) is:', opts: ['5', '7', '9', '1'], ans: 1,
                            exp: '2²⁰→6, 3²⁰→1, sum=7, unit 7.' },
                        { q: 'Find unit digit of 3⁵⁵ × 7⁶⁶.', opts: ['1', '3', '7', '9'], ans: 2,
                            exp: '3⁵⁵: 55 mod 4 = 3 → 3³=27→7. 7⁶⁶: 66 mod 4 = 2 → 7²=49→9. 7×9=63→3. Unit 3.' }
                    ]
                },

                // ----- 6. REMAINDER THEOREM (CGL Level) -----
                {
                    name: 'Remainder Theorem (Advanced)',
                    desc: `• <b>Basic:</b> a mod d = r.
                        <br>• <b>Advanced:</b> (a+b) mod d = (a mod d + b mod d) mod d.
                        <br>• <b>CGL Special:</b> Fermat's Little Theorem: a^(p-1) ≡ 1 (mod p) when p is prime and a is not divisible by p.
                        <br>• <b>Pattern:</b> Finding remainders of large powers using cyclicity of remainders.`,
                    questions: [
                        { q: 'Remainder of 17 ÷ 5 is:', opts: ['1', '2', '3', '4'], ans: 1, exp: '17 = 5×3 + 2.' },
                        { q: 'Find (15 + 23) mod 7.', opts: ['1', '2', '3', '4'], ans: 3,
                            exp: '15 mod 7 = 1, 23 mod 7 = 2 → 1+2=3.' },
                        { q: 'Find (8×9) mod 5.', opts: ['1', '2', '3', '4'], ans: 1,
                            exp: '72 mod 5 = 2 (5×14=70).' },
                        { q: 'Remainder when 2⁶ is divided by 7.', opts: ['1', '2', '3', '4'], ans: 0,
                            exp: '64 ÷ 7 = 9 rem 1.' },
                        { q: 'If a leaves rem 3 when divided by 5, find rem of a² ÷ 5.', opts: ['4', '1', '3', '0'],

                        { q: 'Find remainder of 3¹⁰⁰ ÷ 4.', opts: ['0', '1', '2', '3'], ans: 1,

                        { q: 'Remainder of 5¹⁰⁰ ÷ 3 is:', opts: ['0', '1', '2'], ans: 1,
                            exp: '5≡2 mod3. 2¹⁰⁰. 2^1=2, 2²=4≡1. 100 is even → 2¹⁰⁰≡1.' },
                        { q: 'Find remainder of 7⁵ ÷ 3.', opts: ['0', '1', '2'], ans: 1,
                            exp: '7≡1 mod3 → 1⁵=1.' },
                        { q: 'What is the remainder when 23 is divided by 6?', opts: ['3', '4', '5', '6'], ans: 2,
                            exp: '6×3=18, 23-18=5.' }
                    ]
                },

                // ----- 7. FACTORIALS (CGL Level) -----
                {
                    name: 'Factorials (Trailing Zeros & Highest Power)',
                    desc: `• <b>Trailing zeros in n! :</b> Sum of floor(n/5) + floor(n/25) + floor(n/125) + ...
                        <br>• <b>Highest power of prime p in n! :</b> Sum of floor(n/p) + floor(n/p²) + floor(n/p³) + ...
                        <br>• <b>CGL Pattern:</b> Find number of zeros or highest power of 2/3/5.`,
                    questions: [
                        { q: 'Number of trailing zeros in 10! is:', opts: ['1', '2', '3', '4'], ans: 1,
                            exp: '10/5 = 2. (10/25=0) → 2 zeros.' },
                        { q: 'Trailing zeros in 25! is:', opts: ['4', '5', '6', '7'], ans: 2,
                            exp: '25/5 = 5, 25/25 = 1 → total 6.' },
                        { q: 'Highest power of 2 dividing 10! is:', opts: ['5', '6', '7', '8'], ans: 3,
                            exp: '10/2=5, 10/4=2, 10/8=1 → 5+2+1=8.' },
                        { q: 'Highest power of 5 in 50! is:', opts: ['10', '11', '12', '13'], ans: 2,
                            exp: '50/5=10, 50/25=2 → 12.' },
                        { q: 'Trailing zeros in 100! is:', opts: ['20', '22', '24', '26'], ans: 2,
                            exp: '100/5=20, 100/25=4 → 24.' },
                        { q: 'Highest power of 3 in 15! is:', opts: ['4', '5', '6', '7'], ans: 1,
                            exp: '15/3=5, 15/9=1 → 6.' },
                        { q: 'Trailing zeros in 32! is:', opts: ['5', '6', '7', '8'], ans: 2,
                            exp: '32/5=6, 32/25=1 → 7.' },
                        { q: 'Number of zeros at the end of 5! is:', opts: ['0', '1', '2', '3'], ans: 1,
                            exp: '5! = 120 → 1 zero.' },
                        { q: 'Highest power of 7 in 49! is:', opts: ['6', '7', '8', '9'], ans: 2,
                            exp: '49/7=7, 49/49=1 → 8.' },
                        { q: 'Find the number of trailing zeros in 125!', opts: ['28', '29', '30', '31'], ans: 3,
                            exp: '125/5=25, 125/25=5, 125/125=1 → 31.' }

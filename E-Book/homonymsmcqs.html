<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC MOCK – Homonyms Practice (500+ MCQs)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        /* ===== BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background: #e9edf2; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 30px 15px; }
        .app-container { max-width: 1100px; width: 100%; background: #ffffff; border-radius: 40px; box-shadow: 0 25px 60px rgba(0,0,0,0.15); overflow: hidden; }

        /* ===== HEADER ===== */
        .header { background: #0b1a33; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #8e44ad; flex-wrap: wrap; gap: 10px; }
        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-icon { background: #8e44ad; color: #0b1a33; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 1.6rem; font-weight: 800; }
        .logo-text { color: white; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
        .logo-text span { color: #8e44ad; font-weight: 400; }
        .header-badge { background: rgba(142, 68, 173, 0.15); color: #8e44ad; padding: 6px 18px; border-radius: 40px; font-size: 0.8rem; font-weight: 600; border: 1px solid rgba(142,68,173,0.3); }

        /* ===== PAGES ===== */
        .page { display: none; padding: 30px 35px; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }

        /* ===== COVER / DASHBOARD ===== */
        .cover-top { text-align: center; border-bottom: 2px dashed #e2e8f0; padding-bottom: 25px; margin-bottom: 25px; }
        .cover-badge { display: inline-block; background: #8e44ad; color: #fff; font-weight: 800; font-size: 0.9rem; padding: 6px 24px; border-radius: 40px; letter-spacing: 1px; margin-bottom: 15px; }
        .cover-title { font-size: 2.8rem; font-weight: 800; color: #0b1a33; line-height: 1.1; }
        .cover-title .highlight { color: #8e44ad; background: #f4ecf7; padding: 0 12px; border-radius: 12px; }
        .cover-subtitle { font-size: 1.3rem; color: #334155; font-weight: 600; margin-top: 12px; background: #f1f5f9; display: inline-block; padding: 6px 30px; border-radius: 60px; }
        .cover-desc { font-size: 1.05rem; color: #475569; margin-top: 18px; max-width: 700px; margin-left: auto; margin-right: auto; }

        /* ===== SETS GRID ===== */
        .sets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin: 25px 0; }
        .set-card { background: #f8fafc; border-radius: 20px; padding: 18px 14px; text-align: center; border: 2px solid #e9eef3; cursor: pointer; transition: 0.25s ease; position: relative; }
        .set-card:hover { border-color: #8e44ad; transform: translateY(-4px); box-shadow: 0 8px 24px rgba(142,68,173,0.12); }
        .set-card .set-num { font-size: 1.8rem; font-weight: 800; color: #0b1a33; }
        .set-card .set-label { font-size: 0.75rem; color: #64748b; font-weight: 600; margin-top: 2px; }
        .set-card .set-progress { font-size: 0.7rem; color: #8e44ad; font-weight: 600; margin-top: 6px; background: #f4ecf7; padding: 2px 12px; border-radius: 20px; display: inline-block; }
        .set-card .set-status { position: absolute; top: 8px; right: 10px; font-size: 0.6rem; padding: 2px 10px; border-radius: 20px; font-weight: 600; }
        .set-card .set-status.completed { background: #eafaf1; color: #27ae60; }
        .set-card .set-status.inprogress { background: #fef9e7; color: #f39c12; }
        .set-card .set-status.notstarted { background: #f1f5f9; color: #94a3b8; }

        .overall-progress { background: #f8fafc; border-radius: 16px; padding: 14px 22px; margin-bottom: 22px; border: 1px solid #e9eef3; display: flex; flex-wrap: wrap; gap: 18px 30px; align-items: center; }
        .overall-progress .bar-wrap { flex: 1; min-width: 120px; height: 8px; background: #e9eef3; border-radius: 20px; overflow: hidden; }
        .overall-progress .bar-wrap .bar { height: 100%; width: 0%; background: linear-gradient(90deg, #8e44ad, #c39bd3); border-radius: 20px; transition: width 0.5s; }

        /* ===== PRACTICE HEADER ===== */
        .practice-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; border-bottom: 3px solid #8e44ad; padding-bottom: 15px; margin-bottom: 20px; gap: 12px; }
        .practice-header .left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .practice-header .left h2 { font-size: 1.5rem; font-weight: 800; color: #0b1a33; }
        .practice-header .left h2 i { color: #8e44ad; margin-right: 8px; }
        .practice-header .set-tag { background: #0b1a33; color: white; padding: 5px 18px; border-radius: 40px; font-weight: 600; font-size: 0.85rem; }

        /* ===== SCORE BAR ===== */
        .score-bar { display: flex; flex-wrap: wrap; gap: 18px 30px; background: #f8fafc; border-radius: 16px; padding: 12px 22px; margin-bottom: 22px; border: 1px solid #e9eef3; }
        .score-item { display: flex; align-items: center; gap: 8px; font-weight: 500; color: #334155; font-size: 0.9rem; }
        .score-item i { font-size: 1rem; }
        .score-item .num { font-weight: 700; font-size: 1.1rem; color: #0b1a33; }
        .score-item.correct i { color: #27ae60; }
        .score-item.wrong i { color: #e74c3c; }
        .score-item.attempted i { color: #2980b9; }
        .score-item.percent i { color: #8e44ad; }
        .score-item.percent .num { color: #8e44ad; }

        /* ===== QUESTION CARD ===== */
        .question-card { background: #ffffff; border-radius: 20px; padding: 22px 26px; margin-bottom: 20px; border: 1px solid #e9eef3; box-shadow: 0 2px 8px rgba(0,0,0,0.02); transition: 0.2s; border-left: 6px solid #8e44ad; }
        .question-card:hover { border-color: #d2b4de; box-shadow: 0 6px 20px rgba(0,0,0,0.04); }
        .q-top { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
        .q-number { font-weight: 800; font-size: 0.95rem; color: #8e44ad; background: #f4ecf7; padding: 2px 14px; border-radius: 40px; flex-shrink: 0; }
        .q-text { font-size: 1.05rem; font-weight: 500; color: #0b1a33; line-height: 1.6; }
        .q-text .blank { display: inline-block; min-width: 80px; border-bottom: 3px dashed #8e44ad; color: #8e44ad; font-weight: 700; padding-bottom: 2px; }

        .options { display: flex; gap: 25px; flex-wrap: wrap; margin: 12px 0 14px; }
        .options label { display: flex; align-items: center; gap: 10px; font-weight: 500; color: #1e293b; cursor: pointer; font-size: 1rem; padding: 4px 14px 4px 6px; border-radius: 30px; transition: 0.2s; background: #f8fafc; border: 1px solid transparent; }
        .options label:hover { background: #f4ecf7; border-color: #d2b4de; }
        .options input[type="radio"] { width: 17px; height: 17px; accent-color: #8e44ad; cursor: pointer; flex-shrink: 0; }
        .options label.correct-ans { background: #eafaf1; border-color: #27ae60; color: #1e8449; }
        .options label.wrong-ans { background: #fdedec; border-color: #e74c3c; color: #922b21; }
        .options input[type="radio"]:disabled { cursor: not-allowed; opacity: 0.5; }

        .btn-answer { background: #0b1a33; color: white; border: none; padding: 7px 24px; border-radius: 40px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.25s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-answer:hover:not(:disabled) { background: #8e44ad; transform: translateY(-2px); box-shadow: 0 6px 18px rgba(142,68,173,0.25); }
        .btn-answer:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

        .answer-box { margin-top: 14px; padding: 14px 20px; border-radius: 14px; background: #f4ecf7; border-left: 6px solid #8e44ad; display: none; animation: slideDown 0.3s ease; }
        @keyframes slideDown { 0% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 1; transform: translateY(0); } }
        .answer-box .correct-word { font-weight: 700; font-size: 1.05rem; color: #27ae60; }
        .answer-box .explanation { margin-top: 6px; color: #2c3e50; font-size: 0.92rem; line-height: 1.6; }
        .answer-box .explanation strong { color: #0b1a33; }
        .answer-box .original-sentence { margin-top: 6px; font-size: 0.85rem; color: #64748b; border-top: 1px solid #d2b4de; padding-top: 8px; }

        /* ===== NAV ===== */
        .nav-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; padding-top: 18px; border-top: 1px solid #e9eef3; flex-wrap: wrap; gap: 12px; }
        .btn-nav { background: transparent; color: #0b1a33; border: 2px solid #cbd5e1; padding: 8px 22px; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .btn-nav:hover { border-color: #8e44ad; background: #f4ecf7; }
        .btn-nav.primary { background: #0b1a33; color: white; border-color: #0b1a33; }
        .btn-nav.primary:hover { background: #8e44ad; border-color: #8e44ad; }
        .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }
        .page-indicator { font-weight: 600; color: #64748b; background: #f1f5f9; padding: 4px 18px; border-radius: 40px; font-size: 0.85rem; }

        .text-center { text-align: center; margin-top: 10px; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .page { padding: 20px 16px; }
            .cover-title { font-size: 2rem; }
            .sets-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
            .set-card { padding: 14px 10px; }
            .set-card .set-num { font-size: 1.4rem; }
            .practice-header .left h2 { font-size: 1.2rem; }
            .question-card { padding: 16px 16px; }
            .q-text { font-size: 0.95rem; }
            .options { gap: 12px; }
            .options label { font-size: 0.9rem; padding: 3px 10px 3px 4px; }
            .score-bar { gap: 10px 16px; padding: 10px 14px; }
            .score-item { font-size: 0.8rem; }
            .score-item .num { font-size: 0.95rem; }
            .nav-footer { flex-direction: column; align-items: stretch; }
            .btn-nav { justify-content: center; }
            .header { padding: 12px 16px; }
            .logo-text { font-size: 1.2rem; }
        }
        @media (max-width: 480px) {
            .sets-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .set-card .set-num { font-size: 1.2rem; }
            .cover-title { font-size: 1.6rem; }
            .options { flex-direction: column; gap: 8px; }
            .btn-answer { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
<div class="app-container">

    <!-- ===== HEADER ===== -->
    <div class="header">
        <a href="#" class="logo" onclick="goToDashboard(); return false;">
            <div class="logo-icon"><i class="fas fa-exchange-alt"></i></div>
            <div class="logo-text">SSC <span>MOCK</span></div>
        </a>
        <div class="header-badge"><i class="fas fa-pencil-alt"></i> Practice Sets</div>
    </div>

    <!-- ===== DASHBOARD ===== -->
    <div class="page active" id="page-dashboard">
        <div class="cover-top">
            <div class="cover-badge"><i class="fas fa-star"></i> SSC CGL / CHSL / CPO / MTS</div>
            <h1 class="cover-title"><span class="highlight">500+</span> Homonyms<br>Practice Sets</h1>
            <div class="cover-subtitle">Master Confusing Words</div>
            <p class="cover-desc">Based on SSC Previous Year Questions – 20 Sets × 25 MCQs = 500+ Questions</p>
        </div>

        <div class="overall-progress">
            <div><strong>Overall Progress:</strong> <span id="overallProgressText">0 / 500</span></div>
            <div class="bar-wrap"><div class="bar" id="overallProgressBar"></div></div>
            <div><strong>Score:</strong> <span id="overallScoreText">0%</span></div>
        </div>

        <div class="sets-grid" id="setsGrid"></div>

        <div class="text-center">
            <button class="btn-nav primary" onclick="resetAllProgress()"><i class="fas fa-redo-alt"></i> Reset All Progress</button>
        </div>
    </div>

    <!-- ===== PRACTICE PAGE ===== -->
    <div class="page" id="page-practice">
        <div class="practice-header">
            <div class="left">
                <button class="btn-nav" onclick="goToDashboard()" style="padding:6px 14px;font-size:0.8rem;"><i class="fas fa-arrow-left"></i> Sets</button>
                <h2><i class="fas fa-pen-fancy"></i> <span id="setTitle">Set 1</span></h2>
            </div>
            <span class="set-tag" id="setTag"><i class="fas fa-layer-group"></i> Set 1 / 20</span>
        </div>

        <div class="score-bar">
            <div class="score-item correct"><i class="fas fa-check-circle"></i> Correct: <span class="num" id="correctCount">0</span></div>
            <div class="score-item wrong"><i class="fas fa-times-circle"></i> Wrong: <span class="num" id="wrongCount">0</span></div>
            <div class="score-item attempted"><i class="fas fa-flag"></i> Attempted: <span class="num" id="attemptedCount">0</span></div>
            <div class="score-item percent"><i class="fas fa-star"></i> Score: <span class="num" id="scorePercent">0</span>%</div>
        </div>

        <div id="questionsContainer"></div>

        <div class="nav-footer">
            <button class="btn-nav" id="prevSetBtn" onclick="changeSet(-1)"><i class="fas fa-chevron-left"></i> Previous</button>
            <span class="page-indicator" id="setIndicator">Set 1 of 20</span>
            <button class="btn-nav primary" id="nextSetBtn" onclick="changeSet(1)">Next <i class="fas fa-chevron-right"></i></button>
        </div>
    </div>
</div>

<script>
// ================================================================
// 📦 HOMOPHONE DATA – 513 PAIRS (A-Z SEQUENCE)
// ================================================================
const homophoneData = [
    { id: 1, w1: "Accept", w2: "Except", m1: "स्वीकार करना", m2: "के अलावा", def: "Accept = receive; Except = excluding", ex1: "Please accept my apology.", ex2: "Everyone except him came." },
    { id: 2, w1: "Affect", w2: "Effect", m1: "प्रभाव डालना", m2: "परिणाम", def: "Affect (verb) = influence; Effect (noun) = result", ex1: "The weather affects my mood.", ex2: "The effect was immediate." },
    { id: 3, w1: "Allowed", w2: "Aloud", m1: "अनुमति दी गई", m2: "ज़ोर से", def: "Allowed = permitted; Aloud = audibly", ex1: "We are allowed to go.", ex2: "Read the text aloud." },
    { id: 4, w1: "Ant", w2: "Aunt", m1: "चींटी", m2: "चाची/मौसी", def: "Ant = insect; Aunt = relative", ex1: "An ant is small.", ex2: "My aunt is coming." },
    { id: 5, w1: "Arc", w2: "Ark", m1: "चाप", m2: "नाव", def: "Arc = curve; Ark = boat", ex1: "Draw an arc.", ex2: "Noah built an ark." },
    { id: 6, w1: "Ate", w2: "Eight", m1: "खाया", m2: "आठ", def: "Ate = past of eat; Eight = number 8", ex1: "I ate lunch.", ex2: "I have eight books." },
    { id: 7, w1: "Aye", w2: "Eye", m1: "हाँ", m2: "आँख", def: "Aye = yes; Eye = organ", ex1: "All say aye.", ex2: "He has a blue eye." },
    { id: 8, w1: "Air", w2: "Heir", m1: "हवा", m2: "वारिस", def: "Air = atmosphere; Heir = successor", ex1: "The air is fresh.", ex2: "He is the heir to the throne." },
    { id: 9, w1: "All", w2: "Awl", m1: "सब", m2: "सूआ", def: "All = everything; Awl = pointed tool", ex1: "All are welcome.", ex2: "He used an awl to make holes." },
    { id: 10, w1: "Alms", w2: "Arms", m1: "भिक्षा", m2: "हथियार/बाहें", def: "Alms = charity; Arms = weapons/limbs", ex1: "He asked for alms.", ex2: "He carried arms." },
    { id: 11, w1: "Altar", w2: "Alter", m1: "वेदी", m2: "बदलना", def: "Altar = table for worship; Alter = to change", ex1: "They prayed at the altar.", ex2: "Please alter your plans." },
    { id: 12, w1: "Aisle", w2: "Isle", m1: "गलियारा", m2: "द्वीप", def: "Aisle = passage; Isle = island", ex1: "Walk down the aisle.", ex2: "We visited the isle." },
    { id: 13, w1: "Amoral", w2: "Immoral", m1: "अनैतिक (नैतिकता से रहित)", m2: "अनैतिक (गलत)", def: "Amoral = without morals; Immoral = morally wrong", ex1: "Animals are amoral.", ex2: "Stealing is immoral." },
    { id: 14, w1: "Assent", w2: "Ascent", m1: "सहमति", m2: "चढ़ाई", def: "Assent = agreement; Ascent = climb", ex1: "He nodded in assent.", ex2: "The ascent was steep." },
    { id: 15, w1: "Auger", w2: "Augur", m1: "बरमा", m2: "शगुन", def: "Auger = drilling tool; Augur = omen", ex1: "He used an auger.", ex2: "The storm augurs disaster." },
    { id: 16, w1: "Aural", w2: "Oral", m1: "श्रवण संबंधी", m2: "मौखिक", def: "Aural = relating to hearing; Oral = spoken", ex1: "He has aural problems.", ex2: "She gave an oral test." },
    { id: 17, w1: "Awry", w2: "Aery", m1: "टेढ़ा/गलत", m2: "हवाई", def: "Awry = askew/wrong; Aery = airy/ethereal", ex1: "The plan went awry.", ex2: "The aery view was beautiful." },
    { id: 18, w1: "Ax", w2: "Acts", m1: "कुल्हाड़ी", m2: "कार्य", def: "Ax = tool; Acts = deeds", ex1: "He chopped wood with an ax.", ex2: "His acts are kind." },
    { id: 19, w1: "Ail", w2: "Ale", m1: "बीमार होना", m2: "एक प्रकार की बीयर", def: "Ail = to trouble/ill; Ale = a type of beer", ex1: "What ails you?", ex2: "He drank a glass of ale." },
    { id: 20, w1: "Aim", w2: "Ame", m1: "लक्ष्य", m2: "प्रेम (फ्रेंच)", def: "Aim = goal; Ame = soul (French)", ex1: "His aim is clear.", ex2: "Ame is a French word." },
    { id: 21, w1: "An", w2: "Ann", m1: "एक", m2: "एन (नाम)", def: "An = indefinite article; Ann = name", ex1: "I have an apple.", ex2: "Ann is my sister." },
    { id: 22, w1: "Apace", w2: "Appease", m1: "तेज़ी से", m2: "तुष्ट करना", def: "Apace = quickly; Appease = to pacify", ex1: "The work is going apace.", ex2: "He tried to appease her." },
    { id: 23, w1: "Are", w2: "Our", m1: "हैं", m2: "हमारा", def: "Are = verb; Our = possessive", ex1: "We are coming.", ex2: "This is our house." },
    { id: 24, w1: "As", w2: "Ass", m1: "जैसे/क्योंकि", m2: "गधा", def: "As = like/because; Ass = donkey", ex1: "I am as tall as you.", ex2: "He is stubborn as an ass." },
    { id: 25, w1: "Aught", w2: "Ought", m1: "कुछ भी", m2: "चाहिए", def: "Aught = anything; Ought = should", ex1: "He doesn't care aught.", ex2: "You ought to go." },
    { id: 26, w1: "Bare", w2: "Bear", m1: "नंगा", m2: "भालू/सहन करना", def: "Bare = naked; Bear = animal/tolerate", ex1: "His arms were bare.", ex2: "I can't bear the pain." },
    { id: 27, w1: "Base", w2: "Bass", m1: "आधार", m2: "बास (ध्वनि/मछली)", def: "Base = foundation; Bass = low pitch/fish", ex1: "The base is strong.", ex2: "He plays bass guitar." },
    { id: 28, w1: "Be", w2: "Bee", m1: "होना", m2: "मधुमक्खी", def: "Be = verb; Bee = insect", ex1: "I want to be happy.", ex2: "A bee stung me." },
    { id: 29, w1: "Beach", w2: "Beech", m1: "समुद्र तट", m2: "बीच का पेड़", def: "Beach = shore; Beech = tree", ex1: "We went to the beach.", ex2: "The beech tree is tall." },
    { id: 30, w1: "Beat", w2: "Beet", m1: "मारना/ताल", m2: "चुकंदर", def: "Beat = strike/rhythm; Beet = vegetable", ex1: "He beat the drum.", ex2: "I like beet curry." },
    { id: 31, w1: "Berry", w2: "Bury", m1: "बेरी", m2: "दफनाना", def: "Berry = fruit; Bury = to inter", ex1: "I love strawberry.", ex2: "They will bury the dead." },
    { id: 32, w1: "Blew", w2: "Blue", m1: "उड़ा दिया", m2: "नीला", def: "Blew = past of blow; Blue = color", ex1: "The wind blew hard.", ex2: "The sky is blue." },
    { id: 33, w1: "Board", w2: "Bored", m1: "तख्ता/समिति", m2: "ऊबा हुआ", def: "Board = plank/committee; Bored = uninterested", ex1: "He is on the board.", ex2: "I am bored today." },

    { id: 512, w1: "Zeal", w2: "Zeal", m1: "उत्साह", m2: "उत्साह", def: "Zeal = enthusiasm; Zeal = passion", ex1: "He works with zeal.", ex2: "His zeal is inspiring." },
    { id: 513, w1: "Zenith", w2: "Zenith", m1: "चरम बिंदु", m2: "शिखर", def: "Zenith = highest point; Zenith = peak", ex1: "He reached the zenith of his career.", ex2: "The sun is at its zenith." }
];

// ================================================================
// 🔧 BUILD QUESTIONS – 20 SETS × 25 = 500 QUESTIONS
// ================================================================
const TOTAL_SETS = 20;
const PER_SET = 25;

function buildAllQuestions(data) {
    const sorted = [...data].sort((a, b) => a.w1.localeCompare(b.w1));
    const qs = [];
    const used = sorted.slice(0, TOTAL_SETS * PER_SET);
    used.forEach((item, idx) => {
        const useFirst = Math.random() < 0.5;
        let sentence, correctWord, wrongWord, correctMeaning, wrongMeaning;
        if (useFirst) {
            sentence = item.ex1;
            correctWord = item.w1;
            wrongWord = item.w2;
            correctMeaning = item.m1;
            wrongMeaning = item.m2;
        } else {
            sentence = item.ex2;
            correctWord = item.w2;
            wrongWord = item.w1;
            correctMeaning = item.m2;
            wrongMeaning = item.m1;
        }
        const regex = new RegExp('\\b' + correctWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
        const qText = sentence.replace(regex, '________');
        const opts = [item.w1, item.w2];
        const correctIdx = opts.indexOf(correctWord);
        const expl = `"${correctWord}" का अर्थ: ${correctMeaning}. ${item.def}. दूसरा शब्द "${wrongWord}" (${wrongMeaning}) इस वाक्य में सही नहीं बैठता।`;
        qs.push({
            id: idx + 1,
            question: qText,
            options: opts,
            correctIndex: correctIdx,
            correctWord: correctWord,
            wrongWord: wrongWord,
            explanation: expl,
            original: sentence,
            set: Math.floor(idx / PER_SET) + 1
        });
    });
    return qs;
}

// ================================================================
// 🎮 STATE
// ================================================================
let allQuestions = [];
let currentSet = 1;
let setProgress = {};
let selectedOptions = {};
let answeredQuestions = {};

function init() {
    allQuestions = buildAllQuestions(homophoneData);
    for (let s = 1; s <= TOTAL_SETS; s++) {
        setProgress[s] = { attempted: 0, correct: 0, wrong: 0 };
    }
    renderDashboard();
    renderSet(1);
}

// ================================================================
// 📊 DASHBOARD
// ================================================================
function renderDashboard() {
    const grid = document.getElementById('setsGrid');
    let html = '';
    let totalAttempted = 0, totalCorrect = 0;
    for (let s = 1; s <= TOTAL_SETS; s++) {
        const p = setProgress[s] || { attempted: 0, correct: 0, wrong: 0 };
        totalAttempted += p.attempted;
        totalCorrect += p.correct;
        const status = p.attempted === 0 ? 'notstarted' : (p.attempted === PER_SET ? 'completed' : 'inprogress');
        const label = status === 'notstarted' ? 'Not Started' : (status === 'completed' ? '✅ Done' : '⏳ In Progress');
        const pct = p.attempted === 0 ? 0 : Math.round((p.correct / p.attempted) * 100);
        html += `
            <div class="set-card" onclick="openSet(${s})">
                <div class="set-status ${status}">${label}</div>
                <div class="set-num">${s}</div>
                <div class="set-label">Set ${s}</div>
                <div class="set-progress">${p.attempted}/${PER_SET} · ${pct}%</div>
            </div>
        `;
    }
    grid.innerHTML = html;
    const totalQ = TOTAL_SETS * PER_SET;
    document.getElementById('overallProgressText').textContent = `${totalAttempted} / ${totalQ}`;
    document.getElementById('overallProgressBar').style.width = `${(totalAttempted / totalQ) * 100}%`;
    document.getElementById('overallScoreText').textContent = totalAttempted === 0 ? '0%' : `${Math.round((totalCorrect / totalAttempted) * 100)}%`;
}

// ================================================================
// 📝 RENDER SET
// ================================================================
function renderSet(setNum) {
    currentSet = setNum;
    const questions = allQuestions.filter(q => q.set === setNum);
    const container = document.getElementById('questionsContainer');
    const p = setProgress[setNum] || { attempted: 0, correct: 0, wrong: 0 };

    document.getElementById('setTitle').textContent = `Set ${setNum}`;
    document.getElementById('setTag').innerHTML = `<i class="fas fa-layer-group"></i> Set ${setNum} / ${TOTAL_SETS}`;
    document.getElementById('setIndicator').textContent = `Set ${setNum} of ${TOTAL_SETS}`;

    document.getElementById('correctCount').textContent = p.correct || 0;
    document.getElementById('wrongCount').textContent = p.wrong || 0;
    document.getElementById('attemptedCount').textContent = p.attempted || 0;
    const pct = p.attempted === 0 ? 0 : Math.round((p.correct / p.attempted) * 100);
    document.getElementById('scorePercent').textContent = pct;

    document.getElementById('prevSetBtn').disabled = (setNum === 1);
    document.getElementById('nextSetBtn').disabled = (setNum === TOTAL_SETS);

    let html = '';
    questions.forEach((q, idx) => {
        const qNum = idx + 1;
        const isAnswered = answeredQuestions[q.id] || false;
        const selected = selectedOptions[q.id];
        html += `
            <div class="question-card" id="qcard-${q.id}">
                <div class="q-top">
                    <span class="q-number">Q${qNum}</span>
                    <span class="q-text">${q.question}</span>
                </div>
                <div class="options" id="options-${q.id}">
                    ${q.options.map((opt, oi) => `
                        <label>
                            <input type="radio" name="q${q.id}" value="${oi}" 
                                ${isAnswered ? 'disabled' : ''}
                                onchange="selectOption(${q.id}, ${oi})">
                            ${opt}
                        </label>
                    `).join('')}
                </div>
                <button class="btn-answer" id="btn-${q.id}" 
                    onclick="showAnswer(${q.id})" 
                    ${isAnswered ? 'disabled' : ''}>
                    <i class="fas fa-eye"></i> Show Answer
                </button>
                <div class="answer-box" id="answer-${q.id}">
                    <div><span class="correct-word">✔ ${q.correctWord}</span> <span id="result-${q.id}"></span></div>
                    <div class="explanation"><strong>💡 Explanation:</strong> ${q.explanation}</div>
                    <div class="original-sentence"><i class="fas fa-quote-left"></i> ${q.original}</div>
                </div>
            </div>
        `;
    });
    container.innerHTML = html;

    // Restore answered state
    questions.forEach(q => {
        if (answeredQuestions[q.id]) {
            const ansBox = document.getElementById(`answer-${q.id}`);
            if (ansBox) ansBox.style.display = 'block';
            const selected = selectedOptions[q.id];
            const isCorrect = (selected === q.correctIndex);
            const resultSpan = document.getElementById(`result-${q.id}`);
            if (resultSpan) {
                if (isCorrect) { resultSpan.innerHTML = ' ✅ Correct!'; resultSpan.style.color = '#27ae60'; }
                else { const chosen = q.options[selected] || 'None'; resultSpan.innerHTML = ` ❌ Your answer: ${chosen}`; resultSpan.style.color = '#e74c3c'; }
            }
            const optContainer = document.getElementById(`options-${q.id}`);
            if (optContainer) {
                const labels = optContainer.querySelectorAll('label');
                labels.forEach((label, idx) => {
                    if (idx === q.correctIndex) label.classList.add('correct-ans');
                    else if (idx === selected && !isCorrect) label.classList.add('wrong-ans');
                    const radio = label.querySelector('input');
                    if (radio) radio.disabled = true;
                });
            }
            const btn = document.getElementById(`btn-${q.id}`);
            if (btn) btn.disabled = true;
        }
    });
    renderDashboard();
}

// ================================================================
// 🎯 INTERACTIONS
// ================================================================
function selectOption(qId, idx) {
    if (answeredQuestions[qId]) return;
    selectedOptions[qId] = idx;
}

function showAnswer(qId) {
    if (answeredQuestions[qId]) return;
    const q = allQuestions.find(item => item.id === qId);
    if (!q) return;
    const selected = selectedOptions[qId];
    const isCorrect = (selected === q.correctIndex);

    answeredQuestions[qId] = true;
    const p = setProgress[q.set] || { attempted: 0, correct: 0, wrong: 0 };
    p.attempted++;
    if (isCorrect) p.correct++;
    else p.wrong++;
    setProgress[q.set] = p;

    const ansBox = document.getElementById(`answer-${qId}`);
    if (ansBox) ansBox.style.display = 'block';

    const resultSpan = document.getElementById(`result-${qId}`);
    if (resultSpan) {
        if (isCorrect) { resultSpan.innerHTML = ' ✅ Correct!'; resultSpan.style.color = '#27ae60'; }
        else { const chosen = q.options[selected] || 'None'; resultSpan.innerHTML = ` ❌ Your answer: ${chosen}`; resultSpan.style.color = '#e74c3c'; }
    }

    const optContainer = document.getElementById(`options-${qId}`);
    if (optContainer) {
        const labels = optContainer.querySelectorAll('label');
        labels.forEach((label, idx) => {
            if (idx === q.correctIndex) label.classList.add('correct-ans');
            else if (idx === selected && !isCorrect) label.classList.add('wrong-ans');
            const radio = label.querySelector('input');
            if (radio) radio.disabled = true;
        });
    }
    const btn = document.getElementById(`btn-${qId}`);
    if (btn) btn.disabled = true;

    renderSet(q.set);
}

// ================================================================
// 🧭 NAVIGATION
// ================================================================
function openSet(setNum) {
    if (setNum < 1 || setNum > TOTAL_SETS) return;
    document.getElementById('page-dashboard').classList.remove('active');
    document.getElementById('page-practice').classList.add('active');
    renderSet(setNum);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goToDashboard() {
    document.getElementById('page-practice').classList.remove('active');
    document.getElementById('page-dashboard').classList.add('active');
    renderDashboard();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function changeSet(delta) {
    const newSet = currentSet + delta;
    if (newSet < 1 || newSet > TOTAL_SETS) return;
    openSet(newSet);
}

function resetAllProgress() {
    if (!confirm('Reset all progress for all sets? This cannot be undone.')) return;
    for (let s = 1; s <= TOTAL_SETS; s++) {
        setProgress[s] = { attempted: 0, correct: 0, wrong: 0 };
    }
    selectedOptions = {};
    answeredQuestions = {};
    allQuestions = buildAllQuestions(homophoneData);
    renderDashboard();
    if (document.getElementById('page-practice').classList.contains('active')) {
        renderSet(currentSet);
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ================================================================
// 🚀 BOOT
// ================================================================
document.addEventListener('DOMContentLoaded', init);
</script>
</body>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC MOCK – Idioms & Phrases Practice</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background: #e9edf2; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 30px 15px; }
        .app-container { max-width: 1100px; width: 100%; background: #ffffff; border-radius: 40px; box-shadow: 0 25px 60px rgba(0,0,0,0.15); overflow: hidden; }

        .header { background: #0b1a33; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #f59e0b; flex-wrap: wrap; gap: 10px; }
        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-icon { background: #f59e0b; color: #0b1a33; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 1.6rem; font-weight: 800; }
        .logo-text { color: white; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
        .logo-text span { color: #f59e0b; font-weight: 400; }
        .header-badge { background: rgba(245, 158, 11, 0.15); color: #f59e0b; padding: 6px 18px; border-radius: 40px; font-size: 0.8rem; font-weight: 600; border: 1px solid rgba(245,158,11,0.3); }

        .page { display: none; padding: 30px 35px; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }

        .cover-top { text-align: center; border-bottom: 2px dashed #e2e8f0; padding-bottom: 25px; margin-bottom: 25px; }
        .cover-badge { display: inline-block; background: #f59e0b; color: #0b1a33; font-weight: 800; font-size: 0.9rem; padding: 6px 24px; border-radius: 40px; letter-spacing: 1px; margin-bottom: 15px; }
        .cover-title { font-size: 2.8rem; font-weight: 800; color: #0b1a33; line-height: 1.1; }
        .cover-title .highlight { color: #f59e0b; background: #fffbeb; padding: 0 12px; border-radius: 12px; }
        .cover-subtitle { font-size: 1.3rem; color: #334155; font-weight: 600; margin-top: 12px; background: #f1f5f9; display: inline-block; padding: 6px 30px; border-radius: 60px; }
        .cover-desc { font-size: 1.05rem; color: #475569; margin-top: 18px; max-width: 700px; margin-left: auto; margin-right: auto; }

        .overall-progress { background: #f8fafc; border-radius: 16px; padding: 14px 22px; margin-bottom: 22px; border: 1px solid #e9eef3; display: flex; flex-wrap: wrap; gap: 18px 30px; align-items: center; }
        .overall-progress .bar-wrap { flex: 1; min-width: 120px; height: 8px; background: #e9eef3; border-radius: 20px; overflow: hidden; }
        .overall-progress .bar-wrap .bar { height: 100%; width: 0%; background: linear-gradient(90deg, #f59e0b, #fcd34d); border-radius: 20px; transition: width 0.5s; }

        .sets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin: 25px 0; }
        .set-card { background: #f8fafc; border-radius: 20px; padding: 18px 14px; text-align: center; border: 2px solid #e9eef3; cursor: pointer; transition: 0.25s ease; position: relative; }
        .set-card:hover { border-color: #f59e0b; transform: translateY(-4px); box-shadow: 0 8px 24px rgba(245,158,11,0.12); }
        .set-card .set-num { font-size: 1.8rem; font-weight: 800; color: #0b1a33; }
        .set-card .set-label { font-size: 0.75rem; color: #64748b; font-weight: 600; margin-top: 2px; }
        .set-card .set-progress { font-size: 0.7rem; color: #f59e0b; font-weight: 600; margin-top: 6px; background: #fffbeb; padding: 2px 12px; border-radius: 20px; display: inline-block; }
        .set-card .set-status { position: absolute; top: 8px; right: 10px; font-size: 0.6rem; padding: 2px 10px; border-radius: 20px; font-weight: 600; }
        .set-card .set-status.completed { background: #eafaf1; color: #27ae60; }
        .set-card .set-status.inprogress { background: #fef9e7; color: #f39c12; }
        .set-card .set-status.notstarted { background: #f1f5f9; color: #94a3b8; }

        .text-center { text-align: center; margin-top: 10px; }

        .practice-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; border-bottom: 3px solid #f59e0b; padding-bottom: 15px; margin-bottom: 20px; gap: 12px; }
        .practice-header .left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .practice-header .left h2 { font-size: 1.5rem; font-weight: 800; color: #0b1a33; }
        .practice-header .left h2 i { color: #f59e0b; margin-right: 8px; }
        .practice-header .set-tag { background: #0b1a33; color: white; padding: 5px 18px; border-radius: 40px; font-weight: 600; font-size: 0.85rem; }

        .score-bar { display: flex; flex-wrap: wrap; gap: 18px 30px; background: #f8fafc; border-radius: 16px; padding: 12px 22px; margin-bottom: 22px; border: 1px solid #e9eef3; }
        .score-item { display: flex; align-items: center; gap: 8px; font-weight: 500; color: #334155; font-size: 0.9rem; }
        .score-item i { font-size: 1rem; }
        .score-item .num { font-weight: 700; font-size: 1.1rem; color: #0b1a33; }
        .score-item.correct i { color: #27ae60; }
        .score-item.wrong i { color: #e74c3c; }
        .score-item.attempted i { color: #2980b9; }
        .score-item.percent i { color: #f59e0b; }
        .score-item.percent .num { color: #f59e0b; }

        .question-card { background: #ffffff; border-radius: 20px; padding: 22px 26px; margin-bottom: 20px; border: 1px solid #e9eef3; box-shadow: 0 2px 8px rgba(0,0,0,0.02); transition: 0.2s; border-left: 6px solid #f59e0b; }
        .question-card:hover { border-color: #fcd34d; box-shadow: 0 6px 20px rgba(0,0,0,0.04); }
        .q-top { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
        .q-number { font-weight: 800; font-size: 0.95rem; color: #f59e0b; background: #fffbeb; padding: 2px 14px; border-radius: 40px; flex-shrink: 0; }
        .q-text { font-size: 1.05rem; font-weight: 500; color: #0b1a33; line-height: 1.6; }
        .q-text .idiom-highlight { color: #f59e0b; font-weight: 700; border-bottom: 2px solid #f59e0b; padding-bottom: 2px; }
        .q-text .q-type { font-size: 0.8rem; background: #e2e8f0; color: #475569; padding: 2px 14px; border-radius: 40px; font-weight: 700; margin-left: 8px; }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 14px; }
        .options label { display: flex; align-items: center; gap: 10px; font-weight: 500; color: #1e293b; cursor: pointer; font-size: 0.95rem; padding: 10px 16px; border-radius: 12px; transition: 0.2s; background: #f8fafc; border: 1px solid #e9eef3; }
        .options label:hover { background: #fffbeb; border-color: #fcd34d; }
        .options input[type="radio"] { width: 17px; height: 17px; accent-color: #f59e0b; cursor: pointer; flex-shrink: 0; }
        .options label.correct-ans { background: #eafaf1; border-color: #27ae60; color: #1e8449; }
        .options label.wrong-ans { background: #fdedec; border-color: #e74c3c; color: #922b21; }
        .options input[type="radio"]:disabled { cursor: not-allowed; opacity: 0.5; }

        .btn-answer { background: #0b1a33; color: white; border: none; padding: 8px 28px; border-radius: 40px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.25s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-answer:hover:not(:disabled) { background: #f59e0b; color: #0b1a33; transform: translateY(-2px); box-shadow: 0 6px 18px rgba(245,158,11,0.3); }
        .btn-answer:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

        .answer-box { margin-top: 14px; padding: 14px 20px; border-radius: 14px; background: #fffbeb; border-left: 6px solid #f59e0b; display: none; animation: slideDown 0.3s ease; }
        @keyframes slideDown { 0% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 1; transform: translateY(0); } }
        .answer-box .correct-word { font-weight: 700; font-size: 1.05rem; color: #27ae60; }
        .answer-box .explanation { margin-top: 6px; color: #2c3e50; font-size: 0.92rem; line-height: 1.6; }
        .answer-box .explanation strong { color: #0b1a33; }
        .answer-box .original-sentence { margin-top: 6px; font-size: 0.85rem; color: #64748b; border-top: 1px solid #fcd34d; padding-top: 8px; }

        .nav-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; padding-top: 18px; border-top: 1px solid #e9eef3; flex-wrap: wrap; gap: 12px; }
        .btn-nav { background: transparent; color: #0b1a33; border: 2px solid #cbd5e1; padding: 8px 22px; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .btn-nav:hover { border-color: #f59e0b; background: #fffbeb; }
        .btn-nav.primary { background: #0b1a33; color: white; border-color: #0b1a33; }
        .btn-nav.primary:hover { background: #f59e0b; color: #0b1a33; border-color: #f59e0b; }
        .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }
        .page-indicator { font-weight: 600; color: #64748b; background: #f1f5f9; padding: 4px 18px; border-radius: 40px; font-size: 0.85rem; }

        @media (max-width: 700px) {
            .page { padding: 20px 16px; }
            .cover-title { font-size: 2rem; }
            .sets-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
            .set-card { padding: 14px 10px; }
            .set-card .set-num { font-size: 1.4rem; }
            .practice-header .left h2 { font-size: 1.2rem; }
            .question-card { padding: 16px 16px; }
            .q-text { font-size: 0.95rem; }
            .options { grid-template-columns: 1fr; gap: 8px; }
            .options label { font-size: 0.9rem; padding: 8px 12px; }
            .score-bar { gap: 10px 16px; padding: 10px 14px; }
            .score-item { font-size: 0.8rem; }
            .score-item .num { font-size: 0.95rem; }
            .nav-footer { flex-direction: column; align-items: stretch; }
            .btn-nav { justify-content: center; }
            .header { padding: 12px 16px; }
            .logo-text { font-size: 1.2rem; }
        }
        @media (max-width: 480px) {
            .sets-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .set-card .set-num { font-size: 1.2rem; }
            .cover-title { font-size: 1.6rem; }
            .options { grid-template-columns: 1fr; }
            .btn-answer { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
<div class="app-container">

    <div class="header">
        <a href="#" class="logo" onclick="goToDashboard(); return false;">
            <div class="logo-icon"><i class="fas fa-exchange-alt"></i></div>
            <div class="logo-text">SSC <span>MOCK</span></div>
        </a>
        <div class="header-badge"><i class="fas fa-pencil-alt"></i> Idioms & Phrases</div>
    </div>

    <div class="page active" id="page-dashboard">
        <div class="cover-top">
            <div class="cover-badge"><i class="fas fa-star"></i> SSC CGL / CHSL / CPO / MTS</div>
            <h1 class="cover-title"><span class="highlight">500+</span> Idioms<br>& Phrases Practice</h1>
            <div class="cover-subtitle">Master Idioms</div>
            <p class="cover-desc">Based on SSC Previous Year Questions – 20 Sets × 25 MCQs = 500+ Questions</p>

        <div class="text-center">

        </div>
    </div>

    <div class="page" id="page-practice">
        <div class="practice-header">
            <div class="left">
                <button class="btn-nav" onclick="goToDashboard()" style="padding:6px 14px;font-size:0.8rem;"><i class="fas fa-arrow-left"></i> Sets</button>
                <h2><i class="fas fa-pen-fancy"></i> <span id="setTitle">Set 1</span></h2>
            </div>
            <span class="set-tag" id="setTag"><i class="fas fa-layer-group"></i> Set 1 / 20</span>
        </div>

        <div class="score-bar">

            <div class="score-item wrong"><i class="fas fa-times-circle"></i> Wrong: <span class="num" id="wrongCount">0</span></div>
            <div class="score-item attempted"><i class="fas fa-flag"></i> Attempted: <span class="num" id="attemptedCount">0</span></div>
            <div class="score-item percent"><i class="fas fa-star"></i> Score: <span class="num" id="scorePercent">0</span>%</div>
        </div>

        <div id="questionsContainer"></div>

        <div class="nav-footer">
            <button class="btn-nav" id="prevSetBtn" onclick="changeSet(-1)"><i class="fas fa-chevron-left"></i> Previous</button>
            <span class="page-indicator" id="setIndicator">Set 1 of 20</span>
            <button class="btn-nav primary" id="nextSetBtn" onclick="changeSet(1)">Next <i class="fas fa-chevron-right"></i></button>
        </div>
    </div>
</div>

            [opts[i], opts[j]] = [opts[j], opts[i]];
        }
        const correctIdx = opts.indexOf(correctAnswer);
        const explanation = askMeaning
            ? `"${idiom}" का अर्थ है: "${meaning}"। उदाहरण: "${example}"`
            : `दिए गए वाक्य के लिए सही मुहावरा है: "${idiom}" जिसका अर्थ है: "${meaning}"।`;
        qs.push({
            id: idx + 1,
            question: questionText,
            options: opts,
            correctIndex: correctIdx,
            correctAnswer: correctAnswer,
            type: qType,
            explanation: explanation,
            idiom: idiom,
            meaning: meaning,
            example: example,
            set: Math.floor(idx / PER_SET) + 1
        });
    });
    return qs;
}

// ================================================================
// 🎮 STATE
// ================================================================
let allQuestions = [];
let currentSet = 1;
let setProgress = {};
let selectedOptions = {};
let answeredQuestions = {};

function init() {
    allQuestions = buildAllQuestions();
    for (let s = 1; s <= TOTAL_SETS; s++) {
        setProgress[s] = { attempted: 0, correct: 0, wrong: 0 };
    }
    renderDashboard();
    renderSet(1);
}

function renderDashboard() {
    const grid = document.getElementById('setsGrid');
    let html = '';
    let totalAttempted = 0, totalCorrect = 0;
    for (let s = 1; s <= TOTAL_SETS; s++) {
        const p = setProgress[s] || { attempted: 0, correct: 0, wrong: 0 };
        totalAttempted += p.attempted;
        totalCorrect += p.correct;
        const status = p.attempted === 0 ? 'notstarted' : (p.attempted === PER_SET ? 'completed' : 'inprogress');
        const label = status === 'notstarted' ? 'Not Started' : (status === 'completed' ? '✅ Done' : '⏳ In Progress');
        const pct = p.attempted === 0 ? 0 : Math.round((p.correct / p.attempted) * 100);
        html += `
            <div class="set-card" onclick="openSet(${s})">
                <div class="set-status ${status}">${label}</div>
                <div class="set-num">${s}</div>
                <div class="set-label">Set ${s}</div>
                <div class="set-progress">${p.attempted}/${PER_SET} · ${pct}%</div>
            </div>
        `;
    }
    grid.innerHTML = html;
    const totalQ = TOTAL_SETS * PER_SET;
    document.getElementById('overallProgressText').textContent = `${totalAttempted} / ${totalQ}`;
    document.getElementById('overallProgressBar').style.width = `${(totalAttempted / totalQ) * 100}%`;
    document.getElementById('overallScoreText').textContent = totalAttempted === 0 ? '0%' : `${Math.round((totalCorrect / totalAttempted) * 100)}%`;
}

function renderSet(setNum) {
    currentSet = setNum;
    const questions = allQuestions.filter(q => q.set === setNum);
    const container = document.getElementById('questionsContainer');
    const p = setProgress[setNum] || { attempted: 0, correct: 0, wrong: 0 };

    document.getElementById('setTitle').textContent = `Set ${setNum}`;
    document.getElementById('setTag').innerHTML = `<i class="fas fa-layer-group"></i> Set ${setNum} / ${TOTAL_SETS}`;
    document.getElementById('setIndicator').textContent = `Set ${setNum} of ${TOTAL_SETS}`;

    document.getElementById('correctCount').textContent = p.correct || 0;
    document.getElementById('wrongCount').textContent = p.wrong || 0;
    document.getElementById('attemptedCount').textContent = p.attempted || 0;
    const pct = p.attempted === 0 ? 0 : Math.round((p.correct / p.attempted) * 100);
    document.getElementById('scorePercent').textContent = pct;

    document.getElementById('prevSetBtn').disabled = (setNum === 1);
    document.getElementById('nextSetBtn').disabled = (setNum === TOTAL_SETS);

    let html = '';
    questions.forEach((q, idx) => {
        const qNum = idx + 1;
        const isAnswered = answeredQuestions[q.id] || false;
        const selected = selectedOptions[q.id];
        html += `
            <div class="question-card" id="qcard-${q.id}">
                <div class="q-top">
                    <span class="q-number">Q${qNum}</span>
                    <span class="q-text">
                        ${q.question}
                        <span class="q-type">${q.type}</span>
                    </span>
                </div>
                <div class="options" id="options-${q.id}">
                    ${q.options.map((opt, oi) => `
                        <label>
                            <input type="radio" name="q${q.id}" value="${oi}" 
                                ${isAnswered ? 'disabled' : ''}
                                onchange="selectOption(${q.id}, ${oi})">
                            ${opt}
                        </label>
                    `).join('')}
                </div>
                <button class="btn-answer" id="btn-${q.id}" 
                    onclick="showAnswer(${q.id})" 
                    ${isAnswered ? 'disabled' : ''}>
                    <i class="fas fa-eye"></i> Show Answer
                </button>
                <div class="answer-box" id="answer-${q.id}">
                    <div><span class="correct-word">✔ ${q.correctAnswer}</span> <span id="result-${q.id}"></span></div>
                    <div class="explanation"><strong>💡 Explanation:</strong> ${q.explanation}</div>
                    ${q.type === 'Meaning' ? `<div class="original-sentence"><i class="fas fa-quote-left"></i> Example: ${q.example}</div>` : ''}
                </div>
            </div>
        `;
    });
    container.innerHTML = html;

    questions.forEach(q => {
        if (answeredQuestions[q.id]) {
            const ansBox = document.getElementById(`answer-${q.id}`);
            if (ansBox) ansBox.style.display = 'block';
            const selected = selectedOptions[q.id];
            const isCorrect = (selected === q.correctIndex);
            const resultSpan = document.getElementById(`result-${q.id}`);
            if (resultSpan) {
                if (isCorrect) { resultSpan.innerHTML = ' ✅ Correct!'; resultSpan.style.color = '#27ae60'; }
                else { const chosen = q.options[selected] || 'None'; resultSpan.innerHTML = ` ❌ Your answer: ${chosen}`; resultSpan.style.color = '#e74c3c'; }
            }
            const optContainer = document.getElementById(`options-${q.id}`);
            if (optContainer) {
                const labels = optContainer.querySelectorAll('label');
                labels.forEach((label, idx) => {
                    if (idx === q.correctIndex) label.classList.add('correct-ans');
                    else if (idx === selected && !isCorrect) label.classList.add('wrong-ans');
                    const radio = label.querySelector('input');
                    if (radio) radio.disabled = true;
                });
            }
            const btn = document.getElementById(`btn-${q.id}`);
            if (btn) btn.disabled = true;
        }
    });
    renderDashboard();
}

function selectOption(qId, idx) {
    if (answeredQuestions[qId]) return;
    selectedOptions[qId] = idx;
}

function showAnswer(qId) {
    if (answeredQuestions[qId]) return;
    const q = allQuestions.find(item => item.id === qId);
    if (!q) return;
    const selected = selectedOptions[qId];
    const isCorrect = (selected === q.correctIndex);

    answeredQuestions[qId] = true;
    const p = setProgress[q.set] || { attempted: 0, correct: 0, wrong: 0 };
    p.attempted++;
    if (isCorrect) p.correct++;
    else p.wrong++;
    setProgress[q.set] = p;

    const ansBox = document.getElementById(`answer-${q.id}`);
    if (ansBox) ansBox.style.display = 'block';

    const resultSpan = document.getElementById(`result-${q.id}`);
    if (resultSpan) {
        if (isCorrect) { resultSpan.innerHTML = ' ✅ Correct!'; resultSpan.style.color = '#27ae60'; }
        else { const chosen = q.options[selected] || 'None'; resultSpan.innerHTML = ` ❌ Your answer: ${chosen}`; resultSpan.style.color = '#e74c3c'; }
    }

    const optContainer = document.getElementById(`options-${q.id}`);
    if (optContainer) {
        const labels = optContainer.querySelectorAll('label');
        labels.forEach((label, idx) => {
            if (idx === q.correctIndex) label.classList.add('correct-ans');
            else if (idx === selected && !isCorrect) label.classList.add('wrong-ans');
            const radio = label.querySelector('input');
            if (radio) radio.disabled = true;
        });
    }
    const btn = document.getElementById(`btn-${q.id}`);
    if (btn) btn.disabled = true;

    renderSet(q.set);
}

function openSet(setNum) {
    if (setNum < 1 || setNum > TOTAL_SETS) return;
    document.getElementById('page-dashboard').classList.remove('active');
    document.getElementById('page-practice').classList.add('active');
    renderSet(setNum);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goToDashboard() {
    document.getElementById('page-practice').classList.remove('active');
    document.getElementById('page-dashboard').classList.add('active');
    renderDashboard();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function changeSet(delta) {
    const newSet = currentSet + delta;
    if (newSet < 1 || newSet > TOTAL_SETS) return;
    openSet(newSet);
}

function resetAllProgress() {
    if (!confirm('Reset all progress for all sets? This cannot be undone.')) return;
    for (let s = 1; s <= TOTAL_SETS; s++) {
        setProgress[s] = { attempted: 0, correct: 0, wrong: 0 };
    }
    selectedOptions = {};
    answeredQuestions = {};
    allQuestions = buildAllQuestions();
    renderDashboard();
    if (document.getElementById('page-practice').classList.contains('active')) {
        renderSet(currentSet);
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>

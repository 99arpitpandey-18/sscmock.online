<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSC MOCK Portal</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:#eef4fb;
color:#123;
}

header{
height:70px;
background:linear-gradient(135deg,#08245c,#1565d8);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
color:#fff;
position:sticky;
top:0;
z-index:100;
box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.logo{
display:flex;
align-items:center;
gap:12px;
font-size:22px;
font-weight:bold;
}

.logo div{
width:48px;
height:48px;
background:#fff;
color:#1565d8;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.search{
padding:10px 16px;
border:none;
border-radius:30px;
width:260px;
}

.hero{
padding:45px 20px;
text-align:center;
background:linear-gradient(180deg,#1565d8,#0b47a8);
color:#fff;
}

.hero h1{
font-size:40px;
margin-bottom:10px;
}

.hero p{
font-size:18px;
opacity:.9;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
max-width:1000px;
margin:30px auto;
}

.stat{
background:#fff;
padding:20px;
border-radius:14px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.stat h2{
color:#1565d8;
font-size:34px;
}

.container{
max-width:1400px;
margin:auto;
padding:25px;
}

.examGrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:25px;
}

.examCard{
background:#fff;
border-radius:18px;
padding:22px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
transition:.3s;
border:1px solid #dbe8f5;
}

.examCard:hover{
transform:translateY(-8px);
}

.examLogo{
width:70px;
height:70px;
margin:auto;
margin-bottom:15px;
}

.examLogo img{
width:100%;
height:100%;
}

.examCard h3{
text-align:center;
margin-bottom:15px;
color:#0c49a8;
}

.examCard ul{
list-style:none;
margin-bottom:20px;
}

.examCard li{
padding:7px 0;
}

.examBtn{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#1565d8;
color:#fff;
font-weight:bold;
cursor:pointer;
}

.examBtn:hover{
background:#0c49a8;
}

/* TEST PAGE */

#testSection{
display:none;
animation:fade .4s;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px)}
to{opacity:1}
}

.back{
padding:10px 18px;
border:none;
background:#fff;
border-radius:8px;
cursor:pointer;
margin-bottom:20px;
}

.testHeader{
background:#fff;
padding:22px;
border-radius:14px;
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
box-shadow:0 8px 18px rgba(0,0,0,.08);
}

.testList{
display:grid;
gap:14px;
}

.testItem{
background:#fff;
padding:18px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 6px 18px rgba(0,0,0,.06);
transition:.25s;
}

.testItem:hover{
transform:translateX(6px);
}

.badge{
padding:6px 12px;
border-radius:30px;
font-size:12px;
font-weight:bold;
}

.mock{
background:#e8f2ff;
color:#1565d8;
}

.pyq{
background:#fff3df;
color:#c06a00;
}

.startBtn{
padding:10px 18px;
background:#1565d8;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.startBtn:hover{
background:#0b47a8;
}

@media(max-width:768px){

.stats{
grid-template-columns:repeat(2,1fr);
}

header{
flex-wrap:wrap;
height:auto;
padding:15px;
gap:10px;
}

.search{
width:100%;
}

.testHeader{
flex-direction:column;
gap:10px;
text-align:center;
}

.testItem{
flex-direction:column;
gap:10px;
text-align:center;
}

}
</style>
</head>
<body>

<header>

<div class="logo">

<div>SSC</div>

SSC MOCK

</div>

<input class="search" id="search" placeholder="Search exam...">

</header>

<section class="hero">

<h1>SSC Mock Test Portal</h1>

<p>Professional Mock Tests • Previous Year Mock • Full CBT Experience</p>

<div class="stats">

<div class="stat"><h2>180</h2>Total Tests</div>

<div class="stat"><h2>90</h2>Mock</div>

<div class="stat"><h2>90</h2>PYQ Mock</div>

<div class="stat"><h2>9</h2>Exams</div>

</div>

</section>

<div class="container">

<div id="examSection">

<div class="examGrid" id="examGrid"></div>

</div>

<div id="testSection">

<button class="back" onclick="goBack()">← Back</button>

<div class="testHeader">

<div>

<h2 id="examTitle"></h2>

<p>10 Mock Tests + 10 Previous Year Mock Tests</p>

</div>

<h2>20 Tests</h2>

</div>

<div class="testList" id="testList"></div>

</div>

</div>

<script>

const exams=[
"SSC CGL Tier 1",
"SSC CGL Tier 2",
"SSC CHSL Tier 1",
"SSC CHSL Tier 2",
"SSC CPO Paper 1",
"SSC CPO Paper 2",
"SSC MTS",
"SSC GD",
"SSC Selection Post",
"SSC Stenographer"
];

const examGrid=document.getElementById("examGrid");

const testList=document.getElementById("testList");

const examTitle=document.getElementById("examTitle");

exams.forEach(name=>{

const card=document.createElement("div");

card.className="examCard";

card.innerHTML=`

<div class="examLogo">

<img src="ssc-exam_1654329802.png">

</div>

<h3>${name}</h3>

<ul>

<li>20 Total Tests</li>

<li>10 Full Mock Tests</li>

<li>10 Previous Year Mock Tests</li>

</ul>

<button class="examBtn">View All Tests</button>

`;

card.querySelector("button").onclick=()=>openExam(name);

examGrid.appendChild(card);

});

function openExam(name){

examTitle.textContent=name;

document.getElementById("examSection").style.display="none";

document.getElementById("testSection").style.display="block";

testList.innerHTML="";

for(let i=1;i<=20;i++){

const type=i<=10?"Mock":"Previous Year";

const cls=i<=10?"mock":"pyq";

const div=document.createElement("div");

div.className="testItem";

div.innerHTML=`

<div>

<h3>${type} Test ${i<=10?i:i-10}</h3>

<div class="badge ${cls}">${type}</div>

</div>

<button class="startBtn" onclick="startTest('${name}',${i})">

Start Test →

</button>

`;

testList.appendChild(div);

}

}

function goBack(){

document.getElementById("testSection").style.display="none";

document.getElementById("examSection").style.display="block";

}

function startTest(exam,id){

alert(exam+" - Test "+id+"\\n\\nYahan tumhara CBT Interface open hoga.");

}

document.getElementById("search").addEventListener("input",e=>{

const value=e.target.value.toLowerCase();

document.querySelectorAll(".examCard").forEach(card=>{

card.style.display=

card.innerText.toLowerCase().includes(value)?"block":"none";

});

});

</script>

</body>
</html>

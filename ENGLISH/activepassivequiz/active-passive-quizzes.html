<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Active & Passive Voice - Quizzes</title>

    <link
        rel="stylesheet"
        href="active-passive-quizzes.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="page-header">

        <div class="header-left">

            <a
                href="active-passive.html"
                class="back-btn"
                aria-label="Go Back"
            >
                ←
            </a>


            <div>

                <h1>
                    Active &amp; Passive Voice
                </h1>

                <p>
                    SSC CGL English Practice
                </p>

            </div>

        </div>


        <div class="header-badge">
            50 Quizzes
        </div>

    </header>



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="container">


        <!-- =================================================
             INTRO
        ================================================== -->

        <section class="intro-section">

            <div>

                <span class="small-label">
                    ENGLISH PRACTICE
                </span>


                <h2>
                    Active &amp; Passive Voice Quizzes
                </h2>


                <p>
                    Practice Active &amp; Passive Voice
                    with 50 topic-wise quizzes.
                    Each quiz contains 10 questions.
                </p>

            </div>


            <!-- =================================================
                 STATS
            ================================================== -->

            <div class="stats">

                <div class="stat-box">

                    <strong>
                        50
                    </strong>

                    <span>
                        Quizzes
                    </span>

                </div>


                <div class="stat-box">

                    <strong>
                        500
                    </strong>

                    <span>
                        Questions
                    </span>

                </div>


                <div class="stat-box">

                    <strong>
                        10
                    </strong>

                    <span>
                        Questions / Quiz
                    </span>

                </div>

            </div>

        </section>



        <!-- =================================================
             FILTER
        ================================================== -->

        <section class="filter-section">

            <button
                type="button"
                class="filter-btn active"
                data-filter="all"
            >
                All Quizzes
            </button>


            <button
                type="button"
                class="filter-btn"
                data-filter="basic"
            >
                Basic
            </button>


            <button
                type="button"
                class="filter-btn"
                data-filter="intermediate"
            >
                Intermediate
            </button>


            <button
                type="button"
                class="filter-btn"
                data-filter="advanced"
            >
                Advanced
            </button>


            <button
                type="button"
                class="filter-btn"
                data-filter="ssc"
            >
                SSC CGL Level
            </button>

        </section>



        <!-- =================================================
             QUIZ GRID
             
             IMPORTANT:
             50 QUIZ CARDS JAVASCRIPT SE AUTOMATICALLY
             GENERATE HONGE.
        ================================================== -->

        <section
            class="quiz-grid"
            id="quizGrid"
        >

            <!--
                active-passive-quizzes.js
                yahan Quiz 01 se Quiz 50 tak
                automatically generate karega.
            -->

        </section>


    </main>



    <!-- =====================================================
         JAVASCRIPT
         
         IMPORTANT:
         Ye file 50 quiz cards generate karegi.
    ====================================================== -->

    <script src="active-passive-quizzes.js"></script>
     

</body>

</html>

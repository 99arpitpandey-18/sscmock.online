<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cloze Test - SSC CGL Quizzes</title>

    <!-- SAME STYLE AS ACTIVE & PASSIVE QUIZ LIST -->
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        /* =================================================
           HEADER
        ================================================= */

        .page-header {
            min-height: 90px;

            background: #ffffff;

            border-bottom: 1px solid #e4e8ef;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 18px 6%;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .back-btn {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            background: #eef4ff;
            color: #1455d9;

            border-radius: 12px;

            font-size: 24px;
            font-weight: bold;

            transition: 0.2s;
        }

        .back-btn:hover {
            background: #1455d9;
            color: #ffffff;
        }

        .page-header h1 {
            font-size: 25px;
            margin-bottom: 5px;
        }

        .page-header p {
            font-size: 14px;
            color: #70798a;
        }

        .header-badge {
            background: #1455d9;
            color: #ffffff;

            padding: 10px 18px;

            border-radius: 25px;

            font-size: 14px;
            font-weight: 700;
        }


        /* =================================================
           CONTAINER
        ================================================= */

        .container {
            width: 88%;
            max-width: 1250px;

            margin: 35px auto 60px;
        }


        /* =================================================
           INTRO
        ================================================= */

        .intro-section {
            background: #ffffff;

            border: 1px solid #e5e9f0;

            border-radius: 18px;

            padding: 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 30px;

            box-shadow:
                0 8px 25px rgba(30, 50, 90, 0.05);
        }

        .small-label {
            font-size: 12px;

            font-weight: 800;

            color: #1455d9;

            letter-spacing: 1.2px;
        }

        .intro-section h2 {
            margin-top: 8px;

            font-size: 28px;
        }

        .intro-section p {
            margin-top: 9px;

            color: #687386;

            font-size: 15px;

            line-height: 1.6;

            max-width: 650px;
        }


        /* =================================================
           STATS
        ================================================= */

        .stats {
            display: flex;
            gap: 12px;
        }

        .stat-box {
            min-width: 105px;

            background: #f6f8fc;

            border: 1px solid #e7ebf2;

            border-radius: 14px;

            padding: 15px;

            text-align: center;
        }

        .stat-box strong {
            display: block;

            font-size: 23px;

            color: #1455d9;
        }

        .stat-box span {
            display: block;

            margin-top: 4px;

            font-size: 12px;

            color: #737c8c;
        }


        /* =================================================
           FILTER
        ================================================= */

        .filter-section {
            display: flex;

            gap: 10px;

            margin: 28px 0;

            flex-wrap: wrap;
        }

        .filter-btn {
            border: 1px solid #dce2eb;

            background: #ffffff;

            color: #586274;

            padding: 10px 17px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;

            transition: 0.2s;
        }

        .filter-btn:hover {
            border-color: #1455d9;

            color: #1455d9;
        }

        .filter-btn.active {
            background: #1455d9;

            color: #ffffff;

            border-color: #1455d9;
        }


        /* =================================================
           QUIZ GRID
        ================================================= */

        .quiz-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;
        }


        /* =================================================
           QUIZ CARD
        ================================================= */

        .quiz-card {
            background: #ffffff;

            border: 1px solid #e3e8f0;

            border-radius: 17px;

            padding: 22px;

            transition: 0.25s;

            box-shadow:
                0 5px 20px rgba(30, 50, 90, 0.04);

            position: relative;

            overflow: hidden;
        }

        .quiz-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 4px;

            background: #1455d9;
        }

        .quiz-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 15px 35px rgba(30, 50, 90, 0.10);

            border-color: #cdd8ec;
        }


        /* =================================================
           CARD TOP
        ================================================= */

        .card-top {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 17px;
        }

        .quiz-number {
            width: 48px;
            height: 48px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background: #eef4ff;

            color: #1455d9;

            font-size: 16px;

            font-weight: 800;
        }

        .difficulty {
            padding: 6px 10px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 800;

            text-transform: uppercase;
        }

        .difficulty.basic {
            background: #eaf8ef;
            color: #168044;
        }

        .difficulty.intermediate {
            background: #fff6df;
            color: #9a6800;
        }

        .difficulty.advanced {
            background: #fff0ec;
            color: #c64b2d;
        }

        .difficulty.ssc {
            background: #f0eaff;
            color: #6840b5;
        }


        /* =================================================
           CARD CONTENT
        ================================================= */

        .quiz-card h3 {
            font-size: 19px;

            margin-bottom: 8px;
        }

        .quiz-card p {
            color: #70798a;

            font-size: 13px;

            line-height: 1.5;

            min-height: 40px;
        }


        /* =================================================
           CARD INFO
        ================================================= */

        .card-info {
            display: flex;

            gap: 15px;

            margin: 18px 0;

            padding-top: 15px;

            border-top: 1px solid #edf0f4;
        }

        .info-item {
            font-size: 12px;

            color: #687386;
        }

        .info-item strong {
            color: #263248;
        }


        /* =================================================
           START BUTTON
        ================================================= */

        .start-btn {
            width: 100%;

            display: block;

            text-align: center;

            text-decoration: none;

            background: #1455d9;

            color: #ffffff;

            padding: 12px;

            border-radius: 10px;

            font-size: 14px;

            font-weight: 700;

            transition: 0.2s;
        }

        .start-btn:hover {
            background: #0e43b2;
        }


        /* =================================================
           LOADING
        ================================================= */

        .loading {
            grid-column: 1 / -1;

            background: #ffffff;

            border: 1px solid #e3e8f0;

            border-radius: 15px;

            padding: 35px;

            text-align: center;

            color: #687386;

            font-size: 15px;
        }


        /* =================================================
           RESPONSIVE
        ================================================= */

        @media (max-width: 950px) {

            .quiz-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .intro-section {
                flex-direction: column;

                align-items: flex-start;
            }

            .stats {
                width: 100%;
            }

            .stat-box {
                flex: 1;
            }
        }


        @media (max-width: 650px) {

            .page-header {
                padding: 15px 4%;
            }

            .page-header h1 {
                font-size: 19px;
            }

            .header-badge {
                display: none;
            }

            .container {
                width: 92%;

                margin-top: 22px;
            }

            .intro-section {
                padding: 22px;
            }

            .intro-section h2 {
                font-size: 23px;
            }

            .stats {
                flex-direction: column;
            }

            .quiz-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="page-header">

        <div class="header-left">

            <a
                href="../new.html"
                class="back-btn"
                aria-label="Go Home"
            >
                ←
            </a>

            <div>

                <h1>
                    Cloze Test
                </h1>

                <p>
                    SSC CGL English Practice
                </p>

            </div>

        </div>


        <div class="header-badge">
            50 Quizzes
        </div>

    </header>



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="container">


        <!-- INTRO -->

        <section class="intro-section">

            <div>

                <span class="small-label">
                    ENGLISH PRACTICE
                </span>

                <h2>
                    Cloze Test Quizzes
                </h2>

                <p>
                    Practice SSC CGL level Cloze Test
                    passages with topic-wise quizzes.
                    Each quiz contains 10 questions.
                </p>

            </div>


            <!-- STATS -->

            <div class="stats">

                <div class="stat-box">

                    <strong>
                        50
                    </strong>

                    <span>
                        Quizzes
                    </span>

                </div>


                <div class="stat-box">

                    <strong>
                        500
                    </strong>

                    <span>
                        Questions
                    </span>

                </div>


                <div class="stat-box">

                    <strong>
                        10
                    </strong>

                    <span>
                        Questions / Quiz
                    </span>

                </div>

            </div>

        </section>



        <!-- =================================================
             FILTER
        ================================================== -->

        <section class="filter-section">

            <button
                type="button"
                class="filter-btn active"
                data-filter="all"
            >
                All Quizzes
            </button>


            <button
                type="button"
                class="filter-btn"
                data-filter="basic"
            >
                Basic
            </button>


            <button
                type="button"
                class="filter-btn"
                data-filter="intermediate"
            >
                Intermediate
            </button>


            <button
                type="button"
                class="filter-btn"
                data-filter="advanced"
            >
                Advanced
            </button>


            <button
                type="button"
                class="filter-btn"
                data-filter="ssc"
            >
                SSC CGL Level
            </button>

        </section>



        <!-- =================================================
             50 QUIZ CARDS
             JavaScript automatically generate karega
        ================================================== -->

        <section
            class="quiz-grid"
            id="quizGrid"
        >

            <div class="loading">
                Loading 50 Cloze Test quizzes...
            </div>

        </section>


    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="cloze-test.js"></script>


</body>

</html>

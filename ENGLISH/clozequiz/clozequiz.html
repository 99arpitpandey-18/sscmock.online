<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cloze Test - SSC CGL</title>

    <link
        rel="stylesheet"
        href="clozequiz.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="quiz-header">

        <div class="quiz-header-left">

            <a
                href="cloze-test.html"
                class="back-btn"
                aria-label="Back to quizzes"
            >
                ←
            </a>

            <div>

                <h1>
                    Cloze Test
                </h1>

                <p>
                    SSC CGL English Practice
                </p>

            </div>

        </div>


        <!-- TIMER -->

        <div
            class="timer-box"
            id="timerBox"
        >

            <span class="timer-label">
                Time
            </span>

            <strong id="timer">
                10:00
            </strong>

        </div>

    </header>



    <!-- =====================================================
         MAIN QUIZ AREA
    ====================================================== -->

    <main class="quiz-container">


        <!-- =================================================
             QUIZ INFORMATION
        ================================================== -->

        <section class="quiz-info-panel">

            <div>

                <span class="question-label">
                    CLOZE TEST
                </span>

                <h2 id="quizTitle">
                    Loading Quiz...
                </h2>

            </div>


            <div class="quiz-progress">

                <span>
                    Question
                </span>

                <strong id="currentQuestion">
                    1
                </strong>

                <span>
                    /
                </span>

                <strong id="totalQuestion">
                    10
                </strong>

            </div>

        </section>



        <!-- =================================================
             PASSAGE
        ================================================== -->

        <section class="passage-card">

            <div class="passage-header">

                <h3>
                    Read the passage carefully
                </h3>

                <span>
                    Cloze Test
                </span>

            </div>


            <div
                class="passage-content"
                id="passageContent"
            >

                Loading passage...

            </div>

        </section>



        <!-- =================================================
             QUESTION
        ================================================== -->

        <section class="question-card">

            <div class="question-number">

                Question
                <span id="questionNumber">
                    1
                </span>

            </div>


            <h2 id="questionText">

                Loading question...

            </h2>


            <!-- OPTIONS -->

            <div
                class="options-container"
                id="optionsContainer"
            >

                <!-- JavaScript options generate karega -->

            </div>

        </section>



        <!-- =================================================
             NAVIGATION
        ================================================== -->

        <section class="quiz-navigation">


            <button
                type="button"
                id="previousBtn"
                class="nav-btn secondary"
            >

                ← Previous

            </button>


            <div class="question-indicator">

                <span id="answeredCount">
                    0
                </span>

                /

                <span id="answeredTotal">
                    10
                </span>

                Answered

            </div>


            <button
                type="button"
                id="nextBtn"
                class="nav-btn primary"
            >

                Next →

            </button>


        </section>


    </main>



    <!-- =====================================================
         RESULT MODAL
    ====================================================== -->

    <div
        class="result-overlay"
        id="resultOverlay"
        style="display: none;"
    >

        <div class="result-card">


            <div class="result-icon">
                🎯
            </div>


            <h2>
                Test Completed
            </h2>


            <p>
                Your Cloze Test result
            </p>


            <!-- SCORE -->

            <div class="result-score">

                <strong id="finalScore">
                    0/10
                </strong>

            </div>


            <!-- RESULT DETAILS -->

            <div class="result-details">


                <div>

                    <span>
                        Correct
                    </span>

                    <strong id="correctAnswers">
                        0
                    </strong>

                </div>


                <div>

                    <span>
                        Wrong
                    </span>

                    <strong id="wrongAnswers">
                        0
                    </strong>

                </div>


                <div>

                    <span>
                        Unattempted
                    </span>

                    <strong id="unattemptedAnswers">
                        0
                    </strong>

                </div>


            </div>


            <!-- RESULT ACTIONS -->

            <div class="result-actions">


                <button
                    type="button"
                    id="retryBtn"
                    class="nav-btn primary"
                >

                    Try Again

                </button>


                <a
                    href="cloze-test.html"
                    class="nav-btn secondary"
                >

                    All Quizzes

                </a>


            </div>


        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT
         
         IMPORTANT:
         Data pehle load hoga,
         quiz engine uske baad chalega.
    ====================================================== -->

    <script src="cloze-data.js"></script>

    <script src="clozequiz.js"></script>


</body>

</html>

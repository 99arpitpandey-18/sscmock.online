<script>
const questions = [{"n": 1, "q": "Statements:\n1. All engineers are problem-solvers.\n2. Some problem-solvers are creative.\n3. No creative person is careless.\nConclusions:\nI. Some engineers are creative.\nII. Some problem-solvers are not careless.", "opts": [["a", "Only I follows"], ["b", "Only II follows"], ["c", "Both I and II follow"], ["d", "Neither I nor II follows"]], "ans": "b", "explanation": "From statements 2 and 3, some problem-solvers are creative and no creative person is careless; therefore some problem-solvers are not careless. Statement 1 does not establish that any engineer is among those creative problem-solvers.", "note": ""}, {"n": 2, "q": "In a numbering system, 5-digit codes are formed where the first digit cannot be zero. What is the\nmaximum number of such unique codes possible?", "opts": [["a", "90,000"], ["b", "99,999"], ["c", "1,00,000"], ["d", "89,999"]], "ans": "a", "explanation": "The first digit has 9 choices (1–9), and each of the remaining four digits has 10 choices. Thus 9×10×10×10×10 = 90,000.", "note": ""}, {"n": 3, "q": "Assuming the statements given below are true, which of the following conclusions can be logically\ndeduced?\nStatement:\nThe company has introduced flexible working hours for its employees.\nConclusions:\nI. Employees can choose their working time.\nII. The company aims to improve work-life balance.", "opts": [["a", "Only I follows"], ["b", "Only II follows"], ["c", "Both I and II follow"], ["d", "Neither I nor II follows"]], "ans": "a", "explanation": "Flexible working hours directly imply that employees can choose their working time. The statement does not necessarily establish the company’s motive, so II cannot be deduced.", "note": ""}, {"n": 4, "q": "Find the appropriate word that can replace the question mark (?) and logically complete the sequence:\nPager, Mobile, Smartphone, ?", "opts": [["a", "Tablet"], ["b", "Laptop"], ["c", "Smartwatch"], ["d", "Desktop"]], "ans": "c", "explanation": "The sequence shows increasing technological development from pager to mobile to smartphone; the intended next related device is smartwatch.", "note": ""}, {"n": 5, "q": "The ratio of present ages of X and Y is 5 : 6. After 4 years, the ratio will be 6 : 7. What is X’s present age?", "opts": [["a", "20 years"], ["b", "24 years"], ["c", "30 years"], ["d", "36 years"]], "ans": "a", "explanation": "Let present ages be 5x and 6x. Then (5x+4)/(6x+4)=6/7, giving 35x+28=36x+24, so x=4 and X=20 years.", "note": ""}, {"n": 6, "q": "Some mathematical operations are given below. Choose the expression which is mathematically\ncorrect.\nIf X = 12, Y = 18, and Z = 24, what is the value of ((X + Y) × Z) mod 10?", "opts": [["a", "0"], ["b", "2"], ["c", "6"], ["d", "8"]], "ans": "a", "explanation": "With X=12, Y=18 and Z=24: (X+Y)×Z = 30×24 = 720. The remainder on division by 10 is 0.", "note": ""}, {"n": 7, "q": "Instruction: Identify the assumptions that must hold for the statement to be valid and choose the\ncorrect option.\nStatement:\nExcessive use of social media among teenagers leads to reduced physical activity, increased stress levels,\nand negatively affects mental health.\nAssumptions:\nI. Social media usage influences the lifestyle and habits of teenagers.\nII. Reduced physical activity has no impact on mental health.\nIII. Increased screen time can contribute to stress and mental health issues.", "opts": [["a", "Only I and III are implicit"], ["b", "Only II and III are implicit"], ["c", "Only I is implicit"], ["d", "All assumptions are implicit"]], "ans": "a", "explanation": "The statement requires the idea that social-media use can influence teenagers’ habits and that increased screen time can contribute to stress/mental-health issues. II contradicts the stated negative relationship.", "note": ""}, {"n": 8, "q": "In this question, some conditions are given. You have to make a logical judgment.\n1. All birds have wings.\n2. No mammals have wings.\nWhich of the following must be true?", "opts": [["a", "All winged animals are birds"], ["b", "No birds are mammals"], ["c", "Some birds are mammals"], ["d", "All mammals are flightless"]], "ans": "b", "explanation": "If all birds have wings while no mammals have wings, a bird cannot be a mammal. Hence no birds are mammals.", "note": ""}, {"n": 9, "q": "Which number does NOT belong to the sequence? 4, 10, 15, 28, 40, 54", "opts": [["a", "10"], ["b", "15"], ["c", "28"], ["d", "40"]], "ans": "b", "explanation": "The intended pattern is based on the differences; 15 is the term that does not fit the sequence rule indicated by the question.", "note": ""}, {"n": 10, "q": "Some social situations are given below. Choose the most appropriate course of action.\nYou are leading a team where one member has recently become less communicative and avoids group\ndiscussions, though their work output is satisfactory. Other team members feel coordination is suffering.", "opts": [["a", "Issue a formal warning about communication gaps"], ["b", "Redistribute their tasks to other team members"], ["c", "Have a private, supportive conversation to understand concerns and offer help"], ["d", "Ignore the issue since work quality is unaffected"]], "ans": "c", "explanation": "A private, supportive conversation addresses the behavioural change without immediately escalating the matter and gives the team member an opportunity to explain and seek help.", "note": ""}, {"n": 11, "q": "In the following question, select the related word from the given alternatives:\nJudge : Court :: Doctor : ?", "opts": [["a", "Hospital"], ["b", "Medicine"], ["c", "Patient"], ["d", "Nurse"]], "ans": "a", "explanation": "A judge works in a court; analogously, a doctor works in a hospital.", "note": ""}, {"n": 12, "q": "In this question, four sets of name and address are given, out of which two are exactly same. Find\nthose two combinations.\n1. Bhopal Head Office Bhopal GPO Campus - 462001\n2. Bhopal Head Office Bhopal GPO Campus - 462001\n3. Bhopal Head Office Bhopal PPO Campus - 462001\n4. Bhopal Head Office Bhopal GPO Campas - 462001", "opts": [["a", "1 and 2"], ["b", "1 and 3"], ["c", "2 and 4"], ["d", "3 and 4"]], "ans": "a", "explanation": "Items 1 and 2 are exactly identical: “Bhopal Head Office Bhopal GPO Campus - 462001”.", "note": ""}, {"n": 13, "q": "Some equations are defined using symbols and mathematical relations. Identify the correct value.\nIf X ★ Y = (X - Y)² + Y, then 7 ★ 3 is?", "opts": [["a", "19"], ["b", "20"], ["c", "21"], ["d", "22"]], "ans": "a", "explanation": "Using X ★ Y=(X−Y)²+Y: 7★3=(7−3)²+3=16+3=19.", "note": ""}, {"n": 14, "q": "In the following question, the second term is derived from the first term by applying a specific pattern\ninvolving alphabetical positions and alphanumeric manipulation. Decode the logic and apply it to the\nsecond pair.\nCOLD : P27D :: WARM : ?", "opts": [["a", "J28M"], ["b", "H19M"], ["c", "G28M"], ["d", "J19M"]], "ans": "d", "explanation": "The question’s stated coding pattern is applied from COLD to P27D and then to WARM; following that intended transformation gives J19M.", "note": ""}, {"n": 15, "q": "In a family tree: • A is the mother of B • B is the sister of C • C is the father of D. What is A’s relation to\nD?", "opts": [["a", "Grandmother"], ["b", "Aunt"], ["c", "Mother"], ["d", "Sister"]], "ans": "a", "explanation": "A is mother of B, B is sister of C, and C is father of D. Therefore A is D’s grandmother.", "note": ""}, {"n": 16, "q": "What will come at the place of question mark? 4, 20, 120, 840, ?", "opts": [["a", "6720"], ["b", "7560"], ["c", "8400"], ["d", "7200"]], "ans": "a", "explanation": "The multipliers are 5, 6, 7, so the next multiplier is 8: 840×8=6720.", "note": ""}, {"n": 17, "q": "Find the missing number in the series: 2, 6, 12, 20, ?", "opts": [["a", "28"], ["b", "30"], ["c", "32"], ["d", "36"]], "ans": "b", "explanation": "The terms follow n(n+1): 1×2=2, 2×3=6, 3×4=12, 4×5=20, so next is 5×6=30.", "note": ""}, {"n": 18, "q": "Three of the following four groups are alike in a certain pattern. Find the one which does not belong\nto the group.", "opts": [["a", "ABCD"], ["b", "MNOP"], ["c", "WXYZ"], ["d", "ABDC"]], "ans": "d", "explanation": "ABCD, MNOP and WXYZ are consecutive four-letter groups. ABDC is not in consecutive alphabetical order.", "note": ""}, {"n": 19, "q": "Unscramble the letters to make a meaningful word that fits one of the given categories: LPAENET", "opts": [["a", "City"], ["b", "Animal"], ["c", "Planet"], ["d", "River"]], "ans": "c", "explanation": "LPAENET rearranges to PLANET.", "note": ""}, {"n": 20, "q": "Statement: A team leader prefers a familiar software tool over a newer, more efficient one because the\nold tool has been used for years without major issues. Question: Which cognitive bias is influencing the\ndecision, and how should it be addressed?", "opts": [["a", "Anchoring bias; rely only on first impressions"], ["b", "Status quo bias; compare options using current performance data"], ["c", "Confirmation bias; ignore feedback from others"], ["d", "Availability bias; choose what is most memorable"]], "ans": "b", "explanation": "Choosing the familiar old tool because it has been used for years reflects status quo bias. The better approach is to compare present performance and alternatives using evidence.", "note": ""}, {"n": 21, "q": "If 48 is coded as 2, 6, 8, then what is the code for 75?", "opts": [["a", "3, 5, 15"], ["b", "5, 15, 25"], ["c", "3, 15, 25"], ["d", "5, 25, 75"]], "ans": "a", "explanation": "48 is represented by 2, 6, 8 as its factors. For 75, the corresponding factors are 3, 5 and 15.", "note": ""}, {"n": 22, "q": "In the following question, select the number that will replace the question mark (?) to complete the\nanalogy:\n64 : 343 :: 36 : ?", "opts": [["a", "125"], ["b", "216"], ["c", "256"], ["d", "196"]], "ans": "a", "explanation": "64=4³ and 343=7³. Thus 36=6²; following the intended analogy gives 5³=125.", "note": ""}, {"n": 23, "q": "Few letters are given followed by a question mark (?). These letters follow a specific pattern. Choose\nthe correct option that can replace the question mark.\nCC, FF, JJ, OO, ?", "opts": [["a", "TT"], ["b", "SS"], ["c", "RR"], ["d", "UU"]], "ans": "d", "explanation": "The starting letters advance by +3, +4, +5, so after O the next increment is +6, giving U; hence UU is the intended pair.", "note": ""}, {"n": 24, "q": "Read the following scenario carefully and choose the most appropriate course of action.\nScenario: You notice that a colleague has repeatedly missed deadlines, affecting team performance. They\nseem stressed but deny any problem. Question: What should you do?", "opts": [["a", "Report the colleague immediately to senior management for disciplinary action."], ["b", "Ignore the situation and adjust your own work to compensate for the delays."], ["c", "Speak to the colleague privately to understand the issue and help find a solution."], ["d", "Publicly warn the colleague during a team meeting to improve accountability."]], "ans": "c", "explanation": "A private discussion can uncover the cause of the stress and help solve the deadline problem without public embarrassment.", "note": ""}, {"n": 25, "q": "Each question has four options. Three of them go together based on a common rule. One is different.\nIdentify the odd one.", "opts": [["a", "6 : 21"], ["b", "7 : 28"], ["c", "8 : 36"], ["d", "9 : 40"]], "ans": "d", "explanation": "6:21, 7:28 and 8:36 follow n:(n(n−1)/2 + n) = n:n(n+1)/2. For 9 the matching value would be 45, not 40.", "note": ""}, {"n": 26, "q": "Iso-cost line is also known as ________ line.", "opts": [["a", "budget"], ["b", "Output"], ["c", "demand"], ["d", "revenue"]], "ans": "a", "explanation": "An iso-cost line shows combinations of inputs that can be purchased for the same total cost, so it is a budget line.", "note": ""}, {"n": 27, "q": "The concept of “sustainable development” emphasizes:", "opts": [["a", "Unlimited industrial growth without environmental concerns"], ["b", "Meeting present needs without compromising the ability of future generations to meet their own needs"], ["c", "Maximizing GDP irrespective of resource depletion"], ["d", "Promoting only urban development"]], "ans": "b", "explanation": "Sustainable development means meeting present needs while preserving the ability of future generations to meet their needs.", "note": ""}, {"n": 28, "q": "Which Article of the Indian Constitution provides for the abolition of untouchability?", "opts": [["a", "Article 15"], ["b", "Article 16"], ["c", "Article 17"], ["d", "Article 18"]], "ans": "c", "explanation": "Article 17 of the Constitution abolishes untouchability.", "note": ""}, {"n": 29, "q": "Which cell organelle is known as the “powerhouse of the cell”?", "opts": [["a", "Ribosome"], ["b", "Chloroplast"], ["c", "Mitochondria"], ["d", "Nucleus"]], "ans": "c", "explanation": "Mitochondria generate most of the cell’s usable energy through cellular respiration, hence the term powerhouse of the cell.", "note": ""}, {"n": 30, "q": "Which statement is correct about India’s performance in the ICC Cricket World Cup 2011?", "opts": [["a", "India lost in the semi-finals to Australia."], ["b", "India defeated Sri Lanka in the final to win the title."], ["c", "India did not qualify for the knockout stage."], ["d", "The tournament was hosted only by India."]], "ans": "b", "explanation": "India defeated Sri Lanka in the 2011 final and won the ICC Cricket World Cup.", "note": ""}, {"n": 31, "q": "Which among the following pairs is NOT correctly matched about Indian classical dance forms and\ntheir states?", "opts": [["a", "Kathak – Uttar Pradesh"], ["b", "Bharatanatyam – Tamil Nadu"], ["c", "Kuchipudi – Kerala"], ["d", "Odissi – Odisha"]], "ans": "c", "explanation": "Kuchipudi is associated with Andhra Pradesh, not Kerala; therefore that pair is mismatched.", "note": ""}, {"n": 32, "q": "What is the primary objective of the Gaganyaan Mission launched by ISRO?", "opts": [["a", "Launching communication satellites"], ["b", "Sending Indian astronauts into space"], ["c", "Exploring Mars surface"], ["d", "Studying ocean currents"]], "ans": "b", "explanation": "Gaganyaan is India’s human-spaceflight programme, intended to send Indian astronauts into space.", "note": ""}, {"n": 33, "q": "Which Constitutional Amendment lowered the voting age from 21 years to 18 years in India?", "opts": [["a", "42nd Amendment"], ["b", "44th Amendment"], ["c", "61st Amendment"], ["d", "73rd Amendment"]], "ans": "c", "explanation": "The 61st Constitutional Amendment reduced the voting age from 21 to 18 years.", "note": ""}, {"n": 34, "q": "In Hindustani classical music, which instrument is primarily used to maintain the rhythmic cycle\n(taal)?", "opts": [["a", "Tabla"], ["b", "Sitar"], ["c", "Flute"], ["d", "Violin"]], "ans": "a", "explanation": "Tabla is the principal percussion instrument used to maintain taal, the rhythmic cycle, in Hindustani classical music.", "note": ""}, {"n": 35, "q": "Which of the following agencies is responsible for managing India’s space research and satellite\nlaunches?", "opts": [["a", "DRDO"], ["b", "ISRO"], ["c", "NASA"], ["d", "HAL"]], "ans": "b", "explanation": "ISRO is India’s national space agency responsible for space research and satellite/launch activities.", "note": ""}, {"n": 36, "q": "Which of the following is an example of an endothermic reaction?", "opts": [["a", "Combustion of coal"], ["b", "Respiration"], ["c", "Melting of ice"], ["d", "Burning of LPG"]], "ans": "c", "explanation": "Melting ice absorbs heat from the surroundings, so it is an endothermic process.", "note": ""}, {"n": 37, "q": "Read the following statements marked as Assertion (A) and Reason (R). Mark the correct option:\nAssertion (A): The monsoon winds in India are seasonal in nature.\nReason (R): The differential heating of land and sea causes seasonal reversal of wind direction.", "opts": [["a", "Both A and R are true, and R is the correct explanation of A."], ["b", "Both A and R are true, but R is not the correct explanation of A."], ["c", "A is true, but R is false."], ["d", "A is false, but R is true."]], "ans": "a", "explanation": "Land and sea heat differently, creating seasonal pressure changes and reversal of monsoon wind direction; therefore R correctly explains A.", "note": ""}, {"n": 38, "q": "Which of the following is NOT a rabi crop?\n1. Wheat\n2. Gram\n3. Rice\n4. Mustard\n5. Barley\n6. Peas", "opts": [["a", "1, 2, 5"], ["b", "3"], ["c", "3, 4, 6"], ["d", "2, 4, 6"]], "ans": "b", "explanation": "Rice is a kharif crop, whereas wheat, gram, mustard, barley and peas are rabi crops.", "note": ""}, {"n": 39, "q": "Who launched the PM Gati Shakti National Master Plan in India?", "opts": [["a", "Narendra Modi"], ["b", "Amit Shah"], ["c", "Nitin Gadkari"], ["d", "Piyush Goyal"]], "ans": "a", "explanation": "PM Gati Shakti National Master Plan was launched by Prime Minister Narendra Modi.", "note": ""}, {"n": 40, "q": "Which of the following statements accurately describes the book ‘Wings of Fire’ by A.P.J. Abdul Kalam?", "opts": [["a", "A fictional novel on space exploration"], ["b", "Autobiography of A.P.J. Abdul Kalam"], ["c", "A detailed study of India’s foreign policy"], ["d", "A scientific textbook on missile technology"]], "ans": "b", "explanation": "Wings of Fire is the autobiography of A.P.J. Abdul Kalam, written with Arun Tiwari.", "note": ""}, {"n": 41, "q": "Which Article of the Constitution empowers the Supreme Court to transfer cases from one High Court\nto another?", "opts": [["a", "Article 131"], ["b", "Article 139A"], ["c", "Article 226"], ["d", "Article 142"]], "ans": "b", "explanation": "Article 139A empowers the Supreme Court to transfer certain cases from one High Court to another.", "note": ""}, {"n": 42, "q": "Read the following statements marked as Assertion (A) and Reason (R).\nAssertion (A): The Non-Cooperation Movement was launched in 1920.\nReason (R): It was started in response to the Jallianwala Bagh massacre and the Khilafat issue.", "opts": [["a", "Both A and R are true, and R is the correct explanation of A."], ["b", "Both A and R are true, but R is not the correct explanation of A."], ["c", "A is true, but R is false."], ["d", "A is false, but R is true."]], "ans": "a", "explanation": "The Non-Cooperation Movement began in 1920, driven by opposition to the Jallianwala Bagh tragedy and support for the Khilafat cause; R explains A.", "note": ""}, {"n": 43, "q": "Which of the following pairs of Mughal rulers and their immediate successors is correctly matched?", "opts": [["a", "Humayun – Jahangir"], ["b", "Akbar – Jahangir"], ["c", "Jahangir – Aurangzeb"], ["d", "Shah Jahan – Akbar"]], "ans": "b", "explanation": "Akbar was succeeded by Jahangir.", "note": ""}, {"n": 44, "q": "Consider the following statements about the Quad grouping (India, USA, Japan, Australia):\n1. The Quad was revived in 2017.\n2. It primarily focuses on promoting a free and open Indo-Pacific region.\n3. China is a permanent member of the Quad.\nWhich of the above statements is/are correct?", "opts": [["a", "1 and 2 only"], ["b", "2 and 3 only"], ["c", "1 and 3 only"], ["d", "1, 2 and 3"]], "ans": "a", "explanation": "The Quad was revived in 2017 and promotes a free and open Indo-Pacific. China is not a Quad member.", "note": ""}, {"n": 45, "q": "Which of the following statements about the Goods and Services Tax (GST) Council is/are correct?\n1. It is chaired by the Union Finance Minister.\n2. It includes the Finance Ministers of all States.\n3. Its decisions are binding without any voting mechanism.", "opts": [["a", "1 and 2 only"], ["b", "2 and 3 only"], ["c", "1 and 3 only"], ["d", "1, 2 and 3"]], "ans": "a", "explanation": "The GST Council is chaired by the Union Finance Minister and includes state finance ministers; its decisions operate through the Council’s voting mechanism.", "note": ""}, {"n": 46, "q": "Which of the following rivers flows into the Arabian Sea?", "opts": [["a", "Godavari"], ["b", "Krishna"], ["c", "Narmada"], ["d", "Mahanadi"]], "ans": "c", "explanation": "Narmada flows westward into the Arabian Sea. Godavari, Krishna and Mahanadi flow eastward to the Bay of Bengal.", "note": ""}, {"n": 47, "q": "Read the following two statements carefully and choose the correct option:\nStatement 1: The 73rd Constitutional Amendment Act deals with Panchayati Raj Institutions.\nStatement 2: It added Part IX to the Constitution of India.", "opts": [["a", "Only 1"], ["b", "Only 2"], ["c", "Both 1 and 2 are correct"], ["d", "Neither 1 nor 2 is correct"]], "ans": "c", "explanation": "The 73rd Amendment concerns Panchayati Raj and inserted Part IX into the Constitution, so both statements are correct.", "note": ""}, {"n": 48, "q": "Match the space mission with its primary objective:\n1. Chandrayaan-1 - Moon exploration\n2. Gaganyaan - Human spaceflight\n3. Astrosat - Space observatory", "opts": [["a", "1–Human spaceflight, 2–Moon exploration, 3–Mars study"], ["b", "1–Moon exploration, 2–Human spaceflight, 3–Space observatory"], ["c", "1–Mars orbit, 2–Sun study, 3–Lunar rover"], ["d", "1–Space observatory, 2–Mars orbit, 3–Human spaceflight"]], "ans": "b", "explanation": "Chandrayaan-1 is a lunar mission, Gaganyaan concerns human spaceflight, and Astrosat is a space observatory.", "note": ""}, {"n": 49, "q": "Which of the following is a macroeconomic objective of the 1991 Economic Reforms in India?", "opts": [["a", "Nationalization of private banks"], ["b", "Increasing import restrictions"], ["c", "Liberalization of trade and industry"], ["d", "Abolition of private sector participation"]], "ans": "c", "explanation": "The 1991 reforms emphasized liberalization, including opening trade and industry to greater competition and participation.", "note": ""}, {"n": 50, "q": "Match the Constitutional Amendment with its key feature:\n1. 42nd Amendment Act - Added Fundamental Duties\n2. 44th Amendment Act - Restored certain Emergency provisions\n3. 73rd Amendment Act - Panchayati Raj Institutions", "opts": [["a", "1–Right to Property removed from Fundamental Rights, 2–Added Fundamental Duties, 3–Panchayati\nRaj"], ["b", "1–Added Fundamental Duties, 2–Restored certain Emergency provisions, 3–Panchayati Raj Institutions"], ["c", "1–Panchayati Raj, 2–Added Fundamental Duties, 3–Emergency provisions"], ["d", "1–Emergency provisions strengthened, 2–Panchayati Raj, 3–Added Fundamental Duties"]], "ans": "b", "explanation": "The 42nd Amendment added Fundamental Duties; the 44th restored/changed certain Emergency safeguards; the 73rd constitutionalized Panchayati Raj.", "note": ""}, {"n": 51, "q": "Find the value of: 1/(3−√8) + 6 + 1/(3+√8) + 6/(9−8)", "opts": [["a", "4√2"], ["b", "4√2"], ["c", "6"], ["d", "3√2"]], "ans": "a", "note": "The source text places parts of this expression after the answer line; the displayed expression is reconstructed only from those source fragments.", "explanation": "The supplied text contains a fragmented mathematical expression. The answer key provided with the source marks option (a); the source formatting is insufficient to independently verify every algebraic step."}, {"n": 52, "q": "Two cars start from places A and B, 100 km apart, towards each other and meet in 1 hour. If they travel\nin the same direction, they meet in 5 hours. Find the speed of the faster car.", "opts": [["a", "60 km/h"], ["b", "40 km/h"], ["c", "70 km/h"], ["d", "80 km/h"]], "ans": "a", "explanation": "When moving toward each other, their combined speed is 100 km/h. In the same direction their relative speed is 20 km/h. Solving v+u=100 and v−u=20 gives the faster speed as 60 km/h.", "note": ""}, {"n": 53, "q": "The difference between CI and SI on a certain sum for 2 years at 15% per annum is ₹225. Find the\nsum.", "opts": [["a", "₹8,000"], ["b", "₹9,000"], ["c", "₹10,000"], ["d", "₹12,000"]], "ans": "c", "explanation": "For two years, CI−SI = P(r/100)². Thus 225=P×(15/100)²=P×0.0225, giving P=10,000.", "note": ""}, {"n": 54, "q": "A cricketer has an average of 45 runs in 14 innings. How many runs must he score in the 15th inning\nto increase his average to 47?", "opts": [["a", "70"], ["b", "75"], ["c", "68"], ["d", "72"]], "ans": "b", "explanation": "Current total =45×14=630. Required total for average 47 over 15 innings =47×15=705. Required 15th-innings score=705−630=75.", "note": ""}, {"n": 55, "q": "The profit made by selling an article for ₹1200 is equal to the loss incurred by selling it for ₹900. What\nshould be the selling price to gain 20%?", "opts": [["a", "₹1260"], ["b", "₹1300"], ["c", "₹1150"], ["d", "₹1250"]], "ans": "a", "explanation": "Equal profit at ₹1200 and loss at ₹900 means cost price is midway: ₹1050. A 20% gain gives 1050×1.20=₹1260.", "note": ""}, {"n": 56, "q": "Find the value of (3^x + 3x)(9^(x²) − 9 + 9x²) if x = 2", "opts": [["a", "1755/8"], ["b", "1865/8"], ["c", "1701/8"], ["d", "1650/8"]], "ans": "a", "note": "The source extraction breaks the mathematical expression across lines. The formula above is a direct visual-order reconstruction of those fragments.", "explanation": "The mathematical expression is fragmented in the supplied text. The source answer is option (a); the available extraction does not preserve enough structure to independently reproduce the intended algebraic simplification."}, {"n": 57, "q": "A merchant mixes 30 kg of tea at ₹400/kg with 20 kg of tea at ₹500/kg. He sells the mixture at\n₹480/kg. What is his profit percentage?", "opts": [["a", "8.5%"], ["b", "9.09%"], ["c", "10%"], ["d", "11.11%"]], "ans": "b", "explanation": "Cost =30×400+20×500=22,000 for 50 kg, so CP=₹440/kg. At ₹480/kg, profit is ₹40/kg; profit%=40/440×100≈9.09%.", "note": ""}, {"n": 58, "q": "What percent of 0.1 cubic meters is 50,000 cubic centimeters?", "opts": [["a", "25%"], ["b", "50%"], ["c", "10%"], ["d", "5%"]], "ans": "b", "explanation": "0.1 m³ =100,000 cm³. Therefore 50,000 cm³ is half of 100,000 cm³, i.e. 50%.", "note": ""}, {"n": 59, "q": "Two chords AB and CD of a circle intersect intersect at a point P inside the circle. If AP = 10 cm, PB =\n6 cm, and CP = 4 cm, find the length of PD.", "opts": [["a", "12 cm"], ["b", "15 cm"], ["c", "18 cm"], ["d", "14 cm"]], "ans": "b", "explanation": "Intersecting chords give AP×PB=CP×PD. Hence 10×6=4×PD, so PD=15 cm.", "note": ""}, {"n": 60, "q": "In a factory, Machine A produces 70% of the items and Machine B produces 30%. 2% of A's production\nis defective and 5% of B's production is defective. If an item is selected at random and found to be defective,\nwhat is the probability it came from Machine B?", "opts": [["a", "15/29"], ["b", "14/29"], ["c", "12/29"], ["d", "10/29"]], "ans": "a", "explanation": "P(B|defective)=0.30×0.05 /(0.70×0.02+0.30×0.05)=0.015/0.029=15/29.", "note": ""}, {"n": 61, "q": "An equilateral triangle and a square have the same perimeter. What is the ratio of the area of the\ntriangle to the area of the square?", "opts": [["a", "3√3"], ["b", "4:3"], ["c", "4√3\n: 9"], ["d", "9:4√3"]], "ans": "c", "explanation": "Let square side be s. Equal perimeter gives triangle side 4s/3. Triangle area =√3/4×(4s/3)²=4√3s²/9; square area=s². Ratio =4√3:9.", "note": ""}, {"n": 62, "q": "An arc of a circle of radius 21 cm subtends an angle of 60∘ at the center. Find the length of the arc.\n(Use 𝜋 = 22/7)", "opts": [["a", "11 cm"], ["b", "22 cm"], ["c", "33 cm"], ["d", "44 cm"]], "ans": "b", "explanation": "Arc length=(60/360)×2πr=(1/6)×2×22/7×21=22 cm.", "note": ""}, {"n": 63, "q": "A sphere is inscribed in a hemisphere of radius R such that it touches the curved surface and the plane\nbase. What is the radius of this inscribed sphere?", "opts": [["a", "R/2"], ["b", "R/3"], ["c", "R/√2"], ["d", "2R/3"]], "ans": "a", "explanation": "In the symmetric cross-section, the inscribed sphere has radius R/2 when it touches both the plane base and the hemispherical curved surface.", "note": ""}, {"n": 64, "q": "A right prism has a regular hexagonal base of side 6 cm. If the height of the prism is 10 cm, find its\nlateral surface area.", "opts": [["a", "360 cm2"], ["b", "300 cm2"], ["c", "240 cm2"], ["d", "420 cm2"]], "ans": "a", "explanation": "Lateral area of a right prism = perimeter of base × height. Hexagon perimeter=6×6=36, so area=36×10=360 cm².", "note": ""}, {"n": 65, "q": "If sec⁡𝜃 + tan⁡𝜃 = 3, find the value of \\tan⁡𝜃.", "opts": [["a", "3/4"], ["b", "4/3"], ["c", "1/3"], ["d", "5/3"]], "ans": "b", "explanation": "secθ+tanθ=3 and (secθ+tanθ)(secθ−tanθ)=1, so secθ−tanθ=1/3. Subtracting gives 2tanθ=8/3, hence tanθ=4/3.", "note": ""}, {"n": 66, "q": "From the top of a 60 m high tower, the angle of depression of a car moving away changes from 45° to 30° in 5 seconds. What is the speed of the car?", "opts": [["a", "12(√3−1) m/s"], ["b", "12√3 m/s"], ["c", "10(√3−1) m/s"], ["d", "15(√3−1) m/s"]], "ans": "a", "note": "The option suffix “−1) m/s” is split after the answer line in the supplied text and has been visually recombined.", "explanation": "At 45°, horizontal distance is 60 m. At 30°, it is 60√3 m. Distance travelled in 5 s is 60(√3−1), giving speed 12(√3−1) m/s."}, {"n": 67, "q": "What is the largest 4-digit number that is exactly divisible by 72?", "opts": [["a", "9936"], ["b", "9960"], ["c", "9984"], ["d", "9992"]], "ans": "a", "explanation": "The largest four-digit multiple of 72 is floor(9999/72)×72=138×72=9936.", "note": ""}, {"n": 68, "q": "Simplify (√3 + √7)².", "opts": [["a", "10 + 2√21"], ["b", "10 + √21"], ["c", "21 + 2√10"], ["d", "5 + 2√21"]], "ans": "a", "explanation": "(√3+√7)²=3+7+2√21=10+2√21.", "note": ""}, {"n": 69, "q": "A can do a work in 12 days and B in 15 days. They contract to do the work for ₹9,600. With the help\nof C, they finish it in 5 days. How much does C get?", "opts": [["a", "₹2,000"], ["b", "₹2,400"], ["c", "₹2,800"], ["d", "₹3,000"]], "ans": "b", "explanation": "A’s rate=1/12 and B’s=1/15, so together=3/20. In 5 days they do 3/4; C supplies the remaining 1/4, so C earns ₹9600/4=₹2400.", "note": ""}, {"n": 70, "q": "A and B invest ₹50,000 and ₹70,000. After one year, the total profit is ₹24,000. What is A's share of the\nprofit?", "opts": [["a", "₹10,000"], ["b", "₹14,000"], ["c", "₹12,000"], ["d", "₹9,000"]], "ans": "a", "explanation": "Profit is divided in the investment ratio 50,000:70,000=5:7. A gets 5/12 of ₹24,000=₹10,000.", "note": ""}, {"n": 71, "q": "What is the x-intercept of the line 5x + 3y = 15?", "opts": [["a", "5"], ["b", "3"], ["c", "15"], ["d", "2"]], "ans": "b", "explanation": "For the x-intercept set y=0: 5x=15, so x=3.", "note": ""}, {"n": 72, "q": "PA and PB are tangents to a circle from an external point P. If the length of PA is 12 cm, what is the\nlength of PB?", "opts": [["a", "10 cm"], ["b", "12 cm"], ["c", "24 cm"], ["d", "6 cm"]], "ans": "b", "explanation": "Tangents from the same external point to a circle have equal lengths, so PA=PB=12 cm.", "note": ""}, {"n": 73, "q": "In triangle ABC, the area is 60 cm2 and the product of the lengths of its three sides is 2400. Find the\ncircumradius of the triangle.", "opts": [["a", "8 cm"], ["b", "10 cm"], ["c", "12 cm"], ["d", "15 cm"]], "ans": "b", "explanation": "Using Δ=abc/(4R), R=abc/(4Δ)=2400/(4×60)=10 cm.", "note": ""}, {"n": 74, "q": "The mean of a set of 5 numbers is 20. If a number 'p' is added, the mean becomes 22. If another\nnumber 'q' replaces 'p', the mean of the original 5 plus 'q' becomes 24. Find p + q.", "opts": [["a", "60"], ["b", "64"], ["c", "76"], ["d", "78"]], "ans": "c", "explanation": "Original total=5×20=100. With p, total=6×22=132, so p=32. With q, total=132+q−32=6×24=144, giving q=44. Thus p+q=76.", "note": ""}, {"n": 75, "q": "For a given frequency distribution, if the Mean is 50, the Mode is 44, and the Standard Deviation is 4,\nfind the Karl Pearson's coefficient of skewness.", "opts": [["a", "0.5"], ["b", "1.5"], ["c", "2.0"], ["d", "1.2"]], "ans": "b", "explanation": "Karl Pearson’s coefficient = (Mean−Mode)/SD = (50−44)/4 = 1.5.", "note": ""}, {"n": 76, "q": "Find the part of the sentence that contains an error:\nThe talented orator (1)/ managed to put out (2)/ his complex ideas (3)/ to the audience with great clarity.\n(4)", "opts": [["a", "(1)"], ["b", "(2)"], ["c", "(3)"], ["d", "(4)"]], "ans": "b", "explanation": "“Put out his complex ideas” is incorrect in this context; “put across” means communicate ideas clearly to an audience.", "note": ""}, {"n": 77, "q": "What is the one-word substitute for: “The technique of using light and shadow to create depth in\nvisual art”?", "opts": [["a", "Chiaroscuro"], ["b", "Fresco"], ["c", "Mosaic"], ["d", "Pointillism"]], "ans": "a", "explanation": "Chiaroscuro is the artistic technique of using strong contrasts of light and shadow to create depth and volume.", "note": ""}, {"n": 78, "q": "Choose the most suitable option to replace the highlighted part of the sentence:\nRarely, you meet a person so committed to duty.", "opts": [["a", "do you meet"], ["b", "have you meet"], ["c", "you met"], ["d", "did you met"]], "ans": "a", "explanation": "After negative/restrictive “rarely” at the beginning, subject–auxiliary inversion is required: “Rarely do you meet…”.", "note": ""}, {"n": 79, "q": "Which term refers to “a state in which individuals feel anonymous and therefore act with reduced\npersonal accountability”?", "opts": [["a", "Deindividuation"], ["b", "Cognitive Dissonance"], ["c", "Self-Justification"], ["d", "Moral Disengagement"]], "ans": "a", "explanation": "Deindividuation describes reduced self-awareness and personal accountability when people feel anonymous.", "note": ""}, {"n": 80, "q": "Convert the sentence provided below from its passive voice structure to an active voice structure:\nThe minister’s address was being interpreted into several languages by official translators.", "opts": [["a", "Official translators had interpreted the minister’s address into several languages."], ["b", "Official translators are interpreting the minister’s address into several languages."], ["c", "Official translators were interpreting the minister’s address into several languages."], ["d", "Official translators interpreted the minister’s address into several languages."]], "ans": "c", "explanation": "Past continuous passive “was being interpreted” changes to past continuous active: “official translators were interpreting…”.", "note": ""}, {"n": 81, "q": "Select the most appropriate antonym of the given word. Magnanimous", "opts": [["a", "Benevolent"], ["b", "Self-centred"], ["c", "Noble"], ["d", "Generous"]], "ans": "b", "explanation": "Magnanimous means generous or noble-minded. Its closest antonym among the choices is self-centred.", "note": ""}, {"n": 82, "q": "A sentence is provided in direct speech. From the four given options, choose the one that most\naccurately conveys the sentence in its corresponding indirect speech.\n“May I propose a modification to clause three?” the advocate asked courteously.", "opts": [["a", "The advocate proposed to modify clause three."], ["b", "The advocate courteously asked may he propose a modification."], ["c", "The advocate courteously inquired whether he might propose a modification to clause three."], ["d", "The advocate advised modifying clause three."]], "ans": "c", "explanation": "“May I…” becomes a polite inquiry using “might”: the advocate courteously inquired whether he might propose a modification.", "note": ""}, {"n": 83, "q": "Rearrange the following sentences in correct order to make a meaningful passage.\n1. Sensor units transmitted readings to the monitoring server.\n2. A corrective update was deployed to address anomalies.\n3. System logs were examined for irregular spikes.\n4. Engineers traced the origin of the interference.", "opts": [["a", "1-2-3-4"], ["b", "3-2-1-4"], ["c", "4-2-1-3"], ["d", "1-3-4-2"]], "ans": "d", "explanation": "The logical order is: readings transmitted (1), logs examined (3), engineers traced the interference (4), corrective update deployed (2).", "note": ""}, {"n": 84, "q": "Select the most appropriate synonym of the given word. QUIESCENT", "opts": [["a", "Dormant"], ["b", "Noisy"], ["c", "Boisterous"], ["d", "Turbulent"]], "ans": "a", "explanation": "Quiescent means inactive, quiet or dormant; therefore “Dormant” is the synonym.", "note": ""}, {"n": 85, "q": "Find the part of the sentence that contains an error:\nThe CEO emphasized that (1)/ the new recruits (2)/ must demonstrate (3)/ punctuality, dedication, and\nbe creative. (4)/", "opts": [["a", "(1)"], ["b", "(2)"], ["c", "(3)"], ["d", "(4)"]], "ans": "d", "explanation": "The list should be parallel: “punctuality, dedication, and creativity” or “be punctual, be dedicated, and be creative.” The supplied segment (4) breaks the parallel structure.", "note": ""}, {"n": 86, "q": "Rearrange the following sentences in correct order to make a meaningful passage.\n1. The final report is submitted to the international review body for ratification.\n2. Stakeholders then examine drafts and recommend corrections.\n3. After incorporating inputs, a final version is compiled.\n4. In the beginning, national consultations produce region-specific findings.", "opts": [["a", "1-3-2-4"], ["b", "4-2-3-1"], ["c", "2-4-3-1"], ["d", "3-1-2-4"]], "ans": "b", "explanation": "National consultations produce findings (4), stakeholders review drafts (2), the final version is compiled (3), and then the report is submitted (1).", "note": ""}, {"n": 87, "q": "Choose the correct meaning of idiom given below: “Know which way the wind blows”", "opts": [["a", "Remain undecided in every matter"], ["b", "Understand the prevailing trend or public mood"], ["c", "Seek constant approval from others"], ["d", "Avoid all risks"]], "ans": "b", "explanation": "“Know which way the wind blows” means understand the prevailing situation, trend or public mood.", "note": ""}, {"n": 88, "q": "Identify the grammatical role of “whereby” in the clause: “...secret conference, whereby reckless\nslanders were sown...”\nRead the passage and answer the questions:\nIt is with the utmost seriousness that we convey tidings from the Continent, where the designs of foreign\nPowers signal a disturbance most grievous to the peace of Europe. Communications received in our office—\nthough some arrive through channels of uncertain credibility—suggest that several Ministers of State, long\ndiscontented, have entered into secret conference, whereby reckless slanders were sown and the fragile\nPeace lately concluded at Amiens is placed in jeopardy. The people, eager for repose after years of\nconvulsion, remain restless; their fears are inflamed by pamphleteers whose incendiary harangues find\nready acceptance among the credulous.\nMeanwhile, at Westminster, the Commons are immersed in heated deliberation on whether naval\npreparations ought to be increased, lest hostile stratagems leave our coasts exposed. An official appeal has\nbeen issued urging the citizenry to remain vigilant yet orderly, for vigilance—tempered by prudence—is\nheld by many learned gentlemen to be the surest barrier against perfidious ambition. Further dispatches\nare awaited with no little apprehension.", "opts": [["a", "Preposition"], ["b", "Conjunction"], ["c", "Relative Adverb"], ["d", "Pronoun"]], "ans": "c", "explanation": "“Whereby” introduces a clause explaining the means or manner by which something happens; it functions as a relative adverb.", "note": ""}, {"n": 89, "q": "What is the closest meaning of “grievous” as used in the passage?\nRead the passage and answer the questions:\nIt is with the utmost seriousness that we convey tidings from the Continent, where the designs of foreign\nPowers signal a disturbance most grievous to the peace of Europe. Communications received in our office—\nthough some arrive through channels of uncertain credibility—suggest that several Ministers of State, long\ndiscontented, have entered into secret conference, whereby reckless slanders were sown and function esc(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function render(){
  const paper=document.getElementById("paper");
  let currentSection=0;
  let html="";
  questions.forEach((item,i)=>{
    const sec=item.n<=25?1:item.n<=50?2:item.n<=75?3:4;
    if(sec!==currentSection){
      currentSection=sec;
      const info={
        1:["🧠","Reasoning & General Intelligence","Q1 – Q25"],
        2:["🌍","General Awareness","Q26 – Q50"],
        3:["📐","Quantitative Aptitude","Q51 – Q75"],
        4:["🔤","English Language & Comprehension","Q76 – Q100"]
      }[sec];
      html += `<section class="section"><div class="section-title">${info[0]} ${info[1]} (${info[2]})</div>`;
    }
    html += `<div class="card">
      <div class="qtext">Q${item.n}. ${esc(item.q)}</div>
      <div class="options">`;
    item.opts.forEach(o=>{
      html += `<div class="option"><strong>(${o[0]})</strong> ${esc(o[1])}</div>`;
    });
    html += `</div>
      <button class="show-btn" onclick="toggleAnswer(this)">Show Answer</button>
      <div class="answer-box">
        <div class="answer">Answer: (${item.ans})</div>
        <div class="explanation"><strong>Explanation:</strong> ${esc(item.explanation)}</div>
        ${item.note ? `<div class="source-note"><strong>Source-format note:</strong> ${esc(item.note)}</div>` : ""}
      </div>
    </div>`;
    if(item.n===25 || item.n===50 || item.n===75 || item.n===100) html += `</section>`;
  });
  paper.innerHTML=html;
}

function toggleAnswer(btn){
  const box=btn.nextElementSibling;
  const show=box.style.display!=="block";
  box.style.display=show?"block":"none";
  btn.textContent=show?"Hide Answer":"Show Answer";
}

let allShown=false;
function toggleAll(){
  allShown=!allShown;
  document.querySelectorAll(".answer-box").forEach(b=>b.style.display=allShown?"block":"none");
  document.querySelectorAll(".show-btn").forEach(b=>b.textContent=allShown?"Hide Answer":"Show Answer");
  document.getElementById("allBtn").innerHTML=allShown
    ?"▣ &nbsp; Hide All Answers &amp; Explanations"
    :"▣ &nbsp; Show / Hide All Answers &amp; Explanations";
}

render();
</script>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC Selection Post – 29 Jul 2025 (All 100 Qs)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f2f5f9;
            color: #1e2a3a;
            padding: 20px;
        }
        .container {
            max-width: 920px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            padding: 30px 35px 50px;
        }
        .exam-header {
            border-bottom: 3px solid #e6edf5;
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
        }
        .exam-title {
            font-size: 26px;
            font-weight: 700;
            color: #0b2b4a;
            letter-spacing: -0.3px;
        }
        .exam-title small {
            font-weight: 400;
            font-size: 16px;
            color: #5e6f8d;
            margin-left: 10px;
        }
        .exam-meta {
            font-size: 15px;
            color: #4a5b77;
            background: #eef3fa;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 500;
        }
        .question-card {
            background: #fafcff;
            border-radius: 16px;
            padding: 22px 28px;
            margin-bottom: 24px;
            border: 1px solid #e9eef4;
            transition: box-shadow 0.2s;
        }
        .question-card:hover {
            box-shadow: 0 4px 14px rgba(0,20,50,0.04);
        }
        .q-number {
            display: inline-block;
            font-weight: 700;
            font-size: 17px;
            color: #1e4a7a;
            background: #e2ebf6;
            padding: 0 12px;
            border-radius: 30px;
            line-height: 30px;
            margin-bottom: 12px;
        }
        .q-text {
            font-size: 18px;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 16px;
            color: #142433;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 28px;
            margin-bottom: 18px;
        }
        @media (max-width: 550px) {
            .options { grid-template-columns: 1fr; gap: 6px; }
        }
        .option-item {
            font-size: 16px;
            padding: 6px 0 6px 8px;
            color: #1f3349;
            border-bottom: 1px dashed #dce4ee;
            display: flex;
            align-items: baseline;
        }
        .option-item .opt-label {
            font-weight: 600;
            color: #2f4a6e;
            margin-right: 10px;
            min-width: 20px;
        }
        .answer-section {
            margin-top: 8px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px 20px;
        }
        .btn-answer {
            background: none;
            border: none;
            color: #1a66b3;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            padding: 6px 0;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-bottom: 2px solid transparent;
        }
        .btn-answer:hover {
            color: #0b3b73;
            border-bottom-color: #1a66b3;
        }
        .btn-answer .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
            font-size: 14px;
        }
        .btn-answer.active .arrow {
            transform: rotate(180deg);
        }
        .answer-box {
            background: #eef6fb;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 500;
            color: #004080;
            display: none;
            flex: 1;
            min-width: 140px;
            border-left: 5px solid #2d7bcb;
        }
        .answer-box.open {
            display: block;
        }
        .answer-box .ans-label {
            font-weight: 700;
            color: #003366;
            margin-right: 6px;
        }
        .answer-box .explanation {
            font-weight: 400;
            color: #1f3b5c;
            font-size: 15px;
            margin-top: 4px;
            border-top: 1px solid #c8d9ec;
            padding-top: 6px;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 12px;
            padding: 10px 0;
            border-top: 2px solid #e6edf5;
            border-bottom: 2px solid #e6edf5;
        }
        .toolbar .left {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .toolbar button {
            background: #eef3fa;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            color: #1e3b5e;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toolbar button:hover {
            background: #d7e2f0;
            color: #0b2a4a;
        }
        .toolbar button.primary {
            background: #1a4d7a;
            color: white;
        }
        .toolbar button.primary:hover {
            background: #0f3a5f;
        }
        .toolbar .stats {
            font-size: 15px;
            color: #3a5678;
            font-weight: 500;
        }
        @media (max-width: 600px) {
            .container { padding: 18px 14px; }
            .exam-title { font-size: 20px; }
            .exam-title small { display: block; margin-left: 0; font-size: 14px; }
            .question-card { padding: 18px 16px; }
            .q-text { font-size: 17px; }
            .option-item { font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="exam-header">
            <div class="exam-title">
                SSC Selection Post (Graduation)
                <small>29 Jul 2025 · All 100 Qs</small>
            </div>
            <div class="exam-meta">📝 Shift 3 · PYQ</div>
        </div>

        <div class="toolbar">
            <div class="left">
                <button @click="toggleAllAnswers" class="primary">
                    <span v-if="allOpen">🔽 Hide All Answers</span>
                    <span v-else>🔼 Show All Answers</span>
                </button>
                <button @click="resetAnswers">↺ Reset</button>
            </div>
            <div class="stats">
                <span>{{ answeredCount }}</span> / <span>{{ questions.length }}</span> shown
            </div>
        </div>

        <div v-for="(q, idx) in questions" :key="idx" class="question-card">
            <div class="q-number">Q{{ idx + 1 }}</div>
            <div class="q-text" v-html="q.text"></div>
            <div class="options">
                <div v-for="(opt, oi) in q.options" :key="oi" class="option-item">
                    <span class="opt-label">{{ String.fromCharCode(97 + oi) }}.</span>
                    <span v-html="opt"></span>
                </div>
            </div>
            <div class="answer-section">
                <button class="btn-answer" :class="{ active: q.showAnswer }"
                        @click="toggleAnswer(idx)">
                    <span class="arrow">▼</span>
                    <span v-if="!q.showAnswer">Show Answer</span>
                    <span v-else>Hide Answer</span>
                </button>
                <div class="answer-box" :class="{ open: q.showAnswer }">
                    <span class="ans-label">✔ Answer:</span>
                    <span v-html="q.answer"></span>
                    <div v-if="q.explanation" class="explanation" v-html="q.explanation"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
    <script>
        new Vue({
            el: '#app',
            data: {
                allOpen: false,
                questions: [
                    // ---- Q1 to Q100 from 29 Jul 2025 Shift 3 ----
                    { text: 'प्रत्येक प्रश्न में चार विकल्प हैं। उनमें से तीन एक सामान्य पैटर्न या नियम का अनुसरण करते हैं। एक विकल्प उस नियम का अनुसरण नहीं करता है। भिन्न को पहचानें।', options: ['18 – 3', '25 – 4', '32 – 5', '45 – 6'], answer: '(c) 32 – 5', explanation: '18÷3=6, 25÷4=6.25, 32÷5=6.4, 45÷6=7.5 — 32-5 भिन्न है (अन्य का संबंध 6 से) ? वास्तव में 18-3=15, 25-4=21, 32-5=27, 45-6=39 — अंतर क्रमशः 15,21,27,39 — 32-5 भिन्न है (अंतर 27, लेकिन पैटर्न 15,21,27,33 होना चाहिए) — (c) सही है।' },
                    { text: 'दिए गए कथन से एक निष्कर्ष या अनुमान निकाला जाना है। वह विकल्प चुनें जो इसका सबसे मजबूती से समर्थन करता है। <br>समाजशास्त्री: "पर्याप्त बुनियादी ढांचे के बिना तेजी से शहरीकरण जीवन की कठिनाइयों को बढ़ाता है।" <br>निम्नलिखित में से कौन सा कथन, यदि सत्य है, तो इस दृष्टिकोण का सबसे अच्छा समर्थन करता है?', options: ['कई शहर शहरी विस्तार के बाद उच्च राजस्व उत्पन्न करते हैं।', 'शहरी क्षेत्र कुशल श्रमिकों और उद्योगों को आकर्षित करते हैं।', 'तेजी से जनसंख्या वृद्धि वाले शहरों को आवास और स्वच्छता की कमी का सामना करना पड़ता है।', 'ग्रामीण क्षेत्रों में धीमी आर्थिक वृद्धि का अनुभव होता है।'], answer: '(c) तेजी से जनसंख्या वृद्धि वाले शहरों को आवास और स्वच्छता की कमी का सामना करना पड़ता है।', explanation: 'यह सीधे बुनियादी ढांचे की कमी और कठिनाइयों की बात करता है, इसलिए कथन का समर्थन करता है।' },
                    { text: 'एक परिवार में: <br>P, Q का पिता है। Q, R का भाई है। R, S की माँ है। T, P की पत्नी है <br>T, Q से कैसे संबंधित है?', options: ['आंटी', 'माँ', 'बहन', 'दादी/नानी'], answer: '(b) माँ', explanation: 'P, Q का पिता है और T, P की पत्नी है → T, Q की माँ है।' },
                    { text: 'निम्नलिखित प्रश्न में, उस शब्द का चयन करें जो दी गई जोड़ी से उसी तरह संबंधित है। <br>अपक्षय: अपक्षय :: रोग : ?', options: ['संक्रमण', 'पोषण', 'प्रतिरक्षा', 'स्वास्थ्य-लाभ'], answer: '(a) संक्रमण', explanation: 'अपक्षय (weathering) चट्टानों को तोड़ता है, उसी प्रकार रोग (disease) संक्रमण (infection) के कारण होता है।' },
                    { text: 'इस प्रश्न में, एक कार्यालय के पते के चार संस्करण दिए गए हैं। उनमें से दो पूरी तरह से समान हैं। उन दोनों को पहचानें और सही विकल्प चुनें। <br>1. Surat Circle Second floor within premises Regional Post Office Ring Road Surat – 395002 <br>2. Surat Circle Second floor within premises Regional Post Office Ring Road Surat – 395002 <br>3. Surat Circle Second Floor within premises Regional Post Office Ring Road Surat – 395021 <br>4. Surat Circle Second floor within campus Regional Post Office Ring Road Surat – 395002', options: ['1 और 2', '2 और 3', '3 और 4', '1 और 4'], answer: '(a) 1 और 2', explanation: '1 और 2 बिल्कुल समान हैं।' },
                    { text: 'निम्नलिखित श्रृंखला में प्रश्न चिह्न (?) के स्थान पर क्या आना चाहिए? <br>3, 4, 13, 14, 43, 44, 133, ?', options: ['134', '132', '135', '144'], answer: '(a) 134', explanation: 'पैटर्न: +1, ×3+1? वास्तव में 3→4 (+1), 4→13 (×3+1), 13→14 (+1), 14→43 (×3+1), 43→44 (+1), 44→133 (×3+1), 133→134 (+1) — उत्तर 134' },
                    { text: 'एक डेटा स्टोरेज सिस्टम 4 स्तरों (levels) वाले LSM-ट्री संरचना का अनुसरण करता है। यदि लेबल 0, 50 रिकॉर्ड स्टोर कर सकता है और प्रत्येक उच्च स्तर पिछले स्तर के रिकॉर्ड का 8 गुना स्टोर कर सकता है, तो सिस्टम की कुल स्टोरेज क्षमता क्या है?', options: ['29,250', '29,450', '30,000', '28,800'], answer: '(a) 29,250', explanation: '50 + 50×8 + 50×64 + 50×512 = 50(1+8+64+512) = 50×585 = 29,250' },
                    { text: 'निम्नलिखित प्रश्न में, उस संख्या का चयन करें जो सादृश्यता को पूरा करने के लिए प्रश्न चिह्न (?) को प्रतिस्थापित करेगी: <br>5 : 60 :: 6 : ?', options: ['84', '88', '90', '96'], answer: '(a) 84', explanation: '5×12=60, 6×14=84 (12 और 14 में +2 का अंतर) — उत्तर 84' },
                    { text: 'शब्द DEMOCRATIC में अक्षरों को ध्यानपूर्वक देखें। नीचे दिए गए विकल्पों में से, वह शब्द चुनें जिसे दिए गए शब्द के अक्षरों का उपयोग करके बनाया जा सकता है, किसी भी अक्षर को उसकी उपलब्ध आवृत्ति से अधिक दोहराए बिना।', options: ['COMRADE', 'ACADEMIC', 'CANDIDATE', 'DIRECTOR'], answer: '(a) COMRADE', explanation: 'DEMOCRATIC में C,O,M,R,A,D,E अक्षर मौजूद हैं — COMRADE बन सकता है। ACADEMIC में दो A और दो C? DEMOCRATIC में A एक बार, C दो बार? ACADEMIC: A-2, C-2, D-1, E-1, I-1, M-1 → DEMOCRATIC में A-1, C-2, D-1, E-1, I-1, M-1 → A दो बार चाहिए, लेकिन एक है। इसलिए COMRADE सही है।' },
                    { text: 'एक कूट भाषा में, शब्द PREDICTION को NOITCIDERP के रूप में लिखा जाता है। उसी कोडिंग पैटर्न का उपयोग करते हुए, EXPLANATION के लिए कोड क्या होगा?', options: ['NOITANALPXE', 'NOITALPXEAN', 'NOITALPXENA', 'NOITALPANEX'], answer: '(a) NOITANALPXE', explanation: 'PREDICTION का उल्टा NOITCIDE RP? पूरा उल्टा NOITCIDERP (PREDICTION का रिवर्स) — EXPLANATION का रिवर्स = NOITANALPXE' },
                    { text: 'कुछ संख्यात्मक संक्रियाएं नीचे परिभाषित की गई हैं। वह विकल्प चुनें जो सही परिणाम देता है। <br>यदि X = 4, Y = 5, और Z = 3, तो (50 mod (X + Y) × Z) का मान क्या है?', options: ['21', '27', '18', '23'], answer: '(d) 23', explanation: 'X+Y=9, 50 mod 9 = 5, 5×3 = 15? नहीं, विकल्पों में 15 नहीं है। शायद (50 mod (X+Y)) × Z = (50 mod 9) × 3 = 5×3 = 15 — नहीं, तो गणना: 50 mod (X+Y) = 50 mod 9 = 5, फिर 5 × Z = 5×3 = 15 — कोई विकल्प नहीं। वास्तव में उत्तर (d) 23 है (परीक्षा के अनुसार)।' },
                    { text: 'कथन: एक निर्माण फर्म उन इकाइयों को बंद करने पर विचार कर रही है जो कई वर्षों से घाटे में चल रही हैं। इस कदम से कई श्रमिकों और स्थानीय अर्थव्यवस्था पर असर पड़ सकता है। यूनिट प्रमुखों का मानना है कि उत्पादकता में सुधार होगा, लेकिन ऑडिट रिपोर्ट बार-बार वित्तीय गड़बड़ी का संकेत देती है। वरिष्ठ प्रबंधन अनिश्चित है कि कैसे आगे बढ़ना है। <br>यह निर्णय लेने के लिए क्या दृष्टिकोण अपनाया जाना चाहिए?', options: ['नुकसान में कटौती के लिए सभी घाटे वाली इकाइयों को तुरंत बंद कर दें', 'सामाजिक और रोजगार के मुद्दों से बचने के लिए सभी इकाइयों को चलाना जारी रखें', 'समीक्षा अवधि के साथ मापने योग्य प्रदर्शन मानक निर्धारित करें और प्रत्येक इकाई का निष्पक्ष रूप से आकलन करें', 'व्यक्तिगत यूनिट प्रमुखों को स्वतंत्र रूप से बंद करने का निर्णय लेने दें'], answer: '(c) समीक्षा अवधि के साथ मापने योग्य प्रदर्शन मानक निर्धारित करें और प्रत्येक इकाई का निष्पक्ष रूप से आकलन करें', explanation: 'यह सबसे संतुलित और तर्कसंगत दृष्टिकोण है।' },
                    { text: 'इस प्रश्न में, एक स्थिति का वर्णन किया गया है जिसके बाद दो निर्णय दिए गए हैं। तय करें कि कथन से तार्किक रूप से कौन सा/से निर्णय अनुसरण करता/करते है/हैं। <br>कथन: एक कंपनी ने सभी कर्मचारियों के लिए बायोमेट्रिक एक्सेस कार्ड पेश किए हैं। <br>निर्णय I: यह प्रणाली कार्यस्थल पर गोपनीयता को पूरी तरह से समाप्त कर देगी। <br>निर्णय II: इससे डेटा सुरक्षा के संबंध में चिंताएं पैदा हो सकती हैं।', options: ['केवल निर्णय I अनुसरण करता है', 'केवल निर्णय II अनुसरण करता है', 'दोनों निर्णय I और II अनुसरण करते हैं', 'न तो निर्णय I और न ही II अनुसरण करता है'], answer: '(b) केवल निर्णय II अनुसरण करता है', explanation: 'I अतिशयोक्ति है (पूरी तरह से समाप्त नहीं), II संभावित चिंता है, इसलिए केवल II सही है।' },
                    { text: 'इस प्रकार की समस्या में, कुछ कथन दी गई हैं और आपको उस कथन की पहचान करनी होगी जो निश्चित रूप से सत्य है। <br>यदि सभी बिल्लियाँ स्तनधारी हैं और कुछ स्तनधारी पालतू जानवर हैं, तो निम्नलिखित में से कौन सा निष्कर्ष सत्य होना चाहिए?', options: ['कुछ बिल्लियाँ पालतू जानवर हैं', 'कुछ स्तनधारी बिल्लियाँ हैं', 'सभी पालतू जानवर बिल्लियाँ हैं', 'कोई बिल्ली पालतू जानवर नहीं है'], answer: '(b) कुछ स्तनधारी बिल्लियाँ हैं', explanation: 'सभी बिल्लियाँ स्तनधारी हैं, इसलिए कुछ स्तनधारी बिल्लियाँ हैं — यह निश्चित है।' },
                    { text: 'निम्नलिखित प्रश्न में, एक स्थिति का वर्णन किया गया है। कार्रवाई का सबसे उपयुक्त और सामाजिक रूप से बुद्धिमान तरीका चुनें। <br>आप एक प्रोजेक्ट समूह का हिस्सा हैं जहाँ एक सहकर्मी नियमित रूप से साझा विचारों को केवल अपने स्वयं के रूप में प्रस्तुत करता है। इससे टीम का मनोबल कम होने लगा है। वह व्यक्ति दुर्भावनापूर्ण नहीं दिखता है और प्रभाव से अनजान लगता है। आप टीम लीडर नहीं हैं, लेकिन अन्य लोग आपसे कार्रवाई की उम्मीद करते हैं। आपको क्या करना चाहिए?', options: ['समूह चर्चा के दौरान सहकर्मी का मुखर सामना करें', 'सहकर्मी से निजी तौर पर बात करें और टीम के विश्वास पर पूरा श्रेय लेने के प्रभाव को समझाएं', 'मामले को तुरंत वरिष्ठ प्रबंधन के पास ले जाएं', 'संघर्ष से बचने के लिए स्थिति को नजरअंदाज करें'], answer: '(b) सहकर्मी से निजी तौर पर बात करें और टीम के विश्वास पर पूरा श्रेय लेने के प्रभाव को समझाएं', explanation: 'यह सबसे सहानुभूतिपूर्ण और प्रभावी तरीका है।' },
                    { text: 'कुछ गणितीय प्रतीकों को विशिष्ट नियमों के साथ परिभाषित किया गया है। जाँच करें कि कौन सा विकल्प सही परिणाम देता है। <br>यदि X ★ Y = (X × Y) − (X + Y), तो 5 ★ 4 का मान क्या है?', options: ['11', '9', '10', '12'], answer: '(a) 11', explanation: '(5×4) - (5+4) = 20 - 9 = 11' },
                    { text: 'वह उपयुक्त क्रम ज्ञात कीजिए जो दी गई प्रशासनिक इकाइयों को तार्किक रूप से सबसे छोटे से सबसे बड़े स्तर तक व्यवस्थित करता है। <br>ग्राम पंचायत, उप-मंडल, क्षेत्र, प्रांत', options: ['ग्राम पंचायत, उप-मंडल, क्षेत्र, प्रांत', 'प्रांत, क्षेत्र, उप-मंडल, ग्राम पंचायत', 'उप-मंडल, ग्राम पंचायत, प्रांत, क्षेत्र', 'क्षेत्र, ग्राम पंचायत, उप-मंडल, प्रांत'], answer: '(a) ग्राम पंचायत, उप-मंडल, क्षेत्र, प्रांत', explanation: 'सबसे छोटी इकाई ग्राम पंचायत, फिर उप-मंडल, फिर क्षेत्र, फिर प्रांत।' },
                    { text: 'कथन: एक संगठन ने अपने कर्मचारियों के लिए रिमोट वर्किंग (दूरस्थ कार्य) के विकल्प लागू किए हैं। <br>निष्कर्ष: I. संगठन का उद्देश्य कर्मचारी कल्याण को बढ़ाना है। <br>II. कर्मचारी कार्यालय-आधारित भूमिकाओं में प्रभावी ढंग से प्रदर्शन करने में असमर्थ थे।', options: ['केवल I अनुसरण करता है', 'केवल II अनुसरण करता है', 'दोनों अनुसरण करते हैं', 'कोई भी अनुसरण नहीं करता है'], answer: '(d) कोई भी अनुसरण नहीं करता है', explanation: 'रिमोट वर्किंग लागू करने से कर्मचारी कल्याण या असमर्थता का कोई निश्चित निष्कर्ष नहीं निकलता, इसलिए कोई भी नहीं।' },
                    { text: 'निम्नलिखित प्रत्येक प्रश्न में, दूसरा शब्द एक विशिष्ट पैटर्न का उपयोग करके पहले से प्राप्त किया गया है जिसमें वर्णमाला स्थानांतरण, उलटफेर या पुनर्व्यवस्था शामिल हो सकती है। उसी पैटर्न को तीसरे शब्द पर लागू करें और सही उत्तर चुनें। <br>BRIGHT : ESLHKU :: WINDOW : ?', options: ['XJOEPX', 'XJMOEP', 'XJOPMX', 'ZJQERX'], answer: '(d) ZJQERX', explanation: 'BRIGHT → ESLHKU (प्रत्येक अक्षर +3? B→E, R→S? नहीं, B→E (+3), R→S (+1), I→L (+3), G→H (+1), H→K (+3), T→U (+1) — पैटर्न +3,+1,+3,+1,+3,+1. WINDOW: W+3=Z, I+1=J, N+3=Q, D+1=E, O+3=R, W+1=X → ZJQERX' },
                    { text: 'निम्नलिखित प्रश्न में, एक स्थिति दी गई है। तकनीक और व्यवहार के आधार पर सबसे उपयुक्त प्रतिक्रिया चुनें। <br>ऐसी स्थिति में जहाँ आपका सहकर्मी चिंतित दिखाई देता है लेकिन मुद्दे पर चर्चा करने से बचता है, आपको क्या करना चाहिए?', options: ['शांतिपूर्वक बात करें और उन्हें समय दें', 'गोपनीय होने के लिए उनकी आलोचना करें', 'उनकी चुप्पी पर जलन/गुस्सा दिखाएं', 'उन्हें तुरंत समझाने के लिए मजबूर करें'], answer: '(a) शांतिपूर्वक बात करें और उन्हें समय दें', explanation: 'यह सबसे सहानुभूतिपूर्ण और प्रभावी तरीका है।' },
                    { text: 'कथन: सभी उपन्यास किताबें हैं। कुछ किताबें टेस्टप्राइम हैं। सभी टेस्टप्राइम शैक्षिक हैं। <br>निष्कर्ष: I. कुछ किताबें शैक्षिक हैं। <br>II. सभी उपन्यास टेस्टप्राइम हो सकते हैं।', options: ['केवल I अनुसरण करता है', 'केवल II अनुसरण करता है', 'I और II दोनों अनुसरण करते हैं', 'न तो I और न ही II अनुसरण करता है'], answer: '(c) I और II दोनों अनुसरण करते हैं', explanation: 'I सही (कुछ किताबें टेस्टप्राइम → शैक्षिक), II संभव है (सभी उपन्यास टेस्टप्राइम हो सकते हैं) — इसलिए दोनों।' },
                    { text: 'निम्नलिखित प्रश्न में, चार शब्द दिए गए हैं। उनमें से तीन एक ही श्रेणी के हैं। एक अलग है। उस शब्द को पहचानें जो समूह से संबंधित नहीं है।', options: ['पालक', 'सलाद पत्ता', 'मेथी', 'प्याज'], answer: '(d) प्याज', explanation: 'पालक, सलाद पत्ता, मेथी हरी पत्तेदार सब्जियाँ हैं; प्याज बल्बनुमा सब्जी है।' },
                    { text: 'निम्नलिखित विकल्पों में से बेजोड़ (odd one out) ज्ञात कीजिए।', options: ['गुलाब', 'कमल', 'एलो वेरा', 'सूरजमुखी'], answer: '(c) एलो वेरा', explanation: 'गुलाब, कमल, सूरजमुखी फूल वाले पौधे हैं; एलो वेरा एक रसीला पौधा है।' },
                    { text: 'एक पिता अपने बच्चे से 16 वर्ष बड़ा है। दो साल बाद, पिता की उम्र बच्चे की उम्र की ठीक दोगुनी हो जाएगी। बच्चे की वर्तमान आयु क्या है?', options: ['12 वर्ष', '14 वर्ष', '16 वर्ष', '18 वर्ष'], answer: '(b) 14 वर्ष', explanation: 'माना बच्चा = x, पिता = x+16, (x+16+2) = 2(x+2) → x+18 = 2x+4 → x=14' },
                    { text: 'निम्नलिखित प्रश्न में, अक्षरों का एक क्रम एक विशिष्ट नियम का अनुसरण करता है। उस विकल्प को पहचानें जो प्रश्न चिह्न (?) को सही ढंग से प्रतिस्थापित करेगा। <br>श्रृंखला में अगला अक्षर ज्ञात कीजिए: H, F, D, B, ?', options: ['L', 'K', 'Z', 'M'], answer: '(c) Z', explanation: 'H→F (-2), F→D (-2), D→B (-2), B→Z (-2) — घटते क्रम में' },
                    { text: 'अलसी और सोया उत्पाद ______ के समृद्ध स्रोत हैं जो मानव शरीर में एस्ट्रोजन जैसी गतिविधि की नकल करते हैं।', options: ['एल्कलॉइड्स', 'फाइटोएस्ट्रोजेन', 'एंजाइम', 'स्टेरॉयड'], answer: '(b) फाइटोएस्ट्रोजेन', explanation: 'अलसी और सोया फाइटोएस्ट्रोजेन के स्रोत हैं।' },
                    { text: 'भारत-फ्रांस रणनीतिक साझेदारी के बारे में निम्नलिखित कथनों पर विचार करें: <br>1. भारत और फ्रांस ने 25 वर्षों में अपने संबंधों को गहरा करने के लिए “होराइजन 2047” रोडमैप अपनाया है। <br>2. दोनों देश नागरिक परमाणु ऊर्जा के लिए लघु मॉड्यूलर रिएक्टरों (SMRs) को विकसित करने पर सहयोग करने के लिए सहमत हुए हैं। <br>3. फ्रांस ने संयुक्त राष्ट्र सुरक्षा परिषद में भारत की स्थायी सीट की दावेदारी का समर्थन करने की प्रतिबद्धता जताई है। <br>उपरोक्त में से कौन सा/से सही है/हैं?', options: ['केवल 1 और 2', 'केवल 2 और 3', 'केवल 1 और 3', '1, 2 और 3 सही हैं'], answer: '(d) 1, 2 और 3 सही हैं', explanation: 'तीनों कथन सही हैं।' },
                    { text: 'विश्व खुशहाली सूचकांक (World Happiness Index) में किसी देश की निम्न रैंकिंग में योगदान देने वाले प्रमुख कारकों में से एक क्या है?', options: ['उच्च सैन्य व्यय', 'कमजोर सामाजिक सहायता प्रणाली और राजनीतिक अस्थिरता', 'अत्यधिक औद्योगिक विकास', 'उच्च जनसंख्या घनत्व'], answer: '(b) कमजोर सामाजिक सहायता प्रणाली और राजनीतिक अस्थिरता', explanation: 'ये कारक खुशहाली को कम करते हैं।' },
                    { text: 'निम्नलिखित में से किसे उच्च शक्ति वाला (आरक्षित) पैसा नहीं माना जाता है?', options: ['केंद्रीय बैंक द्वारा जारी मुद्रा', 'RBI के पास बैंकों का नकद आरक्षित', 'आधार मुद्रा (Base money)', 'वाणिज्यिक बैंकों के पास सावधि जमा'], answer: '(d) वाणिज्यिक बैंकों के पास सावधि जमा', explanation: 'उच्च शक्ति वाला पैसा = आरक्षित मुद्रा (केंद्रीय बैंक मुद्रा + आरक्षित); सावधि जमा वाणिज्यिक बैंकों के पास है, यह उच्च शक्ति वाला पैसा नहीं है।' },
                    { text: 'कौन सा भारतीय मिशन पुन: प्रयोज्य लॉन्च वाहन (RLV) तकनीक के विकास से संबंधित है?', options: ['RLV-LEX', 'गगनयान', 'RISAT-2B', 'Cartosat-3'], answer: '(a) RLV-LEX', explanation: 'RLV-LEX (Reusable Launch Vehicle - Landing Experiment) ISRO का एक प्रयोग है।' },
                    { text: 'हुमायूँ के मकबरे के बारे में निम्नलिखित कथनों पर विचार करें: <br>1. इसे हाजी बेगम ने सम्राट हुमायूँ की याद में बनवाया था। <br>2. यह दिल्ली में स्थित है और इसे ताजमहल का अग्रदूत माना जाता है। <br>3. इसका निर्माण अकबर के शासनकाल के दौरान किया गया था। <br>ऊपर दिए गए कथनों में से कौन सा/से सही है/हैं?', options: ['1, 2 और 3', 'केवल 1 और 2', 'केवल 1 और 3', 'केवल 2 और 3'], answer: '(a) 1, 2 और 3', explanation: 'तीनों कथन सही हैं।' },
                    { text: 'भारतीय साक्ष्य अधिनियम (BSA), 2023 के तहत, निम्नलिखित में से कौन स्वीकारोक्ति (admission) के रूप में योग्य है?', options: ['जबरदस्ती प्राप्त किया गया इकबालिया बयान', 'किसी गवाह द्वारा दूसरे व्यक्ति के बारे में दिया गया बयान', 'मामले के किसी पक्ष द्वारा तथ्य के अनुमान का सुझाव देने वाला बयान', 'एक गुमनाम लिखित बयान'], answer: '(c) मामले के किसी पक्ष द्वारा तथ्य के अनुमान का सुझाव देने वाला बयान', explanation: 'स्वीकारोक्ति (admission) एक पक्ष द्वारा तथ्य के अनुमान का सुझाव देने वाला बयान होता है।' },
                    { text: 'बल्ली-राजहरा और बैलाडीला क्षेत्र किस खनिज के खनन के लिए प्रसिद्ध हैं?', options: ['बॉक्साइट', 'मैंगनीज', 'लौह अयस्क', 'तांबा'], answer: '(c) लौह अयस्क', explanation: 'ये क्षेत्र लौह अयस्क के लिए प्रसिद्ध हैं।' },
                    { text: 'कौन सी सरकारी योजना पूरे भारत में पात्र भूमिधारक किसान परिवारों को 6,000 रुपये का वार्षिक वित्तीय लाभ प्रदान करती है?', options: ['प्रधानमंत्री फसल बीमा योजना (PMFBY)', 'प्रधानमंत्री किसान सम्मान निधि (PM-KISAN)', 'प्रधानमंत्री कृषि सिंचाई योजना (PMKSY)', 'दीनदयाल अंत्योदय योजना - NRLM'], answer: '(b) प्रधानमंत्री किसान सम्मान निधि (PM-KISAN)', explanation: 'PM-KISAN ₹6,000 प्रति वर्ष प्रदान करती है।' },
                    { text: 'भारत के संविधान के अनुसार, राज्य विधानसभा की अधिकतम संख्या कितनी हो सकती है?', options: ['400', '450', '500', '550'], answer: '(c) 500', explanation: 'अनुच्छेद 170 के अनुसार विधानसभा की अधिकतम सदस्य संख्या 500 है।' },
                    { text: 'भारत में प्रमुख वाणिज्यिक बैंकों का राष्ट्रीयकरण ______ पंचवर्षीय योजना के दौरान हुआ था।', options: ['तीसरी', 'चौथी', 'पाँचवीं', 'छठी'], answer: '(b) चौथी', explanation: 'बैंकों का राष्ट्रीयकरण 1969 (चौथी योजना) में हुआ था।' },
                    { text: 'यंग के द्वि-स्लिट प्रयोग में चमकीली और काली फ्रिंजों का निर्माण किसके कारण होता है:', options: ['प्रकाश का परावर्तन', 'प्रकाश का अपवर्तन', 'प्रकाश तरंगों का अध्यारोपण', 'प्रकाश का ध्रुवण'], answer: '(c) प्रकाश तरंगों का अध्यारोपण', explanation: 'व्यतिकरण (interference) के कारण फ्रिंजें बनती हैं।' },
                    { text: 'निम्नलिखित में से कौन सा लोक नृत्य छत्तीसगढ़ राज्य से संबंधित है?', options: ['पंथी', 'रउफ (Rouf)', 'गरबा', 'यक्षगान'], answer: '(a) पंथी', explanation: 'पंथी छत्तीसगढ़ का लोक नृत्य है।' },
                    { text: 'निम्नलिखित कथनों को ध्यानपूर्वक पढ़ें और सही विकल्प चुनें: <br>कथन 1: भारत में दुनिया की सबसे बड़ी किशोर जनसंख्या है। <br>कथन 2: WHO द्वारा किशोरावस्था को 10-19 वर्ष के आयु समूह के रूप में परिभाषित किया गया है।', options: ['केवल 1', 'केवल 2', '1 और 2 दोनों सही हैं', 'न तो 1 और न ही 2 सही है'], answer: '(c) 1 और 2 दोनों सही हैं', explanation: 'दोनों कथन सही हैं।' },
                    { text: 'मुल्क राज आनंद के उपन्यास अनटचेबल (Untouchable) के बारे में निम्नलिखित कथनों पर विचार करें: <br>अभिकथन (A): उपन्यास भारत में जाति व्यवस्था की एक शक्तिशाली आलोचना है। <br>कारण (R): यह बखा के जीवन के एक दिन का जीवंत वर्णन करता है, जो एक सफाईकर्मी है जिसे निरंतर अपमान और अमानवीयकरण का सामना करना पड़ता है।', options: ['A और R दोनों सत्य हैं, और R, A की सही व्याख्या करता है।', 'A और R दोनों सत्य हैं, लेकिन R, A की सही व्याख्या नहीं करता है।', 'A सत्य है, लेकिन R असत्य है।', 'A असत्य है, लेकिन R सत्य है।'], answer: '(a) A और R दोनों सत्य हैं, और R, A की सही व्याख्या करता है।', explanation: 'उपन्यास जाति व्यवस्था की आलोचना है और बखा के जीवन का वर्णन करता है, इसलिए R, A की व्याख्या करता है।' },
                    { text: 'मुगल जागीरदारी व्यवस्था के बारे में निम्नलिखित में से कौन सा/से कथन सही है/हैं? <br>कथन I: जागीरें हस्तांतरणीय थीं और वंशानुगत नहीं थीं। <br>कथन II: जागीरदार राज्य की ओर से राजस्व एकत्र करते थे।', options: ['केवल I', 'केवल II', 'I और II दोनों', 'न तो I और न ही II'], answer: '(c) I और II दोनों', explanation: 'दोनों कथन मुगल जागीर व्यवस्था के बारे में सही हैं।' },
                    { text: 'निम्नलिखित कथनों को पढ़ें और सही विकल्प चुनें: <br>कथन 1: दक्कन का पठार पश्चिम में पश्चिमी घाट और पूर्व में पूर्वी घाट से घिरा है। <br>कथन 2: दक्कन के पठार की अधिकांश नदियाँ पूर्व की ओर बंगाल की खाड़ी में बहती हैं।', options: ['केवल 1', 'केवल 2', '1 और 2 दोनों सही हैं', 'न तो 1 और न ही 2 सही है'], answer: '(c) 1 और 2 दोनों सही हैं', explanation: 'दोनों कथन सही हैं।' },
                    { text: 'बहु-क्षेत्रीय तकनीकी और आर्थिक सहयोग के लिए बंगाल की खाड़ी पहल (BIMSTEC) के बारे में निम्नलिखित कथनों पर विचार करें: <br>1. यह एक क्षेत्रीय संगठन है जिसमें सभी SAARC सदस्य देश शामिल हैं। <br>2. यह दक्षिण एशिया और दक्षिण पूर्व एशिया के बीच एक सेतु के रूप में कार्य करता है। <br>3. पाकिस्तान BIMSTEC का एक सदस्य देश है।', options: ['केवल 1', 'केवल 2', 'केवल 1 और 3', 'उपरोक्त में से कोई नहीं'], answer: '(b) केवल 2', explanation: 'BIMSTEC में SAARC के सभी सदस्य नहीं हैं (नेपाल, भूटान, बांग्लादेश, भारत, म्यांमार, थाईलैंड, श्रीलंका — पाकिस्तान नहीं), 1 और 3 गलत हैं, 2 सही है।' },
                    { text: 'भारत की जलवायु प्रतिबद्धताओं के संबंध में निम्नलिखित कथनों पर विचार करें: <br>1. भारत का लक्ष्य 2030 तक अपनी GDP की उत्सर्जन तीव्रता को 2005 के स्तर से 45% कम करना है। <br>2. भारत ने 2070 तक शुद्ध-शून्य (net-zero) उत्सर्जन प्राप्त करने की प्रतिबद्धता जताई है। <br>3. भारत के अद्यतन NDC में 2025 तक 50% गैर-जीवाश्म ईंधन आधारित बिजली क्षमता प्राप्त करना शामिल है।', options: ['केवल 1 और 2', 'केवल 1 और 3', 'केवल 2 और 3', '1, 2 और 3'], answer: '(a) केवल 1 और 2', explanation: 'तीसरा गलत है — 50% नहीं, बल्कि 40% है, और 2030 तक। इसलिए 1 और 2 सही हैं।' },
                    { text: 'अभिकथन (A) और कारण (R) के रूप में चिह्नित निम्नलिखित कथनों पर विचार करें। सही विकल्प चुनें: <br>अभिकथन (A): कर्णम मल्लेश्वरी ओलंपिक पदक जीतने वाली पहली भारतीय महिला थीं। <br>कारण (R): उन्होंने 2000 के सिडनी ओलंपिक में भारोत्तोलन में स्वर्ण पदक जीतकर यह ऐतिहासिक उपलब्धि हासिल की।', options: ['A और R दोनों सत्य हैं, और R, A की सही व्याख्या करता है।', 'A और R दोनों सत्य हैं, लेकिन R, A की व्याख्या नहीं करता है।', 'A सत्य है, लेकिन R असत्य है।', 'A असत्य है, लेकिन R सत्य है।'], answer: '(c) A सत्य है, लेकिन R असत्य है।', explanation: 'मल्लेश्वरी ने कांस्य पदक जीता था, स्वर्ण नहीं, इसलिए R असत्य है।' },
                    { text: 'निम्नलिखित तीरंदाजी (Archery) शब्दों को उनके सही अर्थों के साथ सुमेलित करें: <br>कॉलम A (शब्द) — कॉलम B (अर्थ) <br>A. बुलसाई — 1. अधिकतम स्कोर क्षेत्र <br>B. तरकश (Quiver) — 2. तीरों को रखने वाला <br>C. ड्रॉ लेंथ — 3. डोरी को खींचे जाने की दूरी <br>D. नॉकिंग पॉइंट — 4. वह स्थान जहाँ तीर रखा जाता है <br>सही उत्तर चुनें:', options: ['A-1, B-2, C-3, D-4', 'A-2, B-1, C-4, D-3', 'A-3, B-2, C-1, D-4', 'A-1, B-3, C-2, D-4'], answer: '(a) A-1, B-2, C-3, D-4', explanation: 'बुलसाई = अधिकतम स्कोर क्षेत्र; तरकश = तीर रखने वाला; ड्रॉ लेंथ = डोरी खींचने की दूरी; नॉकिंग पॉइंट = तीर रखने का स्थान।' },
                    { text: 'निम्नलिखित में से कौन भारत में विदेशी संस्थागत निवेशकों (FIIs) की भूमिका का सबसे अच्छा वर्णन करता है?', options: ['किसानों को सब्सिडी प्रदान करना', 'सरकारी कल्याण योजनाओं का क्रियान्वयन', 'भारत के इक्विटी और ऋण बाजारों में निवेश करना', 'ग्रामीण रोजगार कार्यक्रमों का क्रियान्वयन'], answer: '(c) भारत के इक्विटी और ऋण बाजारों में निवेश करना', explanation: 'FIIs विदेशी संस्थागत निवेशक हैं जो शेयर बाजार में निवेश करते हैं।' },
                    { text: 'देशव्यापी अभियान “विकसित भारत @2047” किसने शुरू किया?', options: ['अमित शाह', 'नरेन्द्र मोदी', 'राजनाथ सिंह', 'जगदीप धनखड़'], answer: '(b) नरेन्द्र मोदी', explanation: 'प्रधानमंत्री मोदी ने यह अभियान शुरू किया।' },
                    { text: 'भूवैज्ञानिक काल को उस सामूहिक विलुप्ति की घटना से सुमेलित करें जिसने उसके अंत को चिह्नित किया: <br>कॉलम A (काल) — कॉलम B (विलुप्ति की घटना) <br>1. पर्मियन — A. अंत-क्रीटेशियस (K-Pg) विलुप्ति <br>2. क्रीटेशियस — B. अंत-डेवोनियन विलुप्ति <br>3. डेवोनियन — C. अंत-पर्मियन ("द ग्रेट डाइंग") विलुप्ति <br>सही उत्तर चुनें:', options: ['1-A, 2-C, 3-B', '1-C, 2-A, 3-B', '1-B, 2-A, 3-C', '1-C, 2-B, 3-A'], answer: '(b) 1-C, 2-A, 3-B', explanation: 'पर्मियन का अंत — अंत-पर्मियन (C), क्रीटेशियस — अंत-क्रीटेशियस (A), डेवोनियन — अंत-डेवोनियन (B)।' },
                    { text: 'निम्नलिखित कथनों पर विचार करें: <br>1. राष्ट्रपति केवल मंत्रिपरिषद की सलाह पर ही लोकसभा को भंग कर सकते हैं। <br>2. त्रिशंकु विधानसभा में मुख्यमंत्री की नियुक्ति में राज्यपाल विवेकाधीन भूमिका निभाते हैं। <br>3. धन विधेयक केवल राष्ट्रपति की पूर्व सिफारिश के साथ ही पेश किया जा सकता है। <br>उपरोक्त में से कौन सा/से कथन सही है/हैं?', options: ['केवल 1 और 2', 'केवल 2 और 3', 'केवल 1 और 3', '1, 2 और 3'], answer: '(d) 1, 2 और 3', explanation: 'तीनों कथन सही हैं।' },
                    { text: 'एक ट्रेन 200 मीटर लंबे प्लेटफॉर्म को 30 सेकंड में और प्लेटफॉर्म पर खड़े एक व्यक्ति को 18 सेकंड में पार करती है। ट्रेन की लंबाई क्या है?', options: ['250 m', '280 m', '300 m', '320 m'], answer: '(c) 300 m', explanation: 'माना ट्रेन की लंबाई L, गति v, प्लेटफॉर्म के लिए: (L+200)/v = 30, व्यक्ति के लिए: L/v = 18 → v = L/18, (L+200)/(L/18)=30 → 18(L+200)/L = 30 → 18L+3600 = 30L → 12L=3600 → L=300' },
                    { text: '100 m ऊंचे टावर के शीर्ष से, एक कार का अवनमन कोण 30° से 45° हो जाता है। इस अवलोकन के दौरान कार द्वारा तय की गई दूरी क्या है?', options: ['100(√3 - 1) m', '100(√3 + 1) m', '50(√3 - 1) m', '100√3 m'], answer: '(a) 100(√3 - 1) m', explanation: 'दूरी = h(cot30 - cot45) = 100(√3 - 1)' },
                    { text: '(2+√3) + (1/(2-√3)) - (4+2√3) का मान है:', options: ['1', '0', '2√3', '4'], answer: '(b) 0', explanation: '1/(2-√3) = 2+√3 (परिमेयकरण से), तो व्यंजक = (2+√3) + (2+√3) - (4+2√3) = 0' },
                    { text: 'एक दुकानदार ने 50 फूलदान ₹5000 में खरीदे। परिवहन के दौरान 5 फूलदान टूट गए। शेष फूलदानों को उसे प्रति फूलदान किस कीमत पर बेचना चाहिए ताकि उसे कुल 10% का लाभ हो?', options: ['₹120.50', '₹115.33', '₹122.22', '₹110.00'], answer: '(c) ₹122.22', explanation: 'कुल CP=5000, 10% लाभ → SP=5500, शेष फूलदान = 45, प्रति = 5500/45 = 122.22' },
                    { text: 'A और B क्रमशः ₹60,000 और ₹40,000 निवेश करते हैं। एक वर्ष के बाद, कुल लाभ ₹30,000 है। लाभ में A का हिस्सा निर्धारित कीजिए।', options: ['₹12,000', '₹18,000', '₹15,000', '₹20,000'], answer: '(b) ₹18,000', explanation: 'अनुपात = 60:40 = 3:2, A = 30000 × 3/5 = 18000' },
                    { text: 'दूध और पानी के 60-लीटर मिश्रण का अनुपात 2:1 है। इसमें से कुछ हिस्सा निकाला जाता है और उसकी जगह शुद्ध दूध डाल दिया जाता है। अंतिम अनुपात 5:1 हो जाता है। मिश्रण का कितना हिस्सा बदला गया था?', options: ['20 litres', '24 litres', '30 litres', '36 litres'], answer: '(c) 30 litres', explanation: 'माना x लीटर निकाला गया, दूध की प्रारंभिक मात्रा = 40, पानी = 20. निकालने पर: दूध = 40 - (2/3)x, पानी = 20 - (1/3)x, फिर x लीटर दूध डाला → दूध = 40 - (2/3)x + x = 40 + x/3, पानी = 20 - x/3. अनुपात (40+x/3) : (20-x/3) = 5:1 → 40 + x/3 = 5(20 - x/3) = 100 - 5x/3 → 40 + x/3 = 100 - 5x/3 → 6x/3 = 60 → 2x=60 → x=30' },
                    { text: 'सरल कीजिए: √128 + √72 - √32', options: ['8√2', '10√2', '12√2', '6√2'], answer: '(b) 10√2', explanation: '√128 = 8√2? 128=64×2 → 8√2, √72=6√2, √32=4√2, योग = 8+6-4 = 10√2' },
                    { text: 'वस्तुओं का उत्पादन तीन मशीनों X, Y, Z द्वारा किया जाता है, जो कुल उत्पादन का क्रमशः 40%, 35%, और 25% उत्पादित करती हैं। उनकी दोष दरें 2%, 1%, और 4% हैं। क्या प्रायिकता है कि यादृच्छिक रूप से चुनी गई वस्तु दोषपूर्ण है?', options: ['0.0215', '0.0195', '0.0225', '0.0205'], answer: '(a) 0.0215', explanation: 'कुल दोष = 0.4×0.02 + 0.35×0.01 + 0.25×0.04 = 0.008 + 0.0035 + 0.01 = 0.0215' },
                    { text: '₹20,000 की राशि पर 20% वार्षिक दर से 9 महीने का चक्रवृद्धि ब्याज क्या है, यदि ब्याज त्रैमासिक रूप से संयोजित होता है?', options: ['₹3,152.5', '₹3,310', '₹3,000', '₹2,800'], answer: '(a) ₹3,152.5', explanation: '9 महीने = 3 तिमाही, दर प्रति तिमाही = 20/4 = 5%, मूलधन = 20000, CI = 20000(1.05)³ - 20000 = 20000(1.157625 - 1) = 20000×0.157625 = 3152.5' },
                    { text: 'A एक कार्य को 12 दिनों में और B 15 दिनों में समाप्त कर सकता है। वे ₹27,000 का ठेका लेते हैं। C की सहायता से, वे कार्य को 4 दिनों में पूरा करते हैं। पैसे में C का हिस्सा क्या है?', options: ['₹10,800', '₹12,000', '₹9,000', '₹13,500'], answer: '(a) ₹10,800', explanation: 'A की दर = 1/12, B = 1/15, C = 1/4 - (1/12+1/15) = 1/4 - (5+4)/60 = 1/4 - 9/60 = 1/4 - 3/20 = (5-3)/20 = 2/20 = 1/10. C का हिस्सा = (1/10)/(1/4) = 4/10 = 2/5, 27000 × 2/5 = 10800' },
                    { text: 'वह छोटी से छोटी संख्या ज्ञात कीजिए जिसे 6, 9, और 12 से विभाजित करने पर शेषफल 2 बचता है।', options: ['36', '38', '40', '42'], answer: '(b) 38', explanation: 'LCM(6,9,12) = 36, 36+2=38' },
                    { text: 'पाँच क्रमागत सम संख्याओं का माध्य 54 है। इनमें से सबसे छोटी संख्या कौन सी है?', options: ['50', '52', '48', '46'], answer: '(a) 50', explanation: 'माना x, x+2, x+4, x+6, x+8, माध्य = (5x+20)/5 = x+4 = 54 → x=50' },
                    { text: 'एक संख्या के 30% और उसी संख्या के 20% का योग 450 है। उस संख्या का 80% क्या है?', options: ['600', '720', '800', '900'], answer: '(b) 720', explanation: '0.3x + 0.2x = 0.5x = 450 → x=900, 80% = 720' },
                    { text: 'त्रिज्या R वाले एक ठोस गोले को पिघलाकर त्रिज्या r वाले दो समान छोटे गोले बनाए जाते हैं। R और r के बीच क्या संबंध है?', options: ['R = ∛2 r', 'R = 2r', 'R = ∛4 r', 'R = ∛2 r?'], answer: '(a) R = ∛2 r', explanation: 'गोले का आयतन = (4/3)πR³ = 2 × (4/3)πr³ → R³ = 2r³ → R = ∛2 r' },
                    { text: 'यदि a² + 1/a² = 23, तो a⁴ + 1/a⁴ का मान ज्ञात कीजिए।', options: ['529', '527', '531', '525'], answer: '(b) 527', explanation: 'a⁴ + 1/a⁴ = (a² + 1/a²)² - 2 = 23² - 2 = 529 - 2 = 527' },
                    { text: 'यदि sec A − tan A = p है, तो sec A को p के पदों में व्यक्त कीजिए।', options: ['(p²+1)/(2p)', '(1-p²)/(2p)', '(p²-1)/(2p)', '(1+p²)/p'], answer: '(a) (p²+1)/(2p)', explanation: 'sec A + tan A = 1/p, जोड़ने पर 2 sec A = p + 1/p = (p²+1)/p → sec A = (p²+1)/(2p)' },
                    { text: 'एक आयत की दो विपरीत छोटी भुजाओं से 14 cm त्रिज्या वाले दो अर्धवृत्त जुड़े हुए हैं। आयत की लंबाई 28 cm है। आकृति का कुल क्षेत्रफल क्या है?', options: ['1400 cm²', '1008 cm²', '1124 cm²', '1232 cm²'], answer: '(b) 1008 cm²', explanation: 'आयत की चौड़ाई = 2×14 = 28 cm (व्यास), लंबाई = 28, क्षेत्र = 28×28 = 784, दो अर्धवृत्त = एक पूरा वृत्त = π×14² = 616, कुल = 784+616? नहीं, 784+? विकल्प 1008 है। वास्तव में आयत की चौड़ाई = 14? नहीं, आकृति: आयत के छोटी भुजा पर अर्धवृत्त, छोटी भुजा = 14? तो आयत का क्षेत्र = 28×14 = 392, वृत्त = π×14² = 616, कुल = 1008' },
                    { text: 'नीचे दिया गया डेटा 9 छात्रों द्वारा प्राप्त अंकों को दर्शाता है: 12, 45, 23, 67, 45, 12, 89, 54, 33. माध्यिका अंक ज्ञात कीजिए।', options: ['45', '54', '33', '23'], answer: '(a) 45', explanation: 'आरोही क्रम: 12,12,23,33,45,45,54,67,89 — माध्यिका = 5वाँ पद = 45' },
                    { text: 'एक चतुर्भुज ABCD एक वृत्त को घेरे हुए है। यदि AB = 8 cm, BC = 9 cm और CD = 6 cm है, तो AD की लंबाई ज्ञात कीजिए।', options: ['7 cm', '5 cm', '4 cm', '6 cm'], answer: '(b) 5 cm', explanation: 'चतुर्भुज के वृत्त को घेरने पर AB + CD = BC + AD → 8+6 = 9+AD → AD=5' },
                    { text: 'आंकड़ों: 10, 20, 30, 40, 50 के लिए माध्य से माध्य विचलन के गुणांक की गणना कीजिए।', options: ['0.2', '0.4', '0.5', '0.33'], answer: '(b) 0.4', explanation: 'माध्य = 30, माध्य विचलन = (20+10+0+10+20)/5 = 60/5 = 12, गुणांक = 12/30 = 0.4' },
                    { text: 'एक कोण x का पूरक (2x - 15°) के बराबर है। कोण x ज्ञात कीजिए।', options: ['25°', '30°', '35°', '40°'], answer: '(c) 35°', explanation: 'x + (2x-15) = 90 → 3x = 105 → x=35' },
                    { text: '6 cm, 8 cm, और 10 cm भुजाओं वाले एक समकोण त्रिभुज की अंतःत्रिज्या ज्ञात कीजिए।', options: ['1 cm', '2 cm', '3 cm', '1.5 cm'], answer: '(b) 2 cm', explanation: 'क्षेत्रफल = (1/2)×6×8 = 24, अर्ध-परिमाप = (6+8+10)/2 = 12, अंतःत्रिज्या r = क्षेत्रफल/अर्ध-परिमाप = 24/12=2' },
                    { text: 'रेखा 3x + 4y = 24 का y-अंतःखंड (y-intercept) क्या है?', options: ['6', '8', '4', '3'], answer: '(a) 6', explanation: 'x=0 रखने पर 4y=24 → y=6' },
                    { text: 'PQR एक समबाहु त्रिभुज है जो एक वृत्त के अंतर्गत है। बिंदु S और T क्रमशः दीर्घ और लघु चाप पर स्थित हैं। ∠QSR और ∠QTR ज्ञात कीजिए।', options: ['60°, 120°', '30°, 150°', '60°, 100°', '45°, 135°'], answer: '(a) 60°, 120°', explanation: 'समबाहु त्रिभुज में प्रत्येक कोण 60°, दीर्घ चाप पर कोण = 60°, लघु चाप पर कोण = 120° (संपूरक)' },
                    { text: 'एक लंब प्रिज्म का आधार 10 cm भुजा वाला एक समबाहु त्रिभुज है। प्रिज्म की ऊंचाई 15 cm है। कुल पृष्ठीय क्षेत्रफल क्या है?', options: ['450 + 50√3 cm²', '300 + 25√3 cm²', '450 + 100√3 cm²', '400 + 50√3 cm²'], answer: '(a) 450 + 50√3 cm²', explanation: 'पार्श्व क्षेत्र = परिमाप × ऊंचाई = 30×15 = 450, आधार क्षेत्र = (√3/4)×100 = 25√3, दो आधार = 50√3, कुल = 450 + 50√3' },
                    { text: 'A sentence is provided in direct speech. From the four given options, choose the one that most accurately conveys the sentence in its corresponding indirect speech. <br>“So intense was his fear that he could scarcely speak,” said the doctor.', options: ['The doctor said he was intensely fearful and scarcely spoke.', 'The doctor said his fear was so intense that he had scarcely spoken.', 'The doctor said that so intense had his fear been that he could scarcely speak.', 'The doctor said that his fear was so intense that he could scarcely speak.'], answer: '(d) The doctor said that his fear was so intense that he could scarcely speak.', explanation: 'सबसे सटीक indirect speech: said that his fear was so intense that he could scarcely speak.' },
                    { text: 'Rearrange the following sentences in correct order to make a meaningful passage. <br>1. The pages are processed to extract text using OCR tools. <br>2. The original sheets are uploaded as scanned images. <br>3. Mistakes in the extracted text are corrected manually. <br>4. The final file is saved as a searchable PDF.', options: ['2-1-3-4', '1-2-3-4', '1-3-2-4', '2-3-1-4'], answer: '(a) 2-1-3-4', explanation: 'स्कैन अपलोड → OCR → सुधार → सहेजें' },
                    { text: 'Identify the misspelt word:', options: ['Dialectic', 'Solipsism', 'Existantialism', 'Determinism'], answer: '(c) Existantialism', explanation: 'सही spelling: Existentialism' },
                    { text: 'Pick the correctly spelt word meaning “a skilled craft worker.”', options: ['Artizan', 'Artisan', 'Artesen', 'Artisen'], answer: '(b) Artisan', explanation: 'Artisan = कारीगर' },
                    { text: 'Change the following from active to passive: <br>The advisory panel might have been ignoring crucial inconsistencies in the dataset before the inspection.', options: ['Crucial inconsistencies in the dataset might have been being ignored by the advisory panel before the inspection.', 'Crucial inconsistencies were ignored by the panel before the inspection.', 'Crucial inconsistencies might have ignored the panel before the inspection.', 'Crucial inconsistencies had been ignored during the inspection.'], answer: '(a) Crucial inconsistencies in the dataset might have been being ignored by the advisory panel before the inspection.', explanation: 'might have been ignoring → might have been being ignored' },
                    { text: 'Select the most appropriate antonym of the given word: REPOSE', options: ['Assurance', 'Approval', 'Agitation', 'Verification'], answer: '(c) Agitation', explanation: 'REPOSE = विश्राम, Agitation = आंदोलन/अशांति' },
                    { text: 'Choose the most suitable option to replace the highlighted part of the sentence: <br>"The manager would rather the team finishes the project before the weekend begins."', options: ['finished', 'had finished', 'finish', 'will finish'], answer: '(a) finished', explanation: 'would rather + past subjunctive (finished) – I would rather he finished.' },
                    { text: 'What is the best synonym for "incommensurable" in the sentence: “rival frameworks are often incommensurable”. <br>(Passage given)', options: ['Identical', 'Symmetrical', 'Compatible', 'Incompatible'], answer: '(d) Incompatible', explanation: 'incommensurable = अतुलनीय, जो मापनीय नहीं, Incompatible = असंगत' },
                    { text: 'What does the phrase “optical reversal” imply in this context? <br>(Passage given)', options: ['A minor extension of an older theory', 'A move from specific to general reasoning', 'A radical shift in perception', 'A reversal of chronological order'], answer: '(c) A radical shift in perception', explanation: 'optical reversal का अर्थ है अनुभूति में आमूल-चूल परिवर्तन।' },
                    { text: 'According to the passage, why do revolutions disrupt continuity in science? <br>(Passage given)', options: ['Because scientists abandon evidence and rely on intuition.', 'Because new frameworks erase all prior discoveries.', 'Because rival frameworks reshape questions and standards, making direct continuity difficult.', 'Because scientists stop engaging in observation.'], answer: '(c) Because rival frameworks reshape questions and standards, making direct continuity difficult.', explanation: 'पाठ के अनुसार, प्रतिद्वंद्वी ढांचे सवालों और मानकों को नया आकार देते हैं, जिससे निरंतरता मुश्किल होती है।' },
                    { text: 'Identify the voice used in the sentence: “Irregularities are treated as measurement mistakes…” <br>(Passage given)', options: ['Active voice', 'Passive voice', 'Middle voice', 'Reflexive voice'], answer: '(b) Passive voice', explanation: 'are treated = passive voice' },
                    { text: 'What type of clause is used in the sentence: “Findings that resist explanation within the accepted framework begin to accumulate.” <br>(Passage given)', options: ['Noun clause', 'Adverbial clause', 'Relative clause', 'Independent clause'], answer: '(c) Relative clause', explanation: '"that resist explanation..." एक relative clause है जो "findings" को संशोधित करता है।' },
                    { text: 'Rearrange the following sentences in correct order to make a meaningful passage. <br>1. Past resolutions are reflected in yearly procedural updates. <br>2. Administrative proceedings are recorded in secure public ledgers. <br>3. Measures are escalated after tiered authorizations. <br>4. Compliance actions are documented at each stage.', options: ['3-4-2-1', '2-1-3-4', '1-3-4-2', '4-3-1-2'], answer: '(a) 3-4-2-1', explanation: 'उपाय → अनुपालन दस्तावेज → प्रशासनिक कार्यवाही → वार्षिक अद्यतन' },
                    { text: 'Convert the sentence provided below from its passive voice structure to an active voice structure: <br>The department’s report is being examined for irregularities by an independent auditor.', options: ['An independent auditor examined the department’s report for irregularities.', 'An independent auditor is examining the department’s report for irregularities.', 'An independent auditor was examining the department’s report for irregularities.', 'An independent auditor will examine the department’s report for irregularities.'], answer: '(b) An independent auditor is examining the department’s report for irregularities.', explanation: 'is being examined → is examining (present continuous active)' },
                    { text: 'What is the one-word term for: “A literary technique in which a text draws attention to its own fictional status—often through self-reference or characters aware they are part of a story.”', options: ['Metafiction', 'Allegory', 'Realism', 'Parable'], answer: '(a) Metafiction', explanation: 'Metafiction = आत्म-संदर्भी कथा' },
                    { text: 'Which of the following refers to “a boundary around a black hole beyond which nothing can return”?', options: ['Wormhole', 'Singularity', 'Event Horizon', 'Nebula'], answer: '(c) Event Horizon', explanation: 'Event Horizon = घटना क्षितिज' },
                    { text: 'Select the correctly spelt word meaning “a person who shuns society.”', options: ['Recluse', 'Reclusse', 'Recloose', 'Reclusee'], answer: '(a) Recluse', explanation: 'Recluse = एकांतवासी' },
                    { text: 'Find the part of the sentence that contains an error: <br>His influence (1)/ lasted less than a decade affecting (2)/ major policies (3)/ across departments. (4)', options: ['(1)', '(2)', '(3)', '(4)'], answer: '(b) (2)', explanation: 'affecting के पहले comma की आवश्यकता है या "decade" के बाद "affecting" — वाक्यांश "less than a decade affecting" गलत है।' },
                    { text: 'Select the most appropriate synonym of the given word: GARRULOUS', options: ['Loquacious', 'Taciturn', 'Reticent', 'Reserved'], answer: '(a) Loquacious', explanation: 'GARRULOUS = बातूनी, Loquacious = वाचाल' },
                    { text: 'Rearrange the following sentences in correct order to make a meaningful sentence: <br>P: but their use demands caution <br>Q: Machine-learning tools <br>R: have simplified difficult tasks <br>S: in high-stakes domains', options: ['QSRP', 'QRSP', 'QPRS', 'QPSR'], answer: '(b) QRSP', explanation: 'Machine-learning tools have simplified difficult tasks in high-stakes domains but their use demands caution.' },
                    { text: 'Fill in the blank with the most appropriate option: <br>The advertisement was so unclear that its meaning failed to ___ with viewers.', options: ['sink on', 'sink out', 'sink in', 'sink over'], answer: '(c) sink in', explanation: 'sink in = समझ में आना' },
                    { text: 'Choose the correct meaning of idiom given below: “Hold someone’s feet to the fire”', options: ['Reward someone generously', 'Press someone to meet demands or answer strictly', 'Offer someone support in trouble', 'Warn someone politely'], answer: '(b) Press someone to meet demands or answer strictly', explanation: 'मुहावरे का अर्थ: किसी को सख्ती से पूछताछ करना या जवाब मांगना।' },
                    { text: 'A sentence is provided in indirect speech. From the four given options, choose the one that most accurately conveys the sentence in its corresponding direct speech. <br>The manager reminded the staff that the concession applied only to those who had submitted a written request.', options: ['“Only those who submitted a written request can use the concession,” the manager said.', '“If you didn’t submit in writing, the concession doesn’t apply,” the manager reminded them.', '“The concession applies only to those who made written requests,” the manager said.', '“Those who haven’t requested in writing cannot use the concession,” said the manager.'], answer: '(c) “The concession applies only to those who made written requests,” the manager said.', explanation: 'सबसे सटीक प्रत्यक्ष कथन (c) है।' },
                    { text: 'Find the part of the sentence that contains an error: <br>The supposedly transparent framework (1)/ for public consultation (2)/ paradoxically obscuring (3)/ the very issues it claimed to clarify. (4)', options: ['(1)', '(2)', '(3)', '(4)'], answer: '(c) (3)', explanation: 'obscuring → obscures (क्योंकि यह क्रिया main verb होनी चाहिए, "framework obscures")' },
                    { text: 'Convert the sentence provided below from its passive voice structure to an active voice structure: <br>The material had been being assembled for days before the launch.', options: ['They were assembling the material for days before the launch.', 'They had been assembling the material for days before the launch.', 'They had assembled the material for days before the launch.', 'They had been assembled the material for days before the launch.'], answer: '(b) They had been assembling the material for days before the launch.', explanation: 'had been being assembled → had been assembling' }
                ]
            },
            computed: {
                answeredCount() {
                    return this.questions.filter(q => q.showAnswer).length;
                }
            },
            methods: {
                toggleAnswer(idx) {
                    this.questions[idx].showAnswer = !this.questions[idx].showAnswer;
                    this.allOpen = this.questions.every(q => q.showAnswer === true);
                },
                toggleAllAnswers() {
                    const newState = !this.allOpen;
                    this.questions.forEach(q => q.showAnswer = newState);
                    this.allOpen = newState;
                },
                resetAnswers() {
                    this.questions.forEach(q => q.showAnswer = false);
                    this.allOpen = false;
                }
            }
        });
    </script>

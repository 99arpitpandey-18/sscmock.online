o:[`(a) 70`,`(b) 72`,`(c) 74`,`(d) 76`],a:`(b) 72`,e:`For five consecutive even numbers, the mean is the middle number: 64, 66, 68, 70, 72. Greatest = 72.`

q:`Q60. Given that (√𝑎 + 1/√𝑎)² = 10, find the value of 𝑎² + 1/𝑎².`,
o:[`(a) 60`,`(b) 61`,`(c) 62`,`(d) 63`],a:`(c) 62`,e:`(√a + 1/√a)² = a + 1/a + 2 = 10, so a + 1/a = 8. Squaring gives a² + 1/a² + 2 = 64, hence the required value is 62.`
},
{
q:`Q61. The difference between the simple interest on ₹5,000 for 3 years and 4 years at the same rate of interest per annum is ₹500. Find the rate of interest.`,

{
q:`Q62. A cylindrical container with internal radius 7 cm and height 30 cm is completely filled with water. The water is then poured into identical conical vessels, each having a radius of 3.5 cm and height of 6 cm. How many such conical vessels can be completely filled with the water from the cylinder?`,
o:[`(a) 45`,`(b) 54`,`(c) 60`,`(d) 72`],a:`(c) 60`,e:`Cylinder volume = π×7²×30 = 1470π. Cone volume = (1/3)π×3.5²×6 = 24.5π. Ratio = 1470/24.5 = 60.`
},
{

const root=document.getElementById("questions");

questions.forEach((item,index)=>{
    const card=document.createElement("div");
    card.className="question";
    card.innerHTML=`
        <div class="qtext">${escapeHTML(item.q)}</div>
        <div class="options">${item.o.map(escapeHTML).join("\n")}</div>
        <button class="answer-btn" onclick="toggleAnswer(${index})">Show Answer</button>
        <div class="answer-box" id="ans-${index}">
            <div class="correct">✓ Correct Answer: ${escapeHTML(item.a)}</div>
            <div class="explain"><b>Explanation:</b> ${escapeHTML(item.e)}</div>
        </div>
    `;
    root.appendChild(card);
});

function escapeHTML(str){
    return String(str)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
}
function toggleAnswer(i){
    const box=document.getElementById("ans-"+i);
    const btn=box.previousElementSibling;
    box.classList.toggle("show");
    btn.textContent=box.classList.contains("show") ? "Hide Answer" : "Show Answer";
}
let allShown=false;
function toggleAll(){
    allShown=!allShown;
    document.querySelectorAll(".answer-box").forEach((box)=>{
        box.classList.toggle("show",allShown);
    });
    document.querySelectorAll(".answer-btn").forEach((btn)=>{
        btn.textContent=allShown ? "Hide Answer" : "Show Answer";
    });
    document.querySelector(".toggle-all").innerHTML=
        allShown ? "▣ &nbsp; Hide All Answers &amp; Explanations" :
                   "▣ &nbsp; Show / Hide All Answers &amp; Explanations";
}
</script>

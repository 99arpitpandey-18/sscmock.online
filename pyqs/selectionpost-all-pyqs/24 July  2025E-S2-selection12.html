<script>
const paper = [{"id": 1, "q": "Statements:<br>1. All engineers are problem-solvers.<br>2. Some problem-solvers are creative.<br>3. No creative person is careless.<br><br><b>Conclusions:<\/b><br>I. Some engineers are creative.<br>II. Some problem-solvers are not careless.", "options": ["Only I follows", "Only II follows", "Both I and II follow", "Neither I nor II follows"], "answer": 1, "answerLetter": "b", "explanation": "Some problem-solvers are creative, and no creative person is careless, so those creative problem-solvers are not careless. No conclusion that some engineers are creative follows."}, {"id": 2, "q": "In a numbering system, 5-digit codes are formed where the first digit cannot be zero. What is the maximum number of such unique codes possible?", "options": ["90,000", "99,999", "1,00,000", "89,999"], "answer": 0, "answerLetter": "a", "explanation": "The first digit has 9 choices (1–9), while each of the remaining four digits has 10 choices. Thus 9 × 10⁴ = 90,000."}, {"id": 3, "q": "Assuming the statements given below are true, which of the following conclusions can be logically deduced?<br><br><b>Statement:<\/b> The company has introduced flexible working hours for its employees.<br><b>Conclusions:<\/b><br>I. Employees can choose their working time.<br>II. The company aims to improve work-life balance.", "options": ["Only I follows", "Only II follows", "Both I and II follow", "Neither I nor II follows"], "answer": 0, "answerLetter": "a", "explanation": "Flexible working hours directly support the conclusion that employees can choose their working time. The purpose of the policy is not stated, so II cannot be deduced."}, {"id": 4, "q": "Find the appropriate word that can replace the question mark (?) and logically complete the sequence: Pager, Mobile, Smartphone, ?", "options": ["Tablet", "Laptop", "Smartwatch", "Desktop"], "answer": 2, "answerLetter": "c", "explanation": "The sequence moves through increasingly advanced forms of portable communication devices; Smartwatch is the intended next term."}, {"id": 5, "q": "The ratio of present ages of X and Y is 5 : 6. After 4 years, the ratio will be 6 : 7. What is X’s present age?", "options": ["20 years", "24 years", "30 years", "36 years"], "answer": 0, "answerLetter": "a", "explanation": "Let ages be 5x and 6x. Then (5x+4)/(6x+4)=6/7, giving 35x+28=30x+24, so x=−0.8; hence the supplied answer is inconsistent with the stated ratios. The source marks (a) 20 years."}, {"id": 6, "q": "Some mathematical operations are given below. Choose the expression which is mathematically correct.<br>If X = 12, Y = 18, and Z = 24, what is the value of ((X + Y) × Z) mod 10?", "options": ["0", "2", "6", "8"], "answer": 0, "answerLetter": "a", "explanation": "(12+18)×24 = 30×24 = 720. The remainder when 720 is divided by 10 is 0."}, {"id": 7, "q": "Instruction: Identify the assumptions that must hold for the statement to be valid and choose the correct option.<br><br>Statement: Excessive use of social media among teenagers leads to reduced physical activity, increased stress levels, and negatively affects mental health.<br><br>Assumptions:<br>I. Social media usage influences the lifestyle and habits of teenagers.<br>II. Reduced physical activity has no impact on mental health.<br>III. Increased screen time can contribute to stress and mental health issues.", "options": ["Only I and III are implicit", "Only II and III are implicit", "Only I is implicit", "All assumptions are implicit"], "answer": 0, "answerLetter": "a", "explanation": "The statement assumes that social-media use can influence teenage habits and that increased screen time can contribute to stress/mental-health problems. II contradicts the context."}, {"id": 8, "q": "In this question, some conditions are given. You have to make a logical judgment.<br>1. All birds have wings.<br>2. No mammals have wings.<br>Which of the following must be true?", "options": ["All winged animals are birds", "No birds are mammals", "Some birds are mammals", "All mammals are flightless"], "answer": 1, "answerLetter": "b", "explanation": "If every bird has wings and no mammal has wings, a bird cannot be a mammal. Therefore no birds are mammals."}, {"id": 9, "q": "Which number does NOT belong to the sequence? 4, 10, 15, 28, 40, 54", "options": ["10", "15", "28", "40"], "answer": 1, "answerLetter": "b", "explanation": "15 is the odd term in the intended pattern; the source marks (b)."}, {"id": 10, "q": "Some social situations are given below. Choose the most appropriate course of action.<br>You are leading a team where one member has recently become less communicative and avoids group discussions, though their work output is satisfactory. Other team members feel coordination is suffering.", "options": ["Issue a formal warning about communication gaps", "Redistribute their tasks to other team members", "Have a private, supportive conversation to understand concerns and offer help", "Ignore the issue since work quality is unaffected"], "answer": 2, "answerLetter": "c", "explanation": "A private, supportive conversation addresses the communication problem without making assumptions or escalating unnecessarily."}, {"id": 11, "q": "In the following question, select the related word from the given alternatives:<br>Judge : Court :: Doctor : ?", "options": ["Hospital", "Medicine", "Patient", "Nurse"], "answer": 0, "answerLetter": "a", "explanation": "A judge works in a court; similarly, a doctor works in a hospital."}, {"id": 12, "q": "In this question, four sets of name and address are given, out of which two are exactly same. Find those two combinations.<br>1. Bhopal Head Office Bhopal GPO Campus - 462001<br>2. Bhopal Head Office Bhopal GPO Campus - 462001<br>3. Bhopal Head Office Bhopal PPO Campus - 462001<br>4. Bhopal Head Office Bhopal GPO Campas - 462001", "options": ["1 and 2", "1 and 3", "2 and 4", "3 and 4"], "answer": 0, "answerLetter": "a", "explanation": "Items 1 and 2 are exactly identical."}, {"id": 13, "q": "Some equations are defined using symbols and mathematical relations. Identify the correct value.<br>If X ★ Y = (X - Y)² + Y, then 7 ★ 3 is?", "options": ["19", "20", "21", "22"], "answer": 0, "answerLetter": "a", "explanation": "(7−3)²+3 = 16+3 = 19."}, {"id": 14, "q": "In the following question, the second term is derived from the first term by applying a specific pattern involving alphabetical positions and alphanumeric manipulation. Decode the logic and apply it to the second pair.<br><br>COLD : P27D :: WARM : ?", "options": ["J28M", "H19M", "G28M", "J19M"], "answer": 3, "answerLetter": "d", "explanation": "Applying the intended coding pattern gives J19M; this is the answer supplied in the paper."}, {"id": 15, "q": "In a family tree: • A is the mother of B • B is the sister of C • C is the father of D. What is A’s relation to D?", "options": ["Grandmother", "Aunt", "Mother", "Sister"], "answer": 0, "answerLetter": "a", "explanation": "A is B’s mother. B and C are siblings, so A is also C’s mother. Since C is D’s father, A is D’s grandmother."}, {"id": 16, "q": "What will come at the place of question mark? 4, 20, 120, 840, ?", "options": ["6720", "7560", "8400", "7200"], "answer": 0, "answerLetter": "a", "explanation": "Multiply successively by 5, 6, 7, so the next multiplication is by 8: 840×8=6720."}, {"id": 17, "q": "Find the missing number in the series: 2, 6, 12, 20, ?", "options": ["28", "30", "32", "36"], "answer": 1, "answerLetter": "b", "explanation": "The terms are n(n+1): 1×2=2, 2×3=6, 3×4=12, 4×5=20, so 5×6=30."}, {"id": 18, "q": "Three of the following four groups are alike in a certain pattern. Find the one which does not belong to the group.", "options": ["ABCD", "MNOP", "WXYZ", "ABDC"], "answer": 3, "answerLetter": "d", "explanation": "ABCD, MNOP and WXYZ are four consecutive letters in alphabetical order. ABDC is not in consecutive order."}, {"id": 19, "q": "Unscramble the letters to make a meaningful word that fits one of the given categories: LPAENET", "options": ["City", "Animal", "Planet", "River"], "answer": 2, "answerLetter": "c", "explanation": "LPAENET rearranges to PLANET."}, {"id": 20, "q": "Statement: A team leader prefers a familiar software tool over a newer, more efficient one because the old tool has been used for years without major issues. Question: Which cognitive bias is influencing the decision, and how should it be addressed?", "options": ["Anchoring bias; rely only on first impressions", "Status quo bias; compare options using current performance data", "Confirmation bias; ignore feedback from others", "Availability bias; choose what is most memorable"], "answer": 1, "answerLetter": "b", "explanation": "Preferring the familiar option simply because it is established is status quo bias. The better response is to compare alternatives using current evidence."}, {"id": 21, "q": "If 48 is coded as 2, 6, 8, then what is the code for 75?", "options": ["3, 5, 15", "5, 15, 25", "3, 15, 25", "5, 25, 75"], "answer": 0, "answerLetter": "a", "explanation": "48 = 2×2×2×2×3, so the intended code lists factors. 75 = 3×5×5, giving 3, 5, 15 in the paper's coding convention."}, {"id": 22, "q": "In the following question, select the number that will replace the question mark (?) to complete the analogy: 64 : 343 :: 36 : ?", "options": ["125", "216", "256", "196"], "answer": 0, "answerLetter": "a", "explanation": "64=4³ and 343=7³. Similarly, 36=6²; the intended analogy in the source gives 125=5³."}, {"id": 23, "q": "Few letters are given followed by a question mark (?). These letters follow a specific pattern. Choose the correct option that can replace the question mark.<br>CC, FF, JJ, OO, ?", "options": ["TT", "SS", "RR", "UU"], "answer": 3, "answerLetter": "d", "explanation": "The letter positions increase by 3, 4, 5, then 6: C→F→J→O→U. Thus UU."}, {"id": 24, "q": "Read the following scenario carefully and choose the most appropriate course of action.<br>You notice that a colleague has repeatedly missed deadlines, affecting team performance. They seem stressed but deny any problem. What should you do?", "options": ["Report the colleague immediately to senior management for disciplinary action.", "Ignore the situation and adjust your own work to compensate for the delays.", "Speak to the colleague privately to understand the issue and help find a solution.", "Publicly warn the colleague during a team meeting to improve accountability."], "answer": 2, "answerLetter": "c", "explanation": "A private conversation is constructive, respects the colleague, and can uncover the cause while protecting team performance."}, {"id": 25, "q": "Each question has four options. Three of them go together based on a common rule. One is different. Identify the odd one.", "options": ["6 : 21", "7 : 28", "8 : 36", "9 : 40"], "answer": 3, "answerLetter": "d", "explanation": "For n, the first three follow n(n−1)/2 + n? The intended odd pair is 9:40; the source marks (d)."}, {"id": 26, "q": "Iso-cost line is also known as ________ line.", "options": ["budget", "Output", "demand", "revenue"], "answer": 0, "answerLetter": "a", "explanation": "An iso-cost line shows combinations of inputs that have the same total cost, analogous to a budget line."}, {"id": 27, "q": "The concept of “sustainable development” emphasizes:", "options": ["Unlimited industrial growth without environmental concerns", "Meeting present needs without compromising the ability of future generations to meet their own needs", "Maximizing GDP irrespective of resource depletion", "Promoting only urban development"], "answer": 1, "answerLetter": "b", "explanation": "Sustainable development balances present needs with the ability of future generations to meet their needs."}, {"id": 28, "q": "Which Article of the Indian Constitution provides for the abolition of untouchability?", "options": ["Article 15", "Article 16", "Article 17", "Article 18"], "answer": 2, "answerLetter": "c", "explanation": "Article 17 abolishes untouchability and forbids its practice in any form."}, {"id": 29, "q": "Which cell organelle is known as the “powerhouse of the cell”?", "options": ["Ribosome", "Chloroplast", "Mitochondria", "Nucleus"], "answer": 2, "answerLetter": "c", "explanation": "Mitochondria generate most of the cell’s usable energy in the form of ATP."}, {"id": 30, "q": "Which statement is correct about India’s performance in the ICC Cricket World Cup 2011?", "options": ["India lost in the semi-finals to Australia.", "India defeated Sri Lanka in the final to win the title.", "India did not qualify for the knockout stage.", "The tournament was hosted only by India."], "answer": 1, "answerLetter": "b", "explanation": "India defeated Sri Lanka in the final at Mumbai and won the 2011 World Cup."}, {"id": 31, "q": "Which among the following pairs is NOT correctly matched about Indian classical dance forms and their states?", "options": ["Kathak – Uttar Pradesh", "Bharatanatyam – Tamil Nadu", "Kuchipudi – Kerala", "Odissi – Odisha"], "answer": 2, "answerLetter": "c", "explanation": "Kuchipudi is associated with Andhra Pradesh, not Kerala."}, {"id": 32, "q": "What is the primary objective of the Gaganyaan Mission launched by ISRO?", "options": ["Launching communication satellites", "Sending Indian astronauts into space", "Exploring Mars surface", "Studying ocean currents"], "answer": 1, "answerLetter": "b", "explanation": "Gaganyaan is India’s human-spaceflight programme, intended to send Indian astronauts to low Earth orbit."}, {"id": 33, "q": "Which Constitutional Amendment lowered the voting age from 21 years to 18 years in India?", "options": ["42nd Amendment", "44th Amendment", "61st Amendment", "73rd Amendment"], "answer": 2, "answerLetter": "c", "explanation": "The 61st Constitutional Amendment Act, 1988, lowered the voting age from 21 to 18."}, {"id": 34, "q": "In Hindustani classical music, which instrument is primarily used to maintain the rhythmic cycle (taal)?", "options": ["Tabla", "Sitar", "Flute", "Violin"], "answer": 0, "answerLetter": "a", "explanation": "Tabla is the principal percussion instrument used to maintain rhythmic cycles in Hindustani music."}, {"id": 35, "q": "Which of the following agencies is responsible for managing India’s space research and satellite launches?", "options": ["DRDO", "ISRO", "NASA", "HAL"], "answer": 1, "answerLetter": "b", "explanation": "ISRO is India’s principal space agency responsible for space research and launch programmes."}, {"id": 36, "q": "Which of the following is an example of an endothermic reaction?", "options": ["Combustion of coal", "Respiration", "Melting of ice", "Burning of LPG"], "answer": 2, "answerLetter": "c", "explanation": "Melting of ice absorbs heat from the surroundings, so it is an endothermic process."}, {"id": 37, "q": "Read the following statements marked as Assertion (A) and Reason (R).<br>Assertion (A): The monsoon winds in India are seasonal in nature.<br>Reason (R): The differential heating of land and sea causes seasonal reversal of wind direction.", "options": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true, but R is false.", "A is false, but R is true."], "answer": 0, "answerLetter": "a", "explanation": "Land and sea heat differently, producing seasonal pressure changes and reversal of monsoon winds. Both statements are true and R explains A."}, {"id": 38, "q": "Which of the following is NOT a rabi crop?<br>1. Wheat<br>2. Gram<br>3. Rice<br>4. Mustard<br>5. Barley<br>6. Peas", "options": ["1, 2, 5", "3", "3, 4, 6", "2, 4, 6"], "answer": 1, "answerLetter": "b", "explanation": "Rice is primarily a kharif crop; wheat, gram, mustard, barley and peas are rabi crops."}, {"id": 39, "q": "Who launched the PM Gati Shakti National Master Plan in India?", "options": ["Narendra Modi", "Amit Shah", "Nitin Gadkari", "Piyush Goyal"], "answer": 0, "answerLetter": "a", "explanation": "Prime Minister Narendra Modi launched PM Gati Shakti in October 2021."}, {"id": 40, "q": "Which of the following statements accurately describes the book ‘Wings of Fire’ by A.P.J. Abdul Kalam?", "options": ["A fictional novel on space exploration", "Autobiography of A.P.J. Abdul Kalam", "A detailed study of India’s foreign policy", "A scientific textbook on missile technology"], "answer": 1, "answerLetter": "b", "explanation": "Wings of Fire is the autobiography of A.P.J. Abdul Kalam, written with Arun Tiwari."}, {"id": 41, "q": "Which Article of the Constitution empowers the Supreme Court to transfer cases from one High Court to another?", "options": ["Article 131", "Article 139A", "Article 226", "Article 142"], "answer": 1, "answerLetter": "b", "explanation": "Article 139A empowers the Supreme Court to transfer certain cases between High Courts when constitutional conditions are met."}, {"id": 42, "q": "Read the following statements marked as Assertion (A) and Reason (R).<br>Assertion (A): The Non-Cooperation Movement was launched in 1920.<br>Reason (R): It was started in response to the Jallianwala Bagh massacre and the Khilafat issue.", "options": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true, but R is false.", "A is false, but R is true."], "answer": 0, "answerLetter": "a", "explanation": "The movement began in 1920 amid opposition to British actions including the Punjab atrocities and support for the Khilafat cause. Both are true and the reason explains the context."}, {"id": 43, "q": "Which of the following pairs of Mughal rulers and their immediate successors is correctly matched?", "options": ["Humayun – Jahangir", "Akbar – Jahangir", "Jahangir – Aurangzeb", "Shah Jahan – Akbar"], "answer": 1, "answerLetter": "b", "explanation": "Akbar was succeeded by his son Jahangir in 1605."}, {"id": 44, "q": "Consider the following statements about the Quad grouping (India, USA, Japan, Australia):<br>1. The Quad was revived in 2017.<br>2. It primarily focuses on promoting a free and open Indo-Pacific region.<br>3. China is a permanent member of the Quad.", "options": ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"], "answer": 0, "answerLetter": "a", "explanation": "The Quad consists of India, the US, Japan and Australia. It was revived in 2017 and promotes a free and open Indo-Pacific; China is not a member."}, {"id": 45, "q": "Which of the following statements about the Goods and Services Tax (GST) Council is/are correct?<br>1. It is chaired by the Union Finance Minister.<br>2. It includes the Finance Ministers of all States.<br>3. Its decisions are binding without any voting mechanism.", "options": ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"], "answer": 0, "answerLetter": "a", "explanation": "The Union Finance Minister chairs the GST Council and state finance/tax ministers participate. The Council does have a voting mechanism, so 3 is false."}, {"id": 46, "q": "Which of the following rivers flows into the Arabian Sea?", "options": ["Godavari", "Krishna", "Narmada", "Mahanadi"], "answer": 2, "answerLetter": "c", "explanation": "Narmada flows westward into the Arabian Sea. Godavari, Krishna and Mahanadi drain into the Bay of Bengal."}, {"id": 47, "q": "Read the following two statements carefully and choose the correct option:<br>Statement 1: The 73rd Constitutional Amendment Act deals with Panchayati Raj Institutions.<br>Statement 2: It added Part IX to the Constitution of India.", "options": ["Only 1", "Only 2", "Both 1 and 2 are correct", "Neither 1 nor 2 is correct"], "answer": 2, "answerLetter": "c", "explanation": "The 73rd Amendment constitutionalised Panchayati Raj and inserted Part IX dealing with Panchayats."}, {"id": 48, "q": "Match the space mission with its primary objective:<br>1. Chandrayaan-1 - Moon exploration<br>2. Gaganyaan - Human spaceflight<br>3. Astrosat - Space observatory", "options": ["1–Human spaceflight, 2–Moon exploration, 3–Mars study", "1–Moon exploration, 2–Human spaceflight, 3–Space observatory", "1–Mars orbit, 2–Sun study, 3–Lunar rover", "1–Space observatory, 2–Mars orbit, 3–Human spaceflight"], "answer": 1, "answerLetter": "b", "explanation": "Chandrayaan-1 explored the Moon, Gaganyaan targets human spaceflight, and Astrosat is a multi-wavelength space observatory."}, {"id": 49, "q": "Which of the following is a macroeconomic objective of the 1991 Economic Reforms in India?", "options": ["Nationalization of private banks", "Increasing import restrictions", "Liberalization of trade and industry", "Abolition of private sector participation"], "answer": 2, "answerLetter": "c", "explanation": "The 1991 reforms aimed to liberalize trade and industry, reduce controls and encourage greater efficiency."}, {"id": 50, "q": "Match the Constitutional Amendment with its key feature:<br>1. 42nd Amendment Act - Added Fundamental Duties<br>2. 44th Amendment Act - Restored certain Emergency provisions<br>3. 73rd Amendment Act - Panchayati Raj Institutions", "options": ["1–Right to Property removed from Fundamental Rights, 2–Added Fundamental Duties, 3–Panchayati Raj", "1–Added Fundamental Duties, 2–Restored certain Emergency provisions, 3–Panchayati Raj Institutions", "1–Panchayati Raj, 2–Added Fundamental Duties, 3–Emergency provisions", "1–Emergency provisions strengthened, 2–Panchayati Raj, 3–Added Fundamental Duties"], "answer": 1, "answerLetter": "b", "explanation": "The 42nd added Fundamental Duties; the 44th reversed/modified several Emergency-era provisions; the 73rd constitutionalised Panchayati Raj."}, {"id": 51, "q": "Find the value of: 1/(3−√8) + 6 − 1/(3+√8) + 6/(9−8)", "options": ["4√2", "4√2", "6", "3√2"], "answer": 0, "answerLetter": "a", "explanation": "Rationalising the surds and simplifying gives the paper's marked answer (a) 4√2. The source formatting of this expression is fragmented, so the explanation follows the supplied answer."}, {"id": 52, "q": "Two cars start from places A and B, 100 km apart, towards each other and meet in 1 hour. If they travel in the same direction, they meet in 5 hours. Find the speed of the faster car.", "options": ["60 km/h", "40 km/h", "70 km/h", "80 km/h"], "answer": 0, "answerLetter": "a", "explanation": "Let speeds be u and v. Opposite directions: u+v=100. Same direction: u−v=20. Solving gives u=60 km/h and v=40 km/h."}, {"id": 53, "q": "The difference between CI and SI on a certain sum for 2 years at 15% per annum is ₹225. Find the sum.", "options": ["₹8,000", "₹9,000", "₹10,000", "₹12,000"], "answer": 2, "answerLetter": "c", "explanation": "For 2 years, CI−SI = P(r/100)². Thus 225=P×0.15², giving P=₹10,000."}, {"id": 54, "q": "A cricketer has an average of 45 runs in 14 innings. How many runs must he score in the 15th inning to increase his average to 47?", "options": ["70", "75", "68", "72"], "answer": 1, "answerLetter": "b", "explanation": "Current total = 14×45=630. Required total = 15×47=705. Required score = 705−630=75."}, {"id": 55, "q": "The profit made by selling an article for ₹1200 is equal to the loss incurred by selling it for ₹900. What should be the selling price to gain 20%?", "options": ["₹1260", "₹1300", "₹1150", "₹1250"], "answer": 0, "answerLetter": "a", "explanation": "Equal profit and loss around the cost price means CP=(1200+900)/2=₹1050. A 20% gain requires 1050×1.2=₹1260."}, {"id": 56, "q": "Find the value of (3x/8 + 3x)(9/x² − 9 + 9x²) if x = 2", "options": ["1755/8", "1865/8", "1701/8", "1650/8"], "answer": 0, "answerLetter": "a", "explanation": "Substitute x=2 into the supplied expression and simplify; the paper marks (a) 1755/8."}, {"id": 57, "q": "A merchant mixes 30 kg of tea at ₹400/kg with 20 kg of tea at ₹500/kg. He sells the mixture at ₹480/kg. What is his profit percentage?", "options": ["8.5%", "9.09%", "10%", "11.11%"], "answer": 1, "answerLetter": "b", "explanation": "Cost = 30×400+20×500=₹22,000 for 50 kg, so CP/kg=₹440. Profit/kg=₹40; profit%=40/440×100≈9.09%."}, {"id": 58, "q": "What percent of 0.1 cubic meters is 50,000 cubic centimeters?", "options": ["25%", "50%", "10%", "5%"], "answer": 1, "answerLetter": "b", "explanation": "0.1 m³ = 100,000 cm³. Therefore 50,000/100,000×100 = 50%."}, {"id": 59, "q": "Two chords AB and CD of a circle intersect at a point P inside the circle. If AP = 10 cm, PB = 6 cm, and CP = 4 cm, find the length of PD.", "options": ["12 cm", "15 cm", "18 cm", "14 cm"], "answer": 1, "answerLetter": "b", "explanation": "By the intersecting-chords theorem, AP×PB=CP×PD. Thus 10×6=4×PD, so PD=15 cm."}, {"id": 60, "q": "In a factory, Machine A produces 70% of the items and Machine B produces 30%. 2% of A's production is defective and 5% of B's production is defective. If an item is selected at random and found to be defective, what is the probability it came from Machine B?", "options": ["15/29", "14/29", "12/29", "10/29"], "answer": 0, "answerLetter": "a", "explanation": "P(B|defective)=0.30×0.05/(0.70×0.02+0.30×0.05)=0.015/0.029=15/29."}, {"id": 61, "q": "An equilateral triangle and a square have the same perimeter. What is the ratio of the area of the triangle to the area of the square?", "options": ["3√3", "4:3", "4√3 : 9", "9:4√3"], "answer": 2, "answerLetter": "c", "explanation": "If the common perimeter is P, triangle side=P/3 and square side=P/4. Their areas give ratio [√3P²/36] : [P²/16] = 4√3:9."}, {"id": 62, "q": "An arc of a circle of radius 21 cm subtends an angle of 60° at the center. Find the length of the arc. (Use π = 22/7)", "options": ["11 cm", "22 cm", "33 cm", "44 cm"], "answer": 1, "answerLetter": "b", "explanation": "Arc length=(60/360)×2πr=(1/6)×2×22/7×21=22 cm."}, {"id": 63, "q": "A sphere is inscribed in a hemisphere of radius R such that it touches the curved surface and the plane base. What is the radius of this inscribed sphere?", "options": ["R/2", "R/3", "R/√2", "2R/3"], "answer": 0, "answerLetter": "a", "explanation": "In a central cross-section, the sphere touches the base and the hemisphere at its top. The geometry gives sphere radius r=R/2."}, {"id": 64, "q": "A right prism has a regular hexagonal base of side 6 cm. If the height of the prism is 10 cm, find its lateral surface area.", "options": ["360 cm²", "300 cm²", "240 cm²", "420 cm²"], "answer": 0, "answerLetter": "a", "explanation": "Lateral surface area = perimeter of base × height = (6×6)×10 = 360 cm²."}, {"id": 65, "q": "If sec θ + tan θ = 3, find the value of tan θ.", "options": ["3/4", "4/3", "1/3", "5/3"], "answer": 1, "answerLetter": "b", "explanation": "Use (secθ+tanθ)(secθ−tanθ)=1, so secθ−tanθ=1/3. Subtract: 2tanθ=3−1/3=8/3, hence tanθ=4/3."}, {"id": 66, "q": "From the top of a 60 m high tower, the angle of depression of a car moving away changes from 45° to 30° in 5 seconds. What is the speed of the car?", "options": ["12(√3−1) m/s", "12√3 m/s", "10(√3−1) m/s", "15(√3−1) m/s"], "answer": 0, "answerLetter": "a", "explanation": "At 45°, horizontal distance is 60 m. At 30°, it is 60√3 m. Distance travelled in 5 s is 60(√3−1), so speed=12(√3−1) m/s."}, {"id": 67, "q": "What is the largest 4-digit number that is exactly divisible by 72?", "options": ["9936", "9960", "9984", "9992"], "answer": 0, "answerLetter": "a", "explanation": "The largest 4-digit number is 9999. 9999÷72 is not integral; the greatest lower multiple is 72×138=9936."}, {"id": 68, "q": "Simplify (√3+√7)².", "options": ["10+2√21", "10+√21", "21+2√10", "5+2√21"], "answer": 0, "answerLetter": "a", "explanation": "(√3+√7)²=3+7+2√21=10+2√21."}, {"id": 69, "q": "A can do a work in 12 days and B in 15 days. They contract to do the work for ₹9,600. With the help of C, they finish it in 5 days. How much does C get?", "options": ["₹2,000", "₹2,400", "₹2,800", "₹3,000"], "answer": 1, "answerLetter": "b", "explanation": "A+B rate=1/12+1/15=3/20. In 5 days they do 3/4 work, so C completes 1/4 in 5 days. C's share of ₹9,600 = ₹2,400."}, {"id": 70, "q": "A and B invest ₹50,000 and ₹70,000. After one year, the total profit is ₹24,000. What is A's share of the profit?", "options": ["₹10,000", "₹14,000", "₹12,000", "₹9,000"], "answer": 0, "answerLetter": "a", "explanation": "Investment ratio=50,000:70,000=5:7. A gets 5/12 of ₹24,000 = ₹10,000."}, {"id": 71, "q": "What is the x-intercept of the line 5x + 3y = 15?", "options": ["5", "3", "15", "2"], "answer": 1, "answerLetter": "b", "explanation": "At the x-intercept, y=0. Thus 5x=15, so x=3."}, {"id": 72, "q": "PA and PB are tangents to a circle from an external point P. If the length of PA is 12 cm, what is the length of PB?", "options": ["10 cm", "12 cm", "24 cm", "6 cm"], "answer": 1, "answerLetter": "b", "explanation": "Tangents drawn from the same external point to a circle are equal, so PB=PA=12 cm."}, {"id": 73, "q": "In triangle ABC, the area is 60 cm² and the product of the lengths of its three sides is 2400. Find the circumradius of the triangle.", "options": ["8 cm", "10 cm", "12 cm", "15 cm"], "answer": 1, "answerLetter": "b", "explanation": "Using Δ=abc/(4R), R=abc/(4Δ)=2400/(4×60)=10 cm."}, {"id": 74, "q": "The mean of a set of 5 numbers is 20. If a number 'p' is added, the mean becomes 22. If another number 'q' replaces 'p', the mean of the original 5 plus 'q' becomes 24. Find p + q.", "options": ["60", "64", "76", "78"], "answer": 2, "answerLetter": "c", "explanation": "Original sum=5×20=100. With p, total=6×22=132, so p=32. With q, total=6×24=144, so q=44. Hence p+q=76."}, {"id": 75, "q": "For a given frequency distribution, if the Mean is 50, the Mode is 44, and the Standard Deviation is 4, find the Karl Pearson's coefficient of skewness.", "options": ["0.5", "1.5", "2.0", "1.2"], "answer": 1, "answerLetter": "b", "explanation": "Karl Pearson skewness=(Mean−Mode)/SD=(50−44)/4=1.5."}, {"id": 76, "q": "Find the part of the sentence that contains an error:<br>The talented orator (1)/ managed to put out (2)/ his complex ideas (3)/ to the audience with great clarity. (4)", "options": ["(1)", "(2)", "(3)", "(4)"], "answer": 1, "answerLetter": "b", "explanation": "“Put out” is incorrect here. The intended expression is “put across” or “put forward” his ideas."}, {"id": 77, "q": "What is the one-word substitute for: “The technique of using light and shadow to create depth in visual art”?", "options": ["Chiaroscuro", "Fresco", "Mosaic", "Pointillism"], "answer": 0, "answerLetter": "a", "explanation": "Chiaroscuro is the artistic use of strong contrasts between light and dark to create depth and volume."}, {"id": 78, "q": "Choose the most suitable option to replace the highlighted part of the sentence:<br>Rarely, you meet a person so committed to duty.", "options": ["do you meet", "have you meet", "you met", "did you met"], "answer": 0, "answerLetter": "a", "explanation": "After a negative/limiting adverb such as “Rarely” at the beginning, subject–auxiliary inversion is used: “Rarely do you meet…”."}, {"id": 79, "q": "Which term refers to “a state in which individuals feel anonymous and therefore act with reduced personal accountability”?", "options": ["Deindividuation", "Cognitive Dissonance", "Self-Justification", "Moral Disengagement"], "answer": 0, "answerLetter": "a", "explanation": "Deindividuation is the psychological state in which reduced self-awareness/anonymity can lessen personal accountability."}, {"id": 80, "q": "Convert the sentence provided below from its passive voice structure to an active voice structure:<br>The minister’s address was being interpreted into several languages by official translators.", "options": ["Official translators had interpreted the minister’s address into several languages.", "Official translators are interpreting the minister’s address into several languages.", "Official translators were interpreting the minister’s address into several languages.", "Official translators interpreted the minister’s address into several languages."], "answer": 2, "answerLetter": "c", "explanation": "The passive past continuous “was being interpreted” becomes active past continuous “were interpreting.”"}, {"id": 81, "q": "Select the most appropriate antonym of the given word. Magnanimous", "options": ["Benevolent", "Self-centred", "Noble", "Generous"], "answer": 1, "answerLetter": "b", "explanation": "Magnanimous means generous and noble-minded; “self-centred” is the closest opposite."}, {"id": 82, "q": "A sentence is provided in direct speech. From the four given options, choose the one that most accurately conveys the sentence in its corresponding indirect speech.<br>“May I propose a modification to clause three?” the advocate asked courteously.", "options": ["The advocate proposed to modify clause three.", "The advocate courteously asked may he propose a modification.", "The advocate courteously inquired whether he might propose a modification to clause three.", "The advocate advised modifying clause three."], "answer": 2, "answerLetter": "c", "explanation": "“May I…?” is a polite request for permission, reported as “inquired whether he might…”."}, {"id": 83, "q": "Rearrange the following sentences in correct order to make a meaningful passage.<br>1. Sensor units transmitted readings to the monitoring server.<br>2. A corrective update was deployed to address anomalies.<br>3. System logs were examined for irregular spikes.<br>4. Engineers traced the origin of the interference.", "options": ["1-2-3-4", "3-2-1-4", "4-2-1-3", "1-3-4-2"], "answer": 3, "answerLetter": "d", "explanation": "The logical process is: readings arrive → logs are examined → engineers trace the interference → corrective update is deployed: 1-3-4-2."}, {"id": 84, "q": "Select the most appropriate synonym of the given word. QUIESCENT", "options": ["Dormant", "Noisy", "Boisterous", "Turbulent"], "answer": 0, "answerLetter": "a", "explanation": "Quiescent means quiet, inactive or dormant."}, {"id": 85, "q": "Find the part of the sentence that contains an error:<br>The CEO emphasized that (1)/ the new recruits (2)/ must demonstrate (3)/ punctuality, dedication, and be creative. (4)/", "options": ["(1)", "(2)", "(3)", "(4)"], "answer": 3, "answerLetter": "d", "explanation": "The list should be parallel: “must demonstrate punctuality, dedication, and creativity” or “must be punctual, dedicated, and creative.”"}, {"id": 86, "q": "Rearrange the following sentences in correct order to make a meaningful passage.<br>1. The final report is submitted to the international review body for ratification.<br>2. Stakeholders then examine drafts and recommend corrections.<br>3. After incorporating inputs, a final version is compiled.<br>4. In the beginning, national consultations produce region-specific findings.", "options": ["1-3-2-4", "4-2-3-1", "2-4-3-1", "3-1-2-4"], "answer": 1, "answerLetter": "b", "explanation": "The process begins with consultations, then stakeholder review, compilation of the final version, and submission for ratification: 4-2-3-1."}, {"id": 87, "q": "Choose the correct meaning of idiom given below: “Know which way the wind blows”", "options": ["Remain undecided in every matter", "Understand the prevailing trend or public mood", "Seek constant approval from others", "Avoid all risks"], "answer": 1, "answerLetter": "b", "explanation": "The idiom means to understand the current situation, trend or prevailing opinion."}, {"id": 88, "q": "Identify the grammatical role of “whereby” in the clause: “...secret conference, whereby reckless slanders were sown...”", "options": ["Preposition", "Conjunction", "Relative Adverb", "Pronoun"], "answer": 2, "answerLetter": "c", "explanation": "“Whereby” means “by which/through which” and functions as a relative adverb."}, {"id": 89, "q": "What is the closest meaning of “grievous” as used in the passage?<br><br><i>Passage context:<\/i> “...the designs of foreign Powers signal a disturbance most grievous to the peace of Europe.”", "options": ["Routine", "Severe and painful", "Hidden", "Insignificant"], "answer": 1, "answerLetter": "b", "explanation": "In this context, grievous means serious, severe or causing great distress."}, {"id": 90, "q": "The word “slanders” most nearly means:<br><br><i>Passage context:<\/i> “...reckless slanders were sown...”", "options": ["Truthful remarks", "Festive announcements", "Malicious false statements", "Formal directives"], "answer": 2, "answerLetter": "c", "explanation": "Slander refers to false and damaging statements intended to harm someone's reputation."}, {"id": 91, "q": "According to the passage, what is the chief aim of the official “appeal” to the citizenry?", "options": ["To promote public festivities", "To boost commerce", "To caution against hostile influence while preserving order", "To declare a new administration"], "answer": 2, "answerLetter": "c", "explanation": "The appeal asks citizens to remain vigilant but orderly, guarding against hostile influence without creating disorder."}, {"id": 92, "q": "In the sentence “...lest hostile stratagems leave our coasts exposed,” the word “stratagems” is a:", "options": ["Adjective", "Noun", "Adverb", "Verb"], "answer": 1, "answerLetter": "b", "explanation": "“Stratagems” names plans or schemes, so it is a noun."}, {"id": 93, "q": "Fill in the blank with the most appropriate option:<br>By the time the medical team arrived, the residents __ to safer ground.", "options": ["have moved", "had moved", "moved", "would move"], "answer": 1, "answerLetter": "b", "explanation": "The residents' movement happened before another past event (“arrived”), so past perfect “had moved” is appropriate."}, {"id": 94, "q": "Rearrange the following sentences in correct order to make a meaningful sentence:<br>P. among industry stakeholders for review<br>Q. to obtain structured feedback before approval<br>R. the draft compliance guidelines<br>S. prepared by the inter-ministerial committee", "options": ["RQSP", "PQRS", "QRSP", "RSQP"], "answer": 3, "answerLetter": "d", "explanation": "The grammatical sequence is “the draft compliance guidelines prepared by the inter-ministerial committee among industry stakeholders for review to obtain structured feedback before approval”: R-S-P-Q."}, {"id": 95, "q": "Convert the sentence provided below from its passive voice structure to an active voice structure:<br>This editorial is going to be published by the journal.", "options": ["The journal will publish this editorial.", "The journal is going to publish this editorial.", "The journal publishes this editorial.", "The journal had published this editorial."], "answer": 1, "answerLetter": "b", "explanation": "The passive “is going to be published” becomes active “is going to publish.”"}, {"id": 96, "q": "Change the following from active to passive:<br>The reviewers would have amended the draft if fresh evidence had been presented.", "options": ["The draft would have been amended by the reviewers if fresh evidence had been presented.", "The draft would amend by the reviewers if fresh evidence had been presented.", "The draft could be amended by the reviewers if fresh evidence had been presented.", "The draft was amended by the reviewers if fresh evidence had been presented."], "answer": 0, "answerLetter": "a", "explanation": "The object “the draft” becomes the passive subject, preserving the conditional perfect: “would have been amended.”"}, {"id": 97, "q": "Which word has a spelling mistake?", "options": ["Convalescence", "Obsequious", "Conflageration", "Reticent"], "answer": 2, "answerLetter": "c", "explanation": "The correct spelling is “conflagration,” not “conflageration.”"}, {"id": 98, "q": "A sentence is provided in indirect speech. From the four given options, choose the one that most accurately conveys the sentence in its corresponding direct speech.<br>The analyst remarked that the report, although comprehensive, was inconsistent in its interpretation of data.", "options": ["“The report is comprehensive, but your interpretation is inconsistent,” the analyst remarked.", "“Though the report is comprehensive, the interpretation of the data is not consistent,” said the analyst.", "“It’s comprehensive, but the data interpretation is inconsistent,” the analyst said.", "“Your interpretation is inconsistent even though the report is comprehensive,” said the analyst."], "answer": 1, "answerLetter": "b", "explanation": "Option (b) preserves the report's comprehensiveness and the inconsistency in its interpretation without changing the referents."}, {"id": 99, "q": "Select the correctly spelled word meaning ‘stubbornly defiant of authority’.", "options": ["Recalcitrant", "Recalserant", "Recalcittrent", "Ricalcetrant"], "answer": 0, "answerLetter": "a", "explanation": "“Recalcitrant” means stubbornly resistant or defiant of authority."}, {"id": 100, "q": "Choose the correctly spelt word that means ‘excessively talkative, especially about trivial matters’.", "options": ["Garrulous", "Garrolous", "Garruless", "Garralouse"], "answer": 0, "answerLetter": "a", "explanation": "“Garrulous” means excessively talkative, especially about unimportant matters."}];

const sectionInfo = [
    {
        start:1,
        end:25,
        title:"🧠 Reasoning & Quantitative Aptitude (Q1 – Q25)"
    },
    {
        start:26,
        end:50,
        title:"📚 General Awareness & General Studies (Q26 – Q50)"
    },
    {
        start:51,
        end:75,
        title:"📐 Quantitative Aptitude (Q51 – Q75)"
    },
    {
        start:76,
        end:100,
        title:"🔤 English Language (Q76 – Q100)"
    }
];

const letters = ["a","b","c","d"];
const paperEl = document.getElementById("paper");

function escapeHTML(value){
    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

function renderPaper(list=paper){
    paperEl.innerHTML = "";

    sectionInfo.forEach(section => {
        const questions = list.filter(q => q.id >= section.start && q.id <= section.end);
        if(!questions.length) return;

        const sectionEl = document.createElement("section");
        sectionEl.className = "section";

        const heading = document.createElement("h2");
        heading.className = "section-title";
        heading.textContent = section.title;
        sectionEl.appendChild(heading);

        questions.forEach(item => {
            const card = document.createElement("div");
            card.className = "question-card";

            const optionsHTML = item.options.map((opt,index) => `
                <div class="option">
                    <b>(${letters[index]})</b> ${escapeHTML(opt)}
                </div>
            `).join("");

            card.innerHTML = `
                <div class="question-text">
                    <span class="question-number">Q${item.id}.</span>
                    ${escapeHTML(item.q)}
                </div>

                <div class="options">
                    ${optionsHTML}
                </div>

                <button class="answer-btn" onclick="toggleAnswer(this)">
                    Show Answer
                </button>

                <div class="answer-box">
                    <div class="answer-line">
                        Answer: (${item.answerLetter}) ${escapeHTML(item.options[item.answer])}
                    </div>
                    <div class="explanation">
                        <b>Explanation:</b> ${escapeHTML(item.explanation)}
                    </div>
                </div>
            `;

            sectionEl.appendChild(card);
        });

        paperEl.appendChild(sectionEl);
    });

    document.getElementById("noResults").style.display =
        list.length ? "none" : "block";
}

function toggleAnswer(button){
    const box = button.nextElementSibling;
    box.classList.toggle("show");
    button.textContent = box.classList.contains("show")
        ? "Hide Answer"
        : "Show Answer";
}

let allOpen = false;

function toggleAll(){
    allOpen = !allOpen;

    document.querySelectorAll(".answer-box").forEach(box => {
        box.classList.toggle("show", allOpen);
    });

    document.querySelectorAll(".answer-btn").forEach(btn => {
        btn.textContent = allOpen ? "Hide Answer" : "Show Answer";
    });
}

document.getElementById("language").addEventListener("change", function(){
    const hi = this.value === "hi";

    document.getElementById("langLabel").textContent =
        hi ? "भाषा:" : "भाषा बदलें:";

    document.getElementById("dropText").textContent =
        hi ? "(Interface Hindi में)" : "(Dropdown में Hindi चुने)";

    document.getElementById("allBtn").textContent =
        hi
        ? "▣  सभी उत्तर और व्याख्या दिखाएँ / छिपाएँ"
        : "▣  Show / Hide All Answers & Explanations";

    document.querySelectorAll(".answer-btn").forEach(btn => {
        const box = btn.nextElementSibling;
        btn.textContent = box.classList.contains("show")
            ? (hi ? "उत्तर छिपाएँ" : "Hide Answer")
            : (hi ? "उत्तर देखें" : "Show Answer");
    });
});

window.addEventListener("scroll", function(){
    document.getElementById("topBtn").style.display =
        window.scrollY > 450 ? "block" : "none";
});

renderPaper();
</script>

</body>

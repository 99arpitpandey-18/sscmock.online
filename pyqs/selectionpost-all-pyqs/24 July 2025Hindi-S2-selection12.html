<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC Selection Post (Higher Secondary) – 24 Jul 2025</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f2f5f9;
            color: #1e2a3a;
            padding: 20px;
        }
        .container {
            max-width: 920px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            padding: 30px 35px 50px;
        }
        .exam-header {
            border-bottom: 3px solid #e6edf5;
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
        }
        .exam-title {
            font-size: 26px;
            font-weight: 700;
            color: #0b2b4a;
            letter-spacing: -0.3px;
        }
        .exam-title small {
            font-weight: 400;
            font-size: 16px;
            color: #5e6f8d;
            margin-left: 10px;
        }
        .exam-meta {
            font-size: 15px;
            color: #4a5b77;
            background: #eef3fa;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 500;
        }
        .question-card {
            background: #fafcff;
            border-radius: 16px;
            padding: 22px 28px;
            margin-bottom: 24px;
            border: 1px solid #e9eef4;
            transition: box-shadow 0.2s;
        }
        .question-card:hover {
            box-shadow: 0 4px 14px rgba(0,20,50,0.04);
        }
        .q-number {
            display: inline-block;
            font-weight: 700;
            font-size: 17px;
            color: #1e4a7a;
            background: #e2ebf6;
            padding: 0 12px;
            border-radius: 30px;
            line-height: 30px;
            margin-bottom: 12px;
        }
        .q-text {
            font-size: 18px;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 16px;
            color: #142433;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 28px;
            margin-bottom: 18px;
        }
        @media (max-width: 550px) {
            .options { grid-template-columns: 1fr; gap: 6px; }
        }
        .option-item {
            font-size: 16px;
            padding: 6px 0 6px 8px;
            color: #1f3349;
            border-bottom: 1px dashed #dce4ee;
            display: flex;
            align-items: baseline;
        }
        .option-item .opt-label {
            font-weight: 600;
            color: #2f4a6e;
            margin-right: 10px;
            min-width: 20px;
        }
        .answer-section {
            margin-top: 8px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px 20px;
        }
        .btn-answer {
            background: none;
            border: none;
            color: #1a66b3;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            padding: 6px 0;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-bottom: 2px solid transparent;
        }
        .btn-answer:hover {
            color: #0b3b73;
            border-bottom-color: #1a66b3;
        }
        .btn-answer .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
            font-size: 14px;
        }
        .btn-answer.active .arrow {
            transform: rotate(180deg);
        }
        .answer-box {
            background: #eef6fb;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 500;
            color: #004080;
            display: none;
            flex: 1;
            min-width: 140px;
            border-left: 5px solid #2d7bcb;
        }
        .answer-box.open {
            display: block;
        }
        .answer-box .ans-label {
            font-weight: 700;
            color: #003366;
            margin-right: 6px;
        }
        .answer-box .explanation {
            font-weight: 400;
            color: #1f3b5c;
            font-size: 15px;
            margin-top: 4px;
            border-top: 1px solid #c8d9ec;
            padding-top: 6px;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 12px;
            padding: 10px 0;
            border-top: 2px solid #e6edf5;
            border-bottom: 2px solid #e6edf5;
        }
        .toolbar .left {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .toolbar button {
            background: #eef3fa;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            color: #1e3b5e;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toolbar button:hover {
            background: #d7e2f0;
            color: #0b2a4a;
        }
        .toolbar button.primary {
            background: #1a4d7a;
            color: white;
        }
        .toolbar button.primary:hover {
            background: #0f3a5f;
        }
        .toolbar .stats {
            font-size: 15px;
            color: #3a5678;
            font-weight: 500;
        }
        @media (max-width: 600px) {
            .container { padding: 18px 14px; }
            .exam-title { font-size: 20px; }
            .exam-title small { display: block; margin-left: 0; font-size: 14px; }
            .question-card { padding: 18px 16px; }
            .q-text { font-size: 17px; }
            .option-item { font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="exam-header">
            <div class="exam-title">
                SSC Selection Post (Higher Secondary)
                <small>24 Jul 2025 · All 100 Qs</small>
            </div>
            <div class="exam-meta">📝 Shift 2 · PYQ</div>
        </div>

        <div class="toolbar">
            <div class="left">
                <button @click="toggleAllAnswers" class="primary">
                    <span v-if="allOpen">🔽 Hide All Answers</span>
                    <span v-else>🔼 Show All Answers</span>
                </button>
                <button @click="resetAnswers">↺ Reset</button>
            </div>
            <div class="stats">
                <span>{{ answeredCount }}</span> / <span>{{ questions.length }}</span> shown
            </div>
        </div>

        <div v-for="(q, idx) in questions" :key="idx" class="question-card">
            <div class="q-number">Q{{ idx + 1 }}</div>
            <div class="q-text" v-html="q.text"></div>
            <div class="options">
                <div v-for="(opt, oi) in q.options" :key="oi" class="option-item">
                    <span class="opt-label">{{ String.fromCharCode(97 + oi) }}.</span>
                    <span v-html="opt"></span>
                </div>
            </div>
            <div class="answer-section">
                <button class="btn-answer" :class="{ active: q.showAnswer }"
                        @click="toggleAnswer(idx)">
                    <span class="arrow">▼</span>
                    <span v-if="!q.showAnswer">Show Answer</span>
                    <span v-else>Hide Answer</span>
                </button>
                <div class="answer-box" :class="{ open: q.showAnswer }">
                    <span class="ans-label">✔ Answer:</span>
                    <span v-html="q.answer"></span>
                    <div v-if="q.explanation" class="explanation" v-html="q.explanation"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
    <script>
        new Vue({
            el: '#app',
            data: {
                allOpen: false,
                questions: [
                    // ----- Q1 to Q100 from the provided text (Higher Secondary) -----
                    // Q1
                    {
                        text: 'कथन: <br>1. सभी इंजीनियर समस्या-समाधानकर्ता हैं। <br>2. कुछ समस्या-समाधानकर्ता रचनात्मक हैं। <br>3. कोई भी रचनात्मक व्यक्ति लापरवाह नहीं है। <br><br>निष्कर्ष: <br>I. कुछ इंजीनियर रचनात्मक हैं। <br>II. कुछ समस्या-समाधानकर्ता लापरवाह नहीं हैं।',
                        options: ['केवल I अनुसरण करता है', 'केवल II अनुसरण करता है', 'I और II दोनों अनुसरण करते हैं', 'न तो I और न ही II अनुसरण करता है'],
                        answer: '(b) केवल II अनुसरण करता है',
                        explanation: 'I नहीं निकलता क्योंकि सभी इंजीनियर समस्या-समाधानकर्ता हैं और कुछ समस्या-समाधानकर्ता रचनात्मक हैं → यह आवश्यक नहीं कि वे इंजीनियर हों। II निकलता है क्योंकि सभी रचनात्मक लापरवाह नहीं हैं, और कुछ समस्या-समाधानकर्ता रचनात्मक हैं → वे लापरवाह नहीं हैं।'
                    },
                    // Q2
                    {
                        text: 'एक संख्या प्रणाली में, 5-अंकीय कोड बनाए जाते हैं जहाँ पहला अंक शून्य नहीं हो सकता है। ऐसे अद्वितीय कोडों की अधिकतम संख्या क्या है?',
                        options: ['90,000', '99,999', '1,00,000', '89,999'],
                        answer: '(a) 90,000',
                        explanation: 'पहला अंक: 1-9 (9 विकल्प), बाकी 4 अंक: 10×10×10×10 = 10⁴ → 9×10000 = 90,000'
                    },
                    // Q3
                    {
                        text: 'यह मानते हुए कि नीचे दिए गए कथन सत्य हैं, निम्नलिखित में से कौन सा निष्कर्ष तार्किक रूप से निकाला जा सकता है? <br>कथन: कंपनी ने अपने कर्मचारियों के लिए लचीले काम के घंटे शुरू किए हैं। <br><br>निष्कर्ष: <br>I. कर्मचारी अपने काम का समय चुन सकते हैं। <br>II. कंपनी का उद्देश्य कार्य-जीवन संतुलन में सुधार करना है।',
                        options: ['केवल I अनुसरण करता है', 'केवल II अनुसरण करता है', 'I और II दोनों अनुसरण करते हैं', 'न तो I और न ही II अनुसरण करता है'],
                        answer: '(a) केवल I अनुसरण करता है',
                        explanation: 'लचीले घंटे का मतलब है कर्मचारी अपना समय चुन सकते हैं (I), लेकिन उद्देश्य के बारे में कोई जानकारी नहीं (II नहीं)।'
                    },
                    // Q4
                    {
                        text: 'वह उपयुक्त शब्द ज्ञात कीजिए जो प्रश्न चिह्न (?) को प्रतिस्थापित कर सके और शृंखला को तार्किक रूप से पूरा कर सके: <br>पेजर, मोबाइल, स्मार्टफोन, ?',
                        options: ['टैबलेट', 'लैपटॉप', 'स्मार्टवॉच', 'डेस्कटॉप'],
                        answer: '(c) स्मार्टवॉच',
                        explanation: 'क्रम: संचार उपकरणों का विकास → पेजर → मोबाइल → स्मार्टफोन → स्मार्टवॉच (पहनने योग्य तकनीक)'
                    },
                    // Q5
                    {
                        text: 'X और Y की वर्तमान आयु का अनुपात 5 : 6 है। 4 वर्षों बाद, अनुपात 6 : 7 होगा। X की वर्तमान आयु क्या है?',
                        options: ['20 वर्ष', '24 वर्ष', '30 वर्ष', '36 वर्ष'],
                        answer: '(a) 20 वर्ष',
                        explanation: 'माना X=5k, Y=6k. (5k+4)/(6k+4) = 6/7 → 35k+28 = 36k+24 → k=4 → X=20'
                    },
                    // Q6
                    {
                        text: 'कुछ गणितीय संक्रियाएं नीचे दी गई हैं। वह व्यंजक चुनें जो गणितीय रूप से सही है। <br>यदि X = 12, Y = 18, और Z = 24, तो ((X + Y) × Z) mod 10 का मान क्या है?',
                        options: ['0', '2', '6', '8'],
                        answer: '(a) 0',
                        explanation: '(12+18)×24 = 30×24 = 720 → 720 mod 10 = 0'
                    },
                    // Q7
                    {
                        text: 'निर्देश: उन मान्यताओं की पहचान करें जो कथन के मान्य होने के लिए होनी चाहिए और सही विकल्प चुनें। <br>कथन: किशोरों के बीच सोशल मीडिया के अत्यधिक उपयोग से शारीरिक गतिविधि कम हो जाती है, तनाव का स्तर बढ़ जाता है, और मानसिक स्वास्थ्य पर नकारात्मक प्रभाव पड़ता है। <br><br>मान्यताएं: <br>I. सोशल मीडिया का उपयोग किशोरों की जीवन शैली और आदतों को प्रभावित करता है। <br>II. कम शारीरिक गतिविधि का मानसिक स्वास्थ्य पर कोई प्रभाव नहीं पड़ता है। <br>III. स्क्रीन टाइम बढ़ने से तनाव और मानसिक स्वास्थ्य समस्याएं हो सकती हैं।',
                        options: ['केवल I और III निहित हैं', 'केवल II और III निहित हैं', 'केवल I निहित है', 'सभी मान्यताएं निहित हैं'],
                        answer: '(a) केवल I और III निहित हैं',
                        explanation: 'I और III स्पष्ट रूप से निहित हैं; II कथन का विरोध करता है।'
                    },
                    // Q8
                    {
                        text: 'इस प्रश्न में, कुछ शब्दें दी गई हैं। आपको तार्किक निर्णय लेना है। <br>1. सभी पक्षियों के पास पंख होते हैं। <br>2. किसी भी स्तनधारी के पास पंख नहीं होते हैं। <br><br>निम्नलिखित में से क्या सत्य होना चाहिए?',
                        options: ['सभी पंख वाले जानवर पक्षी हैं', 'कोई भी पक्षी स्तनधारी नहीं है', 'कुछ पक्षी स्तनधारी हैं', 'सभी स्तनधारी उड़ने में असमर्थ हैं'],
                        answer: '(b) कोई भी पक्षी स्तनधारी नहीं है',
                        explanation: 'यदि सभी पक्षियों के पंख हैं और कोई स्तनधारी पंख नहीं रखता, तो पक्षी और स्तनधारी असंगत हैं।'
                    },
                    // Q9
                    {
                        text: 'अनुक्रम में कौन सी संख्या संबंधित नहीं है? 4, 10, 15, 28, 40, 54',
                        options: ['10', '15', '28', '40'],
                        answer: '(b) 15',
                        explanation: 'अन्य सभी 2×(संख्या)+2? 4→10 (4*2+2), 10→22? नहीं। वास्तव में सभी 4,10,28,40,54 सम संख्याएँ हैं, 15 विषम है।'
                    },
                    // Q10
                    {
                        text: 'कुछ सामाजिक स्थितियाँ नीचे दी गई हैं। कार्रवाई का सबसे उपयुक्त तरीका चुनें। <br>आप एक टीम का नेतृत्व कर रहे हैं जहाँ एक सदस्य हाल ही में कम मिलनसार हो गया है और समूह चर्चाओं से बचता है, हालाँकि उनका कार्य आउटपुट संतोषजनक है। टीम के अन्य सदस्यों को लगता है कि समन्वय प्रभावित हो रहा है।',
                        options: ['संचार अंतराल के बारे में औपचारिक चेतावनी जारी करें', 'उनके कार्यों को टीम के अन्य सदस्यों को पुनर्वितरित करें', 'चिंताओं को समझने और मदद की पेशकश करने के लिए निजी, सहायक बातचीत करें', 'मुद्दे को नजरअंदाज करें क्योंकि कार्य की गुणवत्ता प्रभावित नहीं है'],
                        answer: '(c) चिंताओं को समझने और मदद की पेशकश करने के लिए निजी, सहायक बातचीत करें',
                        explanation: 'सबसे उचित प्रबंधन दृष्टिकोण सहानुभूतिपूर्ण संचार है।'
                    },
                    // Q11
                    {
                        text: 'निम्नलिखित प्रश्न में, दिए गए विकल्पों में से संबंधित शब्द का चयन करें: <br>न्यायाधीश : अदालत :: डॉक्टर : ?',
                        options: ['अस्पताल', 'दवा', 'मरीज', 'नसीहत'],
                        answer: '(a) अस्पताल',
                        explanation: 'न्यायाधीश अदालत में काम करता है, डॉक्टर अस्पताल में।'
                    },
                    // Q12
                    {
                        text: 'इस प्रश्न में, नाम और पते के चार सेट दिए गए हैं, जिनमें से दो बिल्कुल समान हैं। उन दो संयोजनों को ढूँढें। <br>1. Bhopal Head Office Bhopal GPO Campus - 462001 <br>2. Bhopal Head Office Bhopal GPO Campus - 462001 <br>3. Bhopal Head Office Bhopal PPO Campus - 462001 <br>4. Bhopal Head Office Bhopal GPO Campas - 462001',
                        options: ['1 और 2', '1 और 3', '2 और 4', '3 और 4'],
                        answer: '(a) 1 और 2',
                        explanation: '1 और 2 बिल्कुल समान हैं, बाकी में अंतर है।'
                    },
                    // Q13
                    {
                        text: 'कुछ समीकरण प्रतीकों और गणितीय संबंधों का उपयोग करके परिभाषित किए गए हैं। सही मान पहचानें। <br>यदि X ★ Y = (X - Y)² + Y, तो 7 ★ 3 है?',
                        options: ['19', '20', '21', '22'],
                        answer: '(a) 19',
                        explanation: '(7-3)² + 3 = 16+3 = 19'
                    },
                    // Q14
                    {
                        text: 'निम्नलिखित प्रश्न में, दूसरे पद को पहले पद से अक्षर स्थितियों और अंकीय हेरफेर से जुड़े एक विशिष्ट पैटर्न को लागू करके व्युत्पन्न किया गया है। उसे डिकोड करें और इसे दूसरे युग्म पर लागू करें। <br>COLD : P27D :: WARM : ?',

                toggleAllAnswers() {
                    const newState = !this.allOpen;
                    this.questions.forEach(q => q.showAnswer = newState);

                },
                resetAnswers() {
                    this.questions.forEach(q => q.showAnswer = false);
                    this.allOpen = false;
                }
            }

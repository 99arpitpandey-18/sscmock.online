const questions=[{"n": 1, "q": "Find the next letter: D, G, K, P, ?", "opts": [["a", "U"], ["b", "V"], ["c", "W"], ["d", "T"]], "ans": "b", "explanation": "Letter jumps are +3, +4, +5, so the next jump is +6: P(16)+6=V."}, {"n": 2, "q": "Identify the number that breaks the series: \n6, 12, 20, 32, 42", "opts": [["a", "12"], ["b", "20"], ["c", "32"], ["d", "42"]], "ans": "c", "explanation": "The intended pattern is 6, 12, 20, 30, 42; hence 32 breaks it."}, {"n": 3, "q": "In a distributed system using consistent hashing, the load factor is 1.4 and there are 10 servers. What \nis the maximum number of keys?", "opts": [["a", "12"], ["b", "13"], ["c", "14"], ["d", "15"]], "ans": "c", "explanation": "Load factor × servers = 1.4×10 = 14 keys."}, {"n": 4, "q": "A firm notices declining sales over three months. What should management do first?", "opts": [["a", "Reduce staff"], ["b", "Shut operations"], ["c", "Analyse market trends"], ["d", "Increase prices"]], "ans": "c", "explanation": "The first step is to analyse market trends before taking corrective action."}, {"n": 5, "q": "Choose the word that does not belong to the group.", "opts": [["a", "Pilot"], ["b", "Driver"], ["c", "Sailor"], ["d", "Painter"]], "ans": "d", "explanation": "Pilot, driver and sailor are occupations associated with operating vehicles; painter is the odd one out."}, {"n": 6, "q": "If TABLE is coded as 40, then how is CHAIR coded?", "opts": [["a", "38"], ["b", "40"], ["c", "42"], ["d", "39"]], "ans": "d", "explanation": "Using the coding pattern given in the question, CHAIR corresponds to 39."}, {"n": 7, "q": "Choose the odd pair.", "opts": [["a", "4 - 20"], ["b", "6 - 42"], ["c", "8 - 72"], ["d", "9 - 81"]], "ans": "d", "explanation": "4×5=20, 6×7=42, 8×9=72; 9×10 would be 90, not 81."}, {"n": 8, "q": "If a team member is overloaded with work, what should a leader do?", "opts": [["a", "Ignore the issue"], ["b", "Reassign tasks appropriately"], ["c", "Criticize publicly"], ["d", "Remove from team"]], s; only the valid conclusion in the source key is retained."}, {"n": 15, "q": "Two trains of equal length cross a pole in 12 s and 18 s respectively. What is the ratio of their speeds?", "opts": [["a", "2 : 3"], ["b", "3 : 2"], ["c", "4 : 3"], ["d", "3 : 4"]], "ans": "b", "explanation": "The missing term follows the letter/number pattern indicated by the source; answer key retained."}, {"n": 16, "q": "Find the missing term: 9, 18, 36, 72, ?", "opts": [["a", "96"], ["b", "108"], ["c", "144"], ["d", "162"]], "ans": "c", "explanation": "The most appropriate professional action is to communicate clearly and address the issue constructively."}, {"n": 17, "q": "Arrange the following logically: \n1. Examination \n2. Preparation \n3. Result \n4. Admission", "opts": [["a", "2-1-3-4"], ["b", "1-2-3-4"], ["c", "2-1-4-3"], ["d", "1-3-2-4"]], "ans": "a", "explanation": "The sequence follows the indicated arithmetic progression/pattern; the keyed answer is retained."}, {"n": 18, "q": "Pointing to a boy, Meena said, “He is the son of my mother’s brother.” How is the boy related to Meena?", "opts": [["a", "Brother"], ["b", "Cousin"], ["c", "Nephew"], ["d", "Uncle"]], "ans": "b", "explanation": "The best managerial response is to investigate the cause before taking drastic action."}, {"n": 19, "q": "If @ means +, # means ×, $ means - and % means ÷, Find the value of: 60 % 5 # 2 @ 6 $ 4?", "opts": [["a", "26"], ["b", "28"], ["c", "30"], ["d", "32"]], "ans": "a", "explanation": "The analogy follows the same relationship shown in the first pair."}, {"n": 20, "q": "Statements: \n1. All teachers are graduates. \n2. Some graduates are researchers. \nConclusions: \nI. Some teachers are researchers \nII. All researchers are graduates", "opts": [["a", "Only I follows"], ["b", "Only II follows"], ["c", "Both follow"], ["d", "Neither follows"]], "ans": "d", "explanation": "The coded word follows the same letter-position transformation used in the example."}, {"n": 21, "q": "Statements: \nI. All tablets are electronic devices. \nII. Some electronic devices are portable. \nWhich of the following conclusions logically follows from the given statements?", "opts": [["a", "Some tablets are portable"], ["b", "All tablets are portable"], ["c", "No tablet is portable"], ["d", "No definite conclusion"]], "ans": "d", "explanation": "The correct sequence is the one that preserves the natural chronological/logical order."}, {"n": 22, "q": "Statement: \n“The government reduced fuel prices to control inflation.” \nConclusions: \nI. Inflation was rising. \nII. Fuel prices affect inflation.", "opts": [["a", "Only I follows"], ["b", "Only II follows"], ["c", "Both follow"], ["d", "Neither follows"]], "ans": "c", "explanation": "The statement directly follows from the given premise under the standard logical relation."}, {"n": 23, "q": "Pen : Writing :: Knife : ?", "opts": [["a", "Cutting"], ["b", "Cooking"], ["c", "Painting"], ["d", "Printing"]], "ans": "a", "explanation": "The family relationship is obtained by tracing the stated parent-child links."}, {"n": 24, "q": "5 : 25 :: 8 : ?", "opts": [["a", "48"], ["b", "56"], ["c", "64"], ["d", "72"]], "ans": "c", "explanation": "The conclusion must be supported directly by the statement; unrelated assumptions are not valid."}, {"n": 25, "q": "Find the missing number: 2, 5, 10, 17, ?, 37", "opts": [["a", "24"], ["b", "26"], ["c", "28"], ["d", "30"]], "ans": "b", "explanation": "Choose the option that best follows from the stated condition rather than an unstated assumption."}, {"n": 26, "q": "Which of the following goods does NOT violate the law of demand?", "opts": [["a", "Giffen goods"], ["b", "Veblen goods"], ["c", "Normal goods"], ["d", "Speculative goods"]], "ans": "c", "explanation": "The answer follows from the relevant General Awareness fact stated/targeted in the question; the supplied answer key is retained."}, {"n": 27, "q": "In Kabaddi, when does the defending team score a point?", "opts": [["a", "Raider crosses bo

            // ─── attach toggle events ───
            document.querySelectorAll('.show-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    const box = document.getElementById(targetId);
                    if (!box) return;
                    const isOpen = box.classList.contains('open');
                    if (isOpen) {
                        box.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '▶ <span class="arrow">▶</span> Show Answer';
                    } else {
                        box.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '▼ <span class="arrow">▼</span> Hide Answer';
                    }
                });
            });
        }

        renderQuestions();

        // ─── Toggle All ───
        toggleBtn.addEventListener('click', function() {
            allOpen = !allOpen;
            const boxes = document.querySelectorAll('.answer-box');
            const btns = document.querySelectorAll('.show-btn');
            if (allOpen) {
                boxes.forEach(b => b.classList.add('open'));
                btns.forEach(b => {
                    b.classList.add('active');
                    b.innerHTML = '▼ <span class="arrow">▼</span> Hide Answer';
                });
                this.textContent = '▼ Collapse All Answers';
            } else {
                boxes.forEach(b => b.classList.remove('open'));
                btns.forEach(b => {
                    b.classList.remove('active');
                    b.innerHTML = '▶ <span class="arrow">▶</span> Show Answer';
                });
                this.textContent = '▶ Expand All Answers';
            }
        });

        // ─── update toggle all text if any answer is open ───
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.show-btn');
            if (!btn) return;
            // after a moment, check if all are open
            setTimeout(() => {
                const allBoxes = document.querySelectorAll('.answer-box');
                const openBoxes = document.querySelectorAll('.answer-box.open');
                if (openBoxes.length === allBoxes.length && allBoxes.length > 0) {
                    toggleBtn.textContent = '▼ Collapse All Answers';
                    allOpen = true;
                } else if (openBoxes.length === 0) {
                    toggleBtn.textContent = '▶ Expand All Answers';
                    allOpen = false;
                } else {
                    // mixed state — keep toggle text neutral
                    toggleBtn.textContent = '▶ Expand All Answers';
                    allOpen = false;
                }
            }, 50);
        });
    </script>

</body>
</html>

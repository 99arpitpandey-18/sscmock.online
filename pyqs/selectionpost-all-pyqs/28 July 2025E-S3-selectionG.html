const passage1=`“Critical interpretation often begins with the assumption that a work’s meaning is anchored in the person who produced it, as if literature ultimately speaks through a single consciousness and the trace of a private intention. The view of literature we are taught to preserve is relentlessly centered on the author—on biography, psychology, and motive. Yet to assign a text an Author is to place a boundary around it, to supply it with a final meaning, and to seal its possibilities. This way of thinking emerges from rationalist and capitalist traditions that elevate the individual as the primary unit of history, granting coherence and authority to personal origin. In practice, however, writing dissolves origins: it unravels the singular voice, and language speaks—not the author.

To set aside the Author is not to discard meaning, but to resist the tyranny of one authoritative meaning. The text becomes a field of plural readings where interpretation remains open-ended rather than fixed. The unity of a text is located not at its source but at its destination; it is the reader—not the author—who activates meaning. This shift transfers power from creator to interpreter, from intended message to the endless play of signs within the text.”`;

const sections=[
[0,25,"🧠 Reasoning Ability (Q1–Q25)"],
[25,50,"🌍 General Awareness (Q26–Q50)"],
[50,75,"📐 Quantitative Aptitude (Q51–Q75)"],
[75,100,"📚 English Language (Q76–Q100)"]
];

function render(){
 const root=document.getElementById("questions");
 let out="";
 sections.forEach(([start,end,title])=>{
   out+=`<h2 class="section">${title}</h2>`;
   for(let i=start;i<end;i++){
     const q=qs[i];
     out+=`<div class="card">
       <div class="q">${q[0]}</div>
       ${q[4] ? `<div class="passage">${q[4]}</div>` : ""}
       <div class="options">${q[1].map((o,j)=>`<div class="option"><b>(${String.fromCharCode(97+j)})</b> ${o}</div>`).join("")}</div>
       <button class="answer-btn" onclick="toggle(this)">Show Answer</button>
       <div class="solution"><strong>Answer: ${q[2]}</strong><br><br>${q[3]}</div>
     </div>`;
   }
 });
 root.innerHTML=out;
}
function toggle(btn){
 const box=btn.nextElementSibling;
 const show=box.style.display!=="block";
 box.style.display=show?"block":"none";
 btn.textContent=show?"Hide Answer":"Show Answer";
}
function toggleAll(show){
 document.querySelectorAll(".solution").forEach(x=>x.style.display=show?"block":"none");
 document.querySelectorAll(".answer-btn").forEach(x=>x.textContent=show?"Hide Answer":"Show Answer");
}
render();
</script>
</body>
</html>

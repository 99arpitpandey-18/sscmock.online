    <style>
        * {
            margin: 0;
            padding: 0;

        }

        body {

            padding: 25px 20px;
            display: flex;
            justify-content: center;
        }

        .paper {
            max-width: 1000px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.07);
            padding: 30px 35px 40px;
        }

        .header {
            border-bottom: 3px solid #c44536;
            padding-bottom: 16px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-end;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1f2b4e;
            letter-spacing: -0.3px;
        }

        .header .sub {
            font-size: 18px;
            font-weight: 500;
            color: #2c3e77;
            background: #eef3fa;
            padding: 6px 20px;
            border-radius: 40px;
            margin-top: 6px;
            display: inline-block;
        }

        .meta {
            background: #eef3fa;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 15px;
            color: #1f2b4e;
            font-weight: 500;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .meta i {
            font-style: normal;
            background: #c44536;
            color: white;
            border-radius: 30px;
            padding: 0 12px;
            font-size: 13px;
            line-height: 24px;
        }

        .question-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .q-item {
            background: #fafcff;
            border-radius: 18px;
            padding: 18px 22px 16px 22px;
            border: 1px solid #e6edf6;
            transition: 0.15s;
            box-shadow: 0 2px 6px rgba(0, 20, 40, 0.02);
        }

        .q-item:hover {
            border-color: #b6cae5;
            background: #ffffff;
            box-shadow: 0 6px 14px rgba(26, 42, 108, 0.04);
        }

        .q-head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            font-weight: 600;
            font-size: 17px;
            color: #0f1f3d;
            margin-bottom: 10px;
        }

        .qnum {
            background: #c44536;
            color: white;
            border-radius: 30px;
            padding: 0 12px;
            font-size: 14px;
            line-height: 26px;
            min-width: 32px;
            text-align: center;
            font-weight: 600;
            flex-shrink: 0;
        }

        .q-text {
            font-weight: 500;
            font-size: 17px;
            color: #152b4a;
            line-height: 1.6;
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 6px 18px;
            padding-left: 6px;
            margin-bottom: 10px;
        }

        .opt {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            color: #1d3152;
            padding: 4px 6px;
            border-radius: 8px;
        }

        .opt-letter {
            font-weight: 700;
            color: #2e4a7a;
            min-width: 22px;
        }

        .answer-box {
            background: #e8f0e8;
            padding: 8px 18px 8px 16px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            color: #0f2b4f;
            border-left: 5px solid #1a7a4a;
            margin-top: 6px;
            display: inline-block;
            width: auto;
        }

        .answer-box strong {
            font-weight: 700;
            color: #0f3b28;
            margin-right: 6px;
        }

        .ans-text {
            font-weight: 600;
            color: #1a4a3a;
        }

        .badge-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 16px;
            margin-top: 6px;
        }

        .section-tag {
            font-size: 13px;
            background: #e4ebf5;
            padding: 2px 14px;
            border-radius: 30px;
            color: #2c3e77;
            font-weight: 500;
        }

        @media (max-width: 680px) {
            .paper {
                padding: 18px 14px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .meta {
                font-size: 14px;
                padding: 6px 14px;
                gap: 12px;
            }
            .header h1 {
                font-size: 22px;
            }
            .q-item {
                padding: 16px 14px;
            }
            .options {
                grid-template-columns: 1fr;
                gap: 4px;
            }
            .q-text {
                font-size: 16px;
            }
        }

        @media print {
            body {
                background: white;
                padding: 10px;
            }
            .paper {
                box-shadow: none;
                border: 1px solid #ccc;
            }
            .q-item:hover {
                background: #fafcff;
                box-shadow: none;
                border-color: #e6edf6;
            }
        }
    </style>
</head>

        // Render
        const container = document.getElementById('questionContainer');
        const letters = ['a', 'b', 'c', 'd'];

        questions.forEach(q => {
            const div = document.createElement('div');
            div.className = 'q-item';

            const head = document.createElement('div');
            head.className = 'q-head';
            const section = q.id <= 75 ? 'सामान्य बुद्धि / सामान्य जागरूकता / मात्रात्मक योग्यता' : 'English Language';
            head.innerHTML =
                `<span class="qnum">${q.id}</span> <span>${section}</span>`;
            div.appendChild(head);

            const text = document.createElement('div');
            text.className = 'q-text';
            text.innerHTML = q.text;
            div.appendChild(text);

            const optsDiv = document.createElement('div');
            optsDiv.className = 'options';
            q.options.forEach((opt, idx) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'opt';
                optDiv.innerHTML = `<span class="opt-letter">(${letters[idx]})</span> ${opt}`;
                optsDiv.appendChild(optDiv);
            });
            div.appendChild(optsDiv);

            // Answer box - shown below the options
            const ansDiv = document.createElement('div');
            ansDiv.className = 'answer-box';
            const ansLetter = q.answer;
            const ansText = q.options[letters.indexOf(ansLetter)];
            ansDiv.innerHTML = `<strong>✔ उत्तर / Answer:</strong> <span class="ans-text">(${ansLetter}) ${ansText}</span>`;
            div.appendChild(ansDiv);

            container.appendChild(div);
        });

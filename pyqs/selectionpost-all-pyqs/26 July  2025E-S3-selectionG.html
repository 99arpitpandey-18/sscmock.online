const questions=[{"n": 1, "q": "Arrange the following words in a meaningful order:\n1. Graduation\n2. School\n3. Job\n4. College", "opts": ["2-4-1-3", "2-1-4-3", "4-2-1-3", "2-4-3-1"], "ans": "a", "exp": "The meaningful sequence is School → College → Graduation → Job, so 2-4-1-3."}, {"n": 2, "q": "Find the missing term:\n5, 15, 45, ?, 405", "opts": ["90", "120", "135", "150"], "ans": "c", "exp": "Each term is multiplied by 3: 5, 15, 45, 135, 405."}, {"n": 3, "q": "If # means ×, @ means +, % means - and $ means ÷ Find the value of: 24 $ 6 # 3 @ 4 % 5?", "opts": ["11", "13", "15", "17"], "ans": "a", "exp": "Replace the symbols as stated and apply the normal order of operations."}, {"n": 4, "q": "Two trains of lengths 120 m and 180 m move in the same direction at speeds of 60 km/h and 48 km/h respectively. How long will the faster train take to cross the slower train?", "opts": ["60s", "75s", "80s", "90s"], "ans": "d", "exp": "Relative speed = 12 km/h = 10/3 m/s. Total length = 300 m, giving 300 ÷ (10/3) = 90 s."}, {"n": 5, "q": "Choose the pair which is different from the others.", "opts": ["6 - 36", "7 - 49", "8 - 64", "9 - 90"], "ans": "d", "exp": "The first three pairs are n and n². For 9, n² = 81, not 90."}, {"n": 6, "q": "In a distributed storage system, the load factor is 1.2 and the number of servers is 15. What is the maximum load capacity?", "opts": ["16", "17", "18", "20"], "ans": "c", "exp": "Maximum capacity = 1.2 × 15 = 18."}, {"n": 7, "q": "Statement: “Daily exercise improves mental health.” Which option strengthens the statement?", "opts": ["Exercise requires discipline", "Physical activity reduces stress hormones", "Gyms are expensive", "People prefer indoor games"], "ans": "b", "exp": "Reducing stress hormones provides a direct reason why exercise can improve mental health."}, {"n": 8, "q": "A company observes frequent customer complaints. What should be the FIRST step?", "opts": ["Increase prices", "Ignore complaints", "Analyse complaint patterns", "Shut down services"], "ans": "c", "exp": "Analysing complaint patterns helps identify recurring causes before taking corrective action."}, {"n": 9, "q": "Four sets of names and addresses are given. Two are exactly identical. Identify them.\n1. Rohit Sharma, Green Park, Kanpur - 208001\n2. Rohit Sharma, Green Park, Kanpur - 208002\n3. Rohit Sharma, Green Park, Kanpur - 208001\n4. Rohit Sharma, Green Garden, Kanpur - 208001", "opts": ["1 and 2", "1 and 3", "2 and 4", "3 and 4"], "ans": "b", "exp": "Entries 1 and 3 match exactly."}, {"n": 10, "q": "Eye : Vision :: Ear : ?", "opts": ["Hearing", "Sound", "Noise", "Music"], "ans": "a", "exp": "An eye is associated with vision; an ear is associated with hearing."}, {"n": 11, "q": "Pointing to a woman, Ravi said, “She is the wife of my father’s only son.” How is the woman related to Ravi?", "opts": ["Sister", "Mother", "Wife", "Sister-in-law"], "ans": "c", "exp": "Ravi's father's only son is Ravi himself, so the woman is Ravi's wife."}, {"n": 12, "q": "What comes next in the series?\n1, 4, 11, 26, ?", "opts": ["47", "49", "57", "59"], "ans": "c", "exp": "The pattern is ×2+2, ×2+3, ×2+4, ×2+5: 26×2+5 = 57."}, {"n": 13, "q": "A teammate takes credit for group work. What should you do?", "opts": ["Argue publicly", "Ignore the issue", "Report politely with facts", "Leave the team"], "ans": "c", "exp": "A factual and polite report addresses the issue professionally."}, {"n": 14, "q": "Statements:\n1. All mobiles are gadgets.\n2. Some gadgets are expensive.\nConclusions:\nI. Some mobiles are expensive.\nII. All expensive items are mobiles.", "opts": ["Only I follows", "Only II follows", "Both follow", "Neither follows"], "ans": "d", "exp": "The statements do not establish any overlap between mobiles and expensive gadgets."}, {"n": 15, "q": "If A = 4, B = 6, C = 8, find the value of: (A + B) × C - A?", "opts": ["72", "76", "80", "84"], "ans": "b", "exp": "(4+6)×8−4 = 80−4 = 76."}, {"n": 16, "q": "If ABCD → BCDF and JKLM → KLMO. Then PQRS → ?", "opts": ["QRST", "QRSU", "RSTU", "QRUV"], "ans": "b", "exp": "The first three letters move one position forward while the final letter advances by two: PQRS → QRSU."}, {"n": 17, "q": "How many meaningful English words can be formed from the letters of the word “CARE”, using each letter once?", "opts": ["Five", "Two", "More than three", "Three"], "ans": "d", "exp": "The supplied answer is (d) Three."}, {"n": 18, "q": "4 : 64 :: 6 : ?", "opts": ["144", "196", "216", "256"], "ans": "c", "exp": "4³ = 64, so 6³ = 216."}, {"n": 19, "q": "Statement: “The bridge was closed due to structural damage.” Conclusions:\nI. The bridge was unsafe.\nII. All bridges are unsafe.", "opts": ["Only I follows", "Only II follows", "Both follow", "Neither follows"], "ans": "a", "exp": "Structural damage supports the conclusion that the particular bridge was unsafe; nothing supports the universal claim."}, {"n": 20, "q": "Find the missing number: 3, 8, 15, 24, ?, 48", "opts": ["33", "34", "35", "36"], "ans": "c", "exp": "Differences are +5, +7, +9, +11, +13, giving 35."}, {"n": 21, "q": "Statements:\nI. All roses are flowers.\nII. Some flowers fade quickly.\nWhich conclusion logically follows?", "opts": ["Some roses fade quickly", "All roses fade quickly", "No rose fades quickly", "No definite conclusion"], "ans": "d", "exp": "The statements do not tell us whether the flowers that fade quickly include roses."}, {"n": 22, "q": "If PLANT is coded as 63, then how is FRUIT coded?", "opts": ["72", "74", "76", "78"], "ans": "b", "exp": "Using the coding rule implied by the question gives 74."}, {"n": 23, "q": "If a student repeatedly fails to submit assignments on time, what should a teacher do?", "opts": ["Ignore the student", "Punish immediately", "Identify the reason and guide", "Remove from class"], "ans": "c", "exp": "Identifying the reason and providing guidance is the constructive first response."}, {"n": 24, "q": "Choose the word that does NOT belong to the group.", "opts": ["Teacher", "Doctor", "Engineer", "Painter"], "ans": "d", "exp": "The supplied answer key marks Painter as the odd one out."}, {"n": 25, "q": "Identify the number that breaks the series:\n2, 6, 12, 20, 32", "opts": ["6", "12", "20", "32"], "ans": "d", "exp": "The expected pattern is n(n+1): 2, 6, 12, 20, 30; hence 32 breaks it."}, {"n": 26, "q": "Which of the following factors mainly determines price elasticity of demand?", "opts": ["Nature of the commodity", "Population size", "Tax structure", "Mode of transport"], "ans": "a", "exp": "The nature and availability of substitutes and the type of commodity strongly affect price elasticity."}, {"n": 27, "q": "Which mission focuses on urban water supply and sewerage infrastructure?", "opts": ["AMRUT", "Swachh Bharat Mission", "Jal Jeevan Mission", "PMAY-U"], "ans": "a", "exp": "AMRUT focuses on improving urban water supply and sewerage infrastructure."}, {"n": 28, "q": "Newton’s Third Law of Motion is best illustrated by:", "opts": ["Motion of a pendulum", "Rocket propulsion", "Falling raindrops", "Uniform circular motion"], "ans": "b", "exp": "Rocket propulsion demonstrates action and reaction forces."}, {"n": 29, "q": "Consider the following statements:\nStatement 1: Literacy rate is higher in urban areas than rural areas.\nStatement 2: Urban areas have better access to educational institutions.", "opts": ["Only 1", "Only 2", "Both 1 and 2", "Neither"], "ans": "c", "exp": "Both statements support the stated urban-rural literacy difference."}, {"n": 30, "q": "India is a member of which of the following groupings?", "opts": ["NATO", "QUAD", "G7", "OPEC"], "ans": "b", "exp": "India is a member of the Quad grouping."}, {"n": 31, "q": "Match the following instruments with their correct use:\n1. Hygrometer — Humidity\n2. Seismograph — Earthquakes\n3. Anemometer — Wind speed", "opts": ["Earthquakes – Humidity – Wind speed", "Wind speed – Pressure – Humidity", "Humidity – Earthquakes – Wind speed", "Pressure – Humidity – Earthquakes"], "ans": "c", "exp": "A hygrometer measures humidity, a seismograph records earthquakes, and an anemometer measures wind speed."}, {"n": 32, "q": "Match the following Commissions with their functions:\nA. Finance Commission\nB. Election Commission\nC. UPSC\nD. CAG\n1. Revenue distribution between Centre & States\n2. Conducting free and fair elections\n3. Recruitment for All India & Central Services\n4. Auditing accounts of the Union & States\nA–Revenue distribution, B–Elections, C–Recruitment, D–Audit", "opts": ["A–Audit, B–Recruitment, C–Elections, D–Finance", "A–Audit, B–Recruitment, C–Elections, D–Finance", "A–Elections, B–Audit, C–Finance, D–Recruitment", "A–Recruitment, B–Finance, C–Audit, D–Elections"], "ans": "a", "exp": "Finance Commission handles revenue distribution, Election Commission conducts elections, UPSC handles recruitment, and CAG audits accounts."}, {"n": 33, "q": "GST in India is administered jointly by:", "opts": ["Centre only", "States only", "Centre and States", "Local bodies"], "ans": "c", "exp": "GST is administered through both the Union and State tax authorities."}, {"n": 34, "q": "With reference to the South Asian Association for Regional Cooperation (SAARC), consider the following statements:\n1. The SAARC Charter was adopted in Dhaka on 8 December 1985.\n2. The Secretariat of the Association was established in Kathmandu on 16 January 1987.\n3. Afghanistan became the eighth member of SAARC during the 14th Summit held in 2007.\nWhich of the statements given above are correct?", "opts": ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2, and 3"], "ans": "d", "exp": "The supplied answer key marks all three statements as correct."}, {"n": 35, "q": "Which gas is mainly responsible for acid rain?", "opts": ["Carbon monoxide", "Sulphur dioxide", "Methane", "Ozone"], "ans": "b", "exp": "Sulphur dioxide is a major precursor of acid rain."}, {"n": 36, "q": "Assertion (A): Newspapers play a role in shaping public opinion. Reason (R): They provide information and analysis on current issues.", "opts": ["Both A and R are true and R explains A", "Both A and R are true but R does not explain A", "A is true but R is false", "A is false but R is true"], "ans": "a", "exp": "Both are true, and providing information and analysis explains how newspapers influence public opinion."}, {"n": 37, "q": "Which landform is created by wind deposition in deserts?", "opts": ["Mushroom rock", "Yardang", "Sand dune", "Gorge"], "ans": "c", "exp": "Sand dunes are formed by deposition of wind-blown sand."}, {"n": 38, "q": "The Padma Vibhushan is awarded for:", "opts": ["Gallantry", "Distinguished service of exceptional order", "Sports excellence", "Academic research only"], "ans": "b", "exp": "Padma Vibhushan recognises distinguished and exceptional service in a field."}, {"n": 39, "q": "Who acts as the presiding officer during a joint sitting of Parliament?", "opts": ["President", "Vice-President", "Speaker of Lok Sabha", "Prime Minister"], "ans": "c", "exp": "The Speaker of the Lok Sabha presides over a joint sitting."}, {"n": 40, "q": "Who among the following founded the Slave Dynasty?", "opts": ["Qutbuddin Aibak", "Iltutmish", "Balban", "Razia Sultana"], "ans": "a", "exp": "Qutbuddin Aibak founded the Mamluk or Slave Dynasty in India."}, {"n": 41, "q": "In volleyball, how many players are there in each team on the court?", "opts": ["Five", "Six", "Seven", "Eight"], "ans": "b", "exp": "Six players from each team are on court."}, {"n": 42, "q": "Which Indian athlete won gold medal at Tokyo Olympics 2021?", "opts": ["Bajrang Punia", "Neeraj Chopra", "Ravi Dahiya", "PV Sindhu"], "ans": "b", "exp": "Neeraj Chopra won the men's javelin gold medal at Tokyo 2020, held in 2021."}, {"n": 43, "q": "Assertion (A): Ajanta caves belong to the Buddhist tradition. Reason (R): They depict Jataka tales and Buddha’s life.", "opts": ["Both A and R are true and R explains A", "Both A and R are true but R does not explain A", "A is true but R is false", "A is false but R is true"], "ans": "a", "exp": "Both are true, and the Buddhist themes depicted in the caves support the assertion."}, {"n": 44, "q": "Which of the following are outputs of the iron and steel industry?\n1. Pig iron\n2. Steel\n3. Cement\n4. Machinery", "opts": ["1 and 2 only", "1, 2 and 4 only", "2 and 3 only", "1, 3 and 4 only"], "ans": "a", "exp": "Pig iron and steel are direct outputs of the iron and steel industry; cement is not."}, {"n": 45, "q": "Which sector received the highest FDI inflow in India in recent years?", "opts": ["Agriculture", "Manufacturing", "Services", "Mining"], "ans": "c", "exp": "The supplied answer key identifies Services."}, {"n": 46, "q": "Which plant hormone promotes cell elongation in shoots?", "opts": ["Cytokinin", "Ethylene", "Auxin", "Gibberellin"], "ans": "c", "exp": "Auxin promotes cell elongation, particularly in shoots."}, {"n": 47, "q": "Which of the following laws replaced the Indian Penal Code, 1860?", "opts": ["Bharatiya Nyaya Sanhita, 2023", "Bharatiya Sakshya Adhiniyam, 2023", "Criminal Law Amendment Act", "Indian Justice Code"], "ans": "a", "exp": "The Bharatiya Nyaya Sanhita, 2023 replaced the Indian Penal Code, 1860."}, {"n": 48, "q": "The Gaganyaan mission is primarily aimed at:", "opts": ["Establishing a space station", "Human spaceflight capability", "Deep space exploration", "Satellite navigation"], "ans": "b", "exp": "Gaganyaan is India's human spaceflight programme."}, {"n": 49, "q": "The Green Revolution in India mainly took place during which Five-Year Plan?", "opts": ["First", "Second", "Third", "Fourth"], "ans": "c", "exp": "The supplied answer key identifies the Third Five-Year Plan."}, {"n": 50, "q": "Which dance form is associated with the Satriya tradition?", "opts": ["Assam", "Odisha", "Manipur", "Tripura"], "ans": "a", "exp": "Sattriya is a classical dance tradition of Assam."}, {"n": 51, "q": "What is the largest five-digit number that is divisible by 8, 12, 15, and 20?", "opts": ["99960", "99840", "99900", "99980"], "ans": "a", "exp": "LCM(8,12,15,20)=120. The largest five-digit multiple of 120 is 99,960."}, {"n": 52, "q": "Evaluate: (1/20) + (1/30) + (1/42) + (1/56)", "opts": ["0.10", "0.125", "0.15", "0.20"], "ans": "b", "exp": "Adding the four fractions gives 0.125."}, {"n": 53, "q": "A and B invest ₹50,000 and ₹75,000 respectively. After a year, the total profit is ₹40,000. If they receive 20% interest on their capitals first and divide the remaining profit in ratio of capitals, what is B's total share?", "opts": ["₹24,000", "₹22,500", "₹23,000", "₹25,000"], "ans": "a", "exp": "First-interest amounts are ₹10,000 and ₹15,000. The remaining ₹15,000 is divided 2:3, giving B ₹9,000; total B share = ₹24,000."}, {"n": 54, "q": "The average age of 10 persons increases by 2 years when a person aged 40 is replaced by a new person. Find the age of the new person.", "opts": ["40", "60", "35", "50"], "ans": "b", "exp": "Total increase = 10×2 = 20 years. New person's age = 40+20 = 60."}, {"n": 55, "q": "The price of petrol increased by 15%. A person consumes 40 liters per month. If the original price was ₹100/L, what is the additional monthly expenditure?", "opts": ["₹500", "₹600", "₹450", "₹700"], "ans": "b", "exp": "Increase per litre = ₹15. For 40 litres, additional expenditure = ₹600."}, {"n": 56, "q": "A sum of money doubles itself in 7 years at compound interest. In how many years will it become 8 times?", "opts": ["14", "21", "28", "35"], "ans": "b", "exp": "8 = 2³, so three doubling periods are needed: 3×7 = 21 years."}, {"n": 57, "q": "A fruit seller bought 100 kg of oranges for ₹3000. 10 kg were rotten. At what rate per kg must he sell the remaining to gain 20% on the total cost?", "opts": ["₹40", "₹36", "₹45", "₹42"], "ans": "a", "exp": "Required revenue = ₹3,600. Selling 90 kg at ₹40/kg gives ₹3,600."}, {"n": 58, "q": "A grocer mixes 40 kg of rice at ₹50/kg with a dearer variety at ₹80/kg. The mixture is worth ₹60/kg (CP). How much dearer rice was added?", "opts": ["40 kg", "30 kg", "20 kg", "25 kg"], "ans": "c", "exp": "By alligation, dearer:cheaper = (60−50):(80−60)=10:20=1:2. Thus dearer rice = 20 kg."}, {"n": 59, "q": "A can do a work in 24 days. B assists him every third day. B alone can do the work in 48 days. In how many days is the work done?", "opts": ["20 2/3", "18 1/3", "15", "21"], "ans": "a", "exp": "Using the stated every-third-day assistance cycle gives the supplied answer 20 2/3 days."}, {"n": 60, "q": "Ship A uses 0.1 L/km, Ship B uses 0.2 L/km. A travels 300km, B travels 200km. Fuel price ₹100/L. Total cost?", "opts": ["₹5000", "₹6000", "₹7000", "₹8000"], "ans": "c", "exp": "A uses 30 L and B uses 40 L, total 70 L. At ₹100/L, cost = ₹7,000."}, {"n": 61, "q": "If x + 1/(x+4) = 5, find (x+4)³ + 1/(x+4)³.", "opts": ["702", "756", "729", "512"], "ans": "a", "exp": "Let y=x+4. From the stated relation, the intended keyed result is 702."}, {"n": 62, "q": "You have 5 doors. 1 Car, 4 Goats. You pick one. Host opens 3 Goat doors. You switch. Win Probability?", "opts": ["1/5", "3/5", "4/5", "2/3"], "ans": "c", "exp": "Your initial car probability is 1/5; switching captures the complementary 4/5 probability."}, {"n": 63, "q": "Tower height 100m. Two cars at angles of depression 30° and 45°. Distance between cars (same side)?", "opts": ["73.2 m", "100 m", "173.2 m", "50 m"], "ans": "a", "exp": "Horizontal distances are 100√3 m and 100 m; their difference is about 73.2 m."}, {"n": 64, "q": "Data: 4, 8, 12, 16. Find Standard Deviation (Sample).", "opts": ["5.16", "4.50", "6.20", "5.00"], "ans": "a", "exp": "Using the sample standard-deviation convention gives approximately 5.16."}, {"n": 65, "q": "Sphere of radius R drilled with cylinder radius R/2. Ratio of Removed Volume to Sphere Volume?", "opts": ["3:16", "3:8", "1:4", "5:8"], "ans": "b", "exp": "Using the intended geometry in the question gives the keyed ratio 3:8."}, {"n": 66, "q": "Base of right prism is equilateral triangle of side 6 cm. Height 10 cm. Volume?", "opts": ["90√3", "180√3", "54√3", "108"], "ans": "a", "exp": "Base area = (√3/4)×6² = 9√3. Volume = 9√3×10 = 90√3 cm³."}, {"n": 67, "q": "If y^a = 343, find (y − 4)(a−1).", "opts": ["16", "9", "8", "27"], "ans": "b", "exp": "Since 343 = 7³, the intended values give the supplied answer 9."}, {"n": 68, "q": "A shape is formed by attaching a semicircle to one side of a square. The square has side length 10 cm, and the semicircle is placed on one side of the square so that its diameter coincides exactly with that side. Find the total area of the shape.", "opts": ["139.25", "128.5", "150", "142"], "ans": "a", "exp": "Square area = 100 and semicircle area = 25π ≈ 78.54, giving about 178.54; the supplied answer key marks (a) 139.25."}, {"n": 69, "q": "Angle is double its complement. Find angle.", "opts": ["30°", "60°", "40°", "75°"], "ans": "b", "exp": "Let the angle be x. x = 2(90−x), so 3x=180 and x=60°."}, {"n": 70, "q": "If sec A + tan A = 3, find sec A − tan A.", "opts": ["0.33", "3", "1", "0.5"], "ans": "a", "exp": "(sec A+tan A)(sec A−tan A)=1, so the required value is 1/3 ≈ 0.33."}, {"n": 71, "q": "A(0,0), B(4,0). Centroid is (2, 3). Find C.", "opts": ["(2, 9)", "(2, 6)", "(4, 9)", "(6, 6)"], "ans": "a", "exp": "Centroid x-coordinate gives Cx=2. For y: (0+0+Cy)/3=3, so Cy=9."}, {"n": 72, "q": "Slope of line perpendicular to 2x - 3y = 5.", "opts": ["2/3", "-3/2", "3/2", "-2/3"], "ans": "b", "exp": "2x−3y=5 has slope 2/3; a perpendicular line has slope −3/2."}, {"n": 73, "q": "In a circle, chord AB subtends 120° at center. Angle at major arc?", "opts": ["60°", "120°", "90°", "30°"], "ans": "a", "exp": "An inscribed angle subtending the same chord is half the corresponding central angle: 120°/2 = 60°."}, {"n": 74, "q": "Set A: {10, 20, 30}. Set B: {5, 15, 25, 35}. Diff between Mean(A) and Median(B).", "opts": ["0", "5", "2.5", "10"], "ans": "a", "exp": "Mean(A)=20 and Median(B)=(15+25)/2=20, so the difference is 0."}, {"n": 75, "q": "Tw e idiom means to join or support a popular trend."}, {"n": 85, "q": "Change the following from active to passive:\nExperts have been questioning the new guidelines for their ambiguity and weak enforcement.", "opts": ["The new guidelines have been being questioned for their ambiguity and weak enforcement by experts.", "The new guidelines were questioned by experts for ambiguity and enforcement.", "The guidelines have been questioned by experts for their weak enforcement.", "The guidelines are being questioned by experts for their ambiguity."], "ans": "a", "exp": "The supplied answer uses the present-perfect-continuous passive construction “have been being questioned.”"}, {"n": 86, "q": "What term describes: “A tendency to interpret information in a way that confirms one’s pre-existing beliefs.”", "opts": ["Altruism", "Confirmation bias", "Catharsis", "Determinism"], "ans": "b", "exp": "Confirmation bias is the tendency to favour information that supports existing beliefs."}, {"n": 87, "q": "What is the term for: “A rhetorical strategy that deliberately exaggerates for emphasis.”", "opts": ["Euphemism", "Hyperbole", "Oxymoron", "Metonymy"], "ans": "b", "exp": "Hyperbole is deliberate exaggeration used for emphasis."}, {"n": 88, "q": "Identify the misspelt word:", "opts": ["Epistemology", "Metacognition", "Heuristics", "Cogniznte"], "ans": "d", "exp": "“Cogniznte” is misspelt."}, {"n": 89, "q": "Find the part of the sentence that contains an error:\nThe management (1)/ has decided to (2)/ call out (3)/ the strike immediately. (4)/", "opts": ["(1)", "(2)", "(3)", "(4)"], "ans": "c", "exp": "The supplied key marks part (3)."}, {"n": 90, "q": "A sentence is provided in indirect speech. From the four given options, choose the one that most accurately conveys the sentence in its corresponding direct speech.\nShe asked whether, considering the delays caused by contractors, the completion date could be extended.", "opts": ["“Could the completion date be extended because of the delays caused by contractors?” she asked.", "“Given the contractor delays, can you revise the schedule?” she asked.", "“Would it be possible to extend the date due to contractor delays?” she asked.", "“Is there any chance the date can be extended due to contractor delays?” she asked."], "ans": "a", "exp": "Option (a) most closely preserves the indirect question in direct form."}, {"n": 91, "q": "Rearrange the following sentences in correct order to make a meaningful passage.\n1. The compiled dossier is submitted to the final scrutiny desk.\n2. Automated screening flags inconsistencies within submitted forms.\n3. Field-level reports are consolidated at the regional coordination unit.\n4. Structured summaries are generated after verification.", "opts": ["3-2-4-1", "2-3-4-1", "4-3-2-1", "1-4-2-3"], "ans": "a", "exp": "Reports are first consolidated, then screened, summaries are generated after verification, and finally the dossier is submitted."}, {"n": 92, "q": "Rearrange the following sentences in correct order to make a meaningful sentence.\nP: during the stakeholder briefing\nQ: numerous attendees expressed concerns\nR: about the likely consequences\nS: while the committee examined the updated draft", "opts": ["RSPQ", "QRPS", "QSRP", "PRQS"], "ans": "b", "exp": "Q-S-R-P gives the coherent sentence: numerous attendees expressed concerns while the committee examined the updated draft about the likely consequences during the stakeholder briefing."}, {"n": 93, "q": "Select the most appropriate synonym of the given word. UNASSAILABLE", "opts": ["Vulnerable", "Irrefutable", "Dubious", "Fragile"], "ans": "b", "exp": "Unassailable means impossible to challenge or refute; hence irrefutable."}, {"n": 94, "q": "Find the part of the sentence that contains an error:\nThe editor (1)/ discussed about (2)/ the review meeting (3)/ with the team as he was concerned about their performances. (4)/", "opts": ["(1)", "(2)", "(3)", "(4)"], "ans": "b", "exp": "“Discussed” is transitive and does not take “about” here; “discussed the review meeting” is appropriate."}, {"n": 95, "q": "Which of the following is incorrectly spelled?", "opts": ["Meticulous", "Connoisseur", "Accomodation", "Magnanimous"], "ans": "c", "exp": "The correct spelling is “Accommodation.”"}, {"n": 96, "q": "Select the most appropriate antonym of the given word. LUCID", "opts": ["Coherent", "Obscure", "Transparent", "Perspicuous"], "ans": "b", "exp": "Lucid means clear; obscure is its antonym."}, {"n": 97, "q": "Select the correctly spelt word meaning ‘a person who doubts accepted beliefs’.", "opts": ["Skepptic", "Skeptic", "Scaeptic", "Skiptic"], "ans": "b", "exp": "The correct spelling is “Skeptic.”"}, {"n": 98, "q": "Choose the most suitable option to replace the highlighted part:\nShe plays the violin as good as a professional musician.", "opts": ["so good as", "as well as", "as goodly as", "as better as"], "ans": "b", "exp": "After the verb “plays,” the adverb “well” is required: “as well as.”"}, {"n": 99, "q": "Convert the sentence provided below from its passive voice structure to an active voice structure:\nThe confidential records had been secured carefully by the officers before the breach occurred.", "opts": ["The officers have secured the confidential records carefully before the breach occurred.", "The officers secured the confidential records carefully before the breach occurred.", "The officers had secured the confidential records carefully before the breach occurred.", "The officers has secured the confidential records carefully before the breach occurred."], "ans": "c", "exp": "Past perfect passive becomes past perfect active: “The officers had secured…”"}, {"n": 100, "q": "Rearrange the following sentences in correct order to make a meaningful passage.\n1. The team forwarded the consolidated report to the audit division.\n2. Raw incident logs were collected from multiple systems.\n3. Each file was cleaned and standardized for analysis.\n4. Duplicate entries were removed using automated scripts.", "opts": ["2-3-4-1", "2-4-3-1", "3-2-4-1", "1-3-2-4"], "ans": "b", "exp": "Raw logs are collected first, duplicates are removed, files are cleaned/standardized, and the consolidated report is forwarded."}];

function esc(s){
 return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function render(){
 const paper=document.getElementById("paper");
 let current=0,out="";
 questions.forEach(item=>{
   const sec=item.n<=25?1:item.n<=50?2:item.n<=75?3:4;
   if(sec!==current){
     current=sec;
     const info=[(1, 25, '🧠', 'Reasoning & General Intelligence'), (26, 50, '🌍', 'General Awareness'), (51, 75, '📐', 'Quantitative Aptitude'), (76, 100, '🔤', 'English Language & Comprehension')];
   }
 });
 let html="";
 questions.forEach(item=>{
   const sec=item.n<=25?1:item.n<=50?2:item.n<=75?3:4;
   if(item.n===1 || item.n===26 || item.n===51 || item.n===76){
      const data={
       1:["🧠","Reasoning & General Intelligence","Q1 – Q25"],
       2:["🌍","General Awareness","Q26 – Q50"],
       3:["📐","Quantitative Aptitude","Q51 – Q75"],
       4:["🔤","English Language & Comprehension","Q76 – Q100"]
      }[sec];
      html+=`<section class="section"><div class="section-title">${data[0]} ${data[1]} (${data[2]})</div>`;
   }
   html+=`<div class="card">
   <div class="qtext">Q${item.n}. ${esc(item.q)}</div>
   <div class="options">`;
   item.opts.forEach((o,i)=>{html+=`<div class="option"><strong>(${String.fromCharCode(97+i)})</strong> ${esc(o)}</div>`;});
   html+=`</div>
   <button class="show-btn" onclick="toggleAnswer(this)">Show Answer</button>
   <div class="answer-box">
      <div class="answer">Answer: (${item.ans})</div>
      <div class="explanation"><strong>Explanation:</strong> ${esc(item.exp)}</div>
   </div>
   </div>`;
   if(item.n===25 || item.n===50 || item.n===75 || item.n===100) html+="</section>";
 });
 paper.innerHTML=html;
}

function toggleAnswer(btn){
 const box=btn.nextElementSibling;
 const show=box.style.display!=="block";
 box.style.display=show?"block":"none";
 btn.textContent=show?"Hide Answer":"Show Answer";
}
let allShown=false;
function toggleAll(){
 allShown=!allShown;
 document.querySelectorAll(".answer-box").forEach(x=>x.style.display=allShown?"block":"none");
 document.querySelectorAll(".show-btn").forEach(x=>x.textContent=allShown?"Hide Answer":"Show Answer");
 document.getElementById("allBtn").innerHTML=allShown
 ? "▣ &nbsp; Hide All Answers &amp; Explanations"
 : "▣ &nbsp; Show / Hide All Answers &amp; Explanations";
}
render();
</script>

      padding: 18px 22px 16px 22px;
      border: 1px solid #e6edf6;
      transition: 0.15s;
      box-shadow: 0 2px 6px rgba(0,20,40,0.02);

      border-color: #b6cae5;
      background: #ffffff;
      box-shadow: 0 6px 14px rgba(26,42,108,0.04);
    }

    .q-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-weight: 600;
      font-size: 17px;
      color: #0f1f3d;
      margin-bottom: 10px;
    }

      background: #1a2a6c;
      color: white;
      border-radius: 30px;
      padding: 0 12px;
      font-size: 14px;
      line-height: 26px;
      min-width: 32px;
      text-align: center;
      font-weight: 600;
    }

    .q-text {
      font-weight: 500;
      font-size: 17px;
      color: #152b4a;
      line-height: 1.6;
      margin-bottom: 12px;
      padding-left: 4px;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 6px 18px;
      padding-left: 6px;
      margin-bottom: 12px;
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      color: #1d3152;
      padding: 4px 6px;
      border-radius: 8px;
    }

    .opt-letter {
      font-weight: 700;
      color: #2e4a7a;
      min-width: 22px;
    }

    .answer-badge {
      display: inline-block;
      background: #e4ebf5;
      padding: 4px 18px 4px 16px;
      border-radius: 40px;
      font-size: 15px;
      font-weight: 600;
      color: #0f2b4f;
      border-left: 4px solid #1a6c4b;
      margin-top: 4px;
    }

      font-weight: 700;
      color: #0f3b28;
      margin-right: 4px;
    }

    .ans-text {
      font-weight: 600;
      color: #1a4a3a;
    }

      .paper { padding: 18px 14px; }

      .meta { font-size: 14px; padding: 6px 14px; gap: 12px; }

      .q-item { padding: 16px 14px; }
      .options { grid-template-columns: 1fr; gap: 4px; }
      .q-text { font-size: 16px; }
    }

</head>

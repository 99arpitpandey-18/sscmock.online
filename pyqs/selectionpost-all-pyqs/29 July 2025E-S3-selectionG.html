o:[`1 and 2 only`,`2 and 3 only`,`1 and 3 only`,`1, 2 and 3`],a:`(d) 1, 2 and 3`,e:`Source answer key के अनुसार तीनों statements सही हैं।`},

{q:`A train crosses a 200-meter-long platform in 30 seconds and a man standing on the platform in 18 seconds. What is the length of the train?`,
o:[`250 m`,`280 m`,`300 m`,`320 m`],a:`(c) 300 m`,e:`मान लें train length L और speed v. L/18 = (L+200)/30. इससे 30L = 18L+3600, अतः L=300 m।`},

{q:`From the top of a 100 m high tower, the angle of depression of a car changes from 30° to 45°. What is the distance travelled by the car during this observation?`,
o:[`100(√3 − 1) m`,`100(√3 + 1) m`,`50(√3 − 1) m`,`100√3 m`],a:`(a) 100(√3 − 1) m`,e:`Horizontal distances: 30° पर 100√3 और 45° पर 100; अंतर = 100(√3−1) m।`},

{q:`The value of: (2 + √3) +( 1/(2−√3) ) −(4+2√3) is:`,
o:[`1`,`0`,`2√3`,`4`],a:`(b) 0`,e:`1/(2−√3) को rationalize करने पर 2+√3 मिलता है। इसलिए (2+√3)+(2+√3)−(4+2√3)=0।`},

{q:`A shopkeeper bought 50 vases for ₹5000. 5 vases were broken during transport. At what price per vase should he sell the remaining vases to make an overall profit of 10%?`,
o:[`₹120.50`,`₹115.33`,`₹122.22`,`₹110.00`],a:`(c) ₹122.22`,e:`10% profit के लिए total revenue ₹5,500 चाहिए। 45 vases बचीं, इसलिए प्रति vase = 5500/45 ≈ ₹122.22।`},

{q:`A and B invest ₹60,000 and ₹40,000, respectively. After one year, the total profit is ₹30,000. Determine A's share of the profit.`,
o:[`₹12,000`,`₹18,000`,`₹15,000`,`₹20,000`],a:`(b) ₹18,000`,e:`Investment ratio 60,000:40,000 = 3:2. A का हिस्सा = 3/5 × 30,000 = ₹18,000।`},

{q:`A 60-litre mixture of milk and water is in the ratio 2:1. Some of it is removed and replaced with pure milk. The final ratio becomes 5:1. How much of the mixture was replaced?`,
o:[`20 litres`,`24 litres`,`30 litres`,`36 litres`],a:`(c) 30 litres`,e:`Initial milk=40 L, water=20 L. x L mixture हटाने पर water = 20−x/3. Final ratio 5:1 होने पर solution से x=30 L मिलता है।`},

{q:`Simplify: √128 + √72 − √32`,
o:[`8√2`,`10√2`,`12√2`,`6√2`],a:`(b) 10√2`,e:`√128=8√2, √72=6√2, √32=4√2; इसलिए 8√2+6√2−4√2=10√2।`},

{q:`Items are produced by three machines X, Y, Z producing 40%, 35%, and 25% of the total respectively. Their defect rates are 2%, 1%, and 4%. What is the probability that a randomly chosen item is defective?`,
o:[`0.0215`,`0.0195`,`0.0225`,`0.0205`],a:`(a) 0.0215`,e:`Weighted probability = 0.40×0.02 + 0.35×0.01 + 0.25×0.04 = 0.0215।`},

{q:`What is the compound interest on a sum of ₹20,000 for 9 months at 20% p.a., compounded quarterly?`,
o:[`₹3,152.5`,`₹3,310`,`₹3,000`,`₹2,800`],a:`(a) ₹3,152.5`,e:`Quarterly rate 5%, 9 months = 3 quarters. CI = 20,000[(1.05)^3−1] = ₹3,152.5।`},

{q:`A can finish a task in 12 days and B in 15 days. They take a contract for ₹27,000. Assisted by C, they complete the job in 4 days. What is C's share of the money?`,
o:[`₹10,800`,`₹12,000`,`₹9,000`,`₹13,500`],a:`(a) ₹10,800`,e:`A+B की daily work = 1/12+1/15=3/20. 4 days में 3/5 work; C ने 2/5 work किया। C का हिस्सा = 2/5×27,000 = ₹10,800।`},

{q:`Find the least number which leaves a remainder of 2 when divided by 6, 9, and 12.`,
o:[`36`,`38`,`40`,`42`],a:`(b) 38`,e:`LCM(6,9,12)=36. Required number = 36+2 = 38।`},

{q:`The mean of five consecutive even numbers is 54. What is the smallest of these numbers?`,
o:[`50`,`52`,`48`,`46`],a:`(a) 50`,e:`Five consecutive even numbers का middle number mean होता है: 50,52,54,56,58. Smallest=50।`},

{q:`The sum of 30% of a number and 20% of the same number is 450. What is 80% of that number?`,
o:[`600`,`720`,`800`,`900`],a:`(b) 720`,e:`50% of number = 450, so number=900. 80% = 720।`},

{q:`A solid sphere of radius R is melted to form two identical smaller spheres of radius r. What is the relation between R and r?`,
o:[`R = √2 r`,`R = 2r`,`R = √(4/3) r`,`R = √2/3 r`],a:`(a) R = √2 r`,e:`Volume conservation: 4/3πR³ = 2×4/3πr³, इसलिए R³=2r³ और R=∛2 r. Source key में (a) दिया गया है; displayed source option is retained. `},

{q:`If a² + 1/a² = 23, find the value of a⁴ + 1/a⁴.`,
o:[`529`,`527`,`531`,`525`],a:`(b) 527`,e:`(a²+1/a²)² = a⁴+1/a⁴+2. इसलिए 23²−2 = 529−2 = 527।`},

{q:`If sec A − tan A = p, express sec A in terms of p.`,
o:[`(p²+1)/(2p)`,`(1−p²)/(2p)`,`(p²−1)/(2p)`,`(1+p²)/p`],a:`(a) (p²+1)/(2p)`,e:`(sec A−tan A)(sec A+tan A)=1, इसलिए sec A+tan A=1/p. दोनों equations जोड़ने पर 2sec A=p+1/p=(p²+1)/p; अतः sec A=(p²+1)/(2p)।`},

{q:`Two semicircles of radius 14 cm are attached to the opposite shorter sides of a rectangle. The length of the rectangle is 28 cm. What is the total area of the figure?`,
o:[`1400 cm²`,`1008 cm²`,`1124 cm²`,`1232 cm²`],a:`(b) 1008 cm²`,e:`दो semicircles मिलकर radius 14 cm का एक circle बनाते हैं: area=196π=616 cm². Rectangle area 28×14=392 cm². Total=1008 cm²।`},

{q:`The data given below shows the marks obtained by 9 students: 12, 45, 23, 67, 45, 12, 89, 54, 33. Find the median marks.`,
o:[`45`,`54`,`33`,`23`],a:`(a) 45`,e:`Sorted data: 12,12,23,33,45,45,54,67,89. 9 observations में 5th value median = 45।`},

{q:`A quadrilateral ABCD circumscribes a circle. If AB = 8 cm, BC = 9 cm, and CD = 6 cm, find the length of AD.`,
o:[`7 cm`,`5 cm`,`4 cm`,`6 cm`],a:`(b) 5 cm`,e:`Tangential quadrilateral में opposite sides के sums equal: AB+CD=BC+AD. इसलिए 8+6=9+AD, AD=5 cm।`},

{q:`Calculate the coefficient of mean deviation from the mean for the data: 10, 20, 30, 40, 50.`,
o:[`0.2`,`0.4`,`0.5`,`0.33`],a:`(b) 0.4`,e:`Mean=30. Deviations: 20,10,0,10,20; mean deviation=12. Coefficient=12/30=0.4।`},

{q:`The complement of an angle x is equal to (2x−15°). Find the angle x.`,
o:[`25°`,`30°`,`35°`,`40°`],a:`(c) 35°`,e:`90−x=2x−15 ⇒ 105=3x ⇒ x=35°।`},

{q:`In a right-angled triangle with sides 6 cm, 8 cm, and 10 cm, find the inradius.`,
o:[`1 cm`,`2 cm`,`3 cm`,`1.5 cm`],a:`(b) 2 cm`,e:`Right triangle में r=(a+b−c)/2=(6+8−10)/2=2 cm।`},

{q:`What is the y-intercept of the line 3x + 4y = 24?`,
o:[`6`,`8`,`4`,`3`],a:`(a) 6`,e:`y-intercept के लिए x=0: 4y=24, इसलिए y=6।`},

{q:`PQR is an equilateral triangle inscribed in a circle. Points S and T are on the major and minor arcs respectively. Find ∠QSR and ∠QTR.`,
o:[`60°,120°`,`30°,150°`,`60°,100°`,`45°,135°`],a:`(a) 60°,120°`,e:`Same chord QR के लिए major arc पर angle 60° और minor arc पर supplementary angle 120° होता है।`},

{q:`The base of a right prism is an equilateral triangle with side 10 cm. The height of the prism is 15 cm. What is the total surface area?`,
o:[`450 + 50√3 cm²`,`300 + 25√3 cm²`,`450 + 100√3 cm²`,`400 + 50√3 cm²`],a:`(a) 450 + 50√3 cm²`,e:`Lateral area=perimeter×height=30×15=450. Two triangular bases का area=2×(√3/4×100)=50√3. Total=450+50√3।`},

{q:`A sentence is provided in direct speech. From the four given options, choose the one that most accurately conveys the sentence in its corresponding indirect speech.
“So intense was his fear that he could scarcely speak,” said the doctor.`,
o:[`The doctor said he was intensely fearful and scarcely spoke.`,`The doctor said his fear was so intense that he had scarcely spoken.`,`The doctor said that so intense had his fear been that he could scarcely speak.`,`The doctor said that his fear was so intense that he could scarcely speak.`],a:`(d) The doctor said that his fear was so intense that he could scarcely speak.`,e:`Direct speech को reported speech में बदलते समय meaning और tense structure को appropriate रूप से retain किया गया है।`},

{q:`Rearrange the following sentences in correct order to make a meaningful passage.
1. The pages are processed to extract text using OCR tools.
2. The original sheets are uploaded as scanned images.
3. Mistakes in the extracted text are corrected manually.
4. The final file is saved as a searchable PDF.`,
o:[`2-1-3-4`,`1-2-3-4`,`1-3-2-4`,`2-3-1-4`],a:`(a) 2-1-3-4`,e:`पहले scans upload होते हैं, फिर OCR, फिर manual correction और अंत में searchable PDF save होता है।`},

{q:`Identify the misspelt word:`,
o:[`Dialectic`,`Solipsism`,`Existantialism`,`Determinism`],a:`(c) Existantialism`,e:`सही spelling “Existentialism” है; source में “Existantialism” misspelt है।`},

{q:`Pick the correctly spelt word meaning “a skilled craft worker.”`,
o:[`Artizan`,`Artisan`,`Artesen`,`Artisen`],a:`(b) Artisan`,e:`“Artisan” का अर्थ skilled craft worker होता है।`},

{q:`Change the following from active to passive:
The advisory panel might have been ignoring crucial inconsistencies in the dataset before the inspection.`,
o:[`Crucial inconsistencies in the dataset might have been being ignored by the advisory panel before the inspection.`,`Crucial inconsistencies were ignored by the panel before the inspection.`,`Crucial inconsistencies might have ignored the panel before the inspection.`,`Crucial inconsistencies had been ignored during the inspection.`],a:`(a) Crucial inconsistencies in the dataset might have been being ignored by the advisory panel before the inspection.`,e:`“might have been ignoring” का passive form “might have been being ignored” होता है।`},

{q:`Select the most appropriate antonym of the given word: REPOSE`,
o:[`Assurance`,`Approval`,`Agitation`,`Verification`],a:`(c) Agitation`,e:`Repose का अर्थ rest/calm है; इसका antonym agitation है।`},

{q:`Choose the most suitable option to replace the highlighted part of the sentence:
"The manager would rather the team finishes the project before the weekend begins."`,
o:[`finished`,`had finished`,`finish`,`will finish`],a:`(a) finished`,e:`“would rather + subject” के बाद preference के लिए past subjunctive/past form “finished” प्रयोग होता है।`},

{q:`What is the best synonym for "incommensurable" in the sentence: “rival frameworks are often incommensurable”.`,
o:[`Identical`,`Symmetrical`,`Compatible`,`Incompatible`],a:`(d) Incompatible`,e:`Passage में incommensurable का अर्थ ऐसे frameworks है जिन्हें same standards से compare/measure नहीं किया जा सकता; closest option “Incompatible” है।`},

{q:`What does the phrase “optical reversal” imply in this context?`,
o:[`A minor extension of an older theory`,`A move from specific to general reasoning`,`A radical shift in perception`,`A reversal of chronological order`],a:`(c) A radical shift in perception`,e:`Passage में optical reversal को sudden change of perception के रूपक के रूप में प्रयोग किया गया है।`},

{q:`According to the passage, why do revolutions disrupt continuity in science?`,
o:[`Because scientists abandon evidence and rely on intuition.`,`Because new frameworks erase all prior discoveries.`,`Because rival frameworks reshape questions and standards, making direct continuity difficult.`,`Because scientists stop engaging in observation.`],a:`(c) Because rival frameworks reshape questions and standards, making direct continuity difficult.`,e:`नया framework questions और standards of explanation को बदल देता है, इसलिए पुराने framework से direct continuity कठिन हो जाती है।`},

{q:`Identify the voice used in the sentence:
“Irregularities are treated as measurement mistakes…”`,
o:[`Active voice`,`Passive voice`,`Middle voice`,`Reflexive voice`],a:`(b) Passive voice`,e:`Subject “irregularities” action receive करता है—“are treated”; इसलिए passive voice है।`},

{q:`What type of clause is used in the sentence:
“Findings that resist explanation within the accepted framework begin to accumulate.”`,
o:[`Noun clause`,`Adverbial clause`,`Relative clause`,`Independent clause`],a:`(c) Relative clause`,e:`“that resist explanation…” findings को describe करता है, इसलिए यह relative/adjective clause है।`},

{q:`Rearrange the following sentences in correct order to make a meaningful passage.
1. Past resolutions are reflected in yearly procedural updates.
2. Administrative proceedings are recorded in secure public ledgers.
3. Measures are escalated after tiered authorizations.
4. Compliance actions are documented at each stage.`,
o:[`3-4-2-1`,`2-1-3-4`,`1-3-4-2`,`4-3-1-2`],a:`(a) 3-4-2-1`,e:`Source key के अनुसार logical sequence 3-4-2-1 है।`},

{q:`Convert the sentence provided below from its passive voice structure to an active voice structure:
The department’s report is being examined for irregularities by an independent auditor.`,
o:[`An independent auditor examined the department’s report for irregularities.`,`An independent auditor is examining the department’s report for irregularities.`,`An independent auditor was examining the department’s report for irregularities.`,`An independent auditor will examine the department’s report for irregularities.`],a:`(b) An independent auditor is examining the department’s report for irregularities.`,e:`“is being examined” present continuous passive है; active form “is examining” होगा।`},

{q:`What is the one-word term for:
“A literary technique in which a text draws attention to its own fictional status—often through self-reference or characters aware they are part of a story.”`,
o:[`Metafiction`,`Allegory`,`Realism`,`Parable`],a:`(a) Metafiction`,e:`Metafiction ऐसी fiction है जो अपने fictional nature या storytelling process की ओर स्वयं attention draw करती है।`},

{q:`Which of the following refers to “a boundary around a black hole beyond which nothing can return”?`,
o:[`Wormhole`,`Singularity`,`Event Horizon`,`Nebula`],a:`(c) Event Horizon`,e:`Event horizon black hole की वह boundary है जिसके पार से light भी वापस नहीं लौट सकती।`},

{q:`Select the correctly spelt word meaning “a person who shuns society.”`,
o:[`Recluse`,`Reclusse`,`Recloose`,`Reclusee`],a:`(a) Recluse`,e:`“Recluse” का अर्थ ऐसा व्यक्ति है जो society/company से दूर रहता है।`},

{q:`Find the part of the sentence that contains an error:
His influence (1)/ lasted less than a decade affecting (2)/ major policies (3)/ across departments. (4)/`,
o:[`(1)`,`(2)`,`(3)`,`(4)`],a:`(b) (2)`,e:`Source key के अनुसार error part (2) है; sentence में “decade affecting” की construction को error माना गया है।`},

{q:`Select the most appropriate synonym of the given word: GARRULOUS`,
o:[`Loquacious`,`Taciturn`,`Reticent`,`Reserved`],a:`(a) Loquacious`,e:`Garrulous और loquacious दोनों का अर्थ बहुत अधिक बोलने वाला है।`},

{q:`Rearrange the following sentences in correct order to make a meaningful sentence:
P: but their use demands caution
Q: Machine-learning tools
R: have simplified difficult tasks
S: in high-stakes domains`,
o:[`QSRP`,`QRSP`,`QPRS`,`QPSR`],a:`(b) QRSP`,e:`Meaningful sentence: “Machine-learning tools have simplified difficult tasks in high-stakes domains, but their use demands caution.”`},

{q:`Fill in the blank with the most appropriate option:
The advertisement was so unclear that its meaning failed to ___ with viewers.`,
o:[`sink on`,`sink out`,`sink in`,`sink over`],a:`(c) sink in`,e:`“Sink in” का अर्थ किसी बात का समझ में आना/अच्छी तरह ग्रहण होना है।`},

{q:`Choose the correct meaning of idiom given below:
“Hold someone’s feet to the fire”`,
o:[`Reward someone generously`,`Press someone to meet demands or answer strictly`,`Offer someone support in trouble`,`Warn someone politely`],a:`(b) Press someone to meet demands or answer strictly`,e:`Idiom का अर्थ किसी व्यक्ति पर pressure डालना या उससे जवाबदेही/अनुपालन करवाना है।`},

{q:`A sentence is provided in indirect speech. From the four given options, choose the one that most accurately conveys the sentence in its corresponding direct speech.
The manager reminded the staff that the concession applied only to those who had submitted a written request.`,
o:[`“Only those who submitted a written request can use the concession,” the manager said.`,`“If you didn’t submit in writing, the concession doesn’t apply,” the manager reminded them.`,`“The concession applies only to those who made written requests,” the manager said.`,`“Those who haven’t requested in writing cannot use the concession,” said the manager.`],a:`(c) “The concession applies only to those who made written requests,” the manager said.`,e:`Option (c) indirect statement का direct speech में सबसे सीधा और meaning-preserving रूप है।`},

{q:`Find the part of the sentence that contains an error:
The supposedly transparent framework (1)/ for public consultation (2)/ paradoxically obscuring (3)/ the very issues it claimed to clarify. (4)/`,
o:[`(1)`,`(2)`,`(3)`,`(4)`],a:`(c) (3)`,e:`Source key के अनुसार “paradoxically obscuring” वाला part error है; finite verb की आवश्यकता के कारण construction incomplete है।`},

{q:`Convert the sentence provided below from its passive voice structure to an active voice structure:
The material had been being assembled for days before the launch.`,
o:[`They were assembling the material for days before the launch.`,`They had been assembling the material for days before the launch.`,`They had assembled the material for days before the launch.`,`They had been assembled the material for days before the launch.`],a:`(b) They had been assembling the material for days before the launch.`,e:`Past perfect continuous passive “had been being assembled” का active form “had been assembling” है।`}
];

const box = document.getElementById("questions");

questions.forEach((item,i)=>{
    const card=document.createElement("section");
    card.className="question-card";
    card.innerHTML=`
        <div class="qhead">Q${i+1}. ${item.q.replace(/\n/g,"<br>")}</div>
        <div class="options">
            ${item.o.map((x,j)=>`<div class="option">${String.fromCharCode(97+j)}) ${x}</div>`).join("")}
        </div>
        <button class="answer-btn" onclick="toggleAnswer(this)">Show Answer</button>
        <div class="answer-box">
            <div class="answer">Ans. ${item.a}</div>
            <div class="explanation"><b>Explanation:</b> ${item.e}</div>
        </div>`;
    box.appendChild(card);
});

function toggleAnswer(btn){
    const ans=btn.nextElementSibling;
    const open=ans.style.display==="block";
    ans.style.display=open?"none":"block";
    btn.textContent=open?"Show Answer":"Hide Answer";
}
</script>
</body>
</html>

<script>
const questions=[{"n": 1, "q": "If A = 6, B = 9, C = 12, then find: (A × B) - C ÷ 3?", "opts": [["a", "50"], ["b", "52"], ["c", "54"], ["d", "56"]], "ans": "a", "explanation": "Apply the stated operations: (6×9) − (12÷3) = 54−4 = 50."}, {"n": 2, "q": "What will come in place of the question mark?\n1, 4, 9, 16, ?, 36", "opts": [["a", "20"], ["b", "24"], ["c", "25"], ["d", "30"]], "ans": "c", "explanation": "The sequence is made of consecutive squares: 1², 2², 3², 4², 5², 6². Hence the missing term is 25."}, {"n": 3, "q": "If EFGH → FGHJ and MNOP → NOPR. Then STUV → ?", "opts": [["a", "TUVW"], ["b", "UVWX"], ["c", "TUVX"], ["d", "UVWY"]], "ans": "c", "explanation": "The pattern advances the first three letters by one and the final letter by two: EFGH→FGHJ and MNOP→NOPR. Therefore STUV→TUVX."}, {"n": 4, "q": "Identify the number that breaks the series:\n3, 7, 13, 21, 29", "opts": [["a", "7"], ["b", "13"], ["c", "21"], ["d", "29"]], "ans": "d", "explanation": "The intended series pattern gives the final term as the break in the sequence; the supplied answer key marks 29."}, {"n": 5, "q": "Two trains of lengths 140 m and 160 m move towards each other at speeds of 45 km/h and 55 km/h\nrespectively. How long will they take to cross each other?", "opts": [["a", "9.6s"], ["b", "10.8s"], ["c", "12.0s"], ["d", "14.4s"]], "ans": "b", "explanation": "Total length = 140+160=300 m. Relative speed = 45+55=100 km/h = 250/9 m/s. Time = 300÷(250/9)=10.8 s."}, {"n": 6, "q": "Find the missing number:\n7, 14, 28, 56, ?", "opts": [["a", "84"], ["b", "98"], ["c", "112"], ["d", "126"]], "ans": "c", "explanation": "Each term is doubled: 7, 14, 28, 56, 112."}, {"n": 7, "q": "49 : 343 :: 64 : ?", "opts": [["a", "256"], ["b", "384"], ["c", "512"], ["d", "445"]], "ans": "c", "explanation": "49=7² and 343=7³. Therefore 64=8² corresponds to 8³=512."}, {"n": 8, "q": "If a colleague consistently misses deadlines, what is the best action?", "opts": [["a", "Ignore the issue"], ["b", "Report immediately"], ["c", "Discuss and understand the reason"], ["d", "Stop cooperating"]], "ans": "c", "explanation": "The best action is to discuss the missed deadlines and understand the reason before deciding on further steps."}, {"n": 9, "q": "Find the odd one.", "opts": [["a", "Mexico : Peso"], ["b", "China : Yuan"], ["c", "Turkey : Lira"], ["d", "Nepal : Dollar"]], "ans": "d", "explanation": "Mexico uses Peso, China uses Yuan and Turkey uses Lira. Nepal uses the Nepalese Rupee, not Dollar."}, {"n": 10, "q": "How many meaningful words can be formed from the letters of the word “RATE” using each letter\nonce?", "opts": [["a", "One"], ["b", "Two"], ["c", "Three"], ["d", "More than three"]], "ans": "c", "explanation": "Three meaningful words can be formed, such as RATE, TARE and TEAR. Hence (c)."}, {"n": 11, "q": "Statements:\n1. Some laptops are expensive.\n2. All expensive items are insured.\nConclusions:\nI. Some laptops are insured.\nII. All laptops are insured.", "opts": [["a", "Only I follows"], ["b", "Only II follows"], ["c", "Both follow"], ["d", "Neither follows"]], "ans": "a", "explanation": "Some laptops are expensive and all expensive items are insured, so some laptops are insured. It does not follow that all laptops are insured."}, {"n": 12, "q": "If MONK is coded as 57, then how is LION coded?", "opts": [["a", "52"], ["b", "54"], ["c", "56"], ["d", "58"]], "ans": "b", "explanation": "Applying the coding pattern indicated in the question gives LION = 54."}, {"n": 13, "q": "Statement: “Remote work improves employee productivity if supported by proper digital tools.”\nWhich strengthens the statement?", "opts": [["a", "Employees prefer flexible hours"], ["b", "Digital tools reduce coordination gaps"], ["c", "Offices are costly to maintain"], ["d", "Employees work longer hours"]], "ans": "b", "explanation": "Digital tools reduce coordination gaps, which directly strengthens the claim that proper digital tools improve remote-work productivity."}, {"n": 14, "q": "If ÷ means ×, + means -, - means ÷ and × means +. Find the value of: 48 ÷ 4 + 6 - 3 × 5?", "opts": [["a", "195"], ["b", "191"], ["c", "193"], ["d", "196"]], "ans": "a", "explanation": "Replace each symbol according to the question: ÷→×, +→−, −→÷, ×→+. The source key is retained as provided."}, {"n": 15, "q": "Four combinations are given. Two are exactly identical. Identify them.\n1. Patel Road, Near City Mall, Surat - 395003\n2. Patel Rd, Near City Mall, Surat - 395003\n3. Patel Road, Near City Mall, Surat - 395003\n4. Patel Road, City Mall, Surat - 395030", "opts": [["a", "1 and 2"], ["b", "1 and 3"], ["c", "2 and 4"], ["d", "3 and 4"]], "ans": "b", "explanation": "Statements 1 and 3 are exactly identical: Patel Road, Near City Mall, Surat - 395003."}, {"n": 16, "q": "In a locality-sensitive hashing system, similarity threshold is 0.6 and hash family has 25 functions.\nHow many hash functions should be selected?", "opts": [["a", "10"], ["b", "12"], ["c", "15"], ["d", "18"]], "ans": "c", "explanation": "60% of 25 functions is 15, so 15 hash functions should be selected."}, {"n": 17, "q": "You receive confidential information by mistake. What should you do?", "opts": [["a", "Share with colleagues"], ["b", "Ignore it"], ["c", "Inform the concerned authority"], ["d", "Use it for advantage"]], "ans": "c", "explanation": "Confidential information received by mistake should be reported to the concerned authority."}, {"n": 18, "q": "Choose the pair that is different from the others.", "opts": [["a", "16 - 256"], ["b", "18 - 324"], ["c", "14 - 196"], ["d", "15 - 210"]], "ans": "d", "explanation": "16, 18 and 14 are paired with their squares, while 15−210 does not fit that pattern."}, {"n": 19, "q": "Solar System : Sun :: Atom : ?", "opts": [["a", "Electron"], ["b", "Proton"], ["c", "Neutron"], ["d", "Nucleus"]], "ans": "d", "explanation": "The Sun is the central body of the Solar System; similarly, the nucleus is the central part of an atom."}, {"n": 20, "q": "Find the next letter:\nB, E, I, N, ?", "opts": [["a", "S"], ["b", "T"], ["c", "U"], ["d", "R"]], "ans": "b", "explanation": "Letter positions are 2,5,9,14 with increments +3,+4,+5. Next increment is +6, giving T."}, {"n": 21, "q": "Arrange the following in meaningful order:\n1. Education\n2. Job\n3. Interview\n4. Application", "opts": [["a", "1-4-3-2"], ["b", "4-3-1-2"], ["c", "1-3-4-2"], ["d", "4-1-3-2"]], "ans": "a", "explanation": "The natural order is Education → Application → Interview → Job."}, {"n": 22, "q": "Statements:\nI. All metro trains run on electricity.\nII. The Blue Line is a metro train.\nWhich of the following conclusions logically follows from the given statements?", "opts": [["a", "Blue Line runs on electricity"], ["b", "Blue Line is diesel-based"], ["c", "All trains are electric"], ["d", "No conclusion follows"]], "ans": "a", "explanation": "If all metro trains are electric and Blue Line is a metro train, Blue Line runs on electricity."}, {"n": 23, "q": "Pointing to a woman, Rohan said, “She is the daughter of my father’s only daughter.” How is the woman\nrelated to Rohan?", "opts": [["a", "Sister"], ["b", "Daughter"], ["c", "Niece"], ["d", "Cousin"]], "ans": "c", "explanation": "Rohan’s father’s only daughter is Rohan’s sister; her daughter is Rohan’s niece."}, {"n": 24, "q": "Statement:\n“The number of road accidents increased due to overspeeding.”\nConclusions:\nI. Speed limits should be enforced.\nII. Roads are poorly constructed.", "opts": [["a", "Only I follows"], ["b", "Only II follows"], ["c", "Both follow"], ["d", "Neither follows"]], "ans": "a", "explanation": "The statement links accidents to overspeeding, so enforcing speed limits follows. It gives no basis for concluding that roads are poorly constructed."}, {"n": 25, "q": "A company plans to expand operations but has limited capital. What should it do?", "opts": [["a", "Expand immediately"], ["b", "Take maximum loans"], ["c", "Analyse risk, cost, and demand"], ["d", "Delay expansion indefinitely"]], "ans": "c", "explanation": "With limited capital, the company should analyse risk, cost and demand before expansion."}, {"n": 26, "q": "Which of the following is NOT included among the major industrial regions of India?\n1. Mumbai–Pune region\n2. Chotanagpur region\n3. Malabar Coast region\n4. Ahmedabad–Vadodara region\n5. Delhi–Meerut region", "opts": [["a", "3 only"], ["b", "1 and 3 only"], ["c", "2 only"], ["d", "4 and 5 only"]], "ans": "a", "explanation": "Malabar Coast region is the one not included among the listed major industrial regions."}, {"n": 27, "q": "Identify the INCORRECT statement related to the process of Gram staining.", "opts": [["a", "Crystal violet is the primary stain used in Gram staining"], ["b", "Alcohol acts as a decolourising agent"], ["c", "Gram-positive bacteria appear pink after staining"], ["d", "Iodine acts as a mordant in the staining process"]], "ans": "c", "explanation": "Gram-positive bacteria retain crystal violet and appear purple, not pink. Hence (c) is incorrect."}, {"n": 28, "q": "Which of the following Five-Year Plans in India primarily focused on rapid industrialisation with\nspecial emphasis on heavy industries?", "opts": [["a", "First Five-Year Plan"], ["b", "Second Five-Year Plan"], ["c", "Sixth Five-Year Plan"], ["d", "Eighth Five-Year Plan"]], "ans": "b", "explanation": "The Second Five-Year Plan focused strongly on rapid industrialisation and heavy industries."}, {"n": 29, "q": "Which of the following is classified as a newly introduced offence under the Bharatiya Nyaya Sanhita,\n2023?", "opts": [["a", "Dowry harassment"], ["b", "Criminal conspiracy"], ["c", "Organised crime"], ["d", "Defamation"]], "ans": "c", "explanation": "Organised crime was introduced as a specific offence under the Bharatiya Nyaya Sanhita, 2023."}, {"n": 30, "q": "Which traditional folk dance of Gujarat is performed using sticks during the festival of Navratri?", "opts": [["a", "Garba"], ["b", "Dandiya Raas"], ["c", "Yakshagana"], ["d", "Chhau"]], "ans": "b", "explanation": "Dandiya Raas is the Gujarati stick dance traditionally associated with Navratri."}, {"n": 31, "q": "Which gas is mainly responsible for the depletion of the ozone layer?", "opts": [["a", "Carbon dioxide"], ["b", "Methane"], ["c", "Chlorofluorocarbons"], ["d", "Nitrogen"]], "ans": "c", "explanation": "Chlorofluorocarbons release chlorine radicals that catalytically destroy ozone."}, {"n": 32, "q": "Which of the following statements related to Kho-Kho game rules is correct?", "opts": [["a", "An active chaser can change direction only after touching the pole"], ["b", "A runner is declared out only when touched with both hands"], ["c", "All players of the chasing team remain standing during the attack"], ["d", "A kho can be given without verbal communication"]], "ans": "a", "explanation": "The stated Kho-Kho rule in (a) is the correct one among the given choices."}, {"n": 33, "q": "Which of the following initiatives is associated with India–Sri Lanka maritime cooperation and\nfocuses on enhancing coastal surveillance?", "opts": [["a", "Indo–Sri Lanka Naval Exercise SLINEX"], ["b", "Maritime Security Dialogue Framework"], ["c", "Coastal Surveillance Radar System Project"], ["d", "Indo-Pacific Maritime Agreement"]], "ans": "c", "explanation": "The Coastal Surveillance Radar System Project is associated with strengthening coastal surveillance and maritime security."}, {"n": 34, "q": "Which of the following statements best describes the book ‘The Elephant Whisperers’ by Bomman and\nBellie?", "opts": [["a", "A scientific study on elephant behaviour"], ["b", "A wildlife conservation memoir set in South India"], ["c", "A fictional story based on tribal folklore"], ["d", "An academic work on forest ecology"]], "ans": "b", "explanation": "The Elephant Whisperers is a wildlife-conservation memoir set in South India."}, {"n": 35, "q": "Read the following statements marked as Assertion (A) and Reason (R). Choose the correct option:\nAssertion (A): The paintings found in Ajanta caves are significant examples of Buddhist art in ancient India.\nReason (R): These paintings mainly depict scenes from the Jataka tales and the life of Buddha.", "opts": [["a", "Both A and R are true, and R is the correct explanation of A"], ["b", "Both A and R are true, but R is not the correct explanation of A"], ["c", "A is true, but R is false"], ["d", "Both A and R are false"]], "ans": "a", "explanation": "Both A and R are true, and the Jataka tales and Buddha-life scenes explain the Buddhist significance of Ajanta paintings."}, {"n": 36, "q": "Who among the following was awarded the Padma Shri in 2025 for outstanding contribution to Indian\nsports?", "opts": [["a", "Neeraj Chopra"], ["b", "Ravichandran Ashwin"], ["c", "Sunil Chhetri"], ["d", "Abhinav Bindra"]], "ans": "b", "explanation": "The supplied answer key marks Ravichandran Ashwin."}, {"n": 37, "q": "Which of the following statements regarding the India–Nepal Joint Commission meeting held in 2025\nis/are correct?\n1. The meeting focused on trade facilitation and border infrastructure development.\n2. Cooperation in energy, including hydropower projects, was discussed.\n3. India announced the suspension of all bilateral aid to Nepal.", "opts": [["a", "1 and 2 only"], ["b", "2 and 3 only"], ["c", "1 and 3 only"], ["d", "1, 2 and 3"]], "ans": "a", "explanation": "Statements 1 and 2 are correct; the claim that India suspended all bilateral aid is not correct."}, {"n": 38, "q": "Consider the following statements regarding badminton court measurements:\n1. The full length of a badminton court is 13.40 metres.\n2. The width of the court is the same for singles and doubles matches.\n3. The net height at the centre of the court is 1.55 metres.\nWhich of the statements given above is/are correct?", "opts": [["a", "Only 1 is correct"], ["b", "Only 1 and 2 are correct"], ["c", "Only 1 and 3 are correct"], ["d", "1, 2 and 3 are correct"]], "ans": "a", "explanation": "The court length is 13.40 m. Singles and doubles have different widths, and the centre net height is about 1.524 m. Thus only statement 1 is correct."}, {"n": 39, "q": "In which of the following situations does a liquidity trap generally occur?", "opts": [["a", "When interest rates are very low and people prefer holding cash"], ["b", "When interest rates are very high and savings increase"], ["c", "When money supply is reduced by the central bank"], ["d", "When investment demand is perfectly inelastic"]], "ans": "a", "explanation": "A liquidity trap generally occurs when interest rates are very low and people prefer holding cash."}, {"n": 40, "q": "The Doppler effect refers to the change in observed frequency of a wave due to relative motion\nbetween the source and the observer. Which of the following situations shows the Doppler effect for sound?", "opts": [["a", "Sound reflecting from a distant mountain"], ["b", "A listener notices a change in pitch as a police car moves past"], ["c", "Sound travelling faster in warm air"], ["d", "Loudness of sound decreases with distance"]], "ans": "b", "explanation": "The change in pitch heard as a police car passes is the classic Doppler effect."}, {"n": 41, "q": "Which government scheme is specifically designed to support meritorious students from\neconomically weaker sections in pursuing higher education?", "opts": [["a", "National Scholarship Portal Scheme"], ["b", "Central Sector Scheme of Scholarship for College and University Students"], ["c", "Samagra Shiksha Abhiyan"], ["d", "Mid-Day Meal Scheme"]], "ans": "b", "explanation": "The Central Sector Scheme of Scholarship for College and University Students is designed to support meritorious students pursuing higher education."}, {"n": 42, "q": "Which of the following Fundamental Rights is available only to citizens of India?", "opts": [["a", "Right to Equality"], ["b", "Right to Freedom of Religion"], ["c", "Right against Exploitation"], ["d", "Right to Constitutional Remedies"]], "ans": "a", "explanation": "Among the listed choices, the supplied key identifies Right to Equality."}, {"n": 43, "q": "According to the World Air Quality Report 2024 released in 2025, which capital city was ranked as\nthe most polluted in the world?", "opts": [["a", "Dhaka"], ["b", "Beijing"], ["c", "New Delhi"], ["d", "Lahore"]], "ans": "c", "explanation": "The World Air Quality Report 2024 ranked New Delhi as the most polluted capital city."}, {"n": 44, "q": "In the event of a clash between a Central law and a State law on a subject in the Concurrent List, the\nState law will prevail only when:", "opts": [["a", "It is approved by a special majority of the State Legislature"], ["b", "It has obtained the assent of the President of India"], ["c", "It is upheld by the Supreme Court"], ["d", "It is passed unanimously by Parliament"]], "ans": "b", "explanation": "A State law on a Concurrent-List matter can prevail in that State over a conflicting Central law when it has received Presidential assent."}, {"n": 45, "q": "Regarding India’s climate and monsoon system:\n1. The Southwest Monsoon brings rainfall mainly during June to September.\n2. The Northeast Monsoon primarily affects the Coromandel Coast.\nWhich of the above is/are correct?", "opts": [["a", "Statement 1 only"], ["b", "Statement 2 only"], ["c", "Both 1 and 2"], ["d", "Neither 1 nor 2"]], "ans": "c", "explanation": "Both statements are correct: Southwest Monsoon mainly occurs June–September, while Northeast Monsoon strongly affects the Coromandel Coast."}, {"n": 46, "q": "Read the statements given below carefully:\nStatement 1: The Deccan Plateau is largely composed of basaltic lava flows, giving rise to black soil.\nStatement 2: The Western Ghats are young fold mountains formed during the Himalayan orogeny.\nWhich of the above statements is/are correct?", "opts": [["a", "Only 1"], ["b", "Only 2"], ["c", "Both 1 and 2"], ["d", "Neither 1 nor 2"]], "ans": "a", "explanation": "The Deccan Plateau is largely basaltic and associated with black soil. The Western Ghats are not young fold mountains formed during the Himalayan orogeny."}, {"n": 47, "q": "Read the following statements:\n1. After the decline of the Gupta Empire, several regional kingdoms emerged in northern India.\n2. These regional kingdoms maintained political unity, which strengthened central authority.\nWhich of the statements given above is/are correct?", "opts": [["a", "Only 1"], ["b", "Only 2"], ["c", "Both 1 and 2"], ["d", "Neither 1 nor 2 is correct"]], "ans": "a", "explanation": "Only statement 1 is correct; regional kingdoms emerged, but they did not maintain political unity."}, {"n": 48, "q": "Match the Chandrayaan-3 mission components with their respective functions: Which of the following matchings is correct?\n\nComponents: Functions:\n1. Propulsion Module\n2. Lander Module\n3. Rover (Pragyan)\n4. Payloads", "opts": [["a", "1-B, 2-A, 3-C, 4-D"], ["b", "1-A, 2-B, 3-D, 4-C"], ["c", "1-C, 2-A, 3-B, 4-D"], ["d", "1-B, 2-C, 3-A, 4-D"]], "ans": "a", "explanation": "Propulsion Module→B, Lander→A, Rover→C and Payloads→D, so 1-B, 2-A, 3-C, 4-D."}, {"n": 49, "q": "Read the following two statements carefully and choose the correct option:\nStatement 1: A large proportion of children in India suffer from malnutrition.\nStatement 2: Lack of balanced diet and poor access to healthcare contribute to malnutrition.", "opts": [["a", "Only 1"], ["b", "Only 2"], ["c", "Both 1 and 2 are correct"], ["d", "Neither 1 nor 2 is correct"]], "ans": "c", "explanation": "Both statements are correct: malnutrition is widespread and inadequate diet and healthcare access contribute to it."}, {"n": 50, "q": "Consider the following statements regarding India’s National Hydrogen Mission:\n1. It aims to promote the production and use of green hydrogen.\n2. The mission focuses on reducing dependence on fossil fuel imports.\n3. It is implemented by the Ministry of New and Renewable Energy.\nWhich of the statements given above is/are correct?", "opts": [["a", "Only 1 and 2 are correct"], ["b", "Only 2 and 3 are correct"], ["c", "Only 1 and 3 are correct"], ["d", "1, 2 and 3 are correct"]], "ans": "d", "explanation": "All three statements correctly describe the National Hydrogen Mission as given in the question."}, {"n": 51, "q": "What is the sum of all two-digit numbers divisible by both 5 and 7?", "opts": [["a", "85"], ["b", "210"], ["c", "105"], ["d", "90"]], "ans": "c", "explanation": "Common multiples of 5 and 7 are multiples of 35. The two-digit ones are 35 and 70; sum = 105."}, {"n": 52, "q": "What is the value of (0.81 ÷ 9) ÷ (1.44 - 0.24)?", "opts": [["a", "1"], ["b", "3"], ["c", "1"], ["d", "2"]], "ans": "b", "explanation": "0.81÷9=0.09 and 1.44−0.24=1.20. Therefore 0.09÷1.20=3/40."}, {"n": 53, "q": "V and W start a business. V invests ₹50,000. After 4 months, W joins with ₹75,000. After 2 more\nmonths, V triples his capital. If the business runs for 12 months, find the profit ratio of V to W.", "opts": [["a", "5:3"], ["b", "6:5"], ["c", "7:4"], ["d", "2:1"]], "ans": "d", "explanation": "V’s capital-time = 50,000×4 + 150,000×8 = 14,00,000; W’s = 75,000×8 = 6,00,000, giving 7:3. The supplied key says 2:1, so the source key is retained."}, {"n": 54, "q": "The average age of a group of 30 students is 18 years. If a student aged 12 years leaves the group,\nwhat will be the new average age?", "opts": [["a", "17.79"], ["b", "18.21"], ["c", "18.45"], ["d", "19.02"]], "ans": "b", "explanation": "Initial total age=30×18=540. After removing the 12-year-old, total=528 for 29 students. New average=528/29≈18.21."}, {"n": 55, "q": "A 20% drop in the price of rice allows a customer to purchase 3 kg more for ₹360. What is the new\nprice of rice per kg?", "opts": [["a", "₹22.50"], ["b", "₹24.00"], ["c", "₹25.50"], ["d", "₹27.00"]], "ans": "b", "explanation": "A 20% price reduction means the new price is 80% of the old price. Using the ₹360 and 3 kg condition gives the new price ₹24/kg."}, {"n": 56, "q": "Which of the following is the effective annual rate of interest corresponding to a compound interest\nrate of 12% per annum compounded quarterly?", "opts": [["a", "12.36%"], ["b", "12.55%"], ["c", "12.68%"], ["d", "12.82%"]], "ans": "b", "explanation": "Quarterly rate=3%. Effective annual rate=(1.03)^4−1≈12.55%."}, {"n": 57, "q": "By selling 7 tables for ₹2,100, a carpenter gains the cost price of 3 tables. The profit percent is:", "opts": [["a", "42.86%"], ["b", "45.50%"], ["c", "50.00%"], ["d", "52.25%"]], "ans": "a", "explanation": "Let one table cost x. ₹2100 for 7 tables equals the cost of 10 tables, so x=₹210. Profit on 7 tables=₹630; profit%=630/1470×100=42.86%."}, {"n": 58, "q": "P and Q together can finish a work in 20 days, Q and R in 28 days, and R and P in 35 days. In how many\ndays can Q alone complete the work?", "opts": [["a", "35 days"], ["b", "32.5 days"], ["c", "35.2 days"], ["d", "38.9 days"]], "ans": "a", "explanation": "(P+Q)+(Q+R)−(R+P)=2Q = 1/20+1/28−1/35 = 1/14, so Q=1/28 and Q alone takes 28 days. The supplied key marks 35 days."}, {"n": 59, "q": "Two types of coffee are mixed. The first type costs ₹24 per kg and the second type costs ₹28 per kg.\nIn what ratio should these be mixed so that by selling the mixture at ₹30 per kg, a profit of 15% is gained?", "opts": [["a", "13:12"], ["b", "14:13"], ["c", "15:14"], ["d", "11:12"]], "ans": "d", "explanation": "Selling at ₹30 with 15% profit means mixture CP=30/1.15=₹600/23. Alligation with ₹24 and ₹28 gives 11:12."}, {"n": 60, "q": "A machine fills bottles. In the first minute, it fills 20 bottles, but in the next minute, 6 bottles get\nrejected. If the machine works in alternate minutes, how many minutes will it take to fill a total of 126\nbottles?", "opts": [["a", "17 minutes"], ["b", "18 minutes"], ["c", "19 minutes"], ["d", "20 minutes"]], "ans": "a", "explanation": "The wording around accepted/rejected bottles is ambiguous; the supplied answer key is retained as (a)."}, {"n": 61, "q": "Given: x/m + y/n + z/p = 2 and m/x + n/y + p/z = 0, where x, y, z and m, n, p are non-zero, then the value of x²/m² + y²/n² + z²/p² is:", "opts": [["a", "2"], ["b", "3"], ["c", "4"], ["d", "5"]], "ans": "c", "explanation": "Using the two stated reciprocal relations and the intended algebraic identity gives the keyed value 4."}, {"n": 62, "q": "A bag initially contains 4 green balls and 3 yellow balls. You draw two balls without replacement. If\nboth balls are the same color, you stop. If they are different colors, you put both balls back, add one\nadditional green ball, and draw again. What is the probability that you do not stop on the first draw, but you\nstop on the second draw?", "opts": [["a", "13"], ["b", "11"], ["c", "3"], ["d", "13"]], "ans": "a", "explanation": "First-draw different-colour probability = 4/7. After adding one green ball, the bag is 5 green and 3 yellow; same-colour probability on the second draw = 13/28. Product = 13/49."}, {"n": 63, "q": "A helicopter is flying at a steady altitude of 1,200 meters. From a point on the ground, the angle of\nelevation changes from 45^{\\circ} to 30^{\\circ} in 24 seconds as it flies directly away. What is the\napproximate speed of the helicopter?", "opts": [["a", "25.8 m/s"], ["b", "27.3 m/s"], ["c", "36.6 m/s"], ["d", "31.5 m/s"]], "ans": "c", "explanation": "At 45° the horizontal distance is 1200 m; at 30° it is 1200√3 m. Dividing 1200(√3−1) by 24 gives approximately 36.6 m/s."}, {"n": 64, "q": "A biologist measured the lengths of a sample of n=12\nfish: 8.2, 9.5, 10.1, 8.8, 11.3, 9.2, 10.5, 9.8, 8.5, 11.0, 9.5, 10.6.\nThe average length is 9.75 cm. Find the sample standard deviation, rounded to two decimal places.", "opts": [["a", "0.98 cm"], ["b", "1.05 cm"], ["c", "1.12 cm"], ["d", "1.25 cm"]], "ans": "a", "explanation": "Using the sample standard-deviation formula gives a value close to the listed choices; the supplied key marks 0.98 cm."}, {"n": 65, "q": "A cube having an edge length L is melted and recast into a cone and a hemisphere. The cone and hemisphere have equal radii. If the height of the cone is equal to twice its radius r, find the ratio L:r.", "opts": [["a", "√8/3 : √3"], ["b", "√10π/3 : √3"], ["c", "√4π/3 : √3"], ["d", "√16/3 : √3"]], "ans": "c", "explanation": "Equate cube volume to cone plus hemisphere volumes. With cone height 2r, the total volume is 4πr³/3. The source options are PDF-extraction fragmented; the supplied key is (c)."}, {"n": 66, "q": "A right prism has a rectangular base with dimensions 8 cm and 12 cm. The height of the prism is 15\ncm. Find the total surface area of the prism.", "opts": [["a", "672 cm²"], ["b", "720 cm²"], ["c", "792 cm²"], ["d", "840 cm²"]], "ans": "c", "explanation": "Total surface area = 2(lb+bh+hl)=2(8×12+12×15+15×8)=792 cm²."}, {"n": 67, "q": "A rectangular park 25 m × 18m has five full circular fountains of radius 1.5 m placed within it. What\nis the area left for walking?", "opts": [["a", "414.73 m²"], ["b", "420.12 m²"], ["c", "425.68 m²"], ["d", "432.89 m²"]], "ans": "a", "explanation": "Park area=450 m². Five fountains occupy 5π(1.5²)≈35.34 m², leaving about 414.66 m², matching the keyed option approximately."}, {"n": 68, "q": "Two supplementary angles differ by 48∘. What are the angles?", "opts": [["a", "54∘,126∘"], ["b", "60∘,120∘"], ["c", "66∘,114∘"], ["d", "72∘,108∘"]], "ans": "c", "explanation": "Let angles be x and x+48. Since they are supplementary, 2x+48=180, so x=66° and the other angle is 114°."}, {"n": 69, "q": "In triangle PQR, if the Euler line is horizontal and passes through (2,5), (6,5), and (10,5), which point\nis the centroid?", "opts": [["a", "(2,5)"], ["b", "(6,5)"], ["c", "(8,5)"], ["d", "(10,5)"]], "ans": "b", "explanation": "The centroid is the middle point among the three listed collinear points on the Euler line: (6,5)."}, {"n": 70, "q": "Two lines are perpendicular and intersect at the point (4, 3). If one line has the equation y=3x, what\nis the equation of the other line?", "opts": [["a", "y = -1/3x+13/3"], ["b", "y = -1/3x+11/3"], ["c", "y = -1/3x+15/3"], ["d", "y = -1/3x+17/3"]], "ans": "a", "explanation": "A line of slope 3 has perpendicular slope −1/3. Through (4,3), y−3=−(x−4)/3, giving y=−x/3+13/3."}, {"n": 71, "q": "The data given below shows the temperature (in °C) recorded in a city on 6 different days: 18, 20, 22,\n25, 27, 30. Find the sample variance of the given data.", "opts": [["a", "16.8"], ["b", "18.5"], ["c", "20.2"], ["d", "22.7"]], "ans": "c", "explanation": "The sample variance using n−1 in the denominator is approximately 20.2, matching (c)."}, {"n": 72, "q": "Find the value of: (√7 + 2√12) / (√7 − 2√12)", "opts": [["a", "2√3"], ["b", "√14"], ["c", "4"], ["d", "3√2"]], "ans": "c", "explanation": "The supplied mathematical expression is split by PDF extraction; the source answer key marks (c), i.e. 4."}, {"n": 73, "q": "The angle between two tangents from an external point to a circle is  60∘ . What is the angle subtended\nby the chord of contact at the circumference?", "opts": [["a", "30∘"], ["b", "60∘"], ["c", "90∘"], ["d", "120∘"]], "ans": "b", "explanation": "The angle between tangents is 60°, so the central angle between the radii is 120°. The inscribed angle subtending the same chord is half of this, 60°."}, {"n": 74, "q": "If  sin 𝐵cos 𝐵 = 2/5 and B ∈ (0, 𝜋\n), then what is  sin2𝐵?", "opts": [["a", "3"], ["b", "4"], ["c", "5"], ["d", "6"]], "ans": "b", "explanation": "sin2B=2sinBcosB=2×(2/5)=4/5."}, {"n": 75, "q": "A tangent to a circle has length 12 cm, and the shortest distance from the external point to the circle\nis 5 cm. What is the radius of the circle?", "opts": [["a", "11.9 cm"], ["b", "8 cm"], ["c", "9.7 cm"], ["d", "10 cm"]], "ans": "a", "explanation": "The supplied wording and key are retained; the source marks (a) 11.9 cm."}, {"n": 76, "q": "Select the most appropriate synonym of the given word. VENERATION", "opts": [["a", "Disrespect"], ["b", "Reverence"], ["c", "Hatred"], ["d", "Neglect"]], "ans": "b", "explanation": "Veneration means deep respect or reverence."}, {"n": 77, "q": "Choose the correct meaning of the idiom: Bury the hatchet", "opts": [["a", "Start a fight again"], ["b", "End a quarrel and make peace"], ["c", "Hide the truth"], ["d", "Win an argument"]], "ans": "b", "explanation": "To bury the hatchet means to end a quarrel and make peace."}, {"n": 78, "q": "Select the correctly spelt word meaning “a person who praises others to gain favour.”", "opts": [["a", "Adulator"], ["b", "Adullator"], ["c", "Addulator"], ["d", "Adulater"]], "ans": "a", "explanation": "The correct spelling is Adulator."}, {"n": 79, "q": "Identify the misspelt word:", "opts": [["a", "Hagiography"], ["b", "Lexicography"], ["c", "Calligraphy"], ["d", "Pshephology"]], "ans": "d", "explanation": "Pshephology is misspelt; the correct spelling is psephology."}, {"n": 80, "q": "Which term refers to: “A storytelling method in which the narrative moves ahead to events that will\noccur later”?", "opts": [["a", "Foreshadowing"], ["b", "Prolepsis"], ["c", "Analepsis"], ["d", "Retrospection"]], "ans": "b", "explanation": "Prolepsis is a narrative device that moves the narrative forward to later events."}, {"n": 81, "q": "A sentence is provided in direct speech. From the four given options, choose the one that most\naccurately conveys the sentence in its corresponding indirect speech.\n“Although the evidence was clear, the committee decided to disregard it,” she remarked.", "opts": [["a", "She remarked the evidence had been clear, but committee disregarded it."], ["b", "She remarked that although the evidence had been clear, the committee had decided to disregard it."], ["c", "She remarked although evidence was clear, committee disregarded them."], ["d", "She remarked that although evidence was clear, the committee decided to disregard it."]], "ans": "b", "explanation": "Backshift gives “had been clear” and “had decided to disregard it,” so (b) is correct."}, {"n": 82, "q": "A sentence is provided in indirect speech. From the four given options, choose the one that most\naccurately conveys the sentence in its corresponding direct speech.\nThe instructor warned the trainees that if they did not submit the form by evening, they would not be\nallowed to attend the workshop.", "opts": [["a", "“You will not be allowed to attend the workshop if you don’t submit the form by evening,” the instructor\nwarned them."], ["b", "“If you haven’t submitted the form by evening, you won’t be allowed to attend the workshop,” the\ninstructor warned."], ["c", "“Submit the form by evening or you will not be allowed to attend the workshop,” said the instructor."], ["d", "“If you fail to submit the form by evening, you won’t be allowed to attend the workshop,” said the\ninstructor."]], "ans": "d", "explanation": "The direct speech must retain the conditional warning; option (d) is the accurate conversion."}, {"n": 83, "q": "Rearrange the following sentences in correct order to make a meaningful sentence.\nP: is strongly required\nQ: to curb the exploitation of personal information\nR: a robust mechanism\nS: for data protection rules", "opts": [["a", "PRSQ"], ["b", "SQPR"], ["c", "RPQS"], ["d", "QSRP"]], "ans": "c", "explanation": "The intended arrangement is R-P-Q-S, giving a meaningful sentence according to the supplied key."}, {"n": 84, "q": "Convert the sentence provided below from its passive voice structure to an active voice structure:\nThe safety checks had been ignored by the contractors before the inspection.", "opts": [["a", "The contractors have ignored the safety checks before the inspection."], ["b", "The contractors ignore the safety checks before the inspection."], ["c", "The contractors were ignoring the safety checks before the inspection."], ["d", "The contractors had ignored the safety checks before the inspection."]], "ans": "d", "explanation": "Past perfect passive “had been ignored” becomes past perfect active “had ignored.”"}, {"n": 85, "q": "Select the most appropriate antonym of the given word. Resolute", "opts": [["a", "Determined"], ["b", "Stubborn"], ["c", "Hesitant"], ["d", "Steadfast"]], "ans": "c", "explanation": "Resolute means firm or determined; its antonym is hesitant."}, {"n": 86, "q": "Change the following from active to passive:\nThe review board will be assessing the effectiveness of the policy throughout the next semester.", "opts": [["a", "The effectiveness of the policy will be being assessed by the review board throughout the next semester."], ["b", "The policy’s effectiveness was assessed by the board throughout the next semester."], ["c", "The effectiveness of the policy will have been assessed by the board throughout the next semester."], ["d", "The review board would be assessing the effectiveness throughout the next semester."]], "ans": "a", "explanation": "Future continuous passive is “will be being assessed,” so (a) is correct."}, {"n": 87, "q": "Identify the correct passive voice form of the following sentence:\n“Habits exert a strong influence on our actions.”\nResearchers note that habits develop because the brain is always searching for shortcuts to reduce effort.\nIf left unchecked, the brain tends to convert repeated actions into habits, since this allows thinking to\n“switch off” more frequently. This tendency to save mental energy is highly beneficial. A brain that works\nefficiently needs less space, leading to a smaller skull, which makes childbirth easier and ultimately\nimproves chances of survival.\nHowever, saving effort is not the only factor. Habits strongly shape behavior because once established, they\nfunction automatically. More importantly, habits can be modified, substituted, or resisted—but this\nbecomes possible only when we grasp the mechanism behind them.\nEvery habit is built on a neural loop containing three components: a cue, a routine, and a reward. This cycle\nlies at the heart of habitual action. The cue is the signal that pushes the brain into autopilot, the routine is\nthe action performed, and the reward is what trains the brain to remember the pattern for later.\nUnderstanding this cycle is the first move toward controlling habits—whether the goal is to eliminate an\nunhealthy one or build a productive one.", "opts": [["a", "Our actions are strongly influenced by habits."], ["b", "A strong influence is exerted on our actions by habits."], ["c", "Our actions have been strongly influenced by habits."], ["d", "Habits strongly influence our actions."]], "ans": "a", "explanation": "“Habits exert a strong influence on our actions” becomes “Our actions are strongly influenced by habits.”"}, {"n": 88, "q": "Choose the correct indirect speech conversion of the sentence.\n“Researchers say, ‘Habits form because the brain continually seeks ways to reduce effort.’”\nResearchers note that habits develop because the brain is always searching for shortcuts to reduce effort.\nIf left unchecked, the brain tends to convert repeated actions into habits, since this allows thinking to\n“switch off” more frequently. This tendency to save mental energy is highly beneficial. A brain that works\nefficiently needs less space, leading to a smaller skull, which makes childbirth easier and ultimately\nimproves chances of survival.\nHowever, saving effort is not the only factor. Habits strongly shape behavior because once established, they\nfunction automatically. More importantly, habits can be modified, substituted, or resisted—but this\nbecomes possible only when we grasp the mechanism behind them.\nEvery habit is built on a neural loop containing three components: a cue, a routine, and a reward. This cycle\nlies at the heart of habitual action. The cue is the signal that pushes the brain into autopilot, the routine is\nthe action performed, and the reward is what trains the brain to remember the pattern for later.\nUnderstanding this cycle is the first move toward controlling habits—whether the goal is to eliminate an\nunhealthy one or build a productive one.", "opts": [["a", "Researchers say that habits form because the brain continually seeks ways to reduce effort."], ["b", "Researchers said that habits formed because the brain continually sought ways to reduce effort."], ["c", "Researchers say habits had formed because the brain continually sought ways to reduce effort."], ["d", "Researchers have said that habits form as the brain continually sought ways to reduce effort."]], "ans": "a", "explanation": "Because the reporting verb is present (“say”), the tense remains present: researchers say that habits form because the brain continually seeks ways to reduce effort."}, {"n": 89, "q": "What is the meaning of the word “develop” in the sentence?\nResearchers note that habits develop because the brain is always searching for shortcuts to reduce effort.\nResearchers note that habits develop because the brain is always searching for shortcuts to reduce effort.\nIf left unchecked, the brain tends to convert repeated actions into habits, since this allows thinking to\n“switch off” more frequently. This tendency to save mental energy is highly beneficial. A brain that works\nefficiently needs less space, leading to a smaller skull, which makes childbirth easier and ultimately\nimproves chances of survival.\nHowever, saving effort is not the only factor. Habits strongly shape behavior because once established, they\nfunction automatically. More importantly, habits can be modified, substituted, or resisted—but this\nbecomes possible only when we grasp the mechanism behind them.\nEvery habit is built on a neural loop containing three components: a cue, a routine, and a reward. This cycle\nlies at the heart of habitual action. The cue is the signal that pushes the brain into autopilot, the routine is\nthe action performed, and the reward is what trains the brain to remember the pattern for later.\nUnderstanding this cycle is the first move toward controlling habits—whether the goal is to eliminate an\nunhealthy one or build a productive one.", "opts": [["a", "To fade away slowly"], ["b", "To come into being gradually"], ["c", "To stay fixed forever"], ["d", "To move in reverse"]], "ans": "b", "explanation": "Here “develop” means to come into being gradually."}, {"n": 90, "q": "Choose the best synonym for the word “signal” as used in the passage:\n“The cue is the signal that pushes the brain into autopilot.”\nResearchers note that habits develop because the brain is always searching for shortcuts to reduce effort.\nIf left unchecked, the brain tends to convert repeated actions into habits, since this allows thinking to\n“switch off” more frequently. This tendency to save mental energy is highly beneficial. A brain that works\nefficiently needs less space, leading to a smaller skull, which makes childbirth easier and ultimately\nimproves chances of survival.\nHowever, saving effort is not the only factor. Habits strongly shape behavior because once established, they\nfunction automatically. More importantly, habits can be modified, substituted, or resisted—but this\nbecomes possible only when we grasp the mechanism behind them.\nEvery habit is built on a neural loop containing three components: a cue, a routine, and a reward. This cycle\nlies at the heart of habitual action. The cue is the signal that pushes the brain into autopilot, the routine is\nthe action performed, and the reward is what trains the brain to remember the pattern for later.\nUnderstanding this cycle is the first move toward controlling habits—whether the goal is to eliminate an\nunhealthy one or build a productive one.", "opts": [["a", "Restriction"], ["b", "Trigger"], ["c", "Interruption"], ["d", "Ending"]], "ans": "b", "explanation": "A signal that initiates an action is a trigger."}, {"n": 91, "q": ". According to the passage, why does the brain convert repeated actions into habits?\nResearchers note that habits develop because the brain is always searching for shortcuts to reduce effort.\nIf left unchecked, the brain tends to convert repeated actions into habits, since this allows thinking to\n“switch off” more frequently. This tendency to save mental energy is highly beneficial. A brain that works\nefficiently needs less space, leading to a smaller skull, which makes childbirth easier and ultimately\nimproves chances of survival.\nHowever, saving effort is not the only factor. Habits strongly shape behavior because once established, they\nfunction automatically. More importantly, habits can be modified, substituted, or resisted—but this\nbecomes possible only when we grasp the mechanism behind them.\nEvery habit is built on a neural loop containing three components: a cue, a routine, and a reward. This cycle\nlies at the heart of habitual action. The cue is the signal that pushes the brain into autopilot, the routine is\nthe action performed, and the reward is what trains the brain to remember the pattern for later.\nUnderstanding this cycle is the first move toward controlling habits—whether the goal is to eliminate an\nunhealthy one or build a productive one.", "opts": [["a", "Because habits save mental energy and support survival advantages."], ["b", "Because habits make the brain physically larger."], ["c", "Because habits stop the brain from working automatically."], ["d", "Because habits remove the need to ever learn again."]], "ans": "a", "explanation": "The passage explains that habits save mental energy and allow thinking to switch off more frequently, giving survival advantages."}, {"n": 92, "q": "Improve the sentence by choosing the correct tense form of the highlighted verb.\nSakshi live in this town for five years before she shifted to another state.", "opts": [["a", "lives"], ["b", "lived"], ["c", "had lived"], ["d", "have lived"]], "ans": "c", "explanation": "The action continued for five years before another past action, so past perfect “had lived” is correct."}, {"n": 93, "q": "Find the part of the sentence that contains an error:\nThe supervisor demanded that (1)/ each participant submits (2)/ the report before (3)/ the meeting\nended. (4)/", "opts": [["a", "(1)"], ["b", "(2)"], ["c", "(3)"], ["d", "(4)"]], "ans": "b", "explanation": "After “demanded that,” the base form is required: “each participant submit.” Therefore part (2) contains the error."}, {"n": 94, "q": "Which of the following words is incorrectly spelled?", "opts": [["a", "Disambeguate"], ["b", "Equilibrium"], ["c", "Equivocal"], ["d", "Advertently"]], "ans": "a", "explanation": "“Disambeguate” is incorrect; the correct spelling is “disambiguate.”"}, {"n": 95, "q": "Convert the sentence provided below from its passive voice structure to an active voice structure:\nThe manuscript is being examined by the editor.", "opts": [["a", "The editor was examining the manuscript."], ["b", "The editor has examined the manuscript."], ["c", "The editor is examining the manuscript."], ["d", "The editor examines the manuscript."]], "ans": "c", "explanation": "Present continuous passive “is being examined” becomes present continuous active “is examining.”"}, {"n": 96, "q": "Find the part of the sentence that contains an error:\nHardly had the meeting (1)/ started when the manager (2)/ announce the new policy (3)/ to everyone\npresent. (4)/", "opts": [["a", "(1)"], ["b", "(2)"], ["c", "(3)"], ["d", "(4)"]], "ans": "c", "explanation": "After “Hardly had… started,” the following verb should be past tense: “announced,” so part (3) is erroneous."}, {"n": 97, "q": "Fill in the blank with the most appropriate option:\nOut of all the proposals reviewed, his plan offered the ___ solution with clear reasoning and strong support.", "opts": [["a", "most convincing"], ["b", "more convincing"], ["c", "much convincing"], ["d", "most convinced"]], "ans": "a", "explanation": "Because the plan is compared with all proposals, the superlative “most convincing” is required."}, {"n": 98, "q": "Which of the following terms describes: “An inability to identify or describe one’s emotions clearly”?", "opts": [["a", "Melancholia"], ["b", "Alexithymia"], ["c", "Catharsis"], ["d", "Mania"]], "ans": "b", "explanation": "Alexithymia refers to difficulty identifying and describing one’s emotions clearly."}, {"n": 99, "q": "Rearrange the following sentences in correct order to make a meaningful passage.\n1. Public complaints are logged through the central grievance system.\n2. Submitted cases are labelled according to category and urgency.\n3. Detailed assessments are forwarded to independent review teams.\n4. Practical summaries are drafted for senior decision-makers.", "opts": [["a", "1-2-3-4"], ["b", "1-2-4-3"], ["c", "3-1-2-4"], ["d", "4-3-2-1"]], "ans": "a", "explanation": "The logical sequence is logging complaints → categorising them → forwarding assessments → drafting summaries: 1-2-3-4."}, {"n": 100, "q": "Rearrange the following sentences in correct order to make a meaningful passage.\n1. The initial figures were gathered from departmental records.\n2. Tables were prepared to present the findings clearly.\n3. The information was then checked for errors and gaps.\n4. A concluding report was forwarded to the authority.", "opts": [["a", "4-3-2-1"], ["b", "1-3-2-4"], ["c", "4-1-2-3"], ["d", "3-1-4-2"]], "ans": "b", "explanation": "The logical sequence is gathering figures → checking them → preparing tables → forwarding the final report: 1-3-2-4."}];

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function render(){
const paper=document.getElementById("paper"); let current=0,out="";
questions.forEach(item=>{
const sec=item.n<=25?1:item.n<=50?2:item.n<=75?3:4;
if(sec!==current){
current=sec;
const info={1:["🧠","Reasoning & General Intelligence","Q1 – Q25"],2:["🌍","General Awareness","Q26 – Q50"],3:["📐","Quantitative Aptitude","Q51 – Q75"],4:["🔤","English Language & Comprehension","Q76 – Q100"]}[sec];
out+=`<section class="section"><div class="section-title">${info[0]} ${info[1]} (${info[2]})</div>`;
}
out+=`<div class="card"><div class="qtext">Q${item.n}. ${esc(item.q)}</div><div class="options">`;
item.opts.forEach(o=>out+=`<div class="option"><strong>(${o[0]})</strong> ${esc(o[1])}</div>`);
out+=`</div><button class="show-btn" onclick="toggleAnswer(this)">Show Answer</button>
<div class="answer-box"><div class="answer">Answer: (${item.ans})</div>
<div class="explanation"><strong>Explanation:</strong> ${esc(item.explanation)}</div></div></div>`;
if([25,50,75,100].includes(item.n)) out+="</section>";
});
paper.innerHTML=out;
}

function toggleAnswer(btn){
const box=btn.nextElementSibling, show=box.style.display!=="block";
box.style.display=show?"block":"none"; btn.textContent=show?"Hide Answer":"Show Answer";
}
let allShown=false;
function toggleAll(){
allShown=!allShown;
document.querySelectorAll(".answer-box").forEach(x=>x.style.display=allShown?"block":"none");
document.querySelectorAll(".show-btn").forEach(x=>x.textContent=allShown?"Hide Answer":"Show Answer");
document.getElementById("allBtn").innerHTML=allShown?"▣ &nbsp; Hide All Answers &amp; Explanations":"▣ &nbsp; Show / Hide All Answers &amp; Explanations";
}
render();
</script>

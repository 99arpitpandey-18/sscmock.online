<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC Selection Post – 24 Jul 2025 (All 100 Questions)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f2f5f9;
            color: #1e2a3a;
            padding: 20px;
        }
        .container {
            max-width: 920px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            padding: 30px 35px 50px;
        }
        .exam-header {
            border-bottom: 3px solid #e6edf5;
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
        }
        .exam-title {
            font-size: 26px;
            font-weight: 700;
            color: #0b2b4a;
            letter-spacing: -0.3px;
        }
        .exam-title small {
            font-weight: 400;
            font-size: 16px;
            color: #5e6f8d;
            margin-left: 10px;
        }
        .exam-meta {
            font-size: 15px;
            color: #4a5b77;
            background: #eef3fa;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 500;
        }
        .question-card {
            background: #fafcff;
            border-radius: 16px;
            padding: 22px 28px;
            margin-bottom: 24px;
            border: 1px solid #e9eef4;
            transition: box-shadow 0.2s;
        }
        .question-card:hover {
            box-shadow: 0 4px 14px rgba(0, 20, 50, 0.04);
        }
        .q-number {
            display: inline-block;
            font-weight: 700;
            font-size: 17px;
            color: #1e4a7a;
            background: #e2ebf6;
            padding: 0 12px;
            border-radius: 30px;
            line-height: 30px;
            margin-bottom: 12px;
        }
        .q-text {
            font-size: 18px;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 16px;
            color: #142433;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 28px;
            margin-bottom: 18px;
        }
        @media (max-width: 550px) {
            .options {
                grid-template-columns: 1fr;
                gap: 6px;
            }
        }
        .option-item {
            font-size: 16px;
            padding: 6px 0 6px 8px;
            color: #1f3349;
            border-bottom: 1px dashed #dce4ee;
            display: flex;
            align-items: baseline;
        }
        .option-item .opt-label {
            font-weight: 600;
            color: #2f4a6e;
            margin-right: 10px;
            min-width: 20px;
        }
        .answer-section {
            margin-top: 8px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px 20px;
        }
        .btn-answer {
            background: none;
            border: none;
            color: #1a66b3;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            padding: 6px 0;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-bottom: 2px solid transparent;
        }
        .btn-answer:hover {
            color: #0b3b73;
            border-bottom-color: #1a66b3;
        }
        .btn-answer .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
            font-size: 14px;
        }
        .btn-answer.active .arrow {
            transform: rotate(180deg);
        }
        .answer-box {
            background: #eef6fb;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 500;
            color: #004080;
            display: none;
            flex: 1;
            min-width: 140px;
            border-left: 5px solid #2d7bcb;
        }
        .answer-box.open {
            display: block;
        }
        .answer-box .ans-label {
            font-weight: 700;
            color: #003366;
            margin-right: 6px;
        }
        .answer-box .explanation {
            font-weight: 400;
            color: #1f3b5c;
            font-size: 15px;
            margin-top: 4px;
            border-top: 1px solid #c8d9ec;
            padding-top: 6px;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 12px;
            padding: 10px 0;
            border-top: 2px solid #e6edf5;
            border-bottom: 2px solid #e6edf5;
        }
        .toolbar .left {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .toolbar button {
            background: #eef3fa;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            color: #1e3b5e;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toolbar button:hover {
            background: #d7e2f0;
            color: #0b2a4a;
        }
        .toolbar button.primary {
            background: #1a4d7a;
            color: white;
        }
        .toolbar button.primary:hover {
            background: #0f3a5f;
        }
        .toolbar .stats {
            font-size: 15px;
            color: #3a5678;
            font-weight: 500;
        }
        @media (max-width: 600px) {
            .container {
                padding: 18px 14px;
            }
            .exam-title {
                font-size: 20px;
            }
            .exam-title small {
                display: block;
                margin-left: 0;
                font-size: 14px;
            }
            .question-card {
                padding: 18px 16px;
            }
            .q-text {
                font-size: 17px;
            }
            .option-item {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="exam-header">
            <div class="exam-title">
                SSC Selection Post (Graduation)
                <small>24 Jul 2025 · All 100 Qs</small>
            </div>
            <div class="exam-meta">📝 Shift 3 · PYQ</div>
        </div>

        <div class="toolbar">
            <div class="left">
                <button @click="toggleAllAnswers" class="primary">
                    <span v-if="allOpen">🔽 Hide All Answers</span>
                    <span v-else>🔼 Show All Answers</span>
                </button>
                <button @click="resetAnswers">↺ Reset</button>
            </div>
            <div class="stats">
                <span>{{ answeredCount }}</span> / <span>{{ questions.length }}</span> shown
            </div>
        </div>

        <div v-for="(q, idx) in questions" :key="idx" class="question-card">
            <div class="q-number">Q{{ idx + 1 }}</div>
            <div class="q-text" v-html="q.text"></div>
            <div class="options">
                <div v-for="(opt, oi) in q.options" :key="oi" class="option-item">
                    <span class="opt-label">{{ String.fromCharCode(97 + oi) }}.</span>
                    <span v-html="opt"></span>
                </div>
            </div>
            <div class="answer-section">
                <button class="btn-answer" :class="{ active: q.showAnswer }"
                        @click="toggleAnswer(idx)">
                    <span class="arrow">▼</span>
                    <span v-if="!q.showAnswer">Show Answer</span>
                    <span v-else>Hide Answer</span>
                </button>
                <div class="answer-box" :class="{ open: q.showAnswer }">
                    <span class="ans-label">✔ Answer:</span>
                    <span v-html="q.answer"></span>
                    <div v-if="q.explanation" class="explanation" v-html="q.explanation"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
    <script>
        new Vue({
            el: '#app',
            data: {
                allOpen: false,
                questions: [
                    // ---- Q1 to Q100 from the provided text (24 Jul 2025) ----
                    {
                        text: 'यदि A = 6, B = 9, C = 12 है, तो ज्ञात कीजिए: (A × B) - C ÷ 3?',
                        options: ['50', '52', '54', '56'],
                        answer: '(a) 50',
                        explanation: '(6×9) - 12÷3 = 54 - 4 = 50'
                    }, {
                        text: 'प्रश्नवाचक चिह्न के स्थान पर क्या आएगा? <br>1, 4, 9, 16, ?, 36',
                        options: ['20', '24', '25', '30'],
                        answer: '(c) 25',
                        explanation: 'वर्ग संख्याएँ: 1², 2², 3², 4², 5², 6² → 25'
                    }, {
                        text: 'यदि EFGH → FGHJ और MNOP → NOPR है। तो STUV → ?',
                        options: ['TUVW', 'UVWX', 'TUVX', 'UVWY'],
                        answer: '(c) TUVX',
                        explanation: 'प्रत्येक अक्षर +1, +1, +1, +2 → S→T, T→U, U→V, V→X'
                    }, {
                        text: 'उस संख्या की पहचान करें जो श्रंखला को तोड़ती है: <br>3, 7, 13, 21, 29',
                        options: ['7', '13', '21', '29'],
                        answer: '(d) 29',
                        explanation: 'अंतर: 4,6,8,8 → 29 के स्थान पर 31 आना चाहिए (अंतर 10)'
                    }, {
                        text: '140 m और 160 m लंबाई वाली दो ट्रेनें क्रमशः 45 km/h और 55 km/h की गति से एक-दूसरे की ओर बढ़ रही हैं। उन्हें एक-दूसरे को पार करने में कितना समय लगेगा?',
                        options: ['9.6s', '10.8s', '12.0s', '14.4s'],
                        answer: '(b) 10.8s',
                        explanation: 'सापेक्ष गति = 45+55 = 100 km/h = 27.78 m/s, कुल दूरी = 140+160 = 300m, समय = 300/27.78 = 10.8s'
                    }, {
                        text: 'लुप्त संख्या ज्ञात कीजिए: <br>7, 14, 28, 56, ?',
                        options: ['84', '98', '112', '126'],
                        answer: '(c) 112',
                        explanation: 'प्रत्येक पद ×2 → 56×2 = 112'
                    }, {
                        text: '49 : 343 :: 64 : ?',
                        options: ['256', '384', '512', '445'],
                        answer: '(c) 512',
                        explanation: '49 = 7², 343 = 7³ → 64 = 8², 512 = 8³'
                    }, {
                        text: 'यदि कोई सहकर्मी लगातार समय सीमा (डेडलाइन) चूक जाता है, तो सबसे अच्छी कार्रवाई क्या है?',
                        options: ['मुद्दे को नजरअंदाज करें', 'तुरंत रिपोर्ट करें', 'चर्चा करें और कारण समझें', 'सहयोग करना बंद करें'],
                        answer: '(c) चर्चा करें और कारण समझें',
                        explanation: 'पहले कारण समझना और समाधान खोजना सबसे उचित है।'
                    }, {
                        text: 'विषम ज्ञात कीजिए।',
                        options: ['मेक्सिको : पेसो', 'चीन : युआन', 'तुर्की : लीरा', 'नेपाल : डॉलर'],
                        answer: '(d) नेपाल : डॉलर',
                        explanation: 'नेपाल की मुद्रा रुपया है, डॉलर नहीं।'
                    }, {
                        text: 'शब्द "RATE" के अक्षरों का उपयोग करके (प्रत्येक अक्षर का केवल एक बार उपयोग करके) कितने सार्थक शब्द बनाए जा सकते हैं?',
                        options: ['एक', 'दो', 'तीन', 'तीन से अधिक'],
                        answer: '(d) तीन से अधिक',
                        explanation: 'RATE, TEAR, TARE, RETA, EART आदि — 3 से अधिक।'
                    }, {
                        text: 'कथन: <br>1. कुछ लैपटॉप महंगे हैं। <br>2. सभी महंगी वस्तुएं बढ़िया हैं। <br><br>निष्कर्ष: <br>I. कुछ लैपटॉप बढ़िया हैं। <br>II. सभी लैपटॉप बढ़िया हैं।',
                        options: ['केवल I अनुसरण करता है', 'केवल II अनुसरण करता है', 'दोनों अनुसरण करते हैं', 'कोई भी अनुसरण नहीं करता है'],
                        answer: '(a) केवल I अनुसरण करता है',
                        explanation: 'I सही है (कुछ लैपटॉप महंगे → बढ़िया), II नहीं (सभी नहीं)'
                    }, {
                        text: 'यदि MONK को 57 के रूप में कोडित किया गया है, तो LION को कैसे कोडित किया जाएगा?',
                        options: ['52', '54', '56', '58'],
                        answer: '(b) 54',
                        explanation: 'MONK: M=13+O=15+N=14+K=11 → 13+15+14+11 = 53? वास्तव में 13+15+14+11=53, +4 = 57. LION: 12+9+15+14 = 50, +4 = 54'
                    }, {
                        text: 'कथन: "यदि उचित डिजिटल उपकरणों द्वारा समर्थित हो, तो रिमोट वर्क (दूरस्थ कार्य) कर्मचारी उत्पादकता में सुधार करता है।" <br>कौन सा विकल्प कथन को पुष्ट करता है?',
                        options: ['कर्मचारी लचीले घंटे पसंद करते हैं', 'डिजिटल उपकरण समन्वय अंतराल को कम करते हैं', 'कार्यालयों के रखरखाव की लागत अधिक है', 'कर्मचारी अधिक घंटे काम करते हैं'],
                        answer: '(b) डिजिटल उपकरण समन्वय अंतराल को कम करते हैं',
                        explanation: 'यह कथन को मजबूत करता है कि उपकरण सहायक हैं।'
                    }, {
                        text: 'यदि ÷ का अर्थ ×, + का अर्थ -, - का अर्थ ÷ और × का अर्थ + है। तो मान ज्ञात कीजिए: 48 ÷ 4 + 6 - 3 × 5?',
                        options: ['195', '191', '193', '196'],
                        answer: '(a) 195',
                        explanation: '48×4 - 6÷3 + 5 = 192 - 2 + 5 = 195'
                    }, {
                        text: 'चार संयोजन दिए गए हैं। दो बिल्कुल समान हैं। उनकी पहचान करें। <br>1. Patel Road, Near City Mall, Surat - 395003 <br>2. Patel Rd, Near City Mall, Surat - 395003 <br>3. Patel Road, Near City Mall, Surat - 395003 <br>4. Patel Road, City Mall, Surat - 395030',
                        options: ['1 और 2', '1 और 3', '2 और 4', '3 और 4'],
                        answer: '(b) 1 और 3',
                        explanation: '1 और 3 बिल्कुल समान हैं।'
                    }, {
                        text: 'एक लोकलिटी-सेंसिटिव हैशिंग सिस्टम में, समानता थ्रेशोल्ड 0.6 है और हैश फैमिली में 25 फंक्शन हैं। कितने हैश फंक्शन चुने जाने चाहिए?',
                        options: ['10', '12', '15', '18'],
                        answer: '(c) 15',
                        explanation: 'मानक गणना के अनुसार 15 फंक्शन चुने जाते हैं।'
                    }, {
                        text: 'आपको गलती से गोपनीय जानकारी प्राप्त होती है। आपको क्या करना चाहिए?',
                        options: ['सहकर्मियों के साथ साझा करें', 'इसे नजरअंदाज करें', 'संबंधित प्राधिकारी को सूचित करें', 'इसका लाभ के लिए उपयोग करें'],
                        answer: '(c) संबंधित प्राधिकारी को सूचित करें',
                        explanation: 'गोपनीय जानकारी की सूचना प्राधिकारी को देना उचित है।'
                    }, {
                        text: 'वह युग्म चुनें जो दूसरों से भिन्न है।',
                        options: ['16 - 256', '18 - 324', '14 - 196', '15 - 210'],
                        answer: '(d) 15 - 210',
                        explanation: 'अन्य में दूसरी संख्या = पहली का वर्ग है: 16²=256, 18²=324, 14²=196, लेकिन 15²=225 ≠ 210'
                    }, {
                        text: 'सौर मंडल : सूर्य :: परमाणु : ?',
                        options: ['इलेक्ट्रॉन', 'प्रोटॉन', 'न्यूट्रॉन', 'नाभिक'],
                        answer: '(d) नाभिक',
                        explanation: 'सौर मंडल का केंद्र सूर्य है, परमाणु का केंद्र नाभिक।'
                    }, {
                        text: 'अगला अक्षर ज्ञात कीजिए: <br>B, E, I, N, ?',
                        options: ['S', 'T', 'U', 'R'],
                        answer: '(b) T',
                        explanation: 'अंतर: +3, +4, +5, +6 → N+6 = T'
                    }, {
                        text: 'निम्नलिखित को सार्थक क्रम में व्यवस्थित करें: <br>1. शिक्षा <br>2. नौकरी <br>3. साक्षात्कार <br>4. आवेदन',
                        options: ['1-4-3-2', '4-3-1-2', '1-3-4-2', '4-1-3-2'],
                        answer: '(a) 1-4-3-2',
                        explanation: 'शिक्षा → आवेदन → साक्षात्कार → नौकरी'
                    }, {
                        text: 'कथन: <br>I. सभी मेट्रो ट्रेनें बिजली पर चलती हैं। <br>II. ब्लू लाइन एक मेट्रो ट्रेन है। <br><br>निम्नलिखित में से कौन सा निष्कर्ष तार्किक रूप से दिए गए कथनों का अनुसरण करता है?',
                        options: ['ब्लू लाइन बिजली पर चलती है', 'ब्लू लाइन डीजल आधारित है', 'सभी ट्रेनें इलेक्ट्रिक हैं', 'कोई निष्कर्ष अनुसरण नहीं करता है'],
                        answer: '(a) ब्लू लाइन बिजली पर चलती है',
                        explanation: 'सभी मेट्रो बिजली पर चलती हैं, ब्लू लाइन मेट्रो है → बिजली पर चलती है।'
                    }, {
                        text: 'एक महिला की ओर इशारा करते हुए, रोहन ने कहा, "वह मेरे पिता की इकलौती बेटी की बेटी है।" महिला का रोहन से क्या संबंध है?',
                        options: ['बहन', 'बेटी', 'भांजी/भतीजी', 'कज़िन'],
                        answer: '(c) भांजी/भतीजी',
                        explanation: 'पिता की इकलौती बेटी = रोहन की बहन, उसकी बेटी = रोहन की भांजी/भतीजी'
                    }, {
                        text: 'कथन: "तेज गति के कारण सड़क दुर्घटनाओं की संख्या में वृद्धि हुई।" <br><br>निष्कर्ष: <br>I. गति सीमा लागू की जानी चाहिए। <br>II. सड़कें खराब तरीके से बनाई गई हैं।',
                        options: ['केवल I अनुसरण करता है', 'केवल II अनुसरण करता है', 'दोनों अनुसरण करते हैं', 'कोई भी अनुसरण नहीं करता है'],
                        answer: '(a) केवल I अनुसरण करता है',
                        explanation: 'गति सीमा लागू करना तार्किक निष्कर्ष है, II असंबंधित है।'

                        text: 'एक बाहरी बिंदु से एक वृत्त की दो स्पर्श रेखाओं के बीच का कोण 60° है। स्पर्श जीवा द्वारा परिधि पर अंतरित कोण क्या है?',
                        options: ['30°', '60°', '90°', '120°'],
                        answer: '(b) 60°',
                        explanation: 'स्पर्श रेखाओं के बीच का कोण = 180° - केंद्र पर कोण, केंद्र पर कोण = 120°, परिधि पर अंतरित कोण = 60°'
                    }, {
                        text: 'यदि sin B cos B = 2/5 और B∈ (0, π/2) तो sin 2B क्या है?',
                        options: ['3/5', '4/5', '5/6', '6/7'],
                        answer: '(b) 4/5',
                        explanation: 'sin 2B = 2 sin B cos B = 2 × (2/5) = 4/5'
                    }, {
                        text: 'एक वृत्त की स्पर्श रेखा की लंबाई 12 cm है, और बाहरी बिंदु से वृत्त की न्यूनतम दूरी 5 cm है। वृत्त की त्रिज्या क्या है?',
                        options: ['11.9 cm', '8 cm', '9.7 cm', '10 cm'],
                        answer: '(a) 11.9 cm',
                        explanation: 'स्पर्श रेखा² = (त्रिज्या+5)² - त्रिज्या² → 144 = 10r+25 → r = 11.9'
                    }, {
                        text: 'Select the most appropriate synonym of the given word. VENERATION',
                        options: ['Disrespect', 'Reverence', 'Hatred', 'Neglect'],
                        answer: '(b) Reverence',
                        explanation: 'Veneration = श्रद्धा, Reverence = आदर'
                    }, {
                        text: 'Choose the correct meaning of the idiom: Bury the hatchet',
                        options: ['Start a fight again', 'End a quarrel and make peace', 'Hide the truth', 'Win an argument'],
                        answer: '(b) End a quarrel and make peace',
                        explanation: 'Bury the hatchet = झगड़ा खत्म करना और शांति स्थापित करना'
                    }, {
                        text: 'Select the correctly spelt word meaning "a person who praises others to gain favour."',
                        options: ['Adulator', 'Adullator', 'Addulator', 'Adulater'],
                        answer: '(a) Adulator',
                        explanation: 'Adulator = चापलूस'
                    }, {
                        text: 'Identify the misspelt word:',
                        options: ['Hagiography', 'Lexicography', 'Calligraphy', 'Pshephology'],
                        answer: '(d) Pshephology',
                        explanation: 'सही spelling: Psephology (मतदान अध्ययन)'
                    }, {
                        text: 'Which term refers to: "A storytelling method in which the narrative moves ahead to events that will occur later"?',
                        options: ['Foreshadowing', 'Prolepsis', 'Analepsis', 'Retrospection'],
                        answer: '(b) Prolepsis',
                        explanation: 'Prolepsis = पूर्वकथन, भविष्य की घटनाओं का पूर्वानुमान'
                    }, {
                        text: 'A sentence is provided in direct speech. From the four given options, choose the one that most accurately conveys the sentence in its corresponding indirect speech. <br>"Although the evidence was clear, the committee decided to disregard it," she remarked.',
                        options: ['She remarked the evidence had been clear, but committee disregarded it.', 'She remarked that although the evidence had been clear, the committee had decided to disregard it.', 'She remarked although evidence was clear, committee disregarded them.', 'She remarked that although evidence was clear, the committee decided to disregard it.'],
                        answer: '(b) She remarked that although the evidence had been clear, the committee had decided to disregard it.',
                        explanation: 'सही indirect speech: remarked that + past perfect'
                    }, {
                        text: 'A sentence is provided in indirect speech. From the four given options, choose the one that most accurately conveys the sentence in its corresponding direct speech. <br>The instructor warned the trainees that if they did not submit the form by evening, they would not be allowed to attend the workshop.',
                        options: ['"You will not be allowed to attend the workshop if you don\'t submit the form by evening," the instructor warned them.', '"If you haven\'t submitted the form by evening, you won\'t be allowed to attend the workshop," the instructor warned.', '"Submit the form by evening or you will not be allowed to attend the workshop," said the instructor.', '"If you fail to submit the form by evening, you won\'t be allowed to attend the workshop," said the instructor.'],
                        answer: '(d) "If you fail to submit the form by evening, you won\'t be allowed to attend the workshop," said the instructor.',
                        explanation: 'सबसे सटीक प्रत्यक्ष कथन।'
                    }, {
                        text: 'Rearrange the following sentences in correct order to make a meaningful sentence. <br>P: is strongly required <br>Q: to curb the exploitation of personal information <br>R: a robust mechanism <br>S: for data protection rules',
                        options: ['PRSQ', 'SQPR', 'RPQS', 'QSRP'],
                        answer: '(c) RPQS',
                        explanation: 'R P Q S: a robust mechanism is strongly required to curb the exploitation of personal information for data protection rules.'
                    }, {
                        text: 'Convert the sentence provided below from its passive voice structure to an active voice structure: <br>The safety checks had been ignored by the contractors before the inspection.',
                        options: ['The contractors have ignored the safety checks before the inspection.', 'The contractors ignore the safety checks before the inspection.', 'The contractors were ignoring the safety checks before the inspection.', 'The contractors had ignored the safety checks before the inspection.'],
                        answer: '(d) The contractors had ignored the safety checks before the inspection.',
                        explanation: 'had been ignored → had ignored (past perfect active)'
                    }, {
                        text: 'Select the most appropriate antonym of the given word. Resolute',
                        options: ['Determined', 'Stubborn', 'Hesitant', 'Steadfast'],
                        answer: '(c) Hesitant',
                        explanation: 'Resolute = दृढ़, Hesitant = झिझक भरा'
                    }, {
                        text: 'Change the following from active to passive: <br>The review board will be assessing the effectiveness of the policy throughout the next semester.',
                        options: ['The effectiveness of the policy will be being assessed by the review board throughout the next semester.', 'The policy\'s effectiveness was assessed by the board throughout the next semester.', 'The effectiveness of the policy will have been assessed by the board throughout the next semester.', 'The review board would be assessing the effectiveness throughout the next semester.'],
                        answer: '(a) The effectiveness of the policy will be being assessed by the review board throughout the next semester.',
                        explanation: 'will be assessing → will be being assessed (future continuous passive)'
                    }, {
                        text: 'Identify the correct passive voice form of the following sentence: <br>"Habits exert a strong influence on our actions."',
                        options: ['Our actions are strongly influenced by habits.', 'A strong influence is exerted on our actions by habits.', 'Our actions have been strongly influenced by habits.', 'Habits strongly influence our actions.'],
                        answer: '(a) Our actions are strongly influenced by habits.',
                        explanation: 'सही passive voice: Our actions are strongly influenced by habits.'
                    }, {
                        text: 'Choose the correct indirect speech conversion of the sentence. <br>"Researchers say, \'Habits form because the brain continually seeks ways to reduce effort.\'"',
                        options: ['Researchers say that habits form because the brain continually seeks ways to reduce effort.', 'Researchers said that habits formed because the brain continually sought ways to reduce effort.', 'Researchers say habits had formed because the brain continually sought ways to reduce effort.', 'Researchers have said that habits form as the brain continually sought ways to reduce effort.'],
                        answer: '(a) Researchers say that habits form because the brain continually seeks ways to reduce effort.',
                        explanation: 'say + that + present tense (universal truth)'
                    }, {
                        text: 'What is the meaning of the word "develop" in the sentence? <br>"Researchers note that habits develop because the brain is always searching for shortcuts to reduce effort."',
                        options: ['To fade away slowly', 'To come into being gradually', 'To stay fixed forever', 'To move in reverse'],
                        answer: '(b) To come into being gradually',
                        explanation: 'develop = धीरे-धीरे अस्तित्व में आना'
                    }, {
                        text: 'Choose the best synonym for the word "signal" as used in the passage: <br>"The cue is the signal that pushes the brain into autopilot."',
                        options: ['Restriction', 'Trigger', 'Interruption', 'Ending'],
                        answer: '(b) Trigger',
                        explanation: 'signal = संकेत, trigger = ट्रिगर / उत्प्रेरक'
                    }, {
                        text: 'According to the passage, why does the brain convert repeated actions into habits?',
                        options: ['Because habits save mental energy and support survival advantages.', 'Because habits make the brain physically larger.', 'Because habits stop the brain from working automatically.', 'Because habits remove the need to ever learn again.'],
                        answer: '(a) Because habits save mental energy and support survival advantages.',
                        explanation: 'आदतें मानसिक ऊर्जा बचाती हैं और उत्तरजीविता में सहायक हैं।'
                    }, {
                        text: 'Improve the sentence by choosing the correct tense form of the highlighted verb. <br>Sakshi live in this town for five years before she shifted to another state.',
                        options: ['lives', 'lived', 'had lived', 'have lived'],
                        answer: '(c) had lived',
                        explanation: 'Past perfect (had lived) for action completed before another past action.'
                    }, {
                        text: 'Find the part of the sentence that contains an error: <br>The supervisor demanded that (1)/ each participant submits (2)/ the report before (3)/ the meeting ended. (4)',
                        options: ['(1)', '(2)', '(3)', '(4)'],
                        answer: '(b) (2)',
                        explanation: 'demanded that + subjunctive: submit (not submits)'
                    }, {
                        text: 'Which of the following words is incorrectly spelled?',
                        options: ['Disambeguate', 'Equilibrium', 'Equivocal', 'Advertently'],
                        answer: '(a) Disambeguate',
                        explanation: 'सही spelling: Disambiguate (स्पष्ट करना)'
                    }, {
                        text: 'Convert the sentence provided below from its passive voice structure to an active voice structure: <br>The manuscript is being examined by the editor.',
                        options: ['The editor was examining the manuscript.', 'The editor has examined the manuscript.', 'The editor is examining the manuscript.', 'The editor examines the manuscript.'],
                        answer: '(c) The editor is examining the manuscript.',
                        explanation: 'is being examined → is examining (present continuous active)'
                    }, {
                        text: 'Find the part of the sentence that contains an error: <br>Hardly had the meeting (1)/ started when the manager (2)/ announce the new policy (3)/ to everyone present. (4)',
                        options: ['(1)', '(2)', '(3)', '(4)'],
                        answer: '(c) (3)',
                        explanation: 'announce → announced (past tense)'
                    }, {
                        text: 'Fill in the blank with the most appropriate option: <br>Out of all the proposals reviewed, his plan offered the ___ solution with clear reasoning and strong support.',
                        options: ['most convincing', 'more convincing', 'much convincing', 'most convinced'],
                        answer: '(a) most convincing',
                        explanation: 'superlative degree: most convincing'
                    }, {
                        text: 'Which of the following terms describes: "An inability to identify or describe one\'s emotions clearly"?',
                        options: ['Melancholia', 'Alexithymia', 'Catharsis', 'Mania'],
                        answer: '(b) Alexithymia',
                        explanation: 'Alexithymia = भावनाओं को पहचानने/व्यक्त करने में असमर्थता'
                    }, {
                        text: 'Rearrange the following sentences in correct order to make a meaningful passage. <br>1. Public complaints are logged through the central grievance system. <br>2. Submitted cases are labelled according to category and urgency. <br>3. Detailed assessments are forwarded to independent review teams. <br>4. Practical summaries are drafted for senior decision-makers.',
                        options: ['1-2-3-4', '1-2-4-3', '3-1-2-4', '4-3-2-1'],
                        answer: '(a) 1-2-3-4',
                        explanation: 'तार्किक क्रम: 1→2→3→4'
                    }, {
                        text: 'Rearrange the following sentences in correct order to make a meaningful passage. <br>1. The initial figures were gathered from departmental records. <br>2. Tables were prepared to present the findings clearly. <br>3. The information was then checked for errors and gaps. <br>4. A concluding report was forwarded to the authority.',
                        options: ['4-3-2-1', '1-3-2-4', '4-1-2-3', '3-1-4-2'],
                        answer: '(b) 1-3-2-4',
                        explanation: 'तार्किक क्रम: 1→3→2→4'
                    }
                ]
            },
            computed: {
                answeredCount() {
                    return this.questions.filter(q => q.showAnswer).length;
                }
            },
            methods: {
                toggleAnswer(idx) {
                    this.questions[idx].showAnswer = !this.questions[idx].showAnswer;
                    this.allOpen = this.questions.every(q => q.showAnswer === true);
                },
                toggleAllAnswers() {
                    const newState = !this.allOpen;
                    this.questions.forEach(q => q.showAnswer = newState);
                    this.allOpen = newState;
                },
                resetAnswers() {
                    this.questions.forEach(q => q.showAnswer = false);
                    this.allOpen = false;
                }
            }
        });
    </script>

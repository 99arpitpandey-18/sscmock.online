        .paper-header .sub {

            opacity: 0.85;
            font-size: 1rem;
            margin-top: 4px;
            position: relative;
            z-index: 1;
        }
        .paper-header .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 28px;
            margin-top: 14px;

        }

            background: #f6c445;

            padding: 3px 14px;
            border-radius: 40px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            margin-left: 8px;
        }

            background: #f0f4fa;
            padding: 0 8px;
            border-radius: 5px;
            font-weight: 600;
        }

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px 24px;
            margin-bottom: 12px;
        }

                grid-template-columns: 1fr;
            }
        }

            align-items: baseline;
            gap: 8px;

            padding: 4px 4px;
            border-radius: 6px;
            cursor: default;
        }

            color: #4a5f7a;

        }

            color: #1e2a3a;

            margin-top: 2px;

            transform: scale(0.97);
        }

            display: inline-block;
            transition: transform 0.25s;
            font-size: 0.7rem;
        }
        .show-btn.active .arrow {
            transform: rotate(90deg);
        }

            background: #eaf3e8;
            border-left: 5px solid #2a7a4a;

            display: block;
        }

                transform: translateY(-6px);
            }
            100% {

            font-size: 0.93rem;
            color: #1f3d2a;
            line-height: 1.7;
        }

        }

            text-align: center;
            color: #6a7f99;
            font-size: 0.83rem;
            margin-top: 40px;
            padding: 18px 0 8px;

            top: 0;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;

            font-size: 0.85rem;
            font-weight: 500;
            color: #1a3f6a;
        }
        .progress-wrap .info span {
            font-weight: 700;
        }

            background: #1a3f6a;
            color: #fff;

            padding: 5px 18px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .progress-wrap .toggle-all:hover {
            background: #0f2d4a;
        }

                font-size: 0.95rem;
            }
            .answer-box {
                padding: 12px 14px;
            }
            .paper-header .meta {
                flex-direction: column;
                gap: 4px;
            }
            .progress-wrap {
                flex-direction: column;
                gap: 8px;
                align-items: stretch;
                text-align: center;
            }
        }
    </style>
</head>

        // ============================================================
        //  RENDER
        // ============================================================

        const container = document.getElementById('questionsContainer');
        const toggleBtn = document.getElementById('toggleAllBtn');
        let allOpen = false;

        function renderQuestions() {
            let html = '';
            questionsData.forEach((q) => {
                const labels = ['a', 'b', 'c', 'd'];
                let optHtml = '';
                q.options.forEach((opt, oi) => {
                    optHtml += `
                        <div class="opt">
                            <span class="label">(${labels[oi]})</span>
                            <span class="text">${opt}</span>
                        </div>
                    `;
                });
                html += `
                    <div class="q-card" id="q${q.id}">
                        <div class="q-number">Q${q.id}</div>
                        <div class="q-text">${q.text}</div>
                        <div class="options">${optHtml}</div>
                        <button class="show-btn" data-target="ans${q.id}">
                            ▶ <span class="arrow">▶</span> Show Answer
                        </button>
                        <div class="answer-box" id="ans${q.id}">
                            <div class="ans">✔ Answer: <span class="opt-label">(${labels[q.answer]}) ${q.options[q.answer]}</span></div>
                            <div class="explanation"><strong>Explanation:</strong> ${q.explanation}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('qCount').textContent = questionsData.length;

            document.querySelectorAll('.show-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    const box = document.getElementById(targetId);
                    if (!box) return;
                    const isOpen = box.classList.contains('open');
                    if (isOpen) {
                        box.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '▶ <span class="arrow">▶</span> Show Answer';
                    } else {
                        box.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '▼ <span class="arrow">▼</span> Hide Answer';
                    }
                });
            });
        }

        renderQuestions();

        toggleBtn.addEventListener('click', function() {
            allOpen = !allOpen;
            const boxes = document.querySelectorAll('.answer-box');
            const btns = document.querySelectorAll('.show-btn');
            if (allOpen) {
                boxes.forEach(b => b.classList.add('open'));
                btns.forEach(b => {
                    b.classList.add('active');
                    b.innerHTML = '▼ <span class="arrow">▼</span> Hide Answer';
                });
                this.textContent = '▼ Collapse All Answers';
            } else {
                boxes.forEach(b => b.classList.remove('open'));
                btns.forEach(b => {
                    b.classList.remove('active');
                    b.innerHTML = '▶ <span class="arrow">▶</span> Show Answer';
                });
                this.textContent = '▶ Expand All Answers';
            }
        });

        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.show-btn');
            if (!btn) return;
            setTimeout(() => {
                const allBoxes = document.querySelectorAll('.answer-box');
                const openBoxes = document.querySelectorAll('.answer-box.open');
                if (openBoxes.length === allBoxes.length && allBoxes.length > 0) {
                    toggleBtn.textContent = '▼ Collapse All Answers';
                    allOpen = true;
                } else if (openBoxes.length === 0) {
                    toggleBtn.textContent = '▶ Expand All Answers';
                    allOpen = false;
                } else {
                    toggleBtn.textContent = '▶ Expand All Answers';
                    allOpen = false;
                }
            }, 50);
        });
    </script>

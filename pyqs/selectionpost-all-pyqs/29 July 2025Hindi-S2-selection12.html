<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSC Selection Post (Higher Secondary) · Full Paper</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', 'Noto Sans', Roboto, system-ui, sans-serif;
            background: #f0f4f9;
            padding: 24px 16px;
            color: #1a2634;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        /* HEADER */
        .paper-header {
            background: linear-gradient(145deg, #0a2647, #1a3f6a);
            color: #fff;
            padding: 28px 32px 22px;
            border-radius: 20px;
            margin-bottom: 34px;
            box-shadow: 0 10px 35px rgba(8, 30, 56, 0.30);
            position: relative;
            overflow: hidden;
        }
        .paper-header::after {
            content: '';
            position: absolute;
            top: -60%;
            right: -10%;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.035);
            border-radius: 50%;
            pointer-events: none;
        }
        .paper-header h1 {
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: -0.3px;
            position: relative;
            z-index: 1;
            line-height: 1.2;
        }
        .paper-header .sub {
            font-weight: 300;
            opacity: 0.85;
            font-size: 1rem;
            margin-top: 4px;
            position: relative;
            z-index: 1;
        }
        .paper-header .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 28px;
            margin-top: 14px;
            font-size: 0.88rem;
            background: rgba(255, 255, 255, 0.07);
            padding: 10px 18px;
            border-radius: 12px;
            position: relative;
            z-index: 1;
        }
        .paper-header .meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .badge {
            display: inline-block;
            background: #f6c445;
            color: #0a2647;
            font-weight: 700;
            font-size: 0.7rem;
            padding: 3px 14px;
            border-radius: 40px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            margin-left: 8px;
        }

        /* QUESTION CARD */
        .q-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px 24px 16px;
            margin-bottom: 18px;
            box-shadow: 0 3px 14px rgba(0, 18, 38, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.025);
            transition: box-shadow 0.2s;
        }
        .q-card:hover {
            box-shadow: 0 6px 24px rgba(0, 18, 38, 0.09);
        }
        .q-number {
            display: inline-block;
            font-weight: 700;
            font-size: 0.8rem;
            color: #1a3f6a;
            background: #e7eef9;
            padding: 2px 16px;
            border-radius: 30px;
            letter-spacing: 0.2px;
            margin-bottom: 10px;
        }
        .q-text {
            font-size: 1.02rem;
            font-weight: 500;
            line-height: 1.7;
            margin-bottom: 14px;
        }
        .q-text .highlight {
            color: #0a2647;
            font-weight: 600;
        }
        .q-text .code {
            font-family: 'Courier New', monospace;
            background: #f0f4fa;
            padding: 0 8px;
            border-radius: 5px;
            font-weight: 600;
        }

        /* OPTIONS */
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px 24px;
            margin-bottom: 12px;
        }
        @media (max-width: 540px) {
            .options {
                grid-template-columns: 1fr;
            }
        }
        .opt {
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-size: 0.95rem;
            padding: 4px 4px;
            border-radius: 6px;
            cursor: default;
        }
        .opt .label {
            font-weight: 600;
            color: #4a5f7a;
            min-width: 22px;
        }
        .opt .text {
            color: #1e2a3a;
        }

        /* SHOW BUTTON */
        .show-btn {
            background: #eef3fa;
            border: none;
            padding: 6px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.82rem;
            color: #1a3f6a;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
            letter-spacing: 0.2px;
        }
        .show-btn:hover {
            background: #d4e0f0;
            transform: translateY(-1px);
        }
        .show-btn:active {
            transform: scale(0.97);
        }
        .show-btn .arrow {
            display: inline-block;
            transition: transform 0.25s;
            font-size: 0.7rem;
        }
        .show-btn.active .arrow {
            transform: rotate(90deg);
        }

        /* ANSWER BOX */
        .answer-box {
            margin-top: 12px;
            padding: 14px 20px 16px;
            border-radius: 14px;
            background: #eaf3e8;
            border-left: 5px solid #2a7a4a;
            display: none;
            animation: fadeSlide 0.3s ease;
        }
        .answer-box.open {
            display: block;
        }
        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(-6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .answer-box .ans {
            font-weight: 700;
            font-size: 0.98rem;
            color: #165a2e;
        }
        .answer-box .ans .opt-label {
            background: #2a7a4a;
            color: #fff;
            padding: 0 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            margin-left: 6px;
            display: inline-block;
        }
        .answer-box .explanation {
            margin-top: 8px;
            font-size: 0.93rem;
            color: #1f3d2a;
            line-height: 1.7;
        }
        .answer-box .explanation strong {
            color: #0f3d1f;
        }

        /* FOOTER */
        .footer-note {
            text-align: center;
            color: #6a7f99;
            font-size: 0.83rem;
            margin-top: 40px;
            padding: 18px 0 8px;
            border-top: 1px solid #dce4ed;
        }

        /* PROGRESS */
        .progress-wrap {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }
        .progress-wrap .info {
            font-size: 0.85rem;
            font-weight: 500;
            color: #1a3f6a;
        }
        .progress-wrap .info span {
            font-weight: 700;
        }
        .progress-wrap .toggle-all {
            background: #1a3f6a;
            color: #fff;
            border: none;
            padding: 5px 18px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .progress-wrap .toggle-all:hover {
            background: #0f2d4a;
        }

        @media (max-width: 640px) {
            .paper-header {
                padding: 18px 16px 16px;
            }
            .paper-header h1 {
                font-size: 1.25rem;
            }
            .q-card {
                padding: 14px 14px 12px;
            }
            .q-text {
                font-size: 0.95rem;
            }
            .answer-box {
                padding: 12px 14px;
            }
            .paper-header .meta {
                flex-direction: column;
                gap: 4px;
            }
            .progress-wrap {
                flex-direction: column;
                gap: 8px;
                align-items: stretch;
                text-align: center;
            }
        }
    </style>
</head>

        // ──────────────────────────────────────────────────────────────
        //  RENDER
        // ──────────────────────────────────────────────────────────────

        const container = document.getElementById('questionsContainer');
        const toggleBtn = document.getElementById('toggleAllBtn');
        let allOpen = false;

        function renderQuestions() {
            let html = '';
            questionsData.forEach((q, idx) => {
                const labels = ['a', 'b', 'c', 'd'];
                let optHtml = '';
                q.options.forEach((opt, oi) => {
                    optHtml += `
                        <div class="opt">
                            <span class="label">(${labels[oi]})</span>
                            <span class="text">${opt}</span>
                        </div>
                    `;
                });
                html += `
                    <div class="q-card" id="q${q.id}">
                        <div class="q-number">Q${q.id}</div>
                        <div class="q-text">${q.text}</div>
                        <div class="options">${optHtml}</div>
                        <button class="show-btn" data-target="ans${q.id}">
                            ▶ <span class="arrow">▶</span> Show Answer
                        </button>
                        <div class="answer-box" id="ans${q.id}">
                            <div class="ans">✔ Answer: <span class="opt-label">(${labels[q.answer]}) ${q.options[q.answer]}</span></div>
                            <div class="explanation"><strong>Explanation:</strong> ${q.explanation}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('qCount').textContent = questionsData.length;

            // attach toggle events
            document.querySelectorAll('.show-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    const box = document.getElementById(targetId);
                    if (!box) return;
                    const isOpen = box.classList.contains('open');
                    if (isOpen) {
                        box.classList.remove('open');
                        this.classList.remove('active');
                        this.innerHTML = '▶ <span class="arrow">▶</span> Show Answer';
                    } else {
                        box.classList.add('open');
                        this.classList.add('active');
                        this.innerHTML = '▼ <span class="arrow">▼</span> Hide Answer';
                    }
                });
            });
        }

        renderQuestions();

        // Toggle All
        toggleBtn.addEventListener('click', function() {
            allOpen = !allOpen;
            const boxes = document.querySelectorAll('.answer-box');
            const btns = document.querySelectorAll('.show-btn');
            if (allOpen) {
                boxes.forEach(b => b.classList.add('open'));
                btns.forEach(b => {
                    b.classList.add('active');
                    b.innerHTML = '▼ <span class="arrow">▼</span> Hide Answer';
                });
                this.textContent = '▼ Collapse All Answers';
            } else {
                boxes.forEach(b => b.classList.remove('open'));
                btns.forEach(b => {
                    b.classList.remove('active');
                    b.innerHTML = '▶ <span class="arrow">▶</span> Show Answer';
                });
                this.textContent = '▶ Expand All Answers';
            }
        });

        // update toggle all text if any answer is open
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.show-btn');
            if (!btn) return;
            setTimeout(() => {
                const allBoxes = document.querySelectorAll('.answer-box');
                const openBoxes = document.querySelectorAll('.answer-box.open');
                if (openBoxes.length === allBoxes.length && allBoxes.length > 0) {
                    toggleBtn.textContent = '▼ Collapse All Answers';
                    allOpen = true;
                } else if (openBoxes.length === 0) {
                    toggleBtn.textContent = '▶ Expand All Answers';
                    allOpen = false;
                } else {
                    toggleBtn.textContent = '▶ Expand All Answers';
                    allOpen = false;
                }
            }, 50);
        });
    </script>

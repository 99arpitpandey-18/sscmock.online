/* =========================================================
   RENDER QUESTIONS
   ========================================================= */

const questionContainer = document.getElementById("questions");

questions.forEach((item, index) => {

    const card = document.createElement("div");
    card.className = "question-card";

    const qNumber = index + 1;

    let optionsHTML = "";

    if (item.options && item.options.length > 0) {
        optionsHTML = `
            <div class="options">
                ${item.options.map(opt =>
                    `<span class="option">${escapeHTML(opt)}</span>`
                ).join("")}
            </div>
        `;
    }

    const expHTML = item.exp
        ? `<div class="exp-line"><strong>व्याख्या:</strong> ${escapeHTML(item.exp)}</div>`
        : ``;

    card.innerHTML = `
        <div class="question">
            Q${qNumber}. ${escapeHTML(item.q)}
        </div>

        ${optionsHTML}

        <button class="answer-btn" onclick="toggleAnswer(this)">
            उत्तर दिखाएँ
        </button>

        <div class="answer-box">
            <div class="ans-line">✅ ${escapeHTML(item.answer)}</div>
            ${expHTML}
        </div>
    `;

    questionContainer.appendChild(card);
});


/* =========================================================
   SHOW / HIDE INDIVIDUAL ANSWER
   ========================================================= */

function toggleAnswer(button) {

    const answerBox = button.nextElementSibling;

    answerBox.classList.toggle("show");

    if (answerBox.classList.contains("show")) {
        button.textContent = "उत्तर छुपाएँ";
    } else {
        button.textContent = "उत्तर दिखाएँ";
    }
}


/* =========================================================
   SHOW / HIDE ALL
   ========================================================= */

let allVisible = false;

function toggleAll() {

    allVisible = !allVisible;

    const boxes = document.querySelectorAll(".answer-box");
    const buttons = document.querySelectorAll(".answer-btn");

    boxes.forEach(box => {
        box.classList.toggle("show", allVisible);
    });

    buttons.forEach(button => {
        button.textContent = allVisible
            ? "उत्तर छुपाएँ"
            : "उत्तर दिखाएँ";
    });

    document.querySelector(".all-btn").innerHTML =
        allVisible
        ? "☰ सभी उत्तर छुपाएँ"
        : "☰ सभी उत्तर दिखाएँ";
}


/* =========================================================
   SAFE HTML DISPLAY
   ========================================================= */

function escapeHTML(text) {

    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

</script>

a:`(c) मध्यमंडल – उल्कापात`,
e:`क्षोभमंडल मौसम, समतापमंडल ओजोन और तापमंडल में ऑरोरा जैसी घटनाओं से संबंधित है। दिए गए मिलान में (c) गलत है।`
},

{

(b) 1

},

{
q:`Q52. यदि sin α = 4/5 और α ∈ (0, π/2) है, तो (1 − cot α)/(1 + cot α) = ?`,

},

q:`Q53. यदि tan θ + cot θ = 2 और θ ∈ (0, π/2) है, तो sec θ + cosec θ = ?`,

{
q:`Q54. एक पेड़ 30 मीटर लंबा है। जब सूर्य का उन्नयन कोण 30° होता है, तो पेड़ द्वारा बनाई गई छाया की लंबाई क्या है?`,

(c) 30√3
(d) 30 m`,

{
q:`Q55. एक रेफ्रिजरेटर की कीमत ₹45,000 है। एक ग्राहक को इस पर ₹5,000 की छूट मिलती है। छूट के बाद, ग्राहक 15% की छूट पर ₹2,000 का वोल्टेज स्टेबलाइज़र खरीदता है। ग्राहक दोनों वस्तुओं पर कुल कितनी राशि खर्च करता है?`,
o:`(a) ₹42,000
(b) ₹41,500
(c) ₹42,700
(d) ₹41,700`,
a:`(d) ₹41,700`,
e:`रेफ्रिजरेटर की कीमत = 45,000 − 5,000 = ₹40,000।
स्टेबलाइज़र पर 15% छूट = ₹300, इसलिए कीमत = ₹1,700।
कुल = 40,000 + 1,700 = ₹41,700।`
},

{
q:`Q56. दो नल A और B एक टैंक को क्रमशः 10 और 15 मिनट में भर सकते हैं। दोनों को एक साथ 3 मिनट के लिए खोलने के बाद, नल A की दर एक-तिहाई हो जाती है, और नल B अपनी मूल दर का 2.5 गुना हो जाता है। टैंक कितने और मिनटों में भर जाएगा?`,
o:`(a) 2 मिनट 15 सेकंड
(b) 3 मिनट 10 सेकंड
(c) 2 मिनट 30 सेकंड
(d) 1 मिनट 45 सेकंड`,
a:`(c) 2 मिनट 30 सेकंड`,
e:`पहले 3 मिनट में संयुक्त दर = 1/10 + 1/15 = 1/6, इसलिए 3/6 = 1/2 टैंक भरता है।
शेष 1/2 के लिए नई दर: A = 1/30 और B = 1/15 × 2.5 = 1/6।
संयुक्त दर = 1/30 + 1/6 = 1/5।
समय = (1/2) ÷ (1/5) = 2.5 मिनट = 2 मिनट 30 सेकंड।`
},

{
q:`Q57. △ABC में, AD, BC का लंब समद्विभाजक है। क्या त्रिभुज ABD और ACD सर्वांगसम हैं? यदि हाँ, तो किस नियम से?`,

(c) हाँ, SAS द्वारा
(d) नहीं, वे सर्वांगसम नहीं हैं`,
a:`(c) हाँ, SAS द्वारा`,

{
q:`Q58. एक शंक्वाकार बर्तन को उसके शीर्ष से उसकी ऊंचाई के एक-चौथाई हिस्से पर, उसके आधार के समानांतर काटा जाता है। शीर्ष भाग के आयतन का निचले छिन्नक भाग के आयतन से अनुपात क्या है?`,

(d) 1:27`,

{
q:`Q60. स्नेहा ने 4 अप्रैल 2024 को विकास को 5% प्रति वर्ष की साधारण ब्याज पर ₹24,000 उधार दिए। विकास ने 16 जून 2024 को पूरी राशि वापस करने की योजना बनाई है। विकास को कुल कितनी राशि लौटानी होगी?`,

q:`Q62. यदि P, Q, और R तीन राशियाँ इस प्रकार हैं कि Q, P पर साधारण ब्याज है, और R, Q पर साधारण ब्याज है, सभी समान समय और समान ब्याज दर के लिए हैं, तो निम्नलिखित में से कौन सा सत्य है?`,
o:`(a) Q² = PR
(b) P² = QR

q:`Q64. एक समकोण त्रिभुज, जिसकी भुजाओं (लंब और आधार) की लंबाई 10 और 24 है, में एक वृत्त अंतर्निहित है। वृत्त की त्रिज्या क्या है?`,

{
q:`Q73. एक वृत्त के त्रिज्यखंड का केंद्रीय कोण 60° और त्रिज्या 12 cm है। उसी वृत्त के एक अन्य त्रिज्यखंड का केंद्रीय कोण π/2 रेडियन है। पहले त्रिज्यखंड के क्षेत्रफल का दूसरे त्रिज्यखंड के क्षेत्रफल से अनुपात क्या है?`,

{
q:`Q82. What central idea does the passage emphasize about authority and legitimacy?`,
passage:`The relationship between authority and legitimacy is neither automatic nor absolute. Though frequently treated as interchangeable in political discourse, they operate within distinct philosophical frameworks. Authority refers to the recognized right to exercise power, often codified through constitutional or institutional mechanisms, whereas legitimacy is rooted in public consent and ethical justification. The tension between authority and legitimacy constitutes a persistent concern in political theory and civic governance. Institutions derive authority from legal mandates, electoral processes, or historical precedent, thereby ensuring procedural continuity and administrative order. However, legitimacy is contingent upon societal trust and normative approval, which may fluctuate over time. Regimes that maintain authority without sustaining legitimacy often encounter dissent, civil unrest, or moral criticism. Historical examples include governments that enacted discriminatory policies under lawful authority yet faced widespread resistance for violating ethical norms. Conversely, reform movements—though initially lacking formal authority—may acquire legitimacy through collective endorsement and moral persuasion. This distinction reveals that authority does not invariably command legitimacy, and legitimacy can at times challenge established authority. Nevertheless, conflating the two concepts can undermine democratic balance. In pluralistic societies, diverse constituencies interpret legitimacy through varying cultural, ideological, and historical lenses. If authority were to enforce a singular conception of legitimacy, it might suppress dissent and erode institutional neutrality. Contemporary debates surrounding surveillance, digital governance, and environmental regulation further illuminate this dynamic. Legal authorization may permit certain actions, yet public legitimacy may question their ethical ramifications. Therefore, a resilient political system must harmonize institutional authority with evolving standards of legitimacy, while citizens remain vigilant participants in shaping both.`,
o:`(a) Authority always guarantees legitimacy
(b) They are distinct and not always aligned
(c) Legitimacy is legally enforced
(d) Authority replaces ethical standards`,
a:`(b) They are distinct and not always aligned`,
e:`Passage स्पष्ट करता है कि authority और legitimacy अलग अवधारणाएँ हैं और दोनों हमेशा एक-दूसरे के अनुरूप नहीं होतीं।`
},

const container = document.getElementById("questions");

questions.forEach((item, index) => {

    const card = document.createElement("div");
    card.className = "question-card";

    let html = `
        <div class="question">${item.q}</div>
    `;

    if (item.passage) {
        html += `
            <div class="passage">${item.passage}</div>
        `;
    }

    html += `
        <div class="options">${item.o}</div>

        <button class="show-btn" onclick="showAnswer(this)">
            Show Answer
        </button>

        <div class="answer-box">
            <div class="answer">
                Answer: ${item.a}
            </div>

            <div class="explanation">
                <strong>Explanation:</strong> ${item.e}
            </div>
        </div>
    `;

    card.innerHTML = html;
    container.appendChild(card);
});


function showAnswer(button) {

    const answerBox = button.nextElementSibling;

    if (answerBox.style.display === "block") {
        answerBox.style.display = "none";
        button.innerText = "Show Answer";
    } else {
        answerBox.style.display = "block";
        button.innerText = "Hide Answer";
    }
}


function toggleAll() {

    const boxes = document.querySelectorAll(".answer-box");
    const buttons = document.querySelectorAll(".show-btn");

    let showAll = false;

    boxes.forEach(box => {
        if (box.style.display !== "block") {
            showAll = true;
        }
    });

    boxes.forEach((box, index) => {

        if (showAll) {
            box.style.display = "block";
            buttons[index].innerText = "Hide Answer";
        } else {
            box.style.display = "none";
            buttons[index].innerText = "Show Answer";
        }

    });
}

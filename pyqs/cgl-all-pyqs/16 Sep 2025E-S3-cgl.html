const sections = [[1, 25, "🔍", "General Intelligence & Reasoning"], [26, 50, "🌐", "General Awareness"], [51, 75, "➗", "Quantitative Aptitude"], [76, 100, "📚", "English Comprehension"]];

function esc(s){
return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function render(){
const root=document.getElementById('paper'); let out='';
sections.forEach(([start,end,icon,title])=>{
out += `<h2 class="section-title">${icon} ${title} (Q${start} – Q${end})</h2>`;
questions.filter(x=>x.n>=start&&x.n<=end).forEach(x=>{
const missing=x.n===60?' missing':'';
out += `<article class="question${missing}" data-search="${esc((x.q+' '+x.opts.join(' ')).toLowerCase())}">
<div class="qtext"><span class="qno">Q${x.n}.</span> ${esc(x.q)}</div>`;
if(x.passage) out += `<div class="passage"><b>Passage:</b><br>${esc(x.passage)}</div>`;
out += `<div class="options">`;
x.opts.forEach((o,i)=>{out += `<div class="option">(${String.fromCharCode(65+i)}) ${esc(o)}</div>`;});
out += `</div><button class="answer-btn" onclick="toggleAnswer(${x.n})">Show Answer</button>
<div class="answer-box" id="ans-${x.n}"><div class="correct">Correct Answer: (${x.ans})</div>
<div class="explanation"><b>Explanation:</b> ${esc(x.exp)}</div></div></article>`;
});
});
root.innerHTML=out;
}
function toggleAnswer(n){
const box=document.getElementById('ans-'+n); box.classList.toggle('show'); updateProgress();
}
function toggleAll(){
const boxes=document.querySelectorAll('.answer-box');
const shouldShow=[...boxes].some(b=>!b.classList.contains('show'));
boxes.forEach(b=>b.classList.toggle('show',shouldShow));
document.querySelectorAll('.answer-btn').forEach(b=>b.textContent=shouldShow?'Hide Answer':'Show Answer');
updateProgress();
}
function updateProgress(){
document.getElementById('progress').textContent=`${document.querySelectorAll('.answer-box.show').length} / ${questions.length} answers shown`;
}
function filterQuestions(){
const term=document.getElementById('search').value.toLowerCase().trim();
document.querySelectorAll('.question').forEach(card=>card.style.display=card.dataset.search.includes(term)?'block':'none');
}
function languageNote(){
const v=document.getElementById('lang').value;
document.getElementById('langNote').textContent=v==='Hindi'?'(Hindi translation is not included in the supplied source)':'(Paper content supplied in English)';
}
render();
</script>

q:`A man standing on the top of a 150 m high tower observes the angles of depression of two cars on opposite sides of the tower to be 30° and 60°. What is the distance between the two cars?`,
o:[`200√3 m`,`150√3 m`,`100√3 m`,`300 m`],
a:`(a) 200√3 m`,
e:`For the first car, distance = 150/tan30° = 150√3 m. For the second, distance = 150/tan60° = 50√3 m. Total distance = 200√3 m.`
},

{
q:`A vertical pole PQ has its base Q on the ground. From a point M, 40 meters from Q, the angle of elevation of P is a°. From another point N, 40√3 meters from Q (and in the same line as M), the angle of elevation of P is b°. If the height of the pole is 40 meters, what is the value of a° + b°?`,
o:[`60°`,`75°`,`90°`,`105°`],
a:`(b) 75°`,
e:`tan a = 40/40 = 1, so a=45°. Also tan b = 40/(40√3)=1/√3, so b=30°. Their sum is 75°.`
},

{
q:`Two identical solid hemispheres, each with a radius of 15 cm, are melted and recast into a single sphere. What is the radius of the new sphere formed?`,

e:`Two hemispheres make one complete sphere of radius 15 cm. Since volume is conserved, the new sphere has radius 15 cm.`
},

{
q:`Creating a frustum, a right circular cone is sliced parallel to its base. The height of the original cone is 20 cm, and the cut is made 5 cm from the vertex. What is the ratio of the volumes of the frustum to that of the entire cone?`,
o:[`63:64`,`1:64`,`7:8`,`31:32`],
a:`(a) 63:64`,
e:`The small removed cone has height 5 cm while the original cone has height 20 cm. Volume ratio = (5/20)³ = 1/64. Hence frustum volume : original volume = 63/64.`
},

{
q:`The side of a regular hexagon is two-thirds the side of an equilateral triangle. If the perimeter of the triangle is 27 cm, what is the perimeter of the hexagon?`,
o:[`18 cm`,`36 cm`,`24 cm`,`42 cm`],
a:`(b) 36 cm`,
e:`Triangle side = 27/3 = 9 cm. Hexagon side = 2/3×9 = 6 cm. Its perimeter = 6×6 = 36 cm.`
},

{
q:`A pillar is made in the shape of a regular triangular prism. The side length of its base is 8 cm. The column is built from 3 sections, and their heights form an arithmetic progression: 10 cm, 12 cm, and 14 cm. What is the total volume of the pillar?`,
o:[`576√3 cm³`,`288√3 cm³`,`144√3 cm³`,`432√3 cm³`],
a:`(a) 576√3 cm³`,
e:`Area of equilateral triangular base = √3/4×8² = 16√3 cm². Total height = 10+12+14=36 cm. Volume = 16√3×36 = 576√3 cm³.`
},

{
q:`Find the midpoint of the segment joining (4, -2) and (10, 6).`,
o:[`(7, 4)`,`(6, 2)`,`(7, 2)`,`(5, 3)`],
a:`(c) (7, 2)`,
e:`Midpoint = ((4+10)/2, (-2+6)/2) = (14/2, 4/2) = (7,2).`
},

{
q:`The number of diagonals in an octagon is:`,
o:[`14`,`20`,`27`,`35`],

e:`Number of diagonals in an n-sided polygon = n(n−3)/2. For n=8: 8×5/2 = 20.`
},

{
q:`Triangle PQR has its centroid at point G(2, -1), and vertex P is located at (-4, 5). If point M is the midpoint of side QR, what are the coordinates of M?`,
o:[`(4, -3)`,`(5, -4)`,`(3, -2)`,`(6, -5)`],
a:`(b) (5, -4)`,
e:`The centroid divides the median in the ratio 2:1 from the vertex. Thus G=(2P+M)/3. Therefore M=3G−2P = (6,-3)−(-8,10) = (14,-13). The supplied answer indicates (5,-4); however, using the stated coordinates mathematically gives (14,-13).`
},

{
q:`Given √(x + 5) + √x = 5, then find the value of x.`,
o:[`1`,`9`,`4`,`16`],
a:`(c) 4`,
e:`Let √x = y. Then √(x+5)=5−y. Squaring gives x+5=25−10y+x, so y=2 and x=4.`
},

{
q:`A common internal tangent connecting two circles is 12 cm long. The distance between the circles' centers is 20 cm. If the larger circle has a radius of 11 cm, what is the radius of the smaller circle?`,
o:[`3 cm`,`4 cm`,`5 cm`,`6 cm`],
a:`(c) 5 cm`,
e:`For a common internal tangent, d² = l² + (R+r)². Thus 20² = 12² + (11+r)², giving 256=(11+r)², so 11+r=16 and r=5 cm.`
},

q:`In a cyclic quadrilateral PQRS, PQ is the diameter of the circle. If angle PRS is 35°, what is the measure of angle QPS?`,
o:[`35°`,`45°`,`55°`,`65°`],
a:`(c) 55°`,
e:`Since PQ is a diameter, angle PRQ is 90°. Given angle PRS=35°, the required angle can be obtained from the corresponding cyclic-angle relationships, giving 55°.`
},

{
q:`If cos²x − sin²x = 1/3, find the value of sin²x`,
o:[`1/3`,`2/3`,`2/5`,`1/2`],

e:`Using cos²x = 1−sin²x: 1−2sin²x=1/3. Therefore 2sin²x=2/3 and sin²x=1/3.`
},

},

e:`Factor 0.12²+0.24² = 0.12²(1+4)=5(0.12²). Denominator = 0.03²(1+4)=5(0.03²). Ratio = (0.12/0.03)² = 4² = 16.`
},

function renderQuestions() {

    const container = document.getElementById("questions");

    questions.forEach((item, index) => {

        const card = document.createElement("div");
        card.className = "question-card";

        let optionsHTML = "";

        item.o.forEach((option, i) => {
            const letter = String.fromCharCode(97 + i);
            optionsHTML += `
                <div class="option">(${letter}) ${option}</div>
            `;
        });

        card.innerHTML = `
            <div class="question">
                <b>Q${index + 1}.</b> ${item.q}
            </div>

            <div class="options">
                ${optionsHTML}
            </div>

            <button class="show-btn" onclick="toggleAnswer(this)">
                Show Answer
            </button>

            <div class="answer-box">
                <div class="answer">
                    Answer: ${item.a}
                </div>

                <div class="explanation">
                    <b>Explanation:</b> ${item.e}
                </div>
            </div>
        `;

        container.appendChild(card);
    });
}

function toggleAnswer(button) {

    const answerBox = button.nextElementSibling;

    if (answerBox.style.display === "block") {
        answerBox.style.display = "none";
        button.textContent = "Show Answer";
    } else {
        answerBox.style.display = "block";
        button.textContent = "Hide Answer";
    }
}

renderQuestions();

</script>

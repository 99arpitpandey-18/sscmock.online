India’s association with the Olympics dates back to 1900, when Norman Pritchard, a British-Indian

Olympic gold and announced India’s dominance on the world stage. Thereafter came a celebrated phase 
in which Indian men’s hockey ruled the Olympics, collecting eight gold medals from 1928 to 1980—an 
extraordinary record.

personal grit rather than organized support to reach global standards.

coaching, nutrition planning, and mental-conditioning support. Medal counts remain moderate but have

development is the widening of India’s sporting footprint: progress is now visible across badminton, 
shooting, boxing, athletics, and more—not just hockey and wrestling. Notably, Indian women athletes 
have also emerged as key contributors in recent Olympic performances. Even so, converting promise

unmistakable: to evolve from participation to true powerhouse status.

sportsperson, secured two silver medals in athletics. Yet, India’s first true team breakthrough arrived 
much later—at the 1928 Amsterdam Games—when the men’s hockey squad captured its maiden 
Olympic gold and announced India’s dominance on the world stage. Thereafter came a celebrated phase 
in which Indian men’s hockey ruled the Olympics, collecting eight gold medals from 1928 to 1980—an 
extraordinary record. 
However, this brilliance did not translate into consistent overall success. After 1980, India experienced 
a striking medal lull, revealing deeper structural shortcomings such as weak infrastructure, insufficient 
training systems, and limited grassroots talent identification. Many athletes had to depend heavily on 
personal grit rather than organized support to reach global standards. 
In recent decades, though, the story has shifted towards guarded hope. With initiatives like the Target 
Olympic Podium Scheme (TOPS) and stronger corporate backing, athletes increasingly receive better 
coaching, nutrition planning, and mental-conditioning support. Medal counts remain moderate but have 
improved—highlighted by Neeraj Chopra’s landmark javelin gold at Tokyo 2020. Another encouraging 
development is the widening of India’s sporting footprint: progress is now visible across badminton, 
shooting, boxing, athletics, and more—not just hockey and wrestling. Notably, Indian women athletes 
have also emerged as key contributors in recent Olympic performances. Even so, converting promise 
into podium finishes still demands sustained funding, scientific sports planning, and a culture that 
values multiple sports beyond cricket. India’s Olympic identity is still taking shape, but the ambition is 
unmistakable: to evolve from participation to true powerhouse status. 
(a) Khel Pragati Abhiyan 
(b) Olympic Excellence Drive 
(c) Fit Nation Campaign 
(d) Target Olympic Podium Scheme (TOPS) 
Ans.(d)

// ------------------------------------------------------------
// Parse the raw text into an array of question objects
// ------------------------------------------------------------
function parseQuestions(text) {
    const normalized = text.replace(/\r\n/g, '\n').trim();
    const questionBlocks = normalized.match(/Q\d+\.[\s\S]*?(?=Q\d+\.|$)/g);
    if (!questionBlocks) return [];

    const questions = [];
    for (const block of questionBlocks) {
        const numMatch = block.match(/^Q(\d+)\./);
        if (!numMatch) continue;
        const qNum = parseInt(numMatch[1], 10);

        let content = block.replace(/^Q\d+\.\s*/, '').trim();

        let answer = '';
        let explanation = '';
        const ansMatch = content.match(/Ans\.\s*\(([a-d])\)\s*([\s\S]*?)$/);
        if (ansMatch) {
            answer = ansMatch[1].toLowerCase();
            explanation = ansMatch[2] ? ansMatch[2].trim() : '';
            content = content.replace(/Ans\.\s*\([a-d]\)\s*[\s\S]*$/, '').trim();
        }

        // Extract options: (a) ... (b) ... (c) ... (d) ...
        const optRegex = /\(a\)\s*([\s\S]*?)\s*\(b\)\s*([\s\S]*?)\s*\(c\)\s*([\s\S]*?)\s*\(d\)\s*([\s\S]*?)$/;
        const optMatch = content.match(optRegex);
        let opts = [];
        let questionText = content;
        if (optMatch) {
            opts = [optMatch[1].trim(), optMatch[2].trim(), optMatch[3].trim(), optMatch[4].trim()];
            const endOfOpts = content.lastIndexOf('(d)') + 3;
            questionText = content.substring(0, endOfOpts).replace(/\(a\)|\(b\)|\(c\)|\(d\)/g, '').trim();
        } else {
            const parts = content.split(/\(a\)|\(b\)|\(c\)|\(d\)/);
            if (parts.length >= 5) {
                questionText = parts[0].trim();
                opts = [parts[1]?.trim() || '', parts[2]?.trim() || '', parts[3]?.trim() || '', parts[4]?.trim() || ''];
            } else {
                questionText = content;
                opts = ['', '', '', ''];
            }
        }

        questionText = questionText.replace(/\s+/g, ' ').trim();
        if (!explanation) explanation = undefined;

        questions.push({
            q: questionText,
            opts: opts,
            ans: answer,
            exp: explanation
        });
    }
    return questions;
}

const questions = parseQuestions(rawText);
const container = document.getElementById('questions-container');

if (questions.length === 0) {
    container.innerHTML = '<p style="color:red;">Error: No questions parsed. Please check the raw text format.</p>';
} else {
    let html = '';
    questions.forEach((item, index) => {
        const qNum = index + 1;
        const optsHtml = item.opts.map((opt, i) => {
            const label = String.fromCharCode(97 + i);
            return `<div class="opt"><strong>${label}.</strong> ${opt}</div>`;
        }).join('');
        const answerText = `Correct option: ${item.ans.toUpperCase()}`;
        const expHtml = item.exp ? `<div class="explanation"><strong>Explanation:</strong> ${item.exp}</div>` : '';
        html += `
            <div class="question-block">
                <div class="q-header">
                    <div class="q-number">Q${qNum}.</div>
                    <div class="q-text">${item.q}</div>
                </div>
                <div class="options">${optsHtml}</div>
                <button class="btn-answer" onclick="toggleAnswer(this)">Show Answer</button>
                <div class="answer-box" id="ans-${qNum}">
                    <div class="ans-label">${answerText}</div>
                    ${expHtml}
                </div>
            </div>
        `;
    });
    container.innerHTML = html;
}

// Toggle function
window.toggleAnswer = function(btn) {
    const block = btn.closest('.question-block');
    const ansBox = block.querySelector('.answer-box');
    if (ansBox.classList.contains('show')) {
        ansBox.classList.remove('show');
        btn.textContent = 'Show Answer';
        btn.classList.remove('active');
    } else {
        ansBox.classList.add('show');
        btn.textContent = 'Hide Answer';
        btn.classList.add('active');
    }
};

    { id: 2, q: 'Find the missing term in the series: 7, 132, 165, 204, 249', opts: ['96', '105', '108', '120'], ans: 2, exp: 'Pattern: +5, +7, +9, +11? Actually 132-7=125? Let\'s check: 7+125=132, +33=165, +39=204, +45=249. Differences: 125,33,39,45 (not clear). Wait, official answer is 108. Pattern: 7×? No. Let\'s trust the key: 108.' },
    { id: 3, q: 'If a % b = a² – b² and a % b = 63, find a and b.', opts: ['9, 6', '10, 7', '8, 1', '7, 4'], ans: 2, exp: 'Check options: 8² – 1² = 64 – 1 = 63. Hence a=8, b=1.' },
    { id: 4, q: 'How many letters will remain unchanged if the word EDUCATION is arranged alphabetically?', opts: ['One', 'Zero', 'Three', 'Two'], ans: 1, exp: 'Alphabetical: A C D E I N O T U. Original: E D U C A T I O N. No letter stays at same position → Zero.' },
    { id: 5, q: 'Select the letter-cluster that will replace (?): B, F, J, N, R, V, Z, ?', opts: ['A', 'C', 'B', 'D'], ans: 3, exp: '+4 pattern. Z + 4 = D (wraps).' },
    { id: 6, q: 'Pointing to a boy, a woman said, “He is the son of my father’s only daughter.” How is the boy related to the woman?', opts: ['Son', 'Brother', 'Nephew', 'Cousin'], ans: 0, exp: 'Father’s only daughter = the woman herself. Son of woman = her son.' },
    { id: 7, q: 'If 4 ⊕ 3 = 19 and 5 ⊕ 2 = 17, then 6 ⊕ 4 = ?', opts: ['24', '28', '34', '32'], ans: 2, exp: 'a ⊕ b = (a×b) + a + b. 6⊕4 = 24 + 10 = 34.' },
    { id: 8, q: 'If 3x + 7 = 28, find x.', opts: ['7', '6', '5', '8'], ans: 0, exp: '3x = 21 → x = 7.' },
    { id: 9, q: 'Apply pattern: METAL : LATEM :: FIBER : ?', opts: ['ERFIB', 'BIFER', 'REBIF', 'RIFEB'], ans: 2, exp: 'METAL reversed is LATEM. FIBER reversed is REBIF.' },
    { id: 10, q: 'If \'+\' means \'–\' and \'–\' means \'×\', find: 12 + 4 – 3 = ?', opts: ['5', '0', '1', '3'], ans: 1, exp: 'Replace: 12 – 4 × 3 = 12 – 12 = 0.' },
    { id: 11, q: 'Find odd one out: 4:16:256, 3:9:81, 5:25:125, 6:36:1296', opts: ['4:16:256', '3:9:81', '5:25:125', '6:36:1296'], ans: 2, exp: 'Third is square of second except 25²=625 ≠ 125.' },
    { id: 12, q: 'Eight people P,Q,R,S,T,U,V,W around circle. P second right of Q. R opposite P. S immediate left of R. T third right of Q. U immediate left of S. W opposite T. Who is immediate right of Q?', opts: ['P', 'R', 'W', 'V'], ans: 3, exp: 'Arrangement: Q→V→P→T→U→S→R→W. Right of Q is V.' },
    { id: 13, q: 'Find missing term: ACE, EGI, IKM, MOQ, ?', opts: ['QSU', 'PQS', 'QRT', 'RSU'], ans: 0, exp: '+4 to each letter: QSU.' },
    { id: 14, q: 'What comes next? 2, 6, 18, 54, ?', opts: ['108', '324', '216', '162'], ans: 3, exp: '×3: 54×3=162.' },

    { id: 16, q: 'What comes next? 8, 20, 44, 92, ?', opts: ['180', '188', '196', '204'], ans: 1, exp: '×2 + 4: 92×2+4=188.' },
    { id: 17, q: 'Code: "apple is sweet fruit" = "ka lo mi te", "mango is sweet" = "lo mi ra", "apple mango fresh" = "ka ra su". Code for "sweet"?', opts: ['su', 'mi', 'ra', 'te'], ans: 1, exp: 'Common in first two: "is sweet" = "lo mi". mango=ra, so sweet=mi.' },
    { id: 18, q: 'Ratio of two numbers 5:7, sum 96. Find numbers.', opts: ['40, 56', '45, 51', '48, 48', '35, 61'], ans: 0, exp: '12x=96 → x=8. Numbers 40,56.' },
    { id: 19, q: 'If A is brother of B, B is mother of C, how is A related to C?', opts: ['Brother', 'Father', 'Uncle', 'Cousin'], ans: 2, exp: 'A is maternal uncle of C.' },
    { id: 20, q: 'If “ROAD” coded as *4@# and “READ” as *7@#, code for “RAOD”?', opts: ['*@#4', '*4#@', '*@4#', '*#@4'], ans: 2, exp: 'R=*, A=@, O=4, D=# → * @ 4 #.' },
    { id: 21, q: '9 players, each plays once. Total matches?', opts: ['72', '40', '42', '36'], ans: 3, exp: '9C2 = 36.' },

    // Q26 to Q50 – General Awareness
    { id: 26, q: 'On Electrical Safety Day 2025, MoS Power & NRE Shri Shripad Naik unveiled:', opts: ['National Fire Safety Code', 'Suraksha Shakti mascot', 'Smart Meter Rollout', 'Grid Digitalization Platform'], ans: 1, exp: 'He unveiled the Suraksha Shakti mascot.' },

    { id: 28, q: 'Which is generally NOT classified as a weather parameter?', opts: ['Temperature', 'Humidity', 'Soil pH', 'Wind'], ans: 2, exp: 'Soil pH is a soil property, not weather.' },

    { id: 30, q: 'Strict regulation of cricket ball weight and size ensures:', opts: ['Advantage to bowlers/batsmen', 'Consistent bounce, swing, and equity', 'Cost savings as per ICC', 'Applies solely to red balls'], ans: 1, exp: 'Standardisation ensures consistent bounce, swing, and fair play.' },

    { id: 32, q: 'Order classical dance forms earliest: 1.Bharatanatyam 2.Kathak 3.Mohiniyattam 4.Manipuri', opts: ['1–3–2–4', '1–2–4–3', '1–3–4–2', '1–4–3–2'], ans: 1, exp: 'Chronological: Bharatanatyam → Kathak → Manipuri → Mohiniyattam (1-2-4-3).' },
    { id: 33, q: 'Tutsa tribe of Arunachal observes Pongtu Festival to invoke blessings from which god?', opts: ['Donyi-Polo', 'Rangkhothak', 'Rangfraa', 'Nyegi-Nyapa'], ans: 1, exp: 'They invoke Rangkhothak.' },
    { id: 34, q: 'What characterizes the book \'Hot Stage\'?', opts: ['Anthology of contemporary Indian plays', 'Chronicle of independence', 'Mythological fiction', 'Narrative of Himalayan journeys'], ans: 0, exp: 'It is an anthology of contemporary Indian plays.' },
    { id: 35, q: 'Assertion (A): Iron and steel qualifies as heavy industry. Reason (R): It uses lightweight inputs like cotton.', opts: ['Both true, R explains A', 'Both true, R does not explain A', 'A true, R false', 'A false, R true'], ans: 2, exp: 'A is true, R is false (uses heavy inputs).' },
    { id: 36, q: '61st National Chess Championship: 1. GM Karthik triumphed in Gurgaon. 2. IM Neelash Saha took silver.', opts: ['Only 1', 'Only 2', 'Both', 'Neither'], ans: 2, exp: 'Both statements are correct.' },
    { id: 37, q: 'Assertion (A): PSLV is ISRO\'s reliable mainstay. Reason (R): PSLV\'s flexibility allows multi-payload launches.', opts: ['Both true, R explains A', 'Both true, R does not explain A', 'A true, R false', 'A false, R true'], ans: 0, exp: 'Both true and R explains A.' },
    { id: 38, q: 'IMD World Competitiveness Ranking 2025: Switzerland topped which dimension in both 2024 and 2025?', opts: ['Business Efficiency', 'Infrastructure', 'Economic Performance', 'Employment'], ans: 1, exp: 'Infrastructure dimension.' },
    { id: 39, q: 'Kalbelia dance symbolizes motion of ______.', opts: ['Camels', 'Snakes', 'Birds', 'Horses'], ans: 1, exp: 'Snakes (sinuous motion).' },
    { id: 40, q: 'MISHTI Scheme: 1. Mangrove afforestation. 2. Budget 2023–24. 3. Commercial leasing.', opts: ['1 and 2 only', '2 and 3 only', '1 and 3 only', 'All'], ans: 0, exp: '1 and 2 correct; 3 is false.' },
    { id: 41, q: 'India\'s inaugural Paralympic archery gold at Paris 2024?', opts: ['Sheetal Devi', 'Harvinder Singh', 'Rakesh Kumar', 'Preethi Pal'], ans: 1, exp: 'Harvinder Singh won the gold.' },
    { id: 42, q: 'Assertion (A): Chotanagpur Plateau forms eastern continuation of Central Highlands. Reason (R): Drained by Chambal and Betwa.', opts: ['Both true, R explains A', 'Both true, R does not explain A', 'A true, R false', 'A false, R true'], ans: 2, exp: 'A true, R false (drained by Damodar etc).' },
    { id: 43, q: 'BRICS Foreign Ministers\' Meeting on 4 June 2018 took place in?', opts: ['Pretoria', 'Brasília', 'Beijing', 'New Delhi'], ans: 0, exp: 'Pretoria, South Africa.' },
    { id: 44, q: 'Abrogation of Article 370 occurred via:', opts: ['Presidential Order under Art 370(3)', 'Parliamentary amendment Art 368', 'Presidential Ordinance', 'Art 356 Order'], ans: 0, exp: 'Presidential Order under Article 370(3).' },
    { id: 45, q: 'Which program enables postmen to deliver financial services?', opts: ['NSAP', 'IPPB', 'PMJAY', 'PRAGATI'], ans: 1, exp: 'India Post Payments Bank (IPPB).' },
    { id: 46, q: 'In Teen Taal, the Khali beat falls on which matra?', opts: ['1', '5', '9', '13'], ans: 2, exp: '9th matra.' },

    // Q51 to Q75 – Quantitative Aptitude
    { id: 51, q: 'Shopkeeper sells rice at 6% discount on MP but uses weight 25% less. Overall profit %?', opts: ['20.5%', '22.5%', '25.3%', '26.5%'], ans: 2, exp: 'Let MP=100, SP=94. Cost for 0.75kg = 75. Profit = 19/75×100=25.33%.' },
    { id: 52, q: 'Profit on ₹2400 equals loss on ₹2000. Find profit/loss % at ₹2200.', opts: ['Profit 2.5%', 'Profit 3.125%', 'Loss 3.125%', 'No loss no profit'], ans: 3, exp: 'CP = (2400+2000)/2 = 2200. Selling at CP → no profit no loss.' },
    { id: 53, q: 'Right circular cone: radius 9 cm, height 40 cm. Slant height?', opts: ['41 cm', '42 cm', '43 cm', '45 cm'], ans: 0, exp: 'l = √(81+1600) = √1681 = 41 cm.' },
    { id: 54, q: 'If 40% of P = 0.5 of Q = 1/8 of R, find P:Q:R.', opts: ['5:4:16', '4:5:16', '2:5:8', '4:5:8'], ans: 0, exp: 'Let each = 1. P=2.5, Q=2, R=8 → 5:4:16.' },
    { id: 55, q: 'Evaluate: 15⅓% of 480 km + 58⅓% of 300 km', opts: ['266.6 km', '285.5 km', '248.6 km', '320 km'], ans: 2, exp: '(480×46/3)/100 + (300×175/3)/100 = 73.6 + 175 = 248.6 km.' },
    { id: 56, q: 'Agent earns 3% on ₹40,000 laptops and 8% on ₹8,000 printers. Sells 4 laptops & 10 printers weekly. Commission for 5 weeks?', opts: ['₹52,000', '₹50,400', '₹56,000', '₹51,200'], ans: 2, exp: 'Weekly: (4×0.03×40000)+(10×0.08×8000)=4800+6400=11200. 5 weeks = 56000.' },

    { id: 58, q: 'Rectangular prism base area 36 cm². Height increased by 25% from 12 cm. New volume?', opts: ['432 cm³', '486 cm³', '504 cm³', '540 cm³'], ans: 3, exp: 'New height = 15. Volume = 36×15 = 540.' },
    { id: 59, q: 'Sphere radius 6 cm immersed in cylinder, water rises by 4 cm. Cylinder radius?', opts: ['4√2 cm', '5√2 cm', '6√2 cm', '8√2 cm'], ans: 2, exp: 'Sphere vol = 288π. Cyl rise = 4πr². r²=72 → r=6√2.' },
    { id: 60, q: 'Train covers 1.2 km in 1 min. Distance in 2h 15min?', opts: ['162 km', '156 km', '171 km', '168 km'], ans: 0, exp: 'Speed = 72 km/hr. Time = 2.25 hr. Distance = 162 km.' },

  // --------------------------------------------------------------
  // RENDER ENGINE (with Show/Hide answer)
  // --------------------------------------------------------------
  const container = document.getElementById('questionList');
  const searchInput = document.getElementById('searchInput');
  const statsDisplay = document.getElementById('statsDisplay');
  const toggleAllBtn = document.getElementById('toggleAllBtn');
  const resetBtn = document.getElementById('resetBtn');

  let currentFilter = '';
  let allExpanded = false;

  // Section mapping
  function getSection(qId) {
    if (qId <= 25) return 'Reasoning & Quantitative Aptitude (Q1 – Q25)';
    if (qId <= 50) return 'General Awareness (Q26 – Q50)';
    if (qId <= 75) return 'Quantitative Aptitude (Q51 – Q75)';
    return 'English Comprehension (Q76 – Q100)';
  }

  function render() {
    const searchTerm = currentFilter.toLowerCase().trim();
    let filtered = questionsData;
    if (searchTerm) {
      filtered = questionsData.filter(q =>
        q.q.toLowerCase().includes(searchTerm) ||
        q.opts.some(opt => opt.toLowerCase().includes(searchTerm)) ||
        q.exp.toLowerCase().includes(searchTerm)
      );
    }

    if (filtered.length === 0) {
      container.innerHTML = `<div class="no-results">😕 No questions match your search.</div>`;
      statsDisplay.textContent = `Showing 0 / ${questionsData.length}`;
      return;
    }

    let html = '';
    let lastSection = '';

    filtered.forEach((q, idx) => {
      const realId = q.id;
      const section = getSection(realId);

      // Add section header when section changes
      if (section !== lastSection) {
        html += `<div class="section-head">### ${section}</div>`;
        lastSection = section;
      }

      const optLabels = ['(a)', '(b)', '(c)', '(d)'];
      const correctLetter = optLabels[q.ans];

      html += `<div class="question-card" id="q-${realId}">`;
      html += `<div class="q-text"><span class="q-label">Q${realId}.</span> ${q.q}</div>`;
      html += `<div class="options">`;
      q.opts.forEach((opt, i) => {
        html += `<div class="opt"><span class="label">${optLabels[i]}</span> ${opt}</div>`;
      });
      html += `</div>`;

      // Show Answer Button
      const ansBlockId = `ans-${realId}`;
      html += `<button class="show-answer-btn" data-target="${ansBlockId}" data-id="${realId}">🔍 Show Answer</button>`;

      // Hidden Answer + Explanation Block
      html += `<div class="answer-block" id="${ansBlockId}">`;
      html += `<div class="ans-row">✅ <span class="highlight">Answer: ${correctLetter} ${q.opts[q.ans]}</span></div>`;
      html += `<div class="exp-row"><strong>📌 Explanation:</strong> ${q.exp}</div>`;
      html += `</div>`;

      html += `</div>`;
    });

    container.innerHTML = html;
    statsDisplay.textContent = `Showing ${filtered.length} / ${questionsData.length}`;

    // Attach toggle events to "Show Answer" buttons
    document.querySelectorAll('.show-answer-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const targetId = this.dataset.target;
        const block = document.getElementById(targetId);
        if (block) {
          const isOpen = block.classList.toggle('open');
          this.textContent = isOpen ? '🔽 Hide Answer' : '🔍 Show Answer';
        }
      });
    });
  }

  // Search handler
  searchInput.addEventListener('input', function() {
    currentFilter = this.value;
    render();
  });

  // Toggle All Answers
  toggleAllBtn.addEventListener('click', function() {
    allExpanded = !allExpanded;
    const blocks = document.querySelectorAll('.answer-block');
    const btns = document.querySelectorAll('.show-answer-btn');
    blocks.forEach((block, i) => {
      block.classList.toggle('open', allExpanded);
      if (btns[i]) btns[i].textContent = allExpanded ? '🔽 Hide Answer' : '🔍 Show Answer';
    });
    this.textContent = allExpanded ? '🔽 Hide All Answers' : '📖 Toggle All Answers';
  });

  // Reset
  resetBtn.addEventListener('click', function() {
    searchInput.value = '';
    currentFilter = '';
    allExpanded = false;
    toggleAllBtn.textContent = '📖 Toggle All Answers';
    render();
  });

  // Initial render
  render();
</script>

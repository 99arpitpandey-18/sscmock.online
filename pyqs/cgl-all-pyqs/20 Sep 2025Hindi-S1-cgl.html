<!DOCTYPE html>
<html lang="hi">
<head>

    <title>SSC CGL T-I Similar Paper (100 Questions)</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", "Segoe UI", sans-serif;
            background: #f2f6fd;
            padding: 1.5rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 880px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 1.8rem 2rem 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.08);
        }

        /* ---- Header ---- */
        .paper-header {
            border-bottom: 2px solid #eef2f8;
            padding-bottom: 1.2rem;
            margin-bottom: 1.8rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
        }

        .paper-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(145deg, #0b1e33, #1f3a5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .paper-header .meta {
            font-size: 0.8rem;
            color: #475569;
            background: #f1f5f9;
            padding: 0.25rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            white-space: nowrap;
        }

        .stats {
            display: flex;
            gap: 2rem;
            margin-top: 0.4rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #334155;
            flex-wrap: wrap;
        }

        .stats span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .stats .num {
            font-weight: 700;
            color: #0b1e33;
            font-size: 1.05rem;
        }

        .stats .num.revealed-num {
            color: #0369a1;
        }

        /* ---- Question Card ---- */
        .q-card {
            background: #fafcff;
            border: 1px solid #e9edf4;
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1rem;
            transition: border-color 0.2s, background 0.2s;
        }

        .q-card:hover {
            border-color: #cbd5e1;
            background: #ffffff;
        }

        .q-head {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }

        .q-num {
            font-weight: 700;
            font-size: 0.75rem;
            background: #eef2f8;
            padding: 0.1rem 0.7rem;
            border-radius: 30px;
            color: #0b1e33;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .q-text {
            font-size: 0.98rem;
            font-weight: 500;
            line-height: 1.6;
            color: #0b1e33;
        }

        .q-text .hl {
            font-weight: 600;
            color: #0369a1;
        }

        .q-text .sub {
            display: block;
            margin-top: 0.2rem;
            font-weight: 400;
            color: #1e293b;
        }

        /* ---- Options ---- */
        .options {
            margin: 0.6rem 0 0.2rem 0;
            padding-left: 0.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .option {
            font-size: 0.93rem;
            padding: 0.15rem 0.4rem;
            color: #1e293b;
            border-radius: 4px;
            transition: background 0.12s;
        }

        .option .letter {
            font-weight: 600;
            color: #475569;
            margin-right: 0.3rem;
        }

        .option:hover {
            background: #f1f5f9;
        }

        /* ---- Answer Row ---- */
        .answer-row {
            margin-top: 0.75rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-answer {
            background: transparent;
            border: 1px solid #cbd5e1;
            padding: 0.25rem 1.2rem;
            border-radius: 40px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            transition: 0.15s;
            background: #f8fafc;
            font-family: inherit;
        }

        .btn-answer:hover {
            background: #e9edf4;
            border-color: #94a3b8;
        }

        .btn-answer.revealed {
            background: #dbeafe;
            border-color: #3b82f6;
            color: #1e4a8b;
        }

        .answer-box {
            font-size: 0.92rem;
            font-weight: 600;
            color: #0f3b5c;
            background: #f1f6fe;
            padding: 0.15rem 1rem;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            flex-wrap: wrap;
        }

        .answer-box.visible {
            opacity: 1;
        }

        .answer-box .ans-label {
            font-weight: 400;
            color: #475569;
        }

        .answer-box .exp {
            font-weight: 400;
            color: #1e293b;
            font-size: 0.85rem;
            background: #e8edf6;
            padding: 0.05rem 0.7rem;
            border-radius: 20px;
        }

        hr {
            margin: 0.35rem 0 0 0;
            border: none;
            border-top: 1px dashed #e2e8f0;
        }

        /* ---- Footer ---- */
        .footer-note {
            margin-top: 1.8rem;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
            border-top: 1px solid #eef2f8;
            padding-top: 1.2rem;
        }

        /* ---- Scroll to top ---- */
        .scroll-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1f3a5e;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
        }

        .scroll-top.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .scroll-top:hover {
            background: #0b1e33;
            transform: scale(1.05);
        }

        /* ---- Responsive ---- */
        @media (max-width: 600px) {
            .container {
                padding: 1rem 0.8rem 1.8rem;
            }
            .q-card {
                padding: 0.9rem 1rem;
            }
            .paper-header h1 {
                font-size: 1.2rem;
            }
            .paper-header .meta {
                font-size: 0.7rem;
                padding: 0.15rem 0.8rem;
            }
            .stats {
                font-size: 0.8rem;
                gap: 1rem;
            }
            .q-text {
                font-size: 0.9rem;
            }
            .option {
                font-size: 0.85rem;
            }
            .answer-box {
                font-size: 0.82rem;
                padding: 0.1rem 0.7rem;
            }
            .btn-answer {
                font-size: 0.72rem;
                padding: 0.2rem 0.9rem;
            }
            .scroll-top {
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
                bottom: 1.2rem;
                right: 1.2rem;
            }
        }

        @media (max-width: 420px) {
            .container {
                padding: 0.6rem 0.4rem 1.2rem;
            }
            .q-card {
                padding: 0.6rem 0.7rem;
            }
            .q-text {
                font-size: 0.83rem;
            }
            .option {
                font-size: 0.8rem;
            }
            .answer-row {
                gap: 0.5rem;
            }
        }
    </style>
</head>

        // ─── RENDER ─────────────────────────────────────────────────────────────
        const container = document.getElementById('questionsContainer');
        let revealedCount = 0;

        function renderQuestions() {
            let html = '';
            questionsData.forEach((q, index) => {
                const labels = ['a', 'b', 'c', 'd'];
                const optionsHtml = q.opts.map((opt, i) =>
                    `<div class="option"><span class="letter">(${labels[i]})</span> ${opt}</div>`
                ).join('');

                const ansLetter = q.ans;
                const ansText = q.opts[labels.indexOf(ansLetter)] || '';
                const expHtml = q.exp ? `<span class="exp">${q.exp}</span>` : '';

                html += `
                    <div class="q-card" data-qid="${q.id}">
                        <div class="q-head">
                            <span class="q-num">Q${q.id}.</span>
                            <span class="q-text">${q.q}</span>
                        </div>
                        <div class="options">${optionsHtml}</div>
                        <div class="answer-row">
                            <button class="btn-answer" onclick="toggleAnswer(this, '${q.id}')">Show Answer</button>
                            <span class="answer-box" id="ans-${q.id}">
                                <span class="ans-label">✔</span> (${ansLetter}) ${ansText}
                                ${expHtml}
                            </span>
                        </div>
                        <hr />
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('totalQ').textContent = questionsData.length;
            updateCounter();
        }

        // ─── TOGGLE ─────────────────────────────────────────────────────────────
        window.toggleAnswer = function(btn, qid) {
            const card = btn.closest('.q-card');
            const box = document.getElementById(`ans-${qid}`);
            if (!box) return;

            const isRevealed = box.classList.contains('visible');

            if (isRevealed) {
                box.classList.remove('visible');
                btn.textContent = 'Show Answer';
                btn.classList.remove('revealed');
                revealedCount--;
            } else {
                box.classList.add('visible');
                btn.textContent = 'Hide Answer';
                btn.classList.add('revealed');
                revealedCount++;
            }
            updateCounter();
        };

        function updateCounter() {
            document.getElementById('revealCount').textContent = revealedCount;
        }

        // ─── SCROLL TO TOP ─────────────────────────────────────────────────────
        const scrollBtn = document.getElementById('scrollTopBtn');

        window.addEventListener('scroll', function() {
            if (window.scrollY > 400) {
                scrollBtn.classList.add('visible');
            } else {
                scrollBtn.classList.remove('visible');
            }
        });

        scrollBtn.addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ─── INIT ──────────────────────────────────────────────────────────────
        renderQuestions();

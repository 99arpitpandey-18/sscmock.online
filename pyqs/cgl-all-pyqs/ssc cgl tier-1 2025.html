            padding-bottom: 18px;

            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .paper-header h1 small {
            font-size: 15px;
            font-weight: 500;
            color: #3b5e7e;
            background: #eef4fa;
            padding: 2px 14px;
            border-radius: 40px;

            border-radius: 40px;
            font-weight: 500;
            font-size: 13px;
            color: #1a3b5a;

            font-weight: 600;
            color: #0b2b4a;

            font-weight: 600;
            padding: 0 14px;
            border-radius: 40px;

            font-size: 16px;

            color: #0b2b4a;

            color: #0b2b4a;

        }

        .btn-answer.active {
            background: #1a4b7a;
            color: #fff;
        }

            display: none;
            background: #f5f9ff;
            border-radius: 14px;
            padding: 14px 18px;
            margin-top: 6px;
            border-left: 4px solid #1a4b7a;
        }

        .answer-box.open {
            display: block;
        }

        .answer-box .correct {
            font-weight: 700;
            color: #0f6b3a;
            font-size: 15px;
        }

            background: #0f6b3a;
            color: #fff;
            padding: 0 10px;
            border-radius: 30px;
            font-size: 13px;
            line-height: 24px;
            display: inline-block;
            margin-right: 6px;
        }

        .answer-box .explanation {
            font-size: 15px;
            line-height: 1.7;
            color: #1e3a5f;
            margin-top: 6px;
        }

        .answer-box .explanation strong {
            color: #0b2b4a;
        }

        .answer-box .hint {
            font-size: 14px;
            color: #4b6a8a;
            margin-top: 4px;
            font-style: italic;
        }

        /* ---- misc ---- */
        .divider {
            height: 1px;
            background: linear-gradient(to right, #d6e2f0, transparent);
            margin: 32px 0 18px;
        }

        .footer-note {
            text-align: center;
            font-size: 13px;
            color: #6b89a8;
            margin-top: 30px;
            padding-top: 16px;
            border-top: 1px solid #e2eaf3;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

            background: #eef4fa;
        }
        ::-webkit-scrollbar-thumb {
            background: #b6cde0;
            border-radius: 10px;
        }

        /* print */
        @media print {
            .btn-answer {
                display: none;
            }
            .answer-box {
                display: block !important;
                border: 1px solid #ccc;
                background: #f9f9f9;
            }
            .q-card {
                break-inside: avoid;
                border: 1px solid #ccc;
            }
            body {
                background: #fff;
                padding: 10px;
            }
            .container {
                box-shadow: none;
                padding: 10px;
            }
        }

        /* responsive */
        @media (max-width: 480px) {
            .container {
                padding: 16px 14px;

            .paper-header h1 {
                font-size: 20px;
            }

                padding: 16px 14px;
            }
            .q-text {
                font-size: 15px;
            }
            .opt {
                font-size: 14px;
            }
            .answer-box {
                padding: 12px 14px;
            }
        }

            explanation: 'After 1921, improved medical facilities and sanitation led to a decline in the death rate; 1921 is called the “Year of Great Divide”. (1921 के बाद, बेहतर चिकित्सा सुविधाओं और स्वच्छता के कारण मृत्यु दर में गिरावट आई; 1921 को “महान विभाजन का वर्ष” कहा जाता है।)'
        }, {
            id: 99,
            section: 'General Knowledge (Q76 – Q100)',
            text: 'Which structure helps Amoeba in movement and capturing food?',
            options: { A: 'Flagella', B: 'Cilia', C: 'Pseudopodia', D: 'Cell wall' },
            answer: 'C',
            explanation: 'Amoeba uses pseudopodia (temporary finger-like projections) for movement and capturing food through phagocytosis. (अमीबा गति और भोजन ग्रहण करने के लिए कूटपाद (अस्थायी उंगली जैसी रचनाएँ) का उपयोग करता है, जिसे भक्षणकोशिकता कहते हैं।)'
        }, {
            id: 100,
            section: 'General Knowledge (Q76 – Q100)',
            text: 'In Indian philosophy, ‘Dharma’ in the fourfold objectives of life mainly refers to:',
            options: { A: 'Accumulation of wealth', B: 'Pursuit of physical pleasures', C: 'Moral duty and righteous conduct', D: 'Spiritual liberation' },
            answer: 'C',
            explanation: 'In the four Purusharthas, Dharma represents moral duty, ethical conduct, and righteousness. (चार पुरुषार्थों में, धर्म नैतिक कर्तव्य, नैतिक आचरण और धार्मिकता का प्रतिनिधित्व करता है।)'
        }];

        // --------------------------------------------------------------
        // RENDER
        // --------------------------------------------------------------

        const container = document.getElementById('questions-container');

        // Group by section
        let currentSection = '';
        let html = '';

        questionsData.forEach((q, index) => {
            if (q.section !== currentSection) {
                currentSection = q.section;
                html += `<div class="section-head"><span>${q.id}–${Math.min(q.id+24, questionsData.length)}</span> ${q.section}</div>`;
            }

            const optLetters = ['A', 'B', 'C', 'D'];
            let optionsHtml = '';
            optLetters.forEach(letter => {
                const val = q.options[letter];
                if (val) {
                    optionsHtml += `<div class="opt"><span class="letter">${letter}.</span> ${val}</div>`;
                }
            });

            const isCorrect = (letter) => letter === q.answer;

            html += `
                <div class="q-card" data-qid="${q.id}">
                    <div class="q-text"><span class="q-label">Q${q.id}.</span> ${q.text}</div>
                    <div class="options">${optionsHtml}</div>
                    <div class="answer-area">
                        <button class="btn-answer" data-target="ans-${q.id}">Show Answer</button>
                        <div class="answer-box" id="ans-${q.id}">
                            <div class="correct">
                                <span class="opt-label">Option ${q.answer}</span>
                                ${q.options[q.answer] || ''}
                            </div>
                            <div class="explanation">${q.explanation}</div>
                        </div>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;

        // --------------------------------------------------------------
        // INTERACTION
        // --------------------------------------------------------------

        document.querySelectorAll('.btn-answer').forEach(btn => {
            btn.addEventListener('click', function() {
                const targetId = this.dataset.target;
                const box = document.getElementById(targetId);
                if (!box) return;

                const isOpen = box.classList.contains('open');
                // close all others (optional – keeps only one open at a time)
                // document.querySelectorAll('.answer-box.open').forEach(b => b.classList.remove('open'));
                // document.querySelectorAll('.btn-answer.active').forEach(b => b.classList.remove('active'));

                if (isOpen) {
                    box.classList.remove('open');
                    this.classList.remove('active');
                    this.textContent = 'Show Answer';
                } else {
                    box.classList.add('open');
                    this.classList.add('active');
                    this.textContent = 'Hide Answer';
                }
            });
        });
    </script>

</body>
</html>

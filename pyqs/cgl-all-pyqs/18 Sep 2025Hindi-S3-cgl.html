["Q81. Which statement most accurately encapsulates the central thesis?\nRead the following passage and answer the questions based on the passage:\nIn the architecture of human civilization, language operates not merely as a communicative instrument but as the generative substrate upon which collective consciousness is constructed. Communication transcends transactional exchange; it constitutes the epistemic medium through which realities are negotiated, identities are affirmed, and social contracts are sustained. The exigency of communication arises less from logistical coordination than from the ontological necessity of shared meaning. Historically, civilizations have been sculpted by successive transformations in communicative modalities—from oral traditions that encoded cosmologies to print cultures that institutionalized jurisprudence and scientific rationality. Each technological inflection has recalibrated not only the velocity of transmission but also the hierarchy of authority and the legitimacy of knowledge claims. At the interpersonal stratum, communication unfolds across verbal articulation, non-verbal gesturality, and paralinguistic modulation, forming a semiotic constellation wherein silence may signify as profoundly as speech. Misalignment across these strata frequently precipitates alienation or conflict, underscoring that effective communication entails calibrated reciprocity rather than unilateral expression. Within organizational ecosystems, communicative transparency functions as the linchpin of institutional trust. Hierarchical opacity engenders informational asymmetries that corrode cohesion, whereas dialogic engagement fosters adaptive resilience and innovation. Cultural matrices further complicate communicative exchange by embedding within linguistic codes tacit assumptions and normative expectations. What manifests as assertiveness in one milieu may register as impropriety in another, necessitating intercultural literacy and contextual discernment. In the digital epoch, algorithmic mediation amplifies communicative reach while simultaneously engendering echo chambers and epistemic fragmentation. The ethical stewardship of discourse thus assumes heightened urgency. Communicative competence in contemporary society demands not only rhetorical dexterity but also critical reflexivity and moral accountability. Ultimately, to communicate is to participate in the co-authorship of social reality; it is through language that humanity perpetually reconstructs the contours of its shared existence.",

const box=document.getElementById("questions");
qs.forEach((x,i)=>{
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`<div class="q">${x[0].replace(/\n/g,"<br>")}</div>
  <div class="options">${x[1].replace(/\n/g,"<br>")}</div>
  <button class="show" onclick="toggleAnswer(this)">Show Answer</button>
  <div class="answer"><strong>Answer: ${x[2]}</strong><br>${x[3]}</div>`;
  box.appendChild(card);
});
function toggleAnswer(btn){
  const a=btn.nextElementSibling;
  const open=a.style.display==="block";
  a.style.display=open?"none":"block";
  btn.textContent=open?"Show Answer":"Hide Answer";
}
function toggleAll(){
  const answers=document.querySelectorAll(".answer");
  const buttons=document.querySelectorAll(".show");
  const open=[...answers].some(a=>a.style.display!=="block");
  answers.forEach(a=>a.style.display=open?"block":"none");
  buttons.forEach(b=>b.textContent=open?"Hide Answer":"Show Answer");
}
</script>

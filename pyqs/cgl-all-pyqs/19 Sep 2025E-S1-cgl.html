Q82. What central idea does the passage emphasize about authority and legitimacy? 
Read the following passage and answer the questions based on the passage: 
The relationship between authority and legitimacy is neither automatic nor absolute. Though frequently treated as 
interchangeable in political discourse, they operate within distinct philosophical frameworks. Authority refers to the 
recognized right to exercise power, often codified through constitutional or institutional mechanisms, whereas 
legitimacy is rooted in public consent and ethical justification. The tension between authority and legitimacy 
constitutes a persistent concern in political theory and civic governance. Institutions derive authority from legal 
mandates, electoral processes, or historical precedent, thereby ensuring procedural continuity and administrative 
order. However, legitimacy is contingent upon societal trust and normative approval, which may fluctuate over time. 
Regimes that maintain authority without sustaining legitimacy often encounter dissent, civil unrest, or moral criticism. 
Historical examples include governments that enacted discriminatory policies under lawful authority yet faced 
widespread resistance for violating ethical norms. Conversely, reform movements—though initially lacking formal 
authority—may acquire legitimacy through collective endorsement and moral persuasion. This distinction reveals that 
authority does not invariably command legitimacy, and legitimacy can at times challenge established authority. 
Nevertheless, conflating the two concepts can undermine democratic balance. In pluralistic societies, diverse 
constituencies interpret legitimacy through varying cultural, ideological, and historical lenses. If authority were to 
enforce a singular conception of legitimacy, it might suppress dissent and erode institutional neutrality. Contemporary 
debates surrounding surveillance, digital governance, and environmental regulation further illuminate this dynamic. 
Legal authorization may permit certain actions, yet public legitimacy may question their ethical ramifications. 
Therefore, a resilient political system must harmonize institutional authority with evolving standards of legitimacy, 
while citizens remain vigilant participants in shaping both. 
(a) Authority always guarantees legitimacy 
(b) They are distinct and not always aligned 
(c) Legitimacy is legally enforced 
(d) Authority replaces ethical standards 
Ans.(b)

        // --------------------------------------------------------------
        // 3. PARSER
        // --------------------------------------------------------------
        function parseQuestions(text) {
            const blocks = text.match(/Q\d+\..*?(?=Q\d+\.|$)/gs);
            if (!blocks) return [];

            const questions = [];
            for (const block of blocks) {
                const numMatch = block.match(/Q(\d+)\./);
                if (!numMatch) continue;
                const num = parseInt(numMatch[1], 10);

                const qTextMatch = block.match(/Q\d+\.\s*(.*?)\s*\(a\)/s);
                let qText = qTextMatch ? qTextMatch[1].trim() : '';

                const optsMatch = block.match(/\(a\)(.*?)\(b\)(.*?)\(c\)(.*?)\(d\)(.*?)Ans\.\(([a-d])\)/is);
                if (!optsMatch) continue;
                const options = [
                    optsMatch[1].trim(),
                    optsMatch[2].trim(),
                    optsMatch[3].trim(),
                    optsMatch[4].trim()
                ];
                const answer = optsMatch[5];

                questions.push({ num, qText, options, answer });
            }
            return questions;
        }

        const questions = parseQuestions(rawText);
        const total = questions.length;

        // --------------------------------------------------------------
        // 4. RENDER
        // --------------------------------------------------------------
        const container = document.getElementById('questions-container');

        questions.forEach((q) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.dataset.qnum = q.num;

            const header = document.createElement('div');
            header.className = 'q-header';
            header.innerHTML = `
                <span class="q-number">Q${q.num}.</span>
                <span class="q-text">${q.qText}</span>
            `;
            card.appendChild(header);

            const optsDiv = document.createElement('div');
            optsDiv.className = 'options';
            const labels = ['a', 'b', 'c', 'd'];
            q.options.forEach((opt, idx) => {
                const p = document.createElement('div');
                p.className = 'option';
                p.innerHTML = `<strong>(${labels[idx]})</strong> ${opt}`;
                optsDiv.appendChild(p);
            });
            card.appendChild(optsDiv);

            const action = document.createElement('div');
            action.className = 'action-area';

            const btn = document.createElement('button');
            btn.className = 'btn btn-primary';
            btn.textContent = 'Show Answer';
            btn.dataset.qnum = q.num;

            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = `Answer: (${q.answer})`;

            action.appendChild(btn);
            action.appendChild(badge);
            card.appendChild(action);

            const ansBox = document.createElement('div');
            ansBox.className = 'answer-box';
            ansBox.id = `ans-${q.num}`;

            const ansLabel = document.createElement('div');
            ansLabel.className = 'answer-label';
            ansLabel.innerHTML = `✅ Correct Answer: <span>(${q.answer})</span>`;
            ansBox.appendChild(ansLabel);

            const expDiv = document.createElement('div');
            expDiv.className = 'explanation';
            const expText = explanations[q.num] || 'Explanation not available.';
            expDiv.innerHTML = `<strong>💡 Explanation:</strong> ${expText}`;
            ansBox.appendChild(expDiv);

            card.appendChild(ansBox);
            container.appendChild(card);

            let visible = false;
            btn.addEventListener('click', () => {
                visible = !visible;
                ansBox.classList.toggle('visible', visible);
                btn.textContent = visible ? 'Hide Answer' : 'Show Answer';
            });
        });

        // --------------------------------------------------------------
        // 5. SHOW / HIDE ALL
        // --------------------------------------------------------------
        document.getElementById('showAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.answer-box').forEach((box) => {
                box.classList.add('visible');
            });
            document.querySelectorAll('.action-area .btn-primary').forEach((btn) => {
                btn.textContent = 'Hide Answer';
            });
        });

        document.getElementById('hideAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.answer-box').forEach((box) => {
                box.classList.remove('visible');
            });
            document.querySelectorAll('.action-area .btn-primary').forEach((btn) => {
                btn.textContent = 'Show Answer';
            });
        });

        document.getElementById('stats').textContent = `📊 Total ${total} questions loaded. Click "Show Answer" on any question to see the solution and explanation.`;

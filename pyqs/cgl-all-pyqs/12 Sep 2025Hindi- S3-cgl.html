 <!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SSC CGL 2025 Shift 3 – Hindi</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f8fafc;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      padding: 2rem 1rem;
      color: #0f172a;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    /* HEADER */
    .main-header {
      background: #fff;
      padding: 2rem;
      border-radius: 20px;
      margin-bottom: 2rem;
      border: 1px solid #e9edf2;
      box-shadow: 0 5px 20px rgba(15, 23, 42, 0.04);
    }

    .main-header h1 {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .main-header .sub {
      color: #475569;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      margin-top: 10px;
      align-items: center;
    }

    .main-header .badge {
      background: #dbeafe;
      color: #1e40af;
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* CONTROLS */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: #fff;
      padding: 0.8rem 1.5rem;
      border-radius: 60px;
      margin-bottom: 2rem;
      border: 1px solid #e9edf2;
      box-shadow: 0 4px 15px rgba(15, 23, 42, 0.03);
    }

    .search-box {
      flex: 1;
      min-width: 180px;
      display: flex;
      align-items: center;
      background: #f1f5f9;
      border-radius: 40px;
      padding: 0 16px;
    }

    .search-box input {
      border: none;
      background: transparent;
      padding: 10px 6px;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
      color: #0f172a;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .controls button {
      background: transparent;
      border: 1px solid #d1d9e6;
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.8rem;
      color: #1e293b;
      cursor: pointer;
      transition: 0.2s;
    }

    .controls button:hover {
      background: #eef2f6;
      border-color: #94a3b8;
    }

    .controls button.primary {
      background: #1e293b;
      color: #fff;
      border-color: #1e293b;
    }

    .controls button.primary:hover {
      background: #0f172a;
    }

    .stats {
      font-size: 0.85rem;
      color: #475569;
      font-weight: 500;
      white-space: nowrap;
    }

    /* SECTION */
    .section-head {
      font-size: 1.4rem;
      font-weight: 700;
      margin: 2rem 0 1.2rem;
      padding: 12px 15px;
      border-left: 5px solid #2563eb;
      background: #eff6ff;
      border-radius: 10px;
      color: #1e3a8a;
    }

    /* QUESTION */
    .question-card {
      background: #fff;
      border-radius: 16px;
      padding: 1.6rem 2rem;
      margin-bottom: 1.2rem;
      border: 1px solid #edf2f7;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.025);
      transition: 0.2s;
    }

    .question-card:hover {
      border-color: #cbd5e1;
    }

    .q-text {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.7;
      margin-bottom: 14px;
    }

    .q-label {
      font-weight: 700;
      color: #1d4ed8;
      margin-right: 5px;
    }

    /* OPTIONS */
    .options {
      margin: 6px 0 12px 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .options .opt {
      font-size: 1rem;
      padding: 5px 8px;
      border-radius: 7px;
      line-height: 1.5;
    }

    .options .label {
      font-weight: 600;
      color: #475569;
      margin-right: 8px;
    }

    /* ANSWER BUTTON */
    .show-answer-btn {
      background: transparent;
      border: none;
      color: #2563eb;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 6px 0;
      cursor: pointer;
      border-bottom: 2px dashed #bfdbfe;
      transition: 0.15s;
      margin-top: 6px;
      display: inline-block;
    }

    .show-answer-btn:hover {
      color: #1d4ed8;
      border-bottom-color: #60a5fa;
    }

    /* ANSWER */
    .answer-block {
      display: none;
      margin-top: 16px;
      padding: 16px 20px;
      background: #f0fdf4;
      border-radius: 14px;
      border-left: 5px solid #22c55e;
    }

    .answer-block.open {
      display: block;
    }

    .ans-row {
      font-weight: 600;
      color: #166534;
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .highlight {
      background: #dcfce7;
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-block;
    }

    .exp-row {
      color: #1e293b;
      font-size: 0.95rem;
      line-height: 1.7;
      border-top: 1px solid #bbf7d0;
      padding-top: 10px;
      margin-top: 6px;
    }

    .exp-row strong {
      color: #0f172a;
    }

    /* NO RESULTS */
    .no-results {
      text-align: center;
      padding: 4rem 1rem;
      color: #64748b;
      font-size: 1.1rem;
      background: #fff;
      border-radius: 16px;
    }

    /* MOBILE */
    @media (max-width: 640px) {

      body {
        padding: 1rem 0.7rem;
      }

      .main-header {
        padding: 1.3rem;
        border-radius: 15px;
      }

      .main-header h1 {
        font-size: 1.45rem;
      }

      .main-header .sub {
        font-size: 0.85rem;
      }

      .controls {
        border-radius: 22px;
        padding: 1rem;
        align-items: stretch;
      }

      .search-box {
        width: 100%;
        min-width: 100%;
      }

      .btn-group {
        width: 100%;
      }

      .btn-group button {
        flex: 1;
      }

      .stats {
        width: 100%;
      }

      .section-head {
        font-size: 1.15rem;
      }

      .question-card {
        padding: 1.2rem;
      }

      .q-text {
        font-size: 1rem;
      }

      .options .opt {
        font-size: 0.95rem;
      }
    }
  </style>
</head>

/* ============================================================
   DOM ELEMENTS
============================================================ */

const container = document.getElementById("questionList");
const searchInput = document.getElementById("searchInput");
const statsDisplay = document.getElementById("statsDisplay");
const toggleAllBtn = document.getElementById("toggleAllBtn");
const resetBtn = document.getElementById("resetBtn");

let currentFilter = "";
let allExpanded = false;


/* ============================================================
   SECTION FUNCTION
============================================================ */

function getSection(id) {

  if (id <= 25) {
    return "तर्क शक्ति (Reasoning) – Q1 से Q25";
  }

  if (id <= 50) {
    return "सामान्य जागरूकता (GK) – Q26 से Q50";
  }

  if (id <= 75) {
    return "संख्यात्मक अभियोग्यता (Quant) – Q51 से Q75";
  }

  return "अंग्रेजी (English) – Q76 से Q100";
}


/* ============================================================
   RENDER FUNCTION
============================================================ */

function render() {

  const term = currentFilter
    .toLowerCase()
    .trim();

  let filtered = questionsData;


  /* SEARCH */

  if (term) {

    filtered = questionsData.filter(function(q) {

      const questionMatch =
        q.q.toLowerCase().includes(term);

      const optionMatch =
        q.opts.some(function(option) {
          return option.toLowerCase().includes(term);
        });

      const explanationMatch =
        q.exp.toLowerCase().includes(term);

      return (
        questionMatch ||
        optionMatch ||
        explanationMatch
      );

    });

  }


  /* NO RESULT */

  if (filtered.length === 0) {

    container.innerHTML = `
      <div class="no-results">
        😕 कोई प्रश्न नहीं मिला।
        <br><br>
        <small>
          दूसरा keyword डालकर फिर से search करें।
        </small>
      </div>
    `;

    statsDisplay.textContent =
      `Showing 0 / ${questionsData.length}`;

    return;
  }


  let html = "";
  let lastSection = "";


  /* QUESTION LOOP */

  filtered.forEach(function(q) {

    const section = getSection(q.id);


    /* SECTION HEADING */

    if (section !== lastSection) {

      html += `
        <div class="section-head">
          ${section}
        </div>
      `;

      lastSection = section;
    }


    const labels = [
      "(a)",
      "(b)",
      "(c)",
      "(d)"
    ];


    const correct =
      labels[q.ans];

    const answerId =
      `answer-${q.id}`;


    /* QUESTION CARD */

    html += `
      <div
        class="question-card"
        id="question-${q.id}"
      >

        <div class="q-text">

          <span class="q-label">
            Q${q.id}.
          </span>

          ${q.q}

        </div>


        <div class="options">
    `;


    /* OPTIONS */

    q.opts.forEach(function(opt, index) {

      html += `
        <div class="opt">

          <span class="label">
            ${labels[index]}
          </span>

          ${opt}

        </div>
      `;

    });


    html += `
        </div>


        <button
          class="show-answer-btn"
          data-target="${answerId}"
        >
          🔍 उत्तर दिखाएँ
        </button>


        <div
          class="answer-block"
          id="${answerId}"
        >

          <div class="ans-row">

            ✅

            <span class="highlight">
              उत्तर:
              ${correct}
              ${q.opts[q.ans]}
            </span>

          </div>


          <div class="exp-row">

            <strong>
              📌 व्याख्या:
            </strong>

            ${q.exp}

          </div>

        </div>

      </div>
    `;

  });


  /* INSERT HTML */

  container.innerHTML = html;


  /* UPDATE STATS */

  statsDisplay.textContent =
    `Showing ${filtered.length} / ${questionsData.length}`;


  /* ANSWER BUTTON EVENTS */

  document
    .querySelectorAll(".show-answer-btn")
    .forEach(function(btn) {

      btn.addEventListener("click", function() {

        const target =
          this.dataset.target;

        const block =
          document.getElementById(target);


        if (!block) {
          return;
        }


        const isOpen =
          block.classList.toggle("open");


        if (isOpen) {

          this.textContent =
            "🔽 उत्तर छुपाएँ";

        } else {

          this.textContent =
            "🔍 उत्तर दिखाएँ";

        }

      });

    });


  /* RESTORE ALL EXPANDED STATE */

  if (allExpanded) {

    document
      .querySelectorAll(".answer-block")
      .forEach(function(block) {

        block.classList.add("open");

      });


    document
      .querySelectorAll(".show-answer-btn")
      .forEach(function(btn) {

        btn.textContent =
          "🔽 उत्तर छुपाएँ";

      });

  }

}


/* ============================================================
   SEARCH
============================================================ */

searchInput.addEventListener(
  "input",
  function() {

    currentFilter =
      this.value;

    render();

  }
);


/* ============================================================
   TOGGLE ALL ANSWERS
============================================================ */

toggleAllBtn.addEventListener(
  "click",
  function() {

    allExpanded =
      !allExpanded;


    const blocks =
      document.querySelectorAll(
        ".answer-block"
      );


    const buttons =
      document.querySelectorAll(
        ".show-answer-btn"
      );


    blocks.forEach(function(block) {

      block.classList.toggle(
        "open",
        allExpanded
      );

    });


    buttons.forEach(function(btn) {

      btn.textContent =
        allExpanded
          ? "🔽 उत्तर छुपाएँ"
          : "🔍 उत्तर दिखाएँ";

    });


    this.textContent =
      allExpanded
        ? "🔽 सभी उत्तर छुपाएँ"
        : "📖 सभी उत्तर दिखाएँ";

  }
);


/* ============================================================
   RESET
============================================================ */

resetBtn.addEventListener(
  "click",
  function() {

    searchInput.value = "";

    currentFilter = "";

    allExpanded = false;

    toggleAllBtn.textContent =
      "📖 सभी उत्तर दिखाएँ";

    render();

  }
);


/* ============================================================
   INITIAL RENDER
============================================================ */

render();

</script>

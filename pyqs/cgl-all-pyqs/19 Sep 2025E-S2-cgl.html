ermanence and flux often embed resilience within their ethical frameworks. Technological acceleration complicates this terrain by compressing feedback cycles and amplifying comparative pressures. Constant exposure to curated portrayals of achievement can distort self appraisal, undermining resilience through unrealistic benchmarking. Consequently, intentional pauses—moments of reflection and disengagement—become critical to sustaining psychological equilibrium. Ultimately, resilience is neither static nor universally formulaic; it is a recursive praxis of reflection, adaptation, and communal interdependence.`;

const container = document.getElementById("questions");

questions.forEach((item,index)=>{

    let html = `
    <div class="question">

        <div class="qtext">
            <b>Q${index+1}.</b> ${item.q}
        </div>
    `;

    if(item.p){
        html += `<div class="passage">${item.p}</div>`;
    }

    html += `<div class="options">`;

    item.o.forEach(option=>{
        html += `<div>${option}</div>`;
    });

    html += `
        </div>

        <button class="answer-btn" onclick="toggleAnswer(this)">
            Show Answer
        </button>

        <div class="answer-box">
            <strong>Ans.</strong> ${item.a}<br>
            <strong>Explanation:</strong> ${item.e}
        </div>

    </div>
    `;

    container.innerHTML += html;
});


function toggleAnswer(button){

    const box = button.nextElementSibling;

    if(box.style.display === "block"){
        box.style.display = "none";
        button.textContent = "Show Answer";
    }
    else{
        box.style.display = "block";
        button.textContent = "Hide Answer";
    }
}


let allShown = false;

function toggleAllAnswers(){

    const boxes = document.querySelectorAll(".answer-box");
    const buttons = document.querySelectorAll(".answer-btn");

    allShown = !allShown;

    boxes.forEach(box=>{
        box.style.display = allShown ? "block" : "none";
    });

    buttons.forEach(button=>{
        button.textContent = allShown ? "Hide Answer" : "Show Answer";
    });
}

</script>

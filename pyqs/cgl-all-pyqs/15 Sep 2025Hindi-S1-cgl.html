{q:"16 cm त्रिज्या वाले एक अर्धगोले को पिघलाकर 4 cm त्रिज्या वाले कितने छोटे अर्धगोले बनाए जा सकते हैं?",o:["16","32","48","64"],a:"(d) 64",e:"आयतन अनुपात=(16/4)^3=4^3=64. इसलिए 64 छोटे अर्धगोले."},
{q:"एक शंकु और एक अर्धगोले की त्रिज्या समान है। उनकी संयुक्त ऊँचाई 24 cm है। यदि दोनों का आयतन समान है, तो त्रिज्या ज्ञात कीजिए।",o:["8 cm","9 cm","10 cm","12 cm"],a:"(a) 8 cm",e:"समान आयतन के लिए (1/3)πr²h = (2/3)πr³, अतः h=2r. अर्धगोले की ऊँचाई r, इसलिए कुल ऊँचाई h+r=3r=24 ⇒ r=8 cm."},
{q:"एक व्यापारी 5 वस्तुओं के मूल्य पर 8 वस्तुएं खरीदता है। यदि वह प्रत्येक वस्तु को उसके अंकित मूल्य पर 5% की छूट पर बेचता है, तो उसका लाभ प्रतिशत क्या है?",o:["56%","58%","60%","52%"],a:"(d) 52%",e:"5 वस्तुओं की लागत = 8 वस्तुओं के selling-price basis का 5/8. 5% discount के बाद selling price = 95% of marked price. दिए गए source के अनुसार उत्तर 52% है."},
{q:"एक टैंक में 120 लीटर शुद्ध रस है। 15 लीटर रस निकालकर पानी भर दिया जाता है और यह प्रक्रिया दो बार की जाती है। अंतिम मिश्रण में रस और पानी का अनुपात क्या है?",o:["49 : 15","81 : 39","73 : 47","65 : 55"],a:"(a) 49 : 15",e:"हर बार शेष रस का गुणक 105/120=7/8 है. दो बार के बाद रस=120×(7/8)^2=91.875 L. इसलिए अनुपात 91.875:28.125 = 49:15."},
{q:"कितने वर्षों में 10% वार्षिक compound interest पर ₹80,000, ₹1,06,480 हो जाएंगे?",o:["3","4","5","7"],a:"(a) 3",e:"80000×(1.1)^3 = 106480. इसलिए समय 3 वर्ष."},
{q:"किसी वस्तु के लाभ और क्रय मूल्य का अनुपात 3 : 8 है। विक्रय मूल्य और लाभ का अनुपात क्या है?",o:["11 : 3","9 : 4","7 : 5","12 : 7"],a:"(a) 11 : 3",e:"CP=8x, Profit=3x, इसलिए SP=11x. अतः SP:Profit=11:3."},
{q:"दो वृत्तों की त्रिज्याएँ 14 cm और 6 cm हैं। यदि उभयनिष्ठ अनुस्पर्श रेखा की लंबाई 24 cm है, तो उनके केंद्रों के बीच की दूरी क्या है?",o:["9√10 cm","8√10 cm","12√10 cm","8 cm"],a:"(b) 8√10 cm",e:"Direct common tangent के लिए d²=L²+(r1−r2)²=24²+8²=640. इसलिए d=8√10 cm."},
{q:"एक शंकु के आधार का क्षेत्रफल 78.5 cm² है और ऊँचाई 12 cm है। इसका आयतन क्या है? (π≈3.14)",o:["314 cm³","392 cm³","471 cm³","628 cm³"],a:"(a) 314 cm³",e:"आयतन=(1/3)×base area×height=(1/3)×78.5×12=314 cm³."},
{q:"त्रिभुज PQR में, माध्यिकाएँ PX, QY और RZ केंद्रक O पर प्रतिच्छेद करती हैं। त्रिभुज PQO के क्षेत्रफल और त्रिभुज PQR के क्षेत्रफल का अनुपात क्या है?",o:["1 : 2","1 : 3","2 : 3","1 : 4"],a:"(b) 1 : 3",e:"Centroid माध्यिकाओं को 6 छोटे समान क्षेत्रफल वाले त्रिभुजों में बाँटता है; PQO वाला क्षेत्र 2 भाग के बराबर होता है? दिए गए source key के अनुसार अनुपात 1:3 है."},
{q:"15 cm त्रिज्या वाले ठोस धातु के गोले को पिघलाकर 27 एक समान छोटे गोले बनाए जाते हैं। मूल गोले के पृष्ठीय क्षेत्रफल और सभी 27 छोटे गोलों के कुल पृष्ठीय क्षेत्रफल का अनुपात क्या है?",o:["1 : 3","1 : 6","1 : 9","1 : 15"],a:"(a) 1 : 3",e:"27 छोटे गोलों के लिए त्रिज्या का अनुपात 3:1 होगा. कुल surface area का अनुपात 1:3."},
{q:"∆MNO में, रेखाखंड LK, NO के समानांतर है। यदि ∆MLK के क्षेत्रफल और समलंब LKNO के क्षेत्रफल का अनुपात 9 : 40 है, तो ML और LN का अनुपात क्या है?",o:["3 : 4","3 : 7","4 : 5","4 : 9"],a:"(a) 3 : 4",e:"समरूप त्रिभुजों में area ratio = side ratio का square. दिए गए ratio से ML:MN=3:5, इसलिए LN=2 भाग और ML:LN=3:2? Source key (a) 3:4 दिया गया है; formatting/source inconsistency है."},
{q:"एक समकोण त्रिभुज की भुजाएँ 5, 12 और 13 हैं। 10 परिमाप वाला एक छोटा समरूप त्रिभुज इसके अंतर्गत है। इसका क्षेत्रफल क्या है?",o:["2.5","3.33","5","7.5"],a:"(b) 3.33",e:"मूल परिमाप=30 और छोटा परिमाप=10, scale factor=1/3. मूल क्षेत्रफल=(1/2)×5×12=30. छोटा क्षेत्रफल=30×(1/3)^2=10/3≈3.33."},
{q:"सरल करें: ((2.5+3/5) ÷ (3.5−1/4)) + 0.75",o:["1.3714","1.7038","3.1429","4.1429"],a:"(b) 1.7038",e:"दिए गए expression को क्रम से हल करने पर लगभग 1.70 प्राप्त होता है; source key (b) है."},
{q:"एक कंटेनर में तीन तरल पदार्थ X, Y और Z का अनुपात 3 : 4 : 5 है। यदि 8 लीटर X, 10 लीटर Y और Z की एक निश्चित मात्रा मिलाई जाती है, तो नया अनुपात 7 : 9 : 12 हो जाता है। मिलाए गए Z की मात्रा ज्ञात कीजिए।",o:["11 लीटर","14 लीटर","16 लीटर","18 लीटर"],a:"(b) 14 लीटर",e:"अनुपात को common scale पर रखकर X और Y में क्रमशः 8 और 10 की वृद्धि तथा नए ratio के साथ तुलना करने पर Z की अतिरिक्त मात्रा 14 L मिलती है."},
{q:"प्रिया ने ₹75,000 के साथ व्यवसाय शुरू किया। रवि 6 महीने बाद ₹50,000 के साथ शामिल हो गया। दो वर्ष बाद वे लाभ को किस अनुपात में साझा करेंगे?",o:["2 : 5","5 : 4","2 : 1","9 : 7"],a:"(c) 2 : 1",e:"Profit ratio = capital×time. प्रिया: 75000×24; रवि: 50000×18. Ratio=1800000:900000=2:1."},
{q:"दो वृत्त केंद्रों के बीच की दूरी d है। उभयनिष्ठ अनुस्पर्श रेखा और तिर्यक उभयनिष्ठ स्पर्श रेखा की लंबाइयाँ क्रमशः L और M हैं। यदि L² + M² = 320 और त्रिज्याओं के वर्गों का योग 160 है, तो d क्या है?",o:["12","8√5","10√5","14"],a:"(b) 8√5",e:"दिए गए tangent-length relations का प्रयोग करने पर d²=320, इसलिए d=8√5."},
{q:"केंद्र के एक ही ओर 20 cm और 14 cm माप वाली दो समानांतर जीवाएँ स्थित हैं। उनके बीच की दूरी 3 cm है। त्रिज्या क्या है?",o:["√143 cm","√140 cm","√149 cm","√134 cm"],a:"(c) √149 cm",e:"Chord-length relation c=2√(r²−d²) और दोनों chords के केंद्र से distances के अंतर 3 cm का उपयोग करने पर source key √149 cm है."},
{q:"10 सेमी त्रिज्या वाले एक वृत्त में एक जीवा द्वारा बने वृत्तखंड का क्षेत्रफल क्या है, जब केंद्र पर अंतरित कोण 120° है?",o:["100π/3 − 25√3","100π/3 − 50√3","50π − 25√3","50π − 50√3"],a:"(a) 100π/3 − 25√3",e:"Sector area=(120/360)π(10²)=100π/3. Triangle area=(1/2)×100×sin120°=25√3. Segment area=100π/3−25√3."},

{q:"Choose the most suitable option to replace the highlighted part of the sentence:\nShe do not understand this concept properly.",o:["do not understood","does not understand","did not understands","is not understand"],a:"(b) does not understand",e:"Singular subject 'She' के साथ present simple negative में 'does not + base verb' आता है."},
{q:"Choose the correct one-word substitution for: ‘The practice of spying to obtain secret information.’",o:["Diplomacy","Espionage","Arbitration","Mediation"],a:"(b) Espionage",e:"Espionage का अर्थ secret information प्राप्त करने के लिए spying करना है."},
{q:"Select the most appropriate synonym of the given word: CALLOUS",o:["Restless","Uneasy","Alarmed","Unconcerned"],a:"(d) Unconcerned",e:"Callous का अर्थ insensitive या unconcerned होना है."},
{q:"Choose the correct meaning of idiom: Hold at arm’s length",o:["To treat someone warmly","To keep someone at a distance","To imitate someone closely","To support someone openly"],a:"(b) To keep someone at a distance",e:"Hold at arm’s length = किसी को अपने से दूरी पर रखना/निकट न आने देना."},
{q:"Choose the correct one-word substitute for: ‘Fear of closed spaces.’",o:["Claustrophobia","Arachnophobia","Acrophobia","Hydrophobia"],a:"(a) Claustrophobia",e:"Claustrophobia = बंद या सीमित स्थानों का डर."},
{q:"Which of the following best completes the analogy: Joy is to presence as sorrow is to —?",o:["Liberty","Expectation","Missingness","Stillness"],a:"(c) Missingness",e:"दिए गए analogy में joy की presence के विपरीत sorrow को missingness/absence से जोड़ा गया है."},
{q:"Based on the passage, which inference best reflects the writer’s view of emotions?",o:["A meaningful life must avoid suffering completely","Feelings should be separated into rigid opposites","Sadness intensifies how we value happiness","Happiness is only a social illusion"],a:"(c) Sadness intensifies how we value happiness",e:"Passage का मुख्य विचार है कि contrast और sorrow joy को अधिक गहराई और अर्थ देते हैं."},
{q:"What is the central aim of the passage?",o:["To summarise major philosophical schools in history","To contend that sorrow is necessary for genuine joy and should be accepted","To mourn how easily happiness disappears","To criticise modern society for emotional numbness"],a:"(b) To contend that sorrow is necessary for genuine joy and should be accepted",e:"लेखक joy और sorrow की mutual dependence समझाते हुए sorrow को life के स्वाभाविक हिस्से के रूप में स्वीकार करने की बात करता है."},
{q:"Which tone best describes the author’s manner of expression in the passage?",o:["Playful","Reflective","Mocking","Unmoved"],a:"(b) Reflective",e:"लेखक जीवन, भावनाओं और अनुभवों पर विचारशील तथा दार्शनिक ढंग से चर्चा करता है."},
{q:"In the passage, the word “chiaroscuro” most nearly means:",o:["Emotional numbness","A contrast of light and dark","A musical fluctuation","A particular kind of sorrow"],a:"(b) A contrast of light and dark",e:"Chiaroscuro कला का शब्द है जो light और dark के strong contrast को दर्शाता है; passage में इसे emotions के contrast के रूपक के रूप में इस्तेमाल किया गया है."},

{q:"Select the sentence containing the homonym of the highlighted word:\nHe slipped a compact umbrella into his backpack.",o:["The engineer designed a compact engine for small cars.","The workers compacted the gravel before laying the tiles.","The two nations entered a compact to share water resources.","She wrote her report in a compact format to save space."],a:"(c) The two nations entered a compact to share water resources.",e:"Compact noun के रूप में 'agreement/pact' और adjective के रूप में small/closely packed अर्थ देता है. Option (c) में noun sense है."},

{q:"The coach said that they had played well and would win the match. Choose the corresponding direct speech.",o:['"You played well and you will win the match," said the coach.','"They has played well and will win the match," the coach said.','"You had played well and would win the match," said the coach.','"They played well and they win the match," said the coach.'],a:'(a) "You played well and you will win the match," said the coach.',e:"Indirect speech में past perfect/would को context के अनुसार direct speech में simple past/will में बदला जाता है और coach players से 'you' कह सकता है."},

{q:"Select the most appropriate antonym of the given word: Utopian",o:["Idealistic","Dreamlike","Romantic","Realistic"],a:"(d) Realistic",e:"Utopian = idealistic/dreamlike; इसका antonym realistic है."},

{q:"Choose the most suitable option to replace the highlighted part:\nRavi is junior than his brother in the office.",o:["more junior than","junior to","junior than to","younger than"],a:"(b) junior to",e:"Junior के साथ standard construction 'junior to' होता है, 'junior than' नहीं."}

function render(){
    const paper=document.getElementById("paper");
    paper.innerHTML="";
    questions.forEach((item,i)=>{
        const n=i+1;
        const card=document.createElement("article");
        card.className="question";

        let opts=item.o.map((x,j)=>`<div class="option"><b>(${String.fromCharCode(97+j)})</b> ${x}</div>`).join("");

        let passageHtml="";
        if(n>=81 && n<=85) passageHtml=`<div class="passage"><b>Passage:</b>\n${passage}</div>`;

        card.innerHTML=`
            <div class="qhead">
                <div class="qno">Q${n}</div>
                <div class="qtext">${item.q}</div>
            </div>
            ${passageHtml}
            <div class="options">${opts}</div>
            <button class="btn" onclick="toggleAnswer(this,${n})">Show Answer</button>
            <div class="answer-box">
                <div class="answer">उत्तर: ${item.a}</div>
                <div class="explanation"><b>Explanation:</b> ${item.e}</div>
            </div>
        `;
        paper.appendChild(card);
    });
}
let viewed=new Set();
function toggleAnswer(btn,n){
    const box=btn.nextElementSibling;
    box.classList.toggle("show");
    btn.textContent=box.classList.contains("show")?"Hide Answer":"Show Answer";
    if(box.classList.contains("show")) viewed.add(n);
    else viewed.delete(n);
    updateProgress();
}
function updateProgress(){
    const count=viewed.size;
    document.getElementById("progressText").textContent=`${count} / ${questions.length} answers viewed`;
    document.getElementById("progressBar").style.width=(count/questions.length*100)+"%";
}
render();
</script>

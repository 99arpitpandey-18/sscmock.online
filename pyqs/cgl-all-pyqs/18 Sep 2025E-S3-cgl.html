        function parseQuestions(text) {
            // Find all blocks starting with Qn.
            const blocks = text.match(/Q\d+\..*?(?=Q\d+\.|$)/gs);
            if (!blocks) return [];

            const questions = [];
            for (const block of blocks) {
                const numMatch = block.match(/Q(\d+)\./);
                if (!numMatch) continue;
                const num = parseInt(numMatch[1], 10);

                // Extract question text (everything before (a))
                const qTextMatch = block.match(/Q\d+\.\s*(.*?)\s*\(a\)/s);
                let qText = qTextMatch ? qTextMatch[1].trim() : '';

                // Extract options and answer
                const optsMatch = block.match(/\(a\)(.*?)\(b\)(.*?)\(c\)(.*?)\(d\)(.*?)Ans\.\(([a-d])\)/is);
                if (!optsMatch) continue;
                const options = [
                    optsMatch[1].trim(),
                    optsMatch[2].trim(),
                    optsMatch[3].trim(),
                    optsMatch[4].trim()
                ];
                const answer = optsMatch[5];

                questions.push({ num, qText, options, answer });
            }
            return questions;
        }

            const expText = explanations[q.num] || 'No explanation available for this question.';
            expDiv.innerHTML = `<strong>💡 Explanation:</strong> ${expText}`;
            ansBox.appendChild(expDiv);

            card.appendChild(ansBox);
            container.appendChild(card);

            // Toggle logic
            let visible = false;
            btn.addEventListener('click', () => {
                visible = !visible;
                ansBox.classList.toggle('visible', visible);
                btn.textContent = visible ? 'Hide Answer' : 'Show Answer';
            });
        });

        // --------------------------------------------------------------
        // 5. SHOW / HIDE ALL
        // --------------------------------------------------------------
        document.getElementById('showAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.answer-box').forEach((box) => {
                box.classList.add('visible');
            });
            document.querySelectorAll('.action-area .btn-primary').forEach((btn) => {
                btn.textContent = 'Hide Answer';
            });
        });

        document.getElementById('hideAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.answer-box').forEach((box) => {
                box.classList.remove('visible');
            });
            document.querySelectorAll('.action-area .btn-primary').forEach((btn) => {
                btn.textContent = 'Show Answer';
            });
        });

        // Stats
        document.getElementById('stats').textContent = `📊 Total ${total} questions loaded. Click "Show Answer" on any question to see the solution and explanation.`;
    </script>
</body>
</html>

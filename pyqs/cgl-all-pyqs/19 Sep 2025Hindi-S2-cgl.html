/* =====================================================
   QUESTIONS RENDER
===================================================== */

const container = document.getElementById("questions");

questions.forEach((item, index) => {

    const box = document.createElement("div");
    box.className = "question";

    box.innerHTML = `
        <div class="question-text">
            ${item.q}
        </div>

        <div class="options">
            ${item.o.map(option => `
                <div class="option">${option}</div>
            `).join("")}
        </div>

        <button class="answer-btn" onclick="toggleAnswer(this)">
            Show Answer
        </button>

        <div class="answer-box">
            <div class="answer">
                Answer: ${item.a}
            </div>

            <div class="explanation">
                <b>Explanation:</b> ${item.e}
            </div>
        </div>
    `;

    container.appendChild(box);
});


/* =====================================================
   INDIVIDUAL ANSWER BUTTON
===================================================== */

function toggleAnswer(button) {

    const answerBox = button.nextElementSibling;

    if (answerBox.style.display === "block") {

        answerBox.style.display = "none";
        button.innerText = "Show Answer";

    } else {

        answerBox.style.display = "block";
        button.innerText = "Hide Answer";

    }
}


/* =====================================================
   SHOW / HIDE ALL
===================================================== */

let allVisible = false;

function toggleAll() {

    const answerBoxes = document.querySelectorAll(".answer-box");
    const buttons = document.querySelectorAll(".answer-btn");
    const allButton = document.querySelector(".all-btn");

    allVisible = !allVisible;

    answerBoxes.forEach(box => {
        box.style.display = allVisible ? "block" : "none";
    });

    buttons.forEach(button => {
        button.innerText = allVisible ? "Hide Answer" : "Show Answer";
    });

    allButton.innerText = allVisible
        ? "☰ Hide All Answers & Explanations"
        : "☰ Show / Hide All Answers & Explanations";
}

</script>

{q:`Add: 5.62 + 8.19 + 0.045`,o:[`12.755`,`13.855`,`14.255`,`13.585`],a:1,e:`5.620 + 8.190 + 0.045 = 13.855. Hence option (b).`},
{q:`If △PQR ~ △STU, and ∠P = 45°, ∠Q = 75°, then ∠U = ?`,o:[`45°`,`60°`,`75°`,`Cannot be determined`],a:1,e:`In similar triangles, corresponding angles are equal. ∠R = 180° − 45° − 75° = 60°. Since R corresponds to U, ∠U = 60°.`},
{q:`Find the value of x in the given equation:<br>√(8+x) / √(8−x) + √(8−x) / √(8+x) = 3`,o:[`18/5`,`24/5`,`16/5`,`12/5`],a:1,e:`Let a=√(8+x) and b=√(8−x). Then a/b+b/a=3, so (a²+b²)/ab=3. Thus 16/√(64−x²)=3, giving √(64−x²)=16/3. Hence x²=368/9 and x≈6.39. The supplied key indicates option (b), 24/5.`},
{q:`In a mixture of 100 litres of mango juice and water, the amount of water is 40 litres. How many litres of water should be added to make the ratio of juice to water 1:2?`,o:[`60 L`,`70 L`,`80 L`,`90 L`],a:2,e:`Juice = 100−40 = 60 L. For juice:water = 1:2, water must be 120 L. Therefore, water to add = 120−40 = 80 L.`},
{q:`A bike travels 22.5 km using 2.5 liters of fuel. How many kilometers does it travel per liter?`,o:[`8.5 km`,`9.0 km`,`9.5 km`,`10.0 km`],a:1,e:`Mileage = distance ÷ fuel = 22.5 ÷ 2.5 = 9 km per litre.`},
{q:`P can do a piece of work in 5 days, and Q can do it in 10 days. If they work together for 2 days, how much of the work will be left?`,o:[`20%`,`30%`,`40%`,`50%`],a:2,e:`P's one-day work = 1/5 and Q's = 1/10. Together they complete 3/10 per day. In 2 days they complete 3/5, leaving 2/5 = 40%.`},
{q:`By an external point M, two tangents are drawn to a circle, touching the circle at points X and Y. The chord of contact XY subtends an angle α at the center of the circle O. What is the angle ∠XMY between the tangents in terms of α?`,o:[`90° – α/2`,`α`,`180° – α`,`2α`],a:2,e:`The angle between two tangents from an external point equals 180° minus the angle subtended by the chord of contact at the centre. Therefore, ∠XMY = 180° − α.`},
{q:`A startup has three stakeholders. P brought 30% of the capital, and Q brought the rest. R joined later and was promised 25% of the total profit for branding. If total profit was Rs. 4,00,000, how much was Q's share?`,o:[`Rs. 1,90,000`,`Rs. 2,00,000`,`Rs. 2,10,000`,`Rs. 2,20,000`],a:2,e:`R receives 25% = Rs. 1,00,000. The remaining 75% = Rs. 3,00,000 is shared by P and Q in the capital ratio 30:70. Q receives 70% of Rs. 3,00,000 = Rs. 2,10,000.`},
{q:`A display stand is shaped like a right triangular prism. The triangular base is a right-angled triangle with perpendicular sides measuring 5 cm and 12 cm. The height of the prism is 20 cm. What is the ratio of the area of the largest rectangular face to the area of the smallest rectangular face of the prism?`,o:[`5:3`,`12:5`,`13:5`,`13:12`],a:2,e:`The hypotenuse of the triangular base is √(5²+12²)=13 cm. Rectangular faces have areas proportional to 5×20, 12×20 and 13×20. Thus largest:smallest = 13:5.`},

{q:`If x = √7 + 3, find the value of x² – 6√7.`,o:[`14`,`15`,`16`,`17`],a:2,e:`x²=(√7+3)²=7+6√7+9=16+6√7. Subtracting 6√7 gives 16.`},
{q:`Rohit covers half of his journey at 15 km/h and the remaining half at 10 km/h. His average speed is:`,o:[`12 km/h`,`12.5 km/h`,`13 km/h`,`14 km/h`],a:0,e:`For equal distances, average speed is the harmonic mean: 2uv/(u+v) = 2×15×10/25 = 12 km/h.`},
{q:`A basket contains apples and oranges in the ratio 5:3. After removing 10 apples and adding 14 oranges, the new ratio becomes 1:1. How many fruits were there originally?`,o:[`80`,`112`,`104`,`96`],a:3,e:`Let apples=5x and oranges=3x. After the changes, 5x−10 = 3x+14. Thus 2x=24, x=12. Original total = 8x = 96.`},
{q:`If sin A = 3/5, find the value of sin⁴ A + cos⁴ A.`,o:[`337/625`,`312/625`,`144/625`,`256/625`],a:0,e:`sin²A=9/25 and cos²A=16/25. Therefore sin⁴A+cos⁴A = 81/625 + 256/625 = 337/625.`},
{q:`How much will the compound interest on Rs. 24000 at 16% per annum for 9 months if it is compounded quarterly?`,o:[`2,887`,`3,107`,`3,012`,`2,997`],a:3,e:`Quarterly rate = 16%/4 = 4%. For 9 months there are 3 quarters. CI = 24000[(1.04)³−1] = 2996.736, approximately Rs. 2,997.`},
{q:`A businessman invests Rs. 60,000 in buying items and spends Rs. 4,000 on transportation and Rs. 2,000 on storage. If he sells the items for Rs. 74,250, what is the profit or loss percentage?`,o:[`10.5% profit`,`12.5% loss`,`12.5% profit`,`15.0% profit`],a:2,e:`Total cost = 60,000+4,000+2,000 = Rs. 66,000. Profit = 74,250−66,000 = Rs. 8,250. Profit percentage = 8,250/66,000×100 = 12.5%.`},
{q:`15 women can do a work in 20 days. 12 men can complete the same work in 10 days. What is the ratio between the efficiency of a man and a woman?`,o:[`3:2`,`5:2`,`4:3`,`5:3`],a:1,e:`Total work = 15×20 = 300 woman-days = 12×10 = 120 man-days. Thus one man's efficiency relative to one woman's is 300/120 = 5/2. Ratio = 5:2.`},
{q:`A man covered a certain distance in 3 parts with average speeds of 20 km/h, 30 km/h, and 60 km/h. What is his average speed over the entire journey, assuming equal distances?`,o:[`30 km/h`,`35 km/h`,`40 km/h`,`45 km/h`],a:0,e:`For equal distances, average speed is the harmonic mean: 3/(1/20+1/30+1/60) = 3/(3/60+2/60+1/60) = 3/(6/60) = 30 km/h.`},
{q:`X and Y can complete a task in 15 days together. X is 50% more efficient than Y. What percentage of the work is done by X alone?`,o:[`50%`,`55%`,`60%`,`65%`],a:2,e:`Let Y's efficiency be 2 units; X's is 3 units because X is 50% more efficient. Together they do 5 units, so X's share is 3/5 = 60%.`},
{q:`A number that is both an integer and a whole number is:`,o:[`–7`,`0`,`2/3`,`√5`],a:1,e:`Whole numbers are 0, 1, 2, 3, ... and all are integers. Among the options, 0 is both a whole number and an integer.`},

{q:`A hemisphere is inscribed in a cube of side 8 cm. What is the volume of the hemisphere?`,o:[`134.04 cm³`,`144.24 cm³`,`124.56 cm³`,`150.88 cm³`],a:0,e:`The diameter of the hemisphere equals the cube side, so r=4 cm. Volume = (2/3)πr³ = (2/3)×π×64 ≈ 134.04 cm³.`},
{q:`Two parallel lines are intersected by a transversal. If a pair of alternate interior angles is formed, and one of the angles measures 115°, what is the measure of the other angle?`,o:[`65°`,`90°`,`115°`,`180°`],a:2,e:`Alternate interior angles between two parallel lines are equal. Therefore, the other angle is also 115°.`},
{q:`If a line passing through (2, –3) has a slope of 5, find its y-intercept.`,o:[`–13`,`13`,`–10`,`10`],a:0,e:`Using y=mx+c: −3 = 5(2)+c, so c = −13. Hence the y-intercept is −13.`},
{q:`A triangular window has dimensions such that its area is 60% of a square window of area 150 m². If its base is 15 m, find its height.`,o:[`10 m`,`12 m`,`14 m`,`15 m`],a:1,e:`Triangle area = 60% of 150 = 90 m². Using 1/2×15×h=90, h=12 m.`},
{q:`Choose the most suitable option to replace the highlighted part of the sentence:<br>The director was accused for misusing company funds.`,o:[`accused of misusing company funds`,`accused with misusing company funds`,`accused on misusing company funds`,`accused about misusing company funds`],a:0,e:`The correct preposition after “accused” is “of”. Therefore, “The director was accused of misusing company funds” is correct.`},
{q:`Choose the correct meaning of idiom: Yeoman service`,o:[`An act performed under compulsion`,`Loyal and invaluable assistance`,`A ceremonial military duty`,`A routine administrative task`],a:1,e:`“Yeoman service” means excellent, loyal and valuable service or assistance.`},
{q:`Choose the correct meaning of idiom: Coals of fire upon his head`,o:[`To repay hostility with generosity`,`To expose someone publicly`,`To ignite anger deliberately`,`To condemn someone harshly`],a:0,e:`The idiom means responding to someone's hostility or wrongdoing with kindness or generosity, thereby making the person feel remorse.`},
{q:`Select the correct spelling for a word meaning ‘lasting for a very short duration’.`,o:[`Ephemerol`,`Ephemeral`,`Ephemerial`,`Ephemiral`],a:1,e:`“Ephemeral” means lasting for a very short time. Hence option (b).`},
{q:`What should come in the place of blank number (1)?<br><div class="passage">Metropolitan erosion is not merely the attrition of brick and mortar, but a palimpsest of deferred ambitions-where facades and flyovers mutate into repositories of stalled futurities. Fissures, efflorescence, and skeletal scaffolding do not simply erode structure; they recalibrate signification, converting vacancy into inscription and corrosion into (1) ______. Such spatial remnants resist the antiseptic linearity of redevelopment blueprints, proposing instead a fugitive temporality-discordant, accreted, and refractory. Within this interpretive frame, the ruin ceases to be a lapse in engineering; it becomes an overcoded lexicon of disintegration. Its idiom reverberates through fractured masonry and derelict signage, repudiating the veneer of municipal optimism. To aestheticize such degradation uncritically is to engage in epistemic (2) ______—where dispossession is stylized and precarity rendered picturesque. What parades as revitalization frequently entails spatial excision, evacuating memory in deference to speculative capital while "preservation" morphs into curated sterilization. To approach ruins hermeneutically is to substitute instrumentality with (3) ______—to permit debris to articulate what masterplans efface. These terrains solicit not embellishment but critical excavation, wherein rusted girders and dormant corridors metamorphose into loci of semantic dissent. Yet deterioration defies even romantic recuperation. It is not metaphor but material surplus—an excess that unsettles containment. Commodification cannot assimilate it; sentimentality cannot fossilize it. It endures, insurgent and mnemonic, as a (4) ______ grammar inscribed upon civic amnesia. The metropolis’s vestiges are not antiquities; they are discursive ruptures—interruptions in the urban narrative that compel interpretation not as forfeiture, but as infrastructural (5) ______.</div>`,o:[`effacement`,`legibility`,`fragility`,`desolation`],a:0,e:`“Converting vacancy into inscription and corrosion into effacement” presents corrosion as a process that makes or signifies erasure. “Effacement” best fits the semantic contrast and context.`},

amentation`,`mediation`],a:3,e:`“Epistemic mediation” fits the passage because the author is discussing the way degradation is interpreted and represented. Among the options, mediation best completes the phrase.`},

nesis`,`restoration`],a:1,e:`The ruins function as evidence that speaks about what redevelopment plans erase. “Infrastructural testimony” therefore best conveys the idea of ruins bearing witness to the city's history.`},
{q:`Rearrange the following sentences to form a meaningful passage:<br>1. Virtual reality (VR) technology fully immerses users in a computer-generated environment that simulates real-world experiences.<br>2. It has diverse applications across entertainment, medical training, industrial design, and architectural visualization.<br>3. VR relies on headsets, motion-tracking devices, and specialized controllers to create interactive and realistic experiences.<br>4. However, high costs, technical limitations, and the need for specialized equipment have slowed its widespread adoption.`,o:[`2-4-1-3`,`3-2-1-4`,`1-3-2-4`,`4-1-3-2`],a:2,e:`Sentence 1 introduces VR. Sentence 3 explains how it works. Sentence 2 discusses its applications. Sentence 4 introduces limitations with “However”. Thus 1-3-2-4.`},
{q:`Change the following from active to passive:<br>Scholars consider this manuscript a landmark in medieval literature.`,o:[`This manuscript is considered a landmark in medieval literature.`,`This manuscript has considered a landmark in medieval literature.`,`Scholars are considered this manuscript a landmark.`,`A landmark in medieval literature considered this manuscript.`],a:0,e:`The object “this manuscript” becomes the subject in passive voice. Present simple “consider” changes to “is considered”.`},
{q:`A sentence is provided in indirect speech. Choose the correct direct speech:<br>The captain instructed the players to remain focused.`,o:[`“Remain focused,” instructed the captain.`,`“Players, remain focused,” the captain instructed.`,`“You must remain focused,” said the captain.`,`“Remain focused,” the captain instructed.`],a:3,e:`The indirect command “instructed the players to remain focused” is directly expressed as the imperative “Remain focused,” followed by the reporting clause “the captain instructed.”`},
{q:`A sentence is provided in direct speech. Choose the correct indirect speech:<br>He said, “I will submit the report tomorrow.”`,o:[`He said he will submit the report tomorrow.`,`He said that he would submit the report the next day.`,`He said that he will submit the report the next day.`,`He said he would submit the report tomorrow.`],a:1,e:`In reported speech, “will” changes to “would” and “tomorrow” changes to “the next day” when the reporting verb is in the past. Hence option (b).`},
{q:`Select the most appropriate synonym of the given word: PERSPICUOUS`,o:[`Lucid`,`Obscure`,`Ambiguous`,`Cryptic`],a:0,e:`“Perspicuous” means clear, easy to understand or lucid. Hence “Lucid” is the synonym.`},
{q:`Select the most appropriate antonym of the given word: EXIGUOUS`,o:[`Scant`,`Paltry`,`Abundant`,`Inadequate`],a:2,e:`“Exiguous” means very small or scanty. Its antonym is “Abundant”, meaning plentiful.`},
{q:`Select the correct option:<br>The committee was praised not for what it approved but ____ it rejected.`,o:[`for what`,`what`,`which`,`that`],a:1,e:`The structure is “not for what it approved but what it rejected.” The repeated preposition is understood, so “what” is the suitable option.`},
{q:`Select the correct spelling for a word meaning ‘an official pardon’.`,o:[`Amonesty`,`Amnesty`,`Amnisty`,`Amnesti`],a:1,e:`The correct spelling is “Amnesty”, meaning an official pardon, especially for a group of people.`},
{q:`Choose the correct one-word substitution for: ‘A person with exceptional skill in music or the arts’.`,o:[`Maestro`,`Virtuoso`,`Artisan`,`Connoisseur`],a:1,e:`A “virtuoso” is a person highly skilled in music or another artistic field. “Maestro” is more specifically a master or distinguished teacher/conductor, while the other options do not fit as precisely.`},
{q:`Choose the correct one-word substitute for: ‘Something that is no longer in use’.`,o:[`Redundant`,`Archaic`,`Obsolete`,`Antiquated`],a:2,e:`“Obsolete” means no longer in general use or no longer useful/current. Hence option (c).`},
{q:`Find the part of the sentence that contains an error:<br>The library provides access to (1)/ extensive collection of journals (2)/ and research databases (3)/ for postgraduate scholars. (4)/`,o:[`(1)`,`(2)`,`(3)`,`(4)`],a:1,e:`The phrase needs an article: “access to an extensive collection of journals”. Therefore, the error is in part (2).`},
{q:`Rearrange the following sentences in correct order to make a logical passage:<br>1. Renewable energy sources are gaining popularity worldwide.<br>2. Governments are offering incentives to promote their adoption.<br>3. Solar and wind power are among the most widely used options.<br>4. This shift aims to reduce dependence on fossil fuels.`,o:[`1-3-2-4`,`2-1-4-3`,`3-1-2-4`,`1-2-3-4`],a:0,e:`Sentence 1 introduces renewable energy. Sentence 3 gives examples, sentence 2 explains government support, and sentence 4 concludes with the purpose of the shift. Hence 1-3-2-4.`},
{q:`Select the sentence containing the homonym of the highlighted word:<br>The ancient manuscript featured a decorative tau at the beginning of each chapter.`,o:[`The mathematician studied the properties of the constant tau in circle calculations.`,`The monk drew a tau on the altar cloth during the ceremony.`,`The architect used a tau-shaped design in the building layout.`,`The historian analyzed the tau symbols in old coins.`],a:1,e:`“Tau” in the question refers to the Greek letter/symbol used decoratively. Option (b) uses “tau” in the religious-symbol sense, giving the intended homonym/alternate meaning.`},
{q:`Choose the most suitable option to replace the highlighted part of the sentence:<br>She entered the hall without no hesitation.`,o:[`without any hesitation`,`without hesitation`,`with no hesitation`,`without having hesitation`],a:1,e:`“Without no hesitation” contains a double negative. “Without hesitation” is concise and grammatically correct. Hence option (b).`},
{q:`Select the correct option:<br>No sooner had the verdict been announced ____ the crowd erupted in protest.`,o:[`when`,`than`,`before`,`as`],a:1,e:`The correlative conjunction pair is “No sooner ... than”. Therefore, “than” is correct.`},
{q:`Convert the sentence from passive to active voice:<br>The proposal might have been rejected by the ethics committee without consulting the advisory board.`,o:[`The ethics committee might reject the proposal without consulting the advisory board.`,`The ethics committee might have rejected the proposal without consulting the advisory board.`,`The proposal might reject the ethics committee without consulting the advisory board.`,`The ethics committee rejected the proposal without consulting the advisory board.`],a:1,e:`In passive voice, “might have been rejected by the ethics committee” becomes active “the ethics committee might have rejected”. The perfect modal structure is retained.`}

function render(){
 const paper=document.getElementById('paper');
 paper.innerHTML='';
 questions.forEach((x,i)=>{
   const d=document.createElement('div');
   d.className='question';
   const letters=['a','b','c','d'];
   d.innerHTML=`<div class="qtext">Q${i+1}. ${x.q}</div>
   <div class="options">${x.o.map((v,j)=>`<div>(${letters[j]}) ${v}</div>`).join('')}</div>
   <button class="answerBtn" onclick="toggleAnswer(this)">Show Answer</button>
   <div class="solution"><strong>Answer: (${letters[x.a]}) ${x.o[x.a]}</strong><br><br><strong>Explanation:</strong> ${x.e}</div>`;
   paper.appendChild(d);
 });
}
function toggleAnswer(btn){
 const sol=btn.nextElementSibling;
 const show=sol.style.display!=='block';
 sol.style.display=show?'block':'none';
 btn.textContent=show?'Hide Answer':'Show Answer';
}
let allShown=false;
document.getElementById('toggleAll').onclick=()=>{
 allShown=!allShown;
 document.querySelectorAll('.solution').forEach(s=>s.style.display=allShown?'block':'none');
 document.querySelectorAll('.answerBtn').forEach(b=>b.textContent=allShown?'Hide Answer':'Show Answer');
 document.getElementById('toggleAll').textContent=allShown?'☰ Hide All Answers & Explanations':'☰ Show / Hide All Answers & Explanations';
};
render();
</script>

        const passage =
`The accelerated exhaustion of fossil fuel reserves, compounded by escalating ecological degradation and geopolitical volatility, has repositioned renewable energy from a peripheral environmental concern to a central axis of global strategic discourse. Yet public deliberations frequently remain confined to questions of generation capacity, neglecting the equally consequential dimension of systemic integration. A sophisticated appraisal of renewable energy must therefore encompass not merely its diverse sources—solar, wind, hydroelectric, geothermal, and biomass—but also the heterogeneous sectors within which it can recalibrate economic structures, redistribute political leverage, and foster environmental equity. In the sphere of electricity production, decentralized photovoltaic arrays and micro-hydel installations have begun to supplant carbon-intensive grids, particularly in geographically marginalized regions historically excluded from centralized infrastructure. Wind corridors in coastal and semi-arid territories have likewise catalyzed localized employment ecosystems while attenuating reliance on imported hydrocarbons. Beyond electricity, renewable modalities are permeating transportation logistics, industrial thermodynamics, and agrarian mechanization. Second-generation biofuels synthesized from lignocellulosic agricultural residues present a viable decarbonization pathway for aviation and long-haul freight—domains conventionally resistant to electrification. Concurrently, solar-powered irrigation systems have augmented agrarian autonomy by mitigating dependence on erratic grid supply and diesel combustion. Nevertheless, the transformative promise of renewables is circumscribed by structural impediments, including intermittency, storage constraints, land acquisition conflicts, and prohibitive capital outlays. An imprudent or inequitable transition, devoid of infrastructural resilience and community assent, risks reproducing the asymmetries it purports to dismantle. Thus, the pivotal inquiry transcends production metrics and instead interrogates how renewable energy can be embedded cohesively across sectors, geographies, and socio-political hierarchies.`;

        // QUESTIONS ARRAY
        // --------------------------------------------------------------

        { num: 1, q: `कथन:

निष्कर्ष:
I. कार्यालय के नियमों को तोड़ने वाले कर्मचारियों को दंडित किया जाना चाहिए।
II. कार्यालय के नियमों का पालन करना अनुशासन को दर्शाता है।`,
          options: ['केवल I', 'केवल II', 'दोनों अनुसरण करते हैं', 'कोई भी अनुसरण नहीं करता है'],
          answer: 'b',
          exp: `कथन नियम-पालन को अनुशासन का लक्षण बताता है (II)। यह दंड का उल्लेख नहीं करता (I)। अतः केवल II अनुसरण करता है।` },

        { num: 2, q: `कथन:
1. सभी पेन उपकरण हैं।
2. कुछ उपकरण मशीनें हैं।
3. सभी मशीनें धातु की वस्तुएं हैं।

निष्कर्ष:
I. कुछ उपकरण धातु की वस्तुएं हैं।
II. कुछ पेन मशीनें हैं।`,

          answer: 'a',
          exp: `कुछ उपकरण मशीनें हैं और सभी मशीनें धातु → कुछ उपकरण धातु की वस्तुएं हैं (I सत्य)। पेन और मशीन के बीच सीधा संबंध नहीं (II असत्य)।` },

        { num: 3, q: `यदि TIGER को SHFDQ के रूप में कोडित किया जाता है, तो LION को कैसे लिखा जाएगा?`,
          options: ['KHNM', 'KHMN', 'JHNM', 'KGMN'],
          answer: 'a',
          exp: `प्रत्येक अक्षर −1: T→S, I→H, G→F, E→D, R→Q। इसी प्रकार L→K, I→H, O→N, N→M → KHNM।` },

        { num: 4, q: `श्रृंखला में गलत संख्या ज्ञात कीजिए:
3, 7, 15, 31, 63, 127, 250`,
          options: ['63', '127', '250', '31'],
          answer: 'c',
          exp: `पैटर्न: ×2+1। 127×2+1 = 255 होना चाहिए, लेकिन 250 दिया है — अतः 250 गलत है।` },

        { num: 5, q: `कथन: P ≥ Q; R = S ≤ T; Q ≥ R; T ≥ P

निष्कर्ष:
I. P ≥ R
II. S ≤ Q`,
          options: ['या तो I या II', 'केवल I', 'केवल II', 'न तो I और न ही II'],
          answer: 'b',
          exp: `P ≥ Q और Q ≥ R ⇒ P ≥ R (I सत्य)। दिया गया उत्तर केवल I है।` },

        { num: 6, q: `कथन:
फिटनेस में सुधार के लिए, लोगों को व्यस्त कार्यक्रमों के बावजूद प्रतिदिन व्यायाम करना चाहिए।

पूर्वधारणाएं:
I. व्यायाम फिटनेस में सुधार करता है।
II. लोग व्यायाम के लिए समय का प्रबंधन कर सकते हैं।
III. व्यस्त कार्यक्रम स्वास्थ्य को हानि करते हैं।`,
          options: ['केवल I', 'केवल I और II', 'केवल II और III', 'सभी I, II और III'],
          answer: 'b',
          exp: `व्यायाम का लाभ (I) और समय प्रबंधन की संभावना (II) मान्यताएँ हैं। III का उल्लेख नहीं।` },

        { num: 7, q: `विषम का चयन करें:
Apple, Mango, Banana, Carrot, Orange`,
          options: ['Apple', 'Mango', 'Carrot', 'Orange'],
          answer: 'c',
          exp: `Apple, Mango, Banana, Orange फल हैं; Carrot सब्जी है।` },

        { num: 8, q: `एक कूट भाषा में:
"Red flower blooms" → ta ka la
"Blue flower blooms" → sa ka la
"Red plant grows" → ta ma na

"Blue plant grows" के लिए कूट क्या है?`,
          options: ['sa ma na', 'ta ka na', 'sa ka ma', 'ka sa na'],
          answer: 'a',
          exp: `Red = ta, Blue = sa, flower = ka, blooms = la, plant = ma, grows = na → Blue plant grows = sa ma na।` },

        { num: 9, q: `विषम का चयन करें:
(a) अजंता (b) एलोरा (c) सांची (d) कुतुब मीनार`,
          options: ['अजंता', 'एलोरा', 'सांची', 'कुतुब मीनार'],
          answer: 'd',
          exp: `अजंता, एलोरा और सांची प्राचीन बौद्ध/जैन स्थल हैं; कुतुब मीनार इस्लामी स्मारक है।` },

        { num: 10, q: `अगला पद क्या होगा? ABC, BCD, CDE, DEF, ?`,
          options: ['EFG', 'DFG', 'CEF', 'FGH'],
          answer: 'a',
          exp: `प्रत्येक पद के सभी अक्षर +1: ABC → BCD → CDE → DEF → EFG।` },

        { num: 11, q: `यदि '÷' का अर्थ '+' है, '+' का अर्थ '×' है, '×' का अर्थ '−' है, तो 8 + 4 × 2 ÷ 6 = ?`,
          options: ['38', '36', '40', '32'],
          answer: 'b',
          exp: `प्रतीक बदलने पर: 8 × 4 − 2 + 6 = 32 − 2 + 6 = 36।` },

        { num: 12, q: `दिए गए विकल्पों में से उस अक्षर-समूह का चयन करें जो निम्नलिखित श्रृंखला में प्रश्नवाचक चिह्न (?) को प्रतिस्थापित कर सकता है।

BDH, EHM, HLR, ?`,
          options: ['KTZ', 'KPW', 'JQW', 'LUZ'],
          answer: 'b',
          exp: `पहला अक्षर +3, दूसरा +4, तीसरा +5: B→E→H→K, D→H→L→P, H→M→R→W → KPW।` },

        { num: 13, q: `कौन सा समूह समान नियम का पालन नहीं करता है?
(a) 2, 4, 8 (b) 3, 6, 12 (c) 5, 10, 20 (d) 4, 9, 16`,
          options: ['2, 4, 8', '3, 6, 12', '5, 10, 20', '4, 9, 16'],
          answer: 'd',
          exp: `(a)(b)(c) में हर अगला पद पिछले का दोगुना है; (d) में 4, 9, 16 = वर्ग संख्याएँ हैं।` },

        { num: 14, q: `विषम का चयन करें:
(a) गिटार (b) वायलिन (c) बांसुरी (d) तबला`,
          options: ['गिटार', 'वायलिन', 'बांसुरी', 'तबला'],
          answer: 'd',
          exp: `गिटार/वायलिन तार वाद्य, बांसुरी वायु वाद्य; तबला ताल वाद्य है।` },

        { num: 15, q: `यदि 7 * 3 = 25 और 9 * 2 = 22 है, तो 5 * 4 = ?`,

        { num: 17, q: `कथन:
नौकरी के लिए सैकड़ों उम्मीदवारों ने आवेदन किया।

निष्कर्ष:
I. नौकरी की मांग है।
II. सभी आवेदकों का चयन किया जाएगा।`,
          options: ['केवल I अनुसरण करता है', 'केवल II अनुसरण करता है', 'दोनों अनुसरण करते हैं', 'कोई भी अनुसरण नहीं करता है'],
          answer: 'a',

        { num: 18, q: `A, B का भाई है। B, C की माँ है। D, A का पुत्र है। D, C से किस प्रकार संबंधित है?`,

            q.options.forEach((opt, idx) => {
                const o = document.createElement('div');
                o.className = 'option';
                o.innerHTML = `<strong>(${labels[idx]})</strong> ${escapeHTML(opt)}`;
                optsDiv.appendChild(o);
            });
            card.appendChild(optsDiv);

            const action = document.createElement('div');
            action.className = 'action-area';

            const btn = document.createElement('button');
            btn.className = 'btn btn-primary';
            btn.textContent = 'उत्तर दिखाएँ';

            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = `Answer: (${q.answer})`;

            action.appendChild(btn);
            action.appendChild(badge);
            card.appendChild(action);

            const ansBox = document.createElement('div');
            ansBox.className = 'answer-box';

            const ansLabel = document.createElement('div');
            ansLabel.className = 'answer-label';
            ansLabel.innerHTML = `✅ Correct Answer: <span>(${q.answer})</span>`;
            ansBox.appendChild(ansLabel);

            const expDiv = document.createElement('div');
            expDiv.className = 'explanation';
            expDiv.innerHTML = `<strong>💡 व्याख्या:</strong> ${escapeHTML(q.exp)}`;
            ansBox.appendChild(expDiv);

            card.appendChild(ansBox);
            container.appendChild(card);

            let visible = false;
            btn.addEventListener('click', () => {
                visible = !visible;
                ansBox.classList.toggle('visible', visible);
                btn.textContent = visible ? 'उत्तर छिपाएँ' : 'उत्तर दिखाएँ';
            });
        });

        // --------------------------------------------------------------
        // SHOW / HIDE ALL
        // --------------------------------------------------------------
        document.getElementById('showAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.answer-box').forEach((box) => {
                box.classList.add('visible');
            });
            document.querySelectorAll('.action-area .btn-primary').forEach((btn) => {
                btn.textContent = 'उत्तर छिपाएँ';
            });
        });

        document.getElementById('hideAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.answer-box').forEach((box) => {
                box.classList.remove('visible');
            });
            document.querySelectorAll('.action-area .btn-primary').forEach((btn) => {
                btn.textContent = 'उत्तर दिखाएँ';
            });
        });

        document.getElementById('stats').textContent =
            `📊 कुल ${questions.length} प्रश्न लोड किए गए। किसी भी प्रश्न पर "उत्तर दिखाएँ" क्लिक करें।`;

        // --------------------------------------------------------------
        // ESCAPE HELPER
        // --------------------------------------------------------------
        function escapeHTML(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>

 जलविद्युत परियोजनाओं तथा साझा नदी प्रणालियों पर विशेषज्ञों के संयुक्त समूह जैसे द्विपक्षीय तंत्रों से समन्वय करते हैं।"}, {"q": "एक पत्रभुज का क्षेत्रफल 25 cm² है। यकद एक समरूि पत्रभुज की भुजाएँ िहले पत्रभुज की संगत भुजाओं की तीन गुनी हैं, तो उसका क्षेत्रफल ज्ञात कीपजए।", "options": ["75 cm²", "150 cm²", "225 cm²", "300 cm²"], "answer": "c", "explanation": "समान आकृतियों में क्षेत्रफल का अनुपात संगत भुजाओं के अनुपात के वर्ग के बराबर होता है। 3²×25 = 225 cm²।"}, {"q": "एक बाहरी सबंदु P से, एक िरत्त िर दो टििथ रेिाएँ PA और PB िींची जाती हैं। यकद PA की लंबाई 15 cm है, तो PB की लंबाई ज्ञात कीपजए।", "options": ["10 cm", "12 cm", "15 cm", "18 cm"], "answer": "c", "explanation": "एक ही बाहरी बिंदु से वृत्त पर खींची गई दोनों स्पर्श रेखाओं की लंबाई समान होती है। इसलिए PB = PA = 15 cm।"}, {"q": "यकद sinA + cosA = 7/5 है, तो sin2A ज्ञात कीपजए।", "options": ["9/25", "24/25", "7/10", "12/25"], "answer": "b", "explanation": "(sin A + cos A)² = 1 + 2sinA cosA = 49/25। इसलिए sin2A = 2sinA cosA = 24/25।"}, {"q": "यकद A : B = 4 : 5, B : C = 6 : 7, और C : D = 10 : 11 है, तो पमपश्रत अनुिात A : B : C : D ज्ञात कीपजए।", "options": ["48 : 60 : 70 : 77", "4 : 5 : 7 : 11", "24 : 30 : 35 : 44", "8 : 10 : 14 : 11"], "answer": "a", "explanation": "अनुपातों को समान B और C पर मिलाने पर A:B:C:D = 48:60:70:77 मिलता है।"}, {"q": "27³ + 18³ − 45³ + 108 ककसके बराबर है?", "options": ["−65502", "0", "−46656", "1"], "answer": "a", "explanation": "27³ + 18³ − 45³ + 108 = 19683 + 5832 − 91125 + 108 = −65502।"}, {"q": "रेिा L, सबंदुओं P(4, 6) और Q(10, 2) को जोड़ने िाले रेिािंड का लंब समपद्वभाजक है। रेिा L का y-अिरोि क्या होगा?", "options": ["4", "-6.5", "6", "7"], "answer": "b", "explanation": "PQ का मध्यबिंदु (7,4) है और PQ की ढाल −2/3 है, अतः लंब समद्विभाजक की ढाल 3/2 होगी। इससे y-अवरोध −6.5 आता है।"}, {"q": "यकद एक िंकु की पत्रज्या दोगुनी कर दी जाए और उसकी ऊंचाई आिी कर दी जाए, तो आयतन कैसे बदलता है?", "options": ["मूल का आिा हो जाता है", "मूल का दोगुना हो जाता है", "अिररिर्तथत रहता है", "मूल का चार गुना हो जाता है"], "answer": "b", "explanation": "शंकु का आयतन V = 1/3πr²h है। r को 2r और h को h/2 करने पर गुणक 4×1/2 = 2 होता है।"}, {"q": "यकद cotA = 3 है, तो (tanA + cotA) का मान ज्ञात कीपजए।", "options": ["10/3", "4/3", "13/3", "3/10"], "answer": "a", "explanation": "cot A = 3 ⇒ tan A = 1/3। इसलिए tan A + cot A = 1/3 + 3 = 10/3।"}, {"q": "एक घन को 27 बराबर छोिे घनों में पिभापजत करने के पलए आिश्यक न्यूनतम किािों की संख्या क्या है?", "options": ["4", "5", "6", "3"], "answer": "c", "explanation": "27 = 3³ छोटे घनों के लिए घन को प्रत्येक दिशा में 3 भागों में काटना होगा। प्रत्येक दिशा में 2 कट, कुल 6 कट।"}, {"q": "एक पत्रभुज में हो सकते हैं:", "options": ["दो अपिक कोण", "एक न्यून कोण और दो समकोण", "केिल एक अपिक कोण", "तीन कोण, प्रत्येक 70° के बराबर"], "answer": "c", "explanation": "त्रिभुज में दो अधिक कोण संभव नहीं और दो समकोण भी संभव नहीं। तीनों कोण 70° भी नहीं हो सकते क्योंकि योग 210° होगा। दिए गए उत्तर के अनुसार एक अधिक कोण संभव है।"}, {"q": "यकद a = 0.01, b = 0.02, c = −0.03 और a + b + c = 0 है, तो (a³ + b³ + c³) ÷ (3abc) ज्ञात कीपजए।", "options": ["−1", "0", "1", "2"], "answer": "c", "explanation": "यदि a+b+c=0, तो a³+b³+c³ = 3abc। अतः भागफल 1 है।"}, {"q": "एक समकोण पत्रभुज में एक िरत्त अंतःपटथत है, पजसकी लम्बित भुजाएँ 9 सेमी और 12 सेमी हैं। अंतःपटथत िरत्त की पत्रज्या ज्ञात कीपजए।", "options": ["2 सेमी", "3 सेमी", "4 सेमी", "5 सेमी"], "answer": "b", "explanation": "समकोण त्रिभुज की अंतःवृत्त की त्रिज्या r = (a+b−c)/2। यहाँ c=15, इसलिए r=(9+12−15)/2=3 सेमी।"}, {"q": "सरलीकरत करें√17+12√2", "options": ["4 + √2", "2 + 3√2", "3 + 2√2", "5 + √4"], "answer": "c", "explanation": "17 + 12√2 = (3 + 2√2)², इसलिए इसका वर्गमूल 3 + 2√2 है।"}, {"q": "यकद cos θ = 5/13 है और θ प्रथम चतुथाांि में पटथत है, तो sin θ का मान ज्ञात कीपजए।", "options": ["12/13", "5/12", "13/12", "12/5"], "answer": "a", "explanation": "पहले चतुर्थांश में sin θ धनात्मक है। sin θ = √(1−25/169) = 12/13।"}, {"q": "एक िरत्त का एक पत्रज्यिंड केंद्र िर 90° का कोण बनाता है और उसकी पत्रज्या 6 cm है। उसी िरत्त का एक अन्य पत्रज्यिंड π/2 रेपडयन का कोण बनाता है। दोनों पत्रज्यिंडों के क्षेत्रफलों का अनुिात ज्ञात कीपजए।", "options": ["1 : 2", "2 : 1", "1 : 1", "3 : 2"], "answer": "c", "explanation": "90° = π/2 radians। दोनों सेक्टरों का केंद्रीय कोण समान है, इसलिए दोनों के क्षेत्रफल बराबर हैं।"}, {"q": "𝑥=√15+√15+√15+⋯ का मान ज्ञात कीपजये", "options": ["3", "2", "1+√61\n2", "4"], "answer": "c", "explanation": "दिए गए अनंत मूल का मान प्रश्न में दिए आधिकारिक उत्तर के अनुसार विकल्प (c) है।"}, {"q": "एक दुकानदार 8 िेन के अंककत मूल्य िर 9 िेन िरीदता है। िह प्रत्येक िेन को अंककत मूल्य िर 5% की छूि देने के बाद बेचता है। उसका लाभ प्रपतित ज्ञात कीपजए।", "options": ["10%", "11.25%", "6.875%", "15%"], "answer": "c", "explanation": "मान लें प्रत्येक पेन का अंकित मूल्य 8 इकाई है। 9 पेन की खरीद लागत 8 पेन के अंकित मूल्य के बराबर है। 5% छूट के बाद बिक्री मूल्य 9×8×0.95 है; खरीद लागत 8×8 है, जिससे दिए उत्तर के अनुसार 6.875% लाभ मिलता है।"}, {"q": "यकद x + y = 7 और xy = 10 है, तो ज्ञात कीपजए: (x³ + y³)² - 9x²y²(x + y)²", "options": ["24011", "−-26411", "12255", "−12251"], "answer": "b", "explanation": "x³+y³=(x+y)³−3xy(x+y)=343−210=133। फिर 133²−9×100×49 = 17689−44100 = −26411।"}, {"q": "रेिा 4x − 5y = 10 की ढाल ज्ञात कीपजए।", "options": ["4/5", "−5/4", "5/4", "−4/5"], "answer": "a", "explanation": "4x−5y=10 को y = (4/5)x−2 के रूप में लिखने पर ढाल 4/5 है।"}, {"q": "₹800 को सािारण ब्याज की एक पनपित दर िर उिार कदया जाता है। 4 महीने बाद, अन्य ₹1200 को मूल दर से दोगुनी दर िर उिार कदया जाता है। यकद 1 िषथ बाद कुल सािारण ब्याज ₹96 है, तो मूल दर ज्ञात कीपजए।", "options": ["4%", "5%", "8%", "7%"], "answer": "a", "explanation": "पहले ₹800 पर 12 महीने और ₹1200 पर 8 महीने के लिए ब्याज लगेगा। 96 = 800r/100 + 1200×2r×8/(12×100), जिससे r = 4% मिलता है।"}, {"q": "एक मीनार जमीन िर 15 मीिर की छाया डालती है। यकद मीनार की ऊंचाई 15√3 मीिर है, तो सूयथ का उन्नयन कोण ज्ञात कीपजए।", "options": ["30°", "45°", "60°", "75°"], "answer": "c", "explanation": "tan θ = ऊंचाई/छाया = 15√3/15 = √3। अतः θ = 60°।"}, {"q": "एक अिथगोले का आयतन संख्यात्मक रूि से उसके िक्र िरष्ठीय क्षेत्रफल के तीन गुना के बराबर है। अिथगोले की पत्रज्या ज्ञात कीपजए।", "options": ["9 cm", "10.5 cm", "12 cm", "14 cm"], "answer": "a", "explanation": "अर्धगोले का आयतन = 2/3πr³ और वक्र पृष्ठीय क्षेत्रफल = 2πr²। V = 3×CSA से 2/3πr³ = 6πr², इसलिए r = 9 cm।"}, {"q": "₹12000 की रापि को दो भागों में पिभापजत ककया जाता है और क्रमिः 6% और 11% सािारण ब्याज िर उिार कदया जाता है। यकद अर्जथत कुल िार्षथक ब्याज ₹960 है, तो 11% िर उिार दी गई रापि ज्ञात कीपजए।", "options": ["₹5000", "₹4800", "₹7000", "₹8000"], "answer": "b", "explanation": "यदि x राशि 11% पर है, तो 0.11x + 0.06(12000−x)=960। इससे 0.05x=240 और x=₹4800।"}, {"q": "िाइि A एक िैंक को 18 पमनि में भर सकता है और िाइि B इसे 36 पमनि में भर सकता है। दोनों को एक साथ िोला जाता है। 6 पमनि बाद, िाइि A की दर आिी हो जाती है और िाइि B की दर दोगुनी हो जाती है। िैंक को भरने के पलए ककतने और पमनिों की आिश्यकता है?", "options": ["5 पमनि", "6 पमनि", "7 पमनि", "8 पमनि"], "answer": "b", "explanation": "पहले 6 मिनट में दर 1/18+1/36=1/12, अतः 1/2 टैंक भरता है। बाद की संयुक्त दर 1/36+1/18=1/12 ही है, इसलिए शेष आधा टैंक 6 मिनट में भरेगा।"}, {"q": "14 cm बाहरी पत्रज्या िाले एक िोिले लोहे के गोले को पिघलाया जाता है और 3 cm पत्रज्या िाले 64 समान ठोस गोलों में ढाला जाता है। मूल गोले की आंतररक पत्रज्या (िूणाांक के पनकितम) ज्ञात कीपजए।", "options": ["10 cm", "11 cm", "12 cm", "9 cm"], "answer": "a", "explanation": "खोखले गोले का आयतन = 64 छोटे गोलों का आयतन। (4/3)π(14³−r³)=64×(4/3)π×3³। इससे r³=1000 और r=10 cm।"}, {"q": "A sentence is provided in direct speech. From the four given options, choose the one that most accurately conveys the sentence in its corresponding indirect speech.\nHe said to me, “You ought to study harder.”", "options": ["He said me that I ought to study harder.", "He told me that I ought to study harder.", "He told me that you ought to study harder.", "He told that I ought to study harder."], "answer": "b", "explanation": "With 'tell', an object is required: 'He told me...' The pronoun 'you' changes to 'I' when reporting to the speaker."}, {"q": "Select the most appropriate synonym of the given word: EXIGUOUS", "options": ["Meagre", "Immense", "Redundant", "Plentiful"], "answer": "a", "explanation": "Exiguous means very small or meagre in amount."}, {"q": "Find the word that is spelled correctly and means the quality of being harshly sarcastic.", "options": ["Causticity", "Caustisity", "Caustyciti", "Costicity"], "answer": "a", "explanation": "Causticity is the correct spelling and means the quality of being sharply or harshly sarcastic."}, {"q": "A sentence is provided in indirect speech. From the four given options, choose the one that most accurately conveys the sentence in its corresponding direct speech.\nThe envoy said that only after the truce would talks commence.", "options": ["“Talks commence only after the truce,” said the envoy.", "“Only after the truce, talks would commence,” said the envoy.", "“Only after the truce will talks commence,” said the envoy.", "“Talks would commence once the truce is declared,” said the envoy."], "answer": "c", "explanation": "The indirect form uses the future-in-the-past construction, corresponding to the direct form 'Only after the truce will talks commence.'"}, {"q": "Select the most appropriate antonym of the given word. Abrogate", "options": ["Rescind", "Annul", "Ratify", "Repeal"], "answer": "c", "explanation": "Abrogate means to repeal or cancel. Ratify means to approve or formally confirm, which is its opposite here."}, {"q": "Choose the correct one-word substitute for: “Extremely ancient; belonging to a very remote period.”", "options": ["Antiquated", "Medieval", "Antediluvian", "Obsolete"], "answer": "c", "explanation": "Antediluvian can mean extremely old or belonging to a very remote period."}, {"q": "Select the most appropriate synonym of the given word: LUMINOUS", "options": ["Gloomy", "Murky", "Opaque", "Resplendent"], "answer": "d", "explanation": "Luminous means emitting or reflecting light; resplendent means shining brilliantly."}, {"q": "Choose the correct meaning of idiom:\nTo chew over an idea", "options": ["Eat noisily", "Wander aimlessly in thought", "Think deeply and repeatedly", "Prepare aggressively for conflict"], "answer": "c", "explanation": "To chew over an idea means to consider or think about it carefully and repeatedly."}, {"q": "Choose the correct one-word substitute for: “A person who advocates reform or improvement.”", "options": ["Traditionalist", "Reactionary", "Reformer", "Absolutist"], "answer": "c", "explanation": "A reformer is a person who advocates reform or improvement."}, {"q": "Rearrange the following sentences in correct order to make a logical passage.\n1. The plan is approved after consent from all partners.\n2. First, a preliminary outline is drafted.\n3. Then modifications are made after consultations.\n4. Finally, implementation starts according to schedule.", "options": ["2-3-1-4", "1-3-2-4", "3-2-1-4", "2-1-3-4"], "answer": "a", "explanation": "The logical sequence is drafting first, consultation and modification next, approval after consent, and finally implementation: 2-3-1-4."}, {"q": "Rearrange the following sentences to form a coherent paragraph:\n1. A core concept in this paradigm is the “class,” which serves as a template for creating objects.\n2. Object-Oriented Programming (OOP) is a paradigm built around “objects,” which contain data as well as methods.\n3. This enables a developer to define the structure and behavior of programs in an object-based manner.\n4. A key benefit is that it mirrors real-world entities, making large systems easier to maintain and debug.", "options": ["2, 1, 3, 4", "4, 3, 2, 1", "3, 1, 4, 2", "1, 2, 3, 4"], "answer": "a", "explanation": "Sentence 2 introduces OOP, sentence 1 explains the class concept, sentence 3 gives its consequence, and sentence 4 gives a benefit."}, {"q": "Find the part of the sentence that contains an error:\nSeldom had the tribunal entertained an appeal (1)/ so lacking in substance, nor so plainly designed (2)/ to invite publicity rather than justice. (3)/ No error (4)/", "options": ["(1)", "(2)", "(3)", "(4)"], "answer": "b", "explanation": "After 'so ...', the correlative construction should be parallel. The error is in part (2), where the coordination with 'nor' is faulty."}, {"q": "Change the following from active to passive:\nThey were broadcasting the match at 8 pm.", "options": ["The match is broadcast at 8 pm.", "The match was broadcast at 8 pm.", "The match was being broadcast at 8 pm.", "The match has been broadcast at 8 pm."], "answer": "c", "explanation": "The active past continuous 'were broadcasting' becomes passive past continuous 'was being broadcast.'"}, {"q": "Choose the correct option:\nThe sociologist’s conclusions were so contentious that they were initially ____.", "options": ["dismissed", "applauded", "endorsed", "implemented"], "answer": "a", "explanation": "Contentious conclusions are likely to be rejected or dismissed initially; the other options do not fit the context."}, {"q": "Find the part of the sentence that contains an error:\nThe revised guideline states (1)/ that every employee must comply with (2)/ the conduct policy (3)/ regardless of their designation. (4)/", "options": ["(1)", "(2)", "(3)", "(4)"], "answer": "d", "explanation": "The error is marked in part (4) according to the supplied answer key."}, {"q": "Convert the sentence provided below from its passive voice structure to an active voice structure:\nA decision has been made to get the manuscript reviewed by an external committee.", "options": ["An external committee has reviewed the manuscript.", "The manuscript is being reviewed by an external committee.", "They have decided to get the manuscript reviewed by an external committee.", "The manuscript was reviewed by the committee as per the decision."], "answer": "c", "explanation": "The passive 'A decision has been made' can be expressed actively as 'They have decided...' while retaining the intended meaning."}, {"q": "Choose the most suitable option to replace the highlighted part of the sentence:\nShe is confident to clear the interview.", "options": ["of to clear the interview", "that she clears the interview", "of clearing the interview", "on clearing interview"], "answer": "c", "explanation": "The standard construction is 'confident of + gerund': 'She is confident of clearing the interview.'"}, {"q": "What concern does the passage raise about Yoga’s worldwide popularity?\nRead the following passage and answer the questions based on the passage:\nIndia’s heritage of wellness traditions—seen in Yoga, Ayurveda, Siddha, and Unani—forms a layered blend of philosophy, physiology, and metaphysical thought. Rather than remaining frozen in time, these systems have continuously adapted, negotiating their place within local practice and global health conversations. Central to this worldview is the belief that the body is not merely a biological machine but a field of interlinked rhythms and energies. Yoga, shaped by Patanjali’s Yoga Sutras, is not simply a set of postures; it is a comprehensive discipline intended to align body, mind, and consciousness. In contemporary settings, however, Yoga has often been commercialized, especially outside India, where its philosophical grounding is frequently reduced to fitness routines or stress-management tools. While this shift has expanded global appeal, it also triggers concerns about cultural appropriation and loss of intellectual depth.\nAyurveda views illness as an imbalance of the tridosha—vata, pitta, and kapha—forces said to govern bodily function. It emphasizes prakriti (constitution), ahara (diet), and dinacharya (daily regimen) as pillars of preventive care. Unlike allopathy’s symptom-focused interventions, Indian traditional medicine aims to restore equilibrium within the body’s internal ecology. This approach resonates with modern interest in personalized, preventive medicine, though the biomedical community often remains skeptical due to differences in method and proof. Government support for AYUSH reflects renewed institutional attention, yet critics warn against unquestioning promotion, pointing to limited standardized clinical trials, inconsistency in diagnostic frameworks, and difficulties in evidence-based validation. Moreover, commercial packaging of Ayurvedic products can marginalize traditional knowledge holders, turning living traditions into market commodities. The relationship between these systems and modern healthcare is therefore both hopeful and complex. Integrative models—especially in chronic care, mental health, and palliative support—may work, but they require epistemic humility and strict regulation. The risk lies in either glorifying these traditions as cure-alls or dismissing them as unscientific leftovers. Their future relevance depends on preserving philosophical depth while applying transparent, rigorous scrutiny, through dialogue rather than extremes.", "options": ["Lack of studios", "Dilution of its philosophical foundation", "Shortage of practitioners", "Excess control by Indian agencies"], "answer": "b", "explanation": "The passage says Yoga is often reduced to fitness or stress management, causing concern about dilution of its philosophical grounding and intellectual depth."}, {"q": "Which option best represents the Ayurvedic view of illness, as discussed?\nRead the following passage and answer the questions based on the passage:\nIndia’s heritage of wellness traditions—seen in Yoga, Ayurveda, Siddha, and Unani—forms a layered blend of philosophy, physiology, and metaphysical thought. Ayurveda views illness as an imbalance of the tridosha—vata, pitta, and kapha—forces said to govern bodily function. It emphasizes prakriti (constitution), ahara (diet), and dinacharya (daily regimen) as pillars of preventive care.", "options": ["Destroying pathogens through antibiotics", "Using synthetic drugs for instant relief", "Rebalancing the body through lifestyle and routine", "Correcting genetic defects directly"], "answer": "c", "explanation": "The passage describes Ayurveda as restoring balance through constitution, diet, and daily regimen, rather than focusing only on symptoms."}, {"q": "What risk linked to institutional promotion of AYUSH is mentioned in the passage?\nRead the following passage and answer the questions based on the passage:\nGovernment support for AYUSH reflects renewed institutional attention, yet critics warn against unquestioning promotion, pointing to limited standardized clinical trials, inconsistency in diagnostic frameworks, and difficulties in evidence-based validation. Moreover, commercial packaging of Ayurvedic products can marginalize traditional knowledge holders, turning living traditions into market commodities.", "options": ["Rising production costs", "Increased rural joblessness", "Traditional knowledge holders being sidelined", "Dependence on foreign investors"], "answer": "c", "explanation": "The passage explicitly warns that commercial packaging can marginalize or sideline traditional knowledge holders."}, {"q": "What position does the author take regarding combining traditional medicine with modern healthcare?\nRead the following passage and answer the questions based on the passage:\nThe relationship between these systems and modern healthcare is therefore both hopeful and complex. Integrative models—especially in chronic care, mental health, and palliative support—may work, but they require epistemic humility and strict regulation.", "options": ["Traditional systems should replace allopathy", "Modern medicine must reject tradition", "Integration can work with humility and regulation", "Both should remain strictly separate"], "answer": "c", "explanation": "The author supports possible integration, but stresses humility, transparent scrutiny, and strict regulation."}, {"q": "According to the passage, what is essential for the continued relevance of Yoga and traditional medicine in India?\nRead the following passage and answer the questions based on the passage:\nTheir future relevance depends on preserving philosophical depth while applying transparent, rigorous scrutiny, through dialogue rather than extremes.", "options": ["Unquestioning patriotism", "Complete scientific dismissal", "A dialogic integration of tradition and modernity", "Reliance only on foreign approval"], "answer": "c", "explanation": "The passage advocates dialogue between tradition and modernity while preserving philosophical depth and applying rigorous scrutiny."}, {"q": "Choose the correct spelling of a word meaning \"light, witty talk or banter.\"", "options": ["Persiflage", "Persiflaige", "Persiphlege", "Persiflagee"], "answer": "a", "explanation": "Persiflage is the correct spelling and means light, playful, witty conversation or banter."}, {"q": "A sentence is provided in direct speech. From the four given options, choose the one that most accurately conveys the sentence in its corresponding indirect speech.\nThe researcher said, “We have been observing this phenomenon for months.”", "options": ["The researcher said they had been observing that phenomenon for months.", "The researcher said they have been observing this phenomenon for months.", "The researcher said that they were observing that phenomenon.", "The researcher said that we had observed this phenomenon."], "answer": "a", "explanation": "In reported speech, 'have been observing' changes to 'had been observing', and 'this' changes to 'that'; 'we' becomes 'they' when the researchers are being referred to externally."}, {"q": "Select the sentence containing the homonym of the highlighted word:\nThe bishop denounced the act as simony, citing church law.", "options": ["The cleric was charged with simony for selling sacred offices.", "Historians noted that simony corrupted many medieval appointments.", "The chemist measured the simony of the compound under pressure.", "Simony was condemned repeatedly by reform councils."], "answer": "c", "explanation": "The supplied answer key marks (c). Note that the other options repeat the same word 'simony'; option (c) is intended as the homonym-based choice in the supplied paper."}];

const letters = ["a","b","c","d"];

function render(){
  const root=document.getElementById("questions");
  root.innerHTML="";
  questions.forEach((item,index)=>{
    const box=document.createElement("div");
    box.className="question";
    const opts=item.options.map((o,i)=>`<div class="option">(${letters[i]}) ${escapeHtml(o)}</div>`).join("");
    box.innerHTML=`
      <div class="qtext"><b>Q${index+1}.</b> ${escapeHtml(item.q)}</div>
      <div class="options">${opts}</div>
      <button class="answerBtn" onclick="showAnswer(this)">Show Answer</button>
      <div class="answerBox">
        <div class="correct">Ans. (${item.answer.toUpperCase()}) ${escapeHtml(item.options[letters.indexOf(item.answer)])}</div>
        <div class="explanation"><b>Explanation:</b> ${escapeHtml(item.explanation)}</div>
      </div>`;
    root.appendChild(box);
  });
}
function showAnswer(btn){
  const box=btn.nextElementSibling;
  box.classList.toggle("show");
  btn.textContent=box.classList.contains("show")?"Hide Answer":"Show Answer";
}
function toggleAll(){
  const boxes=document.querySelectorAll(".answerBox");
  const shouldShow=[...boxes].some(x=>!x.classList.contains("show"));
  boxes.forEach(x=>x.classList.toggle("show",shouldShow));
  document.querySelectorAll(".answerBtn").forEach(b=>b.textContent=shouldShow?"Hide Answer":"Show Answer");
}
function escapeHtml(str){
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
render();

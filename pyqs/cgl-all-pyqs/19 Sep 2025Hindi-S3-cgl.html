// ====== PARSING ======
function parseQuestions(text) {
  const rawParts = text.split(/(?=Q\d+\.)/).filter(p => p.trim().length > 0);
  const questions = [];
  for (let raw of rawParts) {
    const numMatch = raw.match(/^Q(\d+)\./);
    if (!numMatch) continue;
    const id = parseInt(numMatch[1]);
    let remaining = raw.replace(/^Q\d+\./, '').trim();
    const optionRegex = /\(([a-d])\)\s*(.*?)(?=\s*\([a-d]\)|Ans\.|$)/gs;
    const optMatches = [...remaining.matchAll(optionRegex)];
    let options = [];
    let questionText = remaining;
    if (optMatches.length === 4) {
      options = optMatches.map(m => ({ label: m[1], text: m[2].trim() }));
      const firstOption = remaining.search(/\(a\)/);
      if (firstOption !== -1) {
        questionText = remaining.substring(0, firstOption).trim();
      }
    } else {
      const firstOpt = remaining.search(/\(a\)/);
      if (firstOpt !== -1) {
        questionText = remaining.substring(0, firstOpt).trim();
        const rest = remaining.substring(firstOpt);
        const fallbackMatches = [...rest.matchAll(/\(([a-d])\)\s*(.*?)(?=\s*\([a-d]\)|Ans\.|$)/gs)];
        options = fallbackMatches.map(m => ({ label: m[1], text: m[2].trim() }));
      }
    }
    const ansMatch = remaining.match(/Ans\.\s*\(([a-d])\)/i);
    let answer = ansMatch ? ansMatch[1].toLowerCase() : '';
    questionText = questionText.replace(/Ans\.\s*\([a-d]\)/i, '').trim();
    if (!questionText) {
      const firstOpt = raw.search(/\(a\)/);
      if (firstOpt !== -1) {
        questionText = raw.substring(0, firstOpt).replace(/^Q\d+\./, '').trim();
      }
    }
    while (options.length < 4) {
      options.push({ label: String.fromCharCode(97 + options.length), text: '—' });
    }
    questions.push({ id, question: questionText, options: options.slice(0,4), answer });
  }
  return questions;
}

const questions = parseQuestions(rawText);

// ====== RENDER ======
const container = document.getElementById('questionsContainer');
let allAnswerStates = [];

function renderQuestions() {
  container.innerHTML = '';
  allAnswerStates = new Array(questions.length).fill(false);
  questions.forEach((q, index) => {
    const block = document.createElement('div');
    block.className = 'question-block';
    const header = document.createElement('div');
    header.className = 'q-header';
    header.textContent = `Q${q.id}.`;
    const qText = document.createElement('div');
    qText.className = 'q-text';
    qText.textContent = q.question;
    const optionsDiv = document.createElement('div');
    optionsDiv.className = 'options';
    q.options.forEach(opt => {
      const optDiv = document.createElement('div');
      optDiv.className = 'option';
      const labelSpan = document.createElement('span');
      labelSpan.className = 'label';
      labelSpan.textContent = `(${opt.label})`;
      const textSpan = document.createElement('span');
      textSpan.className = 'text';
      textSpan.textContent = opt.text;
      optDiv.appendChild(labelSpan);
      optDiv.appendChild(textSpan);
      optionsDiv.appendChild(optDiv);
    });
    const actionArea = document.createElement('div');
    actionArea.className = 'action-area';
    const showBtn = document.createElement('button');
    showBtn.className = 'show-answer-btn';
    showBtn.textContent = 'Show Answer';
    showBtn.dataset.index = index;
    const answerBox = document.createElement('div');
    answerBox.className = 'answer-box';
    answerBox.id = `answer-${index}`;
    const correctText = document.createElement('div');
    correctText.className = 'correct';
    correctText.innerHTML = `✅ सही उत्तर: <strong>(${q.answer})</strong>`;
    const explDiv = document.createElement('div');
    explDiv.className = 'explanation';
    if (explanations[q.id]) {
      explDiv.textContent = explanations[q.id];
    }
    answerBox.appendChild(correctText);
    answerBox.appendChild(explDiv);

    showBtn.addEventListener('click', function() {
      const idx = parseInt(this.dataset.index);
      const box = document.getElementById(`answer-${idx}`);
      const isShowing = box.classList.contains('show');
      if (isShowing) {
        box.classList.remove('show');
        this.textContent = 'Show Answer';
        this.classList.remove('active');
        allAnswerStates[idx] = false;
      } else {
        box.classList.add('show');
        this.textContent = 'Hide Answer';
        this.classList.add('active');
        allAnswerStates[idx] = true;
      }
    });
    actionArea.appendChild(showBtn);
    actionArea.appendChild(answerBox);
    block.appendChild(header);
    block.appendChild(qText);
    block.appendChild(optionsDiv);
    block.appendChild(actionArea);
    container.appendChild(block);
  });
}

let allShown = false;
document.getElementById('showAllBtn').addEventListener('click', function() {
  allShown = !allShown;
  const btns = document.querySelectorAll('.show-answer-btn');
  btns.forEach((btn, idx) => {
    const box = document.getElementById(`answer-${idx}`);
    if (allShown) {
      box.classList.add('show');
      btn.textContent = 'Hide Answer';
      btn.classList.add('active');
      allAnswerStates[idx] = true;
    } else {
      box.classList.remove('show');
      btn.textContent = 'Show Answer';
      btn.classList.remove('active');
      allAnswerStates[idx] = false;
    }
  });
  this.textContent = allShown ? 'Hide All Answers' : 'Show All Answers';
});

renderQuestions();
</script>

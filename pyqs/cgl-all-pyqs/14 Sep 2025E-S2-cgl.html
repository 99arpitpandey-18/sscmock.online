into a single day. With restricted overs, they favour attacking stroke-play, inventive bowling, and sharp field strategies.

also bring clear commercial advantage, turning matches into high-value entertainment. Still, some argue that increased 
commercialization has reduced the game’s subtlety, as spectacle can overshadow substance. Meanwhile, supporters 
of Test cricket worry about shrinking audiences, linking it to a sports culture increasingly driven by entertainment. Even 
so, major rivalries—such as the Ashes or intense India–Australia series—can still capture worldwide attention. 
Ultimately, the discussion is not only about which format is better, but what cricket should represent. The key challenge 
is to protect the integrity of Test cricket while keeping ODIs widely engaging—an uneasy balance for cricket authorities 
to manage in the coming years.

// ------------------------------------------------------------
// Parse the raw text into an array of question objects
// ------------------------------------------------------------
function parseQuestions(text) {
    // Normalize line endings and trim extra whitespace
    const normalized = text.replace(/\r\n/g, '\n').trim();
    // Split by "Q" followed by digits and a dot, capturing the number
    // Use lookahead to split, but keep the delimiter by using match all
    const questionBlocks = normalized.match(/Q\d+\.[\s\S]*?(?=Q\d+\.|$)/g);
    if (!questionBlocks) return [];

    const questions = [];
    for (const block of questionBlocks) {
        // Extract question number
        const numMatch = block.match(/^Q(\d+)\./);
        if (!numMatch) continue;
        const qNum = parseInt(numMatch[1], 10);

        // Remove the "Qx." prefix from content
        let content = block.replace(/^Q\d+\.\s*/, '').trim();

        // Extract answer and explanation (if any)
        let answer = '';
        let explanation = '';
        const ansMatch = content.match(/Ans\.\s*\(([a-d])\)\s*([\s\S]*?)$/);
        if (ansMatch) {
            answer = ansMatch[1].toLowerCase();
            explanation = ansMatch[2] ? ansMatch[2].trim() : '';
            // Remove answer part from content to get question+options
            content = content.replace(/Ans\.\s*\([a-d]\)\s*[\s\S]*$/, '').trim();
        }

        // Extract options: (a) ... (b) ... (c) ... (d) ...
        const optRegex = /\(a\)\s*([\s\S]*?)\s*\(b\)\s*([\s\S]*?)\s*\(c\)\s*([\s\S]*?)\s*\(d\)\s*([\s\S]*?)$/;
        const optMatch = content.match(optRegex);
        let opts = [];
        let questionText = content;
        if (optMatch) {
            // Options are captured groups 1-4
            opts = [optMatch[1].trim(), optMatch[2].trim(), optMatch[3].trim(), optMatch[4].trim()];
            // Remove the options part from questionText
            const endOfOpts = content.lastIndexOf('(d)') + 3;
            questionText = content.substring(0, endOfOpts).replace(/\(a\)|\(b\)|\(c\)|\(d\)/g, '').trim();
            // Clean up extra whitespace and possible trailing "?" etc.
        } else {
            // Fallback: try to split by (a), (b), (c), (d) manually
            const parts = content.split(/\(a\)|\(b\)|\(c\)|\(d\)/);
            if (parts.length >= 5) {
                questionText = parts[0].trim();
                opts = [parts[1]?.trim() || '', parts[2]?.trim() || '', parts[3]?.trim() || '', parts[4]?.trim() || ''];
            } else {
                // If still fail, just use whole content as question and empty options
                questionText = content;
                opts = ['', '', '', ''];
            }
        }

        // Clean question text from extra whitespace
        questionText = questionText.replace(/\s+/g, ' ').trim();

        // If explanation is empty, we can set to undefined
        if (!explanation) explanation = undefined;

        questions.push({
            q: questionText,
            opts: opts,
            ans: answer,
            exp: explanation
        });
    }
    return questions;
}

const container = document.getElementById('questions-container');

if (questions.length === 0) {
    container.innerHTML = '<p style="color:red;">Error: No questions parsed. Please check the raw text format.</p>';
} else {
    let html = '';
    questions.forEach((item, index) => {
        const qNum = index + 1;
        const optsHtml = item.opts.map((opt, i) => {
            const label = String.fromCharCode(97 + i);
            return `<div class="opt"><strong>${label}.</strong> ${opt}</div>`;
        }).join('');
        const answerText = `Correct option: ${item.ans.toUpperCase()}`;
        const expHtml = item.exp ? `<div class="explanation"><strong>Explanation:</strong> ${item.exp}</div>` : '';
        html += `
            <div class="question-block">
                <div class="q-header">
                    <div class="q-number">Q${qNum}.</div>
                    <div class="q-text">${item.q}</div>
                </div>
                <div class="options">${optsHtml}</div>
                <button class="btn-answer" onclick="toggleAnswer(this)">Show Answer</button>
                <div class="answer-box" id="ans-${qNum}">
                    <div class="ans-label">${answerText}</div>
                    ${expHtml}
                </div>
            </div>
        `;
    });
    container.innerHTML = html;
}

// Toggle function
window.toggleAnswer = function(btn) {
    const block = btn.closest('.question-block');
    const ansBox = block.querySelector('.answer-box');
    if (ansBox.classList.contains('show')) {
        ansBox.classList.remove('show');
        btn.textContent = 'Show Answer';
        btn.classList.remove('active');
    } else {
        ansBox.classList.add('show');
        btn.textContent = 'Hide Answer';
        btn.classList.add('active');
    }
};

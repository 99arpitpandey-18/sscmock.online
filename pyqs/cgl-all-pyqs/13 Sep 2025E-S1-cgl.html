Her slide into dysmorphia was gradual and silent, not dramatic or obvious. On the surface, she remained bright in studies and pleasant in company, carefully wearing an image of normal life. But behind the practiced smiles, she was breaking down inwardly. She began distancing herself emotionally, brushing off her pain as mere vanity, and treating her own value as something insignificant. The moment things changed did not come with an outburst, but with a disturbing silence: she refused to eat for days, and this finally led to medical help. Therapy introduced her to the idea that her self-perception was distorted, and helped her develop the emotional support system needed to rebuild her damaged identity.

["Quantitative Aptitude","A shopkeeper ordered 12 kg of premium coffee and some kg of regular coffee. Premium price per kg was three times regular. The quantities were interchanged by mistake, reducing the total bill by 30%. Find the original quantity ratio premium:regular.","(a) 21:31\n(b) 23:24\n(c) 14:13\n(d) 23:11","d","Let regular quantity be x and regular price be p. Original bill = 36p+xp; interchanged bill = 12p+3xp. Equating the reduction to 30% gives x/12 = 23/11."],
["Quantitative Aptitude","P and Q together can complete a job in 16 days. Q and R together in 24 days, and R and P together in 32 days. In how many days can P alone complete the job?","(a) 30 1/2 days\n(b) 32 days\n(c) 38 2/5 days\n(d) 48 days","c","p+q=1/16, q+r=1/24, r+p=1/32. Hence p=5/192, so P alone takes 192/5 = 38 2/5 days."],
["Quantitative Aptitude","A trader sells one variety of sugar at ₹36/kg at 10% loss, and another at ₹48/kg at 20% loss. Equal quantities are mixed and sold at ₹42/kg. Find overall profit/loss.","(a) Loss of 16%\n(b) Loss of 15%\n(c) Profit of 12.5%\n(d) Profit of 15%","a","CPs are 40 and 60 per kg. Equal-quantity mixture CP=50/kg; SP=42/kg, so loss = 8/50×100 = 16%."],
["Quantitative Aptitude","What is the area of a sector of a circle with radius 9 cm and central angle 80°?","(a) 18π cm²\n(b) 27π cm²\n(c) 36π/5 cm²\n(d) 72π/5 cm²","a","Area = 80/360 × π×9² = 18π cm²."],
["Quantitative Aptitude","Which line is parallel to 4x − 3y = 7?","(a) 4x − 3y = 5\n(b) 3x − 4y = 7\n(c) 4x + 3y = 7\n(d) 2x − 3y = 5","a","Parallel lines have proportional x and y coefficients; 4x−3y=5 has the same left-hand coefficients."],
["Quantitative Aptitude","If cos(90° − θ) = sin(2θ), what is θ?","(a) 60°\n(b) 30°\n(c) 45°\n(d) 90°","a","cos(90°−θ)=sinθ, so sinθ=sin2θ. The keyed solution gives θ=60° in the stated options."],
["Quantitative Aptitude","Given angles A and B are complementary and cosA = 5/13, what is tanB?","(a) 12/5\n(b) 5/12\n(c) 4/3\n(d) 3/4","b","Since B=90°−A, tanB=cotA=cosA/sinA=(5/13)/(12/13)=5/12."],
["Quantitative Aptitude","In a cyclic quadrilateral PQRS, if angle P is 110°, what is angle R?","(a) 70°\n(b) 80°\n(c) 90°\n(d) 110°","a","Opposite angles of a cyclic quadrilateral are supplementary: R=180−110=70°."],
["Quantitative Aptitude","A milkman mixes water with pure milk. If he sells the mixture at the cost price of pure milk and makes a profit of 25%, what is the ratio of water to milk?","(a) 1:3\n(b) 1:4\n(c) 1:5\n(d) 2:5","b","For 25% profit at pure-milk CP, water:milk = 1:4."],
["Quantitative Aptitude","Two cyclists start from the same point on a circular track of length 900 m at 7:00 a.m. in opposite directions. Speeds are 6 km/h and 9 km/h. When will they meet for the fourth time?","(a) 7:15:18 a.m.\n(b) 7:14:24 a.m.\n(c) 7:30:24 a.m.\n(d) 7:36:18 a.m.","b","Relative speed = 15 km/h. One meeting interval = 0.9/15 h = 3.6 min. The keyed fourth-meeting time is 7:14:24 a.m."],
["Quantitative Aptitude","In triangles DEF and PQR, if DE = PQ, EF = QR, and FD = RP, which congruence criterion applies?","(a) SSS\n(b) SAS\n(c) ASA\n(d) RHS","a","All three corresponding sides are equal, so SSS congruence applies."],
["Quantitative Aptitude","A bus covers 30% of a journey at 24 km/h and the remaining distance at 36 km/h. What is the average speed?","(a) 28.8 km/h\n(b) 29.4 km/h\n(c) 30 km/h\n(d) 31.3 km/h","d","For distance D, time = 0.3D/24 + 0.7D/36. Average speed ≈ 31.3 km/h."],
["Quantitative Aptitude","The area of a sector of a circle of radius 6 cm with central angle 120° is:","(a) 12π cm²\n(b) 18π cm²\n(c) 24π cm²\n(d) 30π cm²","a","Area = 120/360 × π×6² = 12π cm²."],
["Quantitative Aptitude","If t = √6 + 3, find t² − 6√6.","(a) 3\n(b) 5\n(c) 9\n(d) 15","d","t² = 15+6√6, hence t²−6√6=15."],
["Quantitative Aptitude","What is the radian measure of 135°?","(a) 3π/5\n(b) 5π/6\n(c) 3π/4\n(d) 7π/6","c","135° × π/180° = 3π/4."],
["Quantitative Aptitude","If sin²θ − cos²θ = −1/3, find cos²θ.","(a) 1/3\n(b) 1/2\n(c) 2/3\n(d) 5/6","c","Let cos²θ=x. Then sin²θ=1−x. So 1−2x=−1/3, giving x=2/3."],

["English Comprehension","Select the most appropriate antonym of FLEETING.","(a) Short-lived\n(b) Transient\n(c) Enduring\n(d) Momentary","c","Fleeting means lasting for a short time; enduring means lasting for a long time."],
["English Comprehension","Select the sentence containing the homonym of the highlighted word: During the ceremony, the fanon lay across the bishop’s shoulder.<br><br>(a) The researcher documented the fanon’s use in early rituals.<br>(b) The seamstress reinforced the fanon’s border with fine stitching.<br>(c) The students discussed Fanon’s views on colonial identity.<br>(d) The priest adjusted the fanon over his chasuble.","c","“fanon” and “Fanon” are different words with the same pronunciation/spelling pattern but different meanings; option c refers to the scholar Frantz Fanon."],
["English Comprehension","Choose the most suitable replacement: I am used to get up early every morning.","(a) of getting up\n(b) with getting up\n(c) to getting up\n(d) for getting up","c","The expression is “be used to + gerund/noun”: used to getting up."],
["English Comprehension","Find the part containing an error: The initiatives praised by the committee (1)/ are not only designed to modernise reporting systems (2)/ but also improving transparency in funding distribution (3)/ across all districts. (4)","(a) (1)\n(b) (2)\n(c) (3)\n(d) (4)","c","Parallel structure requires “but also improve” or “but are also designed to improve,” not “but also improving.”"],
["English Comprehension","Rearrange to form a coherent paragraph:<br>1. Such stories frequently examine the moral and societal impact of technological progress, from AI to genetic modification.<br>2. Science fiction is a form of speculative writing that commonly presents imaginative ideas related to future science and technology.<br>3. As a result, it becomes a strong medium for social critique and for forecasting upcoming problems and dilemmas.<br>4. Though it entertains readers, the genre offers more than simple escapism.","(a) 2, 4, 1, 3\n(b) 1, 3, 2, 4\n(c) 4, 1, 3, 2\n(d) 2, 1, 4, 3","a","The definition comes first, followed by its broader purpose, examples and conclusion."],
["English Comprehension","Spot the correct spelling of a metamorphic rock texture with large, conspicuous crystals.","(a) Prephyroblastic\n(b) Porphyroblastic\n(c) Porfyrablastic\n(d) Porophyroblastik","b","The correct spelling is porphyroblastic."],
["English Comprehension","Find the part containing an error: What the organization did not examine thoroughly enough (1)/ were not the scheme’s objectives themselves, (2)/ but the political consequences it (3)/ might have caused if carried out without wider agreement. (4)","(a) (1)\n(b) (2)\n(c) (3)\n(d) (4)","b","The subject “What ... did not examine” is singular, so “was,” not “were,” is required."],
["English Comprehension","The speaker’s explanation was so packed with technical jargon that it veered into __________.","(a) opacity\n(b) opalescent\n(c) poaceous\n(d) opaque","a","Opacity means lack of clarity, which fits an explanation obscured by excessive jargon."],
["English Comprehension","Select the most appropriate synonym of CUTTING.","(a) Kind\n(b) Pleasant\n(c) Gentle\n(d) Sarcastic","d","“Cutting” can mean sharply critical or sarcastic."],
["English Comprehension","Choose the best replacement: I suggested that he goes to the veterinary surgeon immediately as his dog was not well.","(a) go to veterinary surgeon at once\n(b) should goes to the veterinary surgeon\n(c) go to the veterinary surgeon immediately\n(d) should have gone to the veterinary surgeon","c","After “suggested that,” the subjunctive/base form “go” is appropriate."],
["English Comprehension","Only after ten years of fieldwork __ she truly understand the dialect’s nuances.","(a) she had\n(b) did she\n(c) was she\n(d) she did","b","Negative/restrictive opening “Only after...” triggers subject–auxiliary inversion: did she understand."],
["English Comprehension","Ritika said, “Rajiv does not listen to me.” Choose the correct indirect speech.","(a) Ritika said Rajiv don’t listen to her.\n(b) Ritika said that Rajiv doesn’t listened to her.\n(c) Ritika said that Rajiv didn’t listen to her.\n(d) Ritika said that Rajiv didn’t listened to her.","c","In reported speech, present simple “does not listen” backshifts to “did not listen,” and “me” becomes “her.”"],
["English Comprehension","Change into passive voice: The research team will have reverified the samples before sunrise.","(a) The samples have been reverified by the research team before sunrise.\n(b) The samples will have been reverified by the research team before sunrise.\n(c) The samples will be reverified by the research team before sunrise.\n(d) The samples would have been reverifying by the research team before sunrise.","b","Future perfect passive = will have been + past participle."],
["English Comprehension","Her rebuttal, although polished, did not __________ the core issue raised by the opposition.","(a) address\n(b) depress\n(c) illude\n(d) circumvent","a","“Address an issue” means deal with or respond to it."],
["English Comprehension","Choose the correct one-word substitute: “A government controlled by the rich and powerful.”","(a) Oligarchy\n(b) Bureaucracy\n(c) Plutocracy\n(d) Technocracy","c","Plutocracy is government or rule by the wealthy."],
["English Comprehension","Identify the incorrectly spelt word.","(a) Avaricious\n(b) Temerarious\n(c) Repentant\n(d) Inadvartant","d","The correct spelling is “inadvertent,” not “inadvartant.”"],
["English Comprehension","Convert to active voice: Ancient artifacts are believed to have been quietly removed from the location by trespassers before the audit.","(a) Trespassers removed the ancient artifacts before the audit.\n(b) The location was quietly cleared before the audit.\n(c) Trespassers are believed to have quietly removed ancient artifacts before the audit.\n(d) The artifacts had been removed prior to the audit.","c","The passive reporting structure is retained naturally in active form as “Trespassers are believed to have removed...”"],
["English Comprehension","Rearrange to form a coherent paragraph:<br>1. This process helps ensure that the food we consume is safe and free from harmful microbes or other impurities.<br>2. Food processing refers to a set of techniques used to convert raw ingredients into edible products.<br>3. These techniques may include simple steps like chopping and grinding, as well as advanced procedures such as pasteurization and fermentation.<br>4. In addition, it supports preservation by increasing shelf life and can also improve nutritional value.","(a) 2, 3, 1, 4\n(b) 1, 2, 3, 4\n(c) 3, 1, 4, 2\n(d) 4, 2, 1, 3","a","The definition comes first, then examples, followed by safety and preservation benefits."],
["English Comprehension","Choose the correct meaning of the idiom: Pull no punches","(a) To remain impartial\n(b) To hesitate before talking\n(c) To mislead the listener\n(d) To be direct and honest","d","“Pull no punches” means to speak frankly and without holding back."],
["English Comprehension","In the passage, the expression “gnawing dissonance” most nearly refers to:<div class='passage'><div class='passage-title'>Passage</div>"+passage+"</div>","(a) The physical ache of hunger from missing meals\n(b) The nagging conflict between her real self and online beauty ideals\n(c) Her constant arguments with teachers at school\n(d) Her growing detachment because of academic stress","b","It refers to the persistent conflict between her real self-perception and the idealized images promoted online."],
["English Comprehension","According to the passage, Meera’s mental and emotional decline was:<div class='passage'><div class='passage-title'>Passage</div>"+passage+"</div>","(a) Sudden and openly confrontational\n(b) Unpredictable and meant to draw attention\n(c) Gradual, hidden, and inwardly damaging\n(d) Loud, defiant, and rebellious","c","The passage explicitly describes the decline as gradual, silent and inwardly damaging."],
["English Comprehension","Which idea, introduced through therapy, became the starting point of Meera’s emotional recovery?<div class='passage'><div class='passage-title'>Passage</div>"+passage+"</div>","(a) Seeking narcissistic approval from others\n(b) Understanding self-image distortion\n(c) Learning techniques to manage social isolation\n(d) Following a strict behavioural conditioning plan","b","Therapy helped her understand that her self-perception was distorted, supporting recovery."],
["English Comprehension","Which option best expresses the core message of the passage?<div class='passage'><div class='passage-title'>Passage</div>"+passage+"</div>","(a) Teenagers are mainly affected by peer pressure\n(b) Modern fashion and cosmetic trends dominate teen life\n(c) Curated digital beauty standards trigger silent psychological struggles\n(d) Academic counseling is the most essential need for teens","c","The passage focuses on how curated digital standards can contribute to hidden psychological struggles and calls for media literacy and support."],
["English Comprehension","The author’s tone in the concluding lines of the passage is:<div class='passage'><div class='passage-title'>Passage</div>"+passage+"</div>","(a) Sarcastic and dismissive\n(b) Thoughtful and socially critical\n(c) Cheerful and celebratory\n(d) Emotionless and completely neutral","b","The conclusion reflects on a wider social problem and calls for broader awareness and supportive change."],
["English Comprehension","The supervisor told the staff that the submission deadline had been pushed back by two days. Choose the corresponding direct speech.","(a) “You can turn in the work two days after the scheduled date,” the supervisor informed.\n(b) “The submission deadline has been pushed back by two days,” said the supervisor.\n(c) “We are pushing back the submission deadline by two days,” the supervisor said.\n(d) “You must complete it within two additional days,” the supervisor said.","b","The reported past perfect “had been pushed back” corresponds naturally to the direct statement “has been pushed back.”"]
];

const hi = {
"Reasoning & Quantitative Aptitude":"रीजनिंग एवं क्वांटिटेटिव एप्टीट्यूड",
"General Awareness":"सामान्य जागरूकता",
"Quantitative Aptitude":"मात्रात्मक योग्यता",
"English Comprehension":"अंग्रेज़ी समझ"
};

function sectionIcon(s){return s==="English Comprehension"?"📚":s==="General Awareness"?"🌍":s==="Quantitative Aptitude"?"📐":"🧠"}

function render(){
  const root=document.getElementById("content");
  root.innerHTML="";
  let last="";
  questions.forEach((q,i)=>{
    if(q[0]!==last){
      last=q[0];
      const sec=document.createElement("div");
      sec.className="section";
      sec.dataset.en=q[0]; sec.dataset.hi=hi[q[0]];
      const ranges={"Reasoning & Quantitative Aptitude":"1–25","General Awareness":"26–50","Quantitative Aptitude":"51–75","English Comprehension":"76–100"};
      sec.innerHTML=sectionIcon(q[0])+" "+q[0]+" (Q"+ranges[q[0]]+")";
      root.appendChild(sec);
    }
    const card=document.createElement("div"); card.className="question";
    const qNo=i+1;
    card.innerHTML=`<div class="qtext">Q${qNo}. ${q[1]}</div>
      <div class="options">${q[2]}</div>
      <div class="action-row"><button class="answer-btn" onclick="toggleAnswer(this)">Show Answer</button></div>
      <div class="answer"><strong>Ans. (${q[3]})</strong><div class="explain"><b>Explanation:</b> ${q[4]}</div></div>`;
    root.appendChild(card);
  });
}
function toggleAnswer(btn){
  const ans=btn.parentElement.nextElementSibling;
  ans.classList.toggle("show");
  btn.textContent=ans.classList.contains("show")?"Hide Answer":"Show Answer";
}
let allShown=false;
function toggleAll(){
  allShown=!allShown;
  document.querySelectorAll(".answer").forEach(a=>a.classList.toggle("show",allShown));
  document.querySelectorAll(".answer-btn").forEach(b=>b.textContent=allShown?"Hide Answer":"Show Answer");
}
function changeLang(){
  const lang=document.getElementById("lang").value;
  document.querySelectorAll(".section").forEach(s=>s.textContent=sectionIcon(s.dataset.en)+" "+(lang==="hi"?s.dataset.hi:s.dataset.en));
}
render();
</script>
</body>
</html>

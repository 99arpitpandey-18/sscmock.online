Q.22  यिद 15 माच 2015 को रिववार था, तो 15 जुलाई 2015 को सप्ताह का कौन सा िदन था?
A. मंगलवार
B. बुधवार
C. बृहस्पितवार
D. शुक्रवार
Answer: B
Sol: िदया गया है: यिद 15 माच 2015 को रिववार था।
समाधान:
हम 15 माच से 15 जुलाई 2015 तक के िदनों की गणना करते ह।
माच → 31 − 15 = 16 िदन
अप्रैल = 30 िदन
मई = 31 िदन
जून = 30 िदन
जुलाई → 15 तक = 15 िदन
कुल िदन: 16 + 30 + 31 + 30 + 15 = 122 िदन
अब 7 से िवभािजत कर:
122 ÷ 7 = 17 सप्ताह + 3 िदन
तो िदन रिववार से 3 िदन आगे बढ़ जाता है।
रिववार → सोमवार (1) → मंगलवार (2) → बुधवार (3)
अतः , 15 जुलाई 2015 को सप्ताह का िदन बुधवार था।
इस प्रकार, सही िवकल्प (b) है।

Q.32  A और B की वतमान आयु का अनुपात 5 : 3 है। अब से 8 वष बाद, A की आयु 28 वष होगी। अब से 12 वष बाद A और B की आयु का अनुपात क्या होगा?
A. 7 : 5
B. 4 : 5
C. 7 : 4
D. 4 : 3
Answer: D
Sol: िदया गया है: A और B की वतमान आयु का अनुपात 5 : 3 है। अब से 8 वष बाद, A की आयु 28 वष होगी।
समाधान:
माना वतमान आयु इस प्रकार है:
A = (5x)
B = (3x)
8 वष बाद की स्थित
8 वष बाद, A की आयु = 28
5x + 8 = 28
हल करने पर:
(5x = 20)
(x = 4)
वतमान आयु:
A = (5 × 4 = 20)
B = (3 × 4 = 12)
12 वष बाद की आयु:
A = (20 + 12 = 32)
B = (12 + 12 = 24)
12 वष बाद का अनुपात: (32 : 24)
8 से िवभािजत करने पर: (4 : 3)
अतः , अब से 12 वष बाद A और B की आयु का अनुपात 4 : 3 होगा।
इस प्रकार, सही िवकल्प (d) है।

Q.41  ____ खेती की एक ऐसी िविध है जहाँ एक ही खेत म एक साथ फसल उगाई जाती ह और पशुओं का पालन-पोषण िकया जाता है।

• आरंिभक सावजिनक िनगम (IPO): 2022 म, LIC ने भारत के अब तक के सबसे बड़े IPO म से एक के साथ सावजिनक प्रवेश िकया, हालांिक सरकार अभी भी बहुमत
िह े दारी बनाए हुए है।
Additional Knowledge:
• 1948 (िवकल्प A): इस वष भारतीय औ ोिगक िवत्त िनगम (IFCI) की स्थापना हुई थी।
• 1964 (िवकल्प C): यह वष भारतीय औ ोिगक िवकास बक (IDBI) और UTI की स्थापना के िलए महत्वपूण है।
• 1972 (िवकल्प D): साधारण बीमा व्यवसाय (राष्टीयकरण) अिधिनयम 1972 म पा रत िकया गया था, िजसके कारण 1973 म साधारण बीमा कं पिनयों का राष्टीयकरण हुआ।
Q.43  चंद्रमा लगभग ____ िदनों म पृ ी का एक चक्कर (प रक्रमा) पूरा करता है।
A. 15
B. 27
Copyright © 2026 Adda247
C. 31
D. 365
Answer: B
Sol: सही उत्तर (B) 27 है
Explanation:
• चंद्रमा को पृ ी का एक चक्कर पूरा करने म लगभग 27.3 िदन (िवशेष रूप से 27 िदन, 7 घंटे और 43 िमनट) लगते ह। इसे नाक्षत्र मास के रूप म जाना जाता है।
• िदलचस्प बात यह है िक चंद्रमा को अपनी धुरी पर एक घूणन पूरा करने म भी ठीक उतना ही समय लगता है।
• इस घटना को टाइडल लॉिकंग या िसंक्रोनस रोटेशन के रूप म जाना जाता है, यही कारण है िक हम हमेशा पृ ी से चंद्रमा का एक ही भाग (चेहरा) देखते ह।
• हालाँिक, एक अमावस्या और अगली अमावस्या के बीच का समय लगभग 29.5 िदन (युित मास या Synodic Month) होता है, क्योंिक पृ ी भी सूय के चारों ओर अपनी कक्षा म
आगे बढ़ती है।
Information Booster:
• उपभू (Perigee) और अपभू (Apogee): चंद्रमा की कक्षा अ ाकार है। जब यह पृ ी के सबसे करीब होता है, तो यह 'उपभू' पर होता है; जब यह सबसे दूर होता है, तो यह
'अपभू' पर होता है।
• चंद्रमा का प्रकाश: चंद्रमा का अपना प्रकाश नहीं है; यह सूय के प्रकाश को परावितत करता है। पृ ी, चंद्रमा और सूय के बीच बदलते कोणों के प रणामस्वरूप 'चंद्रमा की
कलाएँ ' (Phases of the Moon) बनती ह।
• गुरुत्वाकषण: चंद्रमा का गुरुत्वाकषण खंचाव मुख्य रूप से पृ ी के महासागरों म ार के िलए िजम्मेदार है।
Additional Knowledge:
• 15 िदन (िवकल्प A): यह मोटे तौर पर एक अमावस्या और पूिणमा (िहंदू कैलडर म एक पक्ष) के बीच का समय है।
• 31 िदन (िवकल्प C): यह पृ ी पर कई कैलडर महीनों की लंबाई है लेिकन यह एक िविशष्ट चंद्र चक्र के अनुरूप नहीं है।
• 365 िदन (िवकल्प D): यह पृ ी ारा सूय का एक चक्कर पूरा करने म लगने वाला अनुमािनत समय (एक वष) है।
Q.44  आधुिनक आवत सारणी म, तत्वों को िकस आधार पर व्यवस्थत िकया गया है?
A. बढ़ते परमाणु द्रव्यमान
B. बढ़ते परमाणु क्रमांक
C. घटती प्रितिक्रयाशीलता
D. समस्थािनकों की घटती संख्या
Answer: B
Sol: सही उत्तर (B) बढ़ते परमाणु क्रमांक है
व्या ा:
• आधुिनक आवत सारणी आधुिनक आवत िनयम पर आधारत है, िजसम कहा गया है िक "तत्वों के भौितक और रासायिनक गुण उनके परमाणु क्रमांकों के आवत फलन होते ह।"
• यह 1913 म हेनरी मोसले ारा प्रस्तािवत िकया गया था, िज ोंने िदखाया िक परमाणु क्रमांक िकसी तत्व के परमाणु द्रव्यमान की तुलना म अिधक मूलभूत गुण है।
• परमाणु क्रमांक ारा तत्वों को व्यव स्थत करने से िपछली सारिणयों म पाई गई िवसंगितयां हल हो जाती ह, जैसे समस्थािनकों की स्थित और कोबाल्ट और िनकल जैसे तत्वों के
कुछ जोड़े का स्थान।
• सारणी म 18 ऊ ाधर स्तंभ होते ह िज 'समूह' कहा जाता है और 7 क्षैितज पं क्तयां होती ह िज 'आवत' कहा जाता है।
Information Booster:
• मडलीफ की आवत सारणी: यह िपछला संस्करण परमाणु द्रव्यमान पर आधारत था। यह शानदार था लेिकन इसम खािमयां थीं, जैसे हाइडोजन के िलए एक िनि त स्थान का न
होना।
• परमाणु क्रमांक (Z): िकसी परमाणु के नािभक म प्रोटॉन की संख्या को संदिभत करता है, जो एक उदासीन परमाणु म इलेक्टॉनों की संख्या के बराबर भी होता है।
• संयोजक इलेक्टॉन: एक ही समूह के तत्वों म समान संख्या म संयोजक इलेक्टॉन होते ह, जो उ समान रासायिनक गुण प्रदान करते ह।
Additional Knowledge:
• बढ़ता परमाणु द्रव्यमान (िवकल्प A): यह न्यूलड्स के अष्टक िनयम और मडलीफ की आवत सारणी का आधार था, लेिकन आधुिनक सारणी म इसे परमाणु क्रमांक ारा
प्रितस्थािपत कर िदया गया था।
• घटती प्रितिक्रयाशीलता (िवकल्प C): प्रितिक्रयाशीलता सारणी म िभन्न होती है (कुछ िदशाओं म बढ़ती है और अन्य म घटती है) लेिकन यह संगठनात्मक आधार नहीं है।
• समस्थािनकों की सं ा (िवकल्प D): समस्थािनकों की संख्या कोई आवत गुण नहीं है और यह सारणी म िकसी व्यव स्थत क्रम का पालन नहीं करती है।
Q.45  डाइमेकस ने िकस शासक ारा भेजे गए एक राजदूत के रूप म िबंदुसार के दरबार का दौरा िकया था?
A. एं िटयोकस I
B. सेल्यूकस I
C. टॉलेमी II
D. डे रयस III
Answer: A
Sol: सही उत्तर (A) एं िटयोकस I है
Copyright © 2026 Adda247
Explanation:
• डाइमेकस सेल्यूिसड सा ाज्य का एक यूनानी राजदूत था िजसने मौय स ाट िबंदुसार (चंद्रगुप्त मौय के पुत्र) के दरबार का दौरा िकया था।
• उसे सी रया के शासक एं िटयोकस I सोटर ारा भेजा गया था।
• यह िसकं दर के आक्रमण के बाद स्थािपत हेलेिनस्टक (यूनानी) राज्यों और मौय सा ाज्य के बीच िनरंतर राजनियक संबंधों को इंिगत करता है।
• ऐितहािसक वृत्तांतों के अनुसार, िबंदुसार ने एं िटयोकस I से मीठी शराब, सूखे अंजीर और एक दाशिनक का अनुरोध िकया था। एं िटयोकस ने पहले दो भेजे लेिकन दाशिनक के
िलए मना कर िदया, यह कहते हुए िक यूनानी कानून दाशिनकों की िबक्री की अनुमित नहीं देता है।
Information Booster:
• िबंदुसार: 'अिमत्रघात' (शत्रुओं का नाश करने वाला) के रूप म जाना जाता है, उ ोंने मौय सा ाज्य का दिक्षण की ओर िवस्तार िकया।
• मेगस्थनीज: वह डाइमेकस का पूववत था, िजसे सेल्यूकस I िनके टर ारा चंद्रगुप्त मौय के दरबार म भेजा गया था।
• डायोिनिसयस: िमस्र के टॉलेमी िफलाडेल्फस ारा मौय दरबार म भेजा गया एक अन्य राजदूत।
Additional Knowledge:
• सेल्यूकस I (िवकल्प B): वह सेल्यूिसड सा ाज्य का संस्थापक था और उसने मेगस्थनीज को भेजा था, डाइमेकस को नहीं।
• टॉलेमी II (िवकल्प C): िमस्र का शासक िजसने िबंदुसार या अशोक के शासनकाल के दौरान राजदूत डायोिनिसयस को मौय दरबार म भेजा था।
• डे रयस III (िवकल्प D): फारस (पिशया) के अंितम अचमेिनद राजाओं के राजा, िज मौय-यूनानी कू टनीित के उदय से बहुत पहले िसकं दर महान ारा परािजत िकया गया
था।
Q.46 राष्टीय िवकास प रषद (NDC) के संबंध म िनम्निल खत म से कौन सा कथन सही है? I. इसकी स्थापना 1952 म हुई थी। II. भारत के प्रधान मंत्री इसके अध्यक्ष के रूप म काय करते
ह।
A. के वल I
B. के वल II
C. I और II दोनों
D. न तो I और न ही II
Answer: C
Sol: सही उत्तर (C) I और II दोनों है
Explanation:
• राष्टीय िवकास प रषद (NDC) की स्थापना 6 अगस्त, 1952 को भारत सरकार के एक कायकारी प्रस्ताव ारा की गई थी।
• इसे पंचवषय योजनाओं के समथन म राष्ट के प्रयासों और संसाधनों को मजबूत करने और जुटाने तथा सभी महत्वपूण क्षेत्रों म सामान्य आिथक नीितयों को बढ़ावा देने के िलए
बनाया गया था।
• प्रधान मंत्री NDC के अध्यक्ष के रूप म काय करते ह।
• इसके सदस्यों म कद्रीय कै िबनेट मंत्री, सभी राज्यों के मुख्यमंत्री, और कद्र शािसत प्रदेशों के प्रितिनिध तथा योजना आयोग (अब नीित आयोग) के सदस्य शािमल ह।
Information Booster:
• स्थित: योजना आयोग (और अब नीित आयोग) की तरह, NDC न तो एक संवैधािनक िनकाय है और न ही एक वैधािनक िनकाय है।
• काय: इसका प्राथिमक काय समय-समय पर राष्टीय योजना के कामकाज की समीक्षा करना और राष्टीय िवकास को प्रभािवत करने वाले सामािजक और आिथक नीित के
महत्वपूण प्रश्नों पर िवचार करना था।
• वतमान संदभ: नीित आयोग ारा योजना आयोग के प्रितस्थापन और पंचवषय योजनाओं से दूर जाने के साथ, NDC की प्रासंिगकता और बैठक की आवृित्त काफी कम हो गई
है।
Additional Knowledge:
• नीित आयोग: 2015 म योजना आयोग का स्थान िलया। जबिक नीित आयोग म एक गविनग काउंिसल (िजसम मुख्यमंत्री शािमल ह) है, NDC पुराने ढांचे म योजना अनुमोदन के
िलए सवच्च िनकाय बना हुआ है।
• प्रशासिनक संरचना: योजना आयोग (अब नीित आयोग) के सिचव राष्टीय िवकास प रषद के सिचव के रूप म काय करते थे।
Q.47  मानव रक्त का कौन सा घटक मुख्य रूप से ऊतकों तक ऑक्सीजन ले जाने के िलए िजम्मेदार है?
A. श्वेत रक्त कोिशकाएं
B. रक्त े टलेट्स
C. ा ा
D. लाल रक्त कोिशकाएं
Answer: D
Sol: सही उत्तर (D) लाल रक्त कोिशकाएं है
व्या ा:
• लाल रक्त कोिशकाएं (RBCs), िज ए र ोसाइट्स के रूप म भी जाना जाता है, म हीमो ोिबन नामक एक प्रोटीन होता है।
• हीमो ोिबन ऑक्सीहीमो ोिबन बनाने के िलए फेफड़ों म ऑक्सीजन के साथ जुड़ता है और इसे शरीर की सभी कोिशकाओं और ऊतकों तक ले जाता है।
• RBCs का आकार उभयावतल होता है, जो ऑक्सीजन िविनमय के िलए उनके सतह क्षेत्र को बढ़ाता है, और हीमो ोिबन के िलए अिधक जगह बनाने के िलए उनम कद्रक का
अभाव होता है।
• एक िविशष्ट मानव RBC का जीवनकाल लगभग 120 िदन होता है।
Information Booster:
• लोहा: हीमो ोिबन को ठीक से काम करने के िलए लोहे की आवश्यकता होती है; लोहे की कमी से एनीिमया होता है।

• उ ादन: RBCs मुख्य रूप से ए र ोपोएिसस नामक प्रिक्रया के माध्यम से लाल अ स्थ म ा म उत्पन्न होते ह।
• काबन डाइऑ ाइड: जबिक RBCs मुख्य रूप से ऑक्सीजन ले जाते ह, वे शरीर के लगभग 20-25% काबन डाइऑक्साइड को वापस फेफड़ों म भी ले जाते ह।
Additional Knowledge:
• े त रक्त कोिशकाएं (िवकल्प A): ल्यूकोसाइट्स के रूप म भी जाना जाता है, वे प्रितरक्षा प्रणाली का िह ा ह और शरीर को संक्रमण से लड़ने म मदद करते ह।
• रक्त े टलेट्स (िवकल्प B): ो ोसाइट्स के रूप म भी जाना जाता है, वे चोट के दौरान अत्यिधक रक्तस्राव को रोकने के िलए रक्त के थक्के जमने के िलए आवश्यक ह।
• ा ा (िवकल्प C): रक्त का तरल घटक जो पूरे शरीर म पोषक तत्वों, हामन और प्रोटीन के साथ-साथ अपिशष्ट उत्पादों को ले जाता है।
Q.48  भारतीय संिवधान के िकस अनुच्छेद के तहत िवत्तीय आपातकाल की घोषणा की जा सकती है?
A. अनुच्छेद 352
B. अनुच्छेद 356
C. अनुच्छेद 360
D. अनुच्छेद 368
Answer: C
Sol: सही उत्तर (C) अनु े द 360 है
व्या ा:
• भारतीय संिवधान का अनुच्छेद 360 राष्टपित को िवत्तीय आपातकाल की घोषणा करने का अिधकार देता है यिद वह संतुष्ट है िक ऐसी स्थित उत्पन्न हो गई है िजससे भारत या
उसके क्षेत्र के िकसी भी िह े की िवत्तीय स्थरता या साख को खतरा है।
• संसद के दोनों सदनों ारा अनुमोिदत होने के बाद, िवत्तीय आपातकाल तब तक अिनि त काल तक जारी रहता है जब तक िक राष्टपित ारा इसे रद्द नहीं कर िदया जाता।
• ऐसे आपातकाल के दौरान, संघ का कायकारी अिधकार िकसी भी राज्य को िवत्तीय औिचत्य के िनिदष्ट िसद्धांतों का पालन करने के िनदश देने तक िवस्ता रत होता है।
• गौरतलब है िक 1991 के आिथक संकट के दौरान भी भारत म अब तक कभी िवत्तीय आपातकाल घोिषत नहीं िकया गया है।
Information Booster:
• संसदीय अनुमोदन: िवत्तीय आपातकाल की घोषणा करने वाली उद्घोषणा को उसके जारी होने की तारीख से दो महीने के भीतर संसद के दोनों सदनों ारा अनुमोिदत िकया
जाना चािहए।
• प्रभाव: राष्टपित सवच्च न्यायालय और उच्च न्यायालयों के न्यायाधीशों सिहत संघ की सेवा करने वाले सभी या िकसी भी वग के व्य क्तयों के वेतन और भत्तों म कमी के िलए
िनदश जारी कर सकता है।
• रद्द करना: एक उद्घोषणा को राष्टपित ारा िकसी भी समय बाद की उद्घोषणा ारा रद्द या प रवितत िकया जा सकता है और रद्द करने के िलए संसदीय अनुमोदन की
आवश्यकता नहीं होती है।
Additional Knowledge:
• अनु े द 352 (िवकल्प A): यह युद्ध, बाहरी आक्रमण या सशस्त्र िवद्रोह के आधार पर 'राष्टीय आपातकाल' से संबंिधत है।
• अनु े द 356 (िवकल्प B): यह 'राष्टपित शासन' या राज्य आपातकाल से संबंिधत है, िजसे तब लगाया जाता है जब िकसी राज्य म संवैधािनक तंत्र िवफल हो जाता है।
• अनु े द 368 (िवकल्प D): यह अनुच्छेद संसद को संिवधान म संशोधन करने की शक्त प्रदान करता है और ऐसे संशोधनों के िलए प्रिक्रया िनधारत करता है।
Q.49  RBI ारा नई श्रृंखला का 200 रुपये का बकनोट पेश िकया गया था। िमलीमीटर म इस नोट की अनुमािनत चौड़ाई िकतनी है?
A. 120
B. 146
C. 166
D. 150
Answer: B
Sol: सही उत्तर (B) 146 है
Explanation:
• महात्मा गांधी (नई) श्रृंखला का 200 रुपये का बकनोट अगस्त 2017 म भारतीय रज़व बक ारा पेश िकया गया था।
• नोट के आयाम 66 िममी × 146 िममी (ऊं चाई x चौड़ाई) ह।
• नोट का मूल रंग चमकीला पीला ( ाइट येलो) है।
• नोट के िपछले िह े म सांची स्तूप का रूपांकन है, जो देश की सांस्कृ ितक िवरासत को दशाता है।
Information Booster:
• सुरक्षा िवशेषताएं : इसम मूल्यवग अंक 200 के साथ एक सी-ू रिजस्टर, एक अव्यक्त (लेटट) छिव और कद्र म महात्मा गांधी का िचत्र शािमल है।
• अन्य नोट: 500 रुपये का नोट (66 िममी x 150 िममी), 2000 रुपये का नोट (66 िममी x 166 िममी), और 100 रुपये का नोट (66 िममी x 142 िममी)।
• भाषा पैनल: सभी भारतीय बकनोटों की तरह, 200 रुपये के नोट म 15 भाषाओं म मूल्यवग प्रदिशत करने वाला एक भाषा पैनल है।
Additional Knowledge:
• 120 िममी (िवकल्प A): यह नई श्रृंखला म िकसी भी मानक उच्च-मूल्यवग के नोट से काफी छोटा है।
• 166 िममी (िवकल्प C): यह 2000 रुपये के बकनोट की चौड़ाई है (श्रृंखला म सबसे लंबी)।
• 150 िममी (िवकल्प D): यह नए 500 रुपये के बकनोट की चौड़ाई है।

Q.50  'T' अथव्यवस्था का एक क्षेत्र है जो उपभोक्ताओं और उत्पादन क्षेत्रों दोनों को सेवाएं प्रदान करता है। िनम्निल खत म से कौन 'T' का िह ा है?
A. खनन
B. सूचना प्रौ ोिगकी
C. पशुपालन
D. कपड़ा िनमाण
Answer: B
Sol: सही उत्तर (B) सूचना प्रौ ोिगकी है
व्या ा:
• 'T' अक्षर तृतीयक क्षेत्र को संदिभत करता है, िजसे सेवा क्षेत्र के रूप म भी जाना जाता है। इसम मूत वस्तुओं के बजाय सेवाओं का प्रावधान शािमल है।
• सूचना प्रौ ोिगकी (IT) आधुिनक सेवा क्षेत्र का एक मुख्य घटक है, जो व्य क्तयों और व्यवसायों दोनों को िडिजटल सेवाएं , सॉफ्टवेयर िवकास और डेटा प्रबंधन प्रदान करता है।
• यह क्षेत्र प रवहन, बिकं ग, बीमा और संचार सहायता प्रदान करके प्राथिमक और ि तीयक क्षेत्रों की सहायता करता है।
• कई िवकासशील और िवकिसत देशों म, तृतीयक क्षेत्र जीडीपी म सबसे बड़ा िह ा योगदान देता है।
Information Booster:
• चतुथक क्षेत्र: अक्सर तृतीयक क्षेत्र का एक उपसमूह माना जाता है, इसम अनुसंधान और िवकास (R&D) और उच्च-स्तरीय आईटी सेवाओं जैसी बौद्धक गितिविधयां शािमल ह।
• पंचमक क्षेत्र: इसम अथव्यवस्था म िनणय लेने का उच्चतम स्तर शािमल है, िजसम शीष सरकारी अिधकारी और सीईओ शािमल ह।
• आिथक िवकास: िफशर- ाक मॉडल के अनुसार, जैसे-जैसे अथव्यवस्थाएं िवकिसत होती ह, कायबल प्राथिमक से ि तीयक और अंततः तृतीयक क्षेत्र म स्थानांत रत हो जाता
है।
Additional Knowledge:
• खनन (िवकल्प A): प्राथिमक क्षेत्र का िह ा क्योंिक इसम सीधे प्रकृ ित से कच्चे माल का िनष्कषण शािमल है।
• पशुपालन (िवकल्प C): प्राथिमक क्षेत्र का िह ा, उपज के िलए कृ िष पशुओं के प्रजनन और देखभाल से संबंिधत है।
• कपड़ा िनमाण (िवकल्प D): ि तीयक क्षेत्र (िविनमाण) का िह ा, क्योंिक यह कच्चे माल (कपास/फाइबर) को तैयार उत्पादों (कपड़े) म संसािधत करता है।
Q.51  िदल्ली म लाल िकला परसर के अंदर प्रिसद्ध मोती म द का िनमाण िकसने करवाया था?
A. अकबर
B. जहांगीर
C. शाहजहां
D. औरंगजेब
Answer: D
Sol: सही उत्तर (D) औरंगजेब है
व्या ा:
• िदल्ली म लाल िकले के अंदर मोती म द का िनमाण मुगल स ाट औरंगजेब ने 1659 और 1660 के बीच करवाया था।
• इसे स ाट की व्यक्तगत म द के रूप म उपयोग करने का इरादा था, क्योंिक मुख्य जामा म द िकले के बाहर स्थत थी।
• यह सफे द संगमरमर से बनी है और हमाम के पि म म और दीवान-ए-खास के करीब स्थत है।
• इसकी वास्तुकला औरंगजेब काल की िविशष्ट है, िजसम तीन गुंबद और घुमावदार मेहराब ह।
Information Booster:
• अन्य मोती म द: आगरा के िकले म एक और प्रिसद्ध मोती म द स्थत है, िजसे शाहजहां ने बनवाया था। छात्र अक्सर इन दोनों म भ्रिमत हो जाते ह।
• िडजाइन: िदल्ली की मोती म द अपेक्षाकृ त छोटी है और यह स ाट और जनाना की मिहलाओं के िनजी उपयोग के िलए थी।
• यूने ो स्थल: लाल िकला प रसर, िजसम यह म द है, को 2007 म यूनेस्को िवश्व धरोहर स्थल नािमत िकया गया था।
Additional Knowledge:
• अकबर (िवकल्प A): आगरा का िकला और फतेहपुर सीकरी बनाने के िलए जाना जाता है, लेिकन िदल्ली म मोती म द उनके शासनकाल के बहुत बाद बनाई गई थी।
• जहांगीर (िवकल्प B): उ ोंने बगीचों और िचत्रों पर अिधक ध्यान किद्रत िकया; उ ोंने िदल्ली म मोती म द का िनमाण नहीं िकया।
• शाहजहां (िवकल्प C): उ ोंने स्वयं लाल िकले और आगरा म मोती म द का िनमाण िकया था, लेिकन िदल्ली के लाल िकले के अंदर की म द उनके बेटे औरंगजेब ारा
जोड़ी गई थी।
Q.52  िसंहस्थ कुंभ मेला िनम्निलखत म से िकस शहर म आयोिजत िकया जाता है?
A. नािसक
B. उ ै न
C. ह र ार
D. प्रयागराज
Answer: B

Explanation:

• इसे 'िसंहस्थ' कहा जाता है क्योंिक यह तब होता है जब बृहस्पित (गुरु) ग्रह िसंह (Leo) रािश म प्रवेश करता है।
• कुंभ मेला भारत म चार स्थानों पर मनाया जाता है: प्रयागराज, ह र ार, नािसक और उ ै न, जो हर 12 साल म घूमते ह।
• लाखों श्रद्धालु नदी म पिवत्र ान करने के िलए इक ा होते ह, यह मानते हुए िक यह उ पापों से मुक्त करता है और मोक्ष की ओर ले जाता है।

• यूने ो मान्यता: कुंभ मेले को 2017 म मानवता की अमूत सांस्कृ ितक िवरासत की यूनेस्को प्रितिनिध सूची म अंिकत िकया गया था।
• पौरािणक कथा: यह त्योहार 'समुद्र मंथन' से जुड़ा है जहां इन चार स्थानों पर 'अमृत' (अमरता का रस) की बूंद िगरी थीं।
• अनुक्रम: उ ै न िसंहस्थ एक साल बाद नािसक म कुंभ मेले के बाद आता है।
Additional Knowledge:
• नािसक (िवकल्प A): यहां कुंभ मेला गोदावरी नदी के तट पर आयोिजत िकया जाता है।
• ह र ार (िवकल्प C): यहां कुंभ मेला गंगा नदी के तट पर आयोिजत िकया जाता है।
• प्रयागराज (िवकल्प D): यहां कुंभ मेला ित्रवेणी संगम (गंगा, यमुना और पौरािणक सरस्वती के संगम) पर आयोिजत िकया जाता है।
Q.53  सेशेल्स ीप समूह कहाँ स्थत ह?
A. अटलांिटक महासागर
B. िहंद महासागर
C. प्रशांत महासागर
D. दिक्षणी महासागर
Answer: B
Sol: सही उत्तर (B) िहंद महासागर है
Explanation:
• सेशेल्स एक ीपसमूह वाला देश है िजसम पूव अ ीका के तट पर िहंद महासागर म 115 ीप शािमल ह।
• इसकी राजधानी और सबसे बड़ा शहर, िवक्टो रया, मुख्य भूिम अ ीका से 1,500 िकलोमीटर पूव म स्थत है।
• लगभग 100,000 की अनुमािनत आबादी वाला यह सबसे कम आबादी वाला संप्रभु अ ीकी देश है।
• ीपों को दो मुख्य समूहों म िवभािजत िकया गया है: माहे समूह (ग्रेनाइट ीप) और बाहरी ीप (प्रवाल या कोरिलन ीप)।
Information Booster:
• रणनीितक महत्व: सेशेल्स भारत की SAGAR (क्षेत्र म सभी के िलए सुरक्षा और िवकास) पहल का िह ा है और क्षेत्रीय सुरक्षा के िलए महत्वपूण समुद्री महत्व रखता है।
• अ ाबरा एटोल: सेशेल्स अल्डाबरा एटोल का घर है, जो दुिनया का दूसरा सबसे बड़ा प्रवाल एटोल और यूनेस्को िवश्व धरोहर स्थल है।
• जलवायु: इसम साल भर उच्च आद्रता और आरामदायक तापमान के साथ उष्णकिटबंधीय वषावन जलवायु होती है।
Additional Knowledge:
• अटलांिटक महासागर (िवकल्प A): इस महासागर म अज़ोरेस, बरमूडा और फ़ॉकलड जैसे ीप ह, लेिकन सेशेल्स नहीं।
• प्रशांत महासागर (िवकल्प C): यह सबसे बड़ा महासागर है, िजसम िफजी, हवाई और तािहती जैसे ओिशिनया ीप ह।
• दिक्षणी महासागर (िवकल्प D): इसे अंटाकिटक महासागर के रूप म भी जाना जाता है, यह अंटाकिटका को घेरता है और इसम दिक्षण शेटलड ीप समूह जैसे ीप ह।
Q.54  िकसी खेल मैच म िनम्निलखत म से कौन सा खलाड़ी आमतौर पर अपने मानक उपकरण के िह े के रूप म दस्ताने नहीं पहनता है?
A. एक फु टबॉल गोलकीपर
B. एक बॉ क्संग एथलीट
C. एक बास्के टबॉल खलाड़ी
D. एक िक्रके ट िवके टकीपर
Answer: C
Sol: सही उत्तर (C) एक बा े टबॉल खलाड़ी है
Explanation:
• बास्के टबॉल म, खलाड़ी सटीक रूप से िडबल करने, पास करने और शूट करने के िलए अपनी उंगिलयों और हथेिलयों के सीधे एहसास और पकड़ पर भरोसा करते ह। दस्ताने
पहनने से इस स्पश संवेदनशीलता और गद िनयंत्रण म बाधा उत्पन्न होगी।
• हालांिक कुछ खलाड़ी स्वेटबड या िफं गर टेप का उपयोग कर सकते ह, दस्ताने बास्के टबॉल म मानक या कानूनी उपकरण का िह ा नहीं ह।
• इसके िवपरीत, विणत अन्य खेलों म सुरक्षा या बढ़ी हुई पकड़/पैिडंग के िलए दस्ताने की आवश्यकता होती है।

Q.55  िक्रके ट म “पावर े ” शब्द खेल के िकस भाग से संबंिधत है?
A. बल्लेबाजी रणनीित प्रितबंध
B. क्षेत्ररक्षण प्रितबंध
C. गदबाजी गित सीमा
D. अंपाय रंग िनणय
Answer: B
Sol: सही उत्तर (B) क्षेत्ररक्षण प्रितबंध है
व्या ा:
• सीिमत ओवरों के िक्रके ट (ODIs और T20Is) म पावर े एक िनयम है जो कुछ ओवरों के दौरान 30-गज के घेरे के बाहर अनुमत क्षेत्ररक्षकों की संख्या को सीिमत करता है।
• टी20 अंतरराष्टीय मैचों म, पहले 6 ओवर पावर े होते ह, जहां घेरे के बाहर के वल 2 क्षेत्ररक्षकों की अनुमित होती है।
• एक िदवसीय अंतरराष्टीय (ODIs) म, आमतौर पर पावर े के तीन चरण होते ह: अिनवाय पावर े (ओवर 1-10), दूसरा पावर े (ओवर 11-40), और तीसरा पावर े (ओवर
41-50), िजनम से प्रत्येक के अलग-अलग क्षेत्ररक्षक सीमा िनयम होते ह।
• इसका उद्देश्य पारी के शुरुआती चरणों म आक्रामक बल्लेबाजी और उच्च स्कोरंग को प्रोत्सािहत करना है।
Information Booster:
• अिनवाय पावर े (ODI): पहले 10 ओवरों के िलए 30-गज के घेरे के बाहर के वल दो क्षेत्ररक्षकों की अनुमित होती है।
• गैर-पावर े ओवर: पावर े के बाद, अिधक क्षेत्ररक्षकों (आमतौर पर वनडे म 5 तक) को बाउंडी पर रखा जा सकता है।
• इितहास: इस अवधारणा को आईसीसी ारा वनडे के मध्य ओवरों को अिधक रोमांचक बनाने और रक्षात्मक गदबाजी/क्षेत्ररक्षण रणनीित को खेल पर हावी होने से रोकने के िलए
पेश िकया गया था।
Additional Knowledge:
• ब े बाजी रणनीित (िवकल्प A): हालांिक बल्लेबाज रणनीित के िलए पावर े का उपयोग करते ह, लेिकन यह शब्द अपने आप म फील्ड े समट से संबंिधत एक िनयम को
प रभािषत करता है, न िक कोई मजबूर बल्लेबाजी शैली।
• गदबाजी गित (िवकल्प C): िक्रके ट म गित सीमा से संबंिधत 'पावर े ' की कोई अवधारणा नहीं है; गित गदबाज का एक स्वाभािवक गुण है।
• अंपाय रंग िनणय (िवकल्प D): अंपाय रंग म डीआरएस या एलबीड ू जैसे िनयम शािमल ह, जो क्षेत्ररक्षण प्रितबंध िनयमों से अलग ह।
Q.56  'िशशु मृत्यु दर' क्या है?
A. प्रित 100 जीिवत ज ों पर 1 वष से कम आयु के बच्चों की मृत्यु की संख्या।
B. प्रित 1000 जीिवत ज ों पर 1 वष से कम आयु के बच्चों की मृत्यु की संख्या।
C. प्रित 1000 जीिवत ज ों पर 5 वष से कम आयु के बच्चों की मृत्यु की संख्या।
D. प्रित 10000 जीिवत ज ों पर 1 वष से कम आयु के बच्चों की मृत्यु की संख्या।
Answer: B
Sol: सही उत्तर (B) प्रित 1000 जीिवत ज ों पर 1 वष से कम आयु के बच्चों की मृत्यु की सं ा। है
Explanation:
• िशशु मृत्यु दर (IMR) िकसी िदए गए भौगोिलक क्षेत्र म िकसी िदए गए वष के दौरान प्रित 1,000 जीिवत ज ों पर 1 वष से कम आयु के बच्चों की मृत्यु की संख्या है।
• यह आबादी के स्वास्थ्य और कल्याण का एक प्रमुख संके तक है, जो स्वास्थ्य सेवा, पोषण और स्वच्छता की गुणवत्ता को दशाता है।
• हाल के आंकड़ों के अनुसार, बेहतर टीकाकरण कवरेज और संस्थागत प्रसव के कारण भारत की IMR म लगातार िगरावट आ रही है।
Information Booster:
• नवजात मृत्यु दर: प्रित 1000 जीिवत ज ों पर जीवन के पहले 28 िदनों के भीतर होने वाली मौतों को संदिभत करता है।
• मातृ मृत्यु अनुपात (MMR): इसकी गणना प्रित 1,00,000 जीिवत ज ों पर की जाती है, न िक प्रित 1,000 पर, जो िक परीक्षाओं म भ्रम का एक सामान्य िबंदु है।
• NFHS-5: राष्टीय प रवार स्वास्थ्य सवक्षण-5 ने अिधकांश भारतीय राज्यों म िशशु स्वास्थ्य संके तकों म महत्वपूण सुधार दज िकए।
Additional Knowledge:
• िवकल्प A: जबिक कुछ आंकड़ों के िलए प्रितशत (प्रित 100) का उपयोग िकया जाता है, छोटे बदलावों को सटीक रूप से पकड़ने के िलए जनसां ख्यकी म मृत्यु दर को मानक
रूप से प्रित 1,000 मापा जाता है।
• िवकल्प C: यह पांच-वष से कम आयु मृत्यु दर (U5MR) का वणन करता है, जो एक अन्य महत्वपूण स्वास्थ्य संके तक है लेिकन IMR से अलग है।
• िवकल्प D: प्रित 10,000 गणना िशशु मृत्यु दर रपोिटग के िलए कोई मानक जनसां ख्यकीय सम्मेलन नहीं है।
Q.57  शरीर से ऑक्सीजन रिहत रक्त सबसे पहले मानव हृदय के िकस कक्ष म प्रवेश करता है?
A. बायां आिलंद
B. बायां िनलय
Copyright © 2026 Adda247
C. दायां आिलंद
D. दायां िनलय
Answer: C
Sol: सही उत्तर (C) दायां आिलंद है
व्या ा:
• मानव हृदय म चार कक्ष होते ह: दो आिलंद (ऊपरी) और दो िनलय (िनचले)।
• शरीर से ऑक्सीजन रिहत रक्त दो बड़ी िशराओं—सुपी रयर वेना के वा और इ ी रयर वेना के वा—के माध्यम से वापस आता है और दाएं आिलंद म खाली होता है।
• दाएं आिलंद से, रक्त टाइकसिपड वाल्व के माध्यम से दाएं िनलय म बहता है, जो िफर इसे फु ु सीय धमनी के माध्यम से ऑक्सीजनेशन के िलए फेफड़ों म पंप करता है।
• यह 'फु ु
सीय प रसंचरण' चक्र की शुरुआत का प्रितिनिधत्व करता है।
Information Booster:
• बायां भाग: हृदय का बायां भाग ऑक्सीजन युक्त रक्त से संबंिधत है। बायां अिलंद फु ु सीय िशराओं के माध्यम से फेफड़ों से ऑक्सीजन युक्त रक्त प्राप्त करता है।
• बाइकसिपड/माइटल वाल्व: बाएं अिलंद और बाएं िनलय के बीच स्थत होता है।
• महाधमनी: शरीर की सबसे बड़ी धमनी, जो ऑक्सीजन युक्त रक्त को बाएं िनलय से शरीर के बाकी िह ों तक ले जाती है।
Additional Knowledge:
• बायां आिलंद (िवकल्प A): फेफड़ों से ऑक्सीजन युक्त रक्त प्राप्त करता है।
• बायां िनलय (िवकल्प B): पूरे शरीर म ऑक्सीजन युक्त रक्त पंप करता है; इसकी पेशीय दीवार सबसे मोटी होती ह।
• दायां िनलय (िवकल्प D): दाएं अिलंद से रक्त प्राप्त करता है और इसे िवशेष रूप से फेफड़ों म पंप करता है।
Q.58  भारत के िकस राज्य म 'महामस्तकािभषेक उत्सव' मनाया जाता है?
A. कनाटक
B. राजस्थान
C. उत्तराखंड
D. गुजरात
Answer: A
Sol: सही उत्तर (A) कनाटक है
Explanation:
• महामस्तकािभषेक कनाटक के श्रवणबेलगोला शहर म हर 12 साल म एक बार आयोिजत होने वाला एक भव्य जैन उत्सव है।
• यह त्योहार भगवान बाहुबली (गोमतेश्वर) की 57 फु ट ऊं ची िवशाल अखंड प्रितमा को समिपत है, िजसे 981 ईस्वी म गंगा राजवंश के एक मंत्री चामुंडराय ारा बनाया गया था।
• समारोह के दौरान, प्रितमा का अिभषेक दूध, गन्ने के रस, केसर के लेप, और चंदन, ह ी और िसंदूर के पाउडर से िकया जाता है।
• िपछला समारोह 2018 म आयोिजत िकया गया था, और अगला 2030 म िनधारत है।
Information Booster:
• बाहुबली: जैन धम के अनुसार, वह ऋषभनाथ (प्रथम तीथकर) के पुत्र थे और अपने अत्यिधक ध्यान और त्याग के िलए पूजनीय ह।
• श्रवणबेलगोला: यह जैिनयों के िलए सबसे महत्वपूण तीथ स्थलों म से एक है। कहा जाता है िक चंद्रगुप्त मौय ने सल्लेखना (मृत्यु तक धािमक उपवास) का अ ास करते हुए अपने
अंितम िदन यहीं िबताए थे।
• यूने ो (UNESCO): यह प्रितमा दुिनया की सबसे बड़ी मुक्त-खड़ी ( ी-स्टिडंग) अखंड प्रितमाओं म से एक है।
Additional Knowledge:
• राजस्थान (िवकल्प B): माउंट आबू म िदलवाड़ा जैन मंिदरों के िलए प्रिसद्ध है, लेिकन महामस्तकािभषेक का स्थल नहीं है।
• उत्तराखंड (िवकल्प C): मुख्य रूप से चार धाम (बद्रीनाथ, के दारनाथ, गंगोत्री, यमुनोत्री) जैसे िहंदू तीथ स्थलों के िलए जाना जाता है।
• गुजरात (िवकल्प D): शत्रुंजय पहािड़यों पर पालीताना मंिदरों के िलए प्रिसद्ध है, जो एक प्रमुख जैन तीथ स्थल है, लेिकन श्रवणबेलगोला परंपराओं से अलग है।
Q.59  महात्मा गांधी ारा 1942 म िनम्निल खत म से कौन सा प्रमुख आंदोलन शुरू िकया गया था?
A. असहयोग आंदोलन
B. सिवनय अव ा आंदोलन

D. खलाफत आंदोलन
Answer: C
Sol: सही उत्तर (C) भारत छोड़ो आंदोलन है

• यह भारत म ि िटश शासन को त ाल समाप्त करने का आ ान था।
• इस आंदोलन के दौरान, महात्मा गांधी ने प्रिसद्ध नारा "करो या मरो" िदया था।
• यह आंदोलन िक्रप्स िमशन की िवफलता की पृष्ठभूिम म शुरू िकया गया था, िजसने ि तीय िवश्व युद्ध म ि िटश युद्ध प्रयासों के िलए भारतीय सहयोग प्राप्त करने की मांग की थी।

Q.60  2025 के नवीनतम आंकड़ों के अनुसार, भारत म पंचायती राज संस्थाओं म मिहलाओं के िलए लगभग िकतने प्रितशत सीट आरिक्षत ह?

Q.62  सकल घरेलू उत्पाद (GDP) से शुद्ध घरेलू उत्पाद (NDP) की गणना करने के िलए, क्या घटाया जाना चािहए?
A. अप्रत्यक्ष कर
B. स
डी
C. मूल्य ास
D. िवदेशों से शुद्ध कारक आय
Answer: C
Sol: सही उत्तर (C) मूल्य ास है
Explanation:
• अथशास्त्र म, 'सकल' टूट-फू ट के लेखांकन से पहले के कुल मूल्य को संदिभत करता है, जबिक 'शुद्ध' (Net) ऐसी कटौितयों के बाद के मूल्य को संदिभत करता है।
• NDP = GDP - मूल्य ास।
• मूल्य ास एक वष के दौरान उत्पादन प्रिक्रया म उपयोग की जाने वाली पूंजीगत संपित्तयों (जैसे मशीनरी, भवन और उपकरण) की टूट-फू ट के मौिद्रक मूल्य को दशाता है।
• NDP वास्तिवक आिथक िवकास का एक अिधक सटीक उपाय है क्योंिक यह पूंजीगत स्टॉक को बनाए रखने की लागत पर िवचार करता है।
Information Booster:
• कारक लागत पर GDP: इसकी गणना बाजार मूल्य पर GDP से अप्रत्यक्ष करों को घटाकर और स डी को जोड़कर की जाती है।
• NNP: शुद्ध राष्टीय उत्पाद (NNP) की गणना GNP (सकल राष्टीय उत्पाद) से मूल्य ास को घटाकर की जाती है।
• रा ीय आय: भारत म, कारक लागत पर NNP (NNPfc) को 'राष्टीय आय' माना जाता है।
Additional Knowledge:
• अप्रत्यक्ष कर और स डी (िवकल्प A और B): इ 'बाजार मूल्य' और 'कारक लागत' के बीच प रवितत करने के िलए समायोिजत िकया जाता है, लेिकन ये 'सकल' को
'शुद्ध' म प रवितत नहीं करते ह।
• िवदेशों से शुद्ध कारक आय (िवकल्प D): इसका उपयोग 'घरेलू' उत्पाद को 'राष्टीय' उत्पाद म बदलने के िलए िकया जाता है (उदा., GDP + NFIA = GNP)।

Q.64  _______ पृ ी की भू-पपटी म पाई जाने वाली सबसे प्रचुर धातु है।
A. लोहा
B. एल्युमीिनयम
C. तांबा
D. मैग्नीिशयम
Copyright © 2026 Adda247
Answer: B
Sol: सही उत्तर (B) एल्युमीिनयम है
Explanation:
• एल्युमीिनयम (Al) पृ ी की भू-पपटी म सबसे प्रचुर धातु है, जो वजन के िहसाब से लगभग 8% है।
• हालाँिक, यह अपनी उच्च प्रितिक्रयाशीलता के कारण प्रकृ ित म कभी भी अपनी मुक्त (शुद्ध) अवस्था म नहीं पाया जाता है; यह आमतौर पर बॉ ाइट जैसे अयस्कों म पाया जाता
है।
• इसे इसके कम घनत्व, उच्च शक्त (जब िमश्र धातु बनाई जाती है), और उ ृ ष्ट संक्षारण प्रितरोध के िलए महत्व िदया जाता है।
• भू-पपटी म कुल तत्वों के संदभ म, एल्युमीिनयम ऑक्सीजन (अधातु) और िसिलकॉन (उपधातु) के बाद तीसरे स्थान पर है।
Information Booster:
• शीष 3 तत्व: 1. ऑक्सीजन (~46.6%), 2. िसिलकॉन (~27.7%), 3. एल्युमीिनयम (~8.1%)।
• पृ ी का क्रोड बनाम भू-पपटी: जबिक एल्युमीिनयम भू-पपटी म सबसे प्रचुर धातु है, लोहा समग्र रूप से पृ ी म सबसे प्रचुर तत्व (और धातु) है, िजसका मुख्य कारण यह है
िक यह क्रोड (कोर) का अिधकांश भाग बनाता है।

• मै ीिशयम (िवकल्प D): यह कै ल्शयम और सोिडयम के बाद भू-पपटी म सातवां या आठवां सबसे प्रचुर तत्व है।
Q.65 1773 के रेगुलेिटंग एक्ट के अनुसार, भारत म ि िटश प्रशासन म िनम्निल खत म से कौन से प रवतन लागू िकए गए थे? I. बंगाल के गवनर को बंगाल के गवनर-जनरल के रूप म
नािमत करना। II. कलकत्ता म एक सवच्च न्यायालय की स्थापना।
A. के वल I
B. के वल II
C. I और II दोनों
D. न तो I और न ही II
Answer: C
Sol: सही उत्तर (C) I और II दोनों है
व्या ा:
• 1773 का रेगुलेिटंग एक्ट भारत म ईस्ट इंिडया कं पनी के मामलों को िनयंित्रत और िविनयिमत करने के िलए ि िटश सरकार ारा उठाया गया पहला कदम था।
• इसने बंगाल के गवनर को बंगाल का गवनर-जनरल नािमत िकया और उसकी सहायता के िलए चार सदस्यों की एक कायकारी परषद बनाई। लॉड वारेन हे ं ग्स ऐसे पहले
गवनर-जनरल थे।
• इसने 1774 म कलकत्ता म (फोट िविलयम म) एक सवच्च न्यायालय की स्थापना का भी प्रावधान िकया, िजसम एक मुख्य न्यायाधीश और तीन अन्य न्यायाधीश शािमल थे।
सर एिलजा इ े पहले मुख्य न्यायाधीश थे।
• इस अिधिनयम ने बॉ े और मद्रास प्रेसीडसी के गवनरों को भी बंगाल के गवनर-जनरल के अधीन कर िदया।

Q.89  Which of the options given below is the most accurate conversion of the sentence into Passive Voice?
The manager announces the results every Friday.
A. The results are announced every Friday by the manager.
B. The results were announced every Friday by the manager.
C. The results have been announced every Friday by the manager.
D. Every Friday the manager is announced the results.
Answer: A
Sol: The correct option is (a).
Explanation
The given sentence is in the Active Voice and follows the Present Indefinite (Simple Present) tense structure. To convert it into Passive Voice, the
object 'the results' becomes the subject.
Structure
Active Voice: Subject + Verb (s/es) + Object.
Passive Voice: Object (as subject) + is/am/are + Verb (V3) + by + Agent.
Comparison of options
Option A: Correctly uses 'are announced' (Present Indefinite Passive).
Option B: Incorrect because it uses 'were announced' (Past Tense).
Option C: Incorrect because it uses 'have been announced' (Present Perfect).
Option D: Incorrect because it fundamentally misinterprets the meaning and structure.
So the correct answer is (a)

    function parseQuestions(text) {
        const questions = [];
        // Regex: Q.संख्या  (कुछ भी) Answer: X (Sol: ... तक)
        const qRegex = /Q\.(\d+)\s+([\s\S]*?)Answer:\s*([A-Z])\s*Sol:([\s\S]*?)(?=Q\.\d+|$)/g;
        let match;
        while ((match = qRegex.exec(text)) !== null) {
            const qNum = parseInt(match[1]);
            let qText = match[2].trim();
            const answer = match[3].toLowerCase();
            let explanation = match[4].trim();

            // Options निकालें: A. ... B. ... C. ... D. ...
            const optRegex = /A\.\s*(.*?)\s*B\.\s*(.*?)\s*C\.\s*(.*?)\s*D\.\s*(.*?)(?=$|Q\.\d+|Answer:)/s;
            const optMatch = qText.match(optRegex);
            let options = [];
            let cleanQuestion = qText;
            if (optMatch) {
                options = [optMatch[1].trim(), optMatch[2].trim(), optMatch[3].trim(), optMatch[4].trim()];
                // प्रश्न टेक्स्ट से options हटाएँ
                cleanQuestion = qText.replace(optRegex, '').trim();
            } else {
                // fallback: मान लें कि options अलग से हैं
                const lines = qText.split('\n').map(l => l.trim()).filter(l => l);
                // options ढूँढें
                let optIndices = [];
                lines.forEach((line, idx) => {
                    if (/^[A-D]\./.test(line)) optIndices.push(idx);
                });
                if (optIndices.length === 4) {
                    options = optIndices.map(i => lines[i].replace(/^[A-D]\.\s*/, '').trim());
                    cleanQuestion = lines.slice(0, optIndices[0]).join(' ');
                } else {
                    // अगर न मिले तो डिफ़ॉल्ट
                    options = ['', '', '', ''];
                }
            }

            // cleanQuestion से extra whitespace हटाएँ
            cleanQuestion = cleanQuestion.replace(/\s+/g, ' ').trim();

            // उत्तर अक्षर को इंडेक्स में बदलें
            const ansIndex = ['a','b','c','d'].indexOf(answer);

            // explanation से extra newline/space हटाएँ
            explanation = explanation.replace(/\s+/g, ' ').trim();

            questions.push({
                id: qNum,
                text: cleanQuestion,
                options: options,
                answer: answer,
                explanation: explanation
            });
        }
        return questions;

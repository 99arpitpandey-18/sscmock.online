            options: ["Maintainence", "Maintenence", "Maintenance", "Maintanance"],
            answer: "c",
            explanation: `<strong>Correct Answer: (c) Maintenance</strong><br><br>
                Correct spelling is 'Maintenance'.`
        },
        {
            id: 88,
            subject: "English",
            question: `The highlighted part of the following sentence may need improvement. Select the best alternative.<br>
            <span class="highlight">Neither of the two candidates were considered suitable for the senior position by the interview panel.</span>`,
            options: [
                "Neither of the two candidates was",
                "Neither of the two candidates are",
                "Neither of two candidates were",
                "No improvement required"
            ],
            answer: "a",
            explanation: `<strong>Correct Answer: (a) Neither of the two candidates was</strong><br><br>
                'Neither' takes singular verb.`
        },
        {
            id: 89,
            subject: "English",
            question: `The sentence below is divided into four parts. One part contains a grammatical error. Identify the part.<br>
            <span class="highlight">She has been working tirelessly to improve the standard of the education in rural areas.</span><br>
            A. She has been working tirelessly<br>
            B. to improve the standard<br>
            C. of the education<br>
            D. in rural areas.`,
            options: ["A", "B", "C", "D"],
            answer: "c",

                'the' before 'education' is unnecessary (abstract noun general sense).`

        {
            id: 90,
            subject: "English",
            question: `The highlighted part of the following sentence may need improvement. Select the best alternative.<br>
            <span class="highlight">As the competition grew more intense, the team played more better under pressure.</span>`,
            options: ["better", "much more better", "best", "No improvement required"],
            answer: "a",
            explanation: `<strong>Correct Answer: (a) better</strong><br><br>
                'more better' is double comparative; use 'better'.`
        }
    ];

    // ============================================================
    //   RENDER
    // ============================================================
    const container = document.getElementById('questionsContainer');

    function renderQuestions() {
        let html = '';
        let currentSubject = '';

        questionsData.forEach((q, idx) => {
            const qNum = idx + 1;

            if (q.subject !== currentSubject) {
                currentSubject = q.subject;
                html += `<div class="subject-divider">📌 ${currentSubject} <small>· Questions</small></div>`;
            }

            const optLetters = ['a', 'b', 'c', 'd'];
            let optionsHtml = '';
            q.options.forEach((opt, i) => {
                optionsHtml += `
                    <div class="option">
                        <span class="letter">${optLetters[i]}.</span>
                        <span>${opt}</span>
                    </div>
                `;
            });

            html += `
                <div class="question-card" id="q-${qNum}">
                    <div class="q-head">
                        <span class="q-number">Q.${qNum}</span>
                        <span class="q-tag">${q.subject}</span>
                    </div>
                    <div class="q-text">${q.question}</div>
                    <div class="options">${optionsHtml}</div>
                    <div class="btn-row">
                        <button class="btn-toggle" data-target="ans-${qNum}">
                            <span class="icon">👁️</span> Show Answer
                        </button>
                    </div>
                    <div class="answer-box" id="ans-${qNum}">
                        <div class="ans-label">✅ Correct Answer: <span>${q.answer}</span></div>
                        <div class="explanation">${q.explanation}</div>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    renderQuestions();

    // ============================================================
    //   TOGGLE ANSWERS
    // ============================================================
    document.addEventListener('click', function(e) {
        const btn = e.target.closest('.btn-toggle');
        if (!btn) return;

        const targetId = btn.dataset.target;
        const answerBox = document.getElementById(targetId);
        if (!answerBox) return;

        const isHidden = !answerBox.classList.contains('show');

        if (isHidden) {
            answerBox.classList.add('show');
            btn.innerHTML = `<span class="icon">🙈</span> Hide Answer`;
            btn.classList.add('hide-btn');
            setTimeout(() => {
                answerBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        } else {
            answerBox.classList.remove('show');
            btn.innerHTML = `<span class="icon">👁️</span> Show Answer`;
            btn.classList.remove('hide-btn');
        }
    });

    // ============================================================
    //   SCROLL TO TOP
    // ============================================================
    const scrollBtn = document.getElementById('scrollTopBtn');
    window.addEventListener('scroll', function() {
        if (window.scrollY > 500) {
            scrollBtn.classList.add('visible');
        } else {
            scrollBtn.classList.remove('visible');
        }
    });
    scrollBtn.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    console.log('✅ 90 Questions loaded. Click "Show Answer" to reveal answers.');
</script>
</body>
</html>

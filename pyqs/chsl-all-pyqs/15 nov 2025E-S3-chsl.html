      <strong>Additional Knowledge:</strong> Pancreas (Option A) secretes insulin and glucagon (hormones) as well as digestive enzymes.<br><br>
      <strong>So the correct answer is (c)</strong>`
    },
    {
      id: 100,
      subject: "General Knowledge",
      question: `Which crop was widely cultivated by the Harappans besides wheat and barley?`,
      options: ["Rice", "Cotton", "Sugarcane", "Maize"],
      answer: "B",
      explanation: `<strong>The correct answer is (B) Cotton</strong><br><br>
      <strong>Explanation:</strong> The Harappans (Indus Valley Civilization) are believed to be the first people to cultivate Cotton. Pieces of woven cotton cloth were discovered at Mohenjodaro.<br><br>
      <strong>Information Booster:</strong> The Greeks referred to cotton as 'Sindon', derived from the word 'Sindh', indicating its origin. Wheat and Barley were the main food crops, but cotton was a vital commercial crop.<br><br>
      <strong>Additional Knowledge:</strong> Rice (Option A) – evidence of rice cultivation (like rice husks) is found in Lothal and Rangpur but was less common than wheat/barley. Sugarcane (Option C) – was not known to the Harappans.<br><br>
      <strong>So the correct answer is (b)</strong>`
    }
  ];

  // ============================================================
  //   RENDER
  // ============================================================
  const container = document.getElementById('questionsContainer');

  function renderQuestions() {
    let html = '';
    let currentSubject = '';

    questionsData.forEach((q, idx) => {
      const qNum = idx + 1;

      if (q.subject !== currentSubject) {
        currentSubject = q.subject;
        html += `<div class="subject-divider">📌 ${currentSubject} <small>· Questions</small></div>`;
      }

      const optLetters = ['A', 'B', 'C', 'D'];
      let optionsHtml = '';
      q.options.forEach((opt, i) => {
        optionsHtml += `
          <div class="option">
            <span class="letter">${optLetters[i]}.</span>
            <span>${opt}</span>
          </div>
        `;
      });

      html += `
        <div class="question-card" id="q-${qNum}">
          <div class="q-head">
            <span class="q-number">Q.${qNum}</span>
            <span class="q-tag">${q.subject}</span>
          </div>
          <div class="q-text">${q.question}</div>
          <div class="options">${optionsHtml}</div>
          <div class="btn-row">
            <button class="btn-toggle" data-target="ans-${qNum}">
              <span class="icon">👁️</span> उत्तर दिखाई
            </button>
          </div>
          <div class="answer-box" id="ans-${qNum}">
            <div class="ans-label">✅ सही उत्तर: <span>${q.answer}</span></div>
            <div class="explanation">${q.explanation}</div>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  renderQuestions();

  // ============================================================
  //   TOGGLE ANSWERS
  // ============================================================
  document.addEventListener('click', function(e) {
    const btn = e.target.closest('.btn-toggle');
    if (!btn) return;

    const targetId = btn.dataset.target;
    const answerBox = document.getElementById(targetId);
    if (!answerBox) return;

    const isHidden = !answerBox.classList.contains('show');

    if (isHidden) {
      answerBox.classList.add('show');
      btn.innerHTML = `<span class="icon">🙈</span> उत्तर छिपाएँ`;
      btn.classList.add('hide-btn');
      setTimeout(() => {
        answerBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);
    } else {
      answerBox.classList.remove('show');
      btn.innerHTML = `<span class="icon">👁️</span> उत्तर दिखाई`;
      btn.classList.remove('hide-btn');
    }
  });

  // ============================================================
  //   SCROLL TO TOP
  // ============================================================
  const scrollBtn = document.getElementById('scrollTopBtn');
  window.addEventListener('scroll', function() {
    if (window.scrollY > 500) {
      scrollBtn.classList.add('visible');
    } else {
      scrollBtn.classList.remove('visible');
    }
  });
  scrollBtn.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  console.log('✅ 100 Questions loaded (Mapping 878941). Click "उत्तर दिखाई" to reveal answers.');
</script>
</body>
</html>

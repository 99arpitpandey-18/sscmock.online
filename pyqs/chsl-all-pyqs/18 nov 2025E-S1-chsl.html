/* =========================================================
   RENDER
========================================================= */

const container = document.getElementById("questionsContainer");

function renderQuestion(q){

    const letters = ["A","B","C","D"];

    let optionsHTML = "";

    q.options.forEach((option,index)=>{

        optionsHTML += `
            <div class="option">
                <span class="option-letter">${letters[index]}.</span>
                <span>${escapeHTML(option)}</span>
            </div>
        `;

    });

    const correctIndex = ["a","b","c","d"].indexOf(q.answer);

    const correctText =
        letters[correctIndex] + ". " + q.options[correctIndex];

    return `
        <article class="question-card">

            <div class="question">

                <span class="qno">Q${q.q}.</span>

                ${formatText(q.question)}

            </div>

            <div class="options">

                ${optionsHTML}

            </div>

            <div class="answer-area">

                <button
                    class="answer-btn"
                    onclick="showAnswer(this)"
                >
                    उत्तर दिखाएँ
                </button>

                <div class="answer-box">

                    <div class="correct-answer">
                        ✓ सही उत्तर:
                        <strong>${escapeHTML(correctText)}</strong>
                    </div>

                    <div class="explanation">
                        <strong>व्याख्या:</strong>
                        ${escapeHTML(q.explanation)}
                    </div>

                </div>

            </div>

        </article>
    `;
}


function render(){

    let html = "";

    sections.forEach(section=>{

        html += `
            <section class="section">

                <div class="section-title">

                    <span class="section-number">
                        ${section.range}
                    </span>

                    <strong>
                        ${section.title}
                    </strong>

                </div>
        `;


        /* Passage only once before Q6 */

        if(section.type === "english"){

            html += `
                <div class="passage">

                    <div class="passage-heading">
                        📖 Passage for Q6 – Q10
                    </div>

                    ${formatText(chessPassage)}

                </div>
            `;
        }


        const sectionQuestions =
            questions.filter(q=>q.section === section.type);


        sectionQuestions.forEach(q=>{

            html += renderQuestion(q);

        });


        html += `</section>`;

    });


    container.innerHTML = html;

}


/* =========================================================
   ANSWER BUTTON
========================================================= */

function showAnswer(button){

    const answerBox =
        button.nextElementSibling;

    if(answerBox.classList.contains("show")){

        answerBox.classList.remove("show");

        button.textContent =
            "उत्तर दिखाएँ";

    }else{

        answerBox.classList.add("show");

        button.textContent =
            "उत्तर छिपाएँ";

    }

}


/* =========================================================
   SECURITY / TEXT FORMAT
========================================================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function formatText(text){

    return escapeHTML(text)
        .replace(/\n/g,"<br>");
}


/* START */

render();

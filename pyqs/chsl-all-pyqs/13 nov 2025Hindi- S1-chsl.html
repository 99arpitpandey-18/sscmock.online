<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSC CHSL Tier-I 2025 (समान पेपर) – हिंदी</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f2f6fc;
            padding: 24px 16px;
            color: #1e293b;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 48px rgba(0, 20, 50, 0.10);
            overflow: hidden;
            padding: 28px 30px 40px;
        }

        .paper-header {
            border-bottom: 2px solid #e8edf5;
            padding-bottom: 18px;
            margin-bottom: 22px;
        }

        .paper-header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #0b2b4a;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .paper-header h1 small {
            font-size: 15px;
            font-weight: 500;
            color: #3b5e7e;
            background: #eef4fa;
            padding: 2px 14px;
            border-radius: 40px;
            letter-spacing: 0.2px;
        }

        .meta-line {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 20px;
            margin-top: 8px;
            font-size: 15px;
            color: #2c4a6a;
        }

        .meta-line .badge {
            background: #dce6f2;
            padding: 2px 16px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 13px;
            color: #1a3b5a;
        }

        .meta-line .highlight {
            font-weight: 600;
            color: #0b2b4a;
        }

        .section-head {
            background: #eef4fa;
            padding: 12px 20px;
            border-radius: 14px;
            margin: 28px 0 18px;
            font-weight: 600;
            font-size: 18px;
            color: #0b2b4a;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .section-head span {
            background: #1a4b7a;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            padding: 0 14px;
            border-radius: 40px;
            line-height: 26px;
        }

        .q-card {
            background: #ffffff;
            border: 1px solid #e2eaf3;
            border-radius: 18px;
            padding: 20px 22px 18px;
            margin-bottom: 16px;
            transition: box-shadow 0.15s;
        }

        .q-card:hover {
            box-shadow: 0 4px 14px rgba(0, 20, 40, 0.04);
        }

        .q-number {
            font-weight: 700;
            font-size: 16px;
            color: #0b2b4a;
            display: inline-block;
            margin-right: 6px;
        }

        .q-text {
            font-size: 16px;
            line-height: 1.6;
            font-weight: 500;
            color: #0f2a44;
            margin-bottom: 10px;
        }

        .q-text .q-label {
            font-weight: 700;
            color: #0b2b4a;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 24px;
            margin: 10px 0 14px;
            padding-left: 4px;
        }

        @media (max-width: 600px) {
            .options {
                grid-template-columns: 1fr;
                gap: 4px;
            }
        }

        .opt {
            font-size: 15px;
            padding: 5px 0;
            color: #1e3a5f;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .opt .letter {
            font-weight: 700;
            color: #0b2b4a;
            min-width: 20px;
        }

        .answer-area {
            margin-top: 12px;
            border-top: 1px dashed #d6e2f0;
            padding-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .btn-answer {
            background: transparent;
            border: 1.5px solid #1a4b7a;
            color: #1a4b7a;
            font-weight: 600;
            font-size: 14px;
            padding: 6px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
            align-self: flex-start;
            font-family: inherit;
            background: #f8faff;
            letter-spacing: 0.2px;
        }

        .btn-answer:hover {
            background: #1a4b7a;
            color: #fff;
            box-shadow: 0 4px 12px rgba(26, 75, 122, 0.20);
        }

        .btn-answer.active {
            background: #1a4b7a;
            color: #fff;
        }

        .answer-box {
            display: none;
            background: #f5f9ff;
            border-radius: 14px;
            padding: 14px 18px;
            margin-top: 6px;
            border-left: 4px solid #1a4b7a;
        }

        .answer-box.open {
            display: block;
        }

        .answer-box .correct {
            font-weight: 700;
            color: #0f6b3a;
            font-size: 15px;
        }

        .answer-box .correct .opt-label {
            background: #0f6b3a;
            color: #fff;
            padding: 0 10px;
            border-radius: 30px;
            font-size: 13px;
            line-height: 24px;
            display: inline-block;
            margin-right: 6px;
        }

        .answer-box .explanation {
            font-size: 15px;
            line-height: 1.7;
            color: #1e3a5f;
            margin-top: 6px;
        }

        .answer-box .explanation strong {
            color: #0b2b4a;
        }

        .answer-box .hint {
            font-size: 14px;
            color: #4b6a8a;
            margin-top: 4px;
            font-style: italic;
        }

        .footer-note {
            text-align: center;
            font-size: 13px;
            color: #6b89a8;
            margin-top: 30px;
            padding-top: 16px;
            border-top: 1px solid #e2eaf3;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #eef4fa;
        }
        ::-webkit-scrollbar-thumb {
            background: #b6cde0;
            border-radius: 10px;
        }

        @media print {
            .btn-answer {
                display: none;
            }
            .answer-box {
                display: block !important;
                border: 1px solid #ccc;
                background: #f9f9f9;
            }
            .q-card {
                break-inside: avoid;
                border: 1px solid #ccc;
            }
            body {
                background: #fff;
                padding: 10px;
            }
            .container {
                box-shadow: none;
                padding: 10px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 16px 14px;
            }
            .paper-header h1 {
                font-size: 20px;
            }
            .q-card {
                padding: 16px 14px;
            }
            .q-text {
                font-size: 15px;
            }
            .opt {
                font-size: 14px;
            }
            .answer-box {
                padding: 12px 14px;
            }
        }
    </style>
</head>

        // ================================================================
        // RENDER
        // ================================================================

        const container = document.getElementById('questions-container');
        let currentSection = '';
        let html = '';

        questionsData.forEach((q, index) => {
            if (q.section !== currentSection) {
                currentSection = q.section;
                const firstId = q.id;
                const lastId = Math.min(q.id + 24, questionsData.length);
                html += `<div class="section-head"><span>${firstId}–${lastId}</span> ${q.section}</div>`;
            }

            const optLetters = ['A', 'B', 'C', 'D'];
            let optionsHtml = '';
            optLetters.forEach(letter => {
                const val = q.options[letter];
                if (val) {
                    optionsHtml += `<div class="opt"><span class="letter">${letter}.</span> ${val}</div>`;
                }
            });

            html += `
                <div class="q-card" data-qid="${q.id}">
                    <div class="q-text"><span class="q-label">Q${q.id}.</span> ${q.text}</div>
                    <div class="options">${optionsHtml}</div>
                    <div class="answer-area">
                        <button class="btn-answer" data-target="ans-${q.id}">उत्तर दिखाएँ</button>
                        <div class="answer-box" id="ans-${q.id}">
                            <div class="correct">
                                <span class="opt-label">विकल्प ${q.answer}</span>
                                ${q.options[q.answer] || ''}
                            </div>
                            <div class="explanation">${q.explanation}</div>
                        </div>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;

        // ================================================================
        // INTERACTION – toggle answer with single-open behaviour
        // ================================================================

        document.querySelectorAll('.btn-answer').forEach(btn => {
            btn.addEventListener('click', function() {
                const targetId = this.dataset.target;
                const box = document.getElementById(targetId);
                if (!box) return;

                const isOpen = box.classList.contains('open');

                // Close all other open answers
                document.querySelectorAll('.answer-box.open').forEach(b => {
                    if (b.id !== targetId) {
                        b.classList.remove('open');
                        const otherBtn = document.querySelector(`.btn-answer[data-target="${b.id}"]`);
                        if (otherBtn) {
                            otherBtn.classList.remove('active');
                            otherBtn.textContent = 'उत्तर दिखाएँ';
                        }
                    }
                });

                if (isOpen) {
                    box.classList.remove('open');
                    this.classList.remove('active');
                    this.textContent = 'उत्तर दिखाएँ';
                } else {
                    box.classList.add('open');
                    this.classList.add('active');
                    this.textContent = 'उत्तर छुपाएँ';
                }
            });
        });
    </script>

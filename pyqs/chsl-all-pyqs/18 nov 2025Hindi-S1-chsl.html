<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSC CHSL T-I Similar Paper | 18 Nov Shift 1</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, "Noto Sans Devanagari", sans-serif;
    background:#f3f6fb;
    color:#1f2937;
    line-height:1.65;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#172554,#1d4ed8,#2563eb);
    color:white;
    padding:28px 15px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.18);
}

.header h1{
    font-size:28px;
    margin-bottom:5px;
}

.header p{
    font-size:15px;
    opacity:.9;
}

/* TOP BAR */
.topbar{
    position:sticky;
    top:0;
    z-index:100;
    background:white;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
    padding:10px 15px;
}

.top-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.progress-box{
    flex:1;
}

.progress-text{
    font-size:13px;
    font-weight:bold;
    margin-bottom:4px;
}

.progress{
    height:8px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    width:0%;
    height:100%;
    background:#2563eb;
    transition:.4s;
}

.score{
    background:#eff6ff;
    color:#1d4ed8;
    padding:7px 13px;
    border-radius:20px;
    font-weight:bold;
}

/* MAIN */
.container{
    width:min(1100px,94%);
    margin:25px auto 60px;
}

/* SECTION */
.section-title{
    background:linear-gradient(135deg,#1e3a8a,#2563eb);
    color:white;
    padding:15px 20px;
    border-radius:12px;
    margin:25px 0 15px;
    box-shadow:0 5px 15px rgba(37,99,235,.2);
}

.section-title h2{
    font-size:20px;
}

/* QUESTION */
.question-card{
    background:white;
    border-radius:14px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 3px 14px rgba(0,0,0,.08);
    border-left:5px solid #2563eb;
    transition:.25s;
}

.question-card:hover{
    transform:translateY(-2px);
    box-shadow:0 7px 20px rgba(0,0,0,.11);
}

.q-number{
    color:#1d4ed8;
    font-size:17px;
    font-weight:bold;
    margin-bottom:8px;
}

.question{
    font-size:16px;
    font-weight:600;
    margin-bottom:12px;
}

.passage{
    background:#f8fafc;
    border:1px solid #dbeafe;
    padding:15px;
    border-radius:10px;
    margin:12px 0;
    font-size:14px;
    white-space:pre-line;
}

/* OPTIONS */
.options{
    display:grid;
    gap:9px;
}

.option{
    padding:11px 13px;
    border:1px solid #dbe2ea;
    border-radius:9px;
    background:#fafafa;
    cursor:pointer;
    transition:.2s;
}

.option:hover{
    background:#eff6ff;
    border-color:#60a5fa;
}

.option.selected{
    background:#dbeafe;
    border-color:#2563eb;
}

.option.correct{
    background:#dcfce7;
    border-color:#16a34a;
    color:#166534;
    font-weight:bold;
}

.option.wrong{
    background:#fee2e2;
    border-color:#dc2626;
    color:#991b1b;
}

/* BUTTON */
.answer-btn{
    margin-top:14px;
    background:#2563eb;
    color:white;
    border:0;
    border-radius:8px;
    padding:9px 16px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
    transition:.2s;
}

.answer-btn:hover{
    background:#1d4ed8;
    transform:scale(1.02);
}

/* ANSWER */
.answer-box{
    display:none;
    margin-top:14px;
    padding:14px;
    background:#f0fdf4;
    border:1px solid #86efac;
    border-radius:10px;
    animation:fadeIn .3s ease;
}

.answer-box.show{
    display:block;
}

.answer{
    color:#15803d;
    font-weight:bold;
    margin-bottom:5px;
}

.explanation{
    color:#374151;
    font-size:14px;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(-5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* NAVIGATION */
.nav-panel{
    background:white;
    border-radius:14px;
    padding:15px;
    margin-bottom:20px;
    box-shadow:0 3px 14px rgba(0,0,0,.08);
}

.nav-title{
    font-weight:bold;
    margin-bottom:10px;
}

.question-nav{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.q-nav{
    width:38px;
    height:34px;
    border:1px solid #d1d5db;
    background:#fff;
    border-radius:6px;
    cursor:pointer;
}

.q-nav:hover{
    background:#dbeafe;
}

.q-nav.attempted{
    background:#dcfce7;
    border-color:#22c55e;
}

/* RESULT */
.result{
    display:none;
    background:white;
    text-align:center;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
    margin-top:25px;
}

.result h2{
    color:#1d4ed8;
}

.final-score{
    font-size:35px;
    font-weight:bold;
    margin:10px;
    color:#16a34a;
}

.restart{
    border:0;
    padding:11px 20px;
    background:#2563eb;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

/* MOBILE */
@media(max-width:700px){
    .header h1{
        font-size:21px;
    }

    .question-card{
        padding:15px;
    }

    .question{
        font-size:15px;
    }

    .top-inner{
        flex-direction:column;
        align-items:stretch;
    }

    .score{
        text-align:center;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>SSC CHSL T-I Similar Paper</h1>
    <p>Held on 18 Nov Shift 1 | English + Reasoning + Quantitative Aptitude + General Awareness</p>
</header>

<div class="topbar">
    <div class="top-inner">
        <div class="progress-box">
            <div class="progress-text">
                Attempted: <span id="attempted">0</span> / 100
            </div>
            <div class="progress">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="score">
            Score: <span id="score">0</span>
        </div>
    </div>
</div>

<main class="container">

<div class="nav-panel">
    <div class="nav-title">Question Navigation</div>
    <div class="question-nav" id="questionNav"></div>
</div>

<div id="questions"></div>

<div class="result" id="result">
    <h2>Test Completed 🎉</h2>
    <div class="final-score" id="finalScore">0 / 100</div>
    <p>आपने अपना टेस्ट पूरा कर लिया है।</p>

    <button class="restart" onclick="location.reload()">Restart Test</button>
</div>

</main>

<script>

const questions = [

/* ================= ENGLISH ================= */

{
q:`Identify the part of the sentence that contains a grammatical error.<br>
A. The group of students,<br>
B. along with the principal<br>
C. were discussing the presentation<br>
D. for the annual function.`,
o:[
`The group of students`,
`along with the principal`,
`were discussing the presentation`,
`for the annual function.`
],
a:2,
e:`The subject "The group" is singular, so the correct verb is "was discussing", not "were discussing".`
},

{
q:`Choose the correct meaning of the idiom: <b>Up and about</b>`,
o:[
`At home resting`,
`Doing errands`,
`Able to move around after illness`,
`Traveling to distant places`
],
a:2,
e:`"Up and about" means being able to get up and move around, especially after an illness.`
},

{
q:`Choose the correct one-word substitute for:<br>
A style of writing that is overly complex, with long sentences and many difficult words.`,
o:[
`Sentimentalism`,
`Romanticism`,
`Sesquipedalian`,
`Expressionism`
],
a:2,
e:`Sesquipedalian refers to the use of very long or complicated words, especially in writing or speech.`
},

{
q:`Select the option that expresses the given sentence in indirect voice.<br>
The doctor said, “If you follow a balanced diet, you will feel better.”`,
o:[
`The doctor said that if you follow a balanced diet, you would feel better.`,
`The doctor said that if he/she followed a balanced diet, he/she would feel better.`,
`The doctor said that if one follows a balanced diet, you will feel better.`,
`The doctor said that if one followed a balanced diet, one would feel better.`
],
a:3,
e:`In indirect speech, the pronoun and tense are changed appropriately. "You" becomes "one" and "will" changes to "would".`
},

{
q:`Select the option that expresses the given sentence in indirect voice.<br>
The student said, “I have been studying this topic for weeks, but I still do not understand the final concept, which is the most important one.”`,
o:[
`The student said that he had been studying that topic for weeks, but he still did not understand the final concept, which was the most important one.`,
`The student said that he has been studying this topic for weeks, but he still does not understand the final concept, which is the most important one.`,
`The student said that he had been studying this topic for weeks, but he still did not understand the final concept, which was the most important one.`,
`The student said that he had been studying that topic for weeks, but he still does not understand the final concept, which is the most important one.`
],
a:0,
e:`"I" changes to "he", "this" changes to "that", and the present perfect continuous changes to past perfect continuous in reported speech.`
},

{
q:`The phrase “sharpening their strategic acumen from an early age” functions as:`,
p:`India’s relationship with chess is tightly bound to its cultural legacy, as the game—first known as “chaturanga”—originated on the subcontinent more than a thousand years ago. What began as a strategic model of warfare gradually transformed into shatranj under Persian influence and then travelled west, eventually taking the form of modern chess.

In contemporary times, India’s rise on the world chess stage was propelled by the meteoric emergence of Viswanathan Anand in the late 20th century. His smooth, dynamic approach—blending tactical sharpness with positional understanding—brought him the World Chess Championship on multiple occasions and motivated an entire generation of players.

Anand’s achievements also encouraged stronger institutional support, resulting in a surge of tournaments, academies, and grassroots programmes across the country.

The 21st century has seen prodigies like Rameshbabu Praggnanandhaa, D. Gukesh, and Nihal Sarin excel internationally, strengthening India’s reputation as a major contender in team events such as the Chess Olympiad. At the same time, digital platforms have accelerated player development by allowing young talents to train and compete with grandmasters worldwide, sharpening their strategic acumen from an early age.

Today, India is not only recognised as the birthplace of chess but also as a key force influencing its global future.`,
o:[
`Noun clause`,
`Adverbial phrase`,
`Participle phrase`,
`Absolute phrase`
],
a:2,
e:`"Sharpening their strategic acumen..." begins with the present participle "sharpening" and functions as a participial phrase.`
},

{
q:`Identify the voice in “What began as a strategic model of warfare”.`,
o:[
`Active voice`,
`Passive voice`,
`Middle voice`,
`Causative voice`
],
a:0,
e:`The subject "What" performs the action of beginning, so the construction is active voice.`
},

{
q:`The word “meteoric” most nearly means:`,
o:[
`Rapid and spectacular`,
`Slow and steady`,
`Weak and unsuccessful`,
`Ordinary and predictable`
],
a:0,
e:`Meteoric describes something that develops or rises very rapidly and spectacularly.`
},

{
q:`The word “acumen” means:`,
o:[
`Sharpness in understanding`,
`Physical strength and stamina`,
`Loud and aggressive behaviour`,
`Carelessness; lack of attention`
],
a:0,
e:`Acumen means the ability to make good judgments and understand situations quickly and accurately.`
},

{
q:`As per the passage, which recent development has most boosted the growth of chess talent in India?`,
o:[
`Expansion of board game stores`,
`Digital platforms that enable practice with players worldwide`,
`Compulsory chess classes in schools`,
`Less focus on international competitions`
],
a:1,
e:`The passage directly states that digital platforms allow young talents to train and compete with grandmasters worldwide.`
},

{
q:`Which of the following pairs of homonyms can be used to fill in the blanks most suitably?<br>
After the banquet, the host gave a ____ to the chef for dishes that beautifully ____ the evening’s theme.`,
o:[
`counsel, council`,
`complement, compliment`,
`compliment, complement`,
`council, counsel`
],
a:2,
e:`A compliment is praise, while complement means something that completes or suits something else.`
},

{
q:`Select the most appropriate synonym of the word: <b>Obdurate</b>`,
o:[
`Vague`,
`Stubborn`,
`Obscure`,
`Ambiguous`
],
a:1,
e:`Obdurate means stubbornly refusing to change one's opinion or course of action.`
},

{
q:`Which sentence contains a correctly spelt word?`,
o:[
`Many expected the new millenium to transform society, but some felt embarrassed when their hopes collapsed.`,
`He didn’t want to embarrass himself during the opening of the new millennium celebrations.`,
`The grand milleniumm ceremony was unforgettable, though it did embarrass a few officials.`,
`She didn’t expect the milennium gala to embarrass her in front of the guests.`
],
a:1,
e:`The correct spelling is "millennium". Option (b) uses the correct spelling.`
},

{
q:`Fill in the blank with the most appropriate verb:<br>
She ____ her position on the issue only after persistent inquiries from the media.`,
o:[
`reiterates`,
`clarified`,
`deflects`,
`assumes`
],
a:1,
e:`"Clarified" correctly fits the past context and means made her position clear.`
},

{
q:`Choose the correct passive voice transformation of the sentence:<br>
The new intern had forgotten to switch off the office lights before leaving.`,
o:[
`The office lights were forgotten to be switched off by the new intern before leaving.`,
`The office lights had been forgotten to be switched off by the new intern before leaving.`,
`The office lights has been forgotten to be switched off by the new intern before leaving.`,
`The office lights had forgotten to switch off by the new intern before leaving.`
],
a:1,
e:`The past perfect "had forgotten" becomes "had been forgotten" in the passive construction.`
},

{
q:`Select the most appropriate antonym of the word: <b>Scarcity</b>`,
o:[
`Shortage`,
`Abundance`,
`Lack`,
`Deficiency`
],
a:1,
e:`Scarcity means shortage; its antonym is abundance.`
},

{
q:`Select the most appropriate antonym of the word: <b>Ubiquitous</b>`,
o:[
`Rare`,
`Truth`,
`Accuracy`,
`Authenticity`
],
a:0,
e:`Ubiquitous means present everywhere. Its opposite is rare.`
},

{
q:`Select the option that expresses the given sentence in direct voice.<br>
The boy told his teacher that he could not attend school that day because he had been feeling unwell since the previous evening, and his mother was waiting for him.`,
o:[
`“I cannot attend school today because I have been feeling unwell since yesterday evening, and my mother is waiting for me,” the boy said to his teacher.`,
`“I could not attend school that day because I had been feeling unwell since the previous evening, and my mother was waiting for me,” the boy said to his teacher.`,
`“I must not attend school today because I was feeling unwell since yesterday evening, and my mother was waiting for me,” the boy said to his teacher.`,
`“I cannot attend school today because I had been feeling unwell since yesterday evening, and my mother was waiting for me,” the boy said to his teacher.`
],
a:0,
e:`The direct form restores the original speaker's perspective: "I", "today", "yesterday evening" and present forms.`
},

{
q:`Choose the most suitable option to replace the highlighted part of the sentence:<br>
All the committee members was divided over the final decision.`,
o:[
`All the committee member were divided`,
`All the committee members were divided`,
`All committee have divided between their opinions`,
`All committees have divided in their opinions`
],
a:1,
e:`"Members" is plural, so the correct verb is "were".`
},

{
q:`Select the most appropriate synonym of the word: <b>Recondite</b>`,
o:[
`Contented`,
`Abstruse`,
`Cheerful`,
`Pleasant`
],
a:1,
e:`Recondite means difficult to understand or obscure; "abstruse" is its synonym.`
},

{
q:`Choose the correct passive voice transformation of the sentence:<br>
You must complete the assignment today.`,
o:[
`The assignment must be completed today by you.`,
`The assignment must being completed today by you.`,
`The assignment must have been completed today by you.`,
`The assignment is must be completed today by you.`
],
a:0,
e:`With the modal "must", passive voice is formed as "must be + past participle".`
},

{
q:`Identify the part of the sentence that contains a grammatical error.<br>
A. She spoke<br>
B. so fastly that<br>
C. the audience struggled to follow<br>
D. her explanation.`,
o:[
`She spoke`,
`so fastly that`,
`the audience struggled to follow`,
`her explanation.`
],
a:1,
e:`The correct adverb is "fast", not "fastly".`
},

{
q:`Fill in the blank with the most appropriate preposition:<br>
The researchers accounted ____ every possible risk before publishing the final report.`,
o:[
`for`,
`to`,
`with`,
`on`
],
a:0,
e:`The correct expression is "accounted for", meaning considered or explained.`
},

{
q:`Choose the most suitable option to replace the highlighted part of the sentence:<br>
One should do ones’ duty even when no one is watching.`,
o:[
`One should do one’s duty`,
`One should do ones duties`,
`One should do once duties`,
`One should do their duty`
],
a:0,
e:`The possessive form corresponding to "one" is "one's".`
},

{
q:`Which sentence contains a correctly spelt word?`,
o:[
`We decided to try a famous restaurant near the railway station.`,
`That restuarant is known for its quick service and tasty snacks.`,
`The restaurent on the corner offers a wide variety of dishes.`,
`They booked a table at the oldest resturant in the city.`
],
a:0,
e:`The correct spelling is "restaurant", which appears in option (a).`
},

/* ================= REASONING + MATH ================= */

{
q:`एक ट्रेन 4 घंटे में 240 ककमी की दूरी तय करती है। इसकी औसत गतत क्या है?`,
o:[`70ककमी/घंटा`,`55 ककमी/घंटा`,`60ककमी/घंटा`,`45ककमी/घंटा`],
a:2,
e:`औसत गति = दूरी ÷ समय = 240 ÷ 4 = 60 किमी/घंटा।`
},

{
q:`श्रंखला को पूरा करें: Z, W, T, Q, ?`,
o:[`M`,`N`,`O`,`P`],
a:1,
e:`हर बार अक्षर 3 स्थान पीछे जा रहा है: Z, W, T, Q, N।`
},

{
q:`कौन सा युग्म 11 और 19 दोनों से तिभाज्य नहीं है?`,
o:[`(209, 418)`,`(418, 627)`,`(627, 836)`,`(319, 528)`],
a:3,
e:`दिए गए युग्मों में विकल्प (d) दोनों संख्याओं के 11 और 19 दोनों से विभाज्य होने की शर्त को पूरा नहीं करता।`
},

{
q:`लुप्त संख्या की पहचान करें: 12, 6, 18, 9, 27, ?, 81`,
o:[`12`,`13`,`18`,`27`],
a:0,
e:`क्रम में ×1/2 और ×3 का क्रम दोहराया गया है: 12 → 6 → 18 → 9 → 27 → 13.5 → 40.5; दिए गए उत्तर के अनुसार 12 चुना गया है।`
},

{
q:`यकद ‘APPLE’ को ‘ZKKOV’ के रूप में कोतित ककया जाता है, तो ‘ORANGE’ के तलए कोि क्या है?`,
o:[`LIZMTU`,`LIZMTV`,`LIZNTV`,`LIYMUV`],
a:1,
e:`दिए गए coding pattern के अनुसार अक्षरों को उल्टे alphabet mapping से code किया जाता है।`
},

{
q:`यकद ककसी संख्या में 20% की िरति की जाती है और किर 20% की कमी की जाती है, तो कुल पररिततन क्या है?`,
o:[`4% िरति`,`4% कमी`,`कोई पररिततन नहीं`,`2% कमी`],
a:1,
e:`100 → 120 → 96. इसलिए कुल 4% की कमी होती है।`
},

{
q:`एक व्यति 8 km पूित की ओर चलता है, किर 15 km दतिण की ओर और अंत में 8 km पतिम की ओर चलता है। िह शुरुआती ब ंदु से ककस कदशा में है?`,
o:[`पूित`,`दतिण`,`पतिम`,`उत्तर`],
a:1,
e:`8 km पूर्व और 8 km पश्चिम एक-दूसरे को cancel करते हैं। व्यक्ति 15 km दक्षिण में रहता है।`
},

{
q:`संदभत: कदल्ली (DEL), 15/08/1947, 12:00 AM.`,
o:[`कदल्ली (DEL), 15/08/1947, 12:00 AM.`,`कदल्ली (DEL), 15-08-1947, 12:00 AM.`,`कदल्ली (Del), 15/08/1947, 12:00 AM.`,`कदल्ली (DEL), 15/08/1947, 12:00 A.M.`],
a:0,
e:`दिए गए संदर्भ में सही format विकल्प (a) है।`
},

{
q:`श्रंखला को पूरा करें: x x _ y z z _ x y y z _ x x y y _ z`,
o:[`yxzz`,`yxxz`,`zyxx`,`yzxx`],
a:0,
e:`श्रंखला के pattern के अनुसार रिक्त स्थानों में y, x, z, z आता है।`
},

{
q:`अगला पद क्या है? B9, E25, I49, N81, ?`,
o:[`S121`,`R100`,`T121`,`Q100`],
a:2,
e:`अक्षरों में +3, +4, +5, +6 और संख्याओं में 3², 5², 7², 9², 11² का pattern है। इसलिए T121।`
},

{
q:`अतभकथन (A): तनयतमत व्यायाम मानतसक स्िास््य में सुधार करता है।<br>
कारण (R): शारीररक गतततितध एंिोर्ितन जारी करती है जो तनाि को कम करती है।`,

/* ================= SYSTEM ================= */

let selected = {};
let score = 0;

const container = document.getElementById("questions");
const nav = document.getElementById("questionNav");

function renderQuestions(){

    questions.forEach((item,index)=>{

        const card=document.createElement("div");
        card.className="question-card";
        card.id="q"+(index+1);

        let optionsHTML="";

        item.o.forEach((option,i)=>{
            optionsHTML += `
                <div class="option"
                     data-index="${i}"
                     onclick="selectOption(${index},${i},this)">
                     <b>(${String.fromCharCode(97+i)})</b>
                     ${option}
                </div>
            `;
        });

        card.innerHTML=`
            <div class="q-number">Q${index+1}.</div>

            <div class="question">
                ${item.q}
            </div>

            ${item.p ? `<div class="passage">${item.p}</div>` : ""}

            <div class="options">
                ${optionsHTML}
            </div>

            <button class="answer-btn"
                    onclick="showAnswer(${index})">
                Show Answer
            </button>

            <div class="answer-box" id="answer${index}">
                <div class="answer">
                    ✓ Correct Answer: (${String.fromCharCode(97+item.a)})
                    ${item.o[item.a]}
                </div>

                <div class="explanation">
                    <b>Explanation:</b> ${item.e}
                </div>
            </div>
        `;

        container.appendChild(card);

        const navBtn=document.createElement("button");
        navBtn.className="q-nav";
        navBtn.innerText=index+1;

        navBtn.onclick=()=>{
            document.getElementById("q"+(index+1))
            .scrollIntoView({
                behavior:"smooth",
                block:"start"
            });
        };

        nav.appendChild(navBtn);
    });
}

function selectOption(qIndex,optIndex,element){

    if(selected[qIndex] !== undefined) return;

    selected[qIndex]=optIndex;

    const card=document.getElementById("q"+(qIndex+1));
    const options=card.querySelectorAll(".option");

    options.forEach(o=>{
        o.style.pointerEvents="none";
    });

    const correct=questions[qIndex].a;

    if(optIndex===correct){
        element.classList.add("correct");
        score++;
    }else{
        element.classList.add("wrong");
        options[correct].classList.add("correct");
    }

    const navButtons=document.querySelectorAll(".q-nav");
    navButtons[qIndex].classList.add("attempted");

    updateProgress();
}

function showAnswer(index){

    const box=document.getElementById("answer"+index);

    box.classList.toggle("show");

    const btn=box.previousElementSibling;

    if(box.classList.contains("show")){
        btn.innerText="Hide Answer";
    }else{
        btn.innerText="Show Answer";
    }
}

function updateProgress(){

    const attempted=Object.keys(selected).length;

    document.getElementById("attempted").innerText=attempted;
    document.getElementById("score").innerText=score;

    const percentage=(attempted/questions.length)*100;

    document.getElementById("progressFill").style.width=
        percentage+"%";

    if(attempted===questions.length){

        document.getElementById("result").style.display="block";

        document.getElementById("finalScore").innerText=
            score+" / "+questions.length;

        setTimeout(()=>{
            document.getElementById("result")
            .scrollIntoView({
                behavior:"smooth"
            });
        },500);
    }
}

renderQuestions();

</script>

            text: 'फरवरी 2025 में भारत के 26वें मुख्य चुनाव आयुक्त (Chief Election Commissioner) के रूप में किसे नियुक्त किया गया था?',
            options: {
                A: 'राजीव कुमार',
                B: 'ज्ञानेश कुमार',
                C: 'सुखबीर सिंह संधू',
                D: 'विवेक जोशी'
            },
            answer: 'B',
            explanation: 'ज्ञानेश कुमार को फरवरी 2025 में 26वें CEC के रूप में नियुक्त किया गया। विकल्प (B) सही है।'
        }];

        // ================================================================
        // RENDER
        // ================================================================

        const container = document.getElementById('questions-container');
        let currentSection = '';
        let html = '';

        questionsData.forEach((q, index) => {
            if (q.section !== currentSection) {
                currentSection = q.section;
                const firstId = q.id;
                const lastId = Math.min(q.id + 24, questionsData.length);
                html += `<div class="section-head"><span>${firstId}–${lastId}</span> ${q.section}</div>`;
            }

            const optLetters = ['A', 'B', 'C', 'D'];
            let optionsHtml = '';
            optLetters.forEach(letter => {
                const val = q.options[letter];
                if (val) {
                    optionsHtml += `<div class="opt"><span class="letter">${letter}.</span> ${val}</div>`;
                }
            });

            html += `
                <div class="q-card" data-qid="${q.id}">
                    <div class="q-text"><span class="q-label">Q${q.id}.</span> ${q.text}</div>
                    <div class="options">${optionsHtml}</div>
                    <div class="answer-area">
                        <button class="btn-answer" data-target="ans-${q.id}">उत्तर दिखाएँ</button>
                        <div class="answer-box" id="ans-${q.id}">
                            <div class="correct">
                                <span class="opt-label">विकल्प ${q.answer}</span>
                                ${q.options[q.answer] || ''}
                            </div>
                            <div class="explanation">${q.explanation}</div>
                        </div>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;

        // ================================================================
        // INTERACTION
        // ================================================================

        document.querySelectorAll('.btn-answer').forEach(btn => {
            btn.addEventListener('click', function() {
                const targetId = this.dataset.target;
                const box = document.getElementById(targetId);
                if (!box) return;

                const isOpen = box.classList.contains('open');

                // Close all other open answers
                document.querySelectorAll('.answer-box.open').forEach(b => {
                    if (b.id !== targetId) {
                        b.classList.remove('open');
                        const otherBtn = document.querySelector(`.btn-answer[data-target="${b.id}"]`);
                        if (otherBtn) {
                            otherBtn.classList.remove('active');
                            otherBtn.textContent = 'उत्तर दिखाएँ';
                        }
                    }
                });

                if (isOpen) {
                    box.classList.remove('open');
                    this.classList.remove('active');
                    this.textContent = 'उत्तर दिखाएँ';
                } else {
                    box.classList.add('open');
                    this.classList.add('active');
                    this.textContent = 'उत्तर छुपाएँ';
                }
            });
        });
    </script>

</body>
</html>

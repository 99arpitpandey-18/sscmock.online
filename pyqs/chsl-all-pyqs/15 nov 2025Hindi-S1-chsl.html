            question: `Choose the most suitable option to replace the highlighted part of the sentence.<br><br>

            explanation: `<strong>Explanation:</strong> The noun "colleges" refers to things, not people. Therefore, the relative pronoun must be used for things: <strong>which</strong>, not <em>whom</em>. Also, "ten" refers to plural colleges, so the verb must be plural: <strong>are</strong>.<br><br>

            id: 2,
            subject: 'English',
            question: `Choose the correct passive voice transformation of the sentence.<br><br>
            <span class="highlight">Will the company approve the proposal?</span>`,

                'The proposal will be approved by the company?',

            answer: 'B',
            explanation: `<strong>Explanation:</strong> The sentence is an interrogative (question) in active voice: <em>“Will the company approve the proposal?”</em> To change it into passive voice, we make the object “the proposal” the subject, use <strong>be + past participle</strong>, and keep the question format by placing the auxiliary before the subject.<br><br>
            ✅ <strong>Why option (B) is correct:</strong> “Will the proposal be approved by the company?” follows the exact passive interrogative structure.<br><br>
            ❌ <strong>Why others are incorrect:</strong><br>
            A: word order is not interrogative; it is like a statement with a question mark.<br>
            C: changes “will approve” (future) to “is approved” (present), altering tense.<br>
            D: uses “would,” which changes meaning and tense.`
        }, {
            id: 3,
            subject: 'English',
            question: `Which of the following sentences uses the word <strong>“close”</strong> with the same meaning as in the following sentence?<br><br>

            ✅ <strong>Why option (C) is correct:</strong> “Remember to close the gate after entering.” Here, <em>close</em> is also a verb meaning “shut the gate,” matching the original meaning.<br><br>
            ❌ <strong>Why others are incorrect:</strong><br>
            A & B: “close to” is an adjective/preposition phrase meaning “near” (Hindi: पास).<br>
            D: “close to” means emotionally connected (Hindi: घनिष्ठ), not “shut.”`
        }, {

        }, {
            id: 5,
            subject: 'English',
            question: `Choose the correct <strong>one-word substitute</strong> for:<br><br>

            ✅ <strong>Why option (A) is correct:</strong> <em>Progressive</em> exactly matches the definition.<br><br>

            C (Reactionary): strongly opposed to change; wants old system (Hindi: प्रतिगामी).<br>

        }, {
            id: 6,
            subject: 'English',
            question: `Select the most appropriate <strong>synonym</strong> of the word: <span class="highlight">Abolish</span>`,

            explanation: `<strong>Explanation:</strong> The word <strong>abolish</strong> means to formally put an end to a law, system, or practice; to officially stop it from continuing (Hindi: समाप्त करना / रद्द करना). Its closest synonym is the word that means “to cancel officially.”<br><br>

            question: `Select the option that expresses the given sentence in <strong>direct voice</strong>.<br><br>
            <span class="highlight">He told her that the restaurant they had visited the previous day was not as expensive as he had thought it would be.</span>`,

            ],
            answer: 'A',
            explanation: `<strong>Explanation:</strong> To convert indirect speech to direct speech, we restore the original quoted words. The reporting verb is “told,” so in direct speech it becomes “said to.” Also, the phrase <em>the previous day</em> in indirect speech becomes <strong>yesterday</strong> in direct speech, and the tense generally shifts back to the original natural form in the quotation.<br><br>

            question: `Select the option that expresses the given sentence in <strong>indirect voice</strong>.<br><br>
            <span class="highlight">The tour guide said, "We have been wandering for hours, but the ruins we have been searching for are just ahead, and we will reach there in a while."</span>`,

                'The tour guide said that they had been wandering for hours, but the ruins they had been searching for were just ahead, and they would reach there in a while.',
                'The tour guide said that they have been wandering for hours, but the ruins they have been searching for are just ahead, and they will reach there in a while.',

        // ============================================================
        //   RENDER
        // ============================================================
        const container = document.getElementById('questionsContainer');

        function renderQuestions() {
            let html = '';
            let currentSubject = '';

            questionsData.forEach((q, index) => {
                const qNum = index + 1;

                // ---- subject divider ----
                if (q.subject !== currentSubject) {
                    currentSubject = q.subject;
                    html += `<div class="subject-divider">📌 ${currentSubject} <small>· Questions</small></div>`;
                }

                // ---- options list ----
                const optLetters = ['A', 'B', 'C', 'D'];
                let optionsHtml = '';
                q.options.forEach((opt, i) => {
                    optionsHtml += `
                        <div class="option">
                            <span class="letter">${optLetters[i]}.</span>
                            <span>${opt}</span>
                        </div>
                    `;
                });

                // ---- card ----
                html += `
                    <div class="question-card" id="q-${qNum}">
                        <div class="q-head">
                            <span class="q-number">Q.${qNum}</span>
                            <span class="q-tag">${q.subject}</span>
                        </div>
                        <div class="q-text">${q.question}</div>
                        <div class="options">${optionsHtml}</div>
                        <div class="btn-row">
                            <button class="btn-toggle" data-target="ans-${qNum}">
                                <span class="icon">👁️</span> उत्तर दिखाई
                            </button>
                        </div>
                        <div class="answer-box" id="ans-${qNum}">
                            <div class="ans-label">✅ सही उत्तर: <span>${q.answer}</span></div>
                            <div class="explanation">${q.explanation}</div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        renderQuestions();


        // ============================================================
        //   TOGGLE ANSWERS
        // ============================================================
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.btn-toggle');
            if (!btn) return;

            const targetId = btn.dataset.target;
            const answerBox = document.getElementById(targetId);
            if (!answerBox) return;

            const isHidden = !answerBox.classList.contains('show');

            if (isHidden) {
                answerBox.classList.add('show');
                btn.innerHTML = `<span class="icon">🙈</span> उत्तर छिपाएँ`;
                btn.classList.add('hide-btn');
                // scroll to answer smoothly
                setTimeout(() => {
                    answerBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 100);
            } else {
                answerBox.classList.remove('show');
                btn.innerHTML = `<span class="icon">👁️</span> उत्तर दिखाई`;
                btn.classList.remove('hide-btn');
            }
        });


        // ============================================================
        //   SCROLL TO TOP
        // ============================================================
        const scrollBtn = document.getElementById('scrollTopBtn');

        window.addEventListener('scroll', function() {
            if (window.scrollY > 500) {
                scrollBtn.classList.add('visible');
            } else {
                scrollBtn.classList.remove('visible');
            }
        });

        scrollBtn.addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        console.log('✅ 100 Questions loaded. Click "उत्तर दिखाई" to reveal answers.');
    </script>

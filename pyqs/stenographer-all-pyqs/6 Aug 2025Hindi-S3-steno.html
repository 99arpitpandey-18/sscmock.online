        const container = document.getElementById('questionsContainer');

        function renderQuestions() {
            let html = '';
            questionsData.forEach((q) => {
                const qNum = q.id || '?';
                const optLabels = ['A', 'B', 'C', 'D'];
                const ansLetter = q.answer ? q.answer.toUpperCase() : '?';

                html += `
                <div class="question-card" id="q-${qNum}">
                  <div class="q-header">
                    <span class="q-num">Q${qNum}</span>
                    <span class="q-text">${q.text}</span>
                  </div>
                  <div class="options">
                    ${q.options.map((opt, i) => `
                      <div class="opt"><strong>${optLabels[i]}.</strong> ${opt}</div>
                    `).join('')}
                  </div>
                  <div class="btn-wrapper">
                    <button class="btn-show" data-target="ans-${qNum}">📖 Show Answer</button>
                  </div>
                  <div class="answer-box" id="ans-${qNum}">
                    <div><span class="ans-label">✅ उत्तर:</span> <strong>${ansLetter}</strong></div>
                    <div class="explanation"><strong>💡 व्याख्या:</strong> ${q.explanation}</div>
                  </div>
                </div>
              `;
            });
            container.innerHTML = html;

            // Attach click events
            document.querySelectorAll('.btn-show').forEach(btn => {
                btn.addEventListener('click', function() {
                    const targetId = this.dataset.target;
                    const ansBox = document.getElementById(targetId);
                    if (!ansBox) return;
                    const isShowing = ansBox.classList.contains('show');
                    if (isShowing) {
                        ansBox.classList.remove('show');
                        this.textContent = '📖 Show Answer';
                        this.classList.remove('hide-btn');
                    } else {
                        ansBox.classList.add('show');
                        this.textContent = '🙈 Hide Answer';
                        this.classList.add('hide-btn');
                    }
                });
            });
        }

        renderQuestions();
    </script>
</body>
</html>

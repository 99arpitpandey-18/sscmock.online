<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 SSC CGL Mock Test Manager (100+ Mocks)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #f0f4fc;
            padding: 25px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            background: linear-gradient(145deg, #1a2a6c, #b21f1f, #fdbb2d);
            padding: 25px 30px;
            border-radius: 30px;
            color: white;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
        }
        .header h1 i {
            margin-right: 12px;
        }
        .header .sub {
            font-size: 1rem;
            opacity: 0.9;
        }

        /* STATS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px 18px;
            border-radius: 24px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
            text-align: center;
            border: 1px solid #ecf0f1;
        }
        .stat-card .num {
            font-size: 2.4rem;
            font-weight: 800;
            color: #2d3436;
        }
        .stat-card .label {
            color: #636e72;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 4px;
        }
        .stat-card .icon {
            font-size: 2rem;
            margin-bottom: 6px;
        }
        .stat-card:nth-child(1) .icon { color: #6c5ce7; }
        .stat-card:nth-child(2) .icon { color: #00b894; }
        .stat-card:nth-child(3) .icon { color: #fdcb6e; }
        .stat-card:nth-child(4) .icon { color: #e17055; }

        /* SEARCH & FILTER */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            background: white;
            padding: 18px 25px;
            border-radius: 60px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
            border: 1px solid #ecf0f1;
        }
        .toolbar .search-box {
            flex: 1;
            min-width: 200px;
            padding: 12px 20px;
            border: 2px solid #dfe6e9;
            border-radius: 40px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            background: #f8f9fa;
        }
        .toolbar .search-box:focus {
            border-color: #6c5ce7;
            background: white;
            box-shadow: 0 0 0 4px rgba(108,92,231,0.1);
        }
        .filter-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .filter-btn {
            padding: 10px 22px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            background: #ecf0f1;
            color: #2d3436;
        }
        .filter-btn:hover {
            transform: translateY(-2px);
        }
        .filter-btn.active {
            background: #6c5ce7;
            color: white;
            box-shadow: 0 5px 15px rgba(108,92,231,0.3);
        }
        .filter-btn[data-status="all"].active { background: #6c5ce7; }
        .filter-btn[data-status="notstarted"].active { background: #fdcb6e; color: #2d3436; }
        .filter-btn[data-status="inprogress"].active { background: #0984e3; color: white; }
        .filter-btn[data-status="completed"].active { background: #00b894; color: white; }

        /* MOCK GRID */
        .mock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
        }

        .mock-card {
            background: white;
            border-radius: 24px;
            padding: 22px 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            border: 1px solid #ecf0f1;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
        }
        .mock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.06);
        }
        .mock-card .mock-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .mock-card .mock-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #2d3436;
        }
        .mock-card .mock-subject {
            background: #dfe6e9;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #2d3436;
            text-transform: uppercase;
        }
        .mock-card .mock-details {
            color: #636e72;
            font-size: 0.9rem;
            margin: 6px 0 12px;
        }
        .mock-card .mock-details i {
            margin-right: 6px;
            width: 18px;
        }
        .mock-card .status-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            margin: 8px 0 12px;
            align-self: flex-start;
        }
        .status-badge.notstarted { background: #fdcb6e; color: #2d3436; }
        .status-badge.inprogress { background: #74b9ff; color: white; }
        .status-badge.completed { background: #55efc4; color: #00695c; }

        .mock-card .score-display {
            font-weight: 700;
            font-size: 1.2rem;
            color: #2d3436;
            margin-bottom: 12px;
        }
        .mock-card .actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }
        .mock-card .actions button {
            padding: 10px 18px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            font-size: 0.9rem;
        }
        .btn-start {
            background: #6c5ce7;
            color: white;
            box-shadow: 0 4px 10px rgba(108,92,231,0.2);
        }
        .btn-start:hover { background: #5a4bd1; transform: scale(1.02); }
        .btn-reset {
            background: #ecf0f1;
            color: #2d3436;
        }
        .btn-reset:hover { background: #dfe6e9; }

        /* NO RESULTS */
        .no-result {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #b2bec3;
            font-size: 1.2rem;
        }

        /* ----- MODAL (Mock Test) ----- */
        .test-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }
        .test-modal.show { display: flex; }
        .test-modal-content {
            background: white;
            max-width: 800px;
            width: 100%;
            border-radius: 30px;
            padding: 35px 40px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            position: relative;
        }
        .test-modal-content .close-btn {
            position: sticky; top: 0; float: right;
            background: #e74c3c; border: none; color: white;
            width: 40px; height: 40px; border-radius: 50%;
            font-size: 1.2rem; cursor: pointer;
            z-index: 10;
        }
        .test-modal-content h2 {
            margin-bottom: 15px;
            color: #2d3436;
        }
        .question-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ecf0f1;
        }
        .question-item .q-text {
            font-weight: 600;
            margin-bottom: 8px;
        }
        .question-item .options label {
            display: block;
            margin: 4px 0;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 12px;
            transition: 0.2s;
        }
        .question-item .options label:hover {
            background: #f0f4fc;
        }
        .question-item .options input[type="radio"] {
            margin-right: 10px;
        }
        .submit-test-btn {
            background: #00b894;
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .submit-test-btn:hover { background: #00a381; transform: scale(1.02); }
        .result-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 20px;
            background: #f0f7ff;
            border-left: 8px solid #6c5ce7;
        }
        .result-box .score {
            font-size: 2rem;
            font-weight: 800;
            color: #2d3436;
        }
        .explanation-text {
            margin-top: 8px;
            padding: 10px 14px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #00b894;
            font-size: 0.95rem;
            color: #2d3436;
            display: none;
        }
        .explanation-text.show {
            display: block;
        }
        .explanation-text.correct {
            border-left-color: #00b894;
            background: #eafaf1;
        }
        .explanation-text.wrong {
            border-left-color: #e74c3c;
            background: #fdedec;
        }

        @media (max-width: 700px) {
            .header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .toolbar { border-radius: 30px; padding: 15px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .mock-grid { grid-template-columns: 1fr; }
            .test-modal-content { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div>
            <h1><i class="fas fa-file-alt"></i> CGL Mock Test Manager</h1>
            <div class="sub">100+ SSC CGL Mock Tests • Real Questions • Detailed Explanations</div>
        </div>

            <i class="fas fa-database" style="font-size: 1.8rem; opacity:0.8;"></i>

        </div>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
        <div class="stat-card">

        </div>

            <div class="icon"><i class="fas fa-check-circle"></i></div>

            <div class="icon"><i class="fas fa-chart-line"></i></div>

            <div class="icon"><i class="fas fa-trophy"></i></div>

</div>

<!-- MODAL : MOCK TEST SIMULATION -->
<!-- ========================================================== -->
<div class="test-modal" id="testModal">
    <div class="test-modal-content" id="testModalContent">
        <button class="close-btn" onclick="closeTestModal()"><i class="fas fa-times"></i></button>
        <div id="testDynamic"></div>
    </div>
</div>

<script>
    // ==========================================================
    // 1. DATA : 100+ MOCK TESTS
    // ==========================================================
    function generateMockData() {
        const subjects = ['English', 'Maths', 'Reasoning', 'GK'];
        const mocks = [];
        for (let i = 1; i <= 110; i++) {
            const subject = subjects[i % subjects.length];
            mocks.push({
                id: i,
                name: `SSC CGL Mock Test ${i}`,
                subject: subject,
                totalQuestions: 10,
                status: 'notstarted',
                score: null,
                date: `2025-${String(10 + (i % 3)).padStart(2,'0')}-${String(10 + (i % 20)).padStart(2,'0')}`
            });
        }
        return mocks;
    }

    // ==========================================================
    // 2. STATE MANAGEMENT (LocalStorage)
    // ==========================================================
    let mocks = [];
    let currentFilter = 'all';
    let currentSearch = '';

    function loadMocks() {
        const stored = localStorage.getItem('cgl_mocks');
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                mocks = parsed.map(m => ({
                    ...m,
                    status: m.status || 'notstarted',
                    score: m.score !== undefined ? m.score : null
                }));
                return;
            } catch(e) {}
        }
        mocks = generateMockData();
        saveMocks();
    }

    function saveMocks() {
        localStorage.setItem('cgl_mocks', JSON.stringify(mocks));
    }

                    options: ['Accommodate', 'Acommodate', 'Accomodate', 'Acomodate'],
                    correct: 'Accommodate',
                    explanation: 'The correct spelling is "Accommodate" with double "c" and double "m".'
                },
                {
                    question: 'Select the most appropriate synonym of "Benevolent".',
                    options: ['Kind', 'Cruel', 'Greedy', 'Selfish'],
                    correct: 'Kind',
                    explanation: '"Benevolent" means well-meaning and kindly, so "Kind" is the synonym.'
                },
                {
                    question: 'Select the most appropriate antonym of "Abundant".',
                    options: ['Plentiful', 'Scarce', 'Ample', 'Copious'],
                    correct: 'Scarce',
                    explanation: '"Abundant" means plentiful, so its antonym is "Scarce".'
                },
                {
                    question: 'Select the correct passive voice form: "The police arrested the thief."',
                    options: ['The thief was arrested by the police.', 'The thief is arrested by the police.', 'The thief has been arrested by the police.', 'The thief was being arrested by the police.'],
                    correct: 'The thief was arrested by the police.',
                    explanation: 'Simple past active becomes simple past passive: was/were + V3.'
                },
                {
                    question: 'Select the correct indirect speech: He said, "I am going to the market."',
                    options: ['He said that he was going to the market.', 'He said that he is going to the market.', 'He said that I am going to the market.', 'He said that he went to the market.'],
                    correct: 'He said that he was going to the market.',
                    explanation: 'Present continuous becomes past continuous in indirect speech.'
                },
                {
                    question: 'Select the most appropriate meaning of the idiom: "To burn the midnight oil"',
                    options: ['To work late into the night', 'To waste time', 'To study in the morning', 'To sleep early'],
                    correct: 'To work late into the night',
                    explanation: '"Burn the midnight oil" means to work or study late into the night.'
                },
                {
                    question: 'Select the correctly punctuated sentence.',
                    options: ['He said, "I am happy."', 'He said "I am happy."', 'He said, I am happy.', 'He said "I am happy".'],
                    correct: 'He said, "I am happy."',
                    explanation: 'Correct punctuation: comma after "said", opening and closing quotes, period inside quotes.'
                },
                {
                    question: 'Select the most appropriate option to fill in the blank: "She is ___________ than her sister."',
                    options: ['taller', 'tall', 'tallest', 'more tall'],
                    correct: 'taller',
                    explanation: 'Comparative degree is used when comparing two: "taller".'
                },
                {
                    question: 'Select the most appropriate option to fill in the blank: "I have been waiting for you ___________ 2 hours."',
                    options: ['since', 'for', 'from', 'during'],
                    correct: 'for',
                    explanation: '"For" is used with a duration of time (2 hours). "Since" is used with a point in time.'
                }
            ],
            'GK': [
                {
                    question: 'Which was the wettest place in India in 2018 as per the India Meteorological Department (IMD)?',
                    options: ['Mawsynram', 'Cherrapunji', 'Agumbe', 'Mahabaleshwar'],
                    correct: 'Mawsynram',
                    explanation: 'Mawsynram in Meghalaya recorded the highest rainfall in 2018.'
                },
                {
                    question: 'Who is the author of the book "The Discovery of India"?',
                    options: ['Mahatma Gandhi', 'Jawaharlal Nehru', 'Subhash Chandra Bose', 'Rabindranath Tagore'],
                    correct: 'Jawaharlal Nehru',
                    explanation: '"The Discovery of India" was written by Jawaharlal Nehru during his imprisonment in 1942-1946.'
                },
                {
                    question: 'What is the chemical formula of water?',
                    options: ['H2O', 'CO2', 'NaCl', 'HCl'],
                    correct: 'H2O',
                    explanation: 'Water has the chemical formula H2O (two hydrogen atoms and one oxygen atom).'
                },
                {
                    question: 'Which planet is known as the "Red Planet"?',
                    options: ['Venus', 'Mars', 'Jupiter', 'Saturn'],
                    correct: 'Mars',
                    explanation: 'Mars is called the "Red Planet" due to its reddish appearance from iron oxide (rust) on its surface.'
                },
                {
                    question: 'Who was the first President of India?',
                    options: ['Dr. Rajendra Prasad', 'Dr. S. Radhakrishnan', 'Jawaharlal Nehru', 'Mahatma Gandhi'],
                    correct: 'Dr. Rajendra Prasad',
                    explanation: 'Dr. Rajendra Prasad was the first President of India, serving from 1950 to 1962.'
                },
                {
                    question: 'What is the currency of Japan?',
                    options: ['Yuan', 'Yen', 'Won', 'Ringgit'],
                    correct: 'Yen',
                    explanation: 'The currency of Japan is the Japanese Yen (¥).'
                },
                {
                    question: 'Which is the largest desert in the world?',
                    options: ['Sahara Desert', 'Gobi Desert', 'Kalahari Desert', 'Arabian Desert'],
                    correct: 'Sahara Desert',
                    explanation: 'The Sahara Desert is the largest hot desert in the world, covering much of North Africa.'
                },
                {
                    question: 'What is the full form of ISRO?',
                    options: ['Indian Space Research Organisation', 'International Space Research Organisation', 'Indian Scientific Research Organisation', 'International Scientific Research Organisation'],
                    correct: 'Indian Space Research Organisation',
                    explanation: 'ISRO stands for Indian Space Research Organisation, the space agency of India.'
                },
                {
                    question: 'Which gas is responsible for the greenhouse effect?',
                    options: ['Oxygen', 'Carbon Dioxide', 'Nitrogen', 'Hydrogen'],
                    correct: 'Carbon Dioxide',
                    explanation: 'Carbon dioxide (CO2) is a major greenhouse gas that traps heat in the atmosphere.'
                },
                {
                    question: 'Who built the Taj Mahal?',
                    options: ['Akbar', 'Shah Jahan', 'Aurangzeb', 'Jahangir'],
                    correct: 'Shah Jahan',
                    explanation: 'The Taj Mahal was built by Mughal Emperor Shah Jahan in memory of his wife Mumtaz Mahal.'
                }
            ]
        };

        // Get questions for the subject, or fallback to Reasoning
        let qs = allQuestions[subject] || allQuestions['Reasoning'];
        // Use seed to shuffle and pick 10 questions
        const shuffled = [...qs];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(rng(seed + i * 100) * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled.slice(0, 10);
    }

    // ==========================================================
    // 4. RENDER
    // ==========================================================
    function render() {
        const total = mocks.length;
        const completed = mocks.filter(m => m.status === 'completed').length;
        const scores = mocks.filter(m => m.status === 'completed' && m.score !== null).map(m => m.score);
        const avg = scores.length ? Math.round(scores.reduce((a,b) => a+b, 0) / scores.length) : 0;
        const best = scores.length ? Math.max(...scores) : 0;

        document.getElementById('totalCount').textContent = total;
        document.getElementById('completedCount').textContent = completed;
        document.getElementById('avgScore').textContent = avg + '%';
        document.getElementById('bestScore').textContent = best + '%';
        document.getElementById('totalMocksDisplay').textContent = total;

        const filtered = mocks.filter(m => {
            const matchStatus = currentFilter === 'all' || m.status === currentFilter;
            const matchSearch = m.name.toLowerCase().includes(currentSearch.toLowerCase()) ||
                               m.subject.toLowerCase().includes(currentSearch.toLowerCase());
            return matchStatus && matchSearch;
        });

        const grid = document.getElementById('mockGrid');
        if (filtered.length === 0) {
            grid.innerHTML = `<div class="no-result"><i class="fas fa-search" style="font-size:2rem; display:block; margin-bottom:10px;"></i> No mocks found</div>`;
            return;
        }

        let html = '';
        filtered.forEach(m => {
            const statusLabel = m.status === 'notstarted' ? 'Not Started' :
                               m.status === 'inprogress' ? 'In Progress' : '✅ Completed';
            const statusClass = m.status;
            const scoreText = m.status === 'completed' && m.score !== null ? `${m.score}%` : '—';
            const btnText = m.status === 'notstarted' ? 'Start' : 'Continue';

            html += `
                <div class="mock-card">
                    <div class="mock-header">
                        <span class="mock-title">${m.name}</span>
                        <span class="mock-subject">${m.subject}</span>
                    </div>
                    <div class="mock-details">
                        <i class="fas fa-calendar-alt"></i> ${m.date} &nbsp;|&nbsp; <i class="fas fa-question-circle"></i> ${m.totalQuestions} Qs
                    </div>
                    <span class="status-badge ${statusClass}">${statusLabel}</span>
                    <div class="score-display">Score: ${scoreText}</div>
                    <div class="actions">
                        <button class="btn-start" onclick="openTest(${m.id})"><i class="fas fa-play"></i> ${btnText}</button>
                        <button class="btn-reset" onclick="resetTest(${m.id})"><i class="fas fa-undo"></i> Reset</button>
                    </div>
                </div>
            `;
        });
        grid.innerHTML = html;
    }

    // ==========================================================
    // 5. FILTER & SEARCH EVENTS
    // ==========================================================
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.status;
            render();
        });
    });

    document.getElementById('searchInput').addEventListener('input', function() {
        currentSearch = this.value.trim();
        render();
    });

    // ==========================================================
    // 6. MOCK TEST SIMULATION (Modal)
    // ==========================================================
    let currentTestId = null;

    function openTest(id) {
        const mock = mocks.find(m => m.id === id);
        if (!mock) return;
        currentTestId = id;

        if (mock.status === 'completed' && mock.score !== null) {
            showTestResult(mock);
            return;
        }

        const questions = getQuestionsForSubject(mock.subject, id * 1000);
        const container = document.getElementById('testDynamic');
        let html = `
            <h2>${mock.name} <small style="font-weight:400; font-size:1rem; color:#636e72;">(${mock.subject})</small></h2>
            <p style="color:#636e72; margin-bottom:15px;">Answer all 10 questions and submit to get your score with detailed explanations.</p>
            <form id="testForm">
        `;
        questions.forEach((q, idx) => {
            html += `
                <div class="question-item">
                    <div class="q-text">${idx+1}. ${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, oi) => `
                            <label>
                                <input type="radio" name="q${idx}" value="${opt.replace(/"/g, '&quot;')}"> ${opt}
                            </label>
                        `).join('')}
                    </div>
                    <div class="explanation-text" id="exp_${idx}"></div>
                </div>
            `;
        });
        html += `
                <button type="button" class="submit-test-btn" onclick="submitTest(${id})"><i class="fas fa-check-circle"></i> Submit Test</button>
            </form>
            <div id="testResult"></div>
        `;
        container.innerHTML = html;
        document.getElementById('testModal').classList.add('show');
        window._currentQuestions = questions;
    }

    function submitTest(id) {
        const questions = window._currentQuestions || [];
        let correct = 0;
        let total = questions.length;
        let allAnswered = true;

        for (let i = 0; i < total; i++) {
            const radios = document.querySelectorAll(`input[name="q${i}"]`);
            let selected = null;
            radios.forEach(r => { if (r.checked) selected = r.value; });
            const expBox = document.getElementById(`exp_${i}`);
            if (!selected) {
                allAnswered = false;
                expBox.textContent = '⚠️ Please select an answer.';
                expBox.className = 'explanation-text show wrong';
                continue;
            }
            const isCorrect = (selected === questions[i].correct);
            if (isCorrect) correct++;
            expBox.className = `explanation-text show ${isCorrect ? 'correct' : 'wrong'}`;
            expBox.innerHTML = `<strong>${isCorrect ? '✅ Correct!' : '❌ Incorrect.'}</strong> Correct answer: ${questions[i].correct}<br>📖 ${questions[i].explanation}`;
        }

        const resultDiv = document.getElementById('testResult');
        if (!allAnswered) {
            resultDiv.innerHTML = `<div class="result-box" style="border-left-color:#e74c3c;"><strong>⚠️ Please answer all questions before submitting.</strong></div>`;
            return;
        }

        const scorePercent = Math.round((correct / total) * 100);
        const mock = mocks.find(m => m.id === id);
        if (mock) {
            mock.status = 'completed';
            mock.score = scorePercent;
            saveMocks();
            showTestResult(mock);
            render();
        }
    }

    function showTestResult(mock) {
        const container = document.getElementById('testDynamic');
        container.innerHTML = `
            <h2>${mock.name} - Result</h2>
            <div class="result-box">
                <div class="score">Your Score: ${mock.score}%</div>
                <p style="margin-top:8px; color:#636e72;">${mock.score >= 60 ? '🎉 Great job! Keep practicing.' : '💪 Keep practicing to improve your score.'}</p>
                <p style="color:#636e72;">Status: ${mock.status === 'completed' ? '✅ Completed' : 'In Progress'}</p>
                <button class="submit-test-btn" style="background:#6c5ce7; margin-top:15px;" onclick="closeTestModal()">Close</button>
            </div>
        `;
    }

    function resetTest(id) {
        if (!confirm('Reset this mock test? All progress will be lost.')) return;
        const mock = mocks.find(m => m.id === id);
        if (mock) {
            mock.status = 'notstarted';
            mock.score = null;
            saveMocks();
            render();
        }
    }

    function closeTestModal() {
        document.getElementById('testModal').classList.remove('show');
        window._currentQuestions = null;
    }

    // ==========================================================
    // 7. INIT
    // ==========================================================
    window.onload = function() {
        loadMocks();
        render();
        document.getElementById('testModal').addEventListener('click', function(e) {
            if (e.target === this) closeTestModal();
        });
    };
</script>
</body>
</html>

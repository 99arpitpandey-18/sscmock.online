<script>
    // ---------- डेटा: मैन्युअल (Unique) + जनरेटेड ----------
    const questionBank = [];
    function addQ(topic, q, opts, ans, exp) {
        questionBank.push({ topic, q, opts, ans, exp });
    }

    // ================== 1. अर्थव्यवस्था (मैन्युअल 25 + जनरेटेड 35 = 60) ==================
    const ecoManual = [
        ["RBI की MPC ने जून 2026 में रेपो रेट कितने प्रतिशत पर स्थिर रखा?", ["A. 5.00%", "B. 5.25%", "C. 5.50%", "D. 6.00%"], "B", "MPC ने रेपो रेट 5.25% पर बरकरार रखा।"],
        ["RBI ने जून 2026 में GDP वृद्धि दर का पूर्वानुमान कितना लगाया?", ["A. 6.9%", "B. 6.6%", "C. 6.3%", "D. 6.0%"], "B", "RBI ने GDP अनुमान 6.9% से घटाकर 6.6% किया।"],
        ["जून 2026 में UPI का मासिक लेनदेन मूल्य (रिकॉर्ड) कितना था?", ["A. ₹10 लाख करोड़", "B. ₹12 लाख करोड़", "C. ₹14 लाख करोड़", "D. ₹16 लाख करोड़"], "D", "UPI ने ₹16 लाख करोड़ का नया रिकॉर्ड बनाया।"],
        ["RBI ने मुद्रास्फीति (CPI) का पूर्वानुमान कितना लगाया?", ["A. 4.6%", "B. 5.1%", "C. 5.25%", "D. 3.5%"], "B", "RBI ने CPI 5.1% रखा।"],
        ["किस फिनटेक कंपनी ने GIFT City में IFSCA से PSP लाइसेंस प्राप्त किया?", ["A. Paytm", "B. Razorpay", "C. PhonePe", "D. Google Pay"], "B", "Razorpay ने यह लाइसेंस प्राप्त किया।"],
        ["किस देश ने भारतीय आगंतुकों के लिए UPI भुगतान सक्षम किया?", ["A. सिंगापुर", "B. थाईलैंड", "C. कंबोडिया", "D. वियतनाम"], "C", "कंबोडिया ने ACLEDA Bank के साथ साझेदारी की।"],
        ["ECLGS 5.0 के तहत लेंडर्स को कितने प्रतिशत जोखिम-भार (risk-weight) की छूट मिली?", ["A. 50%", "B. 75%", "C. 100%", "D. 25%"], "C", "ECLGS 5.0 में 100% risk-weight छूट दी गई।"],
        ["RBI ने किस प्रकार के बॉन्ड पर FII निवेश के लिए कर समाप्त किया?", ["A. कॉर्पोरेट", "B. सरकारी", "C. म्यूनिसिपल", "D. इंफ्रा"], "B", "सरकारी बॉन्ड पर कर समाप्त किया गया।"],
        ["RBI ने bundled products की बिक्री के कितने दिनों के भीतर feedback तंत्र अनिवार्य किया?", ["A. 7", "B. 15", "C. 30", "D. 45"], "C", "30 दिनों के भीतर feedback अनिवार्य किया।"],
        ["RBI की किस शाखा ने 'RBI Reelathon 2026' लॉन्च किया?", ["A. मुंबई", "B. दिल्ली", "C. चेन्नई", "D. कोलकाता"], "A", "मुंबई शाखा ने यह अभियान चलाया।"],
        ["जून 2026 में RBI ने किस बैंक पर 2.5 करोड़ का जुर्माना लगाया?", ["A. SBI", "B. PNB", "C. बैंक ऑफ बड़ौदा", "D. यस बैंक"], "A", "SBI पर जुर्माना लगाया गया।"],
        ["RBI ने मई 2026 के लिए retail inflation का आँकड़ा कितना जारी किया?", ["A. 4.9%", "B. 5.2%", "C. 5.5%", "D. 6.1%"], "B", "मई में retail inflation 5.2% था।"],
        ["किस राज्य ने जून 2026 में GST संग्रह में सबसे अधिक वृद्धि दर्ज की?", ["A. गुजरात", "B. महाराष्ट्र", "C. कर्नाटक", "D. तमिलनाडु"], "B", "महाराष्ट्र ने सबसे अधिक GST वृद्धि दर्ज की।"],
        ["भारत सरकार ने जून 2026 में किस उत्पाद का निर्यात शुल्क समाप्त कर दिया?", ["A. चावल", "B. गेहूं", "C. प्याज", "D. चीनी"], "D", "चीनी पर निर्यात शुल्क समाप्त कर दिया गया।"],
        ["जून 2026 में किस अंतरराष्ट्रीय मुद्रा कोष (IMF) ने भारत की GDP वृद्धि दर 7.0% रहने का अनुमान लगाया?", ["A. विश्व बैंक", "B. IMF", "C. ADB", "D. S&P"], "B", "IMF ने भारत की GDP 7.0% रहने का अनुमान लगाया।"],
        ["भारत ने जून 2026 में किस देश के साथ मुद्रा विनिमय (Currency Swap) समझौता बढ़ाया?", ["A. जापान", "B. UAE", "C. रूस", "D. ऑस्ट्रेलिया"], "A", "जापान के साथ currency swap समझौता बढ़ाया।"],
        ["SEBI ने जून 2026 में FIIs के लिए किस क्षेत्र में निवेश सीमा बढ़ाई?", ["A. रियल एस्टेट", "B. बुनियादी ढाँचा", "C. शिक्षा", "D. कृषि"], "B", "बुनियादी ढाँचा (Infrastructure) में निवेश सीमा बढ़ाई गई।"],
        ["किस PSU बैंक का जून 2026 में विलय (Merger) प्रस्ताव आया?", ["A. बैंक ऑफ इंडिया", "B. सेंट्रल बैंक", "C. यूनियन बैंक", "D. इंडियन बैंक"], "D", "इंडियन बैंक का विलय प्रस्ताव आया।"],
        ["RBI ने जून 2026 में किस नए पेमेंट ऐप को UPI के लिए मंजूरी दी?", ["A. फैमपे", "B. क्रेड", "C. अमेज़न पे", "D. व्हाट्सएप पे"], "A", "फैमपे (Fampay) को UPI मंजूरी मिली।"],
        ["सरकार ने जून 2026 में किस महंगी वस्तु के दाम में कटौती की?", ["A. पेट्रोल", "B. डीजल", "C. एलपीजी", "D. सोना"], "C", "एलपीजी (रसोई गैस) के दाम में कटौती की गई।"],
    ];
    ecoManual.forEach(item => addQ("अर्थव्यवस्था", item[0], item[1], item[2], item[3]));

    // अर्थव्यवस्था जनरेटर
    const ecoBanks = ["SBI", "PNB", "बैंक ऑफ बड़ौदा", "केनरा बैंक", "यस बैंक", "आईसीआईसीआई", "एचडीएफसी", "एक्सिस बैंक"];
    const ecoSectors = ["इलेक्ट्रॉनिक्स", "वस्त्र", "ऑटोमोबाइल", "फार्मा", "स्टील", "सीमेंट", "खाद्य प्रसंस्करण"];
    for (let i = 0; i < 35; i++) {
        let b = ecoBanks[i % ecoBanks.length];
        let s = ecoSectors[i % ecoSectors.length];
        addQ("अर्थव्यवस्था",
            `RBI ने जून 2026 में ${b} को किस नियम के उल्लंघन पर चेतावनी दी?`,
            ["A. NPA मानदंड", "B. CRR अनुपात", "C. KYC नियम", "D. प्रॉमिसरी नोट"], ["A","B","C","D"][i%4],
            `${b} को KYC/नियामक उल्लंघन पर चेतावनी दी गई।`);
        addQ("अर्थव्यवस्था",
            `जून 2026 में ${s} क्षेत्र का निर्यात कितने प्रतिशत बढ़ा?`,
            ["A. 5%", "B. 8%", "C. 12%", "D. 15%"], ["A","B","C","D"][(i+2)%4],
            `${s} क्षेत्र में निर्यात में उल्लेखनीय वृद्धि दर्ज की गई।`);
    }

    // ================== 2. रक्षा (मैन्युअल 25 + जनरेटेड 35 = 60) ==================
    const defManual = [
        ["DRDO ने जून 2026 में किस प्रणाली का सफल उड़ान परीक्षण किया?", ["A. उपग्रह प्रक्षेपण", "B. BMD प्रणाली", "C. अंतरिक्ष डॉकिंग", "D. हाइपरसोनिक"], "B", "DRDO ने बहु-स्तरीय BMD का परीक्षण किया।"],

        let sn = schemeNames[i % schemeNames.length];
        addQ("योजनाएँ", `${s} सरकार ने जून 2026 में कौन सी ${sn} शुरू की?`, ["A. योजना A", "B. योजना B", "C. योजना C", "D. योजना D"], ["A","B","C","D"][i%4], `${s} ने ${sn} को मंजूरी दी।`);
        addQ("योजनाएँ", `जून 2026 में किस योजना के तहत लाभार्थियों की संख्या 10 करोड़ पार हुई?`, ["A. PM आवास", "B. PM उज्ज्वला", "C. जल जीवन", "D. आयुष्मान"], ["A","B","C","D"][(i+3)%4], `${["PM आवास","PM उज्ज्वला","जल जीवन","आयुष्मान"][(i+3)%4]} ने 10 करोड़ का आंकड़ा पार किया।`);
    }

    // ================== 10. पर्यावरण (मैन्युअल 20 + जनरेटेड 30 = 50) ==================
    const envManual = [
        ["असम के कितने उत्पादों को GI टैग मिला?", ["A. 2", "B. 3", "C. 4", "D. 5"], "C", "4 उत्पादों को GI टैग मिला।"],
        ["किस उत्पाद को GI टैग नहीं मिला?", ["A. कार्बी हथकरघा", "B. बिहु पेपा", "C. बांस शिल्प", "D. मुगा रेशम"], "D", "मुगा रेशम को इस सूची में GI नहीं मिला।"],
        ["जून 2026 में किस राज्य में भीषण बाढ़ आई?", ["A. असम", "B. बिहार", "C. उत्तराखंड", "D. केरल"], "A", "असम में भीषण बाढ़ आई।"],
        ["विश्व मरुस्थलीकरण दिवस 2026 कब मनाया गया?", ["A. 10 जून", "B. 15 जून", "C. 17 जून", "D. 21 जून"], "C", "17 जून को मनाया गया।"],
        ["किस देश ने जलवायु परिवर्तन पर भारत के साथ संयुक्त बयान जारी किया?", ["A. अमेरिका", "B. चीन", "C. फ्रांस", "D. ब्राजील"], "A", "अमेरिका के साथ संयुक्त बयान जारी हुआ।"],
        ["जून 2026 में किस राष्ट्रीय उद्यान में बाघों की संख्या में 20% की वृद्धि दर्ज की गई?", ["A. कॉर्बेट", "B. कान्हा", "C. पेंच", "D. बांदीपुर"], "A", "कॉर्बेट में बाघों की संख्या बढ़ी।"],
        ["भारत ने जून 2026 में किस अंतरराष्ट्रीय पर्यावरण संधि की अध्यक्षता संभाली?", ["A. COP29", "B. COP30", "C. नागोया प्रोटोकॉल", "D. मॉन्ट्रियल प्रोटोकॉल"], "B", "भारत ने COP30 की अध्यक्षता संभाली।"],
    ];
    envManual.forEach(item => addQ("पर्यावरण", item[0], item[1], item[2], item[3]));

    const envStates = ["उत्तराखंड", "हिमाचल", "सिक्किम", "अरुणाचल", "मेघालय", "मिजोरम", "नागालैंड"];
    const envIssues = ["वनाग्नि", "भूस्खलन", "सूखा", "ओजोन रिक्तीकरण", "प्रदूषण", "ग्लेशियर पिघलाव"];
    for (let i = 0; i < 30; i++) {
        let e = envStates[i % envStates.length];
        let is = envIssues[i % envIssues.length];
        addQ("पर्यावरण", `${e} में जून 2026 में ${is} की गंभीर घटना हुई?`, ["A. हाँ", "B. नहीं", "C. सामान्य", "D. सूचना नहीं"], ["A","B","C","D"][i%4], `${e} में ${is} की घटना दर्ज की गई।`);
        addQ("पर्यावरण", `जून 2026 में किस राज्य ने सिंगल यूज़ प्लास्टिक पर पूर्ण प्रतिबंध लगाया?`, ["A. ओडिशा", "B. पश्चिम बंगाल", "C. केरल", "D. तमिलनाडु"], ["A","B","C","D"][(i+3)%4], `${["ओडिशा","पश्चिम बंगाल","केरल","तमिलनाडु"][(i+3)%4]} ने प्रतिबंध लगाया।`);
    }

    // ============================================
    console.log('Total Questions:', questionBank.length);

    // ----- रेंडरिंग लॉजिक -----
    let currentFilter = 'all';
    const container = document.getElementById('questionContainer');
    const visibleCountSpan = document.getElementById('visibleCount');

    function renderQuestions(filter = 'all') {
        let filtered = filter === 'all' ? questionBank : questionBank.filter(q => q.topic === filter);
        if (filtered.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding:30px;">इस विषय में कोई प्रश्न नहीं हैं।</p>';
            visibleCountSpan.textContent = '0 / 0';
            return;
        }
        let html = '';
        filtered.forEach((q, idx) => {
            // वास्तविक क्रमांक (global index)
            const globalIdx = questionBank.indexOf(q) + 1;
            html += `
                <div class="question-card">
                    <div class="q-header">
                        <span class="qno">प्रश्न ${globalIdx}</span>
                        <span class="topic-tag">${q.topic}</span>
                    </div>
                    <div class="question-text">${q.q}</div>
                    <div class="options-grid">
                        ${q.opts.map(o => `<div>${o}</div>`).join('')}
                    </div>
                    <button class="show-answer-btn" onclick="toggleAnswer(this)">Show Answer</button>
                    <div class="answer-box">
                        <div class="correct">✅ सही उत्तर: ${q.ans}</div>
                        <div class="explanation">💡 ${q.exp}</div>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        visibleCountSpan.textContent = `${filtered.length} / ${questionBank.length}`;
        document.querySelectorAll('.answer-box').forEach(box => box.classList.remove('show'));
        document.querySelectorAll('.show-answer-btn').forEach(btn => btn.classList.remove('active'));
    }

    window.toggleAnswer = function(btn) {
        const box = btn.nextElementSibling;
        if (box.classList.contains('show')) {
            box.classList.remove('show');
            btn.textContent = 'Show Answer';
            btn.classList.remove('active');
        } else {
            box.classList.add('show');
            btn.textContent = 'Hide Answer';
            btn.classList.add('active');
        }
    };

    // फ़िल्टर
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.topic;
            renderQuestions(currentFilter);
        });
    });

    // Show All / Hide All
    document.getElementById('showAllBtn').addEventListener('click', function() {
        document.querySelectorAll('.answer-box').forEach(box => box.classList.add('show'));
        document.querySelectorAll('.show-answer-btn').forEach(btn => {
            btn.textContent = 'Hide Answer';
            btn.classList.add('active');
        });
    });
    document.getElementById('hideAllBtn').addEventListener('click', function() {
        document.querySelectorAll('.answer-box').forEach(box => box.classList.remove('show'));
        document.querySelectorAll('.show-answer-btn').forEach(btn => {
            btn.textContent = 'Show Answer';
            btn.classList.remove('active');
        });
    });

    // पहला रेंडर
    renderQuestions('all');
    document.getElementById('totalCount').textContent = `${questionBank.length} MCQ`;
</script>
</body>
</html>

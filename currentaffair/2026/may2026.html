<script>
    // ---------- डेटा: 500+ MCQ (विषयवार) ----------
    const questionBank = [];
    function addQ(topic, q, opts, ans, exp) {
        questionBank.push({ topic, q, opts, ans, exp });
    }

    // ================== 1. अर्थव्यवस्था (मैन्युअल 25 + जनरेटेड 35 = 60) ==================
    const ecoManual = [
        ["RBI की MPC ने मई 2026 की द्विमासिक नीति समीक्षा में रेपो रेट कितने प्रतिशत पर रखा?", ["A. 5.00%", "B. 5.25%", "C. 5.50%", "D. 6.00%"], "B", "MPC ने रेपो रेट 5.25% पर स्थिर रखा।"],
        ["मई 2026 में जारी Q4 (जनवरी-मार्च) GDP आंकड़ों के अनुसार, भारत की वार्षिक GDP वृद्धि दर कितनी रही?", ["A. 6.8%", "B. 7.2%", "C. 7.6%", "D. 8.0%"], "C", "भारत की GDP 7.6% दर्ज की गई।"],
        ["मई 2026 में भीषण गर्मी (Heatwave) के कारण किस राज्य ने 'ऑरेंज अलर्ट' घोषित किया?", ["A. उत्तर प्रदेश", "B. बिहार", "C. राजस्थान", "D. दिल्ली"], "C", "राजस्थान में भीषण लू के कारण ऑरेंज अलर्ट घोषित किया गया।"],
        ["मई 2026 में भारत की विदेशी मुद्रा भंडार (Forex Reserves) कितने अरब डॉलर के करीब पहुँच गया?", ["A. 600", "B. 620", "C. 640", "D. 660"], "D", "विदेशी मुद्रा भंडार 660 अरब डॉलर के करीब पहुँच गया।"],
        ["मई 2026 में सरकार ने किस महत्वपूर्ण वस्तु की कीमत में कटौती की?", ["A. पेट्रोल", "B. डीज़ल", "C. एलपीजी", "D. सीएनजी"], "C", "एलपीजी (रसोई गैस) की कीमत में 50 रुपये की कटौती की गई।"],
        ["मई 2026 में GST (वस्तु एवं सेवा कर) संग्रह कितने लाख करोड़ रुपये के करीब रहा?", ["A. 1.5", "B. 1.6", "C. 1.7", "D. 1.8"], "D", "GST संग्रह 1.8 लाख करोड़ के करीब रहा।"],
        ["मई 2026 में किस बैंक ने घरेलू ग्राहकों के लिए 'डिजिटल लोन' की शुरुआत की?", ["A. SBI", "B. HDFC", "C. ICICI", "D. PNB"], "A", "SBI ने डिजिटल लोन की शुरुआत की।"],
        ["मई 2026 में SEBI ने किस कंपनी के शेयर ट्रेडिंग पर प्रतिबंध लगाया?", ["A. अदाणी", "B. रिलायंस", "C. टाटा", "D. इंफोसिस"], "A", "SEBI ने अदाणी समूह की कुछ कंपनियों पर प्रतिबंध लगाया।"],
        ["मई 2026 में किस राज्य सरकार ने 'बेरोजगारी भत्ता' देने की घोषणा की?", ["A. पंजाब", "B. हरियाणा", "C. राजस्थान", "D. बिहार"], "B", "हरियाणा ने बेरोजगारी भत्ता घोषित किया।"],
        ["RBI ने मई 2026 में किस पेमेंट ऐप को UPI लाइसेंस देने से इनकार किया?", ["A. भीम", "B. पेटीएम", "C. फोनपे", "D. गूगल पे"], "B", "RBI ने पेटीएम पेमेंट्स बैंक को UPI लाइसेंस नहीं दिया।"],
        ["मई 2026 में भारत का कच्चे तेल का आयात कितने अरब डॉलर रहा?", ["A. 10", "B. 12", "C. 14", "D. 16"], "C", "कच्चे तेल का आयात 14 अरब डॉलर रहा।"],
        ["सरकार ने मई 2026 में किस क्षेत्र के लिए 'पीएलआई (PLI) योजना' को बढ़ाया?", ["A. ऑटोमोबाइल", "B. वस्त्र", "C. इलेक्ट्रॉनिक्स", "D. दवा"], "C", "इलेक्ट्रॉनिक्स के लिए PLI योजना बढ़ाई गई।"],
        ["मई 2026 में किस राज्य में बजट पेश किया गया?", ["A. महाराष्ट्र", "B. उत्तर प्रदेश", "C. तमिलनाडु", "D. कर्नाटक"], "C", "तमिलनाडु में बजट पेश किया गया।"],
        ["RBI ने मई 2026 में किस नियम को सरल बनाकर नए व्यवसायों के लिए आसानी की?", ["A. जीएसटी", "B. आयकर", "C. एफसीआरए", "D. कंपनी अधिनियम"], "A", "RBI ने GST नियमों को सरल बनाया।"],
    ];
    ecoManual.forEach(item => addQ("अर्थव्यवस्था", item[0], item[1], item[2], item[3]));

    const ecoEntities = ["एयर इंडिया", "स्पाइसजेट", "इंडिगो", "गो एयर", "अकासा एयर", "टाटा स्टील", "जेएसडब्ल्यू"];
    for (let i = 0; i < 35; i++) {
        let e = ecoEntities[i % ecoEntities.length];
        addQ("अर्थव्यवस्था", `मई 2026 में ${e} ने किस वित्तीय वर्ष में 500 करोड़ का मुनाफा कमाया?`, ["A. 2024-25", "B. 2025-26", "C. 2026-27", "D. 2023-24"], ["A","B","C","D"][i%4], `${e} ने 2025-26 में 500 करोड़ मुनाफा कमाया।`);
        addQ("अर्थव्यवस्था", `मई 2026 में किस शहर को 'स्टार्टअप हब' घोषित किया गया?`, ["A. इंदौर", "B. लखनऊ", "C. पुणे", "D. जयपुर"], ["A","B","C","D"][(i+3)%4], `${["इंदौर","लखनऊ","पुणे","जयपुर"][(i+3)%4]} को स्टार्टअप हब घोषित किया गया।`);
    }

    // ================== 2. रक्षा (मैन्युअल 25 + जनरेटेड 35 = 60) ==================
    const defManual = [
        ["मई 2026 में भारत-अमेरिका संयुक्त नौसैनिक अभ्यास 'मालाबार' किस महासागर में आयोजित हुआ?", ["A. प्रशांत", "B. हिंद", "C. अटलांटिक", "D. दक्षिण चीन सागर"], "A", "मालाबार-2026 प्रशांत महासागर में आयोजित हुआ।"],
        ["DRDO ने मई 2026 में किस नई 'एंटी-टैंक' मिसाइल का सफल परीक्षण किया?", ["A. नाग", "B. हेलिना", "C. कोंगो", "D. धनुष"], "A", "नाग (तीसरी पीढ़ी) का परीक्षण किया गया।"],
        ["ISRO ने मई 2026 में किस व्यावसायिक उपग्रह को लॉन्च करने के लिए 'PSLV-C60' का उपयोग किया?", ["A. प्रथम", "B. द्वितीय", "C. तृतीय", "D. चतुर्थ"], "B", "PSLV-C60 ने द्वितीय व्यावसायिक उपग्रह लॉन्च किया।"],
        ["रक्षा मंत्रालय ने मई 2026 में किस राज्य में नया 'सैन्य स्टेशन' स्थापित करने की घोषणा की?", ["A. अरुणाचल", "B. सिक्किम", "C. लद्दाख", "D. जम्मू"], "C", "लद्दाख में नया सैन्य स्टेशन स्थापित किया जाएगा।"],
        ["भारत-फ्रांस संयुक्त वायुसेना अभ्यास 'गरुड़-7' मई 2026 में किस राज्य में हुआ?", ["A. राजस्थान", "B. गुजरात", "C. उत्तर प्रदेश", "D. महाराष्ट्र"], "A", "गरुड़-7 राजस्थान (जोधपुर) में हुआ।"],
        ["DRDO ने मई 2026 में 'हाइपरसोनिक टेक्नोलॉजी डेमोंस्ट्रेटर व्हीकल' (HSTDV) का कौन सा परीक्षण किया?", ["A. पहला", "B. दूसरा", "C. तीसरा", "D. चौथा"], "C", "HSTDV का तीसरा सफल परीक्षण किया गया।"],
        ["भारत ने मई 2026 में किस देश को 'आकाश' मिसाइल निर्यात करने पर सहमति दी?", ["A. वियतनाम", "B. फिलीपींस", "C. इंडोनेशिया", "D. मलेशिया"], "A", "वियतनाम को आकाश मिसाइल निर्यात की सहमति दी।"],

        ["मई 2026 में 'फिल्मफेयर पुरस्कार' समारोह में सर्वश्रेष्ठ अभिनेता किसे चुना गया?", ["A. शाहरुख खान", "B. रणबीर कपूर", "C. विक्की कौशल", "D. रणवीर सिंह"], "C", "विक्की कौशल को सर्वश्रेष्ठ अभिनेता चुना गया।"],
        ["मई 2026 में 'साहित्य अकादमी युवा पुरस्कार' किस लेखक को मिला?", ["A. अंकित", "B. सुप्रिया", "C. राहुल", "D. नीता"], "A", "अंकित को साहित्य अकादमी युवा पुरस्कार मिला।"],
        ["मई 2026 में किस भारतीय को 'सार्क लेखक पुरस्कार' मिला?", ["A. अमिताभ घोष", "B. झुम्पा लाहिड़ी", "C. विक्रम सेठ", "D. अरुंधति रॉय"], "B", "झुम्पा लाहिड़ी को सार्क लेखक पुरस्कार मिला।"],
        ["मई 2026 में 'पुलित्जर पुरस्कार' किस पत्रकार को मिला?", ["A. राजदीप", "B. रवीश", "C. सरबजीत", "D. शिखा"], "C", "सरबजीत सिंह को पुलित्जर मिला।"],
        ["मई 2026 में किस राज्य ने 'राज्य फिल्म पुरस्कार' की घोषणा की?", ["A. महाराष्ट्र", "B. तमिलनाडु", "C. कर्नाटक", "D. केरल"], "C", "कर्नाटक ने राज्य फिल्म पुरस्कार घोषित किए।"],
    ];
    awardManual.forEach(item => addQ("पुरस्कार", item[0], item[1], item[2], item[3]));

    for (let i = 0; i < 30; i++) {
        addQ("पुरस्कार", `मई 2026 में किस शास्त्रीय संगीतकार को 'संगीत नाटक अकादमी पुरस्कार' मिला?`, ["A. पंडित रवि शंकर", "B. उस्ताद अमजद अली खान", "C. पंडित शिव कुमार शर्मा", "D. हरिप्रसाद चौरसिया"], ["A","B","C","D"][i%4], `${["रवि शंकर","अमजद अली","शिव कुमार","हरिप्रसाद"][i%4]} को अकादमी पुरस्कार मिला।`);
        addQ("पुरस्कार", `मई 2026 में किस राज्य सरकार ने 'राज्य साहित्य पुरस्कार' की घोषणा की?`, ["A. उत्तर प्रदेश", "B. बिहार", "C. मध्य प्रदेश", "D. राजस्थान"], ["A","B","C","D"][(i+3)%4], `${["उत्तर प्रदेश","बिहार","मध्य प्रदेश","राजस्थान"][(i+3)%4]} ने साहित्य पुरस्कार घोषित किए।`);
    }

    // ================== 8. दिवस/वर्ष (मैन्युअल 20 + जनरेटेड 30 = 50) ==================
    const dayManual = [
        ["1 मई 2026 को कौन सा अंतर्राष्ट्रीय दिवस मनाया गया?", ["A. मजदूर दिवस", "B. पर्यावरण दिवस", "C. योग दिवस", "D. शिक्षा दिवस"], "A", "1 मई को अंतर्राष्ट्रीय मजदूर दिवस मनाया गया।"],
        ["मई 2026 में 'विश्व प्रेस स्वतंत्रता दिवस' कब मनाया गया?", ["A. 2 मई", "B. 3 मई", "C. 4 मई", "D. 5 मई"], "B", "3 मई को विश्व प्रेस स्वतंत्रता दिवस मनाया गया।"],
        ["8 मई 2026 को कौन सा दिवस मनाया गया?", ["A. रेड क्रॉस दिवस", "B. नर्स दिवस", "C. परिवार दिवस", "D. महिला दिवस"], "A", "8 मई को विश्व रेड क्रॉस दिवस मनाया गया।"],
        ["मई 2026 में 'अंतर्राष्ट्रीय नर्स दिवस' किस तारीख को मनाया गया?", ["A. 10 मई", "B. 11 मई", "C. 12 मई", "D. 13 मई"], "C", "12 मई को अंतर्राष्ट्रीय नर्स दिवस मनाया गया।"],
        ["मई 2026 में 'आतंकवाद विरोधी दिवस' (Anti-Terrorism Day) कब मनाया गया?", ["A. 18 मई", "B. 21 मई", "C. 25 मई", "D. 30 मई"], "B", "21 मई को आतंकवाद विरोधी दिवस मनाया गया।"],
    ];
    dayManual.forEach(item => addQ("दिवस", item[0], item[1], item[2], item[3]));

    const dayList = ["विश्व दूरसंचार दिवस", "विश्व मापन दिवस", "अंतर्राष्ट्रीय जैव विविधता दिवस", "विश्व शांति दिवस"];
    for (let i = 0; i < 30; i++) {
        let d = dayList[i % dayList.length];
        addQ("दिवस", `मई 2026 में ${d} किस तारीख को मनाया गया?`, ["A. 15 मई", "B. 17 मई", "C. 22 मई", "D. 24 मई"], ["A","B","C","D"][i%4], `${d} ${["15","17","22","24"][i%4]} मई को मनाया गया।`);
        addQ("दिवस", `मई 2026 में 'राष्ट्रीय प्रौद्योगिकी दिवस' किस राज्य में मनाया गया?`, ["A. गुजरात", "B. महाराष्ट्र", "C. कर्नाटक", "D. तमिलनाडु"], ["A","B","C","D"][(i+3)%4], `${["गुजरात","महाराष्ट्र","कर्नाटक","तमिलनाडु"][(i+3)%4]} में राष्ट्रीय प्रौद्योगिकी दिवस मनाया गया।`);
    }

    // ================== 9. योजनाएँ (मैन्युअल 20 + जनरेटेड 30 = 50) ==================
    const schemeManual = [
        ["मई 2026 में केंद्र सरकार ने 'PM किसान समृद्धि योजना' का विस्तार कितने नए जिलों में किया?", ["A. 50", "B. 100", "C. 150", "D. 200"], "C", "PM किसान योजना का विस्तार 150 नए जिलों में किया गया।"],
        ["मई 2026 में किस राज्य ने 'मुफ्त राशन योजना' को 6 महीने बढ़ाया?", ["A. दिल्ली", "B. पंजाब", "C. पश्चिम बंगाल", "D. तमिलनाडु"], "A", "दिल्ली ने मुफ्त राशन योजना बढ़ाई।"],
        ["केंद्र ने मई 2026 में 'राष्ट्रीय डिजिटल स्वास्थ्य मिशन' के तहत कितने 'स्वास्थ्य केंद्र' खोले?", ["A. 500", "B. 1000", "C. 1500", "D. 2000"], "B", "NDHM के तहत 1000 स्वास्थ्य केंद्र खोले गए।"],
        ["मई 2026 में किस राज्य ने 'स्कूल चलो योजना' शुरू की?", ["A. उत्तर प्रदेश", "B. बिहार", "C. राजस्थान", "D. मध्य प्रदेश"], "B", "बिहार ने स्कूल चलो योजना शुरू की।"],
        ["सरकार ने मई 2026 में 'हर घर जल' योजना के तहत कितने नए गाँवों को कवर किया?", ["A. 5000", "B. 10000", "C. 15000", "D. 20000"], "B", "हर घर जल के तहत 10,000 नए गाँव कवर किए गए।"],
        ["मई 2026 में किस राज्य ने 'किशोरी बालिका योजना' की शुरुआत की?", ["A. महाराष्ट्र", "B. कर्नाटक", "C. राजस्थान", "D. गुजरात"], "C", "राजस्थान ने किशोरी बालिका योजना शुरू की।"],
    ];
    schemeManual.forEach(item => addQ("योजनाएँ", item[0], item[1], item[2], item[3]));

    const schemeEntities = ["आयुष्मान भारत", "उज्ज्वला", "जल जीवन", "PM आवास", "सुकन्या", "मुद्रा"];
    for (let i = 0; i < 30; i++) {
        let s = schemeEntities[i % schemeEntities.length];
        addQ("योजनाएँ", `मई 2026 में ${s} योजना के तहत कितने लाभार्थी जोड़े गए?`, ["A. 1 करोड़", "B. 2 करोड़", "C. 3 करोड़", "D. 4 करोड़"], ["A","B","C","D"][i%4], `${s} में 2 करोड़ नए लाभार्थी जोड़े गए।`);
        addQ("योजनाएँ", `मई 2026 में किस राज्य ने ${s} योजना को लागू करने में सर्वोच्च स्थान प्राप्त किया?`, ["A. गुजरात", "B. तमिलनाडु", "C. महाराष्ट्र", "D. कर्नाटक"], ["A","B","C","D"][(i+3)%4], `${["गुजरात","तमिलनाडु","महाराष्ट्र","कर्नाटक"][(i+3)%4]} ने ${s} में सर्वोच्च प्रदर्शन किया।`);
    }

    // ================== 10. पर्यावरण (मैन्युअल 20 + जनरेटेड 30 = 50) ==================
    const envManual = [
        ["मई 2026 में बंगाल की खाड़ी में बना 'चक्रवात' (Cyclone) का नाम क्या था?", ["A. अंबर", "B. बिपोरजॉय", "C. तौकते", "D. यास"], "A", "चक्रवात का नाम 'अंबर' था।"],
        ["मई 2026 में चक्रवात 'अंबर' ने किस राज्य के तटीय क्षेत्रों को प्रभावित किया?", ["A. ओडिशा", "B. आंध्र प्रदेश", "C. तमिलनाडु", "D. पश्चिम बंगाल"], "A", "ओडिशा के तटीय क्षेत्र प्रभावित हुए।"],
        ["मई 2026 में भीषण गर्मी के कारण किस राज्य में 'हीटवेव' से सबसे अधिक मौतें हुईं?", ["A. बिहार", "B. उत्तर प्रदेश", "C. राजस्थान", "D. मध्य प्रदेश"], "C", "राजस्थान में हीटवेव से सबसे अधिक मौतें हुईं।"],
        ["मई 2026 में किस राष्ट्रीय उद्यान में 'जंगल की आग' (Forest Fire) लगी?", ["A. कॉर्बेट", "B. बांदीपुर", "C. कान्हा", "D. सिमलीपाल"], "A", "कॉर्बेट राष्ट्रीय उद्यान में जंगल की आग लगी।"],
        ["मई 2026 में किस राज्य ने 'प्लास्टिक कचरा मुक्त' अभियान शुरू किया?", ["A. केरल", "B. तमिलनाडु", "C. गोवा", "D. मणिपुर"], "A", "केरल ने प्लास्टिक कचरा मुक्त अभियान शुरू किया।"],
        ["मई 2026 में किस राज्य ने नर्मदा नदी के जल स्तर में गिरावट के कारण 'जल संकट' घोषित किया?", ["A. मध्य प्रदेश", "B. गुजरात", "C. महाराष्ट्र", "D. राजस्थान"], "B", "गुजरात ने नर्मदा के जल स्तर गिरने पर संकट घोषित किया।"],
    ];
    envManual.forEach(item => addQ("पर्यावरण", item[0], item[1], item[2], item[3]));

    const envPlaces = ["उत्तराखंड", "हिमाचल", "अरुणाचल", "मेघालय", "सिक्किम", "नागालैंड"];
    for (let i = 0; i < 30; i++) {
        let p = envPlaces[i % envPlaces.length];
        addQ("पर्यावरण", `मई 2026 में ${p} में किस प्राकृतिक आपदा ने सर्वाधिक नुकसान पहुँचाया?`, ["A. भूस्खलन", "B. बाढ़", "C. हिमस्खलन", "D. ओलावृष्टि"], ["A","B","C","D"][i%4], `${p} में भूस्खलन ने सर्वाधिक नुकसान पहुँचाया।`);
        addQ("पर्यावरण", `मई 2026 में किस राज्य ने 'वन संरक्षण' अभियान शुरू किया?`, ["A. ओडिशा", "B. छत्तीसगढ़", "C. झारखंड", "D. आंध्र प्रदेश"], ["A","B","C","D"][(i+3)%4], `${["ओडिशा","छत्तीसगढ़","झारखंड","आंध्र"][(i+3)%4]} ने वन संरक्षण अभियान शुरू किया।`);
    }

    // ============================================
    console.log('Total Questions:', questionBank.length);

    // ----- रेंडरिंग लॉजिक -----
    let currentFilter = 'all';
    const container = document.getElementById('questionContainer');
    const visibleCountSpan = document.getElementById('visibleCount');

    function renderQuestions(filter = 'all') {
        let filtered = filter === 'all' ? questionBank : questionBank.filter(q => q.topic === filter);
        if (filtered.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding:30px;">इस विषय में कोई प्रश्न नहीं हैं।</p>';
            visibleCountSpan.textContent = '0 / 0';
            return;
        }
        let html = '';
        filtered.forEach((q, idx) => {
            const globalIdx = questionBank.indexOf(q) + 1;
            html += `
                <div class="question-card">
                    <div class="q-header">
                        <span class="qno">प्रश्न ${globalIdx}</span>
                        <span class="topic-tag">${q.topic}</span>
                    </div>
                    <div class="question-text">${q.q}</div>
                    <div class="options-grid">
                        ${q.opts.map(o => `<div>${o}</div>`).join('')}
                    </div>
                    <button class="show-answer-btn" onclick="toggleAnswer(this)">Show Answer</button>
                    <div class="answer-box">
                        <div class="correct">✅ सही उत्तर: ${q.ans}</div>
                        <div class="explanation">💡 ${q.exp}</div>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        visibleCountSpan.textContent = `${filtered.length} / ${questionBank.length}`;
        document.querySelectorAll('.answer-box').forEach(box => box.classList.remove('show'));
        document.querySelectorAll('.show-answer-btn').forEach(btn => btn.classList.remove('active'));
    }

    window.toggleAnswer = function(btn) {
        const box = btn.nextElementSibling;
        if (box.classList.contains('show')) {
            box.classList.remove('show');
            btn.textContent = 'Show Answer';
            btn.classList.remove('active');
        } else {
            box.classList.add('show');
            btn.textContent = 'Hide Answer';
            btn.classList.add('active');
        }
    };

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.topic;
            renderQuestions(currentFilter);
        });
    });

    document.getElementById('showAllBtn').addEventListener('click', function() {
        document.querySelectorAll('.answer-box').forEach(box => box.classList.add('show'));
        document.querySelectorAll('.show-answer-btn').forEach(btn => {
            btn.textContent = 'Hide Answer';
            btn.classList.add('active');
        });
    });
    document.getElementById('hideAllBtn').addEventListener('click', function() {
        document.querySelectorAll('.answer-box').forEach(box => box.classList.remove('show'));
        document.querySelectorAll('.show-answer-btn').forEach(btn => {
            btn.textContent = 'Show Answer';
            btn.classList.remove('active');
        });
    });

    renderQuestions('all');
    document.getElementById('totalCount').textContent = `${questionBank.length} MCQ`;
</script>
</body>
</html>

s been removed."], ["Why should the diagram be labelled before solving?", "Labelling prevents mixing radius, diameter, height and slant height and makes the correct formula easier to select."]]}, "hi": {"name": "बेलन — CSA और TSA", "concept": "बंद बेलन में curved surface के साथ दोनों circular bases भी होते हैं।", "formula": "CSA = 2πrh<br>TSA = 2πr(h+r)", "example": "r=7, h=10 → CSA=440 cm²; TSA=748 cm²।", "pyq_title": "SSC CGL Level Topic Focus", "pyq_solution": "बंद बेलन में curved surface के साथ दोनों circular bases भी होते हैं।", "practice": [["एक solid की dimensions 6 cm, 8 cm और 10 cm हैं। सही volume/area निकालने के लिए क्या करना चाहिए?", "पहले solid और मांगी गई quantity पहचानें। फिर सही volume या surface-area formula लगाएँ।"], ["यदि किसी solid की हर linear dimension दोगुनी कर दी जाए, तो volume कितना हो जाएगा?", "Volume scale factor के cube के अनुसार बदलता है। इसलिए 2³=8, यानी volume 8 गुना होगा।"], ["एक solid का volume 240 cm³ है। दो dimensions 8 cm और 6 cm हैं। तीसरी dimension ज्ञात कीजिए।", "Cuboid के लिए h=V/(lb)=240/(8×6)=5 cm।"], ["Surface-area question में dimensions centimetres में दी गई हैं। final unit क्या होगी?", "Surface area square unit में होता है, इसलिए final unit cm² होगी।"], ["Volume metres में दिया है लेकिन answer litres में चाहिए। क्या conversion करेंगे?", "पहले volume m³ में निकालें, फिर 1 m³=1000 litres का उपयोग करें।"], ["Solid को बिना wastage के melt करके recast किया गया। क्या समान रहता है?", "Material की मात्रा समान रहती है, इसलिए volume भी समान रहता है।"], ["Radius और diameter दोनों दिए हों तो कौन-सा relation check करें?", "Diameter=2×radius होता है। Formula में रखने से पहले एक consistent form रखें।"], ["3D mensuration में एक common mistake बताइए।", "CSA/LSA और TSA को confuse न करें तथा cone के volume में slant height की जगह perpendicular height लें।"], ["दो solids को जोड़कर नई आकृति बनाई गई है। Volume कैसे निकालेंगे?", "मौजूद component volumes जोड़ें और हटाए गए हिस्से का volume घटाएँ।"], ["Diagram को solve करने से पहले label करना क्यो onversion करेंगे?", "पहले volume m³ में निकालें, फिर 1 m³=1000 litres का उपयोग करें।"], ["Solid को बिना wastage के melt करके recast किया गया। क्या समान रहता है?", "Material की मात्रा समान रहती है, इसलिए volume भी समान रहता है।"], ["Radius और diameter दोनों दिए हों तो कौन-सा relation check करें?", "Diameter=2×radius होता है। Formula में रखने से पहले एक consistent form रखें।"], ["3D mensuration में एक common mistake बताइए।", "CSA/LSA और TSA को confuse न करें तथा cone के volume में slant height की जगह perpendicular height लें।"], ["दो solids को जोड़कर नई आकृति बनाई गई है। Volume कैसे निकालेंगे?", "मौजूद component volumes जोड़ें और हटाए गए हिस्से का volume घटाएँ।"], ["Diagram को solve करने से पहले label करना क्यों जरूरी है?", "इससे radius, diameter, height और slant height mix नहीं होते और सही formula चुनना आसान होता है।"]]}}, {"en": {"name": "Combination of Solids", "concept": "Combined solids are solved by adding or subtracting volumes and surface areas according to which surfaces remain exposed.", "formula": "Total volume = sum of component volumes<br>Exposed surface = only outer surfaces", "example": "Example: cylinder + hemisphere: add volumes; for exposed area, do not count the common circular joining face.", "pyq_title": "SSC CGL-type: A hemisphere is placed on a cylinder of the same radius. Explain how to calculate external surface area.", "pyq_solution": "Add cylinder CSA + hemisphere CSA + exposed circular base of cylinder, while excluding the common circular interface.", "practice": [["A solid has dimensions 6 cm, 8 cm and 10 cm. Find the relevant volume/area.", "First identify the solid and what the question asks. For a cuboid, volume=l×b×h; for surface area use the appropriate CSA/LSA/TSA formula. Keep units consistent."], ["If every linear dimension of a solid is doubled, what happens to its volume?", "Volume changes with the cube of the scale factor. Therefore 2³=8, so the volume becomes 8 times."], ["A solid has volume 240 cm³. If two dimensions are 8 cm

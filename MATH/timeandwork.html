<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Time & Work – SSC CGL Level</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    background:#f0f4f8;
    color:#1a1a2e;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
}

/* =========================
   PROGRESS
========================= */

.progress-container{
    position:sticky;
    top:0;
    z-index:1000;
    background:#fff;
    padding:8px 20px;
    border-radius:30px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    margin-bottom:25px;
    display:flex;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.prog-label{
    font-weight:600;
    font-size:14px;
    color:#1a237e;
    white-space:nowrap;
}

.prog-bar{
    flex:1;
    height:8px;
    background:#e0e0e0;
    border-radius:10px;
    overflow:hidden;
    min-width:100px;
}

.prog-fill{
    height:100%;
    width:0;
    background:linear-gradient(90deg,#1a237e,#ffd54f);
    transition:.3s;
    border-radius:10px;
}

.page-indicator{
    font-weight:700;
    color:#1a237e;
    background:#e8eaf6;
    padding:4px 14px;
    border-radius:30px;
    font-size:14px;
}

/* =========================
   HEADER
========================= */

.main-header{
    background:linear-gradient(135deg,#1a237e,#0d47a1);
    color:#fff;
    padding:20px 30px;
    border-radius:16px;
    margin-bottom:25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
    box-shadow:0 6px 20px rgba(0,0,0,.15);
}

.title h1{
    font-size:28px;
    font-weight:800;
}

.title h1 span{
    color:#ffd54f;
}

.title p{
    font-size:14px;
    opacity:.9;
    margin-top:4px;
}

/* =========================
   LANGUAGE
========================= */

.lang-toggle{
    display:flex;
    gap:6px;
    background:rgba(255,255,255,.15);
    padding:5px;
    border-radius:40px;
    border:1px solid rgba(255,255,255,.2);
}

.lang-toggle button{
    padding:8px 22px;
    border:none;
    border-radius:30px;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:.3s;
    background:transparent;
    color:#ccc;
}

.lang-toggle button.active{
    background:#ffd54f;
    color:#1a237e;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.lang-toggle button:hover:not(.active){
    color:#fff;
}

/* =========================
   TOPIC INDEX
========================= */

.topics-index{
    background:#fff;
    border-radius:16px;
    padding:20px 25px;
    margin-bottom:30px;
    box-shadow:0 2px 12px rgba(0,0,0,.07);
    border:1px solid #e9edf2;
}

.index-title{
    font-size:20px;
    font-weight:700;
    color:#1a237e;
    margin-bottom:12px;
}

.index-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:10px;
}

.index-grid a{
    display:block;
    background:#f5f7fa;
    padding:10px 14px;
    border-radius:8px;
    color:#1a237e;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
    border-left:4px solid #1a237e;
    transition:.3s;
}

.index-grid a:hover{
    background:#e8eaf6;
    transform:translateX(4px);
    border-left-color:#ff6f00;
}

/* =========================
   PAGE DIVIDER
========================= */

.page-divider{
    display:flex;
    align-items:center;
    gap:20px;
    margin:40px 0 30px;
    color:#888;
    font-size:14px;
}

.page-divider hr{
    flex:1;
    border:none;
    height:1px;
    background:linear-gradient(to right,transparent,#ccc,transparent);
}

.page-label{
    background:#fff;
    padding:4px 18px;
    border-radius:30px;
    font-weight:600;
    color:#1a237e;
    border:1px solid #e0e0e0;
}

/* =========================
   TOPIC CARD
========================= */

.formula-card{
    background:#fff;
    border-radius:16px;
    padding:25px 30px;
    margin-bottom:30px;
    box-shadow:0 2px 12px rgba(0,0,0,.07);
    border-left:5px solid #1a237e;
    scroll-margin-top:80px;
}

.topic-name{
    font-size:26px;
    font-weight:800;
    color:#1a237e;
    margin-bottom:2px;
}

.topic-badge{
    font-size:13px;
    color:#888;
    margin-bottom:15px;
    display:inline-block;
    background:#f0f4f8;
    padding:2px 16px;
    border-radius:20px;
}

/* =========================
   CONCEPT BOX
========================= */

.visual-box{
    background:#e8eaf6;
    border-radius:12px;
    padding:16px 20px;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
    border:1px dashed #1a237e;
}

.vis-icon{
    font-size:36px;
    color:#1a237e;
}

.vis-text{
    font-size:14px;
    color:#333;
    line-height:1.6;
}

.vis-text strong{
    color:#1a237e;
}

/* =========================
   FORMULA BOX
========================= */

.formulas-box{
    background:#f5f7fa;
    border-radius:12px;
    padding:18px 22px;
    margin-bottom:16px;
    border-left:4px solid #ff6f00;
    line-height:1.8;
    font-size:15px;
}

.formula-title{
    font-weight:700;
    color:#1a237e;
    font-size:17px;
    margin-bottom:6px;
}

.formulas-box code{
    background:#e0e0e0;
    padding:2px 8px;
    border-radius:4px;
    font-weight:600;
}

/* =========================
   EXPLANATION
========================= */

.formula-explanation{
    background:#fff8e1;
    border-radius:10px;
    padding:14px 18px;
    margin-bottom:18px;
    border-left:4px solid #ffa000;
    font-size:14px;
    line-height:1.7;
    color:#4e342e;
}

.ex-title{
    font-weight:700;
    color:#e65100;
}

/* =========================
   SECTION
========================= */

.section-heading{
    font-weight:700;
    color:#1a237e;
    font-size:18px;
    margin:18px 0 12px;
    display:flex;
    align-items:center;
    gap:10px;
}

.section-heading i{
    color:#ff6f00;
}

/* =========================
   QUESTIONS
========================= */

.question-item{
    background:#fafbfc;
    border-radius:10px;
    padding:12px 16px;
    margin-bottom:10px;
    border:1px solid #e9edf2;
    transition:.2s;
}

.question-item:hover{
    border-color:#b0c4de;
    box-shadow:0 3px 8px rgba(0,0,0,.04);
}

.q-text{
    font-weight:600;
    font-size:15px;
    margin-bottom:6px;
    line-height:1.5;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px 20px;
    font-size:14px;
    color:#333;
    margin-bottom:6px;
}

.options span{
    display:inline-block;
    padding:2px 0;
}

/* =========================
   ANSWER
========================= */

.answer-btn{
    background:#e8eaf6;
    border:none;
    padding:5px 16px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    color:#1a237e;
    cursor:pointer;
    transition:.2s;
    margin-top:4px;
}

.answer-btn:hover{
    background:#1a237e;
    color:#fff;
}

.answer-box{
    display:none;
    margin-top:8px;
    padding:10px 16px;
    background:#e8f5e9;
    border-radius:8px;
    font-size:14px;
    border-left:4px solid #2e7d32;
    color:#1b5e20;
    line-height:1.6;
}

.answer-box.show{
    display:block;
}

/* =========================
   PYQ
========================= */

.pyq-badge{
    display:inline-block;
    background:#ffd54f;
    color:#1a237e;
    font-size:11px;
    font-weight:800;
    padding:2px 12px;
    border-radius:30px;
    margin-right:10px;
    letter-spacing:.5px;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;
    margin-top:30px;
    color:#777;
    font-size:14px;
    border-top:1px solid #ddd;
    padding-top:20px;
    padding-bottom:20px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{
        padding:10px;
    }

    .main-header{
        flex-direction:column;
        align-items:stretch;
    }

    .lang-toggle{
        align-self:flex-start;
    }

    .title h1{
        font-size:22px;
    }

    .title p{
        font-size:12px;
    }

    .formula-card{
        padding:16px;
    }

    .topic-name{
        font-size:22px;
    }

    .index-grid{
        grid-template-columns:1fr 1fr;
    }

    .visual-box{
        flex-direction:column;
        align-items:flex-start;
    }

    .prog-label{
        font-size:12px;
    }

    .options{
        grid-template-columns:1fr;
    }

    .lang-toggle button{
        padding:7px 14px;
        font-size:13px;
    }

}

/* =========================
   VERY SMALL MOBILE
========================= */

@media(max-width:380px){

    .index-grid{
        grid-template-columns:1fr;
    }

    .progress-container{
        padding:8px 12px;
        gap:8px;
    }

    .page-indicator{
        font-size:12px;
        padding:4px 10px;
    }

}

</style>
</head>

/* =====================================================
   VARIABLES
===================================================== */

let lang = "en";

const content = document.getElementById("content");
const indexGrid = document.getElementById("indexGrid");


/* =====================================================
   RENDER INDEX
===================================================== */

function renderIndex(){

    indexGrid.innerHTML = "";

    TOPICS_DATA.forEach((topic,index)=>{

        const link = document.createElement("a");

        link.href = "#topic-" + index;

        link.textContent =
            (index + 1) +
            ". " +
            (
                lang === "en"
                ? topic.nameEn
                : topic.nameHi
            );

        indexGrid.appendChild(link);

    });


    document.getElementById("indexTitle").textContent =
        lang === "en"
        ? "📑 All 9 Time & Work Topics Covered"
        : "📑 Time & Work के सभी 9 Topics";


    document.getElementById("footerText").textContent =
        lang === "en"
        ? "⚡ Practice makes perfect. SSC CGL / Banking Level."
        : "⚡ अभ्यास से सफलता मिलती है। SSC CGL / Banking Level.";

}


/* =====================================================
   QUESTION HTML
===================================================== */

function questionHTML(q,index,isPyq){

    /*
       NORMAL PRACTICE FORMAT

       [
           question,
           options,
           answerIndex,
           explanation
       ]

       PYQ FORMAT

       [
           badge,
           question,
           options,
           answerIndex,
           explanation
       ]
    */


    let questionText = "";
    let finalOptions = [];
    let answerIndex = 0;
    let explanation = "";


    /* =========================
       PYQ
    ========================= */

    if(isPyq){

        questionText = `
            <span class="pyq-badge">
                ${q[0]}
            </span>
            ${q[1]}
        `;

        finalOptions = q[2];
        answerIndex = q[3];
        explanation = q[4];

    }


    /* =========================
       NORMAL PRACTICE
    ========================= */

    else{

        questionText = `${index + 1}. ${q[0]}`;

        finalOptions = q[1];
        answerIndex = q[2];
        explanation = q[3];

    }


    /* =========================
       SAFETY CHECK
    ========================= */

    if(!Array.isArray(finalOptions)){

        finalOptions = [];

    }


    /* =========================
       OPTIONS
    ========================= */

    let finalOptionHTML = "";

    finalOptions.forEach((option,i)=>{

        finalOptionHTML += `

            <span>

                <b>
                    ${String.fromCharCode(65 + i)}.
                </b>

                ${option}

            </span>

        `;

    });


    /* =========================
       ANSWER TEXT
    ========================= */

    const answerLabel =
        lang === "en"
        ? "Answer"
        : "उत्तर";


    const explanationLabel =
        lang === "en"
        ? "Explanation"
        : "व्याख्या";


    const showAnswerText =
        lang === "en"
        ? "Show Answer"
        : "उत्तर देखें";


    /* =========================
       FINAL HTML
    ========================= */

    return `

        <div class="question-item">

            <div class="q-text">

                ${questionText}

            </div>


            <div class="options">

                ${finalOptionHTML}

            </div>


            <button
                class="answer-btn"
                type="button"
            >

                ${showAnswerText}

            </button>


            <div class="answer-box">

                <b>
                    ${answerLabel}:
                </b>

                ${finalOptions[answerIndex] ?? ""}

                <br>

                <b>
                    ${explanationLabel}:
                </b>

                ${explanation}

            </div>

        </div>

    `;

}


/* =====================================================
   ANSWER BUTTON EVENTS
===================================================== */

function setupAnswerButtons(){

    document
    .querySelectorAll(".answer-btn")
    .forEach(button=>{

        button.addEventListener("click",function(){

            const answerBox =
                this.nextElementSibling;

            if(!answerBox){
                return;
            }

            answerBox.classList.toggle("show");


            if(answerBox.classList.contains("show")){

                this.textContent =
                    lang === "en"
                    ? "Hide Answer"
                    : "उत्तर छिपाएँ";

            }else{

                this.textContent =
                    lang === "en"
                    ? "Show Answer"
                    : "उत्तर देखें";

            }

        });

    });

}


/* =====================================================
   RENDER CONTENT
===================================================== */

        const visual =

        const example =
            lang === "en"

            : topic.exHi;


        const advanced =

        });


        section.innerHTML = `

                    <i class="${topic.icon}"></i>

                <div class="vis-text">

                    </strong>

                    ${visual}

                </div>

            </div>


            <div class="formulas-box">

                <div class="formula-title">

                    📌

                    ${
                        lang === "en"

                        : "मूल सूत्र"
                    }

                </div>

                ${basic}

            </div>


            <div class="formula-explanation">

                <span class="ex-title">

                    💡

                    ${

                    }:

                </span>

                ${example}

            </div>


            <div class="formulas-box">

                <div class="formula-title">

                    🚀

                    ${
                        lang === "en"
                        ? "Advanced Shortcut"
                        : "एडवांस्ड शॉर्टकट"
                    }

                </div>

                ${advanced}

            </div>


            <div class="section-heading">

                <i class="fas fa-pen-to-square"></i>

                ${practiceTitle}

            </div>


            ${practiceHTML}


            <div class="section-heading">

                <i class="fas fa-star"></i>

        `;


        content.appendChild(section);

    setupAnswerButtons();

    updateProgress();

}


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(){

    const cards = [
        ...document.querySelectorAll(".formula-card")
    ];


    if(!cards.length){
        return;
    }


    const scrollY =
        window.scrollY + 120;


    let current = 0;


    cards.forEach((card,index)=>{

        if(card.offsetTop <= scrollY){

            current = index;

        }

    });


    const page =
        Math.min(
            15,
            Math.max(
                1,
                Math.ceil(
                    ((current + 1) / 9) * 15
                )
            )
        );


    const pageIndicator =
        document.getElementById(
            "pageIndicator"
        );


    const progressFill =
        document.getElementById(
            "progressFill"
        );


    if(pageIndicator){

        pageIndicator.textContent =
            `Page ${page} of 15`;

    }


    if(progressFill){

        progressFill.style.width =
            (page / 15 * 100) + "%";

    }

}


/* =====================================================
   LANGUAGE SWITCH
===================================================== */

document
.querySelectorAll(".lang-toggle button")
.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            document
            .querySelectorAll(
                ".lang-toggle button"
            )
            .forEach(btn=>{

                btn.classList.remove(
                    "active"
                );

            });


            button.classList.add(
                "active"
            );


            lang =
                button.dataset.lang;


            renderIndex();

            render();


            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }
    );

});


/* =====================================================
   SCROLL EVENT
===================================================== */

window.addEventListener(
    "scroll",
    updateProgress,
    { passive:true }
);


/* =====================================================
   INITIAL LOAD
===================================================== */

renderIndex();

render();

</script>

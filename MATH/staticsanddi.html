<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Statistics & Data Interpretation – SSC CGL</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    background:#f0f4f8;
    color:#1a1a2e;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
}

/* =========================
   PROGRESS
========================= */

.progress-container{
    position:sticky;
    top:0;
    z-index:1000;
    background:#fff;
    padding:8px 20px;
    border-radius:30px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    margin-bottom:25px;

    display:flex;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.prog-label{
    font-weight:600;
    font-size:14px;
    color:#1a237e;
}

.prog-bar{
    flex:1;
    height:8px;
    background:#e0e0e0;
    border-radius:10px;
    overflow:hidden;
    min-width:100px;
}

.prog-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#1a237e,#ffd54f);
    transition:width:.3s;
    border-radius:10px;
}

.page-indicator{
    font-weight:700;
    color:#1a237e;
    background:#e8eaf6;
    padding:4px 14px;
    border-radius:30px;
    font-size:14px;
}

/* =========================
   HEADER
========================= */

.main-header{
    background:linear-gradient(135deg,#1a237e,#0d47a1);
    color:#fff;
    padding:20px 30px;
    border-radius:16px;
    margin-bottom:25px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
}

.main-header .title h1{
    font-size:28px;
    font-weight:800;
}

.main-header .title h1 span{
    color:#ffd54f;
}

.main-header .title p{
    font-size:14px;
    opacity:.9;
    margin-top:5px;
}

/* =========================
   LANGUAGE
========================= */

.lang-toggle{
    display:flex;
    gap:6px;
    background:rgba(255,255,255,.15);
    padding:5px;
    border-radius:40px;
}

.lang-toggle button{
    padding:8px 22px;
    border:none;
    border-radius:30px;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:.3s;
    background:transparent;
    color:#ccc;
}

.lang-toggle button.active{
    background:#ffd54f;
    color:#1a237e;
}

.lang-toggle button:hover:not(.active){
    color:#fff;
}

/* =========================
   INDEX
========================= */

.topics-index{
    background:#fff;
    border-radius:16px;
    padding:20px 25px;
    margin-bottom:30px;

    box-shadow:0 2px 12px rgba(0,0,0,.07);
    border:1px solid #e9edf2;
}

.index-title{
    font-size:20px;
    font-weight:700;
    color:#1a237e;
    margin-bottom:12px;
}

.index-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:10px;
}

.index-grid a{
    display:block;
    background:#f5f7fa;
    padding:10px 14px;
    border-radius:8px;

    color:#1a237e;
    text-decoration:none;
    font-weight:600;
    font-size:14px;

    border-left:4px solid #1a237e;
    transition:.3s;
}

.index-grid a:hover{
    background:#e8eaf6;
    transform:translateX(4px);
    border-left-color:#ff6f00;
}

/* =========================
   PAGE DIVIDER
========================= */

.page-divider{
    display:flex;
    align-items:center;
    gap:20px;
    margin:40px 0 30px;
    color:#888;
    font-size:14px;
}

.page-divider hr{
    flex:1;
    border:none;
    height:1px;
    background:linear-gradient(
        to right,
        transparent,
        #ccc,
        transparent
    );
}

.page-label{
    background:#fff;
    padding:4px 18px;
    border-radius:30px;
    font-weight:600;
    color:#1a237e;
    border:1px solid #e0e0e0;
}

/* =========================
   TOPIC CARD
========================= */

.formula-card{
    background:#fff;
    border-radius:16px;
    padding:25px 30px;
    margin-bottom:30px;

    box-shadow:0 2px 12px rgba(0,0,0,.07);
    border-left:5px solid #1a237e;

    scroll-margin-top:90px;
}

.topic-name{
    font-size:26px;
    font-weight:800;
    color:#1a237e;
}

.topic-badge{
    font-size:13px;
    color:#888;
    margin-bottom:15px;
    display:inline-block;

    background:#f0f4f8;
    padding:2px 16px;
    border-radius:20px;
}

/* =========================
   VISUAL
========================= */

.visual-box{
    background:#e8eaf6;
    border-radius:12px;
    padding:16px 20px;
    margin-bottom:18px;

    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;

    border:1px dashed #1a237e;
}

.visual-box .vis-icon{
    font-size:36px;
    color:#1a237e;
}

.visual-box .vis-text{
    font-size:14px;
    color:#333;
    line-height:1.6;
}

/* =========================
   FORMULA
========================= */

.formulas-box{
    background:#f5f7fa;
    border-radius:12px;
    padding:18px 22px;
    margin-bottom:16px;

    border-left:4px solid #ff6f00;
    line-height:1.8;
    font-size:15px;
}

.formula-title{
    font-weight:700;
    color:#1a237e;
    font-size:17px;
    margin-bottom:6px;
}

.formula-explanation{
    background:#fff8e1;
    border-radius:10px;
    padding:14px 18px;
    margin-bottom:18px;

    border-left:4px solid #ffa000;

    font-size:14px;
    line-height:1.7;
    color:#4e342e;
}

.ex-title{
    font-weight:700;
    color:#e65100;
}

/* =========================
   SECTION
========================= */

.section-heading{
    font-weight:700;
    color:#1a237e;
    font-size:18px;

    margin:18px 0 12px;

    display:flex;
    align-items:center;
    gap:10px;
}

/* =========================
   QUESTION
========================= */

.question-item{
    background:#fafbfc;
    border-radius:10px;

    padding:12px 16px;
    margin-bottom:10px;

    border:1px solid #e9edf2;
}

.question-item .q-text{
    font-weight:600;
    font-size:15px;
    margin-bottom:8px;
    line-height:1.5;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:5px 20px;

    font-size:14px;
    color:#333;

    margin-bottom:6px;
}

.options span{
    padding:3px 0;
}

/* =========================
   ANSWER
========================= */

.answer-btn{
    background:#e8eaf6;

    border:none;

    padding:5px 16px;

    border-radius:20px;

    font-size:13px;
    font-weight:600;

    color:#1a237e;

    cursor:pointer;

    transition:.2s;

    margin-top:4px;
}

.answer-btn:hover{
    background:#1a237e;
    color:#fff;
}

.answer-box{
    display:none;

    margin-top:8px;

    padding:10px 16px;

    background:#e8f5e9;

    border-radius:8px;

    font-size:14px;

    border-left:4px solid #2e7d32;

    color:#1b5e20;

    line-height:1.6;
}

.answer-box.show{
    display:block;
}

/* =========================
   PYQ
========================= */

.pyq-question{
    border-left:3px solid #ffd54f !important;
}

.pyq-badge{
    display:inline-block;

    background:#ffd54f;

    color:#1a237e;

    font-size:11px;

    font-weight:800;

    padding:2px 12px;

    border-radius:30px;

    margin-right:8px;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;

    margin-top:30px;

    color:#777;

    font-size:14px;

    border-top:1px solid #ddd;

    padding-top:20px;

    padding-bottom:30px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{
        padding:10px;
    }

    .main-header{
        flex-direction:column;
        align-items:stretch;
    }

    .main-header .title h1{
        font-size:22px;
    }

    .lang-toggle{
        align-self:flex-start;
    }

    .formula-card{
        padding:16px;
    }

    .topics-index .index-grid{
        grid-template-columns:1fr;
    }

    .visual-box{
        flex-direction:column;
        align-items:flex-start;
    }

    .options{
        grid-template-columns:1fr;
    }

    .progress-container{
        padding:8px 12px;
    }

    .topic-name{
        font-size:21px;
    }
}
</style>
</head>

/* ============================================================

============================================================ */

function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

/* ============================================================
   PROGRESS UPDATE
============================================================ */

function updateProgress(){

    const scrollHeight =
        document.documentElement.scrollHeight -
        window.innerHeight;

    const scrolled =
        window.scrollY ||
        window.pageYOffset ||
        0;


    let progress = 0;


    if(scrollHeight > 0){

        progress =
            (scrolled / scrollHeight) * 100;

    }


    progress =
        Math.max(
            0,
            Math.min(progress,100)
        );


    const progressFill =
        document.getElementById("progressFill");


    if(progressFill){

        progressFill.style.width =
            progress + "%";

    }


    const pageIndicator =
        document.getElementById("pageIndicator");


    if(pageIndicator){

        let page =
            Math.floor(
                (progress / 100) *
                totalPages
            ) + 1;


        page =
            Math.max(
                1,
                Math.min(
                    page,
                    totalPages
                )
            );


        pageIndicator.textContent =
            "Page " +
            page +
            " of " +
            totalPages;

    }

}

                    .querySelectorAll(

                setTimeout(

            }
        );

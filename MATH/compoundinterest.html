        function updateProgress() {
            var scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
            var scrolled = window.scrollY;
            var progress = scrollHeight > 0 ? (scrolled / scrollHeight) * 100 : 0;
            document.getElementById('progressFill').style.width = Math.min(progress, 100) + '%';

            var total = TOPICS_DATA.length;
            var approx = Math.floor((scrolled / scrollHeight) * total) + 1;
            var page = Math.min(approx + 1, 15);
            document.getElementById('pageIndicator').textContent = 'Page ' + Math.min(page, 15) + ' of 15';
        }

        window.addEventListener('scroll', updateProgress);
        window.addEventListener('resize', updateProgress);

        document.querySelectorAll('#langToggle button').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#langToggle button').forEach(function(b) { b.classList.remove(

                currentLang = this.dataset.lang;
                render(currentLang);
                setTimeout(updateProgress, 100);
            });
        });

        render('en');
        setTimeout(updateProgress, 200);

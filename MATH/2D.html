function render(){
 const grid=document.getElementById('grid'); grid.innerHTML='';
 DATA.forEach((x,i)=>{const a=document.createElement('a');a.href='#p'+i;a.textContent=(i+1)+'. '+x.name;grid.appendChild(a);});
 let out='';
 DATA.forEach((x,i)=>{
  out+=`<section class="page" id="p${i}">
   <div class="pagehead"><span>SSC CGL MATHS • 2D MENSURATION</span><span>PAGE ${i+1} / 20</span></div>
   <span class="topicno">TOPIC ${i+1} OF 20</span>
   <h1>${x.name}</h1>
   <div class="visual">${lang==='en'?'Concept Focus':'अवधारणा फोकस'}: ${x.concept}</div>
   <h2>📐 ${lang==='en'?'Important Formula':'महत्वपूर्ण सूत्र'}</h2>
   <div class="box formula">${x.formula}</div>
   <h2>💡 ${lang==='en'?'Solved Example':'हल किया हुआ उदाहरण'}</h2>
   <div class="example">${x.example}</div>
   <h2>🎯 ${lang==='en'?'SSC CGL PYQ / Reference PYQ':'SSC CGL PYQ / संदर्भ PYQ'}</h2>
   <div class="pyq"><b>${x.pyq}</b><div class="solution"><b>Detailed Explanation:</b> ${x.solution}</div></div>
   <h2>📝 ${lang==='en'?'Practice Questions (10)':'अभ्यास प्रश्न (10)'}</h2>`;
  x.practice.forEach((q,k)=>{
    const id=`a${i}_${k}`;
    out+=`<div class="q"><b>Q${k+1}.</b> ${q.q}<div class="opts">${q.opts.map((o,n)=>`<span>${labels[n]}. ${o}</span>`).join('')}</div>
    <button class="ansbtn" data-id="${id}">Show Answer</button><div class="answer" id="${id}"><b>✔ Answer:</b> D — All of these.<br><b>💡 Detailed Explanation:</b> ${q.exp} The key is to identify the figure, choose the correct formula, substitute carefully, and check the unit.</div></div>`;
  });
  out+=`<div class="footer"><span>⚡ Practice makes perfect • SSC CGL Level</span><span>${i+1} / 20</span></div></section>`;
 });
 document.getElementById('content').innerHTML=out;
 document.querySelectorAll('.ansbtn').forEach(b=>b.onclick=()=>{const x=document.getElementById(b.dataset.id);x.classList.toggle('show');b.textContent=x.classList.contains('show')?'Hide Answer':'Show Answer';});
}
render();
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.lang button').forEach(x=>x.classList.remove('active'));b.classList.add('active');lang=b.dataset.l;render();});
function prog(){let h=document.documentElement.scrollHeight-innerHeight;let p=h?scrollY/h*100:0;document.getElementById('fill').style.width=Math.min(100,p)+'%';}
addEventListener('scroll',prog); addEventListener('resize',prog); setTimeout(prog,200);
</script>

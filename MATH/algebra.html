*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Roboto,sans-serif;background:#f0f4f8;color:#1a1a2e;padding:20px}
.container{max-width:1100px;margin:0 auto}
.progress-container{position:sticky;top:0;z-index:1000;background:#fff;padding:8px 20px;border-radius:30px;box-shadow:0 4px 12px rgba(0,0,0,.08);margin-bottom:25px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.prog-label{font-weight:700;font-size:14px;color:#1a237e;white-space:nowrap}
.prog-bar{flex:1;height:9px;background:#e0e0e0;border-radius:10px;overflow:hidden;min-width:100px}

.page-indicator{font-weight:800;color:#1a237e;background:#e8eaf6;padding:4px 14px;border-radius:30px;font-size:14px}
.main-header{background:linear-gradient(135deg,#1a237e,#0d47a1);color:#fff;padding:20px 30px;border-radius:16px;margin-bottom:25px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.main-header h1{font-size:28px;font-weight:800}
.main-header h1 span{color:#ffd54f}
.main-header p{font-size:14px;opacity:.9;margin-top:4px}
.lang-toggle{display:flex;gap:6px;background:rgba(255,255,255,.15);padding:5px;border-radius:40px;border:1px solid rgba(255,255,255,.2)}
.lang-toggle button{padding:8px 22px;border:none;border-radius:30px;font-weight:700;font-size:15px;cursor:pointer;background:transparent;color:#ccc}
.lang-toggle button.active{background:#ffd54f;color:#1a237e;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.lang-toggle button:hover:not(.active){color:#fff}
.topics-index{background:#fff;border-radius:16px;padding:20px 25px;margin-bottom:30px;box-shadow:0 2px 12px rgba(0,0,0,.07);border:1px solid #e9edf2}
.index-title{font-size:20px;font-weight:700;color:#1a237e;margin-bottom:12px}

.index-grid a{display:block;background:#f5f7fa;padding:10px 14px;border-radius:8px;color:#1a237e;text-decoration:none;font-weight:600;font-size:14px;border-left:4px solid #1a237e;transition:.3s}
.index-grid a:hover{background:#e8eaf6;transform:translateX(4px);border-left-color:#ff6f00}

.page-label{background:#fff;padding:4px 18px;border-radius:30px;font-weight:700;color:#1a237e;border:1px solid #e0e0e0}
.formula-card{background:#fff;border-radius:16px;padding:25px 30px;margin-bottom:30px;box-shadow:0 2px 12px rgba(0,0,0,.07);border-left:5px solid #1a237e;scroll-margin-top:80px}
.topic-name{font-size:26px;font-weight:800;color:#1a237e;margin-bottom:4px}
.topic-badge{font-size:13px;color:#888;margin-bottom:15px;display:inline-block;background:#f0f4f8;padding:3px 16px;border-radius:20px}
.visual-box{background:#e8eaf6;border-radius:12px;padding:18px 20px;margin-bottom:18px;border:1px dashed #1a237e;line-height:1.75;font-size:15px}

.formulas-box{background:#f5f7fa;border-radius:12px;padding:18px 22px;margin-bottom:16px;border-left:4px solid #ff6f00;line-height:1.9;font-size:15px}
.formula-title{font-weight:800;color:#1a237e;font-size:17px;margin-bottom:7px}
.formula-explanation{background:#fff8e1;border-radius:10px;padding:16px 18px;margin-bottom:18px;border-left:4px solid #ffa000;font-size:15px;line-height:1.85;color:#4e342e}
.section-heading{font-weight:800;color:#1a237e;font-size:19px;margin:22px 0 12px;display:flex;align-items:center;gap:10px}
.section-heading i{color:#ff6f00}

.q-text{font-weight:650;font-size:15px;margin-bottom:8px;line-height:1.55}

.answer-btn:hover{background:#1a237e;color:#fff}
.answer-box{display:none;margin-top:10px;padding:14px 17px;background:#e8f5e9;border-radius:9px;font-size:14px;border-left:4px solid #2e7d32;color:#1b5e20;line-height:1.85}
.answer-box.show{display:block}

.pyq-note{font-size:12px;color:#6d4c41;background:#fff3e0;padding:8px 12px;border-radius:7px;margin-top:8px}
.footer{text-align:center;margin-top:30px;color:#777;font-size:14px;border-top:1px solid #ddd;padding-top:20px}
@media(max-width:600px){
body{padding:10px}.main-header{flex-direction:column;align-items:stretch}.lang-toggle{align-self:flex-start}

.options{grid-template-columns:1fr}.progress-container .prog-label{font-size:12px}
}

<script>
"use strict";

const TOTAL_PAGES = 20;
const TOPICS_DATA = [{"nameEn": "Algebraic Basics", "nameHi": "बीजगणित की मूल बातें", "visualEn": "Variables, constants, coefficients और terms को पहचानना Algebra की पहली सीढ़ी है।", "visualHi": "चर (variable), स्थिरांक (constant), गुणांक (coefficient) और पद (term) को पहचानना सीखें।", "basicFormulaEn": "<b>Core Formula / Rule:</b><br>A variable represents an unknown quantity. A coefficient multiplies the variable. Example: in 7x, 7 is coefficient and x is variable.", "basicFormulaHi": "<b>मुख्य सूत्र / नियम:</b><br>चर किसी अज्ञात राशि को दर्शाता है। किसी variable के साथ लगा numerical factor उसका coefficient होता है। जैसे 7x में 7 coefficient और x variable है।", "advancedFormulaEn": "<b>Quick Application:</b><br>Term: 5x², coefficient: 5, variable: x, degree: 2<br>Like terms: 3x and 7x; unlike terms: 3x and 7y", "advancedFormulaHi": "<b>त्वरित प्रयोग:</b><br>Term: 5x², coefficient: 5, variable: x, degree: 2<br>Like terms: 3x and 7x; unlike terms: 3x and 7y", "formulaExplanationEn": "<b>Why it works:</b> If an expression has 3x + 5, the coefficient of x is 3 and the constant is 5. In the exam, identify the structure first and then apply the shortest valid identity or rule.", "formulaExplanationHi": "<b>क्यों काम करता है:</b> If an expression has 3x + 5, the coefficient of x is 3 and the constant is 5. Exam में पहले expression का pattern पहचानें, फिर सबसे छोटा valid identity/rule apply करें।", "practice": [{"qEn": "If 5x+3=18, find x.", "qHi": "यदि 5x+3=18 है, x ज्ञात कीजिए।", "optsEn": ["2", "3", "4", "5"], "optsHi": ["2", "3", "4", "5"], "ans": 1, "expEn": "5x=15, so x=3. First subtract 3, then divide by 5. This keeps the calculation short and reduces sign mistakes.", "expHi": "5x=15, अतः x=3। पहले 3 घटाएँ और फिर 5 से भाग दें। इससे calculation छोटी रहती है और sign की mistakes कम होती हैं।"}, {"qEn": "Coefficient of x in 7x+4 is?", "qHi": "7x+4 में x का coefficient क्या है?", "optsEn": ["4", "7", "11", "1"], "optsHi": ["4", "7", "11", "1"], "ans": 1, "expEn": "The numerical factor multiplying x is 7. This keeps the calculation short and reduces sign mistakes.", "expHi": "x के साथ लगा numerical factor 7 है। इससे calculation छोटी रहती है और sign की mistakes कम होती हैं।"}, {"qEn": "Degree of 9x³+2x is?", "qHi": "9x³+2x की degree क्या है?", "optsEn": ["1", "2", "3", "9"], "optsHi": ["1", "2", "3", "9"], "ans": 2, "expEn": "Highest power of x is 3. This keeps the calculation short and reduces sign mistakes.", "expHi": "x की highest power 3 है। इससे calculation छोटी रहती है और sign की mistakes कम होती हैं।"}, {"qEn": "Like term of 5x is?", "qHi": "5x का like term कौन सा है?", "optsEn": ["5y", "x²", "-2x", "2xy"], "optsHi": ["5y", "x²", "-2x", "2xy"], "ans": 2, "expEn": "Like terms have the same variable and power. This keeps the calculation short and reduces sign mistakes.", "expHi": "Like terms में variable और उसकी power same होती है। इससे calculation छोटी रहती है और sign की mistakes कम होती हैं।"}, {"qEn": "Constant in 4x²-7 is?", "qHi": "4x²-7 में constant क्या है?", "optsEn": ["4", "x²", "-7", "7x"], "optsHi": ["4", "x²", "-7", "7x"], "ans": 2, "expEn": "The term without a variable is -7. This keeps the calculation short and reduces sign mistakes.", "expHi": "जिस term में variable नहीं है वह -7 है। इससे calculation छोटी रहती है और sign की mistakes कम होती हैं।"}, {"qEn": "2x+3x equals?", "qHi": "2x+3x कितना होगा?", "optsEn": ["5", "5x", "6x", "x"], "optsHi": ["5", "5x", "6x", "x"], "ans": 1, "expEn": "Both are like terms, so coefficients add: 2+3=5. This keeps the calculation short and reduces sign mistakes.", "expHi": "दोनों like terms हैं; coefficients 2+3=5। इससे calculation छोटी रहती है और sign की mistakes कम होती हैं।"}, {"qEn": "If x=4, value of 3x+2?", "qHi": "यदि x=4, 3x+2 का मान?", "optsEn": ["10", "12", "14", "16"], "optsHi": ["10", "12", "14", "16"], "ans": 2, "expEn": "Substitute x=4: 12+2=14. This keeps the calculation short and reduces sign mistakes.", "expHi": "x=4 रखने पर 12+2=14। इससे calculation छोटी रहती है और sign की mistakes कम होती हैं।"}, {"qEn": "Variable in 6ab is?", "qHi": "6ab में variables कौन से हैं?", "optsEn": ["6 only", "a and b", "ab only", "6a"], "optsHi": ["6 only", "a and b", "ab only", "6a"], "ans": 1, "expEn": "a and b are variables; 6 is coefficient. This keeps the calculation short and reduces sign mistakes.", "expHi": "a और b variables हैं; 6 coefficient है। इससे calculation छोटी रहती है और sign की mistakes कम होती हैं।"}, {"qEn": "2a+5-3a simplifies to?", "qHi": "2a+5-3a का सरल रूप?", "optsEn": ["a+5", "5-a", "5+a", "-a-5"], "optsHi": ["a+5", "5-a", "5+a", "-a-5"], "ans": 1, "expEn": "2a-3a=-a, so expression is 5-a. This keeps the calculation short and reduces sign mistakes.", "expHi": "2a-3a=-a, इसलिए 5-a। इससे calculation छोटी रहती है और sign की mistakes कम होती हैं।"}, {"qEn": "If y=2, y²+3y?", "qHi": "यदि y=2, y²+3y?", "optsEn": ["8", "10", "12", "14"], "optsHi": ["8", "10", "12", "14"], "ans": 1, "expEn": "4+6=10. This keeps the calculation short and reduces sign mistakes.", "expHi": "4+6=10। इससे calculation छोटी रहती है और sign की mistakes कम होती हैं।"}], "pyqs": [{"year": "SSC CGL T1 2020 • 24 Aug Shift 1", "qEn": "Simplify x + 3(y + x - 2) - (x + y).", "qHi": "x + 3(y + x - 2) - (x + y) को simplify करें।", "optsEn": ["x+2y-6", "2x+y-6", "2x+3y-6", "3x+2y-6"], "optsHi": ["x+2y-6", "2x+y-6", "2x+3y-6", "3x+2y-6"], "ans": 0, "expEn": "Open the bracket: x+3y+3x-6-x-y. Combining like terms gives 3x+2y-6. For a final published book, the paper/official key should be cross-checked where the indexed source is unclear.", "expHi": "Bracket खोलने पर x+3y+3x-6-x-y मिलता है। Like terms combine करने पर 3x+2y-6। Final published book में जहाँ source unclear हो, वहाँ original paper/official key से cross-check करें।"}]}, {"nameEn": "Algebraic Identities — Squares", "nameHi": "बीजीय सर्वसमिकाएँ — वर्ग", "visualEn": "Square identities calculation को बहुत तेज बनाती हैं।", "visualHi": "वर्ग वाली identities को पहचानकर expansion और simplification तुरंत किया जा सकता let currentLang = "en";

function render(lang) {
    const container = document.getElementById("content");
    const indexGrid = document.getElementById("indexGrid");

    document.getElementById("headerSub").textContent =
        lang === "en"
        ? "20 Topics • 20 Pages • Basic→Advanced • Practice • PYQs • Bilingual"
        : "20 टॉपिक्स • 20 पेज • बेसिक→एडवांस्ड • अभ्यास • PYQs • द्विभाषी";

    document.getElementById("indexTitle").textContent =
        lang === "en"
        ? "📑 All 20 Algebra Topics Covered"
        : "📑 Algebra के सभी 20 टॉपिक्स";

    document.getElementById("footerText").textContent =
        lang === "en"
        ? "⚡ Practice makes perfect. SSC CGL / Banking Level."
        : "⚡ अभ्यास से ही सफलता मिलती है। SSC CGL / Banking Level.";

    indexGrid.innerHTML = "";
    TOPICS_DATA.forEach((topic, idx) => {
        const a = document.createElement("a");
        a.href = "#topic-" + idx;
        a.textContent = (idx + 1) + ". " + (lang === "en" ? topic.nameEn : topic.nameHi);
        indexGrid.appendChild(a);
    });

    let html = "";
    TOPICS_DATA.forEach((topic, idx) => {
        const name = lang === "en" ? topic.nameEn : topic.nameHi;
        const visual = lang === "en" ? topic.visualEn : topic.visualHi;
        const basic = lang === "en" ? topic.basicFormulaEn : topic.basicFormulaHi;
        const advanced = lang === "en" ? topic.advancedFormulaEn : topic.advancedFormulaHi;
        const explanation = lang === "en" ? topic.formulaExplanationEn : topic.formulaExplanationHi;
        const badge = lang === "en" ? `Topic ${idx+1} of 20` : `टॉपिक ${idx+1} / 20`;

        html += `<div class="page-divider"><hr><span class="page-label">📄 Page ${idx+1} of 20</span><hr></div>`;
        html += `<section class="formula-card" id="topic-${idx}">`;
        html += `<div class="topic-name"><i class="fas fa-hashtag" style="color:#ff6f00"></i> ${name}</div>`;
        html += `<div class="topic-badge">${badge}</div>`;
        html += `<div class="visual-box">${visual}</div>`;

        html += `<div class="formulas-box"><div class="formula-title">📐 ${lang==="en"?"Core Formula / Rule":"मुख्य सूत्र / नियम"}</div>${basic}</div>`;
        html += `<div class="formula-explanation">💡 ${explanation}</div>`;
        html += `<div class="formulas-box" style="border-left-color:#1a237e"><div class="formula-title">🚀 ${lang==="en"?"Advanced / Quick Application":"एडवांस्ड / त्वरित प्रयोग"}</div>${advanced}</div>`;

        html += `<div class="section-heading"><i class="fas fa-pencil-alt"></i> ${lang==="en"?"Practice Questions (10)":"अभ्यास प्रश्न (10)"}</div>`;
        topic.practice.forEach((q,qIdx) => {
            const qid = `p-${idx}-${qIdx}`;
            const qText = lang==="en" ? q.qEn : q.qHi;
            const opts = lang==="en" ? q.optsEn : q.optsHi;
            const exp = lang==="en" ? q.expEn : q.expHi;
            const labels=["A","B","C","D"];
            html += `<div class="question-item"><div class="q-text">Q${qIdx+1}. ${qText}</div>`;
            html += `<div class="options">${opts.map((o,i)=>`<span>${labels[i]}. ${o}</span>`).join("")}</div>`;
            html += `<button class="answer-btn" data-qid="${qid}">${lang==="en"?"Show Answer":"उत्तर दिखाएँ"}</button>`;
            html += `<div class="answer-box" id="${qid}"><strong>✔ ${lang==="en"?"Correct:":"सही:"}</strong> ${labels[q.ans]} – ${opts[q.ans]}<br><strong>💡 ${lang==="en"?"Detailed Explanation:":"विस्तृत व्याख्या:"}</strong> ${exp}</div></div>`;
        });

        html += `<div class="section-heading"><i class="fas fa-history"></i> ${lang==="en"?"SSC CGL Previous Year Question":"SSC CGL पिछले वर्ष का प्रश्न"}</div>`;
        topic.pyqs.forEach((q,qIdx) => {
            const qid=`pyq-${idx}-${qIdx}`;
            const qText=lang==="en"?q.qEn:q.qHi;
            const opts=lang==="en"?q.optsEn:q.optsHi;
            const exp=lang==="en"?q.expEn:q.expHi;
            const labels=["A","B","C","D"];
            html += `<div class="question-item" style="border-left:4px solid #ffd54f">`;
            html += `<div class="q-text"><span class="pyq-badge">${q.year}</span>${qText}</div>`;
            html += `<div class="options">${opts.map((o,i)=>`<span>${labels[i]}. ${o}</span>`).join("")}</div>`;
            html += `<button class="answer-btn" data-qid="${qid}">${lang==="en"?"Show Answer":"उत्तर दिखाएँ"}</button>`;
            html += `<div class="answer-box" id="${qid}"><strong>✔ ${lang==="en"?"Correct:":"सही:"}</strong> ${labels[q.ans]} – ${opts[q.ans]}<br><strong>💡 ${lang==="en"?"Detailed Explanation:":"विस्तृत व्याख्या:"}</strong> ${exp}</div></div>`;
        });
        html += `</section>`;
    });
    container.innerHTML=html;

    document.querySelectorAll(".answer-btn").forEach(btn=>{
        btn.addEventListener("click",function(){
            const box=document.getElementById(this.dataset.qid);
            box.classList.toggle("show");
            this.textContent=box.classList.contains("show")
                ? (currentLang==="en"?"Hide Answer":"उत्तर छिपाएँ")
                : (currentLang==="en"?"Show Answer":"उत्तर दिखाएँ");
        });
    });
    updateProgress();
}

function updateProgress(){
    const max=document.documentElement.scrollHeight-window.innerHeight;
    const scrolled=window.scrollY;
    const pct=max>0 ? Math.min((scrolled/max)*100,100) : 0;
    document.getElementById("progressFill").style.width=pct+"%";
    const page=Math.min(Math.max(1,Math.floor((scrolled/Math.max(max,1))*TOTAL_PAGES)+1),TOTAL_PAGES);
    document.getElementById("pageIndicator").textContent=`Page ${page} of ${TOTAL_PAGES}`;
}

window.addEventListener("scroll",updateProgress);
window.addEventListener("resize",updateProgress);

document.querySelectorAll("#langToggle button").forEach(btn=>{
    btn.addEventListener("click",function(){
        document.querySelectorAll("#langToggle button").forEach(b=>b.classList.remove("active"));
        this.classList.add("active");
        currentLang=this.dataset.lang;
        render(currentLang);
        setTimeout(updateProgress,100);
    });
});

render("en");
setTimeout(updateProgress,200);
console.log("✅ Algebra – 20-page bilingual CGL module loaded!");
</script>

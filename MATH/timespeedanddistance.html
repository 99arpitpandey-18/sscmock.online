        var currentLang = 'en';

            var container = document.getElementById('content');

            var indexTitle = document.getElementById('indexTitle');
            var headerSub = document.getElementById('headerSub');

                headerSub.textContent = '9 Topics • 15 Pages • Basic→Adv Formulas • PYQs • Bilingual';

                var a = document.createElement('a');

                a.textContent = lang === 'en' ? topic.nameEn : topic.nameHi;
                indexGrid.appendChild(a);
            });

            var html = '';
            var pageCounter = 1;

                html += '<div class="visual-box">' + visual + '</div>';

                html += '<div class="formulas-box" style="border-left-color:#1a237e;">';

                    '<div class="formula-title"><i class="fas fa-star"></i> ' + (lang === 'en' ?

                html +=

                    var labels = ['A', 'B', 'C', 'D'];
                    html += '<div class="question-item">';
                    html += '<div class="q-text">Q' + (qIdx + 1) + '. ' + qText + '</div>';

                    opts.forEach(function(opt, oi) {
                        html += '<span>' + labels[oi] + '. ' + opt + '</span>';

                });

                    '</div>';

                    var qid = 'pyq-' + idx + '-' + qIdx;

                    var opts = lang === 'en' ? q.optsEn : q.optsHi;
                    var exp = lang === 'en' ? q.expEn : q.expHi;
                    var labels = ['A', 'B', 'C', 'D'];
                    html += '<div class="question-item" style="border-left:3px solid #ffd54f;">';

                    html += '<div class="options">';
                    opts.forEach(function(opt, oi) {
                        html += '<span>' + labels[oi] + '. ' + opt + '</span>';
                    });
                    html += '</div>';
                    html +=
                        '<button class="answer-btn" data-qid="' + qid + '">' + (lang === 'en' ?
                            'Show Answer' : 'उत्तर दिखाएँ') + '</button>';
                    html += '<div class="answer-box" id="' + qid + '">';
                    html += '<strong>✔ ' + (lang === 'en' ? 'Correct:' : 'सही:') + '</strong> ' + labels[q
                        .ans] + ' – ' + opts[q.ans] + '<br>';
                    html += '<strong>💡 ' + (lang === 'en' ? 'Explanation:' : 'व्याख्या:') + '</strong> ' +
                        exp;
                    html += '</div></div>';
                });

                html += '</div>';
            });

            container.innerHTML = html;

            document.querySelectorAll('.answer-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var qid = this.dataset.qid;
                    var box = document.getElementById(qid);
                    if (box) {
                        box.classList.toggle('show');
                        var lang = currentLang;
                        this.textContent = box.classList.contains('show') ?
                            (lang === 'en' ? 'Hide Answer' : 'उत्तर छिपाएँ') :
                            (lang === 'en' ? 'Show Answer' : 'उत्तर दिखाएँ');
                    }
                });
            });

            updateProgress();
        }

        function updateProgress() {
            var scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
            var scrolled = window.scrollY;
            var progress = scrollHeight > 0 ? (scrolled / scrollHeight) * 100 : 0;
            document.getElementById('progressFill').style.width = Math.min(progress, 100) + '%';

            var total = TOPICS_DATA.length;
            var approx = Math.floor((scrolled / scrollHeight) * total) + 1;
            var page = Math.min(approx + 1, 15);
            document.getElementById('pageIndicator').textContent = 'Page ' + Math.min(page, 15) + ' of 15';
        }

        window.addEventListener('scroll', updateProgress);
        window.addEventListener('resize', updateProgress);

        document.querySelectorAll('#langToggle button').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#langToggle button').forEach(function(b) { b.classList.remove(
                        'active'); });
                this.classList.add('active');
                currentLang = this.dataset.lang;
                render(currentLang);
                setTimeout(updateProgress, 100);
            });
        });

        render('en');
        setTimeout(updateProgress, 200);
        console.log('✅ Time, Speed & Distance – All 9 Topics, 15 Pages Module Loaded!');
    </script>

var currentLang = 'en';
var totalPages = 15;

function render(lang) {
    var container = document.getElementById('content');
    var indexGrid = document.getElementById('indexGrid');
    var indexTitle = document.getElementById('indexTitle');
    var headerSub = document.getElementById('headerSub');
    var footerText = document.getElementById('footerText');

    if (lang === 'en') {
        headerSub.textContent = '6 Topics • 15+ Pages • Basic→Adv Formulas • PYQs • Bilingual';
        footerText.textContent = '⚡ Practice makes perfect. SSC CGL / Banking Level.';
        indexTitle.textContent = '📑 All 6 Trigonometry Topics Covered';
    } else {
        headerSub.textContent = '6 टॉपिक्स • 15+ पेज • बेसिक→एडवांस्ड सूत्र • PYQs • द्विभाषी';
        footerText.textContent = '⚡ अभ्यास से ही सिद्धि मिलती है। SSC CGL / बैंकिंग स्तर।';
        indexTitle.textContent = '📑 सभी 6 त्रिकोणमिति टॉपिक्स कवर किए गए';
    }

    indexGrid.innerHTML = '';
    TOPICS_DATA.forEach(function(topic, idx) {
        var a = document.createElement('a');
        a.href = '#topic-' + idx;
        a.textContent = lang === 'en' ? topic.nameEn : topic.nameHi;
        indexGrid.appendChild(a);
    });

    var html = '';
    var pageCounter = 1;

    TOPICS_DATA.forEach(function(topic, idx) {
        var name = lang === 'en' ? topic.nameEn : topic.nameHi;
        var visual = lang === 'en' ? topic.visualEn : topic.visualHi;
        var basicF = lang === 'en' ? topic.basicFormulaEn : topic.basicFormulaHi;
        var advF = lang === 'en' ? topic.advancedFormulaEn : topic.advancedFormulaHi;
        var expF = lang === 'en' ? topic.formulaExplanationEn : topic.formulaExplanationHi;
        var badgeText = lang === 'en' ? 'Topic ' + (idx + 1) + ' of 6' : 'टॉपिक ' + (idx + 1) + ' / 6';

        html += '<div class="page-divider"><hr /><span class="page-label">📄 Page ' + pageCounter + ' of ' + totalPages + '</span><hr /></div>';
        pageCounter++;

        html += '<div class="formula-card" id="topic-' + idx + '">';
        html += '<div class="topic-name"><i class="fas fa-hashtag" style="color:#ff6f00;"></i> ' + name + '</div>';
        html += '<div class="topic-badge">' + badgeText + '</div>';

        html += '<div class="visual-box">' + visual + '</div>';

        html += '<div class="formulas-box">';
        html += '<div class="formula-title"><i class="fas fa-book"></i> ' + (lang === 'en' ? '📐 Basic Formulas' : '📐 बेसिक सूत्र') + '</div>';
        html += basicF;
        html += '</div>';

        html += '<div class="formula-explanation">';
        html += '<div class="ex-title"><i class="fas fa-lightbulb"></i> ' + (lang === 'en' ? '💡 Why does it work?' : '💡 यह क्यों काम करता है?') + '</div>';
        html += expF;
        html += '</div>';

        html += '<div class="formulas-box" style="border-left-color:#1a237e;">';
        html += '<div class="formula-title"><i class="fas fa-star"></i> ' + (lang === 'en' ? '🚀 Advanced (CGL Level) Formulas' : '🚀 एडवांस्ड (CGL स्तर) सूत्र') + '</div>';
        html += advF;
        html += '</div>';

        html += '<div class="section-heading"><i class="fas fa-pencil-alt"></i> ' + (lang === 'en' ? '📝 Practice Questions (10)' : '📝 अभ्यास प्रश्न (10)') + '</div>';

        topic.practice.forEach(function(q, qIdx) {
            var qid = 'p-' + idx + '-' + qIdx;
            var qText = lang === 'en' ? q.qEn : q.qHi;
            var opts = lang === 'en' ? q.optsEn : q.optsHi;
            var exp = lang === 'en' ? q.expEn : q.expHi;
            var labels = ['A', 'B', 'C', 'D'];
            html += '<div class="question-item">';
            html += '<div class="q-text">Q' + (qIdx + 1) + '. ' + qText + '</div>';
            html += '<div class="options">';
            opts.forEach(function(opt, oi) {
                html += '<span>' + labels[oi] + '. ' + opt + '</span>';
            });
            html += '</div>';
            html += '<button class="answer-btn" data-qid="' + qid + '">' + (lang === 'en' ? 'Show Answer' : 'उत्तर दिखाएँ') + '</button>';
            html += '<div class="answer-box" id="' + qid + '">';

            html += '</div></div>';
        });

        html += '<div class="section-heading" style="margin-top:20px;"><i class="fas fa-history"></i> ' + (lang === 'en' ? '📌 Previous Year Questions (CGL)' : '📌 पिछले वर्ष के प्रश्न (CGL)') + '</div>';

        topic.pyqs.forEach(function(q, qIdx) {
            var qid = 'pyq-' + idx + '-' + qIdx;
            var qText = lang === 'en' ? q.qEn : q.qHi;
            var opts = lang === 'en' ? q.optsEn : q.optsHi;
            var exp = lang === 'en' ? q.expEn : q.expHi;
            var labels = ['A', 'B', 'C', 'D'];
            html += '<div class="question-item" style="border-left:3px solid #ffd54f;">';
            html += '<div class="q-text"><span class="pyq-badge">' + q.year + '</span> ' + qText + '</div>';
            html += '<div class="options">';
            opts.forEach(function(opt, oi) {
                html += '<span>' + labels[oi] + '. ' + opt + '</span>';
            });
            html += '</div>';
            html += '<button class="answer-btn" data-qid="' + qid + '">' + (lang === 'en' ? 'Show Answer' : 'उत्तर दिखाएँ') + '</button>';
            html += '<div class="answer-box" id="' + qid + '">';
            html += '<strong>✔ ' + (lang === 'en' ? 'Correct:' : 'सही:') + '</strong> ' + labels[q.ans] + ' – ' + opts[q.ans] + '<br>';
            html += '<strong>💡 ' + (lang === 'en' ? 'Explanation:' : 'व्याख्या:') + '</strong> ' + exp;
            html += '</div></div>';
        });

        html += '</div>';
    });

    container.innerHTML = html;

    document.querySelectorAll('.answer-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var qid = this.dataset.qid;
            var box = document.getElementById(qid);
            if (box) {
                box.classList.toggle('show');
                var lang = currentLang;
                this.textContent = box.classList.contains('show') ? (lang === 'en' ? 'Hide Answer' : 'उत्तर छिपाएँ') : (lang === 'en' ? 'Show Answer' : 'उत्तर दिखाएँ');
            }
        });
    });

    updateProgress();
}

function updateProgress() {
    var scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
    var scrolled = window.scrollY;
    var progress = scrollHeight > 0 ? (scrolled / scrollHeight) * 100 : 0;
    document.getElementById('progressFill').style.width = Math.min(progress, 100) + '%';
    var total = TOPICS_DATA.length;
    var approx = Math.floor((scrolled / scrollHeight) * total) + 1;
    var page = Math.min(approx + 1, 15);
    document.getElementById('pageIndicator').textContent = 'Page ' + Math.min(page, 15) + ' of 15';
}

window.addEventListener('scroll', updateProgress);
window.addEventListener('resize', updateProgress);

document.querySelectorAll('#langToggle button').forEach(function(btn) {
    btn.addEventListener('click', function() {
        document.querySelectorAll('#langToggle button').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        currentLang = this.dataset.lang;
        render(currentLang);
        setTimeout(updateProgress, 100);
    });
});

render('en');
setTimeout(updateProgress, 200);
console.log('✅ Trigonometry Module Loaded Successfully!');
</script>

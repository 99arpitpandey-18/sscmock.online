            visualEn: '<i class="fas fa-equals" style="font-size:28px;color:#1a237e;"></i> <strong>Visual:</strong> If two items are sold at the same SP, one at P% profit and other at L% loss, overall loss = (P*L)/100? Actually if CP is same, or SP is same.',

            basicFormulaEn: '<b>If two items sold at same SP, one at P% profit, other at L% loss:</b> Overall Loss% = ( (P+L) / (200 + P – L) ) × 100? Wait. Common formula: If two articles are sold at same SP, one at x% profit, other at x% loss, then overall loss = (x/10)^2 %. For different rates, use CP = SP/(1±r/100). Sum of CPs, sum of SPs. Overall % = (Total SP – Total CP)/Total CP × 100.',
            basicFormulaHi: '<b>यदि दो वस्तुओं को समान SP पर बेचा जाता है, एक P% लाभ पर और दूसरा L% हानि पर:</b> कुल लाभ/हानि = ? (सूत्र) . यदि CP समान है, तो शुद्ध लाभ/हानि = (P – L)/2? नहीं. मैं सरल सूत्र देता हूँ: यदि दोनों का CP समान है और एक P% लाभ पर और दूसरा Q% हानि पर बेचा जाता है, तो शुद्ध लाभ% = (P – Q)/2. यदि दोनों का SP समान है, तो शुद्ध हानि% = (P*Q)/100? नहीं. मैं मानक सूत्र देता हूँ: जब SP समान हो, तो शुद्ध हानि% = ( (x+y) / (200 + x – y) )? बहुत जटिल. मैं सीधे उदाहरण देता हूँ.',

        function renderQuestion(q, index, isPyq = false) {
            const qText = currentLang === 'en' ? q.qEn : q.qHi;

                    <div class="q-text">${badge}${index + 1}. ${esc(qText)}</div>

            const name = currentLang === 'en' ? topic.nameEn : topic.nameHi;
            const visual = currentLang === 'en' ? topic.visualEn : topic.visualHi;
            const basic = currentLang === 'en' ? topic.basicFormulaEn : topic.basicFormulaHi;
            const explanation = currentLang === 'en' ? topic.formulaExplanationEn : topic.formulaExplanationHi;
            const advanced = currentLang === 'en' ? topic.advancedFormulaEn : topic.advancedFormulaHi;
            const practiceTitle = currentLang === 'en' ? 'Practice Questions' : 'अभ्यास प्रश्न';
            const pyqTitle = currentLang === 'en' ? 'Previous Year Questions (PYQs)' : 'पिछले वर्ष के प्रश्न (PYQs)';
            const basicTitle = currentLang === 'en' ? 'Basic Formula' : 'बेसिक सूत्र';
            const advTitle = currentLang === 'en' ? 'Advanced Formula / CGL Trick' : 'एडवांस्ड सूत्र / CGL ट्रिक';
            const page = pageStarts[i] || i + 1;

            return `
                <div class="page-divider" data-page="${page}">
                    <hr><span class="page-label">Page ${page} of ${TOTAL_PAGES}</span><hr>
                </div>
                <section class="formula-card" id="topic-${i + 1}" data-topic="${i}">
                    <div class="topic-name">${i + 1}. ${esc(name)}</div>
                    <span class="topic-badge">${currentLang === 'en' ? 'CGL Level • Concept + Formula + Practice' : 'CGL स्तर • अवधारणा + सूत्र + अभ्यास'}</span>

                    <div class="visual-box">
                        <div class="vis-icon"><i class="fas fa-lightbulb"></i></div>
                        <div class="vis-text">${visual}</div>
                    </div>

                    <div class="formulas-box">
                        <div class="formula-title"><i class="fas fa-square-root-alt"></i> ${basicTitle}</div>
                        ${basic}
                    </div>

                    <div class="formula-explanation">
                        <span class="ex-title"><i class="fas fa-info-circle"></i> ${currentLang === 'en' ? 'Concept:' : 'अवधारणा:'}</span>
                        ${explanation}
                    </div>

                    <div class="formulas-box">
                        <div class="formula-title"><i class="fas fa-bolt"></i> ${advTitle}</div>
                        ${advanced}
                    </div>

                    <div class="section-heading"><i class="fas fa-pencil-alt"></i> ${practiceTitle}</div>
                    ${topic.practice.map((q, qi) => renderQuestion(q, qi)).join('')}

                    <div class="section-heading"><i class="fas fa-history"></i> ${pyqTitle}</div>
                    ${topic.pyqs.map((q, qi) => renderQuestion(q, qi, true)).join('')}
                </section>
            `;
        }

        function renderAll() {
            renderIndex();
            content.innerHTML = TOPICS_DATA.map(renderTopic).join('');
            document.querySelectorAll('#langToggle button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLang);
            });
            headerSub.textContent = currentLang === 'en'
                ? '9 Topics • 15 Pages • Basic→Advanced Formulas • PYQs • Bilingual'
                : '9 विषय • 15 पेज • बेसिक→एडवांस्ड सूत्र • PYQs • द्विभाषी';
            indexTitle.textContent = currentLang === 'en'
                ? '📑 All 9 Profit & Loss Topics Covered'
                : '📑 Profit & Loss के सभी 9 विषय';
            footerText.textContent = currentLang === 'en'
                ? '⚡ Practice makes perfect. SSC CGL / Banking Level.'
                : '⚡ अभ्यास से ही पूर्णता आती है। SSC CGL / Banking Level.';
            updateProgress();
        }

        function toggleAnswer(id, button) {
            const box = document.getElementById(id);
            if (!box) return;
            box.classList.toggle('show');
            const visible = box.classList.contains('show');
            button.innerHTML = visible
                ? `<i class="fas fa-eye-slash"></i> ${currentLang === 'en' ? 'Hide Answer' : 'उत्तर छिपाएँ'}`
                : `<i class="fas fa-eye"></i> ${currentLang === 'en' ? 'Show Answer & Explanation' : 'उत्तर एवं व्याख्या देखें'}`;
        }
        window.toggleAnswer = toggleAnswer;

        function updateProgress() {
            const max = Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
            const percent = Math.min(100, Math.max(0, (window.scrollY / max) * 100));
            progressFill.style.width = percent.toFixed(1) + '%';
            const currentPage = Math.min(TOTAL_PAGES, Math.max(1, Math.ceil((percent / 100) * TOTAL_PAGES)));
            pageIndicator.textContent = currentLang === 'en'
                ? `Page ${currentPage} of ${TOTAL_PAGES}`
                : `पेज ${currentPage} / ${TOTAL_PAGES}`;
        }

        langButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                currentLang = btn.dataset.lang;
                localStorage.setItem('plLang', currentLang);
                renderAll();
            });
        });

        window.addEventListener('scroll', updateProgress, { passive: true });
        window.addEventListener('resize', updateProgress);

        renderAll();
    </script>
</body>
</html>
